 La photo rejoint la série de l'objet suivi et la comparaison au poste fixe ; elle ne laisse aucune copie en clair sur le téléphone."}, {"q": "Comment corriger un acte déjà signé ?", "r": "Un acte signé ne se modifie jamais : on ajoute une correction motivée, relue par les règles de la fiche. Courbes, bilans et cotation l'appliquent ; la cotation est recalculée et passe en file de contrôle."}, {"q": "Que faire face à un événement grave au domicile ?", "r": "Déclarez un événement critique depuis le menu du passage. La déclaration est immuable ; elle propose une notification au médecin et une transmission ciblée. Une notification proposée n'est jamais envoyée seule : un infirmier l'envoie ou l'écarte avec un motif, au poste fixe ou au terminal."}, {"q": "Pourquoi ma consultation est-elle « tracée, non facturante » ?", "r": "Parce que son motif n'est pas encore en vigueur : la CIA attend l'avis de la HAS, la CIB s'applique au 1er juillet 2027, le bilan annuel de plaie au 1er janvier 2027. Le soin est tracé, rien n'est facturé avant la date d'effet."}, {"q": "Comment saisir une ordonnance ?", "r": "Photographiez-la ou numérisez-la : elle est gardée telle quelle. La lecture automatique ne produit qu'une proposition (prescripteur, date, durée, actes) ; vous validez ou rejetez. Rien n'est créé sans vous. Une ordonnance lue au nom d'un autre patient est refusée."}, {"q": "La prescription a changé : comment le voir ?", "r": "Un bandeau « avant / après » s'affiche dans la fiche, puis un filigrane, jusqu'au premier soin réalisé sous la nouvelle valeur. Depuis le 22 octobre, un changement d'horaire est signalé lui aussi."}, {"q": "Où trouver l'aide « Comment faire ? »", "r": "Sous chaque fiche : gestes, vidéos, documents et questions du cabinet, publiés par un infirmier référent. Les contenus actuels sont des exemples « à valider par un référent »."}, {"q": "Comment être prévenue quand une collègue me cite ?", "r": "Une collègue tape « @ » et votre nom dans une transmission : vous êtes notifiée et pouvez la lire, même sans en être destinataire. Au poste fixe, filtre « Me mentionnant » ; au terminal, une pastille et une notification locale."}]}]}, {"id": "faq-aide-soignante", "titre": "Aide-soignante", "resume": "Ce que l'aide-soignante signe, ce qu'elle ne voit pas, comment elle signale.", "mots_cles": ["aide-soignante", "AS", "nursing", "signalement", "transmission", "BSI"], "blocs": [{"type": "faq", "items": [{"q": "Quelles fiches puis-je signer ?", "r": "La fiche Nursing, et la fiche Paramètres vitaux quand le cabinet exerce en structure. Toutes les autres fiches sont signées par un infirmier."}, {"q": "Qu'est-ce que je ne vois pas, et pourquoi ?", "r": "Par principe de moindre accès : la cotation et la facturation, le contenu des consultations, le texte des signalements, les prescriptions infirmières et les documents produits. Au terminal, les soins que vous ne pouvez pas signer ne vous sont pas proposés. « À traiter » ne montre que vos propres tâches."}, {"q": "Je constate une anomalie : que faire ?", "r": "Faites un signalement à l'infirmier : c'est lui qui décide de la suite. Une rougeur qui ne blanchit pas ou une phlyctène relevée en nursing rend le signalement obligatoire."}, {"q": "Puis-je écrire une transmission ciblée ?", "r": "Oui, depuis le 22 octobre, dans des limites : ni entretien infirmier, ni traitement d'une interpellation, ni requalification. Au terminal, vous pouvez demander l'avis d'une infirmière. Faut-il une relecture par l'infirmier référent ? C'est la question Q-88."}, {"q": "Le forfait de dépendance est-il compté deux fois si l'infirmier passe aussi ?", "r": "Non : le forfait journalier (BSA, BSB, BSC) est compté une fois par patient et par jour, même quand infirmier et aide-soignante passent."}, {"q": "Comment me connecter ?", "r": "En démonstration, en touchant votre nom dans la liste des profils, sans carte. L'authentification réelle de l'aide-soignante est une décision ouverte (D-02)."}]}]}, {"id": "faq-remplacant", "titre": "Remplaçant", "resume": "Portée du remplacement, fin de période, facturation de ses actes.", "mots_cles": ["remplaçant", "remplacement", "portée", "fin de remplacement", "facturation", "D-10"], "blocs": [{"type": "faq", "items": [{"q": "Que puis-je faire pendant mon remplacement ?", "r": "Les soins d'un infirmier, dans la portée de votre habilitation : sa période (toujours une date de fin), ses tournées et/ou ses patients, jugés à la date de chaque geste. Avec une portée restreinte, les vues de tout le cabinet vous sont fermées ; depuis le 21 octobre, cette portée s'applique aussi à la tournée du jour, aux prélèvements et à la messagerie."}, {"q": "Que se passe-t-il à la fin de mon remplacement ?", "r": "Pendant 120 minutes, seul l'envoi de la file du terminal reste ouvert, pour les gestes datés de la période ; ensuite toutes vos sessions sont révoquées. La file restante est gardée pour le cabinet : un nouvel enrôlement est nécessaire pour l'envoyer."}, {"q": "Puis-je facturer mes actes ?", "r": "Pas en l'état : le remplaçant n'a pas le droit de sécuriser une FSE, et le poste fixe en affiche le motif. Qui émet la FSE des actes du remplaçant est la décision D-10."}, {"q": "Puis-je émettre un code de terminal ou valider une saisie différée ?", "r": "Non : l'émission de codes relève de la gestion des habilitations, la validation des saisies hors délai des titulaires et responsables."}, {"q": "Le cabinet peut-il me proposer pour couvrir une absence ?", "r": "Oui, si votre habilitation est en cours : le planning propose jusqu'à quatre intervenants du même rôle, les disponibles d'abord, les titulaires avant les remplaçants."}]}]}, {"id": "faq-cabinet", "titre": "Gérer le cabinet", "resume": "Terminaux, droits, tournées, absences, saisies différées, simulations, reprise de dossiers.", "mots_cles": ["cabinet", "titulaire", "administration", "enrôlement", "habilitations", "tournées", "absences", "reprise de dossiers", "simulations"], "blocs": [{"type": "faq", "items": [{"q": "Comment enrôler un nouveau terminal ?", "r": "Au poste fixe, page « Terminaux » : émettez un code. Il compte 10 caractères, sert une fois et vaut 10 minutes. Saisissez-le sur le terminal, à l'écran d'enrôlement ; l'infirmier se connecte ensuite. Il faut le droit de gérer les habilitations ; un remplaçant ne peut pas émettre de code."}, {"q": "Comment donner ou retirer des droits ?", "r": "Page « Équipe » : habilitations (administration, responsabilité, remplacement), formations, révocation. Les droits suivent la matrice d'habilitations, seule juge côté serveur. Qui peut retirer une responsabilité ou l'administration reste à trancher (Q-65)."}, {"q": "Comment attribuer et réorganiser les tournées ?", "r": "Page « Tournées » : elle s'ouvre sur « Itinéraire et carte » et propose aussi la planification du jour en colonnes, une par intervenant, avec sa charge. Une attribution qui recouvre une absence est refusée ; une formation manquante est signalée avant d'enregistrer. Les intervenants peuvent échanger une tournée du même rôle."}, {"q": "Un intervenant est absent : comment couvrir ses tournées ?", "r": "Chacun déclare ses indisponibilités (congé, maladie, formation), ponctuelles ou récurrentes. Le planning signale les tournées à couvrir et propose un remplacement en un clic. Le motif n'est lu que par l'intéressé et par qui organise les tournées."}, {"q": "Qui valide les saisies différées ?", "r": "Un infirmier titulaire ou responsable qui n'est pas le signataire, au poste fixe seulement, page « Saisies différées ». Un refus est motivé et écarte la cotation de l'acte."}, {"q": "Que montre la page Simulations, et qui peut provoquer une panne ?", "r": "« Paramètres », « Simulations » liste les doublures du mode démonstration (services, référentiels, règles provisoires), chacune avec ce qu'elle remplace. L'administration du cabinet y choisit une panne ou une option ; le réglage vaut pour toute l'instance et reste après un redémarrage."}, {"q": "Comment reprendre les dossiers d'un autre logiciel ?", "r": "Par « Paramètres », « Reprise de dossiers », au format pivot de démonstration : un aperçu à blanc (rien n'est écrit, erreurs et ressemblances signalées), puis la reprise du même fichier. Les identités reprises restent provisoires jusqu'à leur qualification par l'INSi. Les formats des logiciels du marché ne sont pas arrêtés (D-13)."}, {"q": "À quoi servent la zone d'intervention et les prérequis de passage ?", "r": "La zone d'intervention est un cercle de 200 m à 50 km autour du point de départ des tournées : un domicile hors zone est signalé, sans rien bloquer. Les prérequis (à jeun, ordonnance, matériel, présence d'un aidant…) se règlent par soin dans « Paramètres » ; la liste livrée est une proposition « à valider par un référent IDE » (Q-69)."}, {"q": "Que voit l'administration du cabinet ?", "r": "L'organisation : tournées, planning, équipe, habilitations, terminaux, accès QR, journal des accès, simulations. Depuis le 21 octobre, elle n'a plus accès au dossier clinique : elle ne lit que l'identité des patients. Le périmètre exact est à confirmer (Q-85)."}, {"q": "Comment le cabinet suit-il ce qui reste à faire ?", "r": "Le tableau de bord réunit, depuis le 22 octobre, les soins à compléter, les résultats attendus, les pièces manquantes (horaires prescrits sans ordonnance jointe, séjour HAD sans lettre de mission), le BSI à renouveler et les tests tuberculiniques sans lecture, filtrables par tournée et exportables en CSV."}]}]}, {"id": "faq-facturation", "titre": "Cotation et facturation de démonstration", "resume": "Ce que fait la doublure de cotation, la file de contrôle, les lots et rejets, le banc de cotation, l'avenant 11.", "mots_cles": ["cotation", "démonstration", "moteur NGAP", "file de contrôle", "FSE", "lot", "rejet", "banc", "avenant 11"], "blocs": [{"type": "note", "ton": "attention", "texte": "Toute cotation affichée dans TabSanté est étiquetée « Démonstration » : le moteur actuel est une doublure, pas le moteur NGAP réel."}, {"type": "faq", "items": [{"q": "Comment fonctionne la facturation aujourd'hui ?", "r": "De bout en bout, mais en démonstration : cotation par la doublure, reconfirmation, file de contrôle, FSE créée par l'infirmier qui a réalisé les actes et sécurisée, mise en lot avec contrôle de cohérence, télétransmission et retours, le tout sur un adaptateur simulé."}, {"q": "Que règle-t-on dans la file de contrôle ?", "r": "Les cotations à arbitrer avant la mise en lot : cumul, majoration, dépassement de fréquence, divergence entre cotation provisoire et reconfirmée, correction, acte fait en partie. Chacune se confirme ou s'écarte avec un motif. Les réglages et le délai de 7 jours sont provisoires (D-05)."}, {"q": "Je vois « cotation provisoire non estimée hors connexion » : est-ce une erreur ?", "r": "Non. Hors connexion, le terminal n'estime la cotation que lorsque l'acte correspond exactement au passage prévu ; sinon le cabinet la calcule à l'envoi."}, {"q": "Un lot est refusé à la constitution : pourquoi ?", "r": "Le contrôle de cohérence a trouvé des anomalies (acte au-delà de sa fréquence, sur prescription échue, saisie différée non validée…). La plupart se forcent avec un motif ; les actes non signés et les saisies différées non validées, jamais."}, {"q": "Une FSE est rejetée : que faire ?", "r": "Elle apparaît dans l'onglet « Rejets » avec son motif : refacturez ou abandonnez. En démonstration, un patient sans NIR ou dont le nom contient « rejet » provoque un rejet."}, {"q": "Qu'est-ce que le banc de cotation ?", "r": "Un banc d'essai qui rejoue des cas écrits contre la doublure : le cahier de cas de facturation infirmiers du CNDA (19 conformes au centime, aucun écart, les autres bloqués ou en divergence documentée), des cas tirés de la NGAP et l'oracle du titre XVI (113 conformes sur 120). Ce n'est jamais un agrément : il servira à mesurer le moteur réel."}, {"q": "Puis-je comprendre une cotation ligne par ligne ?", "r": "Oui. Le reçu de cotation montre le passage entier, la règle appliquée à chaque ligne et un « Et si… » (heure, dimanche, férié, horaire prescrit) ; l'onglet « Simuler une cotation » rejoue un passage fictif sans rien écrire."}, {"q": "Les montants de l'avenant 11 sont-ils appliqués ?", "r": "Non. La plateforme tient les faits datés que le moteur lira (motifs à date d'effet, plaie en accès direct, lieu du soin de l'enfant, soin régulé, dépistage, ALD, score SEGA) ; les tarifs datés sont des valeurs de démonstration. Sur les 15 mesures suivies : 10 faites, 2 simulées, 2 relevant du moteur seul, 1 à confirmer."}]}]}, {"id": "faq-patients", "titre": "Patients : décès, droits, export, photos", "resume": "Déclarer un décès, répondre à une demande du patient, exporter un dossier, gérer photos et partage.", "mots_cles": ["décès", "droits des patients", "RGPD", "export", "FHIR", "portabilité", "photo", "photo de l'entrée", "consentement", "QR"], "blocs": [{"type": "faq", "items": [{"q": "Comment déclarer le décès d'un patient ?", "r": "Au poste fixe, dans l'identité du patient, « Déclarer le décès » (réservé à l'infirmier) : date, source, commentaire. Au jour du décès, fréquences et passages dus s'arrêtent, heures fixes et objets suivis sont clos, parcours et rappels se terminent, demandes de renouvellement et accès QR tombent ; les soignants de ses tournées sont notifiés. Rien du dossier n'est effacé."}, {"q": "J'ai déclaré un décès sur le mauvais dossier : que faire ?", "r": "La déclaration s'annule avec un motif, tracé. Ce que le décès a arrêté le reste : les soins se reprogramment un à un. Aucun passage signé ne peut être daté après un décès, et un décès ne peut pas être daté avant un passage signé."}, {"q": "Un patient demande l'accès à son dossier ou sa rectification : comment répondre ?", "r": "Ouvrez « Droits du patient » dans le dossier administratif (infirmier) : inscrivez la demande (accès, rectification, portabilité, opposition, limitation, effacement) le jour de sa réception, avec son canal. Délais proposés, à valider par le DPO : 8 jours pour l'accès au dossier, un mois pour les autres droits. Une rectification ne remplace rien : nouvelle version, rectification ou correction motivée."}, {"q": "Comment exporter le dossier d'un patient ?", "r": "L'infirmier exporte le dossier en FHIR R4 (patient, actes signés, observations, documents, rencontres, intervenants), pour l'accès ou la portabilité ; l'export est journalisé. Photos et PDF se joignent par leurs fichiers. La remise se fait de façon sécurisée, jamais par courriel non sécurisé."}, {"q": "Un patient demande la limitation du traitement : que se passe-t-il ?", "r": "Inscrire une demande de limitation pose un indicateur : tant qu'il est posé, le dossier ne sort plus par les voies de partage (export FHIR, envoi MSSanté ou DMP, accès QR). Les soins continuent : le dossier se lit, se complète et se signe."}, {"q": "Le patient peut-il obtenir l'effacement de son dossier ?", "r": "Non pendant la durée de conservation légale : le refus est motivé et inscrit. Au terme, décision du DPO, puis suppression par un script d'exploitation après archive. Les durées sont provisoires (D-06)."}, {"q": "À quoi sert la photo de l'entrée du domicile ?", "r": "À trouver la bonne porte du premier coup. Une photo par patient, prise au terminal ou déposée au poste fixe, visible dans « Accès au domicile » et « Avant d'arriver ». Chiffrée, lue par les seuls soignants du cabinet, elle ne sort jamais : ni DMP, ni export FHIR, ni portail externe."}, {"q": "Comment donner accès au dossier à un médecin ou un pharmacien ?", "r": "Pré-enregistrez le professionnel (RPPS), recueillez le consentement du patient (droits, périmètre, date de fin), puis créez un accès QR : affiché une fois, 4 heures par défaut, 72 heures au plus, jamais au-delà du consentement. Le professionnel s'identifie en plus par Pro Santé Connect (simulé aujourd'hui) et ne modifie jamais le dossier."}]}]}]}, {"id": "glossaire", "titre": "Glossaire", "public": "tous", "pages": [{"id": "glossaire-soins", "titre": "Soins et métier", "resume": "Les mots de l'exercice infirmier à domicile, tels que TabSanté les emploie.", "mots_cles": ["métier", "soins", "fiches", "sigles"], "blocs": [{"type": "glossaire", "items": [{"terme": "IDEL", "definition": "Infirmier diplômé d'État libéral : il exerce en libéral, seul ou en cabinet, et soigne au domicile des patients. Premier utilisateur de TabSanté."}, {"terme": "IDE", "definition": "Infirmier diplômé d'État. Dans TabSanté, le rôle « infirmier » d'un intervenant : titulaire, en structure, responsable ou remplaçant."}, {"terme": "IDE titulaire", "definition": "Infirmier qui exerce en son nom et facture ses actes ; il a tous les droits de soin et d'organisation du cabinet."}, {"terme": "IDE en structure", "definition": "Infirmier qui exerce au sein d'une société : la structure émet les feuilles de soins."}, {"terme": "IDE responsable", "definition": "Infirmier qui porte la responsabilité clinique du cabinet ; mêmes droits d'administration que le titulaire."}, {"terme": "Remplaçant", "definition": "Infirmier habilité pour une période donnée, sur des tournées et/ou des patients désignés, à la place d'un titulaire. Chaque geste est jugé à sa date."}, {"terme": "AS (aide-soignante, aide-soignant)", "definition": "Intervenant qui réalise les soins d'hygiène et de confort (nursing), signe ses propres actes, signale à l'infirmier et ne facture jamais."}, {"terme": "Rôle propre", "definition": "Soins que l'infirmier décide et réalise sans prescription médicale."}, {"terme": "Accès direct", "definition": "Prise en charge par l'infirmier sans prescription préalable ; l'avenant 11 l'ouvre aux plaies non chirurgicales au 1er janvier 2027."}, {"terme": "PCA", "definition": "Analgésie contrôlée par le patient : pompe qui délivre un antalgique en continu avec des bolus déclenchés par le patient, parfois associée à une sédation (fiche 13-14)."}, {"terme": "PSE", "definition": "Pousse-seringue électrique : pompe qui administre un produit à débit réglé ; une seringue contient un seul produit (fiche 16)."}, {"terme": "ALR", "definition": "Analgésie locorégionale : antalgie par un cathéter placé près d'un nerf ou de la moelle ; le neuraxial exige un accord préalable (fiche 23)."}, {"terme": "DPCA, DPA", "definition": "Dialyse péritonéale continue ambulatoire (manuelle, par poches) ou automatisée (par cycleur) (fiche 17)."}, {"terme": "Nutrition entérale", "definition": "Alimentation par sonde dans le tube digestif (fiche 8). La nutrition parentérale, par voie veineuse, relève de la fiche 4."}, {"terme": "UGD", "definition": "Uro-génito-digestif : sondes urinaires, cystostomie, lavements, autosondage (fiche 20)."}, {"terme": "VVP, PICC, chambre implantable", "definition": "Voies veineuses : cathéter court périphérique, cathéter central inséré par voie périphérique, boîtier sous-cutané piqué à l'aiguille de Huber (fiche 4)."}, {"terme": "Redon", "definition": "Drain aspiratif posé après une chirurgie, suivi dans la fiche Pansements."}, {"terme": "AVK", "definition": "Antivitamines K : anticoagulants oraux surveillés par l'INR ; bloc AVK de la fiche 6 (l'ancienne fiche 7)."}, {"terme": "INR", "definition": "Examen de sang qui mesure l'effet des AVK."}, {"terme": "HbA1c", "definition": "Hémoglobine glyquée : marqueur de l'équilibre du diabète sur trois mois (fiche 10)."}, {"terme": "HNF, HBPM", "definition": "Héparine non fractionnée, héparine de bas poids moléculaire : anticoagulants injectables (fiche 11)."}, {"terme": "EN", "definition": "Échelle numérique de la douleur, de 0 à 10 ; l'une des cinq échelles proposées, celle du dossier d'abord."}, {"terme": "RASS", "definition": "Échelle d'agitation et de sédation de Richmond ; une cible est exigée pour une sédation."}, {"terme": "SEGA", "definition": "Grille d'évaluation de la fragilité de la personne âgée ; son score conditionne la majoration MSG de l'avenant 11."}, {"terme": "Escarre", "definition": "Plaie de pression ; son stade (1 à 4, ou indéterminable) est obligatoire à l'ouverture."}, {"terme": "Récidive", "definition": "Nouvelle plaie sur une plaie déjà cicatrisée du même patient : elle se lie à la précédente et son rang d'épisode augmente."}, {"terme": "Épreuve de lever", "definition": "Mesures de la tension couché puis debout, à leur heure réelle, pour rechercher une hypotension orthostatique (fiche 18)."}, {"terme": "Saignée", "definition": "Prélèvement thérapeutique de sang, suivi par la ferritinémie (fiche 21)."}, {"terme": "Téléconsultation, télésoin, télé-expertise", "definition": "Médecin et patient avec l'infirmier présent ; infirmier et patient ; infirmier et médecin. Compte rendu signé, aucune vidéo conservée."}]}]}, {"id": "glossaire-assurance-maladie", "titre": "Assurance maladie, convention et facturation", "resume": "Lettres-clés, forfaits, majorations, téléservices et feuilles de soins.", "mots_cles": ["NGAP", "AMI", "AIS", "BSI", "FSE", "HAD", "SSIAD", "avenant 11", "cotation"], "blocs": [{"type": "glossaire", "items": [{"terme": "NGAP", "definition": "Nomenclature générale des actes professionnels : liste officielle des actes et de leur cotation (lettre-clé et coefficient)."}, {"terme": "Lettre-clé", "definition": "Code de la nomenclature auquel s'applique un coefficient, par exemple AMI 3."}, {"terme": "AMI", "definition": "Acte médico-infirmier : lettre-clé des actes techniques infirmiers."}, {"terme": "AMX", "definition": "Lettre-clé des actes techniques réalisés chez un patient dépendant ; la doublure la cote pour l'acte technique facturé en plus d'un forfait de dépendance."}, {"terme": "AIS", "definition": "Acte infirmier de soins : séance de soins infirmiers liée à la dépendance. Pour les patients relevant du BSI, les forfaits BSA, BSB, BSC l'ont remplacé ; la doublure de démonstration cote encore la séance AIS d'un patient dépendant hors forfait, jusqu'à son abrogation."}, {"terme": "BSI", "definition": "Bilan de soins infirmiers : évaluation de la dépendance qui ouvre droit à un forfait journalier. La fiche Nursing l'alimente ; le tableau de bord signale un BSI à renouveler."}, {"terme": "BSA, BSB, BSC", "definition": "Forfaits journaliers de prise en charge de la dépendance (léger, intermédiaire, lourd) issus du BSI ; comptés une fois par patient et par jour."}, {"terme": "Actes A, B, C, D", "definition": "Actes liés aux médicaments (NGAP article 10) : administration, traitement oral psychiatrique, surveillance à l'instauration, accompagnement de la prise (fiche 6)."}, {"terme": "CIA", "definition": "Consultation infirmière d'un patient diabétique de type 2 nouvellement insuliné ; tracée, non facturante tant que sa date d'effet n'est pas connue."}, {"terme": "CIB", "definition": "Consultation infirmière de suivi après Mon Bilan Prévention ; effet au 1er juillet 2027 sous réserve de la HAS."}, {"terme": "RDI", "definition": "Bilan de prévention réalisé par l'infirmier, sans prescription, par tranche d'âge (18-25, 45-50, 60-65, 70-75 ans)."}, {"terme": "MSG", "definition": "Majoration de l'avenant 11 liée à un forfait BSC et à un score SEGA, effet au 1er janvier 2028."}, {"terme": "RKD", "definition": "Dépistage du cancer colorectal par l'infirmier : remise du kit, puis test réalisé."}, {"terme": "MIR", "definition": "Rémunération d'un soin non programmé régulé par le SAS ou la PDSA."}, {"terme": "MSD", "definition": "Majoration du diabète de l'enfant de moins de 16 ans soigné à l'école ou en périscolaire."}, {"terme": "MAU", "definition": "Majoration d'acte unique : due quand un seul petit acte AMI est réalisé au passage, jamais sous forfait de dépendance (cotée par la doublure)."}, {"terme": "MCI", "definition": "Majoration de coordination infirmière, pour un pansement lourd et complexe ou des soins palliatifs à domicile (cotée par la doublure)."}, {"terme": "IFD, IFI", "definition": "Indemnités forfaitaires de déplacement ; l'IFI s'applique à un patient sous forfait de dépendance. Par défaut, la règle provisoire « déplacements » transmet les faits sans coter."}, {"terme": "IK", "definition": "Indemnité kilométrique, due hors de l'agglomération du cabinet, avec franchise et abattement journalier."}, {"terme": "SAS, PDSA", "definition": "Service d'accès aux soins ; permanence des soins ambulatoires : origines d'un soin régulé."}, {"terme": "ALD", "definition": "Affection de longue durée, prise en charge à 100 % ; portée par la pathologie du dossier (liste de démonstration)."}, {"terme": "HAD", "definition": "Hospitalisation à domicile : elle change le payeur, pas les règles de soin. Un séjour HAD daté bloque FSE et lot ; la mention « HAD » de l'en-tête vient du seul séjour déclaré."}, {"terme": "SSIAD", "definition": "Service de soins infirmiers à domicile, qui emploie infirmiers et aides-soignants ; cité par le CDC comme autre régime possible, sans traitement spécifique dans le code."}, {"terme": "Accord préalable", "definition": "Accord de la caisse exigé avant certains soins ; sans décision enregistrée, l'accord reste « demandé », jamais accepté implicitement."}, {"terme": "Art. 5 ter", "definition": "Suivi infirmier après une décompensation d'insuffisance cardiaque ou une exacerbation de BPCO, en séances encadrées."}, {"terme": "RAAC (art. 7)", "definition": "Réhabilitation améliorée après chirurgie : surveillance postopératoire au domicile, de J0 à J+6."}, {"terme": "Mon Bilan Prévention, PPP", "definition": "Bilan de prévention national aux âges clés, qui aboutit à un plan personnalisé de prévention (PPP), point de départ de la CIB."}, {"terme": "Avenant 11", "definition": "Avenant à la convention nationale des infirmiers : calendrier de mesures 2026-2029, suivi en 15 mesures."}, {"terme": "FSE", "definition": "Feuille de soins électronique : facture d'un patient, sécurisée par la carte CPS et la carte Vitale, puis télétransmise en lot. Simulée aujourd'hui."}, {"terme": "Lot", "definition": "Ensemble de FSE télétransmises ensemble, après un contrôle de cohérence."}, {"terme": "NOEMIE", "definition": "Norme des retours de l'Assurance maladie (paiements, rejets) ; simulée."}, {"terme": "DRE, tiers payant", "definition": "Demande de remboursement électronique à la complémentaire ; dispense d'avance de frais. Simulés."}, {"terme": "SCOR", "definition": "Dématérialisation des pièces justificatives jointes à la facturation ; non construite, elle dépend du composant SESAM-Vitale."}, {"terme": "ADRi", "definition": "Téléservice de consultation des droits du patient sans sa carte Vitale ; appelé d'office avant chaque FSE, jamais bloquant. Simulé."}, {"terme": "IDB", "definition": "Téléservice d'identification du bénéficiaire quand la carte Vitale est absente ou illisible. Simulé."}, {"terme": "Vitale, ApCV", "definition": "Carte d'assurance maladie du patient ; application carte Vitale qui en tient lieu par un QR. Simulées."}, {"terme": "CPS", "definition": "Carte de professionnel de santé : elle authentifie le professionnel et signe ses FSE. Simulée en démonstration."}, {"terme": "GIE SESAM-Vitale, CNDA", "definition": "Organisme qui cadre les FSE ; centre de l'Assurance maladie qui homologue les logiciels. Agrément à obtenir."}]}]}, {"id": "glossaire-sante-numerique", "titre": "Identité et santé numérique", "resume": "Identité du patient, identité du professionnel, échanges et terminologies.", "mots_cles": ["INS", "INSi", "PSC", "DMP", "MSSanté", "FHIR", "RPPS"], "blocs": [{"type": "glossaire", "items": [{"terme": "INS", "definition": "Identité nationale de santé du patient : « provisoire » tant qu'elle n'est pas qualifiée ; qualifiée après interrogation de l'INSi et contrôle de la pièce d'identité."}, {"terme": "INSi", "definition": "Téléservice qui retrouve et vérifie l'INS ; appelé d'office à la création du patient, jamais bloquant. Simulé."}, {"terme": "RNIV", "definition": "Référentiel national d'identitovigilance : règles de qualification de l'identité, dont le contrôle d'une pièce d'identité."}, {"terme": "NIR", "definition": "Numéro d'inscription au répertoire (numéro de sécurité sociale)."}, {"terme": "RPPS", "definition": "Identifiant à 11 chiffres d'un professionnel de santé."}, {"terme": "PSC (Pro Santé Connect)", "definition": "Fournisseur d'identité national des professionnels de santé (e-CPS) ; exigé avec le QR pour le portail externe. Simulé."}, {"terme": "DMP (Mon espace santé)", "definition": "Dossier médical partagé du patient. Le versement est refusé si l'INS n'est pas qualifiée ; l'opposition du patient est respectée. Simulé."}, {"terme": "MSSanté", "definition": "Messagerie sécurisée de santé, réservée aux professionnels ; simulée, rien n'est envoyé."}, {"terme": "FHIR", "definition": "Standard d'échange de données de santé (HL7) ; TabSanté exporte le dossier en FHIR R4."}, {"terme": "LOINC, SNOMED CT", "definition": "Terminologies internationales des observations et des termes cliniques, vers lesquelles les listes internes sont codées (composant C16)."}, {"terme": "NANDA-I, NOC, NIC", "definition": "Classifications des diagnostics, des résultats et des interventions infirmiers ; NANDA-I attend une licence, NOC est préparé, NIC n'est pas prévu."}, {"terme": "Ordonnance numérique", "definition": "Service national de prescription électronique ; simulé. En attendant, l'ordonnance photographiée est lue par une lecture automatique locale puis validée par l'infirmier."}, {"terme": "Ségur", "definition": "Programme national de référencement des logiciels de santé ; six fonctions attendues d'un logiciel de cabinet."}, {"terme": "Keycloak", "definition": "Serveur d'identité installé comme courtier entre TabSanté, la carte CPS et Pro Santé Connect : il vérifie qui se connecte, TabSanté garde ensuite sa propre session. Pro Santé Connect y est simulé en attendant la convention avec l'ANS."}]}]}, {"id": "glossaire-securite", "titre": "Sécurité, preuve et conformité", "resume": "Hébergement, protection des données, journaux, sessions et droits.", "mots_cles": ["HDS", "RGPD", "journal", "audit", "empreinte", "habilitation"], "blocs": [{"type": "glossaire", "items": [{"terme": "HDS", "definition": "Hébergeur de données de santé : certification obligatoire de l'hébergeur. Non choisi à ce jour."}, {"terme": "RGPD", "definition": "Règlement général sur la protection des données ; les données de santé sont sensibles."}, {"terme": "AIPD", "definition": "Analyse d'impact relative à la protection des données ; un brouillon technique existe, à conduire par le DPO."}, {"terme": "DPO", "definition": "Délégué à la protection des données, à désigner avant production."}, {"terme": "CNIL", "definition": "Autorité française de protection des données."}, {"terme": "Journal d'audit chaîné", "definition": "Registre immuable de ce qui change : chaque entrée porte l'empreinte de la précédente. Il ne garde aucune copie clinique : références, champs changés, empreintes."}, {"terme": "Ancrage", "definition": "Copie régulière de la tête de la chaîne d'audit hors de la base, pour prouver qu'elle n'a pas été réécrite."}, {"terme": "Journal des accès", "definition": "Trace de chaque lecture nominative (un patient par ligne), des rafraîchissements de session et des refus d'accès, dans sa propre chaîne ; purgée après 365 jours (provisoire), jamais avant 180."}, {"terme": "Empreinte", "definition": "Résumé cryptographique qui change si un seul caractère change ; le reçu du terminal en montre les 12 premiers caractères."}, {"terme": "Immuabilité", "definition": "Une donnée signée ne se modifie ni ne s'efface ; elle se corrige par un ajout motivé."}, {"terme": "Rôle applicatif", "definition": "Compte de base de données à moindre privilège avec lequel l'API se connecte : il ne peut pas réécrire les preuves."}, {"terme": "Session", "definition": "Période de connexion d'un intervenant ; jeton d'accès court, renouvelé, session de 30 jours au plus, révocable."}, {"terme": "Enrôlement", "definition": "Rattachement d'un terminal au cabinet par un code à usage unique émis au poste fixe."}, {"terme": "Révocation", "definition": "Retrait immédiat d'un droit, d'une session ou d'un terminal."}, {"terme": "Verrou de l'application", "definition": "Code à 6 chiffres ou empreinte digitale qui protège le terminal."}, {"terme": "Mode kiosque", "definition": "Terminal Android verrouillé sur TabSanté ; prévu, non éprouvé sur appareil."}, {"terme": "Limitation du traitement", "definition": "Droit du patient (RGPD) : tant qu'elle est posée, le dossier ne sort plus par les voies de partage, mais les soins continuent."}, {"terme": "Habilitation", "definition": "Droit accordé à un intervenant (administration, responsabilité, remplacement) ; la matrice HAB-01 à HAB-34 dit qui peut lire, écrire, signer, valider ou administrer."}]}]}, {"id": "glossaire-application", "titre": "Les mots de l'application", "resume": "Écrans, objets et mécanismes propres à TabSanté.", "mots_cles": ["terminal", "poste fixe", "précharge", "transmission", "cotation", "tournée"], "blocs": [{"type": "glossaire", "items": [{"terme": "Poste fixe", "definition": "L'application web du cabinet, utilisée au bureau."}, {"terme": "Terminal", "definition": "L'application du soignant au domicile, qui fonctionne sans réseau."}, {"terme": "Précharge", "definition": "Tout ce que le terminal télécharge pour travailler sans réseau pendant la tournée."}, {"terme": "Synchronisation", "definition": "Envoi de la file d'opérations du terminal au serveur, toutes les 20 secondes et après chaque signature ; rejouable sans doublon."}, {"terme": "Envois", "definition": "Onglet du terminal qui montre la file d'envoi : à corriger d'abord, puis en attente."}, {"terme": "À corriger", "definition": "État d'un envoi refusé par le serveur : il reste dans la file avec son motif."}, {"terme": "Liaisons", "definition": "Onglet du terminal des transmissions et des notifications."}, {"terme": "Brouillon", "definition": "Saisie en cours enregistrée à chaque appui, chiffrée, effacée à la signature."}, {"terme": "Brouillon partagé", "definition": "Brouillon d'une sous-fiche de la fiche 24 commun aux infirmiers du cabinet ; en cas de conflit, « Garder le mien » ou « Reprendre le leur »."}, {"terme": "Saisie différée", "definition": "Acte saisi plus de 120 minutes après sa réalisation (seuil provisoire) : motif obligatoire et validation au poste fixe par un autre infirmier."}, {"terme": "Signature maintenue", "definition": "Geste de signature du terminal : maintenir le bouton environ une seconde."}, {"terme": "Reçu", "definition": "Écran qui suit la signature : réalisé le, signé par, empreinte, état d'envoi."}, {"terme": "Dossier de preuve", "definition": "Document qui prouve un acte : données signées, horodatages, auteur, photos, intégrité de la chaîne d'audit."}, {"terme": "Fiche", "definition": "Formulaire d'un type de soin : 24 numéros, 21 fiches (7 et 9 vacants, 13 et 14 réunis)."}, {"terme": "Fiche mère, sous-fiche", "definition": "La fiche 24 n'a pas de cotation propre ; chaque motif (CIA, CIB, bilan de prévention, séance…) est une sous-fiche."}, {"terme": "Objet suivi", "definition": "La plaie, le dispositif ou l'épisode dont on suit l'évolution : l'unité de traçabilité."}, {"terme": "J0, J+n", "definition": "Jour de référence d'un suivi et nombre de jours écoulés depuis."}, {"terme": "Fréquence", "definition": "Rythme prescrit d'un soin : période, cadence, moments, horaires."}, {"terme": "Occurrence", "definition": "Soin dû à une date et un moment, engendré par une fréquence."}, {"terme": "Passage", "definition": "Présence d'un soignant au domicile à un moment donné ; un passage peut servir plusieurs soins."}, {"terme": "Moment", "definition": "Matin, midi, soir ou nuit ; la nuit va de 20 h à 6 h."}, {"terme": "Passage non réalisé", "definition": "Occurrence prévue qui n'a pas eu lieu, déclarée avec son motif."}, {"terme": "Acte partiel", "definition": "Soin fait en partie, déclaré au terminal avec ce qui n'a pas été fait ; sa cotation passe en file de contrôle."}, {"terme": "Écart horaire", "definition": "Écart entre l'heure prescrite et l'heure réelle d'un soin, calculé par le serveur et affiché, jamais bloquant."}, {"terme": "Plan de soins", "definition": "Ordonnances, actes prescrits, fréquences et protocoles en vigueur d'un patient, consultables hors connexion au terminal."}, {"terme": "Mode visite", "definition": "Déroulé du soin au terminal en liste d'étapes (prérequis puis sections), avec photo comparée à J0 ; la signature reste soumise à la fiche."}, {"terme": "Transmission ciblée", "definition": "Message clinique structuré sur un patient, visible du cabinet ; écrit par l'infirmier et, dans certaines limites, par l'aide-soignante."}, {"terme": "Transmission intra-cabinet", "definition": "Message à une personne, une tournée ou tout le cabinet, lu par ses destinataires et les personnes citées."}, {"terme": "Transmission externe", "definition": "Message reçu d'un professionnel extérieur par le portail QR."}, {"terme": "Interpellation", "definition": "Demande adressée à un infirmier, suivie jusqu'à son traitement ; une interpellation non lue alerte après quatre heures."}, {"terme": "Signalement", "definition": "Constat de l'aide-soignante adressé à l'infirmier, qui seul décide de la suite."}, {"terme": "@mention", "definition": "Citation d'un membre du cabinet dans une transmission : la personne citée est notifiée."}, {"terme": "Événement critique", "definition": "Déclaration immuable d'un événement grave ; elle propose une notification au médecin et une transmission ciblée."}, {"terme": "Notification proposée", "definition": "Avis au médecin ou à un service que le logiciel propose ; un infirmier l'envoie ou l'écarte avec motif."}, {"terme": "Portail externe, accès QR", "definition": "Espace où un professionnel extérieur lit la synthèse et dépose documents ou transmissions ; jeton court et révocable, remis par QR."}, {"terme": "Consentement", "definition": "Accord du patient à l'accès d'un professionnel désigné, borné en droits, en périmètre et en durée."}, {"terme": "Mode démonstration", "definition": "Mode du serveur qui fait tourner tout le produit sans les services nationaux, avec des doublures réglables."}, {"terme": "Doublure", "definition": "Remplaçant de démonstration d'un service tiers ou du moteur ; jamais à facturer."}, {"terme": "Registre des simulations", "definition": "Liste des doublures, référentiels de démonstration et règles provisoires, réglables dans « Paramètres », « Simulations »."}, {"terme": "Règle provisoire", "definition": "Comportement qui attend une décision : le code applique l'option prudente et permet d'essayer les autres."}, {"terme": "Moteur de cotation", "definition": "Composant qui traduit les actes signés en lignes facturables ; le moteur NGAP réel appartient à TABSANTE, une doublure le remplace aujourd'hui."}, {"terme": "Cotation provisoire, reconfirmée", "definition": "Cotation calculée à la signature, puis rejouée par le serveur avant la mise en lot ; un écart passe en file de contrôle."}, {"terme": "File de contrôle", "definition": "Liste des cotations à arbitrer (confirmer ou écarter, avec motif) avant la mise en lot."}, {"terme": "Reçu de cotation, simulateur", "definition": "Explication ligne par ligne d'une cotation avec sa règle ; rejeu d'un passage fictif sans rien écrire."}, {"terme": "Banc de cotation", "definition": "Cas écrits rejoués contre le moteur branché, avec un rapport conformes, écarts et bloqués ; jamais un agrément."}, {"terme": "Compteurs", "definition": "Décomptes qui bornent une cotation, par objet, par patient et par période ; aussi les pastilles de la barre latérale."}, {"terme": "Aperçu des passages", "definition": "Avant de valider une fréquence, la liste des passages qu'elle produira et des conflits qu'elle crée."}, {"terme": "Prérequis de passage, À préparer", "definition": "Ce que le patient prépare avant un soin (à jeun, ordonnance, matériel, aidant) et la liste de ce qui reste à confirmer."}, {"terme": "Avant d'arriver", "definition": "Panneau qui prépare l'entrée chez le prochain patient : accès au domicile, photo de l'entrée, alertes, prérequis, météo et trafic."}, {"terme": "Arrivée estimée", "definition": "Heure à laquelle le soignant devrait arriver, recalculée au fil de la tournée ; toujours approximative."}, {"terme": "Heure fixe, fenêtre horaire", "definition": "Heure de passage convenue avec un patient ; plage autour de l'heure prescrite (30 minutes, provisoire)."}, {"terme": "Préparer demain", "definition": "Revue et validation, la veille, de l'ordre de la tournée du lendemain."}, {"terme": "Zone d'intervention", "definition": "Cercle autour du point de départ des tournées ; un domicile hors zone est signalé, sans blocage."}, {"terme": "Indisponibilité, réattribution", "definition": "Absence déclarée d'un intervenant ; passage d'une tournée ou d'une occurrence à un autre intervenant."}, {"terme": "Échange de tournée", "definition": "Cession ou échange d'une tournée entre deux intervenants du même rôle."}, {"terme": "Planification en colonnes", "definition": "Vue du jour au poste fixe, une colonne par intervenant avec sa charge, pour déplacer les passages avant de valider."}, {"terme": "Terminal non synchronisé", "definition": "Alerte du poste fixe quand un téléphone se tait pendant une tournée en cours au-delà d'un seuil (2 heures par défaut)."}, {"terme": "Suggestions", "definition": "Propositions expliquées au poste fixe et au terminal, tirées du contexte (jours fériés, vacances, météo…) ; jamais exécutées sans l'utilisateur."}, {"terme": "Palette Ctrl K", "definition": "Champ de commandes du poste fixe qui atteint les pages et cherche dans tout le cabinet."}, {"terme": "Notifications locales, heures calmes", "definition": "Avis que le terminal calcule lui-même, sans réseau ; plage (21 h à 7 h par défaut) où il n'en affiche aucun."}, {"terme": "Agent de poste", "definition": "Programme prévu sur le poste fixe pour relier lecteurs de cartes et composant SESAM-Vitale ; simulé."}, {"terme": "Référentiel, date d'effet", "definition": "Liste de référence versionnée publiée par TABSANTE ; elle s'applique à partir de sa date d'effet, jamais rétroactivement."}, {"terme": "Patient provisoire", "definition": "Patient créé sans INS qualifiée ; qualifié ensuite par l'INSi, doublons proposés, jamais fusionnés en silence."}, {"terme": "Décès déclaré", "definition": "Date de décès posée par un infirmier : tout ce qui devait venir s'arrête, le dossier demeure."}, {"terme": "Reprise de dossiers", "definition": "Import des patients d'un autre logiciel : aperçu à blanc, puis reprise rejouable."}, {"terme": "Savoir-faire « Comment faire ? »", "definition": "Contenus du cabinet (gestes, vidéos, documents, questions) rattachés aux fiches, publiés par un infirmier référent."}]}]}, {"id": "glossaire-statuts", "titre": "Statuts et états", "resume": "Les mots d'état de la couverture du CDC et de l'interface.", "mots_cles": ["statuts", "fait", "simulé", "bloqué", "provisoire"], "blocs": [{"type": "glossaire", "items": [{"terme": "Fait", "definition": "Implémenté et couvert par au moins un test automatisé."}, {"terme": "Partiel", "definition": "Une partie existe ; aussi quand le serveur le tient mais qu'aucun écran ne permet de s'en servir."}, {"terme": "Simulé", "definition": "Une doublure de démonstration tient la place d'un tiers : à remplacer, jamais à facturer."}, {"terme": "Bloqué", "definition": "Dépend d'un tiers ou d'une décision."}, {"terme": "Absent", "definition": "Rien dans le code ; aucun élément du CDC n'est absent aujourd'hui."}, {"terme": "Provisoire", "definition": "Valeur branchée en attendant une décision."}, {"terme": "Moteur seul, À confirmer", "definition": "Statuts propres à l'avenant 11 : rien à construire côté plateforme ; réponse de TABSANTE nécessaire."}, {"terme": "À faire, En attente d'envoi, Signé, Transmis", "definition": "États d'un soin : dû et pas encore réalisé ; signé au terminal, pas encore reçu ; signé ; reçu par le serveur."}, {"terme": "Clôturée, Cicatrisée", "definition": "Objet suivi clos ; plaie close pour cicatrisation."}, {"terme": "Démonstration", "definition": "Étiquette posée sur toute cotation et sur les contenus fictifs."}, {"terme": "D-nn, Q-nn", "definition": "Décisions du CDC (D-01 à D-21, sans D-15) ; questions ouvertes au fondateur nées du code (Q-01 à Q-98)."}]}]}]}, {"id": "technique", "titre": "Documentation technique", "public": "technique", "pages": [{"id": "tech-architecture", "titre": "Architecture d'ensemble", "resume": "Une API FastAPI sur PostgreSQL, deux clients internes (poste fixe React, terminal Flutter), un portail externe, un site public à part et des ports vers les services externes.", "mots_cles": ["architecture", "FastAPI", "PostgreSQL", "React", "Flutter", "Astro", "ports", "adaptateurs", "agent de poste"], "blocs": [{"type": "p", "texte": "L'API est la seule à toucher la base et les fichiers. Le poste fixe et le terminal lui parlent en JSON sur HTTPS, avec un jeton d'accès. Le professionnel extérieur passe par un portail distinct, sous « /externe », avec un jeton de QR et son identité Pro Santé Connect."}, {"type": "table", "entetes": ["Partie", "Dossier", "Technologie", "Rôle"], "lignes": [["API", "backend", "Python 3.11 et plus, FastAPI, SQLAlchemy 2, Alembic, uv", "Règles, immuabilité, cotation, preuve, synchronisation, journaux chaînés"], ["Base", "docker-compose.yml", "PostgreSQL 17 (conteneur, port hôte 55432 en local)", "Seule la base est conteneurisée aujourd'hui"], ["Poste fixe", "web", "React 19, TypeScript, Vite, TanStack Query, MapLibre", "Application du cabinet, souris et clavier"], ["Terminal", "mobile", "Flutter 3.47.6 (Android ; servi en web pour la démonstration)", "Tournée hors connexion, base locale chiffrée"], ["Site public", "site", "Astro, HTML et CSS seulement", "Présentation, sans aucune donnée de santé"], ["Vérification", "scripts", "PowerShell et Bash", "verifier_tout, crochet avant envoi, recompte de la matrice"]]}, {"type": "h", "texte": "Organisation du serveur"}, {"type": "liste", "items": ["« backend/app » : le socle (configuration, base, authentification, habilitations, audit, horloge, stockage chiffré, simulation, idempotence).", "« backend/app/domaines » : un module par domaine métier (74 modules), routes, schémas et règles.", "« backend/app/fiches » : les règles serveur de chaque fiche de soin et le registre FICHES.", "« backend/app/cotation », « sesam », « teleservices » : les ports et leurs doublures de démonstration.", "« backend/app/referentiels » : les référentiels livrés en JSON, repris en versions publiées en base.", "« backend/scripts » : rôles SQL, sauvegarde, restauration, stockage, bancs de cotation et de conformité, connexion de service, mesures."]}, {"type": "h", "texte": "Ports et adaptateurs"}, {"type": "p", "texte": "Chaque service externe passe par une interface Python (un port) et un adaptateur choisi au démarrage. Le domaine n'appelle que le port. Aujourd'hui, presque tous les adaptateurs sont des doublures de démonstration ; hors démonstration, ces doublures sont fermées et refusent d'agir."}, {"type": "h", "texte": "Mise à jour en direct du poste fixe"}, {"type": "p", "texte": "Une écriture validée émet un avis PostgreSQL (NOTIFY) par transaction, qui ne porte que le cabinet et des clés « telle entité a changé » (actes, cotations, occurrences, transmissions, notifications, échéances), jamais une donnée de patient. Le poste fixe garde ouvert le flux « GET /evenements » (événements serveur) et relit ce qui a changé."}, {"type": "h", "texte": "Agent de poste"}, {"type": "p", "texte": "Le navigateur ne parle ni aux lecteurs de cartes ni au composant SESAM-Vitale. Un agent installé sur le poste fixe fera ce pont : il s'enrôle comme un terminal, tire ses travaux en HTTPS sortant (aucun port ouvert sur le poste) et rend le résultat. Le côté serveur est construit et testé avec un agent simulé ; l'agent réel attend le choix du composant SESAM-Vitale (décision D-07)."}, {"type": "note", "ton": "attention", "texte": "Le moteur de cotation branché est une doublure de démonstration : ne jamais facturer avec. Le moteur NGAP réel est un actif de TABSANTE, attendu derrière le même port."}]}, {"id": "tech-installation", "titre": "Installer et lancer en local", "resume": "Les cinq commandes qui lancent la base, l'API, le poste fixe et le terminal web de démonstration sur un poste de développement.", "mots_cles": ["installation", "démarrage", "docker", "uv", "npm", "flutter", "ports", "5173", "5180", "8010"], "blocs": [{"type": "p", "texte": "Prérequis : Docker, uv (Python), Node 24, Flutter 3.47.6. Les commandes sont en syntaxe bash ; en PowerShell, poser la variable avant la commande."}, {"type": "code", "langage": "bash", "texte": "# 1. Base PostgreSQL 17 en conteneur (port hôte 55432)\ndocker compose up -d db\n\n# 2. Schéma : migrations Alembic\ncd backend\nuv sync\nTABSANTE_DEV_AUTH=true uv run alembic upgrade head\n\n# 3. API sur 8010 (mode développement, boucle locale)\nTABSANTE_DEV_AUTH=true uv run uvicorn app.main:app --host 127.0.0.1 --port 8010\n\n# 4. Poste fixe sur 5173\ncd web\nnpm ci\nVITE_API_URL=http://127.0.0.1:8010 npm run dev -- --host 127.0.0.1 --port 5173\n\n# 5. Terminal servi en web sur 5180\ncd mobile\nflutter build web --dart-define=API_URL=http://127.0.0.1:8010\npython -m http.server 5180 --directory build/web"}, {"type": "code", "langage": "powershell", "texte": "$env:TABSANTE_DEV_AUTH='true'\nuv run uvicorn app.main:app --host 127.0.0.1 --port 8010"}, {"type": "table", "entetes": ["Adresse", "Ce qu'on y trouve"], "lignes": [["http://127.0.0.1:5173", "Poste fixe"], ["http://127.0.0.1:5180", "Terminal servi en web (démonstration)"], ["http://127.0.0.1:8010/docs", "Documentation interactive de l'API (mode développement seulement)"], ["http://localhost:4321", "Site public (« cd site » puis « npm run dev »), projet à part"]]}, {"type": "liste", "items": ["La connexion de démonstration appelle « POST /dev/demo » : idempotente, elle crée une seule fois un cabinet fictif, ses intervenants, des patients fictifs et une semaine de passages.", "Le terminal web s'enrôle en démonstration sans code ; sur Android, l'enrôlement passe par un code émis au poste fixe.", "Sans « --dart-define=API_URL », le terminal vise http://127.0.0.1:8002 (valeur par défaut du code).", "Sans réseau, « VITE_CARTE_STYLE=aucune » (poste fixe) et « --dart-define=TUILES_URL= » (terminal) remplacent le fond de carte par un schéma."]}, {"type": "h", "texte": "Remettre la démonstration à zéro"}, {"type": "code", "langage": "bash", "texte": "cd backend\nTABSANTE_DEV_AUTH=true uv run python reinitialiser_demo.py"}, {"type": "h", "texte": "HTTPS en local (facultatif)"}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/certificat_dev.py\nuv run uvicorn app.main:app --port 8226 --ssl-keyfile var/tls/cle.pem --ssl-certfile var/tls/certificat.pem"}, {"type": "note", "ton": "attention", "texte": "Le certificat créé par « certificat_dev.py » est autosigné, valable 30 jours, pour localhost seulement. Jamais en production."}]}, {"id": "tech-mode-demo", "titre": "Mode démonstration, routes /dev et registre des simulations", "resume": "Comment la plateforme tourne sans les services nationaux : doublures réglables, pannes simulées, routes de développement réservées à la boucle locale.", "mots_cles": ["démonstration", "simulation", "/dev", "pannes", "registre", "doublure", "TABSANTE_DEV_AUTH", "TABSANTE_MODE_DEMO"], "blocs": [{"type": "p", "texte": "« TABSANTE_DEV_AUTH=true » ouvre le mode développement ; « TABSANTE_MODE_DEMO » le suit s'il n'est pas posé. Les deux sont refusés au démarrage dès que la configuration ressemble à un service."}, {"type": "h", "texte": "Routes de développement"}, {"type": "table", "entetes": ["Route", "Effet"], "lignes": [["POST /dev/demo", "Crée une fois, ou réutilise, le cabinet de démonstration et rend un jeton par intervenant fictif ; le paramètre « jeu » ouvre un cabinet à part pour les tests d'intégration"], ["POST /dev/demarrage", "Cabinet vide et jetons"], ["POST /dev/qr-demo", "Accès QR de démonstration"], ["POST /dev/psc/jeton", "Jeton Pro Santé Connect factice pour le portail externe"]]}, {"type": "note", "ton": "attention", "texte": "Les routes /dev délivrent des jetons sans authentification. Elles ne répondent qu'à la boucle locale et refusent toute requête portant un en-tête de proxy. Ne jamais publier le mode développement derrière un proxy."}, {"type": "h", "texte": "Registre des simulations"}, {"type": "p", "texte": "« backend/app/simulation.py » déclare chaque doublure une seule fois : ce qu'elle remplace, ses modes (« normal » en premier) et ses options. Le réglage est gardé en base (table « reglage_simulation »), commun à l'instance et conservé au redémarrage. Le registre compte 39 entrées : 33 dans « simulation.py » et 6 sources du contexte France déclarées dans « contexte_france.py »."}, {"type": "table", "entetes": ["Nature", "Entrées"], "lignes": [["Services simulés", "lecteur CPS, lecteur Vitale, INSi, ADRi, IDB, SESAM-Vitale, agent de poste, MSSanté, laboratoire, DMP, e-prescription, visio, géocodage, itinéraire, trafic, météo, radar de pluie, position GPS"], ["Référentiels de démonstration", "médicaments, terminologies de soins (diagnostics et résultats infirmiers)"], ["Interrupteur", "avis de la HAS sur les consultations CIA et CIB"], ["Règles provisoires", "recalage des fréquences, passage sans prescription, relance d'un renouvellement, pansement neuraxial, cumuls des médicaments, déplacements, modalités du BSI, chute plaquettaire, écart au BSI, marge au lit, thèmes sensibles, terminal non synchronisé"], ["Contexte France", "jours fériés, vacances scolaires, vigilance, circulation, pollution, pollens"]]}, {"type": "h", "texte": "Provoquer une panne"}, {"type": "etapes", "items": ["Se connecter avec un profil qui gère les habilitations (HAB-33).", "Ouvrir Paramètres, puis Simulations (aussi par Ctrl K).", "Choisir le mode du service (par exemple « indisponible ») ou l'option de la règle.", "Rejouer le geste : le bandeau « Démonstration » compte les pannes en cours.", "Revenir à la normale par « Tout remettre à la normale »."]}, {"type": "code", "langage": "http", "texte": "PUT /simulation/sesam_vitale  {\"mode\": \"teletransmission_indisponible\"}\nPOST /simulation/reinitialiser"}, {"type": "p", "texte": "Une panne simulée rend 503 avec un motif lisible. Quelques déclencheurs par le nom restent actifs : un patient sans NIR donne un rejet R1, un nom contenant « rejet » un rejet R2, un nom contenant « ambigu » ou « echec » une réponse ambiguë ou un échec de l'INSi."}, {"type": "h", "texte": "Bancs"}, {"type": "code", "langage": "bash", "texte": "cd backend\nTABSANTE_DEV_AUTH=true uv run python -m scripts.banc_conformite   # services simulés : identité, SESAM-Vitale, DMP\nuv run python -m scripts.banc_cotation                             # moteur de cotation seul, sans base"}]}, {"id": "tech-configuration", "titre": "Configuration : variables d'environnement", "resume": "Les variables TABSANTE_* lues par l'API, leur rôle et leur valeur par défaut quand elle n'est pas secrète.", "mots_cles": ["configuration", "variables", "TABSANTE", "environnement", "pydantic-settings", "config.py"], "blocs": [{"type": "p", "texte": "Toutes les variables du serveur portent le préfixe « TABSANTE_ » et sont lues par « backend/app/config.py » (pydantic-settings, fichier « .env » accepté). Les valeurs secrètes ne figurent jamais dans le dépôt : elles se rangent dans le gestionnaire de secrets de l'hébergeur."}, {"type": "table", "entetes": ["Variable", "Défaut", "Rôle"], "lignes": [["DEV_AUTH", "false", "Mode développement : routes /dev, documentation /docs, jeton d'accès de 12 heures, secret JWT aléatoire par processus, origines locales 5173 et 5180"], ["ENV", "vide", "Nom de l'environnement ; toute valeur autre que dev, developpement, development, local ou test interdit DEV_AUTH"], ["MODE_DEMO", "suit DEV_AUTH", "Mode démonstration (registre des simulations, cartes simulées) ; refusé hors développement"], ["JWT_SECRET", "aucun", "Obligatoire hors développement : 32 caractères aléatoires au moins, sans le préfixe « dev- »"], ["CORS_ORIGINES", "aucune", "Liste JSON des origines admises ; hors développement, https seulement"], ["ACCES_MINUTES", "15", "Durée du jeton d'accès hors développement"], ["RAFRAICHISSEMENT_JOURS", "7", "Jeton de rafraîchissement glissant, à usage unique"], ["RAFRAICHISSEMENT_GRACE_SECONDES", "30", "Rejeu toléré du jeton précédent quand la réponse de rotation s'est perdue"], ["SESSION_JOURS_MAX", "30", "Durée maximale d'une session"], ["LIMITE_CONNEXIONS_MINUTE", "10 (300 en développement)", "Appels par minute et par adresse sur les routes sensibles, comptés en base"], ["DATABASE_URL", "base locale du conteneur (développement)", "Connexion de l'API ; rôle applicatif à moindre privilège hors développement"], ["DATABASE_URL_MIGRATION", "vide", "Propriétaire du schéma (Alembic, roles_db.py, tâche de nuit) ; vide : DATABASE_URL, en développement seulement"], ["ANCRE_FICHIER", "var/ancres_audit.jsonl", "Puits d'ancrage fichier, en ajout seul"], ["ANCRE_URL, ANCRE_URL_JETON", "vide", "Puits d'ancrage hors site ; ANCRE_URL obligatoire hors développement"], ["RETENTION_ACCES_JOURS", "365 (au moins 180)", "Conservation du journal des accès (provisoire, D-06)"], ["RETENTION_SESSIONS_JOURS", "365", "Purge des sessions closes"], ["RETENTION_DOSSIER_ANS, RETENTION_DOSSIER_AGE_MINIMAL", "20, 28", "Dossier signalé au terme, jamais supprimé automatiquement"], ["RETENTION_FICHIERS_ORPHELINS_JOURS", "30", "Purge des fichiers qu'aucune ligne ne cite"], ["RETENTION_TRAVAUX_POSTE_JOURS", "30", "Purge des travaux terminés de l'agent de poste"], ["ENROLEMENT_MINUTES", "10", "Validité d'un code d'enrôlement de terminal"], ["PHOTOS_DIR", "var/photos", "Fichiers chiffrés au repos : photos, PDF, ordonnances, BSI déposés"], ["STOCKAGE_TROUSSEAU", "var/kms/trousseau_stockage.json", "Trousseau du KMS local simulé (développement seulement)"], ["LECTEUR_ORDONNANCE", "rapidocr", "OCR local ; « factice » réservé au développement"], ["SEUIL_DIFFERE_MINUTES", "120", "Seuil de saisie différée (provisoire, D-04)"], ["ITINERAIRE_DETOUR, ITINERAIRE_VITESSE_KMH", "1,3 ; 25", "Itinéraire simulé (provisoire)"], ["HEURES_DEPART_TOURNEE", "matin 07:30, midi 11:30, soir 17:30, nuit 20:30", "Heure de départ de chaque moment"], ["POSITION_RETENTION_HEURES", "12", "Garde maximale de la position approximative d'un soignant en route"], ["FENETRE_HORAIRE_MIN, JOURNEE_REFERENCE_MIN", "30 ; 420", "Fenêtre autour d'une heure prescrite ; journée de référence des indicateurs (provisoires)"], ["CARTE_RESEAU", "false", "Active la météo, le radar et le trafic réels (sinon simulés)"], ["ITINERAIRE_URL", "vide", "Moteur d'itinéraire OSRM auto-hébergé ; vide : trajets simulés"], ["METEO_URL, RADAR_URL, TRAFIC_URL", "sources ouvertes documentées", "Adresses des sources réelles quand CARTE_RESEAU est vrai"], ["CONTEXTE_RESEAU, METEOFRANCE_CLE", "false ; vide", "Contexte France réel (fériés, vigilance…) ; clé du portail Météo-France pour la vigilance"], ["HORLOGE", "vide", "« HH:MM » : recale l'horloge de l'application ; développement et tests seulement"], ["OIDC_ISSUER", "vide", "Émetteur Keycloak (realm tabsante) : active la connexion OIDC ; vide, rien ne change"]]}, {"type": "p", "texte": "Variables des scripts d'exploitation : SAUVEGARDE_CLE, SAUVEGARDE_DIR, SAUVEGARDE_GARDER (défaut 7,4,12). Côté clients : VITE_API_URL, VITE_CARTE_STYLE, VITE_CARTE_ATTRIBUTION (poste fixe) ; API_URL, TUILES_URL, TUILES_ATTRIBUTION en « --dart-define » (terminal) ; TABSANTE_KIOSQUE en variable Gradle pour le mode kiosque."}, {"type": "note", "ton": "attention", "texte": "Jamais TABSANTE_DEV_AUTH=true sur un serveur exposé : l'API refuse d'ailleurs de démarrer avec lui dès qu'elle voit un signe de service (ENV de service, base distante, secret sans préfixe « dev- », ANCRE_URL posée, origine non locale)."}]}, {"id": "tech-base-donnees", "titre": "Base de données, migrations et immuabilité", "resume": "97 tables PostgreSQL, 57 migrations Alembic en une seule chaîne, un rôle applicatif sans droit de réécrire les preuves.", "mots_cles": ["base", "PostgreSQL", "migrations", "Alembic", "rôle applicatif", "immuabilité", "trigger", "interdit_modification"], "blocs": [{"type": "p", "texte": "Le modèle est déclaré dans « backend/app/models.py » (SQLAlchemy 2) : 97 tables au commit étudié. Identifiants UUID, horodatages à l'heure de Paris. Le schéma des liens entre entités est décrit dans « docs/conception/schema-des-liens.md »."}, {"type": "h", "texte": "Notions clés"}, {"type": "liste", "items": ["Fréquence, occurrence, acte réalisé : une prescription porte des fréquences ; le rythme engendre des occurrences datées par moment ; un passage signé crée un acte rattaché à son occurrence.", "Objet suivi : plaie, cathéter, stomie, sonde, épisode de pompe… ; ouverture, rang d'épisode, récidive, clôture.", "Données versionnées : chaque version d'une rubrique du dossier est gardée, rien n'est écrasé.", "Correction sans écrasement : une correction motivée ou une rectification s'ajoute ; lectures, courbes et cotation l'appliquent."]}, {"type": "h", "texte": "Migrations"}, {"type": "p", "texte": "57 fichiers de migration dans « backend/migrations/versions », une seule tête : 0045e (référentiel des listes). L'ordre suit « down_revision », pas le numéro du fichier : des lots parallèles sont rechaînés à la fusion."}, {"type": "etapes", "items": ["Créer une révision dont « down_revision » est la tête actuelle.", "Pendant une tournée, n'appliquer que des migrations additives ; une suppression de colonne se fait en deux versions.", "Une table immuable reçoit le déclencheur « interdit_modification ».", "Vérifier avec « scripts/verifier_tout » : migrations à neuf, dernière défaite puis rejouée, une seule tête."]}, {"type": "h", "texte": "Deux rôles de base"}, {"type": "table", "entetes": ["Rôle", "Variable", "Droits"], "lignes": [["Propriétaire du schéma", "TABSANTE_DATABASE_URL_MIGRATION", "Schéma, migrations, script des rôles, tâche de nuit, purges"], ["Rôle applicatif", "TABSANTE_DATABASE_URL", "Ni superutilisateur ni propriétaire ; ni UPDATE ni DELETE sur les tables immuables ; jamais TRUNCATE, ALTER ni session_replication_role"]]}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/roles_db.py   # crée ou remet en conformité le rôle applicatif (idempotent)"}, {"type": "p", "texte": "Au démarrage, hors développement, l'API refuse de tourner connectée en superutilisateur, en propriétaire ou avec un droit de réécriture sur le journal. Les migrations réappliquent d'elles-mêmes les droits du rôle applicatif aux tables nouvelles."}, {"type": "h", "texte": "Tables immuables"}, {"type": "p", "texte": "Actes signés, commentaires, photos, journal d'audit et ancres, corrections et rectifications, transmissions, données versionnées du dossier, documents produits et envoyés, prescriptions infirmières, résultats de biologie, versions de référentiel, signatures par carte, BSI déposés, entre autres. Le journal des accès refuse toute réécriture, propriétaire compris, et toute suppression de moins de 180 jours."}]}, {"id": "tech-api", "titre": "API : contrat et conventions", "resume": "Où trouver l'OpenAPI, comment s'authentifier, comment lire un refus, éviter un double envoi et suivre les changements en direct.", "mots_cles": ["API", "OpenAPI", "REST", "erreurs", "regle", "Idempotency-Key", "429", "SSE", "evenements", "types"], "blocs": [{"type": "p", "texte": "Le contrat est « docs/api/openapi.json » (OpenAPI produit par FastAPI, « TabSanté V2 API », version 0.1.0) : 360 chemins, 410 opérations, 419 schémas au commit étudié. Le plus gros groupe est « /patients » (107 opérations)."}, {"type": "liste", "items": ["Documentation interactive : « /docs » sur l'API lancée en mode développement ; fermée en configuration de service (/docs, /redoc et /openapi.json rendent 404).", "Types du poste fixe régénérés depuis le contrat : « cd web » puis « npm run types » (vers « src/api/schema.d.ts »).", "Les charges utiles du terminal sont contrôlées contre « docs/api/openapi.json » par ses tests."]}, {"type": "h", "texte": "Authentification des appels"}, {"type": "liste", "items": ["« Authorization: Bearer » et le jeton d'accès sur toutes les routes internes ; chaque requête relit la session, une révocation est donc immédiate.", "Portail externe : en-tête « X-Acces-QR » (jeton du QR) et jeton Pro Santé Connect.", "Agent de poste : authentification HTTP Basic (identifiant et secret d'appareil du poste enrôlé)."]}, {"type": "h", "texte": "Refus : un texte pour l'humain, un code pour la machine"}, {"type": "code", "langage": "python", "texte": "raise Refus(422, \"Numéro de lot à renseigner\", regle=\"INJ-RG-06\")\n\nHTTP 422\n{\"detail\": \"Numéro de lot à renseigner\", \"regle\": \"INJ-RG-06\"}"}, {"type": "p", "texte": "« detail » est écrit pour l'utilisateur, sans code du cahier des charges ; « regle » porte l'identifiant de l'exigence pour l'audit. Un droit manquant rend 403 avec la ligne de matrice (HAB-xx). Un test refuse tout code du cahier dans ce que lit l'utilisateur."}, {"type": "table", "entetes": ["Code", "Sens habituel"], "lignes": [["401", "Session expirée, révoquée, terminal révoqué ou jeton rejoué (champ « code »)"], ["403", "Droit manquant ; hors portée d'un remplaçant"], ["404", "Hors cabinet ou hors portée ; route non montée en service"], ["409", "Conflit (identifiant déjà employé, occurrence déjà servie, version de brouillon) ; service non raccordé hors démonstration"], ["422", "Règle métier ou validation ; clé d'idempotence reprise pour une autre demande"], ["429", "Limitation de débit ; en-tête Retry-After: 60"], ["503", "Panne simulée d'un service (démonstration) ; OCR absent"]]}, {"type": "h", "texte": "Double envoi : la clé d'idempotence"}, {"type": "p", "texte": "Le poste fixe pose un en-tête « Idempotency-Key » par saisie. La même clé rejouée par la même session rend la réponse réussie gardée, sans rien écrire ; un second envoi simultané attend le premier ; la même clé pour une autre demande est refusée. Un refus n'est jamais retenu : la saisie corrigée repart avec la même clé. Les réponses sont gardées 24 heures (table « requete_idempotente »), purgées la nuit et jamais rendues à une session close."}, {"type": "h", "texte": "Limitation de débit"}, {"type": "p", "texte": "Au plus 10 appels par minute, par adresse et par route, sur les routes sensibles (rafraîchissement de session, enrôlement, portail externe, vérification et ancrage de l'audit, connexion par code, routes /dev et routes ouvertes de /simulation). Le compte est tenu en base (table « tentative_limitee ») : il vaut pour tous les processus et survit à un redémarrage."}, {"type": "h", "texte": "Événements en direct"}, {"type": "p", "texte": "« GET /evenements » ouvre un flux d'événements serveur, avec le jeton dans l'en-tête, jamais dans l'adresse. Il ne porte que des clés de changement ; la clé « cotations » ne part jamais à qui ne voit pas la cotation. Le flux relit sa session chaque minute et se ferme à la révocation."}]}, {"id": "tech-habilitations", "titre": "Habilitations, portée du remplaçant et administration", "resume": "La matrice HAB-01 à HAB-34 juge chaque droit côté serveur ; le remplaçant est borné à sa période, ses tournées et ses patients ; l'administrateur non soignant n'a pas le dossier clinique.", "mots_cles": ["habilitations", "HAB", "matrice", "droits", "remplaçant", "portée", "administrateur", "HAB-34", "aide-soignante"], "blocs": [{"type": "p", "texte": "« backend/app/habilitations.py » tient la matrice, seule juge des droits. Le poste fixe la lit par « GET /habilitations/matrice » pour n'afficher que ce qui est permis. Valeurs : L lecture, E écriture, S signature, V validation, A administration."}, {"type": "h", "texte": "Profils"}, {"type": "liste", "items": ["IDE : titulaire, ou « en structure » quand le cabinet exerce en structure, ou remplaçant s'il tient ses droits d'une habilitation de remplacement.", "AS : aide-soignant.", "ADM : administration du cabinet.", "Une habilitation active ajoute « responsable » ou « administrateur ».", "Professionnel externe : portail QR seulement."]}, {"type": "h", "texte": "Lignes à retenir"}, {"type": "table", "entetes": ["Ligne", "Action", "Qui"], "lignes": [["HAB-07", "Saisir une fiche de soin infirmier", "IDE (titulaire, structure, responsable, remplaçant)"], ["HAB-08", "Saisir une fiche Nursing", "IDE et aide-soignant"], ["HAB-13, HAB-15", "Passage imprévu, échange de tournée", "IDE et aide-soignant"], ["HAB-16", "Transmission ciblée", "IDE et aide-soignant (dans les limites de son rôle)"], ["HAB-17", "Transmission intra-cabinet", "Tous les intervenants du cabinet"], ["HAB-22", "Voir la cotation", "IDE seulement"], ["HAB-23", "Sécuriser une FSE", "Titulaire, structure, responsable ; pas le remplaçant (décision D-10 ouverte)"], ["HAB-14, 24, 25, 29, 33", "Tournées, lots, rejets, accès QR, habilitations et terminaux", "Titulaire, responsable, administration"], ["OFF-16", "Valider une saisie différée", "Titulaire ou responsable, au poste fixe seulement"], ["HAB-34", "Lire le dossier clinique", "IDE et aide-soignant ; jamais l'administrateur non soignant"]]}, {"type": "h", "texte": "Administrateur sans dossier clinique"}, {"type": "p", "texte": "L'administrateur non soignant garde l'administration du cabinet (équipe, habilitations, tournées, réglages, accès QR, reprise, journal des accès) et, des patients, leur seule identité (liste, tournée du jour). La liste de ses routes est fermée : une route absente lui est refusée."}, {"type": "h", "texte": "Portée du remplaçant"}, {"type": "liste", "items": ["Toute lecture est bornée au cabinet du jeton et, pour un remplaçant, à sa période, ses tournées et ses patients ; hors portée, la réponse est 404.", "Chaque geste est jugé à sa propre date.", "À la fin du remplacement, seule la synchronisation reste ouverte pour les gestes datés de la période ; 120 minutes plus tard, toutes ses sessions sont révoquées."]}, {"type": "note", "ton": "info", "texte": "Les valeurs de la matrice ont été retenues lors du développement et restent à faire valider : le cahier des charges la laisse « à remplir cellule par cellule »."}]}, {"id": "tech-sessions", "titre": "Sessions, jetons, enrôlement et première connexion", "resume": "Jeton d'accès court, rafraîchissement à usage unique, terminaux enrôlés par code, première connexion de service par code à usage unique.", "mots_cles": ["sessions", "JWT", "jeton", "rafraîchissement", "enrôlement", "terminal", "révocation", "connexion par code", "SEC-04"], "blocs": [{"type": "h", "texte": "Jetons"}, {"type": "liste", "items": ["Jeton d'accès JWT HS256 de 15 minutes (12 heures en développement).", "Jeton de rafraîchissement opaque, gardé haché, à usage unique et tournant ; session glissante de 7 jours, 30 jours au plus.", "Le jeton précédent rejoué dans les 30 secondes rend la même paire (réponse perdue) ; toute autre réutilisation révoque la session.", "Poste fixe : jetons en sessionStorage, fermés avec l'onglet ; un 401 « expiré » déclenche un seul rafraîchissement partagé."]}, {"type": "h", "texte": "Révocation"}, {"type": "p", "texte": "« POST /auth/deconnexion », « POST /auth/sessions/{id}/revocation » et « POST /auth/terminaux/{terminal}/revocation » (terminal perdu). « GET /auth/sessions » liste les sessions. Une révocation prend effet à la requête suivante."}, {"type": "h", "texte": "Enrôler un terminal"}, {"type": "etapes", "items": ["Au poste fixe, un profil qui gère les habilitations (HAB-33) émet un code : « POST /auth/terminaux ». Le code a 10 caractères, sert une fois et vaut 10 minutes.", "Sur le terminal, sans session : « POST /auth/terminaux/enrolement » avec le code, l'identifiant stable de l'appareil et un secret d'appareil tiré au hasard, rangé dans le Keystore.", "Le serveur ne garde que l'empreinte du secret ; toute session ouverte sur ce terminal lui est liée et chaque rafraîchissement présente le secret.", "Un terminal révoqué n'ouvre ni ne rafraîchit plus aucune session : il faut un nouvel enrôlement."]}, {"type": "h", "texte": "Première connexion en service"}, {"type": "p", "texte": "Keycloak est le courtier d'identité (voir ci-dessous) ; Pro Santé Connect réel reste à raccorder. En secours, et seul quand Keycloak n'est pas configuré, la route « POST /auth/connexion/code » échange : un code à usage unique émis en ligne de commande par l'exploitation, échangé contre une session de l'intervenant qu'il désigne."}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python -m scripts.connexion_service premier-titulaire --cabinet \"…\" --nom … --prenom … --rpps …\nuv run python -m scripts.connexion_service liste\nuv run python -m scripts.connexion_service code {identifiant} --minutes 30"}, {"type": "liste", "items": ["Le code a 10 caractères, vaut 60 minutes par défaut (24 heures au plus), se brûle au premier usage ; seule son empreinte est gardée.", "La route est limitée en débit et répond le même 401 pour un code inconnu, expiré ou déjà utilisé.", "Chaque émission et chaque usage entrent à la chaîne d'audit.", "L'écran de saisie du code existe au poste fixe et au terminal (« En secours : code de service »)."]}, {"type": "note", "ton": "attention", "texte": "En démonstration seulement, une connexion par carte CPS simulée existe ; ses cartes ouvrent des sessions à qui les présente, d'où son refus hors développement."}, {"type": "h", "texte": "Connexion par Keycloak (OIDC)"}, {"type": "liste", "items": ["Conteneur « keycloak » de docker-compose.yml (image Keycloak 26, mode start-dev, port 8180), realm « tabsante » importé de « infra/keycloak/realm-tabsante.json », thème de connexion « infra/keycloak/themes/tabsante ».", "Clients publics « tabsante-poste » et « tabsante-terminal » avec PKCE S256 ; « tabsante-api » est l'audience exigée par le serveur ; « tabsante-tests » est réservé au développement.", "Le jeton Keycloak s'échange une seule fois contre une session TabSanté (« POST /auth/connexion/oidc ») et ne vaut sur aucune autre route (Q-99). Signature vérifiée par les clés publiées du realm, émetteur, audience et expiration contrôlés.", "L'intervenant est reconnu par son compte rattaché, sinon par son RPPS ; le rôle du jeton doit correspondre au sien (Q-100). Un compte créé par Pro Santé Connect reçoit le rôle infirmier (Q-101).", "Activation : TABSANTE_OIDC_ISSUER côté serveur, VITE_OIDC_ISSUER au poste fixe, --dart-define=OIDC_ISSUER au terminal. Sans ces variables, rien ne change.", "Comptes de démonstration fictifs et variables d'exemple : « infra/keycloak/demo.env.example ». Production : mode start avec une base PostgreSQL dédiée, TLS, secrets hors du dépôt, realm sans comptes de démonstration ni client de test ni Pro Santé Connect simulé (« docs/exploitation/interfaces/cps-et-connexion.md »)."]}, {"type": "code", "langage": "bash", "texte": "TABSANTE_API_PORT=8010 docker compose up -d keycloak   # console : http://localhost:8180/admin (développement)"}]}, {"id": "tech-journal-audit", "titre": "Journal d'audit chaîné et ancrage", "resume": "Un registre immuable de ce qui change, chaîné par empreintes SHA-256, sans copie clinique, dont la tête est copiée hors de la base chaque nuit.", "mots_cles": ["audit", "journal d'audit", "chaîne", "SHA-256", "ancrage", "immuabilité", "minimisation", "preuve"], "blocs": [{"type": "p", "texte": "La table « journal_audit » répond à la question « qui a changé quoi, quand ? ». Elle est immuable et écrite sous un verrou global ; chaque entrée porte l'empreinte SHA-256 de la précédente, si bien qu'une altération rompt la chaîne."}, {"type": "h", "texte": "Ce qu'une entrée garde"}, {"type": "liste", "items": ["La référence de l'entité (type et identifiant), le type d'événement, l'acteur, l'horodatage.", "Les noms des champs touchés et quelques paramètres de forme (dates, versions, nombres).", "Quand la preuve l'exige, une empreinte HMAC du contenu, à clé du serveur.", "Les identifiants de personne (matricule INS, numéro de carte Vitale) sous forme de pseudonyme HMAC."]}, {"type": "note", "ton": "info", "texte": "Depuis la migration 0043c, le journal d'audit ne garde plus aucune copie clinique : ni NIR ni INS, ni valeurs d'antécédents ou de biologie, ni caractéristiques de plaies, ni lignes de cotation. Ces contenus restent dans leurs tables. Un test rejoue toute la démonstration et vérifie qu'aucune donnée clinique n'entre au journal."}, {"type": "p", "texte": "Le code compte 211 types d'événement sur 51 entités ; la liste se régénère depuis le code (commande dans « docs/exploitation/journal-audit.md »). Exception assumée : le registre des demandes de droits des patients y est tenu, avec un texte administratif sans donnée de santé."}, {"type": "h", "texte": "Ancrage hors de la base"}, {"type": "liste", "items": ["La tête de la chaîne est copiée dans un fichier en ajout seul (ANCRE_FICHIER) et postée vers un puits hors site (ANCRE_URL), chaque nuit et à la demande.", "Hors développement, l'API refuse de démarrer sans puits hors site (règle provisoire, puits à choisir avec l'hébergeur).", "Une ancre divergente ou un fichier d'ancres disparu est signalé ; les purges sont alors suspendues."]}, {"type": "h", "texte": "Vérifier"}, {"type": "code", "langage": "bash", "texte": "GET /audit/verification      # relit toute la chaîne, l'ancrage et la chaîne des accès (limité en débit)\nGET /audit/ancre              # lire la tête\nPOST /audit/ancre             # poser une ancre manuelle\ncd backend && uv run python -m app.taches   # tâche de nuit"}, {"type": "p", "texte": "Le dossier de preuve d'un acte relit la charge signée de l'acte dans sa table et ne lit du journal que le rang, le type, l'horodatage et l'empreinte ; sa vérification est incrémentale, avec une relecture complète au plus tous les quarts d'heure et chaque nuit."}]}, {"id": "tech-journal-acces", "titre": "Journal des accès", "resume": "Toute lecture nominative est tracée, un patient par ligne, dans une chaîne d'empreintes distincte, purgeable après 365 jours et jamais avant 180.", "mots_cles": ["journal des accès", "traçabilité", "lectures", "RGPD", "chaîne", "purge", "lectures_tracees"], "blocs": [{"type": "p", "texte": "La table « journal_acces » répond à la question « qui a lu quoi, quand, d'où ? ». Elle est tenue hors de la chaîne d'audit : une ligne par lecture saturerait son verrou, un appelant non authentifié ne doit pas pouvoir la remplir, et ces traces se purgent."}, {"type": "h", "texte": "La règle : toute lecture nominative"}, {"type": "liste", "items": ["Toute lecture authentifiée (GET) est tracée, sauf les routes exemptées avec leur raison ; la liste vit en un seul endroit, « backend/app/lectures_tracees.py ».", "Un test parcourt toutes les routes et échoue sur une route de lecture ni tracée ni exemptée.", "Chaque patient atteint par la réponse donne une ligne : une liste de 150 patients écrit 150 lignes, en une seule requête SQL.", "Sont aussi tracés les rafraîchissements de session et tous les refus 401, avec l'adresse du client.", "Identifiants seulement, jamais le contenu lu, jamais le texte d'une recherche."]}, {"type": "h", "texte": "Chaîne propre"}, {"type": "p", "texte": "Chaque ligne porte l'empreinte SHA-256 de la précédente, sous un verrou distinct ; la base refuse toute réécriture, propriétaire compris. Chaque nuit, la tête de cette chaîne est recopiée dans la chaîne d'audit, elle-même ancrée hors de la base."}, {"type": "h", "texte": "Lire et restituer"}, {"type": "liste", "items": ["« GET /journal-acces » (filtres patient, auteur, dates) et « /journal-acces/export » (CSV) : page Journal des accès du poste fixe, droit HAB-33.", "Restitution au patient dans la vue Droits du patient : accès regroupés par jour, intervenant et nature de c
