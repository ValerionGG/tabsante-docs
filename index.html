<style>
/* Mise en page : barre latérale de rubriques, page centrale lisible, sommaire de page à droite ; recherche toujours en haut. */
:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #EEF2FB; --fg: #141A2E; --fg-2: #4A5372; --ligne: #DDE3EF;
  --accent: #2F5BEA; --accent-fg: #FFFFFF; --accent-doux: #E6ECFD;
  --info: #2F5BEA; --info-fond: #EBF0FE; --attention: #8A5A00; --attention-fond: #FFF4DC;
  --code-fond: #F1F3F8; --ombre: 0 1px 2px rgba(20,26,46,.06), 0 8px 24px rgba(20,26,46,.06);
  --police: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --police-code: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --rayon: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1220; --surface: #151A2B; --surface-2: #1C2338; --fg: #E8ECF7; --fg-2: #A3ACC6; --ligne: #2A3250;
  --accent: #7C9BFF; --accent-fg: #0E1220; --accent-doux: #1E2950; --info: #8FA9FF; --info-fond: #1A2446;
  --attention: #F2C25B; --attention-fond: #33290F; --code-fond: #10152A; --ombre: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1220; --surface: #151A2B; --surface-2: #1C2338; --fg: #E8ECF7; --fg-2: #A3ACC6; --ligne: #2A3250;
  --accent: #7C9BFF; --accent-fg: #0E1220; --accent-doux: #1E2950; --info: #8FA9FF; --info-fond: #1A2446;
  --attention: #F2C25B; --attention-fond: #33290F; --code-fond: #10152A; --ombre: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--police); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }

.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--ligne);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.entete-in { display: flex; align-items: center; gap: 16px; max-width: 1400px; margin: 0 auto }
.marque { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: var(--fg); white-space: nowrap }
.marque-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: 18px; font-weight: 700 }
.marque small { display: block; font-weight: 500; font-size: 12px; color: var(--fg-2); line-height: 1.2 }
.recherche { position: relative; flex: 1; max-width: 560px; margin-left: auto }
.recherche input { width: 100%; height: 40px; border: 1px solid var(--ligne); background: var(--bg); color: var(--fg); border-radius: 999px;
  padding: 0 72px 0 40px; font: inherit; font-size: 14px }
.recherche input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-doux); background: var(--surface) }
.recherche svg { position: absolute; left: 14px; top: 12px; width: 16px; height: 16px; color: var(--fg-2) }
.touche { position: absolute; right: 10px; top: 9px; font-size: 12px; color: var(--fg-2); border: 1px solid var(--ligne); border-radius: 6px; padding: 1px 6px; background: var(--surface) }
.resultats { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; box-shadow: var(--ombre);
  max-height: min(70vh, 520px); overflow: auto; padding: 6px }
.resultat { display: block; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--fg) }
.resultat[aria-selected="true"], .resultat:hover { background: var(--accent-doux) }
.resultat b { display: block; font-weight: 600 }
.resultat span { display: block; font-size: 13px; color: var(--fg-2) }
.resultat em { font-style: normal; background: var(--attention-fond); color: var(--fg); border-radius: 3px }
.resultat .chemin { font-size: 11.5px; letter-spacing: .02em; color: var(--accent) }
.vide { padding: 14px; color: var(--fg-2); font-size: 14px }
.bouton-icone { border: 1px solid var(--ligne); background: var(--surface); color: var(--fg); border-radius: 8px; height: 36px; min-width: 36px; display: grid; place-items: center; cursor: pointer; font: inherit }
.menu-mobile { display: none }

.cadre { display: grid; grid-template-columns: 270px minmax(0, 1fr) 220px; gap: 32px; max-width: 1400px; margin: 0 auto;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
nav.rubriques { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px }
.rubrique { margin-bottom: 18px }
.rubrique > button { all: unset; display: flex; width: 100%; justify-content: space-between; align-items: center; cursor: pointer;
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); padding: 4px 8px; box-sizing: border-box; border-radius: 6px }
.rubrique > button:focus-visible { outline: 2px solid var(--accent) }
.rubrique ul { list-style: none; margin: 4px 0 0; padding: 0 }
.rubrique a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 14px; line-height: 1.35 }
.rubrique a:hover { background: var(--surface-2) }
.rubrique a[aria-current="page"] { background: var(--accent-doux); color: var(--accent); font-weight: 600 }
.rubrique[data-ferme] ul { display: none }
.chevron { transition: transform .15s ease }
.rubrique[data-ferme] .chevron { transform: rotate(-90deg) }

main { min-width: 0 }
.page { background: var(--surface); border: 1px solid var(--ligne); border-radius: 14px; padding: clamp(20px, 4vw, 44px); box-shadow: var(--ombre) }
.fil { font-size: 13px; color: var(--fg-2); margin-bottom: 8px }
.page h1 { font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance }
.chapeau { font-size: 17px; color: var(--fg-2); margin: 0 0 24px; max-width: 68ch }
.page h2 { font-size: 20px; letter-spacing: -.01em; margin: 32px 0 8px; scroll-margin-top: 90px; text-wrap: balance }
.page p, .page li { max-width: 72ch }
.page ul, .page ol { padding-left: 22px }
.page li { margin: 4px 0 }
ol.etapes { list-style: none; padding: 0; counter-reset: e; display: grid; gap: 10px }
ol.etapes li { counter-increment: e; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start }
ol.etapes li::before { content: counter(e); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-doux); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; font-variant-numeric: tabular-nums }
.note { border-radius: var(--rayon); padding: 12px 16px; margin: 16px 0; background: var(--info-fond); max-width: 72ch }
.note[data-ton="attention"] { background: var(--attention-fond) }
.note strong { display: block; font-size: 13px; color: var(--info) }
.note[data-ton="attention"] strong { color: var(--attention) }
pre { background: var(--code-fond); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 14px 16px; overflow-x: auto; font-family: var(--police-code); font-size: 13px; line-height: 1.55; position: relative }
.copier { position: absolute; top: 8px; right: 8px; font-size: 12px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--ligne); background: var(--surface); color: var(--fg-2); cursor: pointer }
code { font-family: var(--police-code); font-size: .92em }
.tableau { overflow-x: auto; margin: 16px 0; border: 1px solid var(--ligne); border-radius: var(--rayon) }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--ligne); vertical-align: top }
th { background: var(--surface-2); font-weight: 600 }
tr:last-child td { border-bottom: 0 }
details.faq { border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 0 16px; margin: 8px 0; max-width: 76ch; background: var(--surface) }
details.faq summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none; display: flex; gap: 10px; justify-content: space-between }
details.faq summary::after { content: "+"; color: var(--accent); font-weight: 700 }
details.faq[open] summary::after { content: "–" }
details.faq div { padding: 0 0 14px; color: var(--fg-2) }
dl.glossaire { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr); gap: 0; border: 1px solid var(--ligne); border-radius: var(--rayon); overflow: hidden }
dl.glossaire dt, dl.glossaire dd { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--ligne) }
dl.glossaire dt { font-weight: 600; background: var(--surface-2) }
.aide-carte { border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 16px 18px; margin: 12px 0; scroll-margin-top: 90px; max-width: 76ch }
.aide-carte[data-cible] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-doux) }
.aide-carte h3 { margin: 0 0 4px; font-size: 16px }
.etiquette { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-doux); border-radius: 999px; padding: 1px 9px; margin-right: 6px }
.suite { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--ligne); flex-wrap: wrap }
.suite a { display: block; padding: 12px 16px; border: 1px solid var(--ligne); border-radius: var(--rayon); text-decoration: none; min-width: 0; flex: 1 1 220px }
.suite a span { display: block; font-size: 12px; color: var(--fg-2) }
.suite a:last-child { text-align: right }
aside.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; font-size: 13px }
aside.sommaire b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-2); margin-bottom: 8px }
aside.sommaire a { display: block; color: var(--fg-2); text-decoration: none; padding: 3px 0 3px 10px; border-left: 2px solid var(--ligne) }
aside.sommaire a:hover { color: var(--accent); border-color: var(--accent) }
.accueil-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 20px }
.accueil-grille a { display: block; text-decoration: none; color: var(--fg); border: 1px solid var(--ligne); border-radius: 12px; padding: 16px; background: var(--surface) }
.accueil-grille a:hover { border-color: var(--accent) }
.accueil-grille b { display: block; margin-bottom: 4px }
.accueil-grille span { font-size: 13.5px; color: var(--fg-2) }
.pied { font-size: 12.5px; color: var(--fg-2); margin-top: 16px; text-align: center }
/* Bloc « liens » : cartes cliquables vers une page du portail (#id) ou un document publié à côté */
ul.liens { list-style: none; padding: 0; margin: 16px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px }
ul.liens li { margin: 0; max-width: none }
ul.liens a { display: flex; flex-direction: column; gap: 3px; height: 100%; text-decoration: none; color: var(--fg); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 12px 14px; background: var(--surface) }
ul.liens a:hover { border-color: var(--accent); background: var(--surface-2) }
ul.liens b { font-weight: 600; color: var(--accent) }
ul.liens span { font-size: 13.5px; color: var(--fg-2) }
ul.liens small { font-size: 11.5px; letter-spacing: .02em; color: var(--fg-2); margin-top: auto; padding-top: 4px }

@media (max-width: 1180px) { .cadre { grid-template-columns: 250px minmax(0, 1fr) } aside.sommaire { display: none } }
@media (max-width: 820px) {
  .cadre { grid-template-columns: minmax(0, 1fr) }
  nav.rubriques { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); max-height: none; background: var(--surface); z-index: 20; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 24px max(16px, env(safe-area-inset-left, 0px));
    border-right: 1px solid var(--ligne); transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--ombre) }
  body[data-menu] nav.rubriques { transform: none }
  .menu-mobile { display: grid }
  .marque small { display: none }
  .touche { display: none }
  .recherche input { padding-right: 14px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
</style>

ent ne doit entrer dans TabSanté tant que la connexion par carte CPS réelle (Pro Santé Connect), l'hébergeur certifié HDS et le délégué à la protection des données ne sont pas en place. Rien de ce qui est coté en démonstration n'est facturable."}, {"type": "note", "ton": "info", "texte": "La rubrique « Couverture du CDC et décisions » dit précisément ce qui est fait, simulé ou bloqué."}]}, {"id": "demarrer-demos", "titre": "Démos, vidéos et design", "resume": "Essayer TabSanté sans rien installer : démo en ligne, vidéos des parcours, propositions de design.", "mots_cles": ["démo", "démonstration", "essayer", "vidéo", "design", "UX", "avant après", "en ligne", "avis", "retour", "feedback"], "blocs": [{"type": "p", "texte": "Tout est fictif : patients, cartes, Assurance maladie. La cotation est une démonstration et la télétransmission est simulée."}, {"type": "liens", "items": [{"titre": "Démo en ligne, sans compte", "resume": "Le poste fixe et le terminal dans le navigateur : choisissez un profil (infirmière, infirmier, remplaçante, aide-soignante) et cliquez partout. Rien n'est enregistré.", "href": "https://valeriongg.github.io/tabsante-docs/demo/"}, {"titre": "Donner mon avis", "resume": "Un formulaire court : ce que vous avez vu, ce qui gêne, ce qui manque, une idée. Compte GitHub gratuit demandé. N'y écrivez aucune donnée réelle de patient : le formulaire est public.", "href": "https://github.com/ValerionGG/tabsante-docs/issues/new?template=retour.yml&application=Portail&title=%5BRetour%5D%20"}, {"titre": "Vidéos des parcours", "resume": "Neuf parcours d'environ une minute, sous-titrés : passage au terminal, facturation, reçu NGAP, contrôle CPAM, preuve, plaie, planning, aide-soignante.", "href": "https://valeriongg.github.io/tabsante-docs/videos/"}, {"titre": "Design et UX", "resume": "Le système de design, les avant/après écran par écran (jour et nuit), les maquettes et les principes UX.", "href": "https://valeriongg.github.io/tabsante-docs/design/"}, {"titre": "Site de présentation", "resume": "La page d'accueil publique de TabSanté, centrée sur la facturation et la NGAP.", "href": "https://valeriongg.github.io/tabsante-docs/site/"}]}, {"type": "note", "ton": "info", "texte": "Une démo complète, avec connexion Keycloak et comptes fictifs, peut aussi être ouverte sur demande : elle tourne sur le poste de l'équipe et son adresse change à chaque redémarrage (voir « Démonstration hébergée » dans la documentation d'exploitation)."}, {"type": "h", "texte": "Donner un avis"}, {"type": "etapes", "items": ["Dans la démo, cliquez sur « Donner mon avis » : au poste fixe dans la barre du haut ou le menu de votre profil, au terminal dans « Moi » ou un menu « ⋮ ».", "L'écran et le profil sont déjà remplis, sans aucune donnée de patient.", "Décrivez ce que vous cherchiez à faire et ce qui s'est passé ; une capture d'écran aide beaucoup.", "Tous les retours se lisent sur la page des retours du projet."]}, {"type": "liens", "items": [{"titre": "Tous les retours reçus", "resume": "La liste publique des retours, avec leur suite.", "href": "https://github.com/ValerionGG/tabsante-docs/issues?q=label%3Aretour"}]}]}, {"id": "demarrer-deux-applications", "titre": "Les deux applications", "resume": "Le poste fixe au cabinet, le terminal en tournée : un même dossier, deux façons de travailler.", "mots_cles": ["poste fixe", "terminal", "web", "Android", "Flutter", "portail externe", "site public"], "blocs": [{"type": "p", "texte": "TabSanté se compose de deux applications qui partagent les mêmes données, plus un portail pour les professionnels extérieurs."}, {"type": "table", "entetes": ["", "Poste fixe", "Terminal de tournée"], "lignes": [["Pour qui", "Le cabinet : infirmiers, aide-soignante, administration", "L'infirmier ou l'aide-soignante au domicile"], ["Où", "Au bureau, dans un navigateur, souris et clavier", "Sur le téléphone ou la tablette de tournée (Android) ; une version navigateur sert à la démonstration"], ["Réseau", "Connecté", "Fonctionne sans réseau : la tournée est préchargée, les envois partent au retour du réseau"], ["Écrans principaux", "Aujourd'hui, Tableau de bord, Patients, Tournées, Plaies, Transmissions, Bilans, Facturation, Paramètres", "Onglets Tournée, Patients, Liaisons, Envois ; « Moi » par l'avatar"], ["Gestes typiques", "Ordonnances et fréquences, planning, validation, facturation, partage", "Passage, fiche de soin, signature, photo, transmission"]]}, {"type": "h", "texte": "Les autres pièces"}, {"type": "liste", "items": ["Portail externe : un médecin, un pharmacien ou un laboratoire y lit la synthèse et dépose des documents, avec un QR du cabinet, son identité Pro Santé Connect et le consentement du patient. Il ne modifie jamais le dossier.", "Agent de poste : petit programme prévu sur le poste fixe pour relier les lecteurs de cartes et le composant SESAM-Vitale. Il est aujourd'hui simulé.", "Site public : site de présentation séparé de l'application, qui ne reçoit aucune donnée de santé."]}, {"type": "note", "ton": "info", "texte": "Les guides pas à pas sont dans les rubriques « Guide du poste fixe » et « Guide du terminal »."}]}, {"id": "demarrer-roles", "titre": "Les rôles et ce que chacun voit", "resume": "Infirmier, aide-soignante, remplaçant, administration : chacun voit et fait ce que la matrice des droits lui accorde.", "mots_cles": ["rôles", "IDE", "aide-soignante", "AS", "remplaçant", "administrateur", "habilitations", "droits"], "blocs": [{"type": "p", "texte": "Les droits suivent une matrice d'habilitations jugée par le serveur, à chaque requête. Un écran n'affiche que ce que votre profil peut lire ; un geste sans droit est refusé avec un message en français."}, {"type": "table", "entetes": ["Rôle", "Ce qu'il fait", "Ce qu'il ne voit pas ou ne fait pas"], "lignes": [["Infirmier titulaire (IDE)", "Tous les soins, l'organisation du cabinet (tournées, habilitations, lots), la validation des saisies différées d'un autre infirmier", "—"], ["Infirmier responsable", "Les mêmes droits d'administration que le titulaire", "—"], ["Infirmier en structure", "Les soins ; la structure (société) émet les FSE", "—"], ["Remplaçant", "Les soins d'un infirmier, dans la portée de son habilitation : une période avec une date de fin, des tournées et/ou des patients, jugées à la date de chaque geste", "Les vues de tout le cabinet quand sa portée est restreinte ; la sécurisation des FSE (décision D-10 ouverte) ; l'émission de codes de terminal ; la validation des saisies différées"], ["Aide-soignante (AS)", "La fiche Nursing (et Paramètres vitaux quand le cabinet exerce en structure), les signalements à l'infirmier, les transmissions intra-cabinet et, dans certaines limites, ciblées ; ses propres tâches", "La cotation et la facturation, le contenu des consultations, le texte des signalements, les prescriptions infirmières, les documents produits"], ["Administration du cabinet", "L'organisation : tournées, planning, équipe, habilitations, terminaux, accès QR, journal des accès, page Simulations", "Le dossier clinique : elle ne lit que l'identité des patients ; ni la cotation ni les documents de soin"]]}, {"type": "note", "ton": "info", "texte": "Une transmission ciblée écrite par l'aide-soignante reste bornée : ni entretien infirmier, ni traitement d'une interpellation, ni requalification. La relecture par l'infirmier référent est une question ouverte (Q-88)."}, {"type": "note", "ton": "attention", "texte": "L'authentification réelle de l'aide-soignante (Pro Santé Connect ou autre) est une décision ouverte (D-02). En démonstration, elle signe avec sa session, sans carte."}]}, {"id": "demarrer-demonstration", "titre": "La démonstration", "resume": "Lancer TabSanté en local, choisir un profil fictif, provoquer des pannes : tout ce qui est simulé et comment le voir.", "mots_cles": ["démonstration", "adresses locales", "ports", "profils fictifs", "Claire Martin", "Inès Petit", "Lucie Vidal", "simulations", "pannes"], "blocs": [{"type": "p", "texte": "La démonstration fait tourner tout le produit sur un poste de développement, sans aucun service national. Le cabinet « Cabinet de démonstration TabSanté » et ses patients sont fictifs ; il se crée à la première connexion de démonstration."}, {"type": "h", "texte": "Lancer la démonstration"}, {"type": "code", "langage": "bash", "texte": "docker compose up -d db\ncd backend && uv sync && TABSANTE_DEV_AUTH=true uv run alembic upgrade head\nTABSANTE_DEV_AUTH=true uv run uvicorn app.main:app --host 127.0.0.1 --port 8010\n\ncd web && npm ci && VITE_API_URL=http://127.0.0.1:8010 npm run dev -- --host 127.0.0.1 --port 5173\ncd mobile && flutter build web --dart-define=API_URL=http://127.0.0.1:8010 && python -m http.server 5180 --directory build/web"}, {"type": "table", "entetes": ["Application", "Adresse locale"], "lignes": [["Poste fixe", "http://127.0.0.1:5173"], ["Terminal (version navigateur)", "http://127.0.0.1:5180"], ["API et sa documentation", "http://127.0.0.1:8010/docs"], ["Base PostgreSQL (conteneur)", "port 55432"], ["Site public (à part)", "http://localhost:4321"]]}, {"type": "h", "texte": "Les profils fictifs"}, {"type": "table", "entetes": ["Profil", "Rôle"], "lignes": [["Claire Martin", "Infirmière (IDE)"], ["Paul Durand", "Infirmier (IDE)"], ["Inès Petit", "Aide-soignante (AS)"], ["Lucie Vidal", "Infirmière remplaçante, habilitation bornée sur la tournée Centre le midi"]]}, {"type": "p", "texte": "Les patients sont fictifs : M. Dupuis, Mme Lefèvre, M. Bernard, Mme Moreau et d'autres, avec plaies, dispositifs, pompes, une semaine de passages, des tournées sur la carte et des demandes de renouvellement. Les prescripteurs et pharmacies portent la mention « fictif »."}, {"type": "h", "texte": "Ce qui est simulé"}, {"type": "liste", "items": ["Cartes CPS et Vitale, lecteur de cartes du terminal, appli carte Vitale.", "Téléservices INSi, ADRi, IDB ; SESAM-Vitale (FSE, lots, retours) et agent de poste.", "Messagerie sécurisée (MSSanté), DMP, ordonnance numérique, laboratoire, visioconférence, Pro Santé Connect.", "Géocodage, itinéraire, trafic, météo, position GPS : chaque heure estimée est un ordre de grandeur.", "Moteur de cotation : une doublure de démonstration, jamais facturable.", "Règles provisoires : des valeurs prudentes en attendant une décision, réglables pour essai."]}, {"type": "h", "texte": "Montrer une panne"}, {"type": "etapes", "items": ["Connectez-vous avec un profil qui gère le cabinet (Claire Martin, par exemple).", "Ouvrez « Paramètres » puis « Simulations ».", "Choisissez une panne ou une option pour un service : carte bloquée, droits fermés, rejet des feuilles, adresse introuvable, verglas…", "Un bandeau « Démonstration » rappelle les pannes en cours sur tout le poste fixe ; remettez à la normale depuis la même page."]}, {"type": "p", "texte": "Certaines situations se provoquent aussi par les données : un patient sans NIR ou dont le nom contient « rejet » fait rejeter sa FSE ; un nom contenant « ambigu » ou « echec » fait répondre l'INSi en conséquence."}, {"type": "note", "ton": "attention", "texte": "La variable TABSANTE_DEV_AUTH ouvre les routes de démonstration sans authentification, depuis la boucle locale seulement. Elle est refusée au démarrage dès que la configuration ressemble à un service. Le terminal servi dans un navigateur garde sa clé dans le navigateur : il ne doit jamais recevoir de vraies données."}]}, {"id": "demarrer-par-ou-commencer", "titre": "Par où commencer selon votre profil", "resume": "Les pages à lire en premier, que vous soyez infirmier, aide-soignante, gestionnaire du cabinet ou technicien.", "mots_cles": ["parcours", "lecture", "premiers pas", "profil"], "blocs": [{"type": "table", "entetes": ["Vous êtes", "À lire d'abord"], "lignes": [["Infirmier en tournée", "Guide du terminal : la tournée du jour, faire un passage, signer et lire le reçu, hors connexion et onglet Envois"], ["Aide-soignante", "Guide du terminal : connexion, nursing, liaisons ; FAQ « Aide-soignante »"], ["Remplaçant", "Démarrer : les rôles ; FAQ « Remplaçant »"], ["Titulaire ou gestionnaire", "Guide du poste fixe : Aujourd'hui, tournées et planning, équipe et habilitations, terminaux, paramètres ; FAQ « Cabinet »"], ["Qui facture", "Facturation et NGAP : la cotation par passage, la file de contrôle, FSE et lots ; FAQ facturation et NGAP"], ["Équipe technique", "Documentation technique : architecture, installation, configuration, sécurité"], ["Décideur", "Facturation et NGAP : vue d'ensemble et « Facturer en réel » ; Couverture du CDC et décisions ; Questions ouvertes ; Nouveautés"]]}, {"type": "note", "ton": "info", "texte": "La recherche du portail ignore les accents et accepte plusieurs mots : tapez un sigle (BSI, INSi, FSE) ou une question (« terminal perdu »)."}]}]}, {"id": "facturation-ngap", "titre": "Facturation et NGAP", "public": "tous", "description": "Du soin signé à la feuille de soins : le circuit, les règles NGAP de la doublure, la file de contrôle, les FSE et ce qui manque pour facturer en réel.", "pages": [{"id": "fn-vue-ensemble", "titre": "Vue d'ensemble : du soin signé à la feuille de soins", "resume": "Le circuit complet de la facturation, étape par étape, ce qui garde chaque étape et ce qui est simulé aujourd'hui.", "mots_cles": ["facturation", "NGAP", "circuit", "FSE", "lot", "cotation", "décideur", "vue d'ensemble"], "blocs": [{"type": "note", "ton": "attention", "texte": "Démonstration : la cotation vient d'une doublure du moteur NGAP (MoteurDemo, version demo-0.4) et SESAM-Vitale est simulé. Rien n'est facturé ni opposable. Hors mode démonstration, la plateforme refuse de créer une feuille de soins tant que la doublure sert."}, {"type": "p", "texte": "Principe : facturer sur preuve. Les fiches de soin ne codent aucune règle de facturation : elles transmettent des faits signés et datés, et le moteur de cotation décide des lignes. Une feuille de soins électronique (FSE) ne naît que de cotations confirmées d'actes signés, et chaque ligne cite l'acte et son empreinte."}, {"type": "h", "texte": "Le circuit en huit étapes"}, {"type": "etapes", "items": ["Signature du soin : au terminal ou au poste fixe, l'acte signé est horodaté et scellé par une empreinte. Il ne change plus ; une correction s'y ajoute, datée et motivée.", "Cotation provisoire : à la réception de l'acte, le serveur fait coter par le moteur le passage entier (les actes déjà signés du passage et celui-ci). Hors connexion, le terminal ne retient la cotation préchargée que si l'acte signé y répond pareil.", "Reconfirmation : « Reconfirmer les cotations » fait rejouer chaque cotation provisoire, passage entier, corrections comprises. Mêmes lignes : confirmée. Divergence, ou règle du cabinet : file de contrôle.", "File de contrôle : un arbitre désigné confirme la cotation ou l'écarte de la facturation, avec un motif journalisé ; l'échéance affichée est de 7 jours après l'entrée en file.", "FSE : l'infirmier qui a réalisé les actes crée la FSE d'un patient avec ses seules cotations confirmées, puis la sécurise avec sa carte CPS et la carte Vitale du patient, ou en mode dégradé sans carte Vitale.", "Lot : les FSE sécurisées d'un même émetteur se mettent en lot derrière un contrôle de cohérence. Une anomalie bloque, sauf forçage motivé ; jamais pour une preuve altérée ni une saisie différée non validée.", "Télétransmission et retours : le lot part avec un accusé de réception, puis chaque FSE revient acceptée (paiement) ou rejetée (motif).", "Rejets : « Refacturer » rend les actes facturables dans une nouvelle FSE, « Abandonner » les garde hors facturation."]}, {"type": "h", "texte": "Chaque étape et ce qui la garde"}, {"type": "table", "entetes": ["Étape", "Qui agit", "Ce qui la garde", "Aujourd'hui"], "lignes": [["Signature", "L'intervenant qui a fait le soin", "Empreinte de l'acte ; acte jamais réécrit, correction datée et motivée", "Réel"], ["Cotation provisoire", "Le serveur (moteur) ; le terminal hors connexion", "Passage coté en entier, quel que soit l'ordre de signature ; versions du moteur, des règles et des tarifs gardées", "Doublure"], ["Reconfirmation", "Un infirmier qui voit la cotation", "Divergence, acte corrigé, soin fait en partie : toujours en file ; jamais de correction silencieuse", "Doublure"], ["File de contrôle", "Les arbitres désignés par le cabinet", "Motif obligatoire, journal chaîné ; une cotation déjà portée par une FSE ne s'écarte plus", "Réel, règles par défaut (D-05)"], ["FSE", "L'infirmier qui a réalisé les actes, avec sa carte CPS", "Cotations confirmées seulement ; un patient et un exécutant par FSE ; empreinte revérifiée ; aucun acte sous HAD", "Simulé"], ["Lot", "Infirmier titulaire ou responsable ; en libéral, l'émetteur seul", "Contrôle de cohérence : empreintes, prescriptions échues, fréquence dépassée, saisies différées, chaîne du journal", "Simulé"], ["Télétransmission et retours", "L'émetteur", "Accusé de réception ; retour FSE par FSE, paiement et part de la complémentaire", "Simulé"], ["Rejets", "Infirmier titulaire ou responsable ; en libéral, l'émetteur seul", "Décision motivée ; un acte corrigé est recoté avant d'être refacturé", "Simulé"]]}, {"type": "h", "texte": "Qui voit quoi"}, {"type": "liste", "items": ["La cotation, les FSE et les lots ne sont visibles que des infirmiers : titulaire, de structure, responsable, et remplaçant dans sa portée. L'aide-soignant et l'administrateur du cabinet n'en voient rien.", "Créer et sécuriser une FSE : infirmier titulaire, de structure ou responsable, pour ses propres actes. Le remplaçant ne le peut pas (D-10).", "Mettre en lot, télétransmettre, traiter les retours et les rejets : infirmier titulaire ou responsable ; en libéral individuel, l'infirmier émetteur de la FSE seul. En société d'exercice, la structure émet."]}, {"type": "h", "texte": "En chiffres"}, {"type": "table", "entetes": ["Repère", "Valeur au 22 octobre 2026"], "lignes": [["Moteur branché", "MoteurDemo, version demo-0.4 : doublure, jamais facturable"], ["Règles de la doublure", "61 règles identifiées, dont 8 provisoires en attente de décision et 9 « à confirmer » par TABSANTE"], ["Versions du référentiel de règles", "4 : base, 21 juin 2026, 1er janvier 2028, 1er janvier 2029"], ["Banc de cotation", "190 cas : 155 conformes au centime, 0 écart, 25 bloqués, 10 divergences documentées"], ["Exigences de facturation du CDC (§6.7)", "15 : 7 faites, 8 simulées"], ["Avenant 11", "15 mesures suivies : 10 faites, 2 simulées, 2 relevant du moteur seul, 1 à confirmer"], ["Décisions de facturation ouvertes", "23, dont 4 bloquantes"]]}, {"type": "h", "texte": "Dans cette rubrique"}, {"type": "liens", "items": [{"titre": "La cotation par passage", "resume": "Ce que le moteur reçoit, ce qui n'est jamais transmis, le reçu et le « Pourquoi ? ».", "href": "#fn-passage"}, {"titre": "Cumul des actes", "resume": "Article 11 B : taux plein, 50 %, exclusions et forfait.", "href": "#fn-cumul"}, {"titre": "Majorations", "resume": "Nuit, dimanche et férié, enfant, MCI, MAU, patient fragile.", "href": "#fn-majorations"}, {"titre": "Déplacements", "resume": "IFD, IFI, indemnités kilométriques et règle provisoire.", "href": "#fn-deplacements"}, {"titre": "Dépendance", "resume": "BSI, forfaits BSA, BSB, BSC et séances AIS.", "href": "#fn-dependance"}, {"titre": "Actes par soin", "resume": "Médicaments, perfusions, pansements, injections et autres fiches.", "href": "#fn-actes"}, {"titre": "Tarifs et avenant 11", "resume": "Valeurs datées, versions du référentiel, 15 mesures.", "href": "#fn-tarifs-avenant"}, {"titre": "La file de contrôle", "resume": "Règles, arbitres, délai et motifs.", "href": "#fn-file-controle"}, {"titre": "FSE, lots, retours et rejets", "resume": "Cartes, mode dégradé, contrôle de cohérence, forçage.", "href": "#fn-fse-lots"}, {"titre": "HAD, remplaçant et cas particuliers", "resume": "Relevés sans FSE, actes du remplaçant, régularisations.", "href": "#fn-cas-particuliers"}, {"titre": "Le banc de cotation", "resume": "Recueils, résultats, ce qu'il prouve et ne prouve pas.", "href": "#fn-banc"}, {"titre": "Facturer en réel", "resume": "Ce qui manque et les 23 décisions ouvertes.", "href": "#fn-reel"}]}]}, {"id": "fn-passage", "titre": "La cotation par passage", "resume": "Ce qu'est un passage, ce que le moteur reçoit et ne reçoit jamais, et comment lire le reçu ligne par ligne.", "mots_cles": ["passage", "cotation", "moteur", "faits", "tracé pas transmis", "reçu", "pourquoi", "et si", "hors connexion", "statut", "taux réduit"], "blocs": [{"type": "h", "texte": "Qu'est-ce qu'un passage ?"}, {"type": "p", "texte": "Le moteur ne cote jamais un acte isolé : il cote le passage entier, pour que le cumul des actes, les majorations et le déplacement ne dépendent pas de l'ordre de signature. Un passage réunit les actes signés :"}, {"type": "liste", "items": ["du même patient ;", "du même jour (heure de Paris) ;", "du même moment de tournée (matin, midi, soir, nuit) ;", "du même intervenant (l'article 11 B vise un même praticien) ;", "de la même séance : de proche en proche, pas plus de deux heures sans soin. Au-delà, un acte du même moment ouvre un autre passage (seuil provisoire, Q-04)."]}, {"type": "note", "ton": "info", "texte": "Le moment « nuit » de la planification couvre 20 h à 6 h (CDC §4.4) : il range le passage dans la tournée. Il ne décide pas de la majoration de nuit, qui suit les tranches de la NGAP (voir Majorations)."}, {"type": "h", "texte": "Ce que le moteur reçoit"}, {"type": "p", "texte": "Pour chaque acte du passage, une entrée de cotation : la fiche ne code rien, elle transmet des faits signés. Les faits du passage sont dérivés une fois par le serveur et sont les mêmes pour tous ses actes."}, {"type": "table", "entetes": ["Fait transmis", "D'où il vient"], "lignes": [["Fiche, données signées, heure réelle, rôle du signataire, mode d'exercice du cabinet", "L'acte signé"], ["Horaires prescrits, mention « dimanches et jours fériés », mention « soins à domicile »", "Fréquences et ordonnance servies par l'acte"], ["Contextes actifs à la date : soins palliatifs, forfait BSI, immunodépression, chimiothérapie, cancer…", "Dossier du patient"], ["Lieu de résidence : domicile, résidence autonomie, EHPAD, établissement", "Dossier du patient"], ["Payeur : assurance maladie, HAD ou « à classer »", "Séjour HAD et cadre de l'ordonnance"], ["Compteurs courants à trois échelles (objet suivi, patient, période)", "Compteurs tenus par les sorties du moteur"], ["Accords préalables", "Prise en charge du patient"], ["Type de jour (ouvré, dimanche, férié) et territoire de facturation", "Calendrier calculé sans réseau au code postal du domicile"], ["Âge à la date, score SEGA", "Date de naissance, score SEGA daté du dossier"], ["Déplacement : distance, commune, zone plaine ou montagne, même agglomération, patients de la même adresse, kilomètres d'IK déjà facturés dans la journée", "Point de départ du cabinet, extrait des zones, passages du jour"], ["Lieu réel du soin (« cabinet »)", "Déclaré à la signature ; absent, le domicile"], ["Réglages provisoires (déplacements, médicaments, pansement neuraxial)", "Paramètres › Simulations ; un moteur réel les ignore"]]}, {"type": "h", "texte": "Tracé, pas transmis"}, {"type": "p", "texte": "Ce qu'une fiche trace pour le soin sans le transmettre ne part jamais au moteur, et sa correction ne relance pas la cotation."}, {"type": "table", "entetes": ["Fiche", "Tracé au dossier, jamais transmis"], "lignes": [["Suivi diabétique", "Valeur de la glycémie ; dose, site et aspect local des injections d'insuline ; doses proposées, écarts, alerte"], ["Anticoagulant injectable", "Dosage en cours, dose, site, aspect local, examens, écarts et changements de dosage"], ["Médicaments", "Dosage, quantité, dose du jour et site de chaque ligne ; dose du jour et INR du bloc AVK ; effets, non-prises répétées, rappels"], ["Soins nursing", "Détail des soins, toilette, changes, élimination, repas, prévention, aides aux transferts et aux déplacements, étui pénien, signalements et commentaires"], ["Nutrition entérale", "Médicaments passés par la sonde, résidu gastrique"], ["Dialyse péritonéale", "Échanges, cycleur, tension avant et après, poids, transit, douleur abdominale"], ["Analgésie locorégionale", "Réfection du pansement périnerveux et son motif, température"]]}, {"type": "h", "texte": "Cotation provisoire et hors connexion"}, {"type": "liste", "items": ["À la réception d'un acte signé, le serveur cote le passage tel qu'il est alors. Les cotations provisoires des actes déjà signés ne changent pas : c'est la reconfirmation qui recote le passage entier.", "Hors connexion, le terminal ne cote pas : il reçoit dans sa précharge la cotation prévue de chaque passage et les champs dont elle dépend seule. Il la retient si l'acte signé y répond pareil ; sinon le reçu dit « Cotation provisoire non estimée hors connexion ».", "Cinq fiches sont estimables ainsi : Anticoagulant injectable, Injections, Prélèvements, Paramètres vitaux, Pansement (hors séance de Redon). Les autres dépendent de l'état du jour (rang, plafond, forfait) et ne sont cotées qu'à la réception.", "Chaque ligne servie dit elle-même si elle est facturable : terminal et poste fixe lisent cette information sans recopier la règle."]}, {"type": "h", "texte": "Le reçu, ligne par ligne"}, {"type": "p", "texte": "Le reçu de cotation d'un passage (poste fixe, lien « Reçu » d'un acte signé) montre chaque acte du passage avec sa cotation enregistrée : code, coefficient, statut, taux, quantité, règles appliquées, valeur de la lettre-clé à la date et montant ; puis le total du passage et les versions du référentiel et des tarifs."}, {"type": "table", "entetes": ["Statut d'une ligne", "Ce qu'il veut dire", "Facturée"], "lignes": [["Retenue", "Taux plein", "Oui"], ["Taux réduit", "Minorée, par exemple par le cumul (50 %)", "Oui, au taux dit"], ["Incluse", "Comprise dans une autre ligne ou dans un forfait", "Non"], ["Écartée", "Non facturable ; la règle citée dit pourquoi", "Non"], ["Plafonnée", "Au-delà d'un plafond (séances, IFI, kilomètres) : tracée", "Non"], ["À régulariser", "En attente d'une pièce : ordonnance, accord préalable", "Non, tant que la pièce manque"]]}, {"type": "p", "texte": "Montant d'une ligne = coefficient × valeur de la lettre-clé à la date du passage × quantité × taux, arrondi au centime. Sans valeur connue à la date, la ligne n'a pas de montant et le total devient « valeur à fixer »."}, {"type": "h", "texte": "« Pourquoi ? »"}, {"type": "p", "texte": "Chaque ligne cite les identifiants des règles appliquées ; « Pourquoi ? » les déplie : libellé, article de la NGAP ou source, et mention « à confirmer » le cas échéant, dans la version du référentiel retenue à la date du passage. Une cotation sans ligne dit son motif, par exemple « Tracé, non coté en propre : la fiche transmet des faits, le moteur décide »."}, {"type": "h", "texte": "« Et si… »"}, {"type": "p", "texte": "« Et si… » rejoue le passage réel avec une autre heure, le dimanche ou le férié le plus proche, un horaire prescrit ou des dimanches et fériés précisés, et compare au réel. Rien n'est écrit. La simulation ne relit ni les compteurs, ni les accords préalables, ni le rang du passage dans la journée ; un passage dont un fait sort des bornes du simulateur ne se rejoue pas."}, {"type": "liens", "items": [{"titre": "Reçu de cotation, simulateur et banc", "resume": "Le mode d'emploi au poste fixe.", "href": "#pf-recu-simulateur"}, {"titre": "Signer et lire le reçu", "resume": "Le reçu au terminal, avec la cotation provisoire.", "href": "#term-signature-recu"}]}]}, {"id": "fn-cumul", "titre": "Cumul des actes (article 11 B)", "resume": "Plusieurs actes au même passage : le premier à taux plein, le deuxième à 50 %, les suivants sans honoraires, et les exceptions que la doublure applique.", "mots_cles": ["cumul", "article 11 B", "11B", "taux plein", "50 %", "taux réduit", "ponction veineuse", "5 bis", "AMX", "forfait", "Q-72"], "blocs": [{"type": "note", "ton": "attention", "texte": "Démonstration : la cotation vient d'une doublure du moteur NGAP (MoteurDemo, version demo-0.4), écrite depuis le texte public de la NGAP. Aucun montant n'est facturé ni opposable ; le moteur réel de TABSANTE la remplacera derrière le même contrat."}, {"type": "p", "texte": "Quand plusieurs actes sont facturables au même passage, la doublure les classe par coefficient décroissant, quel que soit l'ordre de signature. Seules les lignes AMI, AMX et AIS entrent dans ce rang."}, {"type": "table", "entetes": ["Rang", "Statut", "Taux"], "lignes": [["1er acte (plus fort coefficient)", "Retenue", "100 %"], ["2e acte", "Taux réduit", "50 %"], ["3e acte et suivants", "Écartée (sans honoraires)", "0 %"]]}, {"type": "p", "texte": "Exemple du banc : un pansement et deux injections au même passage donnent le pansement à taux plein, une injection à 50 % et la troisième sans honoraires ; une injection signée avant le pansement ne change rien, le rang suit le coefficient."}, {"type": "h", "texte": "Hors du rang : à taux plein"}, {"type": "table", "entetes": ["Cas", "Règle de la doublure", "Source"], "lignes": [["Ponction veineuse directe", "La ponction et le premier acte associé à taux plein ; tout autre acte du rang est écarté : deux actes facturés au plus", "Titre XVI, chap. I, art. 1 ; mémento de l'Assurance Maladie"], ["Patient diabétique insulino-traité", "Surveillance, injections d'insuline et pansement lourd cumulés entre eux à taux plein", "Titre XVI, chap. II, art. 5 bis"], ["Vaccination à domicile", "Hors cumul, l'acte associé reste à taux plein ; au cabinet, la vaccination entre dans le rang", "Art. 11 B § 4 d"], ["Deux forfaits de perfusion", "Forfait court sous surveillance continue et forfait de plus d'une heure : taux plein ; le supplément horaire reste hors rang", "Titre XVI, chap. II, art. 3 et 4"], ["Séance postopératoire (RAAC)", "Associée sans article 11 B au retrait de sonde et à la surveillance de drain", "Titre XVI, chap. II, art. 7"], ["Séance de soins infirmiers AIS", "Hors rang, avant son abrogation ; l'acte technique en sus est en AMX", "Titre XVI, chap. I, art. 11 (abrogé)"]]}, {"type": "h", "texte": "Sous forfait de dépendance"}, {"type": "p", "texte": "Dans une séance liée à la dépendance, c'est-à-dire un passage de nursing d'un patient sous forfait BSI, l'acte technique en AMX est noté à 50 % de son coefficient, sauf perfusion, pansement lourd et complexe, séance art. 5 ter, ponction veineuse et, à partir du 1er janvier 2028 (date à confirmer), actes du patient diabétique."}, {"type": "note", "ton": "attention", "texte": "Divergence documentée : le cahier de cas CNDA facture cet AMX à taux plein (sept cas). La doublure suit le texte en vigueur (art. 11 B § 5 et titre XVI, art. 12). Décision Q-72 attendue de TABSANTE."}, {"type": "h", "texte": "Cas particuliers"}, {"type": "liste", "items": ["Pompes PSE et PCA : l'AMI 4,1 de surveillance et de changement de seringue, au passage d'une perfusion courte, est minoré à 50 % par le cumul, la perfusion courte (AMI 9 ou 10) passant devant.", "Une cotation qui porte au moins deux actes facturables, ou dont un acte a été réduit ou écarté par le cumul, entre en file de contrôle (réglage « cumul » du cabinet, activé par défaut)."]}]}, {"id": "fn-majorations", "titre": "Majorations", "resume": "Nuit, dimanche et jour férié, enfant, coordination, acte unique, patient fragile : quand la doublure les ajoute, une fois par passage.", "mots_cles": ["majoration", "nuit", "nuit profonde", "horaire prescrit", "dimanche", "férié", "MIE", "MCI", "MAU", "MSG", "SEGA", "calendrier", "Alsace-Moselle", "DROM"], "blocs": [{"type": "note", "ton": "attention", "texte": "Démonstration : la cotation vient d'une doublure du moteur NGAP (MoteurDemo, version demo-0.4), écrite depuis le texte public de la NGAP. Aucun montant n'est facturé ni opposable ; le moteur réel de TABSANTE la remplacera derrière le même contrat."}, {"type": "p", "texte": "Les majorations ne valent qu'une fois par passage. Elles sont portées par le premier acte facturable et majorable du passage ; une démarche de soins (DI) n'en porte jamais."}, {"type": "table", "entetes": ["Majoration", "Code", "Quand la doublure l'ajoute", "Valeur de démonstration"], "lignes": [["Nuit", "MAJ_NUIT", "Heure réelle du soin entre 20 h et 23 h ou entre 5 h et 8 h, et au moins un horaire prescrit de l'acte dans une tranche de nuit (20 h à 8 h)", "9,15 €"], ["Nuit profonde", "MAJ_NUIT_PROFONDE", "Heure réelle entre 23 h et 5 h, et un horaire prescrit de nuit", "18,30 €"], ["Dimanche ou jour férié", "MAJ_DIMANCHE_FERIE", "Passage un dimanche ou un férié du territoire du patient, et prescription précisant les dimanches et jours fériés ; jamais avec une majoration de nuit", "8,50 €"], ["Enfant de moins de sept ans", "MIE", "Âge du patient à la date inférieur à sept ans", "3,15 €"], ["Coordination infirmière", "MCI", "À domicile, pas au cabinet : patient en soins palliatifs, ou pansement lourd et complexe ; une par intervention", "5,00 €"], ["Acte unique", "MAU", "Un seul acte facturable au passage, coté AMI de coefficient 1,5 au plus, au domicile ou au cabinet ; jamais sous forfait BSI (l'acte y est en AMX), jamais avec la MCI", "1,35 €"], ["Patient fragile", "MSG", "À partir du 1er janvier 2028 (à confirmer) : forfait BSC et score SEGA d'au moins 35, 32 à partir du 1er janvier 2029 ; une par jour", "3,10 €"]]}, {"type": "h", "texte": "La nuit suit l'horaire prescrit"}, {"type": "liste", "items": ["Sans horaire prescrit, aucune majoration de nuit, quelle que soit la fiche, même pour un soin fait à 22 h : le moteur ne déduit pas un horaire de l'heure du passage.", "Avec un horaire prescrit de nuit, l'heure réelle choisit la tranche : un soin prescrit à 22 h et fait à 23 h 30 porte la majoration de nuit profonde.", "Un soin fait à 21 h 30 mais prescrit à 8 h ne porte aucune majoration (cas T16-MAJ-02 du banc).", "Les tranches de la NGAP (20 h à 8 h) ne se confondent pas avec le moment « nuit » de la planification (20 h à 6 h) : un soin prescrit à 7 h relève du moment « matin », mais porte la majoration de nuit s'il est fait avant 8 h.", "Les séances art. 5 ter (insuffisance cardiaque, BPCO) ne portent ni majoration de nuit ni majoration de jour férié."]}, {"type": "h", "texte": "Dimanches et jours fériés, calculés sans réseau"}, {"type": "p", "texte": "Le type de jour vient d'un calendrier calculé sur place au code postal du domicile, le même hors connexion : les onze jours fériés du Code du travail, le Vendredi saint et le 26 décembre en Alsace-Moselle, et la commémoration de l'abolition de l'esclavage de chaque DROM. La majoration n'est due que si la prescription précise les dimanches et jours fériés."}, {"type": "h", "texte": "Une fois par passage"}, {"type": "liste", "items": ["Nuit ou dimanche-férié : une seule des deux, la nuit d'abord.", "MIE, MCI ou MAU, MSG : sur l'acte qui porte le passage.", "Au cabinet : ni MCI ni déplacement ; la MAU reste due.", "La MSG se compte par jour, pas par passage."]}, {"type": "note", "ton": "info", "texte": "Une majoration n'existe jamais seule : elle s'ajoute à l'acte facturable qui porte le passage, le même jour. Une MAU facturée seule ou datée hors de son acte est impossible par construction."}, {"type": "note", "ton": "info", "texte": "File de contrôle : une majoration de nuit, de dimanche ou férié, d'enfant, une MCI de soins palliatifs ou une MSG y envoie la cotation (réglage « majoration »). La MAU et la MCI d'un pansement lourd, qui ne tiennent qu'à la composition du passage, n'y envoient pas."}]}, {"id": "fn-deplacements", "titre": "Déplacements : IFD, IFI et indemnités kilométriques", "resume": "Forfaits de déplacement, kilomètres hors agglomération, abattement journalier, et la règle provisoire qui ne cote rien par défaut.", "mots_cles": ["déplacement", "IFD", "IFI", "IK", "IKM", "indemnité kilométrique", "franchise", "abattement", "même adresse", "montagne", "plaine", "DE", "Q-08"], "blocs": [{"type": "note", "ton": "attention", "texte": "Règle provisoire (Q-08) : par défaut, la doublure transmet les faits de déplacement sans coter aucune indemnité. Le réglage « Indemnités de déplacement » (Paramètres › Simulations) passe en mode « cotées »."}, {"type": "table", "entetes": ["Indemnité", "Code", "Règle de la doublure en mode « cotées »", "Valeur de démonstration"], "lignes": [["Forfaitaire de déplacement", "IFD", "Une par passage au domicile ; une seule pour plusieurs patients d'une même adresse vus au même moment par le même infirmier", "2,75 €"], ["Forfaitaire, patient sous forfait BSI", "IFI", "Au lieu de l'IFD, due à chaque passage, même quand les soins sont compris dans le forfait ; quatre au plus par jour et par patient, au-delà plafonnée ; patient sous forfait suivant de la même adresse : IFI au coefficient 0,01", "2,75 €"], ["Kilométrique en plaine", "IK", "Hors de l'agglomération du cabinet, aller et retour, moins 2 km par trajet", "0,35 € par km"], ["Kilométrique en montagne", "IKM", "Même règle, moins 1 km par trajet", "0,50 € par km"], ["Dépassement pour exigence particulière", "DE", "Soins à domicile non prescrits : montant réglé par le cabinet (0 à 5 €, 0 par défaut), à la charge du patient, jamais remboursé", "Montant du réglage"]]}, {"type": "h", "texte": "Comment la doublure décide"}, {"type": "etapes", "items": ["Soin déclaré au cabinet : aucun déplacement.", "Patient hors domicile au sens de la NGAP (EHPAD, établissement pour adultes handicapés, établissement de santé) : aucune indemnité, et une ligne écartée le dit. La résidence autonomie compte comme domicile.", "Réglage par défaut : faits transmis, aucune ligne de déplacement.", "Tous les actes du passage sur une ordonnance qui ne prescrit pas les soins à domicile : ni forfait ni kilomètres, et le dépassement DE si le cabinet l'a réglé. Mention inconnue : le déplacement reste dû.", "Patient déjà vu à la même adresse : IFD écartée ; sous forfait BSI, le premier patient dépendant prend l'IFI, les suivants l'IFI 0,01.", "Même agglomération, distance, zone ou agglomération inconnue, ou distance sous la franchise : le forfait seul.", "Sinon, forfait et kilomètres : (distance moins franchise) × 2, arrondi au kilomètre."]}, {"type": "p", "texte": "Exemples du banc : à 25 km hors agglomération en plaine, IFD et 46 IK ; à 20 km en montagne, IFD et 38 IKM ; à 1,5 km en plaine, le forfait seul."}, {"type": "h", "texte": "Abattement journalier des kilomètres"}, {"type": "table", "entetes": ["Kilomètres d'IK déjà facturés par l'infirmier dans la journée", "Taux"], "lignes": [["Jusqu'à 299 km", "100 %"], ["De 300 à 399 km", "50 %"], ["Au-delà de 399 km", "0 % (lignes plafonnées, tracées)"]]}, {"type": "h", "texte": "D'où viennent les faits"}, {"type": "liste", "items": ["Distance : du point de départ du cabinet au domicile, par le port d'itinéraire (simulé en démonstration ; en panne, distance inconnue et forfait seul).", "Commune, zone de montagne et unité urbaine : extrait de démonstration des fichiers ouverts officiels (codes postaux de La Poste, communes de montagne, unités urbaines de l'INSEE), lu sans réseau.", "Kilomètres déjà facturés : lignes IK et IKM de l'infirmier ce jour-là, avant ce passage."]}, {"type": "note", "ton": "info", "texte": "La source réelle des distances et des zones, la prescription du déplacement et le lieu du soin par défaut restent à décider (Q-08). Les montants des FSE simulées ignorent le territoire."}]}, {"id": "fn-dependance", "titre": "Dépendance : BSI, forfaits BSA, BSB, BSC et séances AIS", "resume": "Le bilan de soins infirmiers coté au dépôt, le forfait journalier, l'acte technique en AMX et les séances AIS abrogées.", "mots_cles": ["BSI", "BSA", "BSB", "BSC", "forfait", "dépendance", "AIS", "DI", "AMX", "nursing", "démarche de soins", "abrogation", "SEGA"], "blocs": [{"type": "note", "ton": "attention", "texte": "Démonstration : la cotation vient d'une doublure du moteur NGAP (MoteurDemo, version demo-0.4), écrite depuis le texte public de la NGAP. Aucun montant n'est facturé ni opposable ; le moteur réel de TABSANTE la remplacera derrière le même contrat."}, {"type": "table", "entetes": ["Élément", "Règle de la doublure", "Cotation de démonstration"], "lignes": [["BSI initial", "Coté au dépôt de son PDF dans le dossier, jamais dans un passage : ni cumul ni majoration", "DI 2,5"], ["BSI de renouvellement", "Coté au dépôt du PDF", "DI 1,2"], ["BSI intermédiaire", "Deux au plus sur douze mois glissants ; au-delà, tracé, non coté", "DI 1,2"], ["Forfait journalier BSA, BSB ou BSC", "Un par patient et par jour, porté par le premier passage de nursing reçu, infirmier ou aide-soignant ; sans BSI valide, journée servie sans forfait ; réservé au domicile", "BSA 13,00 € · BSB 18,20 € · BSC 28,70 €"], ["Acte technique en sus du forfait", "Coté en AMX ; à 50 % dans la séance liée à la dépendance, sauf dérogations (voir Cumul)", "AMX"], ["Médicaments sous forfait", "Distribution comprise dans le forfait par défaut, ligne « incluse » ; réglable en « cumulable »", "—"], ["Déplacement", "IFI au lieu de l'IFD (voir Déplacements)", "IFI"], ["Patient fragile", "Forfait BSC et score SEGA au seuil, à partir de 2028", "MSG 3,10 €"]]}, {"type": "p", "texte": "Aucun soin coché dans la fiche Nursing ne se cote : le détail des soins est tracé, jamais transmis."}, {"type": "h", "texte": "Séances de soins infirmiers (AIS) et démarche de soins"}, {"type": "p", "texte": "Un patient dépendant hors forfait BSI recevait des séances de soins infirmiers d'une demi-heure (AIS 3, quatre au plus par 24 heures, au-delà plafonnées) et une démarche de soins infirmiers (DI 1,5, jamais majorée). La décision UNCAM du 2 juin 2026 abroge l'article 11 du titre XVI : à partir du 21 juin 2026 (date à confirmer), la doublure trace ces lignes écartées, « abrogé, la dépendance relève du BSI »."}, {"type": "p", "texte": "La doublure sait encore les coter pour un passage antérieur, utile au rejeu d'un historique ou du cahier CNDA ; la plateforme ne transmet pas aujourd'hui les faits correspondants (séances, démarche de soins)."}, {"type": "note", "ton": "info", "texte": "Valeurs des forfaits, de l'AIS (2,65 €) et de la DI (10 €) : tarifs de janvier 2025 du cahier CNDA, à confirmer. Le circuit du BSI déposé depuis AmeliPro reste à confirmer (Q-13)."}]}, {"id": "fn-actes", "titre": "Actes par soin : ce que cote la doublure", "resume": "Médicaments (actes A à D), perfusions, pompes, pansements, injections, prélèvements et autres fiches : règles et coefficients de démonstration.", "mots_cles": ["médicaments", "acte A", "acte C", "acte D", "perfusion", "forfait court", "forfait long", "PSE", "PCA", "pansement lourd", "pansement courant", "ablation", "Redon", "injection", "prélèvement", "coefficient", "stomie", "nutrition", "dialyse", "ALR"], "blocs": [{"type": "note", "ton": "attention", "texte": "Démonstration : la cotation vient d'une doublure du moteur NGAP (MoteurDemo, version demo-0.4), écrite depuis le texte public de la NGAP. Aucun montant n'est facturé ni opposable ; le moteur réel de TABSANTE la remplacera derrière le même contrat."}, {"type": "h", "texte": "Médicaments (article 10, fiche 6)"}, {"type": "table", "entetes": ["Acte", "Règle de la doublure", "Cotation"], "lignes": [["A : administration et surveillance de la prise", "Une fois par passage, quel que soit le nombre de médicaments ; au moins un médicament remboursable ; au domicile seulement, ni EHPAD ni établissement de santé ; fiche de surveillance exigée", "AMI 1, voie orale seule, avant le 21 juin 2026 ; ensuite AMI 1,2 pour les voies orale, ophtalmique, auriculaire, nasale, cutanée, vaginale et rectale"], ["C : surveillance après introduction ou modification d'un traitement", "Quinze passages au plus dans les 30 jours du changement signalé ; l'emporte sur l'administration de la même séance ; au-delà, tracée, non cotée", "AMI 1"], ["D : accompagnement de la prise médicamenteuse", "En séances de parcours déclenchées par l'infirmier ; dans un passage ordinaire, l'accompagnement est écarté, à placer à un autre passage (réglable)", "AMI 5,1 la séance initiale, AMI 4,6 les deux suivantes"], ["B", "Pas de règle propre dans la doublure", "—"], ["Pilulier seul, bloc AVK", "Des faits, jamais cotés", "—"], ["Sous forfait BSI", "Compris dans le forfait journalier par défaut", "Ligne incluse"]]}, {"type": "p", "texte": "L'accord préalable au-delà du premier mois de l'acte A est suivi au dossier (début, échéance, demande, décision) ; sans décision reçue, l'accord reste « demandé » (Q-01). Les règles de plafond, de cumul et de forfait sont provisoires, en attendant la table de TABSANTE."}, {"type": "h", "texte": "Perfusions (fiches 4 et 5)"}, {"type": "table", "entetes": ["Forfait", "Quand", "Cotation (sous contexte immunodépression, chimiothérapie ou cancer)"], "lignes": [["Perfusion courte sous surveillance continue", "À la dépose, sur la durée retenue, une heure au plus", "AMI 9 (AMI 10)"], ["Supplément de surveillance continue", "Par heure au-delà de la première, cinq au plus", "AMI 6 par heure"], ["Perfusion de plus d'une heure, surveillance organisée", "À la séance de pose", "AMI 14 (AMI 15)"], ["Arrêt et retrait du dispositif", "À la dépose, hors surveillance continue", "AMI 5"], ["Pansement de cathéter", "Quand le geste est fait", "AMI 4"]]}, {"type": "liste", "items": ["Un forfait court et un forfait long au même passage se cumulent à taux plein.", "La perfusion sous-cutanée n'a qu'une variante : la surveillance organisée.", "Aucune classe de produit ne commande le forfait, nutrition parentérale comprise.", "Écart ouvert avec la fiche 04 : le forfait long est coté à la pose (Q-80).", "Non couverts : forfait journalier d'organisation de la surveillance, changement de flacon (AMI 4,1)."]}, {"type": "h", "texte": "Pompes PSE et PCA (fiches 13-14 et 16)"}, {"type": "liste", "items": ["Séance de perfusion de plus d'une heure confirmée : AMI 14 (15 sous contexte substituant), une par jour quelle que soit la fiche ; une seconde le même jour est incluse.", "Autre visite : AMI 4,1 de surveillance et de changement de seringue, un par visite, porté par la première fiche signée ; jamais au passage de la séance.", "Au passage d'une perfusion courte : AMI 4,1 à 50 %."]}, {"type": "h", "texte": "Pansements (fiche 1)"}, {"type": "table", "entetes": ["Pansement", "Critère transmis par la fiche", "Cotation"], "lignes": [["Courant", "Plaie sans critère de pansement lourd", "AMI 2, puis AMI 2,02 à partir du 21 juin 2026"], ["Lourd et complexe, patient insulino-traité", "Détersion mécanique", "AMI 4, cumul art. 5 bis"], ["Lourd et complexe, ulcère avec compression", "Bandage multicouches ou contention", "AMI 5,1"], ["Lourd et complexe, méchage ou irrigation", "Détersion par méchage", "AMI 4"], ["Lourd et complexe, ulcère étendu", "Plus de 60 cm²", "AMI 4"], ["Lourd et complexe, escarre profonde", "Stade 4", "AMI 4"], ["Lourd et complexe, brûlure", "Surface non transmise : lourde par défaut", "AMI 4"], ["Ablation de fils ou d'agrafes", "Jusqu'à dix, ou au-delà ; pansement courant compris", "AMI 2 ou AMI 4"], ["Drain de Redon", "Surveillance et retrait, deux séances depuis le retour à domicile ; au-delà, plafonnée", "AMI 2,8"]]}, {"type": "p", "texte": "Un pansement lourd et complexe fait à domicile porte la MCI. Les critères et la règle de l'ablation sont à confirmer (Q-73, Q-74) : trois cas du recueil NGAP divergent sur ces points."}, {"type": "h", "texte": "Injections, prélèvements, anticoagulant, diabète"}, {"type": "table", "entetes": ["Acte", "Cotation"], "lignes": [["Injection IV directe isolée / en série / chez l'enfant", "AMI 2 / AMI 1,5 / AMI 2"], ["Injection IM, SC ou intradermique", "AMI 1"], ["Immunothérapie IM ou SC / IV", "AMI 1,5 / AMI 2,5"], ["Chimiothérapie IV", "AMI 7"], ["Sérum", "AMI 5"], ["Allergène", "AMI 3"], ["Implant sous-cutané", "AMI 2,5"], ["Voie rectale", "AMI 2"], ["Vaccination / sans prescription", "AMI 2,4 / AMI 3,05"], ["Pulvérisation", "AMI 1,25"], ["Tuberculine : pose / lecture", "AMI 0,5 / AMI 1"], ["Ponction veineuse / artérielle", "AMI 1,5 / AMI 1,5 (artérielle : hors titre XVI, coefficient de la doublure)"], ["Saignée", "AMI 5"], ["Prélèvement aseptique, sur cathéter central ou chambre implantable", "AMI 1"], ["Anticoagulant injectable : injection SC par l'infirmier", "AMI 1, ou AMI 1,5 sous contexte immunodépression, chimiothérapie ou cancer ; rien pour une injection faite par le patient ou l'entourage"], ["Suivi diabétique : surveillance avec adaptation, contrôle glycémique seul, chaque injection d'insuline", "AMI 1 chacun, cumulés à taux plein (art. 5 bis) ; rien pour un relevé fait par le patient"]]}, {"type": "h", "texte": "Autres fiches"}, {"type": "table", "entetes": ["Fiche", "Cotation de la doublure"], "lignes": [["Stomie digestive ou urinaire", "Réfection d'appareillage AMI 3 ; irrigation colique AMI 4, soin compris, vingt séances au plus ; surveillance seule : rien"], ["Nutrition entérale", "Pose ou changement de sonde gastrique AMI 3 ; séance AMI 3 ; séance jéjunale avec sondage AMI 4, pansement compris ; pansement de sonde ou de stomie AMI 2"], ["Uro-génito-digestif", "Cathétérisme ou changement de sonde AMI 4 chez l'homme, AMI 3 chez la femme ; retrait AMI 2 ; instillation AMI 1,25 ; éducation à l'autosondage AMI 3,5, dix séances ; réadaptation de vessie AMI 4,5 ; lavement, fécalome AMI 3 ; soins gynécologiques AMI 1,5 ; soins de bouche, injection vaginale AMI 1,25 ; pansement de cystostomie AMI 2"], ["Soins respiratoires", "Aérosol AMI 1,5, prophylactique AMI 5 ; lavage d'un sinus AMI 2 ; pansement de trachéotomie AMI 3, aspiration et changement de canule compris"], ["Dialyse péritonéale", "Un passage réalisé : AMI 4 (lettre-clé et coefficient au moteur réel)"], ["Analgésie locorégionale", "Séance de surveillance ou retrait de cathéter périnerveux AMI 4,2 ; injection neuraxiale AMI 5, retenue tant que l'accord préalable manque ; pansement neuraxial tracé, non coté (D-17)"], ["Séances de parcours", "RAAC AMI 3,9 ; art. 5 ter AMI 5,8 ; surveillance hebdomadaire d'un patient insuliné de plus de 75 ans AMI 4"], ["Consultation infirmière (fiche 24)", "Cotation du motif dans sa version, seulement si sa date d'effet est atteinte et sans obstacle (forfait, fenêtre, plafond, séance non dédiée)"], ["Bilans", "Une ligne « BILAN » de démonstration par type : surveillance, synthèse BSI, plaie, observance, biologie"], ["Paramètres vitaux, surveillance neuropsychiatrique", "Aucune ligne : c'est le bilan qui se cote"]]}, {"type": "note", "ton": "info", "texte": "Coefficients du titre XVI de la NGAP, repris pour la démonstration. La table de correspondance réelle, du soin à la nomenclature, appartient à TABSANTE."}]}, {"id": "fn-tarifs-avenant", "titre": "Tarifs datés, versions du référentiel et avenant 11", "resume": "La valeur d'une lettre-clé à la date du soin, les quatre versions du référentiel de règles et l'état des 15 mesures de l'avenant 11.", "mots_cles": ["tarifs", "lettre-clé", "valeur", "date d'effet", "avenant 11", "revalorisation", "AMI 3,45", "CIA", "CIB", "MSD", "MSG", "DROM", "versions", "UNCAM"], "blocs": [{"type": "p", "texte": "La doublure lit la valeur d'une lettre-clé à la date de réalisation du soin. Une valeur datée s'applique dans sa période ; une valeur « prévue » sans date d'effet ne s'applique jamais tant que TABSANTE ne l'a pas datée."}, {"type": "table", "entetes": ["Lettre-clé", "Valeur appliquée (démonstration)", "Prévue, non appliquée"], "lignes": [["AMI, AMX", "3,15 € (valeur courante, à confirmer) ; 3,45 € à partir du 1er novembre 2027", "3,35 € « fin 2026, après délai légal », sans date d'effet"], ["AMI, AMX dans les DROM", "3,30 € (non sourcée, à confirmer)", "—"], ["CIA", "—", "20 €, après délai légal et avis de la HAS"], ["CIB", "20 € à partir du 1er juillet 2027 (avis de la HAS)", "—"], ["RDI", "30 € (date d'effet à confirmer)", "—"], ["MIR", "—", "15 €, après délai légal"], ["RKD", "—", "3 €, après délai légal"], ["MSD", "7 € à partir du 1er janvier 2027", "—"], ["MSG", "3,10 € à partir du 1er janvier 2028", "—"], ["AIS / DI", "2,65 € (2,70 € dans les DROM) / 10 €", "—"], ["IK / IKM", "0,35 € / 0,50 € (0,40 € / 0,60 € dans les DROM)", "—"]]}, {"type": "h", "texte": "Les versions du référentiel de règles"}, {"type": "table", "entetes": ["Version", "Date d'effet", "Ce qui change"], "lignes": [["tabsante-ngap-demo@2025.1", "Base", "Règles de départ : séances AIS et démarche de soins, pansement courant AMI 2, administration de médicaments AMI 1 par voie orale"], ["@2026.1", "21 juin 2026 (décision UNCAM du 2 juin 2026, à confirmer)", "Article 11 abrogé (AIS, DI 1,5) ; pansement courant AMI 2,02 ; administration AMI 1,2 étendue aux voies non orales"], ["@2028.1", "1er janvier 2028 (avenant 11, à confirmer)", "Majoration du patient fragile, seuil SEGA 35 ; actes du diabétique en AMX à taux plein sous forfait"], ["@2029.1", "1er janvier 2029 (avenant 11, à confirmer)", "Seuil SEGA abaissé à 32"]]}, {"type": "p", "texte": "Chaque cotation garde la version du moteur, du référentiel et des tarifs retenue à la date du passage : un soin de 2026 relu en 2028 s'explique avec les règles de 2026."}, {"type": "h", "texte": "Avenant 11 : les 15 mesures"}, {"type": "p", "texte": "La plateforme tient des faits datés ; décider de facturer, et à quel tarif, appartient au moteur réel. Chaque ouverture dépend du délai légal, de la NGAP et, pour CIA et CIB, de l'avis de la HAS."}, {"type": "table", "entetes": ["Mesure", "Échéance", "État", "Ce que tient la plateforme"], "lignes": [["Revalorisation AMI et AMX : 3,35 € puis 3,45 €", "Fin 2026, puis 1er novembre 2027", "Simulé", "Calendrier daté des lettres-clés ; première date à fixer"], ["Consultation CIA, 20 €", "Après délai légal, avis HAS", "Fait", "Motif sans date d'effet : tracé, non facturant"], ["Soins régulés SAS ou PDSA (MIR)", "Après délai légal", "Fait", "Origine « soin régulé » d'un passage non programmé"], ["Astreinte PDSA", "Après délai légal", "À confirmer", "Rien : organisation territoriale"], ["Dépistage colorectal (RKD)", "Après délai légal", "Fait", "Kit remis, puis test réalisé"], ["Plaies non chirurgicales en accès direct, AMI 2,02", "1er janvier 2027", "Fait", "Plaie ouverte sans ordonnance, en rôle propre"], ["Bilan de plaie courante à risque, AMI 3,48", "1er janvier 2027", "Fait", "Motif daté, signal « bilan dû », exclusion sous forfait"], ["Diabète de l'enfant de moins de 16 ans, MSD 7 €", "1er janvier 2027", "Fait", "Lieu du soin (école, périscolaire), âge, type de diabète, bolus par pompe"], ["Consultation CIB, 20 €", "1er juillet 2027, avis HAS", "Fait", "Motif daté"], ["Surveillance hebdomadaire AMI 3,77 ou aiguë AMI 1,49", "1er janvier 2028", "Moteur seul", "Compteurs de période existants"], ["Médicaments ALD 15 et certaines ALD 23, AMI 1,48", "1er janvier 2028", "Simulé", "ALD portée par la pathologie, liste de démonstration"], ["Patient fragile MSG 3,10 €", "1er janvier 2028 et 2029", "Fait", "Score SEGA daté, repère d'éligibilité"], ["AMX à taux plein pour le diabète sous forfait", "1er janvier 2028", "Moteur seul", "Contexte BSI déjà transmis"], ["Deux consultations supplémentaires", "2028", "Fait", "Motif ajouté au référentiel sans nouvelle version"], ["CIA et CIB en séance dédiée", "Avec CIA et CIB", "Fait", "Faits « séance dédiée » et « forfait »"]]}, {"type": "note", "ton": "info", "texte": "Bilan : 10 mesures faites, 2 simulées, 2 relevant du moteur seul, 1 à confirmer. Les dates « à confirmer » s'appliquent à leur date dans la doublure, signalées comme telles."}]}, {"id": "fn-file-controle", "titre": "La file de contrôle", "resume": "Ce qui envoie une cotation en file, qui arbitre, dans quel délai, et comment le cabinet la règle.", "mots_cles": ["file de contrôle", "arbitrage", "arbitre", "reconfirmation", "divergence", "motif", "délai", "D-05", "réglages", "écarter", "confirmer"], "blocs": [{"type": "p", "texte": "Avant toute FSE, les cotations provisoires sont reconfirmées par le moteur (« Reconfirmer les cotations », actes réalisés jusqu'au jour choisi). Une cotation entre en file quand la reconfirmation diverge, ou quand une règle du cabinet le demande ; un arbitre la confirme ou l'écarte."}, {"type": "table", "entetes": ["Motif d'entrée en file", "Par défaut", "Réglable"], "lignes": [["Divergence entre provisoire et confirmée (lignes, ou rôle propre et sur prescription)", "En file", "Non : jamais de correction silencieuse"], ["Acte corrigé après signature", "En file", "Non"], ["Acte réalisé partiellement", "En file", "Non : jamais facturé d'office (Q-86)"], ["Cumul au même passage : au moins deux actes AMI, AMX ou AIS facturables, ou un acte réduit ou écarté par le cumul", "En file", "Oui"], ["Majoration à justifier : nuit, dimanche ou férié, enfant, MCI de soins palliatifs, patient fragile", "En file", "Oui"], ["Au-delà de la fréquence prescrite", "En file", "Oui"], ["Passage non programmé", "Hors file", "Oui"], ["Saisie au-delà du délai", "Hors file : validée au poste fixe par son propre circuit", "Oui"]]}, {"type": "h", "texte": "Arbitres, décision et délai"}, {"type": "liste", "items": ["Arbitres par défaut : infirmier titulaire, infirmier de structure, IDE responsable. Le cabinet peut y ajouter le remplaçant ; ni l'aide-soignant ni l'administrateur ne voient la cotation.", "Décision : « Confirmer la cotation » ou « Écarter de la facturation », avec un motif de 3 à 1 000 caractères, journalisé dans la chaîne d'audit.", "Délai d'arbitrage : 7 jours par défaut, réglable de 1 à 90, compté de l'entrée en file. C'est une échéance affichée, pas un blocage.", "Une cotation écartée rend sa contribution aux compteurs (plafonds). Une cotation déjà portée par une FSE ne s'écarte plus : elle se régularise.", "Les lignes provisoires restent consultables à côté des lignes confirmées."]}, {"type": "h", "texte": "Régler la file"}, {"type": "p", "texte": "Facturation › Réglages : cumul, majoration, au-delà de la fréquence, passage non programmé, saisie différée, délai et arbitres. Seul un infirmier titulaire ou responsable modifie ces réglages ; chaque changement est journalisé avec l'avant et l'après."}, {"type": "note", "ton": "info", "texte": "Ces valeurs par défaut attendent la décision D-05 du fondateur."}, {"type": "h", "texte": "Ce que garde la trace"}, {"type": "p", "texte": "Chaque reconfirmation et chaque arbitrage écrivent au journal chaîné l'empreinte des lignes provisoires et confirmées, les motifs, le rôle, le payeur et les versions du moteur, du référentiel et des tarifs ; les lignes elles-mêmes restent à la cotation."}]}, {"id": "fn-fse-lots", "titre": "FSE, lots, retours et rejets", "resume": "Qui crée et sécurise la feuille de soins, le mode dégradé, le contrôle de cohérence du lot, le forçage, les retours et les rejets.", "mots_cles": ["FSE", "feuille de soins", "CPS", "Vitale", "mode dégradé", "sécuriser", "lot", "contrôle de cohérence", "forçage", "télétransmission", "NOEMIE", "rejet", "refacturer", "tiers payant", "DRE", "SCOR", "annulation"], "blocs": [{"type": "note", "ton": "attention", "texte": "SESAM-Vitale est simulé (adaptateur factice-0.2, en direct ou par l'agent de poste simulé) : aucune feuille réelle ne part. Hors mode démonstration, chaque opération est refusée."}, {"type": "h", "texte": "La FSE : qui la crée"}, {"type": "liste", "items": ["Une FSE porte les actes d'un seul patient et d'un seul infirmier, celui qui les a réalisés : lui seul la crée, la sécurise et l'annule, avec sa carte CPS. Cinquante actes au plus.", "Elle ne reprend que des cotations confirmées, et seulement leurs lignes retenues ou à taux réduit. Chaque ligne cite l'acte signé et son empreinte, revérifiée à la création : une preuve altérée bloque.", "Bloquent aussi : un acte dont le payeur est l'HAD, une ordonnance non classée pendant un séjour HAD, une saisie au-delà du délai non validée au poste fixe, un acte déjà porté par une FSE.", "Les droits du patient sont consultés en ligne (ADRi, simulé) avant la FSE.", "Émetteur : l'infirmier en libéral individuel, la structure en société d'exercice."]}, {"type": "h", "texte": "Sécuriser : carte CPS et carte Vitale"}, {"type": "table", "entetes": ["Mode", "Ce qui se passe"], "lignes": [["Carte Vitale lue", "La carte CPS de l'exécutant signe le patient et les empreintes des actes ; la carte Vitale lue (sceau vérifié, bénéficiaire au NIR du dossier) rend la FSE « sécurisée ». Un dossier sans couverture reçoit celle de la carte."], ["Mode dégradé", "Sans carte Vitale, la FSE signée par la CPS est sécurisée en mode dégradé : feuille papier à adresser à la caisse."], ["Au domicile, sans réseau", "Connectée par sa carte CPS, l'infirmière sécurise au domicile ; l'instant du domicile est gardé, et la FSE part au retour du réseau, derrière les actes que le cabinet cote et reconfirme d'abord."], ["Sans carte", "Par la session de l'exécutant, au poste fixe."]]}, {"type": "p", "texte": "Une FSE créée ou sécurisée, pas encore en lot, s'annule avec un motif : ses actes redeviennent facturables. En lot ou transmise, elle ne s'annule plus ; la FSE rectificative relève du composant réel."}, {"type": "h", "texte": "Tiers payant et parts (démonstration)"}, {"type": "p", "texte": "Montants calculés sur les tarifs de démonstration : part obligatoire à 60 %, ou 100 % sous exonération ; le reste à la complémentaire par une demande de remboursement électronique (DRE) quand le patient en a une, sinon au patient."}, {"type": "h", "texte": "Le lot et son contrôle de cohérence"}, {"type": "etapes", "items": ["« Constituer un lot » avec des FSE sécurisées, hors lot, d'un même émetteur (500 au plus).", "Le contrôle de cohérence est recalculé en entier : empreintes des actes, actes sur une prescription échue ou arrêtée, actes au-delà de la fréquence prescrite, saisies différées non validées, chaîne d'intégrité du journal, actes corrigés depuis leur FSE (à régulariser).", "Une anomalie refuse le lot, sauf « Forcer » avec un motif, journalisé. Jamais forçables : une empreinte qui ne correspond plus, une saisie différée non validée. Une chaîne du journal d'audit rompue reste refusée même forcée : seul qui gère le cabinet peut la passer, par un accord à part et un motif ; ce forçage est journalisé à part et marqué « Intégrité forcée » sur le lot. Bloquent aussi, avant le contrôle : un acte passé sous HAD ou une cotation qui n'est plus confirmée.", "Les ordonnances numérisées des prescriptions servies sont jointes (SCOR) ; une prescription sans document est signalée « manquante ».", "« Vérifier » lit le contrôle de cohérence avant tout, sans rien constituer ; puis « Mettre en lot et télétransmettre » d'un même geste (accusé de réception), et plus tard « Lire les retours »."]}, {"type": "h", "texte": "Retours et rejets"}, {"type": "liste", "items": ["Chaque FSE revient acceptée, avec son paiement (virement de la part obligatoire, part de la complémentaire payée ou refusée, reste à recouvrer auprès du patient), ou rejetée avec son motif.", "Un lot dont toutes les FSE sont revenues est clos ; des retours partiels arrivent plus tard.", "Onglet « Rejets » : « Refacturer » rend les actes facturables dans une nouvelle FSE, un acte corrigé étant d'abord recoté ; « Abandonner » les garde hors facturation. Le rejet et la décision restent consultables."]}, {"type": "h", "texte": "Scénarios de démonstration"}, {"type": "table", "entetes": ["Situation", "Résultat"], "lignes": [["Patient sans NIR au dossier", "Rejet « bénéficiaire non identifié »"], ["Nom contenant « rejet », ou droits fermés à la date des soins", "Rejet « droits fermés »"], ["Autres cas", "Acceptée et payée"], ["Interrupteur SESAM-Vitale (Paramètres › Simulations)", "Rejets, retours partiels, télétransmission injoignable ou refus de la complémentaire, à la demande"]]}, {"type": "liens", "items": [{"titre": "Facturation simulée", "resume": "Les onglets de l'écran Facturation au poste fixe.", "href": "#pf-facturation"}, {"titre": "Facturer au domicile", "resume": "Lire la carte Vitale et sécuriser au terminal.", "href": "#term-facturer"}]}]}, {"id": "fn-cas-particuliers", "titre": "HAD, remplaçant et cas particuliers", "resume": "Relevés HAD sans FSE, actes du remplaçant, passage sans ordonnance, soin fait en partie, acte corrigé après facturation, patient hors domicile.", "mots_cles": ["HAD", "relevé", "lettre de mission", "convention HAD", "payeur", "remplaçant", "D-10", "D-11", "D-18", "régulariser", "soin partiel", "EHPAD", "hors domicile"], "blocs": [{"type": "h", "texte": "Hospitalisation à domicile (HAD)"}, {"type": "liste", "items": ["Le payeur se déduit à la date du soin : hors séjour HAD, l'assurance maladie. Pendant un séjour : l'HAD si l'acte n'a pas d'ordonnance ou une ordonnance au cadre HAD, l'assurance maladie si l'ordonnance est classée libérale, « à classer » sinon.", "Sous HAD, la doublure valorise selon la NGAP et marque les lignes « convention HAD » : base du relevé à l'HAD, jamais une FSE (D-18, règle à confirmer).", "Onglet « Relevés HAD » : les actes du séjour dont l'HAD est le payeur ; sans lettre de mission, le séjour est « Non payable en l'état ».", "Une ordonnance non classée pendant un séjour bloque FSE et lot jusqu'à son classement. Une nouvelle ordonnance pendant un séjour est proposée au cadre HAD ; la classer libérale est un geste motivé."]}, {"type": "h", "texte": "Remplaçant"}, {"type": "liste", "items": ["Le remplaçant voit la cotation de ses patients, dans sa portée : ses tournées, ses patients, sa période.", "Il ne peut ni créer ni sécuriser une FSE : ses actes restent tracés, non facturables, en attendant la règle du cabinet (D-10, décision bloquante).", "Il n'arbitre la file de contrôle que si le cabinet l'a désigné arbitre.", "Après la fin du remplacement, son terminal peut encore envoyer pendant 120 minutes, puis sa session est fermée."]}, {"type": "h", "texte": "Passage imprévu sans ordonnance"}, {"type": "p", "texte": "Le passage se trace et se signe ; ses lignes facturables devie
