ge."}]}, {"id": "pf-savoir-faire", "titre": "Savoir-faire « Comment faire ? »", "resume": "Chercher un geste, une vidéo ou une réponse, proposer un contenu, relire en tant que référent.", "mots_cles": ["savoir-faire", "comment faire", "geste", "vidéo", "question", "relecture", "référent"], "blocs": [{"type": "p", "texte": "La page « Savoir-faire » réunit les gestes, vidéos, références écrites et réponses du réseau, relus par des infirmières et des médecins. Les mêmes contenus apparaissent sous les fiches concernées."}, {"type": "etapes", "items": ["« Rechercher un geste ou une question », ou filtrez par type et par fiche.", "Ouvrez un contenu : étapes, points de vigilance, matériel, vidéo, source et date de prochaine révision.", "« Poser une question » ou « Proposer un contenu » : la proposition attend la relecture d’un référent avant d’apparaître sous les fiches.", "Répondez à une question du terrain : un référent peut marquer « réponse validée »."]}, {"type": "h", "texte": "Relecture"}, {"type": "p", "texte": "La page « Relecture » n’apparaît qu’aux référents : « Marquer comme relu » ou « Refuser » avec un motif que l’auteur lira."}, {"type": "note", "ton": "attention", "texte": "Les contenus actuels sont des textes de démonstration, à faire valider par un infirmier ou un médecin référent avant tout usage. Les vidéos sont lues depuis YouTube avec le crédit de leur source, jamais copiées."}]}]}, {"id": "terminal", "titre": "Guide du terminal", "public": "soignants", "pages": [{"id": "term-vue-ensemble", "titre": "Le terminal en un coup d'œil", "resume": "L'application de tournée : quatre onglets, « Moi » par l'avatar, un passage en plein écran.", "mots_cles": ["terminal", "onglets", "Tournée", "Patients", "Liaisons", "Envois", "Moi", "jour", "nuit"], "blocs": [{"type": "p", "texte": "Le terminal est l'application du soignant au domicile. Il fonctionne avec ou sans réseau : tout ce qu'il faut pour la tournée est chargé à l'avance sur le téléphone."}, {"type": "table", "entetes": ["Onglet", "Ce qu'on y fait", "Pastille"], "lignes": [["Tournée", "Le prochain passage, la suite de la journée, l'itinéraire", "aucune"], ["Patients", "Chercher un patient, une transmission, une ordonnance ou une tournée du jour, ouvrir une fiche patient", "aucune"], ["Liaisons", "Transmissions et notifications", "bleue : « n à lire »"], ["Envois", "La file de ce qui attend d'être envoyé au cabinet", "ambre : « n en attente » ou « n à corriger »"]]}, {"type": "p", "texte": "« Moi » s'ouvre en touchant l'avatar en haut de la tournée. On y trouve le profil, « Recharger la tournée du jour », « Changer d'intervenant » (possible une fois tous les envois partis), « Navigation et position », « Notifications », « Ce terminal » et l'affichage."}, {"type": "h", "texte": "Affichage jour ou nuit"}, {"type": "p", "texte": "Dans « Moi », rubrique « Affichage » : « Automatique » suit le téléphone (nuit quand il passe en mode sombre), « Jour » ou « Nuit » forcent l'un ou l'autre. Le changement est immédiat et ne perd rien."}, {"type": "p", "texte": "Un passage s'ouvre par-dessus les onglets, en plein écran. On revient à la tournée à la fin, depuis le reçu."}, {"type": "note", "ton": "info", "texte": "La mention en bas de « Moi » rappelle que les données de la démonstration sont fictives."}]}, {"id": "term-enrolement", "titre": "Enrôler un téléphone", "resume": "Rattacher un téléphone au cabinet avec le code à usage unique émis au poste fixe.", "mots_cles": ["enrôlement", "code", "poste fixe", "Terminaux", "révocation", "téléphone perdu"], "blocs": [{"type": "p", "texte": "Avant toute connexion, le téléphone doit être enrôlé par le cabinet. Cela se fait une seule fois, ou de nouveau après une révocation ou un « Code oublié »."}, {"type": "etapes", "items": ["Au poste fixe, page Terminaux : « Émettre un code ».", "Sur le téléphone, écran « Enrôler ce téléphone » : saisir les 10 caractères du code, dans les 10 minutes.", "Toucher « Enrôler ce téléphone ». Tant que le code est incomplet, le bouton dit combien de caractères il manque."]}, {"type": "p", "texte": "Le téléphone reçoit alors un secret qui ne quitte pas son coffre-fort ; il le présente à chaque reconnexion."}, {"type": "table", "entetes": ["Message", "Que faire"], "lignes": [["Ce code n'est pas reconnu", "Il est faux, a expiré ou a déjà servi : en demander un nouveau au poste fixe."], ["Trop d'essais rapprochés", "Patienter une minute, puis réessayer."], ["Serveur injoignable", "L'enrôlement a besoin du réseau : se rapprocher du Wi-Fi du cabinet."]]}, {"type": "note", "ton": "attention", "texte": "Téléphone perdu ou volé : le cabinet le révoque depuis le poste fixe, et plus aucune session ne s'y ouvre."}, {"type": "note", "ton": "info", "texte": "Le bouton « Démonstration : enrôler sans code » ne fonctionne qu'avec un serveur de développement ; un serveur réel le refuse."}]}, {"id": "term-connexion", "titre": "Se connecter", "resume": "Ouvrir sa session : carte CPS de démonstration pour l'infirmière, choix du nom pour l'aide-soignante.", "mots_cles": ["connexion", "CPS", "code porteur", "Qui êtes-vous", "démonstration", "aide-soignante"], "blocs": [{"type": "p", "texte": "L'écran « Qui êtes-vous ? » ouvre la session sur le cabinet de démonstration. La première connexion a besoin du réseau pour charger la tournée."}, {"type": "note", "ton": "info", "texte": "Quand le cabinet a configuré Keycloak, le bouton « Se connecter avec TabSanté (Keycloak) » vient en tête : identifiant et mot de passe, ou carte CPS par Pro Santé Connect (simulé). Le code de service sert de secours ; l'enrôlement du téléphone et le code à 6 chiffres ne changent pas."}, {"type": "h", "texte": "Infirmière : par la carte CPS"}, {"type": "etapes", "items": ["Toucher « Se connecter avec ma carte CPS ».", "Choisir la carte à « insérer » dans le lecteur de démonstration, puis « Lire la carte insérée ».", "Saisir le code porteur de la carte et valider : la session s'ouvre et la tournée se charge."]}, {"type": "p", "texte": "Un code porteur faux dit les essais restants ; trois codes faux bloquent la carte."}, {"type": "h", "texte": "Aide-soignante"}, {"type": "p", "texte": "Elle touche son nom dans la liste des profils, sous le bouton de la carte."}, {"type": "note", "ton": "attention", "texte": "Tout est simulé : lecteur de cartes, carte CPS et fournisseur d'identité. Aucune carte réelle n'est lue et les données sont entièrement fictives."}, {"type": "note", "ton": "info", "texte": "Après la connexion, le terminal demande de choisir un code de verrouillage (voir « Code de verrouillage et empreinte »)."}]}, {"id": "term-verrou", "titre": "Code de verrouillage, empreinte et session perdue", "resume": "Le code à 6 chiffres qui protège le terminal, l'empreinte, le code oublié et les sessions fermées.", "mots_cles": ["verrou", "code", "empreinte", "code oublié", "session perdue", "révocation", "fin de remplacement"], "blocs": [{"type": "h", "texte": "Choisir son code"}, {"type": "etapes", "items": ["Étape 1 sur 2 : « Choisissez votre code » (6 chiffres).", "Étape 2 sur 2 : « Confirmez votre code ».", "Le terminal propose ensuite « Déverrouiller aussi par empreinte ? » : « Utiliser l'empreinte » ou « Code seulement »."]}, {"type": "p", "texte": "Un même chiffre répété ou une suite de chiffres sont refusés. L'empreinte est plus rapide entre deux patients ; le code reste toujours possible. Si une empreinte est ajoutée ou retirée sur le téléphone, l'empreinte se désactive et seul le code rouvre."}, {"type": "h", "texte": "Quand le terminal se verrouille"}, {"type": "liste", "items": ["Au lancement de l'application.", "Quand elle passe en arrière-plan.", "Après 5 minutes sans toucher l'écran, jamais pendant qu'un doigt est posé (signature maintenue)."]}, {"type": "p", "texte": "Après 5 codes faux, une attente s'impose : 30 secondes, puis elle double à chaque erreur, jusqu'à 15 minutes. Rien n'est jamais effacé à cause d'erreurs de code."}, {"type": "note", "ton": "attention", "texte": "Un téléphone sans verrouillage d'écran (ni code, ni schéma, ni empreinte) est refusé : « Verrouillage du téléphone requis ». Activer le verrouillage dans les réglages du téléphone, puis « Vérifier à nouveau »."}, {"type": "h", "texte": "Code oublié"}, {"type": "p", "texte": "« Code oublié ? » demande un nouveau code d'enrôlement au poste fixe, puis une reconnexion ; il faut le réseau. D'ici là, TabSanté reste fermé. Les envois en attente restent sur le téléphone, chiffrés, et partent après la reconnexion."}, {"type": "h", "texte": "Session perdue ou accès révoqué"}, {"type": "table", "entetes": ["Écran", "Pourquoi", "Ce que l'on peut faire"], "lignes": [["Reconnexion nécessaire", "La session a expiré", "Se reconnecter : la tournée et les saisies sont gardées"], ["Accès révoqué sur ce téléphone", "Terminal déclaré perdu, session fermée à distance, ou réutilisation suspecte de la connexion", "Envoyer d'abord (nouvel enrôlement, connexion, envoi) ou Effacer sans envoyer, avec confirmation"], ["Remplacement terminé / Habilitation de remplacement révoquée", "Fin du remplacement ou révocation par le cabinet", "Ce qui reste attend le cabinet ; seul un code du poste fixe rouvre le téléphone"]]}, {"type": "note", "ton": "info", "texte": "Effacer sans envoyer est définitif : l'écran dit combien d'envois seraient perdus."}]}, {"id": "term-tournee", "titre": "La tournée du jour", "resume": "L'onglet Tournée : progression, suggestions, prochain passage, suite de la journée.", "mots_cles": ["tournée", "prochain passage", "Ensuite", "progression", "suggestions", "écart horaire", "aide-soignante"], "blocs": [{"type": "p", "texte": "L'onglet Tournée s'ouvre sur la date, le nom de la tournée et « Bonjour » (ou « Bonsoir » après 18 h). La carte de progression compte les soins signés sur le total, le reste « à faire », et la pastille réseau mène à l'onglet Envois."}, {"type": "h", "texte": "Ce que montre la page"}, {"type": "liste", "items": ["Les bandeaux utiles : tournée d'un autre jour à recharger, données de plus de deux heures (« Données du … » avec « Recharger »), aucune tournée attribuée.", "« Suggestions » de la journée, lisibles hors connexion : gravité en icône et en mot, « Pourquoi ? » dépliable, « Faire » quand l'itinéraire peut s'en charger. Rien ne s'exécute seul ; écarter une suggestion se fait au poste fixe.", "L'itinéraire du moment en bref (arrêts, distance, fin estimée), qui ouvre la carte.", "« Prochain passage » (ou « Passage en cours » si une saisie est commencée) : la carte du patient.", "Les signalements de l'aide-soignante à décider, les rappels datés du jour, les échanges de tournée.", "« Ensuite » : les autres passages du jour, dans l'ordre de la tournée."]}, {"type": "h", "texte": "La carte du prochain passage"}, {"type": "p", "texte": "Elle montre le patient, son âge, le moment, ses contextes (chimiothérapie, HAD…), puis au plus deux points « À savoir » : saisie commencée, prérequis à confirmer, prescription modifiée, séance de perfusion du jour, rappel daté. Viennent ensuite le trajet et les soins du passage (une plaie porte son type, son ancienneté J+n et sa tendance)."}, {"type": "p", "texte": "Quand un soin du passage est déjà signé, la carte affiche son écart à l'heure prescrite, par exemple « réalisé à 6 h 15, 1 h 45 avant l'heure prescrite ». Cet écart est une information, jamais un blocage."}, {"type": "h", "texte": "Le bouton sous le pouce"}, {"type": "p", "texte": "En bas de l'écran, au-dessus des onglets : « Y aller » tant qu'on n'est pas parti, puis « Commencer le passage » (ou « Reprendre le passage »). Commencer le passage vaut arrivée chez le patient."}, {"type": "h", "texte": "Déclarer un passage non réalisé"}, {"type": "p", "texte": "Le lien « Non réalisé… » à côté du titre « Prochain passage », ou un appui long sur une ligne de « Ensuite », ouvre la déclaration sans entrer dans le passage."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : la tournée ne montre que les soins qu'elle signe. Un bandeau nomme les autres soins de la tournée, qui restent à l'infirmière."}, {"type": "note", "ton": "info", "texte": "Un patient dont le décès a été déclaré au poste fixe porte la mention « Décédé le … » sur la carte du prochain passage."}]}, {"id": "term-trajet", "titre": "Carte, itinéraire et « Avant d'arriver »", "resume": "Suivre la tournée sur la carte, partir avec « Y aller », préparer l'entrée chez le patient, prévenir d'un retard.", "mots_cles": ["carte", "itinéraire", "Y aller", "navigation", "Waze", "Google Maps", "Avant d'arriver", "retard", "prévenir le patient", "position", "prérequis"], "blocs": [{"type": "p", "texte": "La carte de la tournée montre le départ, les domiciles numérotés dans l'ordre, le trajet et la zone d'intervention. En ligne, le fond de carte vient d'OpenStreetMap ; hors connexion ou sans serveur de tuiles, le même tracé s'affiche sur un schéma."}, {"type": "p", "texte": "Chaque arrêt porte son arrivée estimée. En retard, l'heure prévue est barrée et le retard s'écrit en minutes (« + 12 min »), jamais par la seule couleur. Une fourchette « entre … et … » tient compte du trafic et de la météo."}, {"type": "h", "texte": "Y aller"}, {"type": "etapes", "items": ["Toucher « Y aller » : le départ est noté et part dans la file, même sans réseau.", "L'application de navigation s'ouvre sur les coordonnées du domicile seules, jamais le nom ni l'adresse du patient.", "Déjà en route, le bouton devient « Itinéraire » et rouvre la navigation sans noter un second départ."]}, {"type": "p", "texte": "L'application se choisit dans « Moi » › « Navigation et position » : Google Maps, Waze ou Plans (Apple). Si elle ne s'ouvre pas, le départ reste noté et le terminal propose d'en choisir une autre."}, {"type": "h", "texte": "Avant d'arriver"}, {"type": "liste", "items": ["Les alertes du dossier (une allergie en rouge).", "« À vérifier avant le passage » : les prérequis (à jeun, ordonnance, matériel…), à régler « Confirmé », « Non tenu » ou cocher « Patient prévenu », même hors connexion.", "« Accès au domicile » : digicode, étage, interphone, clés, stationnement, animaux, consignes, et la photo de l'entrée (« Photographier l'entrée » se fait en ligne).", "« Trajet » : météo, arrivée estimée, trafic, durée et distance.", "« Matériel à emporter », « Dernier passage », et le rappel « Vit seul : prévenir l'entourage en l'absence de réponse »."]}, {"type": "h", "texte": "Prévenir le patient d'un retard"}, {"type": "p", "texte": "Au-delà de 10 minutes de retard, ou quand une heure fixe ou prescrite ne peut plus être tenue, « Prévenir le patient » propose les numéros du dossier (le patient, sa personne de confiance, son entourage). Il ouvre l'appel ou un SMS prérempli : « Bonjour, votre infirmier(ère) aura environ 15 min de retard. » C'est le soignant qui l'envoie depuis son téléphone."}, {"type": "h", "texte": "Partage de position"}, {"type": "p", "texte": "Désactivé par défaut et réglé par le soignant seul, en ligne, dans « Moi » › « Navigation et position » › « Partager ma position approximative ». Accepté, la position n'est prise qu'au départ, au kilomètre près, pour estimer l'heure d'arrivée, et s'efface à l'arrivée."}, {"type": "note", "ton": "info", "texte": "Repères des domiciles, trajets, trafic et météo sont simulés : un ordre de grandeur, jamais une consigne. Le seuil de 10 minutes est provisoire."}, {"type": "note", "ton": "info", "texte": "Hors connexion, « Y aller » et « Commencer le passage » entrent dans la file et le téléphone recalcule les heures des arrêts suivants ; le serveur refait le calcul au retour du réseau."}]}, {"id": "term-patients", "titre": "Patients et fiche patient", "resume": "Chercher hors connexion, créer un patient provisoire, ouvrir la fiche d'un patient pour un moment.", "mots_cles": ["patients", "recherche", "hors connexion", "nouveau patient", "identité provisoire", "fiche patient", "reçu au cabinet"], "blocs": [{"type": "p", "texte": "L'onglet Patients liste les patients chargés sur le téléphone. Le champ de recherche (« Patient, transmission, ordonnance, tournée ») cherche hors connexion dans ce que le téléphone a chargé, sans accents ni majuscules. Le reste du cabinet se cherche au poste fixe."}, {"type": "h", "texte": "Créer un patient (infirmière)"}, {"type": "p", "texte": "« Nouveau patient » crée une identité provisoire sur le téléphone : identité, allergies, médecin traitant et personne de confiance (facultatifs). Elle part avec la file ; les téléservices d'identité et de droits sont appelés au serveur, sans jamais bloquer le soin. Les dossiers ressemblants se tranchent au poste fixe."}, {"type": "h", "texte": "La fiche patient"}, {"type": "liste", "items": ["Les soins du moment, à cocher ; un appui ouvre le soin dû.", "« Comment faire ? » : les contenus de savoir-faire du cabinet pour le soin.", "L'interrupteur « Reçu au cabinet » quand les soins de ce passage sont faits au cabinet, pas au domicile.", "Les dispositifs (cathéters, stomies…) et le lien « Poser un dispositif ».", "Les plaies actives, chacune avec « Commencer le passage » ou « Passage non programmé », et « Ouvrir une nouvelle plaie ».", "« Ajouter un soin », les rythmes prescrits, les prescriptions infirmières, les plaies clôturées et « Récidive… »."]}, {"type": "note", "ton": "info", "texte": "Aide-soignante : pas de création de patient, pas de prescriptions infirmières ; elle ne voit que les soins qu'elle signe."}]}, {"id": "term-passage", "titre": "Faire un passage", "resume": "Commencer le passage, suivre le mode visite, renseigner la fiche et utiliser le menu « Autres actions ».", "mots_cles": ["passage", "commencer", "mode visite", "check-list", "brouillon", "autres actions", "comment faire"], "blocs": [{"type": "etapes", "items": ["Toucher « Commencer le passage » (tournée ou fiche patient) : le passage s'ouvre en plein écran sur la saisie commencée, sinon sur le premier soin dû.", "Renseigner la fiche ; chaque appui est enregistré en brouillon sur le téléphone (« Brouillon enregistré »).", "Signer quand la barre du bas dit « Tout est renseigné »."]}, {"type": "h", "texte": "Mode visite"}, {"type": "p", "texte": "Pour un soin en plusieurs étapes, le mode visite s'active de lui-même : « Étapes du soin » liste les prérequis du passage puis chaque section de la fiche, à cocher (« Étape faite »), avec la progression « n sur N ». Il propose aussi la comparaison de la photo du jour avec celle de référence (« Glisser pour comparer ») et une « Note de relève » versée en transmission ciblée (« Verser à la relève »)."}, {"type": "note", "ton": "info", "texte": "Le mode visite ne remplace rien : cocher une étape n'écrit rien dans la fiche et ne débloque pas la signature. Seules les règles de la fiche décident. Le bouton « Quitter le mode visite » le referme."}, {"type": "h", "texte": "Le menu « Autres actions »"}, {"type": "p", "texte": "Loin du bouton qui signe, le menu de l'en-tête du patient rassemble les gestes rares :"}, {"type": "liste", "items": ["« Déclarer un événement critique » (et « Incident respiratoire » pour un patient trachéotomisé ou sous CPAP).", "« Écrire une transmission ciblée » (« Écrire une transmission » pour l'aide-soignante).", "Infirmière seulement : « Poser un rappel daté », « Photographier l'ordonnance », « Rédiger une prescription infirmière », « Saisir un résultat de biologie », « Score SEGA (fragilité) », « Historique glycémique » et « Protocole d'insuline » pour un patient diabétique, « Facturer avec la carte Vitale »."]}, {"type": "p", "texte": "Quitter une saisie non signée propose « Abandonner cette saisie ? » : les réponses et les photos du passage sont effacées du téléphone ; « Garder la saisie » la conserve."}, {"type": "note", "ton": "info", "texte": "Un passage commencé plus de 2 heures après le soin demande le « Motif de la saisie différée ». Le cabinet valide ensuite cette saisie au poste fixe ; le seuil de 2 heures est provisoire."}]}, {"id": "term-ajout-non-programme", "titre": "Ajouter un soin et passage non programmé", "resume": "Tracer un soin qui n'était pas prévu à ce passage, avec son motif.", "mots_cles": ["ajouter un soin", "non programmé", "imprévu", "motif", "soin régulé", "SAS", "PDSA"], "blocs": [{"type": "etapes", "items": ["Depuis la fiche patient, toucher « Ajouter un soin ».", "Chercher (« Rechercher un soin ») ou choisir dans « Prescrits pour … », puis dans le catalogue par famille : plaies et pansements ; injections et perfusions ; surveillance et prélèvements ; hygiène et traitements ; élimination, nutrition, dialyse ; respiration.", "Un soin dû à ce moment s'ouvre comme prévu ; sinon il s'ouvre « non programmé » et le motif est demandé."]}, {"type": "table", "entetes": ["Soin", "Motifs proposés"], "lignes": [["Pansement", "Souillure, Pansement décollé, Saignement, Douleur, Demande du patient ; geste de reprise facultatif : film transparent, renfort d'adhésif, réfection complète"], ["Autres fiches", "Demande du patient, Demande du médecin, Initiative infirmière, Rattrapage, Soin régulé (SAS, PDSA), Autre"]]}, {"type": "liste", "items": ["Plusieurs plaies ouvertes : « Quelle plaie ? », une saisie et une signature par plaie.", "Aucune plaie ouverte : la plaie s'ouvre depuis la fiche patient, jamais au fil d'un passage.", "Dispositif absent : l'écran de pose s'ouvre. Le cathéter de dialyse se prend en charge au poste fixe.", "Soin sans fréquence chez le patient : un passage imprévu est créé et part avec l'acte."]}, {"type": "note", "ton": "info", "texte": "« Soin régulé (SAS, PDSA) » est réservé à l'infirmière."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : seuls les soins qu'elle signe sont proposés. Ce qu'elle constate se signale depuis le nursing."}]}, {"id": "term-non-realise-partiel", "titre": "Soin non réalisé ou fait en partie", "resume": "Déclarer qu'un soin prévu n'a pas eu lieu, ou qu'il n'a été fait qu'en partie.", "mots_cles": ["non réalisé", "réalisation partielle", "acte partiel", "motif", "à jeun"], "blocs": [{"type": "h", "texte": "Soin non réalisé"}, {"type": "etapes", "items": ["Lien « Non réalisé… » de la tournée, appui long sur un passage, ou « Passage non réalisé… » d'une fiche.", "Cocher les soins du passage concernés.", "Choisir le motif : Patient absent, Refus du patient, Hospitalisation, Décès, Soin reporté, Empêchement, Autre (précision obligatoire). « Patient non à jeun » s'ajoute quand un soin demande d'être à jeun.", "Maintenir « Déclarer non réalisé »."]}, {"type": "p", "texte": "Le soin n'est ni tracé ni facturé ; le motif part au cabinet et reste dans l'historique de la prescription. Hors connexion, la déclaration part avec la file."}, {"type": "h", "texte": "Soin fait en partie"}, {"type": "p", "texte": "Dans la section « Réalisation » d'une fiche, choisir « Soin fait en partie », puis « Pourquoi ? » (refus du patient, état du patient, matériel manquant, soin interrompu, autre) et « Ce qui n'a pas été fait »."}, {"type": "note", "ton": "info", "texte": "Le passage se signe et se trace tel quel. Le cabinet revoit sa cotation avant toute facturation."}]}, {"id": "term-signature-recu", "titre": "Signer et lire le reçu", "resume": "La barre « Il manque », la signature maintenue, le reçu et la cotation de démonstration.", "mots_cles": ["signature", "maintenir", "Il manque", "reçu", "empreinte", "cotation provisoire", "correction", "corriger une valeur"], "blocs": [{"type": "p", "texte": "La barre du bas dit ce qui manque, dans l'ordre de l'écran (« Il manque : saignement, douleur »). Un appui sur la mention amène au premier champ concerné. Quand tout est saisi, elle dit « Tout est renseigné »."}, {"type": "h", "texte": "Signature maintenue"}, {"type": "p", "texte": "Maintenir le bouton une seconde (« Maintenez une seconde ») : une barre remplit le bouton et une légère vibration confirme. Relâcher avant annule, rien n'est signé. Avec les animations réduites ou un lecteur d'écran, un appui ouvre une confirmation. Au clavier, Espace ou Entrée maintenue."}, {"type": "note", "ton": "attention", "texte": "La signature horodate le passage : il ne pourra plus être modifié sur ce téléphone."}, {"type": "h", "texte": "Le reçu"}, {"type": "liste", "items": ["Titre accordé au soin (« Injection signée », « Constantes signées »…).", "« Réalisé le », « Signé par » et « Empreinte » : les 12 premiers caractères de l'empreinte calculée par le serveur, ou « calculée à la réception par le serveur » hors connexion.", "L'état d'envoi : « Transmis au cabinet », « Envoi en cours », ou « L'envoi partira tout seul dès le retour du réseau ».", "Pour une plaie, l'évolution depuis J0 avec la mesure du jour.", "Les actions : « Écrire une transmission », « Corriger une valeur », la suite de la tournée (« Patient suivant », « Plaie suivante », « Autre plaie ») ou « Retour à la tournée »."]}, {"type": "h", "texte": "Cotation affichée"}, {"type": "p", "texte": "Pour l'infirmière, le reçu montre la cotation provisoire, toujours marquée « Démonstration ». Hors connexion, elle n'est estimée que si l'acte correspond au passage prévu ; sinon le reçu dit « Cotation provisoire non estimée hors connexion ». Une divergence avec le serveur part en file de contrôle, arbitrée au poste fixe."}, {"type": "h", "texte": "Corriger une valeur"}, {"type": "p", "texte": "Un soin signé ne change jamais : « Corriger une valeur » ajoute une correction datée avec son motif obligatoire, confirmée par un appui maintenu."}, {"type": "note", "ton": "info", "texte": "La cotation vient d'un moteur de démonstration : elle n'est jamais facturable. L'aide-soignante ne voit aucune cotation."}]}, {"id": "term-plaies", "titre": "Plaies et pansements", "resume": "Ouvrir une plaie, faire le pansement, retirer fils ou agrafes, suivre un drain de Redon, clôturer.", "mots_cles": ["plaie", "pansement", "ouverture", "escarre", "photo", "clôture", "récidive", "Redon", "fils", "agrafes", "rectifier"], "blocs": [{"type": "h", "texte": "Ouvrir une plaie (infirmière)"}, {"type": "etapes", "items": ["Fiche patient : « Ouvrir une nouvelle plaie ».", "Étape 1 : toucher la région atteinte sur le schéma corporel (vues de face, de dos, région sacrée, talons), écrire la localisation, choisir le type : escarre, ulcère, chirurgicale, traumatique, brûlure, moignon, autre. Une plaie clôturée au même endroit est proposée en récidive.", "Étape 2 : dimensions initiales (cm), grandeur de référence, fistuleuse ou non, suture (fils, agrafes…), protocole initial facultatif lu sur l'ordonnance, puis la prescription d'origine ou « Sans ordonnance · accès direct » pour une plaie non chirurgicale.", "Toucher « Ouvrir la plaie et signer »."]}, {"type": "p", "texte": "Le stade d'une escarre est obligatoire (1 à 4 ou indéterminable). Localisation et type sont figés ensuite ; une erreur de saisie à l'ouverture se rectifie (« Rectifier l'ouverture… ») jusqu'au deuxième passage signé, par qui a ouvert."}, {"type": "h", "texte": "Le passage de pansement"}, {"type": "liste", "items": ["« Repris du passage du … » : gestes et produits du dernier passage, modifiables.", "Mesures du jour, ou « Inchangées depuis le … » ; un écart de plus de 50 % demande confirmation.", "« À confirmer à chaque passage » : saignement, douleur au soin (sur 10), signes infectieux locaux. Ces réponses ne sont jamais présélectionnées.", "Ablation prévue : nombre d'agrafes ou de fils retirés, obligatoire pour signer.", "Drain de Redon : chaque drain avec son volume recueilli, l'aspiration et « Retiré » ; une troisième séance depuis le retour à domicile est signalée, jamais bloquée.", "Photo facultative."]}, {"type": "h", "texte": "Photos"}, {"type": "p", "texte": "Le guide « Cadrer la photo » rappelle le cadrage : plaie au centre, réglette à côté, téléphone parallèle à la peau, à 20 cm environ. La photo se prend dans l'application, jamais depuis la galerie, et ne reste pas en clair sur le téléphone. Une photo prise plus de 2 heures avant le soin ou après sa signature est refusée par le serveur."}, {"type": "h", "texte": "Clôturer une plaie"}, {"type": "etapes", "items": ["Menu de la plaie : « Clôturer la plaie… ».", "Choisir le motif : cicatrisation, hospitalisation, décès, arrêt de prise en charge, autre (précision).", "Lire les conséquences : soins prévus retirés, autres plaies poursuivies, historique, mesures et photos conservés.", "Maintenir « Clôturer la plaie »."]}, {"type": "note", "ton": "attention", "texte": "Une plaie clôturée ne se rouvre pas. Une récidive ouvre un nouvel épisode, lié à la plaie clôturée."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-injections", "titre": "Injections", "resume": "Fiche 19 : une ligne par injection, son type, son produit, son lot et sa surveillance.", "mots_cles": ["injection", "fiche 19", "vaccin", "lot", "tuberculine", "allergènes", "sérum", "site"], "blocs": [{"type": "p", "texte": "La fiche trace une ou plusieurs injections au même passage. Chaque ligne a son type ; la voie en découle, elle ne se saisit pas."}, {"type": "p", "texte": "Types proposés : IV directe, IV en série, IV enfant de moins de 5 ans, intramusculaire, sous-cutanée, intradermique, versions immunodéprimé (IM, SC, IV), IV chimiothérapie, sérum, allergènes, implant sous-cutané, voie rectale, vaccination, vaccination sans prescription, pulvérisation, tuberculine (pose, lecture)."}, {"type": "h", "texte": "Exigé pour signer, ligne par ligne"}, {"type": "liste", "items": ["Le type, le produit et la dose ; « faite ou non », et le motif si elle n'est pas faite (refus, produit indisponible, patient absent, contre-indication, report médical, autre).", "Le site, choisi sur le schéma (sauf pulvérisation, voie rectale et lecture de tuberculine).", "Le numéro de lot pour un vaccin ou un sérum.", "La surveillance post-injection (1 à 240 min) pour un sérum ou des allergènes ; le protocole écrit et la transmission au prescripteur pour les allergènes.", "La lecture de tuberculine : son résultat et la transmission ; la pose programme la date de lecture."]}, {"type": "note", "ton": "attention", "texte": "L'insuline se trace en Suivi diabétique et les héparines en Anticoagulant : la fiche le signale si l'on saisit ces produits ici."}, {"type": "note", "ton": "info", "texte": "Pour un patient en contexte d'immunodépression, de cancer ou de chimiothérapie, le type adapté au contexte est exigé."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-prelevements", "titre": "Prélèvements et saignées", "resume": "Fiche 21 : voie, examens, tubes, contrôle d'identité, hémocultures et saignée.", "mots_cles": ["prélèvement", "fiche 21", "saignée", "hémocultures", "tubes", "laboratoire", "à jeun", "ferritinémie"], "blocs": [{"type": "p", "texte": "Voies proposées : ponction veineuse, ponction artérielle, saignée, cathéter central, chambre implantable, prélèvement aseptique (cutané, sécrétions, selles, urine, hémocultures)."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["La voie et « fait ou non » de chaque ligne ; le motif sinon (échec de ponction, veines inaccessibles, refus, patient non à jeun, patient absent, matériel manquant, prescription non conforme, ferritinémie sous le seuil pour une saignée, autre).", "Les examens et les tubes prélevés.", "Le contrôle d'identité, avec son heure, et l'étiquetage au lit.", "Le site quand la voie en a un.", "Hémocultures : chaque paire avec son site, différent de la paire précédente."]}, {"type": "p", "texte": "Sections complémentaires : « Acheminement au laboratoire » (par qui, remis à quelle heure), « Laboratoire », « Reporter le prélèvement »."}, {"type": "p", "texte": "Un prélèvement non fait parce que le patient n'était pas à jeun se déclare avec le motif « Patient non à jeun » : le prérequis du passage devient « non tenu »."}, {"type": "note", "ton": "info", "texte": "Le bon de prélèvement part au laboratoire par la messagerie sécurisée, simulée en démonstration."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-constantes", "titre": "Paramètres vitaux et épreuve de lever", "resume": "Fiche 18 : relevé des constantes, tension par position et par bras, épreuve de lever.", "mots_cles": ["paramètres vitaux", "constantes", "fiche 18", "tension", "température", "oxygène", "épreuve de lever", "IMC"], "blocs": [{"type": "p", "texte": "Le relevé porte au moins une constante. La tension se saisit avec sa position (assise, couchée, debout) et son bras ; plusieurs tensions peuvent être prises."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Systolique et diastolique, la systolique au-dessus de la diastolique.", "La méthode de la température.", "Air ambiant ou sous oxygène, et le débit sous oxygène (0 à 15 L/min).", "Un poids entre 0,3 et 400 kg ; le périmètre crânien seulement avant 60 mois.", "Relevé non fait : le motif (patient absent, refus, matériel indisponible, hospitalisé, état clinique, autre)."]}, {"type": "p", "texte": "Chaque champ affiche l'ancienneté de la dernière mesure. Le débit d'oxygène constaté se lit en regard du débit prescrit. L'IMC se calcule, il ne se saisit pas."}, {"type": "h", "texte": "Épreuve de lever"}, {"type": "etapes", "items": ["Depuis le bloc tension, ouvrir l'épreuve de lever (geste ponctuel).", "Noter la contention (sans, bas, chaussettes).", "Mesure couchée après 5 min de repos, puis « Le patient se lève — lancer le minuteur ».", "Mesures debout à 1 min puis à 3 min.", "Ou « Lever impossible » avec son motif : l'épreuve reste tracée, non réalisée."]}, {"type": "note", "ton": "info", "texte": "Les écarts sont calculés, jamais saisis, sans seuil ni alerte : l'infirmière lit et juge. Un malaise constitué ou une chute relève de l'événement critique."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : elle signe cette fiche quand le cabinet exerce en structure."}]}, {"id": "term-perfusions", "titre": "Perfusions IV et SC", "resume": "Fiches 4 et 5 : lignes de perfusion, repère du cathéter, sites sous-cutanés et tolérance.", "mots_cles": ["perfusion", "IV", "SC", "fiche 4", "fiche 5", "PICC", "chambre implantable", "VVP", "ligne", "rinçage", "nutrition parentérale"], "blocs": [{"type": "p", "texte": "Le cathéter IV ou le site SC est un objet suivi : le passage porte sur lui. Natures de cathéter IV : VVP, voie centrale, PICC, Midline, chambre implantable, autre."}, {"type": "h", "texte": "Lignes de perfusion"}, {"type": "p", "texte": "« Brancher une ligne » : produit, classe, volume (1 à 5 000 ml), débit (1 à 999 ml/h), ou « Enregistrer sans poser » avec un motif de non-pose. Une ligne se débranche avec son volume restant, au plus le volume posé."}, {"type": "h", "texte": "Perfusion IV : exigé pour signer"}, {"type": "liste", "items": ["Le repère externe du jour, et un commentaire si le cathéter a pu migrer.", "Le point de ponction et le rinçage.", "Le débit d'un palier ; la glycémie quand la nutrition parentérale le demande.", "Cathéter changé : site, localisation et dispositif posé."]}, {"type": "h", "texte": "Perfusion SC : exigé pour signer"}, {"type": "liste", "items": ["Le dispositif de chaque site posé (« Poser un site »).", "La confirmation d'un troisième site actif ; le motif du maintien d'un site au-delà de 72 h.", "Le motif d'un débit au-delà de 120 ml/h.", "La tolérance du site et l'écoulement."]}, {"type": "note", "ton": "attention", "texte": "Des lignes encore ouvertes bloquent la clôture d'un cathéter IV. Un cathéter qui se repose en établissement demande une clôture motivée, puis une reprise chaînée."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-stomies", "titre": "Stomies digestive et urinaire", "resume": "Fiches 2 et 3 : aspect, peau, appareillage, consommation et irrigation.", "mots_cles": ["stomie", "colostomie", "urostomie", "fiche 2", "fiche 3", "appareillage", "poche", "irrigation", "code produit"], "blocs": [{"type": "p", "texte": "La stomie est un objet suivi, une seule active par patient et par type."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["« À confirmer à chaque passage » : aspect de la stomie, peau péristomiale, saignement, douleur, effluents (ou aspect des urines).", "Poche changée ou non.", "Nouvelle référence de matériel : système, diamètre (10 à 100 mm) ou découpe (5 à 100 mm)."]}, {"type": "p", "texte": "Sections : « Appareillage », « Irrigation colique », « Surveillance urinaire », « Complications et éducation ». Le lot et la péremption se lisent sur le code produit, scanné ou saisi."}, {"type": "p", "texte": "À la clôture d'une stomie, une transmission ciblée est proposée au même écran, destinataires pré-cochés ; elle s'envoie ou s'écarte avec un motif."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-nutrition-enterale", "titre": "Nutrition entérale", "resume": "Fiche 8 : voie d'alimentation, repère, perméabilité, tolérance et sonde nasogastrique.", "mots_cles": ["nutrition entérale", "fiche 8", "sonde", "gastrostomie", "repère", "rinçage", "narine"], "blocs": [{"type": "p", "texte": "La voie d'alimentation est un objet continu : son compteur de jours ne repart jamais à zéro."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Un geste de la voie : le pansement seul ne fait pas un passage.", "L'état du site et le repère externe du jour.", "Le rinçage ; le consommable « autre » à nommer.", "Sonde changée : motif, nouvelle sonde (calibre et référence), narine, longueur introduite, repère externe, contrôle de position obligatoire."]}, {"type": "p", "texte": "Sections : « Repère externe ce jour », « Perméabilité », « Tolérance », « Gestes sur la voie », « Avant de signer ». Le résidu gastrique et les médicaments passés par la sonde sont tracés."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-diabete", "titre": "Suivi diabétique", "resume": "Fiche 10 : glycémie, dose proposée par le protocole, injection, HbA1c et historique.", "mots_cles": ["diabète", "fiche 10", "glycémie", "insuline", "protocole", "HbA1c", "lieu du soin"], "blocs": [{"type": "p", "texte": "La fiche suit le protocole d'insuline du patient : à partir de la glycémie, elle propose la dose de ce moment, même hors connexion. L'infirmière décide."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["La glycémie (0,10 à 6,00 g/L), ou le motif si elle n'est pas faite (refus, patient absent, lecteur défaillant, autre).", "Injection : oui ou non ; l'insuline injectée et son site, ou le motif (repas non pris, hypoglycémie, refus, produit indisponible, consigne médicale, autre).", "Un commentaire quand la dose s'écarte de la proposition.", "Mesure faite par le patient : son heure et la façon dont le relevé a été recueilli (lecteur du patient, carnet, appel du patient)."]}, {"type": "p", "texte": "Sections : « Lieu du soin » (domicile, école, périscolaire pour un enfant), « Glycémie », « Ce que propose le protocole », « Décision », « Relevé du patient », « HbA1c », « Prochain dosage »."}, {"type": "p", "texte": "Depuis le menu « Autres actions » : « Historique glycémique » (les passages dus non saisis y apparaissent « à faire ») et « Protocole d'insuline »."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-medicaments", "titre": "Médicaments et anticoagulant oral", "resume": "Fiche 6 et bloc AVK : pilulier, prises, renouvellement, INR.", "mots_cles": ["médicaments", "fiche 6", "pilulier", "AVK", "INR", "anticoagulant oral", "acte C", "fin de traitement"], "blocs": [{"type": "p", "texte": "La fiche trace la distribution ou la préparation des traitements à ce passage : le pilulier ou les lignes de médicaments."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Au moins une ligne ou le pilulier ; l'origine de la distribution ; le moment servi.", "Pour chaque médicament : pris ou non (« Tous pris » d'un geste), le motif sinon.", "Lignes saisies faute d'ordonnance : la mention de responsabilité.", "Un effet secondaire constaté : sa description."]}, {"type": "h", "texte": "Anticoagulant oral"}, {"type": "p", "texte": "La section « Anticoagulant oral » montre la posologie de la semaine. Il faut la dose du jour en mg et « pris ou non ». Un INR reçu se saisit (0 à 15) et le prochain INR se date après ce passage."}, {"type": "p", "texte": "« Fin de traitement… » arrête un traitement. Pour l'infirmière, un compteur rappelle les passages de l'acte C déjà faits."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-anticoagulant", "titre": "Anticoagulant injectable", "resume": "Fiche 11 : héparines et fondaparinux, dose, site, biologie de surveillance.", "mots_cles": ["anticoagulant", "fiche 11", "héparine", "HBPM", "plaquettes", "biologie", "site"], "blocs": [{"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["La classe, la spécialité, la visée et le dosage en cours.", "Injection faite ou non, et le motif sinon ; la dose injectée et qui l'a faite.", "Le site d'injection, l'aspect local (RAS compris) et « saignement : oui ou non »."]}, {"type": "p", "texte": "Sections : « Biologie de surveillance » (valeurs reçues) et « Prochains prélèvements » à dater après ce passage, avec leurs examens."}, {"type": "note", "ton": "attention", "texte": "L'héparine sodique par voie intraveineuse ne se trace pas ici."}, {"type": "note", "ton": "info", "texte": "L'historique des doses n'est jamais écrasé. « Fin de traitement… » se trouve en bas de la fiche, pour l'infirmière."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-nursing", "titre": "Nursing", "resume": "Fiche 12 : hygiène et confort, élimination, repas, prévention d'escarre, mobilisation.", "mots_cles": ["nursing", "fiche 12", "toilette", "change", "repas", "escarre", "rougeur", "phlyctène", "aide-soignante", "signalement"], "blocs": [{"type": "p", "texte": "C'est la fiche que l'aide-soignante signe. Elle compte au moins un soin tracé."}, {"type": "p", "texte": "Sections : « Hygiène et confort », « Élimination », « Étui pénien », « Aide au repas », « Prévention d'escarre », « Mobilisation ». Un soin hors liste s'ajoute avec son libellé (120 caractères au plus)."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Toilette partielle : les zones ; change ou toilette partielle, pas les deux.", "Chaque change : urines et selles.", "Aide au repas : oui ou non, fraction consommée, texture servie.", "Prévention : les zones traitées, pour chacune la rougeur et « Blanchit à la pression ? », le produit employé.", "Phlyctène : zone, aspect et protection.", "Le positionnement à la sortie."]}, {"type": "note", "ton": "attention", "texte": "Une rougeur qui ne blanchit pas ou une phlyctène : l'aide-soignante doit rédiger son signalement à l'infirmière pour signer ; une infirmière qui constate une phlyctène rédige une transmission ciblée."}, {"type": "note", "ton": "info", "texte": "Passage non réalisé : le motif est exigé."}]}, {"id": "term-pompes", "titre": "PCA, sédation et PSE", "resume": "Fiches 13-14 et 16 : pompes en service, doses, surveillance, seringues et réservoirs.", "mots_cles": ["PCA", "PSE", "pompe", "sédation", "RASS", "seringue", "réservoir", "stupéfiant", "fiche 16", "fiche 13-14"], "blocs": [{"type": "p", "texte": "L'épisode de pompe est l'objet suivi. Chaque pompe en service se contrôle à chaque passage."}, {"type": "h", "texte": "Contrôle de chaque pompe"}, {"type": "liste", "items": ["Débit affiché conforme ou non, volume restant lu (au plus le volume posé), alarmes (« aucune » si rien), alimentation.", "Un écart de volume demande confirmation et commentaire (« Écart confirmé après contrôle »).", "Un débit non conforme ou une alarme demande un commentaire ; selon le constat, un événement critique est à compléter."]}, {"type": "h", "texte": "PSE"}, {"type": "p", "texte": "Une seringue, un produit : deux produits font deux pompes. Il faut le produit, la quantité, le volume de la seringue (0,5 à 60 ml) et la vitesse (au plus 100 ml/h). « Modifier la vitesse » demande la nouvelle vitesse, son motif et la référence de la prescription."}, {"type": "h", "texte": "PCA et sédation"}, {"type": "liste", "items": ["Doses reçues, tentées et total sur 24 h, lues sur la pompe ; les tentées au moins égales aux reçues.", "Score de sédation, score respiratoire, douleur au repos et à la mobilisation.", "RASS quand une pompe de sédation est en service ; une cible RASS et le type de sédation sont exigés à sa mise en service.", "À la dernière dépose : devenir du reliquat et témoin."]}, {"type": "note", "ton": "attention", "texte": "Un 3, une réponse « autre » ou un RASS hors cible demandent un commentaire de surveillance. Une sédation profonde et continue exige la décision collégiale jointe."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-dialyse", "titre": "Dialyse péritonéale", "resume": "Fiche 17 : échanges manuels ou séance de cycleur, bilans, pansement, poids et tension.", "mots_cles": ["dialyse péritonéale", "fiche 17", "DPCA", "DPA", "cycleur", "échange", "poches"], "blocs": [{"type": "p", "texte": "Le cathéter de dialyse se prend en charge au poste fixe ; il apparaît au terminal à la précharge suivante. Modalités : manuelle (DPCA) ou cycleur (DPA)."}, {"type": "p", "texte": "Le passage porte au moins un geste : échange, séance, pansement, poids ou tension."}, {"type": "h", "texte": "Séance de cycleur"}, {"type": "etapes", "items": ["« Brancher la séance » : heure du branchement, poches installées (produit et lot), programme confirmé ; un programme différent du prescrit demande un commentaire.", "« Débrancher la séance » : heure, bilan de la nuit lu sur la machine, volumes lus sur le cycleur.", "Un bilan des 24 h qui s'écarte du précédent est à confirmer."]}, {"type": "p", "texte": "Une séance non branchée se dit (« Séance non branchée… ») avec sa raison. « Changer de modalité… » demande la nouvelle modalité, sa prescription et son motif."}, {"type": "h", "texte": "Pansement de l'émergence"}, {"type": "p", "texte": "État cutané péri-cathéter, prolongateur, et la date du prochain pansement."}, {"type": "note", "ton": "info", "texte": "Les volumes sont tracés, jamais transmis au moteur de cotation. La journée de dialyse court de 8 h à 8 h."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-alr", "titre": "Analgésie locorégionale", "resume": "Fiche 23 : prise en charge du cathéter, réinjection, surveillance, retrait et conduite d'urgence.", "mots_cles": ["ALR", "analgésie locorégionale", "fiche 23", "péridurale", "périnerveux", "neuraxial", "accord préalable", "bloc moteur"], "blocs": [{"type": "p", "texte": "Le cathéter d'analgésie se prend en charge au domicile : protocole (titre, consignes, photo de la pièce), type de bloc, latéralité, pompe prescrite."}, {"type": "h", "texte": "Réinjection : exigé pour signer"}, {"type": "liste", "items": ["L'injection prescrite (produit, dose, volume) et l'aspiration avant injection.", "Injecter, ou dire pourquoi ; un contrôle anormal se motive.", "La sédation, le bloc moteur des deux membres inférieurs, les signes de toxicité.", "La fréquence respiratoire et la tension, tracées en Paramètres vitaux."]}, {"type": "p", "texte": "La température du jour se lit dans Paramètres vitaux, jamais ressaisie."}, {"type": "h", "texte": "Retrait"}, {"type": "liste", "items": ["Pompe arrêtée avant le retrait.", "Le geste (résistance, extrémité) et la longueur retirée cohérente avec le repère.", "Le point après retrait, le reliquat, le devenir de la pompe, les consignes données."]}, {"type": "note", "ton": "attention", "texte": "Signe d'alerte : l'écran critique propose « Arrêter la pompe maintenant », « Appeler le 15 » et « Déclarer un événement critique »."}, {"type": "note", "ton": "info", "texte": "Neuraxial : tant que l'accord préalable n'est pas « accordé », l'injection reste possible et tracée, mais retenue. Aucune acceptation implicite."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-respiratoire", "titre": "Soins respiratoires", "resume": "Fiche 22 : aérosols, aspirations, trachéotomie et CPAP.", "mots_cles": ["respiratoire", "fiche 22", "trachéotomie", "canule", "aspiration", "aérosol", "CPAP", "nébulisation"], "blocs": [{"type": "p", "texte": "Un passage par patient et par moment, qu'il porte sur la trachéotomie, la CPAP ou le patient seul."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Un acte du passage ; pour chaque produit nébulisé, « fait ou non » et sa tolérance.", "Aspiration : aspect et abondance des sécrétions, tolérance.", "Trachéotomie : perméabilité de la canule, état péristomial, rougeur graduée, tolérance, protection posée, taille de la canule changée.", "CPAP : interface, points d'appui et leur état, tolérance, fuites."]}, {"type": "p", "texte": "Une lésion d'appui se relève en surveillance ; devenue plaie, son pansement se trace en Pansements tant qu'elle est ouverte. « Signaler au prestataire » sert aux problèmes de l'appareil."}, {"type": "note", "ton": "info", "texte": "Canule obstruée, décanulation accidentelle ou désaturation se déclarent depuis le menu « Autres actions » (« Incident respiratoire »), par tous."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-ugd", "titre": "Uro-génito-digestif", "resume": "Fiche 20 : sonde urinaire, cystostomie, lavements, autosondage, relevés d'élimination.", "mots_cles": ["uro-génito-digestif", "fiche 20", "sonde urinaire", "cystostomie", "lavement", "autosondage", "diurèse"], "blocs": [{"type": "p", "texte": "La fiche trace au moins un acte ou un relevé, choisi avec « Ajouter un acte »."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Une réponse et, si besoin, un motif pour chaque acte.", "Pose de sonde : matériau et charrière, volume du ballonnet, prescription.", "Sonde à demeure : perméabilité, fixation, poche déclive ou non.", "Cystostomie : pansement réalisé ou non, état péri-orifice, cathéter fixé et perméable.", "Diurèse mesurée ou estimée (pas les deux), avec sa période."]}, {"type": "p", "texte": "Le lavement suit la condition de l'ordonnance : condition remplie, réponse obligatoire ; non remplie, « non requis ce jour »."}, {"type": "note", "ton": "attention", "texte": "Le sexe du patient compte pour la cotation : s'il manque au dossier, il se saisit au cabinet."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-neuropsy", "titre": "Surveillance neuropsychiatrique", "resume": "Fiche 15 : signes observés, rapports de l'entourage, historique.", "mots_cles": ["neuropsychiatrique", "fiche 15", "sédation", "tremblements", "raideur", "rapport", "entourage"], "blocs": [{"type": "p", "texte": "Quatre troubles se renseignent à chaque passage : comportement, langage, humeur et conscience, chacun avec son intensité, d'« Absent » à « Majeur ». S'y ajoutent les signes de tolérance du traitement, dont la sédation, les tremblements, la raideur, l'impatience motrice et les mouvements anormaux."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Une réponse pour chaque signe ; « non évaluable » ou le qualificatif « autre » demandent un commentaire.", "Ce que rapporte un tiers : qui le rapporte, son nom, l'intensité rapportée et la date.", "Observation non réalisée : le motif."]}, {"type": "p", "texte": "L'écart à l'état habituel du patient s'affiche. « Historique » montre les observations récentes, même hors connexion. Des vertiges au lever renvoient à l'épreuve de lever en Paramètres vitaux."}, {"type": "note", "ton": "info", "texte": "La fiche n'est pas cotable."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : elle constate et signale ; la fiche est signée par une infirmière."}]}, {"id": "term-consultation", "titre": "Consultations, séances et bilans", "resume": "Fiche 24 au domicile, séances de parcours, brouillon partagé, bilans rédigés au cabinet.", "mots_cles": ["consultation infirmière", "fiche 24", "CIA", "CIB", "bilan de prévention", "art. 5 ter", "RAAC", "séance", "brouillon partagé", "bilan"], "blocs": [{"type": "p", "texte": "Sous-fiches disponibles au terminal : consultation CIA, consultation CIB, bilan de prévention, consultation infirmière, séance post-hospitalisation (art. 5 ter), séance postopératoire RAAC. Chacune a un tronc commun et un volet propre."}, {"type": "h", "texte": "Ce qui peut être exigé"}, {"type": "liste", "items": ["L'évaluation clinique, au moins un diagnostic infirmier, un objectif daté, une action réalisée, une synthèse.", "L'orientation (vers qui, pour quoi) et la prochaine consultation datée.", "CIA : qui injecte, les hypoglycémies depuis la dernière consultation.", "Bilan de prévention : la déclaration qu'aucun bilan n'a été fait ailleurs pour cette tranche d'âge, des thèmes de la trame de la tranche, une priorité choisie avec le patient, ce qu'il accepte de partager.", "Séance post-hospitalisation : les signes cliniques et l'automesure tensionnelle ; séance RAAC : une anomalie relevée ou non."]}, {"type": "h", "texte": "Brouillon partagé"}, {"type": "p", "texte": "Pour ces sous-fiches, le brouillon est commun aux infirmières du cabinet. Si une collègue l'a modifié entre-temps, la signature attend le choix : « Garder le mien » ou « Reprendre le leur »."}, {"type": "h", "texte": "Séances de parcours"}, {"type": "p", "texte": "Une séance (séance hebdomadaire, accompagnement médicamenteux…) liste ses « Éléments exigés » et ce que les fiches signées au même passage ont déjà tracé. Elle ne se clôt pas incomplète, hors fenêtre du parcours ou au-delà du plafond."}, {"type": "h", "texte": "Bilans"}, {"type": "p", "texte": "Un bilan dû dans la tournée ne se saisit pas au domicile : il se rédige, se relit et se signe au poste fixe, dans « Bilans dus »."}, {"type": "note", "ton": "info", "texte": "Les montants et dates d'effet de ces consultations relèvent du moteur de cotation ; la cotation affichée reste de démonstration."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : elle ne voit pas le contenu des consultations."}]}, {"id": "term-liaisons", "titre": "Liaisons : transmissions, mentions et notifications", "resume": "Lire et écrire les transmissions, répondre aux interpellations, décider des propositions.", "mots_cles": ["liaisons", "transmission", "ciblée", "intra-cabinet", "mention", "@", "interpellation", "notification proposée", "événement critique", "signalement"], "blocs": [{"type": "p", "texte": "L'onglet Liaisons a deux segments : « Transmissions » et « Notifications ». Les transmissions se lisent hors connexion ; une lecture faite hors ligne part au retour du réseau."}, {"type": "h", "texte": "Écrire une transmission"}, {"type": "etapes", "items": ["Toucher « Écrire ».", "Choisir ciblée (sur un patient) ou intra-cabinet (un soignant, la tournée, le cabinet).", "Ciblée : patient, cible, puis « Données », « Actions », « Résultat ». Taper @ pour mentionner un membre du cabinet : il sera notifié.", "Cocher si besoin « Interpeller le cabinet » (« Demander l'avis d'une infirmière » pour l'aide-soignante) : une réponse est attendue.", "Toucher « Envoyer la transmission » ; hors connexion, elle partira au retour du réseau."]}, {"type": "p", "texte": "Une transmission qui vous cite porte la pastille « Mention pour vous ». « Entretien infirmier » (infirmière) rattache l'entretien au soin qui vient d'être signé : tracé, jamais coté."}, {"type": "h", "texte": "Interpellations"}, {"type": "p", "texte": "Une interpellation se lit et se traite au terminal : « Répondre et marquer traitée ». La réponse est horodatée, signée du nom de qui répond, et part avec la file."}, {"type": "h", "texte": "Propositions à décider"}, {"type": "liste", "items": ["Transmission proposée après un événement critique : relire, compléter, « Confirmer et émettre » ou « Écarter la proposition… » avec un motif.", "Notification proposée (segment Notifications, « À valider ou écarter ») : contenu prêt, destinataires pré-cochés ; valider l'envoi, retirer un destinataire, ou écarter avec un motif."]}, {"type": "h", "texte": "Événement critique"}, {"type": "p", "texte": "Menu « Autres actions » › « Déclarer un événement critique », une fois le patient en sécurité. Pas de confirmation préalable : l'événement part dans la file, puis la transmission et la notification sont proposées."}, {"type": "h", "texte": "Signalement de l'aide-soignante"}, {"type": "p", "texte": "L'infirmière décide : surveillance renforcée, plaie ouverte et rattachée, ou sans suite ; « Enregistrer la décision ». La décision ne se réécrit pas."}, {"type": "note", "ton": "info", "texte": "La messagerie sécurisée vers les correspondants est simulée en démonstration."}]}, {"id": "term-envois", "titre": "Hors connexion et onglet Envois", "resume": "Ce qui marche sans réseau, la file d'envoi, les refus à corriger et la base mise de côté.", "mots_cles": ["hors connexion", "Envois", "file", "synchronisation", "précharge", "à corriger", "abandonner", "réessayer", "quarantaine"], "blocs": [{"type": "p", "texte": "Sans réseau, on soigne et on signe normalement. Chaque signature entre dans la file d'envoi, chiffrée sur le téléphone. L'envoi est automatique : toutes les 20 secondes, et dès le retour du réseau."}, {"type": "h", "texte": "La précharge"}, {"type": "p", "texte": "La tournée, les dossiers utiles, les transmissions, les itinéraires et le savoir-faire du jour sont chargés à l'avance. En ligne, le terminal vérifie toutes les 5 minutes et au retour de l'application au premier plan s'ils ont changé. Un bandeau « Données du … » prévient au-delà de 2 heures ; « Recharger la tournée du jour » est dans « Moi »."}, {"type": "h", "texte": "L'onglet Envois"}, {"type": "liste", "items": ["Une phrase d'état : « Tout est transmis » avec l'heure de la dernière synchronisation, ou ce qui attend.", "Les refus d'abord : le serveur dit pourquoi, rien n'a été transmis.", "Puis ce qui attend, par patient, et les photos.", "« Réessayer maintenant » relance l'envoi sans attendre."]}, {"type": "h", "texte": "Un envoi refusé"}, {"type": "p", "texte": "« Corriger et renvoyer » rouvre la saisie pré-remplie, le motif du refus en tête ; la nouvelle signature remplace l'envoi refusé. « Abandonner » demande confirmation et dit ce que l'abandon emporte. Certains refus ne se corrigent pas (geste hors de la période d'un remplacement, saisie trop tardive) : on les donne au cabinet, qui ressaisit au poste fixe, puis on abandonne."}, {"type": "h", "texte": "Ce qui exige le réseau"}, {"type": "liste", "items": ["Enrôlement et première connexion.", "Téléservices (identité, droits) : « Connexion requise », jamais un bouton qui échoue.", "Planning, photo de l'entrée, fond de carte, partage de position."]}, {"type": "h", "texte": "Base mise de côté"}, {"type": "p", "texte": "Si la base chiffrée du téléphone devient illisible, elle est mise de côté, jamais effacée, et l'écran « Base mise de côté » le dit : garder l'application, appeler le support avec la référence affichée ; sinon ressaisir les soins concernés en saisie différée, motif « terminal illisible »."}, {"type": "note", "ton": "attention", "texte": "« Changer d'intervenant » n'est possible qu'une fois tous les envois partis, pour que rien ne se perde."}]}, {"id": "term-notifications", "titre": "Notifications locales et heures calmes", "resume": "Les avis que le téléphone calcule lui-même, sans réseau, et leur réglage.", "mots_cles": ["notifications", "heures calmes", "rappel", "mention", "retard", "tournée validée"], "blocs": [{"type": "p", "texte": "Le terminal calcule lui-même ses avis, à partir de ce qu'il a chargé : rien ne part au réseau."}, {"type": "liste", "items": ["Rappel daté échu (une heure avant le passage quand l'heure est connue).", "Tournée de demain validée.", "Transmission qui vous mentionne.", "Retard sur la tournée."]}, {"type": "p", "texte": "Ils s'affichent en bandeau en haut de l'application, qui se ferme seul au bout de 8 secondes."}, {"type": "h", "texte": "Régler"}, {"type": "etapes", "items": ["« Moi » › « Notifications ».", "Activer ou couper « Notifications de ce téléphone ».", "Régler « Heures calmes à partir de » et « jusqu'à » (21 h à 7 h par défaut)."]}, {"type": "p", "texte": "Pendant les heures calmes, rien ne s'affiche : ce qui est dû attend leur fin."}, {"type": "note", "ton": "info", "texte": "Une notification ne dit jamais le nom du patient ni son soin : au plus la civilité et l'initiale, par exemple « Rappel : passage chez M. B. à 9 h »."}, {"type": "note", "ton": "attention", "texte": "La notification système d'Android et d'iOS n'est pas encore branchée : l'avis s'affiche dans l'application ouverte. Dans le navigateur, « Notifier aussi hors de l'onglet » est proposé."}]}, {"id": "term-planning", "titre": "Planning, absences et échanges", "resume": "Préparer la tournée de demain, déclarer ses absences, lire ses indicateurs, échanger une tournée.", "mots_cles": ["planning", "préparer demain", "absence", "indisponibilité", "indicateurs", "échange de tournée", "heure fixe"], "blocs": [{"type": "p", "texte": "Le planning s'ouvre depuis « Moi » › « Organisation » › « Préparer demain, absences, indicateurs ». Il se lit et se règle en ligne ; la tournée du jour reste utilisable hors connexion."}, {"type": "h", "texte": "Préparer demain"}, {"type": "p", "texte": "Pour chaque tournée de demain : l'ordre proposé face à l'ordre actuel, avec la fin et la durée estimées, les alertes et les heures fixes. Valider (« Valider l'ordre proposé » ou « Garder l'ordre actuel ») revient à qui tient la tournée à ce moment, ou à qui organise les tournées."}, {"type": "p", "texte": "Toucher un patient pose ou retire une heure fixe (rendez-vous, insuline à heure dite), pour ce jour ou aussi les suivants. « Proposer un ordre » ne la déplace jamais."}, {"type": "h", "texte": "Déclarer une absence"}, {"type": "etapes", "items": ["« Déclarer une absence ».", "Choisir « Du » et « Au » (ou « Sans terme »), ou « Chaque semaine » certains jours.", "Choisir des moments, ou aucun pour toute la journée."]}, {"type": "p", "texte": "Le motif ne se lit que par vous et par qui organise les tournées."}, {"type": "h", "texte": "Mes indicateurs"}, {"type": "p", "texte": "Sur les 14 derniers jours : kilomètres, trajet, soins, remplissage, passages prévus, réalisés et non réalisés. Aucun montant."}, {"type": "h", "texte": "Échanges de tournée"}, {"type": "p", "texte": "« Moi » › « Proposer un échange de tournée » : la période, ce que vous cédez, à qui, ce que vous reprenez (ou rien). Le collègue accepte ou refuse sur son téléphone ; hors connexion, la proposition ou la réponse part en premier au retour du réseau. Un échange qui tombe sur une de vos absences sera refusé par le serveur."}, {"type": "note", "ton": "info", "texte": "Kilomètres et temps viennent d'itinéraires simulés : des estimations."}]}, {"id": "term-facturer", "titre": "Facturer au domicile (simulé)", "resume": "Lire la carte Vitale et sécuriser une feuille de soins de démonstration.", "mots_cles": ["FSE", "carte Vitale", "CPS", "facturation", "SESAM-Vitale", "simulé", "téléservices"], "blocs": [{"type": "note", "ton": "attention", "texte": "Démonstration : lecteur de cartes et SESAM-Vitale simulés. Aucune feuille de soins réelle ne part."}, {"type": "etapes", "items": ["Menu « Autres actions » › « Facturer avec la carte Vitale » (infirmière).", "« Lire la carte Vitale du patient » : les cartes se lisent sans réseau et ne quittent pas le téléphone.", "Choisir les actes à facturer.", "« Créer et sécuriser la FSE » en ligne, ou « Sécuriser la FSE au domicile » sans réseau."]}, {"type": "p", "texte": "La FSE se sécurise avec la carte de l'infirmière qui a réalisé les actes. Sans réseau, il faut être connectée par sa carte CPS ; la FSE part au retour du réseau, derrière les actes, que le cabinet cote et reconfirme d'abord."}, {"type": "h", "texte": "Services en ligne"}, {"type": "p", "texte": "Dans la fiche du patient, identité nationale (INSi), droits (ADRi) et carte Vitale versée au dossier se demandent en ligne. Hors connexion, chacun dit « Connexion requise » et ce qu'il reste à faire ; rien ne bloque le soin."}, {"type": "note", "ton": "info", "texte": "DMP, accès QR des correspondants et lots de feuilles de soins se gèrent au poste fixe."}]}, {"id": "term-dossier", "titre": "Dossier et plan de soins au terminal", "resume": "Consulter le dossier, le plan de soins hors connexion, les mentions du patient et les autres saisies.", "mots_cles": ["dossier", "plan de soins", "ordonnance", "protocole", "décès", "SEGA", "résultat", "prescription infirmière", "ordonnance photographiée"], "blocs": [{"type": "p", "texte": "La fiche patient porte ses alertes (allergies…), ses mentions et la carte « Dossier » : groupe sanguin, traitements de fond, contacts, entourage."}, {"type": "h", "texte": "Plan de soins"}, {"type": "p", "texte": "« Plan de soins » (infirmière) s'ouvre depuis le dossier, même hors connexion : chaque ordonnance avec ses actes et ses fréquences, puis les protocoles en vigueur (version, date, consignes). Il arrive avec la tournée."}, {"type": "h", "texte": "Autres saisies de l'infirmière"}, {"type": "liste", "items": ["« Photographier l'ordonnance » : la photo est versée au dossier, la validation se fait au cabinet.", "« Rédiger une prescription infirmière » : lignes du référentiel prescriptible de démonstration, puis signature ; l'ordonnance PDF est établie et versée au dossier du patient.", "« Saisir un résultat de biologie ».", "« Score SEGA (fragilité) ».", "Accords préalables : demande et réponse reçue."]}, {"type": "h", "texte": "Décès d'un patient"}, {"type": "p", "texte": "Le décès se déclare au poste fixe. Au terminal, le patient porte alors la mention « Décédé le … » dans son en-tête et sur la carte du prochain passage ; le serveur retire ses passages dus des tournées."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : ni plan de soins, ni prescriptions, ni accords préalables, ni bilan de prévention."}, {"type": "note", "ton": "info", "texte": "« Comment faire ? » : les contenus publiés du cabinet (gestes, vidéos, questions, documents) se lisent hors connexion ; « Poser une question » envoie une question qu'un référent relit avant de la publier."}]}]}, {"id": "faq", "titre": "Questions fréquentes", "public": "tous", "pages": [{"id": "faq-essentiel", "titre": "L'essentiel : démonstration, hébergement, mise en service", "resume": "Peut-on l'utiliser avec de vrais patients, où sont les données, que veulent dire « simulé » et « provisoire ».", "mots_cles": ["démonstration", "HDS", "hébergement", "mise en service", "simulé", "provisoire", "bloqué", "vraies données"], "blocs": [{"type": "faq", "items": [{"q": "Puis-je utiliser TabSanté avec de vrais patients aujourd'hui ?", "r": "Non. TabSanté tourne en mode démonstration. Avant toute donnée réelle, il faut la carte CPS réelle par Pro Santé Connect (le courtier d'identité Keycloak est installé, Pro Santé Connect y est encore simulé), un hébergeur certifié HDS, la désignation d'un délégué à la protection des données (DPO), un service de clés réel pour le chiffrement des fichiers, l'ancrage hors site du journal d'audit et la copie hors site des sauvegardes."}, {"q": "Où les données sont-elles hébergées ? TabSanté est-il certifié HDS ?", "r": "L'hébergeur certifié HDS (hébergeur de données de santé) n'est pas encore choisi : c'est un élément bloqué de la couverture du CDC. La documentation d'exploitation liste ce que l'application exige de lui (certificat, hébergement en France sur deux sites, chiffrement du volume, sauvegardes hors site). Aujourd'hui, la base PostgreSQL tourne dans un conteneur sur le poste de développement."}, {"q": "Que veulent dire « Simulé », « Provisoire », « Partiel » et « Bloqué » ?", "r": "Simulé : le chemin est complet, mais une doublure de démonstration tient la place d'un service tiers (SESAM-Vitale, INSi, DMP, moteur de cotation…) ; jamais à facturer. Provisoire : une valeur prudente est branchée en attendant une décision (un seuil, un délai). Partiel : une partie seulement existe. Bloqué : cela dépend d'un tiers ou d'une décision, rien ne peut avancer sans eux."}, {"q": "Peut-on facturer avec TabSanté ?", "r": "Pas encore. Le circuit complet existe (cotation, contrôle, FSE, lots, retours, rejets) mais sur des doublures. Il manque le moteur NGAP réel de TABSANTE, le composant SESAM-Vitale et son agrément (décision D-07), et les vrais lecteurs de cartes."}, {"q": "Des données quittent-elles la plateforme ?", "r": "Du serveur, non : tous les services externes sont simulés et la lecture d'ordonnance tourne en local. Depuis les clients, en démonstration : le fond de carte est demandé à un serveur de tuiles public (les tuiles révèlent la zone affichée) ; l'application de navigation reçoit les seules coordonnées du domicile, jamais le nom ni l'adresse ; un SMS de retard part du téléphone de l'infirmier, au texte neutre."}, {"q": "Le site public est-il en ligne ?", "r": "Non. Il est construit mais des informations légales et commerciales restent à compléter ; tant qu'il en manque une, chaque page porte « Version de travail » et n'est pas indexée. Il ne promet ni certification HDS, ni agrément, ni prix."}]}]}, {"id": "faq-hors-connexion", "titre": "Hors connexion et synchronisation", "resume": "Ce qui marche sans réseau, où voir ce qui n'est pas parti, que faire d'un envoi refusé.", "mots_cles": ["hors connexion", "réseau", "synchronisation", "file d'envoi", "Envois", "précharge", "à corriger"], "blocs": [{"type": "faq", "items": [{"q": "Que se passe-t-il si je n'ai pas de réseau ?", "r": "Rien ne s'arrête : vous soignez et signez normalement. Chaque signature entre dans la file d'envoi, chiffrée sur le téléphone. L'envoi repart de lui-même toutes les 20 secondes et dès le retour du réseau. Départs et arrivées de la tournée entrent aussi dans la file, et le téléphone recalcule les heures d'arrivée."}, {"q": "Qu'est-ce qui exige le réseau ?", "r": "L'enrôlement et la première connexion, les téléservices (identité, droits), la mise en lot et la télétransmission, le planning, la photo de l'entrée du domicile, le fond de carte (un schéma le remplace) et le partage de position."}, {"q": "Où voir ce qui n'est pas encore parti ?", "r": "Dans l'onglet « Envois » du terminal (pastille ambre) : d'abord les envois à corriger, puis ceux en attente, par patient, et les photos. « Réessayer maintenant » relance l'envoi sans attendre."}, {"q": "Un envoi est « à corriger » : que faire ?", "r": "Le serveur a refusé l'opération et dit pourquoi. « Corriger et renvoyer » rouvre la saisie pré-remplie ; la nouvelle signature remplace l'envoi refusé. « Abandonner » le retire, après confirmation. Un refus de délai (geste hors de la période d'un remplacement, saisie trop tardive) ne se corrige pas : le cabinet ressaisit au poste fixe, puis on abandonne."}, {"q": "Mes données de tournée sont-elles à jour ?", "r": "La tournée et les dossiers utiles sont préchargés. En ligne, le terminal compare sa précharge au serveur toutes les 5 minutes et au retour au premier plan, et ne la recharge que si elle a changé. Un bandeau prévient quand elle a plus de 2 heures ; « Recharger la tournée du jour » est dans « Moi »."}, {"q": "Le cabinet voit-il qu'un téléphone ne synchronise plus ?", "r": "Oui. Le poste fixe signale un terminal non synchronisé pendant une tournée en cours, au-delà d'un seuil réglable (2 heures par défaut, question Q-71), avec « Appeler » et « Marquer comme vu »."}, {"q": "Le terminal parle d'une base « mise de côté » : ai-je perdu mes données ?", "r": "Non. Quand la base chiffrée du téléphone devient illisible, elle est mise de côté, jamais effacée, et un écran vous le dit. Gardez l'application et appelez le support avec la référence affichée."}]}]}, {"id": "faq-securite", "titre": "Sécurité et protection des données", "resume": "Chiffrement, verrouillage, terminal perdu, journaux, recherche tracée, géolocalisation des soignants.", "mots_cles": ["sécurité", "chiffrement", "verrou", "code", "terminal perdu", "journal des accès", "journal d'audit", "RGPD", "géolocalisation"], "blocs": [{"type": "faq", "items": [{"q": "Comment les données du terminal sont-elles protégées ?", "r": "La base locale est chiffrée enregistrement par enregistrement, avec une clé gardée dans le coffre de clés du téléphone. Les photos sont des fichiers chiffrés à part. Un code à 6 chiffres (ou l'empreinte digitale) verrouille l'application au lancement, en arrière-plan et après 5 minutes sans toucher l'écran. Captures d'écran et sauvegarde Android sont interdites."}, {"q": "J'ai oublié mon code de verrouillage : que faire ?", "r": "« Code oublié » efface le secret de l'appareil : il faut un nouvel enrôlement (code à demander au cabinet) puis une nouvelle connexion. La file d'envoi est conservée : rien de ce qui a été signé n'est perdu."}, {"q": "Un terminal est perdu ou volé : que faire ?", "r": "Révoquez-le au poste fixe, page « Terminaux ». Il ne peut plus ouvrir ni rafraîchir aucune session ; à sa prochaine connexion, précharge, brouillons et jetons sont effacés. S'il restait des envois, la file reste chiffrée et l'utilisateur choisit « Envoyer d'abord » (après un nouvel enrôlement) ou « Effacer sans envoyer »."}, {"q": "Les données sont-elles chiffrées au serveur ?", "r": "Photos et PDF sont chiffrés par l'application, fichier par fichier, avec une clé par fichier enveloppée par une clé maîtresse. En démonstration, cette clé maîtresse vient d'un trousseau local simulé, que le serveur refuse hors développement : le service de clés de l'hébergeur doit être branché. Les sauvegardes sont chiffrées. La base elle-même s'appuie sur le chiffrement du volume chez l'hébergeur, à exiger au contrat."}, {"q": "Qui a consulté le dossier d'un patient ?", "r": "Le journal des accès trace chaque lecture nominative, un patient par ligne, ainsi que les rafraîchissements de session et les refus d'accès. Il se lit au poste fixe (« Paramètres », « Journal des accès ») avec filtres et export CSV, réservé aux titulaires, responsables et à l'administration. Les traces d'un patient figurent aussi dans « Droits du patient »."}, {"q": "Une donnée signée peut-elle être modifiée en douce ?", "r": "Non. Un acte signé est immuable en base : on le corrige par un ajout motivé, l'original reste lisible. Le journal d'audit chaîne chaque écriture à la précédente par une empreinte, et sa tête est copiée chaque nuit hors de la base. Depuis le 21 octobre, ce journal ne garde plus de copie clinique : des références, les champs changés et des empreintes."}, {"q": "La recherche dans tout le cabinet est-elle tracée ?", "r": "Oui, sans garder ce qui est cherché. Au poste fixe (Ctrl K), chaque patient atteint par un résultat est noté au journal des accès ; le texte cherché n'est jamais journalisé. Au terminal, la recherche se fait hors connexion dans la précharge, déjà tracée à son téléchargement (avis du DPO attendu, Q-68)."}, {"q": "Ma position est-elle suivie pendant la tournée ?", "r": "Non, sauf si vous l'acceptez vous-même dans « Moi » ; c'est désactivé par défaut. Même acceptée, la position n'est prise qu'au départ que vous signalez, arrondie à environ un kilomètre, sert seulement à estimer l'heure d'arrivée, n'est montrée à personne et s'efface à l'arrivée, au plus tard après 12 heures (valeur provisoire)."}, {"q": "Une analyse d'impact (AIPD) existe-t-elle ?", "r": "Un brouillon technique existe, à conduire par le DPO : inventaire des données, flux, mesures vérifiables dans le code, risques et décisions ouvertes. Les durées de conservation sont provisoires (décision D-06) et à valider par le DPO."}]}]}, {"id": "faq-soins", "titre": "Soigner avec TabSanté (infirmier)", "resume": "Signature, brouillons, saisie différée, soins imprévus ou non faits, plaies, photos, corrections, consultations.", "mots_cles": ["signature", "brouillon", "saisie différée", "non réalisé", "acte partiel", "plaie", "photo", "correction", "consultation", "ordonnance"], "blocs": [{"type": "faq", "items": [{"q": "Comment signer un soin ?", "r": "Renseignez la fiche : la barre du bas dit ce qui manque (« Il manque : … ») ; un appui sur la mention mène au premier manque. Quand tout est renseigné, maintenez le bouton de signature une seconde ; relâcher avant annule. Avec les animations réduites ou un lecteur d'écran, un appui simple ouvre une confirmation. Le reçu s'affiche ensuite."}, {"q": "Pourquoi le bouton de signature reste-t-il inactif ?", "r": "Un champ exigé n'est pas renseigné : la barre d'action les nomme. Une réponse de sécurité (saignement, douleur…) n'est jamais présélectionnée : elle se donne explicitement, même quand rien n'a changé."}, {"q": "J'ai été interrompue pendant une saisie : est-ce perdu ?", "r": "Non. Le terminal enregistre un brouillon chiffré à chaque appui ; il n'est effacé qu'à la signature."}, {"q": "J'ai saisi un soin longtemps après l'avoir fait : pourquoi un motif ?", "r": "Au-delà de 120 minutes entre la réalisation et la saisie, la saisie est « différée » : un motif est obligatoire, puis un autre infirmier (titulaire ou responsable) la valide au poste fixe, page « Saisies différées ». Le seuil de 120 minutes est provisoire (D-04)."}, {"q": "Comment ajouter un soin qui n'était pas prévu ?", "r": "Par « Ajouter un soin » au passage. Un passage non programmé exige un motif : demande du patient ou du médecin, initiative infirmière, rattrapage, soin régulé (réservé à l'infirmier) ou autre ; le pansement a ses motifs propres (souillure, pansement décollé, saignement, douleur, demande du patient)."}, {"q": "Un soin prévu n'a pas été fait, ou seulement en partie : comment le dire ?", "r": "Déclarez le passage non réalisé, avec son motif, au terminal ou au poste fixe. Un acte fait en partie se déclare aussi au terminal, avec ce qui n'a pas été fait ; sa cotation passe toujours en file de contrôle (Q-86)."}, {"q": "Le terminal affiche un écart avec l'heure prescrite : est-ce bloquant ?", "r": "Non. Le serveur calcule l'écart entre l'heure prescrite et l'heure réelle du soin ; il s'affiche sur la tournée et au passage, par exemple « réalisé à 6 h 15, 1 h 45 avant l'heure prescrite », sans jamais bloquer."}, {"q": "Quelles photos puis-je prendre ?", "r": "Uniquement à l'appareil photo, pas depuis la galerie, par l'auteur du passage, dans une fenêtre autour du soin ; JPEG ou PNG, 15 Mo au plus.
