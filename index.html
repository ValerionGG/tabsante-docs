nnent « à régulariser avant le… » et ne sont jamais facturées avant qu'une ordonnance lui soit rattachée au poste fixe. Délai de 7 jours par défaut, réglable à 2, 7, 15 ou 30 jours (D-11)."}, {"type": "h", "texte": "Soin fait en partie"}, {"type": "p", "texte": "Signé avec « Soin fait en partie », un motif et ce qui n'a pas été fait : la cotation va toujours en file de contrôle et un arbitre décide (Q-86). Le passage compte comme servi."}, {"type": "h", "texte": "Acte corrigé après facturation"}, {"type": "p", "texte": "La FSE émise ne se réécrit pas : la ligne signale qu'il faut régulariser, et au lot l'anomalie « à régulariser » se force en connaissance de cause. Si la FSE est rejetée ou annulée, il n'y a plus rien à régulariser ; refacturé, l'acte est recoté sur sa valeur corrigée."}, {"type": "h", "texte": "Patient hors domicile au sens de la NGAP"}, {"type": "p", "texte": "EHPAD, établissement pour adultes handicapés, établissement de santé : ni forfait de dépendance ni déplacement, l'acte technique reste ; l'administration de médicaments n'y est pas cotée. La résidence autonomie compte comme domicile."}]}, {"id": "fn-banc", "titre": "Le banc de cotation", "resume": "Trois recueils de cas rejoués contre le moteur branché : les résultats chiffrés, ce qu'ils prouvent et ce qu'ils ne prouvent pas.", "mots_cles": ["banc", "banc de cotation", "CNDA", "oracle", "titre XVI", "conformes", "bloqués", "divergence", "agrément", "cas de facturation"], "blocs": [{"type": "p", "texte": "Le banc rejoue des recueils de cas écrits contre le moteur branché, en mémoire, sans base ni réseau, et classe chaque cas : conforme au centime, écart, bloqué ou divergence documentée. Au poste fixe : Paramètres › Banc de cotation (infirmier seul)."}, {"type": "code", "langage": "bash", "texte": "cd backend && uv run python -m scripts.banc_cotation"}, {"type": "h", "texte": "Résultats au 22 octobre 2026 (moteur demo-0.4)"}, {"type": "table", "entetes": ["Recueil", "Cas", "Conformes", "Écarts", "Bloqués", "Divergences documentées"], "lignes": [["Cahier CNDA « Cas de facturation infirmiers » (CF-IF, avril 2026)", "44", "19", "0", "18 (10 B, 8 C)", "7"], ["Cas écrits depuis le texte de la NGAP", "26", "23", "0", "0", "3"], ["Oracle du titre XVI : cas déduits du texte, jamais du code", "120", "113", "0", "7 (6 B, 1 C)", "0"], ["Total", "190", "155", "0", "25 (16 B, 9 C)", "10"]]}, {"type": "p", "texte": "Mêmes chiffres que le dernier passage documenté du 16 octobre : rien n'a régressé depuis."}, {"type": "h", "texte": "Les catégories"}, {"type": "table", "entetes": ["Catégorie", "Sens", "Cas"], "lignes": [["A", "Moteur incorrect ou règle manquante", "0"], ["B", "Fait inexprimable dans l'entrée ; le fait manquant est nommé", "16"], ["C", "Impossible par construction : majoration seule, coefficient hors table, DI dans un passage…", "9"], ["D", "Divergence documentée : le texte officiel en vigueur contredit le cas, le moteur suit le texte", "10"]]}, {"type": "h", "texte": "Ce qu'il prouve"}, {"type": "liste", "items": ["La doublure applique sans écart les règles écrites qu'elle couvre : aucun écart sur 190 cas.", "Le chemin entrée → sortie tient : chaque cas passe par le même contrat que les actes réels.", "Une régression se voit : le test du banc échoue dès qu'un cas conforme régresse ou qu'une divergence change."]}, {"type": "h", "texte": "Ce qu'il ne prouve pas"}, {"type": "liste", "items": ["Ce n'est jamais un agrément : l'agrément CNDA reste à obtenir, avec le moteur réel et le composant SESAM-Vitale.", "Les cas bloqués ne sont pas couverts : infirmier en pratique avancée, protocoles de coopération, dispositifs hors NGAP (FIS, Retrouve ton cap, télé-expertise, PPS), étui pénien, option tarifaire de l'EHPAD, bilan initial de plaie, surface brûlée, pression négative, analgésie topique, forfait d'organisation d'une perfusion.", "Les divergences attendent une décision : AMX à 50 % sous forfait (Q-72, sept cas), critères du pansement lourd (Q-73, deux cas), ablation et pansement (Q-74, un cas).", "Les tarifs sont de démonstration : le banc compare des montants, pas des droits."]}]}, {"id": "fn-reel", "titre": "Facturer en réel : ce qui manque et les décisions ouvertes", "resume": "Ce qui est simulé, ce qu'il faut pour facturer pour de vrai, et les 23 décisions de facturation avec la valeur appliquée en attendant.", "mots_cles": ["réel", "production", "moteur NGAP", "SESAM-Vitale", "CNDA", "agrément", "HDS", "décisions", "questions", "AUTRE-01", "D-07", "D-10", "D-16"], "blocs": [{"type": "h", "texte": "Ce qui est simulé, et ce qu'il faut"}, {"type": "table", "entetes": ["Brique", "Aujourd'hui", "Pour facturer en réel"], "lignes": [["Moteur de cotation NGAP", "Doublure MoteurDemo demo-0.4, règles et tarifs de démonstration", "Moteur réel de TABSANTE, sa table de correspondance et ses jeux de tests, branchés derrière le même contrat (AUTRE-01)"], ["Référentiel des règles et des tarifs", "Fichiers datés de démonstration, valeurs « à confirmer »", "Référentiel daté de TABSANTE : dates d'effet de l'avenant 11, valeurs des DROM"], ["SESAM-Vitale : FSE, lots, retours, tiers payant, SCOR", "Adaptateur factice, en direct ou par l'agent de poste simulé", "Composant SESAM-Vitale homologué, piloté par l'agent de poste, et agrément CNDA (D-07)"], ["Cartes CPS et Vitale", "Cartes et lecteur bi-fente simulés", "Lecteurs et cartes réels, bibliothèque CPS, Pro Santé Connect réel"], ["Téléservices ADRi, IDB, INSi", "Adaptateurs factices", "Raccordement et homologation"], ["Référentiel des médicaments (remboursement)", "Courte liste aux codes fictifs", "Référentiel réel (D-16)"], ["Distances et zones des indemnités", "Itinéraire simulé, extrait de zones recopié à la main", "Source réelle des distances et des zones (Q-08)"], ["Hébergement et conformité", "Poste de développement, données fictives", "Hébergeur certifié HDS (AUTRE-06), DPO et AIPD (AUTRE-07)"]]}, {"type": "note", "ton": "attention", "texte": "Garde-fou : hors mode démonstration, la plateforme refuse de créer une FSE tant que la doublure sert, et chaque opération SESAM-Vitale simulée est refusée. Aucune feuille aux montants inventés ne peut partir."}, {"type": "h", "texte": "Ce que la plateforme tient déjà"}, {"type": "liste", "items": ["Le contrat du moteur : entrée par passage, sortie explicite ligne par ligne, compteurs à trois échelles, versions gardées, branchement unique.", "La file de contrôle, l'arbitrage motivé et le journal chaîné.", "Le circuit FSE, lot, retours, rejets, derrière un port SESAM-Vitale unique.", "Les faits datés de l'avenant 11.", "Le banc, prêt à mesurer le moteur réel dès sa livraison."]}, {"type": "h", "texte": "Les 23 décisions de facturation ouvertes"}, {"type": "p", "texte": "Quatre sont bloquantes. Pour chacune, la valeur que l'application applique en attendant ; le contexte et les options sont dans la rubrique Questions ouvertes."}, {"type": "table", "entetes": ["Réf.", "Priorité", "Sujet", "Appliqué en attendant"], "lignes": [["AUTRE-01", "Bloquante", "Moteur de cotation NGAP de TABSANTE", "Doublure de démonstration, jamais facturable"], ["D-07", "Bloquante", "Composant SESAM-Vitale et agrément", "Composant et agent de poste simulés ; aucune feuille réelle"], ["D-10", "Bloquante", "Facturation des actes du remplaçant", "Personne pour l'instant : actes tracés, non facturables"], ["D-16", "Bloquante", "Référentiel des médicaments (remboursement)", "Liste de démonstration aux codes fictifs"], ["D-05", "Importante", "File de contrôle des cotations à arbitrer", "Les infirmiers titulaires, de structure ou responsables, sous 7 jours"], ["D-11", "Importante", "Passage imprévu sans ordonnance", "7 jours, puis le passage reste tracé et n'est jamais facturé"], ["Q-01", "Importante", "Accord préalable : le silence de la caisse vaut-il accord ?", "Jamais : sans décision reçue, l'accord reste « demandé »"], ["Q-86", "Importante", "Soin fait en partie", "Pas de règle automatique : un arbitre décide à chaque fois"], ["D-18", "Importante", "Soins sous convention HAD", "Valeur de la nomenclature, sans feuille de soins, sur un relevé à l'HAD"], ["D-17", "Importante", "Pansement du cathéter péridural ou intrathécal", "Tracé et transmis, non coté"], ["D-20", "Importante", "Consultation CIA : patient déjà pris en charge ?", "Non : condition désactivée"], ["Q-80", "Importante", "Perfusion de plus d'une heure : forfait à la pose ou à la dépose", "Oui : forfait coté à la pose, retrait coté à la dépose"], ["Q-08", "Importante", "Indemnités de déplacement", "Ne rien coter, transmettre seulement les faits"], ["Q-72", "Importante", "Injection pendant un passage de nursing sous forfait BSI", "Oui, à 50 % au seul passage du forfait"], ["Q-04", "Importante", "Qu'est-ce qu'un passage ?", "Deux heures"], ["Q-03", "Importante", "Acte C (surveillance après changement de traitement) : plafond et alerte", "15 passages sur 30 jours, alerte à 3 passages du plafond"], ["Q-13", "Importante", "Bilan de soins infirmiers : circuit du document AmeliPro", "L'infirmière dépose le PDF d'AmeliPro dans le dossier"], ["Q-73", "Confort", "Pansement lourd et complexe : critères", "Garder les critères actuels"], ["Q-74", "Confort", "Ablation de fils et pansement de la même plaie", "Oui, le pansement courant est compris"], ["Q-15", "Confort", "Plafonds du cycleur de dialyse péritonéale", "Un branchement, un débranchement, deux périodes de 12 heures"], ["Q-63", "Confort", "BPCO : stade exigé après hospitalisation", "Oui, stade II et suivants seulement"], ["Q-27", "Confort", "Écart entre passages prévus au BSI et passages servis", "Sur 14 jours, au moins 7 jours prévus et 33 % d'écart"], ["Q-78", "Confort", "Traceurs de la feuille de soins", "Non transmis"]]}, {"type": "liens", "items": [{"titre": "Questions ouvertes : facturation et cotation", "resume": "Contexte, options et références de chaque décision.", "href": "#qo-facturation"}]}]}, {"id": "faq-facturation", "titre": "FAQ facturation et NGAP", "resume": "Les questions fréquentes sur la cotation de démonstration, la file de contrôle, les FSE, les lots, les rejets, le banc et l'avenant 11.", "mots_cles": ["cotation", "démonstration", "moteur NGAP", "file de contrôle", "FSE", "lot", "rejet", "banc", "avenant 11", "majoration de nuit", "déplacement", "remplaçant", "HAD", "mode dégradé", "AMX", "annuler"], "blocs": [{"type": "note", "ton": "attention", "texte": "Toute cotation affichée dans TabSanté est étiquetée « Démonstration » : le moteur actuel est une doublure, pas le moteur NGAP réel."}, {"type": "faq", "items": [{"q": "Comment fonctionne la facturation aujourd'hui ?", "r": "De bout en bout, mais en démonstration : cotation par la doublure, reconfirmation, file de contrôle, FSE créée par l'infirmier qui a réalisé les actes et sécurisée, mise en lot avec contrôle de cohérence, télétransmission et retours, le tout sur un adaptateur simulé."}, {"q": "Que règle-t-on dans la file de contrôle ?", "r": "Les cotations à arbitrer avant la mise en lot : cumul, majoration, dépassement de fréquence, divergence entre cotation provisoire et reconfirmée, correction, acte fait en partie. Chacune se confirme ou s'écarte avec un motif. Les réglages et le délai de 7 jours sont provisoires (D-05)."}, {"q": "Je vois « cotation provisoire non estimée hors connexion » : est-ce une erreur ?", "r": "Non. Hors connexion, le terminal n'estime la cotation que lorsque l'acte correspond exactement au passage prévu ; sinon le cabinet la calcule à l'envoi."}, {"q": "Un lot est refusé à la constitution : pourquoi ?", "r": "Le contrôle de cohérence a trouvé des anomalies : acte sur une prescription échue ou arrêtée, au-delà de sa fréquence, saisie différée non validée, chaîne du journal, acte corrigé depuis sa FSE. La plupart se forcent avec un motif journalisé ; une empreinte d'acte qui ne correspond plus et une saisie différée non validée, jamais. Une chaîne du journal rompue ne se force que par qui gère le cabinet, d'un accord à part, et le lot le porte."}, {"q": "Une FSE est rejetée : que faire ?", "r": "Elle apparaît dans l'onglet « Rejets » avec son motif : « Refacturer » rend ses actes facturables dans une nouvelle FSE, « Abandonner » les garde hors facturation. En démonstration, un patient sans NIR, dont le nom contient « rejet » ou dont les droits sont fermés à la date des soins provoque un rejet."}, {"q": "Qu'est-ce que le banc de cotation ?", "r": "Un banc d'essai qui rejoue des cas écrits contre la doublure : le cahier de cas de facturation infirmiers du CNDA (19 conformes au centime, aucun écart, les autres bloqués ou en divergence documentée), des cas tirés de la NGAP et l'oracle du titre XVI (113 conformes sur 120). Ce n'est jamais un agrément : il servira à mesurer le moteur réel."}, {"q": "Puis-je comprendre une cotation ligne par ligne ?", "r": "Oui. Le reçu de cotation montre le passage entier, la règle appliquée à chaque ligne et un « Et si… » (heure, dimanche, férié, horaire prescrit) ; l'onglet « Simuler une cotation » rejoue un passage fictif sans rien écrire."}, {"q": "Les montants de l'avenant 11 sont-ils appliqués ?", "r": "Non. La plateforme tient les faits datés que le moteur lira (motifs à date d'effet, plaie en accès direct, lieu du soin de l'enfant, soin régulé, dépistage, ALD, score SEGA) ; les tarifs datés sont des valeurs de démonstration. Sur les 15 mesures suivies : 10 faites, 2 simulées, 2 relevant du moteur seul, 1 à confirmer."}, {"q": "Pourquoi n'y a-t-il pas de majoration de nuit sur un soin fait à 22 h ?", "r": "Parce que la majoration de nuit exige un horaire prescrit de nuit : le moteur ne la déduit jamais de l'heure du passage. Avec un horaire prescrit entre 20 h et 8 h, l'heure réelle choisit la tranche : 20 h-23 h ou 5 h-8 h, nuit ; 23 h-5 h, nuit profonde."}, {"q": "Pourquoi aucune indemnité de déplacement n'apparaît-elle ?", "r": "Par défaut, la règle provisoire « Indemnités de déplacement » transmet les faits au moteur sans coter d'indemnité (Q-08). Le mode « cotées », dans Paramètres › Simulations, ajoute IFD ou IFI et kilomètres."}, {"q": "Pourquoi l'injection est-elle à 50 % au passage du forfait BSI ?", "r": "Dans une séance liée à la dépendance, l'acte technique en AMX est noté à 50 % (art. 11 B § 5 et art. 12), sauf perfusion, pansement lourd, séance art. 5 ter et ponction veineuse. Le cahier CNDA le facture à taux plein : divergence documentée, décision Q-72."}, {"q": "Qui peut arbitrer la file de contrôle ?", "r": "Les arbitres désignés dans Facturation › Réglages : par défaut l'infirmier titulaire, de structure ou responsable. Le cabinet peut y ajouter le remplaçant ; l'aide-soignant et l'administrateur ne voient pas la cotation."}, {"q": "Un remplaçant peut-il facturer ses actes ?", "r": "Non : il ne peut ni créer ni sécuriser une FSE. Ses actes restent tracés, non facturables, en attendant la décision D-10."}, {"q": "Et pour un patient en HAD ?", "r": "Les actes dont l'HAD est le payeur ne vont jamais sur une FSE : ils sont valorisés selon la NGAP et relevés à l'HAD (onglet « Relevés HAD »). Sans lettre de mission, le séjour est « Non payable en l'état »."}, {"q": "Peut-on faire une FSE sans carte Vitale ?", "r": "Oui, en mode dégradé : la carte CPS de l'infirmier signe la FSE, et la feuille papier est à adresser à la caisse. Tout reste simulé en démonstration."}, {"q": "Peut-on annuler une FSE ?", "r": "Oui, tant qu'elle n'est pas en lot : l'infirmier qui l'a créée l'annule avec un motif, et ses actes redeviennent facturables. En lot ou transmise, elle ne s'annule plus."}, {"q": "Le terminal calcule-t-il lui-même la cotation ?", "r": "Non. Le serveur cote ; hors connexion, le terminal retient la cotation préchargée du passage seulement si l'acte signé y répond pareil, sinon il l'annonce « non estimée ». Une divergence part en file de contrôle."}, {"q": "Comment remettre les preuves à un contrôleur de l'Assurance maladie ?", "r": "Facturation › Contrôle CPAM : choisissez le patient et la période, nommez le contrôleur ; un lien et un QR lui ouvrent, en lecture seule et pour quelques jours, les actes de la période, leurs cotations, leurs preuves et l'intégrité. Chaque lecture est horodatée et tracée au journal des accès du patient ; vous révoquez l'accès à tout moment. Simulé : l'identité du contrôleur est déclarée par le cabinet (Q-140)."}]}, {"type": "liens", "items": [{"titre": "Facturation et NGAP", "resume": "Le circuit complet et les règles de la doublure, dans la rubrique dédiée.", "href": "#fn-vue-ensemble"}]}]}, {"id": "glossaire-assurance-maladie", "titre": "Glossaire facturation et NGAP", "resume": "Lettres-clés, forfaits, majorations, cotation, file de contrôle, feuilles de soins et lots.", "mots_cles": ["NGAP", "AMI", "AIS", "BSI", "FSE", "HAD", "SSIAD", "avenant 11", "cotation", "MAU", "MCI", "IFD", "passage", "file de contrôle", "banc", "taux réduit"], "blocs": [{"type": "glossaire", "items": [{"terme": "NGAP", "definition": "Nomenclature générale des actes professionnels : liste officielle des actes et de leur cotation (lettre-clé et coefficient)."}, {"terme": "Lettre-clé", "definition": "Code de la nomenclature auquel s'applique un coefficient, par exemple AMI 3."}, {"terme": "AMI", "definition": "Acte médico-infirmier : lettre-clé des actes techniques infirmiers."}, {"terme": "AMX", "definition": "Lettre-clé des actes techniques réalisés chez un patient dépendant ; la doublure la cote pour l'acte technique facturé en plus d'un forfait de dépendance."}, {"terme": "AIS", "definition": "Acte infirmier de soins : séance de soins infirmiers liée à la dépendance. Pour les patients relevant du BSI, les forfaits BSA, BSB, BSC l'ont remplacé ; la doublure de démonstration cote encore la séance AIS d'un patient dépendant hors forfait, jusqu'à son abrogation."}, {"terme": "BSI", "definition": "Bilan de soins infirmiers : évaluation de la dépendance qui ouvre droit à un forfait journalier. La fiche Nursing l'alimente ; le tableau de bord signale un BSI à renouveler."}, {"terme": "BSA, BSB, BSC", "definition": "Forfaits journaliers de prise en charge de la dépendance (léger, intermédiaire, lourd) issus du BSI ; comptés une fois par patient et par jour."}, {"terme": "Actes A, B, C, D", "definition": "Actes liés aux médicaments (NGAP, art. 10 ; fiche 6) : A, administration et surveillance de la prise ; C, surveillance après introduction ou modification d'un traitement, quinze passages au plus ; D, accompagnement de la prise en séances. B n'a pas de règle propre dans la doublure."}, {"terme": "CIA", "definition": "Consultation infirmière d'un patient diabétique de type 2 nouvellement insuliné ; tracée, non facturante tant que sa date d'effet n'est pas connue."}, {"terme": "CIB", "definition": "Consultation infirmière de suivi après Mon Bilan Prévention ; effet au 1er juillet 2027 sous réserve de la HAS."}, {"terme": "RDI", "definition": "Bilan de prévention réalisé par l'infirmier, sans prescription, par tranche d'âge (18-25, 45-50, 60-65, 70-75 ans)."}, {"terme": "MSG", "definition": "Majoration de l'avenant 11 liée à un forfait BSC et à un score SEGA, effet au 1er janvier 2028."}, {"terme": "RKD", "definition": "Dépistage du cancer colorectal par l'infirmier : remise du kit, puis test réalisé."}, {"terme": "MIR", "definition": "Rémunération d'un soin non programmé régulé par le SAS ou la PDSA."}, {"terme": "MSD", "definition": "Majoration du diabète de l'enfant de moins de 16 ans soigné à l'école ou en périscolaire."}, {"terme": "MAU", "definition": "Majoration d'acte unique : un seul acte facturable au passage, coté AMI de coefficient 1,5 au plus, au domicile ou au cabinet ; jamais sous forfait de dépendance ni avec la MCI."}, {"terme": "MCI", "definition": "Majoration de coordination infirmière : à domicile, pour un patient en soins palliatifs ou un pansement lourd et complexe, une par intervention ; jamais au cabinet."}, {"terme": "IFD, IFI", "definition": "Indemnités forfaitaires de déplacement ; l'IFI s'applique à un patient sous forfait de dépendance. Par défaut, la règle provisoire « déplacements » transmet les faits sans coter."}, {"terme": "IK", "definition": "Indemnité kilométrique, due hors de l'agglomération du cabinet, avec franchise et abattement journalier."}, {"terme": "SAS, PDSA", "definition": "Service d'accès aux soins ; permanence des soins ambulatoires : origines d'un soin régulé."}, {"terme": "ALD", "definition": "Affection de longue durée, prise en charge à 100 % ; portée par la pathologie du dossier (liste de démonstration)."}, {"terme": "HAD", "definition": "Hospitalisation à domicile : elle change le payeur, pas les règles de soin. Un séjour HAD daté bloque FSE et lot ; la mention « HAD » de l'en-tête vient du seul séjour déclaré."}, {"terme": "SSIAD", "definition": "Service de soins infirmiers à domicile, qui emploie infirmiers et aides-soignants ; cité par le CDC comme autre régime possible, sans traitement spécifique dans le code."}, {"terme": "Accord préalable", "definition": "Accord de la caisse exigé avant certains soins ; sans décision enregistrée, l'accord reste « demandé », jamais accepté implicitement."}, {"terme": "Art. 5 ter", "definition": "Suivi infirmier après une décompensation d'insuffisance cardiaque ou une exacerbation de BPCO, en séances encadrées."}, {"terme": "RAAC (art. 7)", "definition": "Réhabilitation améliorée après chirurgie : surveillance postopératoire au domicile, de J0 à J+6."}, {"terme": "Mon Bilan Prévention, PPP", "definition": "Bilan de prévention national aux âges clés, qui aboutit à un plan personnalisé de prévention (PPP), point de départ de la CIB."}, {"terme": "Avenant 11", "definition": "Avenant à la convention nationale des infirmiers : calendrier de mesures 2026-2029, suivi en 15 mesures."}, {"terme": "FSE", "definition": "Feuille de soins électronique : facture d'un patient, sécurisée par la carte CPS et la carte Vitale, puis télétransmise en lot. Simulée aujourd'hui."}, {"terme": "Lot", "definition": "Ensemble de FSE télétransmises ensemble, après un contrôle de cohérence."}, {"terme": "NOEMIE", "definition": "Norme des retours de l'Assurance maladie (paiements, rejets) ; simulée."}, {"terme": "DRE, tiers payant", "definition": "Demande de remboursement électronique à la complémentaire ; dispense d'avance de frais. Simulés."}, {"terme": "SCOR", "definition": "Dématérialisation des pièces justificatives jointes à la facturation ; non construite, elle dépend du composant SESAM-Vitale."}, {"terme": "ADRi", "definition": "Téléservice de consultation des droits du patient sans sa carte Vitale ; appelé d'office avant chaque FSE, jamais bloquant. Simulé."}, {"terme": "IDB", "definition": "Téléservice d'identification du bénéficiaire quand la carte Vitale est absente ou illisible. Simulé."}, {"terme": "Vitale, ApCV", "definition": "Carte d'assurance maladie du patient ; application carte Vitale qui en tient lieu par un QR. Simulées."}, {"terme": "CPS", "definition": "Carte de professionnel de santé : elle authentifie le professionnel et signe ses FSE. Simulée en démonstration."}, {"terme": "GIE SESAM-Vitale, CNDA", "definition": "Organisme qui cadre les FSE ; centre de l'Assurance maladie qui homologue les logiciels. Agrément à obtenir."}, {"terme": "Moteur de cotation", "definition": "Composant qui traduit les actes signés en lignes facturables ; le moteur NGAP réel appartient à TABSANTE, une doublure le remplace aujourd'hui."}, {"terme": "Cotation provisoire, reconfirmée", "definition": "Cotation calculée à la signature, puis rejouée par le serveur avant la mise en lot ; un écart passe en file de contrôle."}, {"terme": "File de contrôle", "definition": "Liste des cotations à arbitrer (confirmer ou écarter, avec motif) avant la mise en lot."}, {"terme": "Reçu de cotation, simulateur", "definition": "Explication ligne par ligne d'une cotation avec sa règle ; rejeu d'un passage fictif sans rien écrire."}, {"terme": "Banc de cotation", "definition": "Cas écrits rejoués contre le moteur branché, avec un rapport conformes, écarts et bloqués ; jamais un agrément."}, {"terme": "Compteurs", "definition": "Décomptes qui bornent une cotation, par objet, par patient et par période ; aussi les pastilles de la barre latérale."}, {"terme": "Passage (cotation)", "definition": "Ce que le moteur cote ensemble : actes signés du même patient, même jour, même moment, même intervenant, sans plus de deux heures sans soin de proche en proche."}, {"terme": "Article 11 B", "definition": "Règle de cumul de la NGAP : au même passage, le plus fort coefficient à taux plein, le deuxième à 50 %, les suivants sans honoraires ; avec des exceptions à taux plein."}, {"terme": "Taux réduit", "definition": "Statut d'une ligne minorée, par exemple à 50 % par le cumul ; elle reste facturée au taux dit."}, {"terme": "Retenue, incluse, écartée, plafonnée, à régulariser", "definition": "Statuts d'une ligne de cotation : retenue (taux plein) et taux réduit se facturent ; incluse (comprise ailleurs), écartée (non facturable), plafonnée (au-delà d'un plafond) et à régulariser (pièce manquante) sont tracées sans être facturées."}, {"terme": "Horaire prescrit", "definition": "Heure imposée par la prescription ; seule une prescription d'horaire de nuit ouvre la majoration de nuit, jamais l'heure du passage seule."}, {"terme": "MIE", "definition": "Majoration pour un enfant de moins de sept ans, une par passage."}, {"terme": "Majorations de nuit", "definition": "MAJ_NUIT de 20 h à 23 h et de 5 h à 8 h, MAJ_NUIT_PROFONDE de 23 h à 5 h, une par passage, sur horaire prescrit de nuit seulement."}, {"terme": "Majoration de dimanche ou de jour férié", "definition": "Une par passage, quand la prescription précise les dimanches et jours fériés ; jamais avec une majoration de nuit. Fériés calculés sans réseau, Alsace-Moselle et DROM compris."}, {"terme": "IKM", "definition": "Indemnité kilométrique en zone de montagne, franchise de 1 km par trajet (2 km en plaine)."}, {"terme": "DE", "definition": "Dépassement pour exigence particulière du patient : déplacement non prescrit, montant réglé par le cabinet, à la charge du patient, jamais remboursé."}, {"terme": "DI", "definition": "Lettre-clé du bilan de soins infirmiers (2,5 initial, 1,2 renouvellement et intermédiaire), coté au dépôt de son PDF, et de la démarche de soins (1,5), abrogée en juin 2026."}, {"terme": "Contexte substituant", "definition": "Immunodépression, chimiothérapie ou cancer : il porte certains coefficients à la valeur de l'article 4 (injection d'anticoagulant 1,5, perfusion 10 ou 15)."}, {"terme": "Payeur", "definition": "Qui paie l'acte à sa date : l'assurance maladie, l'HAD pendant un séjour, ou « à classer » quand l'ordonnance d'un séjour n'est pas classée."}, {"terme": "Lettre de mission", "definition": "Pièce de l'HAD sans laquelle un séjour est « Non payable en l'état »."}, {"terme": "Émetteur, exécutant", "definition": "L'émetteur de la FSE est l'infirmier en libéral individuel, la structure en société d'exercice ; l'exécutant, l'infirmier qui a réalisé les actes, seul à créer et sécuriser la FSE avec sa carte CPS."}, {"terme": "Mode dégradé", "definition": "FSE sécurisée sans carte Vitale, signée par la carte CPS ; la feuille papier est à adresser à la caisse."}, {"terme": "Contrôle de cohérence", "definition": "Vérifications avant la mise en lot : empreintes, prescriptions échues, fréquences dépassées, saisies différées, chaîne du journal, actes à régulariser."}, {"terme": "Forçage", "definition": "Mise en lot malgré une anomalie, avec un motif journalisé ; impossible pour une empreinte altérée ou une saisie différée non validée."}, {"terme": "Régularisation", "definition": "Suite d'un acte corrigé après sa facturation : la FSE émise ne se réécrit pas, la ligne le signale."}, {"terme": "Divergence documentée", "definition": "Cas du banc que le texte officiel en vigueur contredit : le moteur suit le texte, l'écart est expliqué et attend une décision."}, {"terme": "Version du référentiel", "definition": "Jeu de règles en vigueur à une date d'effet ; chaque cotation garde la version, le moteur et les tarifs retenus à la date du passage."}]}, {"type": "liens", "items": [{"titre": "Facturation et NGAP", "resume": "Le circuit complet et les règles de la doublure, dans la rubrique dédiée.", "href": "#fn-vue-ensemble"}]}]}]}, {"id": "aide-ecrans", "titre": "Aide écran par écran", "description": "Ce que fait chaque écran et comment s'en servir, dans les deux applications.", "pages": [{"id": "aide-poste-accueil", "titre": "Poste fixe : accueil et navigation", "resume": "Barre latérale, recherche, notifications, Aujourd'hui et Tableau de bord.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-aide", "ecran": "Toutes les pages", "titre": "Aide", "texte": "Le bouton « ? » à côté d’un titre ouvre l’explication de cet élément. Le panneau Aide s’ouvre avec la touche ?, la touche F1, le bouton « ? » de la barre du haut ou l’entrée « Aide » du menu de votre profil : il réunit l’aide de la page en cours et une recherche dans toute l’aide. Le bouton « Revoir les astuces » fait réapparaître les astuces de première utilisation.", "etapes": ["Appuyez sur ? ou F1, ou cliquez sur « ? » dans la barre du haut.", "Lisez l’aide de la page, ou tapez un mot dans la recherche.", "Cliquez sur « Revoir les astuces » pour revoir les conseils de départ."]}, {"id": "poste-navigation", "ecran": "Toutes les pages", "titre": "Navigation principale", "texte": "La barre latérale range les pages par usage : Aujourd’hui et Tableau de bord en tête, puis « Soins », « Coordination », « Gestion » et « Ressources ». Une page que vos droits n’ouvrent pas n’y figure pas, et un groupe vide disparaît. Les chiffres comptent ce qui vous attend : éléments à traiter, transmissions et mentions non lues, signalements à décider, bilans, saisies différées. Le bouton en haut de la barre (ou la touche [) la réduit aux icônes ; G puis une lettre ouvre une page : A Aujourd’hui, B Tableau de bord, P Patients, T Tournées, M Transmissions, R Paramètres (seulement vers une page que vos droits ouvrent). La barre du haut rappelle où vous êtes (fil d’Ariane). Sur un écran étroit, la barre latérale s’ouvre par le bouton de menu, en haut à gauche."}, {"id": "poste-navigation-ressources", "ecran": "Toutes les pages", "titre": "Ressources", "texte": "Le groupe « Ressources » se replie et se déplie d’un clic sur son titre. Il est replié par défaut, et votre choix est retenu pour votre compte sur ce poste. Replié, son titre se met en évidence quand la page ouverte en fait partie."}, {"id": "poste-recherche", "ecran": "Toutes les pages", "titre": "Rechercher", "texte": "Le bouton « Rechercher » de la barre du haut ouvre la palette de commandes, comme Ctrl K (Cmd K sur Mac) ou la touche / hors d’un champ de saisie. Elle retrouve un patient, une plaie, le dernier passage d’un soin, un dossier de preuve, un objet suivi ou une page, et propose des actions comme « Nouveau patient » ou « Nouvelle tournée ». À partir de deux caractères, elle cherche aussi dans tout le cabinet : documents, transmissions, ordonnances et tournées.", "etapes": ["Appuyez sur Ctrl K, ou sur / hors d’un champ.", "Tapez quelques lettres : un nom, un soin, une page.", "Choisissez avec les flèches ↑ et ↓, ouvrez avec Entrée.", "Échap referme la palette sans rien ouvrir."]}, {"id": "poste-avis", "ecran": "Toutes les pages", "titre": "Donner mon avis", "texte": "Le bouton « Donner mon avis » de la barre du haut (une bulle sur un écran étroit), ou l’entrée du même nom dans le menu de votre profil, ouvre dans un nouvel onglet un formulaire de retour sur GitHub (un compte GitHub est demandé). L’écran est déjà rempli par son modèle, sans aucun identifiant ni donnée de patient : par exemple « /patients/:id/preuve ». Votre profil (IDE, IDE remplaçante, aide-soignante, administration) est rempli aussi, jamais votre nom."}, {"id": "poste-notifications", "ecran": "Toutes les pages", "titre": "Notifications", "texte": "La cloche de la barre du haut, à droite, compte les notifications que vous n’avez pas encore vues. Elle ouvre le centre de notifications : « À valider » en tête, puis « Reçues ». Chaque notification a un lien « Ouvrir » vers ce qu’elle concerne. « Marquer comme vue » la retire du compte."}, {"id": "poste-notifications-portee", "ecran": "Toutes les pages · pour : infirmier", "titre": "Pour moi · Tout le cabinet", "texte": "Ce choix élargit la liste aux notifications du cabinet. Celles adressées personnellement à un autre intervenant restent les siennes et n’apparaissent pas."}, {"id": "poste-notifications-propositions", "ecran": "Toutes les pages · selon vos droits", "titre": "À valider", "texte": "Une règle du soin propose un envoi, avec ses destinataires et sa raison. Vous décochez les destinataires à retirer puis cliquez sur « Envoyer », ou vous l’écartez avec un motif, tracé comme l’envoi. En démonstration, l’envoi par messagerie sécurisée est simulé : le message est versé au journal.", "etapes": ["Vérifiez les destinataires cochés.", "Cliquez sur « Envoyer », ou sur « Écarter ».", "Pour écarter, saisissez le motif puis « Écarter la proposition »."]}, {"id": "poste-bandeau-demo", "ecran": "Toutes les pages", "titre": "Démonstration", "texte": "Ce bandeau en tête de chaque page rappelle que les cartes CPS et Vitale, les téléservices et les échanges de santé sont simulés : rien ne part vers l’Assurance maladie. Quand une panne est simulée, il en affiche le nombre ; le survoler en donne le détail. Le lien « Simulations » ouvre la page des réglages de la démonstration."}, {"id": "poste-deconnexion", "ecran": "Toutes les pages", "titre": "Se déconnecter", "texte": "Votre nom et votre rôle s’affichent en bas de la barre latérale. Ils ouvrent un menu : paramètres du cabinet, sessions, aide, et « Se déconnecter », qui ferme votre session sur ce poste et ramène à l’écran de connexion. Sans clic ni frappe pendant 15 minutes, la session se ferme d’elle-même : sur le poste partagé du cabinet, rien ne reste affiché ni ouvert au nom de quelqu’un d’autre."}, {"id": "poste-aujourdhui", "ecran": "Aujourd'hui", "titre": "Aujourd’hui", "texte": "Aujourd’hui rassemble ce qui demande une action et l’état de la journée. « À traiter » vient en tête ; à côté se lisent votre prochain domicile quand vous tenez une tournée, les suggestions, ce qui est à préparer, les tournées du jour et les plaies en cours. Le sous-titre compte les tournées, les passages prévus et ceux déjà signés. Pour qui crée les dossiers, « Nouveau patient » en ouvre un."}, {"id": "poste-aujourdhui-a-traiter", "ecran": "Aujourd'hui", "titre": "À traiter", "texte": "La liste réunit ce qui attend une action, du plus grave au plus administratif : la sécurité clinique d’abord (dispositif au-delà du prescrit, signalement de l’aide-soignante, plaie sans progrès, terminal muet en tournée), puis les échéances (passage non tracé, bilan dû, protocole sans pièce). Chaque ligne porte son bouton, par exemple « Décider », « Ouvrir la plaie » ou « Ouvrir le dispositif ». Le filtre « Soins » ne garde que le clinique, « Tout » rétablit la liste entière. Quand la liste est vide, l’heure de la dernière vérification s’affiche.", "etapes": ["Sur une ligne « Passage non réalisé », cliquez « Déclarer le motif ».", "Choisissez le motif dans la liste.", "Ajoutez une précision, obligatoire pour le motif « Autre ».", "Validez avec « Déclarer non réalisé » : le motif est tracé au journal."]}, {"id": "poste-aujourdhui-a-traiter-facturation", "ecran": "Aujourd'hui · selon vos droits", "titre": "Facturation", "texte": "Le filtre « Facturation » d’« À traiter » regroupe l’administratif : les cotations à contrôler avant facturation, les saisies différées à vérifier et l’alerte de journal d’audit rompu. « Voir les cotations » mène à la facturation ; « Vérifier » ouvre la preuve d’un acte déclaré après coup. Un journal d’audit rompu passe avant tout : prévenez le responsable sécurité avant de présenter une preuve."}, {"id": "poste-aujourdhui-apercu", "ecran": "Aujourd'hui", "titre": "Aperçu du patient", "texte": "Cliquer le nom d’un patient dans « À traiter » ouvre son aperçu à côté de la liste, sans la quitter. Il montre ce qu’il faut savoir avant le soin (INS, allergies, contextes), ses plaies en cours avec leur courbe, ses soins en cours et ses trois derniers passages. « Ouvrir le dossier » et « Transmissions » mènent au dossier complet ; Échap ou la croix referment l’aperçu."}, {"id": "poste-aujourdhui-contexte", "ecran": "Aujourd'hui", "titre": "Contexte du jour", "texte": "Cette bande signale ce qui peut peser sur la journée : jour férié, vacances, vigilance météo, circulation, pollution, pollens ou changement d’heure. Elle n’apparaît que s’il y a quelque chose à signaler. La mention « Données simulées » indique que certaines sources ne sont pas encore raccordées ; survolez-la pour le détail."}, {"id": "poste-aujourdhui-suggestions", "ecran": "Aujourd'hui", "titre": "Suggestions", "texte": "Des pistes proposées par l’application, jamais des ordres : rien ne se fait sans vous. Chaque suggestion indique sa gravité, son échéance et, sous « Pourquoi ? », sa source, la règle appliquée et les données lues. « Faire » ouvre l’écran qui la réalise, « C’est fait » la retire, « Écarter » la retire avec un motif facultatif. Trois s’affichent d’abord ; le lien du bas montre les autres."}, {"id": "poste-aujourdhui-a-preparer", "ecran": "Aujourd'hui · pour : infirmier, aide-soignante", "titre": "À préparer", "texte": "Les prérequis de vos passages d’aujourd’hui, et ceux de demain à confirmer dès aujourd’hui : patient à jeun, traitement à retirer en pharmacie, ordonnance… Chaque ligne donne la consigne et le moment où confirmer. Cochez « Patient prévenu » après votre appel (l’application n’envoie rien au patient), puis « Confirmé » une fois vérifié. Le compteur indique les prérequis encore à confirmer."}, {"id": "poste-aujourdhui-tournees-du-jour", "ecran": "Aujourd'hui", "titre": "Tournées du jour", "texte": "Une ligne par tournée et par moment qui a des passages : passages signés sur prévus, jauge, infirmier attribué (ou « Infirmier non attribué ») et passages qui restent à faire. Les pictogrammes comptent les soins prévus par type. Quand vous tenez une tournée en ce moment, le panneau « Prochain domicile » donne en plus l’heure d’arrivée estimée et un lien « Itinéraire »."}, {"id": "poste-aujourdhui-fin-journee", "ecran": "Aujourd'hui · pour : infirmier, aide-soignante", "titre": "Ma journée", "texte": "Le bilan de votre journée : vos passages signés, soin par soin, et ce qui reste en attente. « Encore à venir » compte les passages de vos moments qui ne sont pas finis ; un passage dû d’un moment passé, ni signé ni déclaré non réalisé, est nommé avec son patient pour être repris avant de partir. Quand plus rien n’attend, le panneau devient « Tournée terminée ». Ce qui est encore en file sur le terminal hors connexion n’y figure qu’une fois envoyé."}, {"id": "poste-aujourdhui-fin-journee-cotations", "ecran": "Aujourd'hui · pour : infirmier", "titre": "Cotations du jour", "texte": "Sous le bilan de la journée, les cotations de vos passages du jour : combien sont provisoires, confirmées ou à arbitrer, et les lignes retenues, sans montant. Elles viennent du moteur de démonstration ; la facturation les reprend une à une."}, {"id": "poste-aujourdhui-plaies", "ecran": "Aujourd'hui", "titre": "Plaies en cours", "texte": "Toutes les plaies ouvertes du cabinet, celles qui demandent l’attention en tête : « Sans mesure depuis … » (trois jours ou plus) ou « Sans progrès depuis … ». Chaque ligne montre J+n, la localisation, la mini-courbe et l’évolution depuis J0 ; un clic ouvre la plaie. Les plaies s’ouvrent sur le terminal, au domicile du patient."}, {"id": "poste-tableau-de-bord", "ecran": "Tableau de bord · pour : infirmier, administration", "titre": "Tableau de bord", "texte": "Le tableau de bord résume une période : « Aujourd’hui », « Semaine » (par défaut) ou « Mois ». Une phrase écrite depuis les données dit où la charge s’accumule et quelles plaies ne progressent plus. Avec plusieurs tournées, le menu « Toutes les tournées » ramène les listes aux patients d’une tournée ; le récit, les objectifs et la saisie différée restent ceux du cabinet. « Exporter » télécharge les sections affichées en fichier CSV, lisible dans un tableur."}, {"id": "poste-tableau-de-bord-as", "ecran": "Tableau de bord · pour : aide-soignante", "titre": "Tableau de bord", "texte": "Le tableau de bord résume la période choisie : « Aujourd’hui », « Semaine » ou « Mois ». Vous y suivez les signalements en attente (lien « Suivre »), la carte des passages et les objectifs de la période ; la décision sur un signalement revient à l’infirmier."}, {"id": "poste-tableau-de-bord-attend", "ecran": "Tableau de bord", "titre": "Ce qui vous attend", "texte": "Une ligne de liens, avant tout chiffre : signalements à décider, passages manqués sans motif, bilans à rédiger ou signer, résultats attendus, transmissions dues au prescripteur… Chaque lien mène à son panneau plus bas ou à sa page. Le soin vient d’abord, la gestion ensuite. « Rien en attente sur la période » confirme qu’il n’y a rien à reprendre."}, {"id": "poste-tableau-de-bord-carte", "ecran": "Tableau de bord", "titre": "Quand passez-vous chez vos patients", "texte": "La carte de chaleur croise les jours et les heures : chaque case donne le nombre de passages prévus, et plus la teinte est soutenue, plus l’heure est chargée. Survolez, cliquez ou parcourez les cases avec les flèches du clavier : le détail (réalisés, non réalisés, à venir) s’écrit sous la grille. Les hachures signalent au moins un passage non réalisé, les tirets des passages à venir."}, {"id": "poste-tableau-de-bord-cicatrisation", "ecran": "Tableau de bord", "titre": "Cicatrisation, plaie par plaie", "texte": "Une vignette par plaie mesurée : la surface en pourcentage de J0, sur la même échelle pour toutes, avec J+n et l’évolution depuis J0. Les plaies sans progrès viennent en tête, la plus longue d’abord. Cliquer une vignette ouvre l’aperçu du patient à côté."}, {"id": "poste-tableau-de-bord-objectifs", "ecran": "Tableau de bord", "titre": "Objectifs de la période", "texte": "Des objectifs à atteindre en entier, sans note ni classement entre personnes : passages signés à l’heure, transmissions lues, bilans dus faits. Chaque barre montre ce qui est fait sur le total ; ce qui reste porte un lien, « Lire », « Rédiger » ou « Valider » pour qui valide les saisies hors délai. Le titre suit la période choisie."}, {"id": "poste-tableau-de-bord-suivi", "ecran": "Tableau de bord", "titre": "Suivi des patients", "texte": "Les mesures suivies (plaies, glycémie, constantes, INR) avec la dernière valeur, la courbe des dernières mesures et l’évolution. Ce qui sort des bornes, et toute plaie qui ne baisse pas, remonte en tête, et le compteur l’indique « à regarder ». Les filtres « Plaies », « Diabète » et « Constantes » restreignent la liste ; le bouton d’aperçu en bout de ligne ouvre le patient à côté. Le verdict « Hors cible » ou « Dans la cible » n’apparaît que si la prescription porte des bornes ; sinon, seule la tendance est écrite."}, {"id": "poste-tableau-de-bord-non-realises", "ecran": "Tableau de bord", "titre": "Passages non réalisés", "texte": "Les passages dus de la période qui n’ont pas eu lieu, avec leur motif ou la mention « Aucun passage tracé ». Sans motif, « Déclarer le motif » ouvre la déclaration ; un passage signé non réalisé se relit avec « Voir la preuve ». « Tout voir » déplie la liste au-delà de quatre lignes."}, {"id": "poste-tableau-de-bord-envoi", "ecran": "Tableau de bord · pour : infirmier", "titre": "Avant le prochain envoi", "texte": "Contrôle de cohérence des actes signés depuis le dernier envoi : empreintes, prescriptions échues, actes au-delà de la fréquence prescrite, saisies différées non validées et chaîne d’intégrité du journal. « Voir » liste les actes en cause avec leur preuve ; « Valider » mène aux saisies différées. Marquer le point d’envoi le trace au journal : le contrôle suivant ne portera que sur les actes reçus ensuite, et rien n’est possible tant que la chaîne d’intégrité est rompue. Aucune facture n’est télétransmise d’ici.", "etapes": ["Lisez chaque vérification ; ouvrez « Voir » sur celles en anomalie.", "Cliquez « Vérifier et préparer ».", "Relisez le résumé, puis cliquez « Marquer le point d’envoi »."]}, {"id": "poste-tableau-de-bord-cotations", "ecran": "Tableau de bord · pour : infirmier", "titre": "File de contrôle des cotations", "texte": "Les cotations à examiner sur la période, chacune avec son motif (règle de cumul, justification, prescription, divergence, correction, non programmé, saisie différée) et ses codes. « Examiner » ouvre l’élément à contrôler ; « Tout voir » déplie la liste. La pastille « Démonstration » rappelle que le moteur applique des règles provisoires : ne facturez jamais sur cette base."}]}]}, {"id": "aide-poste-patients", "titre": "Poste fixe : patients, soins et plaies", "resume": "Liste des patients, dossier, vues de soin, dispositifs, plaies et ordonnances.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-patients", "ecran": "Patients · pour : infirmier, aide-soignante", "titre": "Patients", "texte": "La liste de tous les patients du cabinet : âge, état de l’identité INS, contextes de prise en charge (HAD, contextes actifs, décès) et nombre de plaies actives. Cliquez une ligne pour ouvrir le dossier. Les en-têtes « Patient », « Âge » et « Plaies actives » trient la liste ; un second clic inverse l’ordre."}, {"id": "poste-patient-nouveau", "ecran": "Patients · pour : infirmier", "titre": "Nouveau patient", "texte": "« Nouveau patient » ouvre le formulaire de création au-dessus de la liste. Seuls l’identité et le lieu de résidence sont obligatoires ; allergies, antécédents, contacts et couverture sociale sont facultatifs et gardent leur source. Dès la création, l’identité, les droits et l’INS sont demandés aux téléservices simulés ; l’identité reste provisoire jusqu’à sa qualification.", "etapes": ["Saisissez le nom de naissance tel qu’il figure sur la pièce d’identité, puis le premier prénom de naissance.", "Renseignez la date de naissance, le sexe et le lieu de résidence.", "Ajoutez si besoin allergies, antécédents, contacts ou NIR avec « Ajouter », puis « Ajouter à la création ».", "Cliquez « Créer le patient » : le dossier s’ouvre, ou les identités ressemblantes vous sont présentées d’abord."]}, {"id": "poste-patient-doublons-creation", "ecran": "Patients · pour : infirmier", "titre": "Identité ressemblante", "texte": "Si une identité proche existe déjà au cabinet, les deux sont comparées côte à côte et chaque écart est marqué « diffère ». Rien n’est fusionné sans votre décision : « Personnes différentes » écarte le rapprochement, « Même personne : fusionner » réunit les dossiers sur l’identité que vous choisissez de conserver. « Décider plus tard » ouvre le nouveau dossier ; le doublon y reste signalé."}, {"id": "poste-patient-vitale", "ecran": "Patients · selon vos droits", "titre": "Carte Vitale", "texte": "En mode démonstration, « Carte Vitale » crée un patient depuis une carte lue par un lecteur simulé. Identité et couverture viennent de la carte ; les droits et l’INS sont ensuite demandés aux téléservices simulés. Le lieu de résidence, que la carte ne porte pas, est à préciser.", "etapes": ["Choisissez la carte insérée dans le lecteur, puis cliquez « Lire la carte ».", "Choisissez le bénéficiaire à créer et le lieu de résidence.", "Cliquez « Créer le dossier », puis « Ouvrir le dossier »."]}, {"id": "poste-patient-badges-ins", "ecran": "Patients · pour : infirmier, aide-soignante", "titre": "Identité", "texte": "La colonne « Identité » dit où en est l’identité nationale de santé. « INS provisoire » : pas encore qualifiée. « INS récupérée » : INSi a répondu, il reste à vérifier une pièce d’identité du patient. « INS qualifiée » : le DMP et la messagerie de santé deviennent possibles."}, {"id": "poste-dossier-patient", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Dossier du patient", "texte": "Le dossier tient en six onglets : « Synthèse », « Soins et plaies », « Prescriptions », « Coordination », « Documents » et « Dossier administratif ». Certains ont des sous-onglets, affichés juste en dessous. L’en-tête reste visible au défilement, avec les puces à vérifier d’un coup d’œil : allergies, INS, HAD, contextes, prescripteur et, pour l’infirmier, DMP et carte Vitale."}, {"id": "poste-dossier-synthese", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Synthèse", "texte": "La vue d’ensemble du patient : alertes en tête, puis la frise de soins, l’évolution des constantes, les soins et dispositifs en cours, les antécédents et les derniers passages. À droite : « À venir » (les prochains passages prévus et les échéances du mois), l’identité, les contacts, les épisodes et contextes. Chaque bloc mène au détail par son lien."}, {"id": "poste-dossier-a-savoir", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "À savoir avant le soin", "texte": "Ce qu’il faut savoir avant de toucher le patient : allergies, événements critiques des sept derniers jours, divergences entre sources, doublons possibles, identité provisoire ou fusionnée, contextes de prise en charge. Une ligne qui attend une décision porte son lien : « Qualifier », « Trancher », « Comparer », « Renseigner » ou « Détail ». Sans alerte, le bloc l’indique en clair."}, {"id": "poste-dossier-frise", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Frise de soins", "texte": "Les 30 derniers jours et les 7 à venir sur une même ligne de temps. Une piste par soin avec ses passages signés, puis la surface et les photos de chaque plaie en cours, les ordonnances et leurs échéances. « Tous les passages » ouvre l’historique complet."}, {"id": "poste-dossier-soins", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Soins en cours", "texte": "Une carte par soin, plaie ou dispositif en cours, avec son rythme, le nombre de passages et la dernière valeur relevée. Cliquez une carte pour ouvrir son suivi. Les soins se tracent sur le terminal, au domicile."}, {"id": "poste-dispositif-pose", "ecran": "Dossier patient · pour : infirmier", "titre": "Poser un dispositif", "texte": "Les champs d’ouverture sont figés après l’enregistrement : une erreur se corrigera par un commentaire. La voie veineuse périphérique, posée au domicile, s’ouvre sur le terminal.", "etapes": ["Dans « Soins en cours », cliquez « Poser un dispositif ».", "Choisissez le type de dispositif, la prescription d’origine et la date de prise en charge.", "Remplissez les champs propres à ce type (nature, localisation, lot…).", "Cliquez « Ouvrir le dispositif »."]}, {"id": "poste-dossier-frequences", "ecran": "Dossier patient · pour : infirmier", "titre": "Fréquences prescrites", "texte": "Ce que servent les tournées, tel que prescrit : rythme, période, dernier passage prévu et état de chaque fréquence. « Modifier » fait démarrer une nouvelle fréquence à la date choisie, l’ancienne s’arrête la veille ; « Arrêter ce soin » retire les passages à venir des tournées. Date de fin atteinte, « Clore le traitement » vous est proposé, jamais automatique."}, {"id": "poste-dossier-passages", "ecran": "Dossier patient · pour : infirmier", "titre": "Passages", "texte": "Tous les passages signés du patient, du plus récent au plus ancien : date, soin, intervenant, cotation et état. Une saisie différée est signalée. « Preuve » ouvre le dossier de preuve du passage."}, {"id": "poste-dossier-cadre-soins", "ecran": "Dossier patient · selon vos droits", "titre": "Seuils et traitement", "texte": "Le traitement distribué, le profil de dépendance et les seuils et bornes prescrits. « Ajouter une ligne », « Modifier » et « Retirer » tiennent le traitement ; « Renseigner le profil » ou « Réviser le profil » tient la dépendance. Chaque changement crée une version, l’historique reste consultable."}, {"id": "poste-dossier-prescriptions", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Prescriptions et plan de soins", "texte": "Les prescriptions du patient, les ordonnances sources versées, le plan de soins et les demandes de renouvellement, puis le prévisionnel et les échéances. Une prescription naît d’une saisie directe ou de la lecture validée d’une ordonnance. Sur chaque prescription, les fréquences prévoient les passages."}, {"id": "poste-dossier-nouvelle-prescription", "ecran": "Dossier patient · pour : infirmier", "titre": "Nouvelle prescription", "texte": "La saisie directe d’une ordonnance, telle qu’écrite. Chaque acte se choisit dans le catalogue, qui indique la fiche qui le servira ; cette fiche affichera la nouvelle prescription jusqu’au premier soin réalisé. La saisie est gardée en brouillon.", "etapes": ["Cliquez « Nouvelle prescription », dans l’en-tête ou le bloc « Prescriptions ».", "Saisissez le prescripteur, la nature et la date ; une prescription hospitalière demande le service.", "Complétez si besoin durée, renouvellements, soins à domicile, dimanches et jours fériés, et le document source.", "Ajoutez chaque acte prescrit avec « Ajouter un acte prescrit ».", "Cliquez « Enregistrer la prescription »."]}, {"id": "poste-dossier-nouvelle-frequence", "ecran": "Dossier patient · pour : infirmier", "titre": "Nouvelle fréquence", "texte": "Sur une prescription, « Nouvelle fréquence » prévoit les passages d’un soin ; « Soins × moments » en prévoit plusieurs d’un coup. Avant tout enregistrement, un aperçu liste chaque passage avec son jour, son moment, sa tournée, son intervenant et ses conflits éventuels.", "etapes": ["Choisissez le type : principale, secondaire (bornée) ou ponctuelle.", "Choisissez le soin, la tournée, le début et, si besoin, le terme.", "Réglez la cadence et cochez les moments.", "Cliquez « Prévoir les passages » et relisez l’aperçu.", "Cliquez « Valider », ou « Valider quand même » avec un motif en cas de conflit."]}, {"id": "poste-dossier-ordonnances-sources", "ecran": "Dossier patient · selon vos droits", "titre": "Ordonnances sources", "texte": "Les ordonnances photographiées au domicile ou numérisées au cabinet. « Verser une ordonnance » dépose un fichier JPEG, PNG ou PDF, rangé sous son empreinte et non modifiable. Une ordonnance versée est lue d’office : la proposition s’ouvre à côté du document. « Lancer la lecture » relit un document déjà versé ; rien n’est créé sans votre validation."}, {"id": "poste-dossier-prise-en-charge", "ecran": "Dossier patient · pour : infirmier", "titre": "Prise en charge", "texte": "Les séjours en HAD du patient. « Déclarer un séjour » saisit la structure, la convention, l’entrée et le motif d’admission ; les ordonnances en cours passent alors « à classer ». Pendant le séjour, « Saisir la lettre de mission » et « Déclarer la sortie » le complètent."}, {"id": "poste-dossier-cadre-ordonnances", "ecran": "Dossier patient · pour : infirmier", "titre": "Cadre des ordonnances", "texte": "Pour chaque ordonnance, qui paie : la caisse, hors périmètre de l’HAD, ou l’HAD. « Classer » fixe ce cadre. Pendant un séjour, garder une ordonnance hors HAD demande un motif."}, {"id": "poste-dossier-accords", "ecran": "Dossier patient · pour : infirmier", "titre": "Accords préalables", "texte": "Le suivi des accords préalables du premier mois, pour les médicaments ou le nursing. « Nouvel accord » part de la date de début du traitement, qui fixe l’échéance ; ensuite « Marquer demandé aujourd’hui », puis « Enregistrer la réponse » de la caisse. Les compteurs de cotation du patient s’affichent en dessous."}, {"id": "poste-dossier-prescriptions-infirmieres", "ecran": "Dossier patient · selon vos droits", "titre": "Prescriptions infirmières", "texte": "Seul ce que porte le référentiel prescriptible se prescrit ; certaines entrées ne se prescrivent qu’en renouvellement à l’identique. Signée, la prescription devient immuable et son PDF rejoint le registre des documents. Les examens prescrits deviennent des lignes « À prélever » de la fiche Prélèvements.", "etapes": ["Cliquez « Nouvelle prescription infirmière ».", "Cherchez chaque produit ou examen dans le référentiel et ajoutez-le.", "Choisissez si besoin la pharmacie ou le laboratoire destinataire.", "Cliquez « Signer la prescription », puis « Signer et produire le PDF ».", "Signez avec la carte CPS (« Signature par carte CPS »), puis cliquez « Envoyer »."]}, {"id": "poste-dossier-partage", "ecran": "Dossier patient · pour : infirmier", "titre": "Partage externe", "texte": "Les consentements du patient, les accès QR émis, le journal des accès et les professionnels préenregistrés. Sans consentement, aucun professionnel externe ne lit ni ne dépose rien. « Révoquer » retire aussitôt un consentement ou un accès."}, {"id": "poste-dossier-qr", "ecran": "Dossier patient · selon vos droits", "titre": "Émettre un QR", "texte": "Le QR ne s’affiche qu’une fois. Seul, il ne donne rien : le professionnel s’identifie par Pro Santé Connect et seuls les droits consentis s’ouvrent. Sa validité ne dépasse jamais la fin du consentement.", "etapes": ["Cliquez « Recueillir un consentement » : professionnel, date de fin, droits, parties lisibles, recueil écrit ou oral.", "Cliquez « Tracer le consentement ».", "Sur ce consentement, cliquez « Émettre un QR » et choisissez la durée de validité.", "Cliquez « Émettre le QR », puis imprimez-le ou montrez-le au professionnel."]}, {"id": "poste-dossier-actes-distance", "ecran": "Dossier patient · selon vos droits", "titre": "Actes à distance", "texte": "Téléconsultation, télésoin ou télé-expertise : chaque acte se trace avec son motif, son début et le consentement du patient. Pour une plaie, seules les photos choisies sont transmises. Ensuite, « Rédiger le compte rendu » se pré-rédige depuis le dossier, à relire puis signer."}, {"id": "poste-dossier-documents", "ecran": "Dossier patient · pour : infirmier", "titre": "Documents", "texte": "Les bilans et courriers du patient, le registre de tous ses documents (produits, reçus, ordonnances, photos), le dossier de preuve par période et l’export FHIR. Chaque document se télécharge ; son empreinte est revérifiée à chaque lecture."}, {"id": "poste-dossier-bilans-patient", "ecran": "Dossier patient · selon vos droits", "titre": "Bilans et courriers", "texte": "Un bilan est pré-rédigé depuis les passages signés de la période ; vous le relisez avant de le signer. Un courrier part de votre texte, un paragraphe par ligne.", "etapes": ["Cliquez « Nouveau document ».", "Choisissez un bilan, un compte rendu d’accès direct ou un courrier.", "Pour un bilan, fixez la période et, si proposé, la plaie ou l’objet suivi ; pour un courrier, l’objet, le destinataire et le texte.", "Cliquez « Pré-rédiger » ou « Rédiger le courrier » : l’éditeur s’ouvre."]}, {"id": "poste-dossier-preuve-periode", "ecran": "Dossier patient · pour : infirmier", "titre": "Dossier de preuve par période", "texte": "Un document unique, prêt à imprimer pour un contrôle : une page de garde, puis un acte par page avec son verdict d’intégrité. Choisissez les dates « Du » et « Au », éventuellement un soin, puis cliquez « Ouvrir le dossier de preuve »."}, {"id": "poste-patient-identite", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Identité", "texte": "L’identité de référence, l’INS et la couverture, chacune avec sa source et son « Historique ». À gauche : les divergences à trancher et les doublons possibles. À droite : la vérification sur pièce d’identité, les téléservices et la déclaration de décès."}, {"id": "poste-patient-ins", "ecran": "Dossier patient · selon vos droits", "titre": "Vérification sur pièce d’identité", "texte": "L’INS n’est qualifiée qu’avec la réponse d’INSi et le contrôle d’une pièce d’identité à haut niveau de confiance ; la carte Vitale n’en est pas une. Les traits de la pièce doivent être ceux du dossier. Si l’identité change ensuite, la pièce est à vérifier de nouveau.", "etapes": ["Dans « Téléservices », cliquez « Interroger » sur la ligne INSi.", "Contrôlez une pièce d’identité du patient.", "Choisissez la pièce présentée et la date, puis cliquez « Identité vérifiée sur cette pièce »."]}, {"id": "poste-patient-teleservices", "ecran": "Dossier patient · pour : infirmier", "titre": "Téléservices", "texte": "INSi, carte Vitale, ADRi et IDB, simulés en démonstration. « Interroger » verse la réponse au dossier avec sa source ; une valeur qui contredit le dossier ouvre une divergence, sans rien écraser. Ils sont aussi interrogés d’office à la création du dossier."}, {"id": "poste-patient-divergences", "ecran": "Dossier patient · pour : infirmier", "titre": "Divergences à trancher", "texte": "Quand deux sources ne disent pas la même chose, les deux valeurs s’affichent côte à côte avec leur source, les écarts marqués « diffère ». Cliquez « Retenir cette valeur » sous celle qui est juste ; l’autre reste au journal. Les divergences tranchées se relisent en bas du bloc."}, {"id": "poste-patient-doublons", "ecran": "Dossier patient · pour : infirmier", "titre": "Doublons possibles", "texte": "Les identités ressemblantes du cabinet, comparées champ par champ. Choisissez l’identité conservée, puis « Même personne : fusionner » ou « Personnes différentes ». Une confirmation dit les conséquences : soins et prescriptions rattachés à l’identité conservée, actes signés intacts, écarts devenus divergences."}, {"id": "poste-patient-deces", "ecran": "Dossier patient · selon vos droits", "titre": "Décès", "texte": "« Déclarer le décès » arrête tout ce qui devait venir : passages, tournées, fréquences, objets suivis, parcours, rappels et accès externes ; les soignants de ses tournées sont notifiés. Rien du dossier n’est effacé. Une erreur se corrige par « Déclaration faite par erreur », avec un motif.", "etapes": ["Cliquez « Déclarer le décès ».", "Saisissez la date du décès et qui a donné l’information ; le commentaire est obligatoire pour « Une autre source ».", "Relisez les conséquences, puis cliquez « Déclarer le décès »."]}, {"id": "poste-patient-antecedents", "ecran": "Dossier patient · pour : infirmier", "titre": "Antécédents et contacts", "texte": "Allergies, pathologies, traitements de fond, groupe sanguin, coordonnées, contacts, fragilité et dépistage, échelle de douleur. Chaque modification crée une version et un retrait reste dans l’« Historique ». Sans allergie, « Aucune allergie connue » enregistre ce statut, distinct de « Non renseigné »."}, {"id": "poste-soin", "ecran": "Vue d'un soin · pour : infirmier, aide-soignante", "titre": "Suivi du soin", "texte": "La page d’un soin du patient : son rythme prescrit, le nombre de passages signés et ses chiffres clés, puis l’historique de ses passages. Chaque ligne mène à sa « Preuve ». Les commentaires portés sur les champs se lisent en bas de page."}, {"id": "poste-soin-signal", "ecran": "Vue d'un soin · pour : infirmier", "titre": "Déclarer un changement de prescription", "texte": "Un changement de posologie, de produit, de rythme, de protocole, d’horaire ou de dosage s’annonce par un bandeau à l’ouverture de la fiche. Le bandeau se lève à la validation du premier passage sous la nouvelle valeur, puis reste en filigrane. Ce lien, réservé à l’infirmier, déclare un changement que la fiche ne calcule pas."}, {"id": "poste-soin-recu", "ecran": "Vue d'un soin · selon vos droits", "titre": "Reçu", "texte": "Dans les tables de passages, « Reçu » ouvre le reçu de cotation du passage, à côté de « Preuve »."}, {"id": "poste-dispositif", "ecran": "Page d'un dispositif · pour : infirmier, aide-soignante", "titre": "Dispositif", "texte": "La page d’un dispositif suivi (perfusion, stomie, sonde, trachéotomie, CPAP, pompe…) : ses compteurs, ses épisodes, ses rappels datés, ses passages signés et la série de ses photos. Le bloc « Ouverture » garde, figés, les champs saisis à la pose. « Preuves de l’épisode » ouvre le dossier de preuve depuis l’ouverture."}, {"id": "poste-dispositif-cloture", "ecran": "Page d'un dispositif · pour : infirmier", "titre": "Clôturer le dispositif", "texte": "La boîte de clôture dit d’abord ses conséquences, puis demande le motif, la date et, selon le type, le retrait ou le devenir du dispositif. Une ligne de perfusion encore ouverte bloque la clôture. Quand une transmission est proposée, gardez un destinataire ou écartez l’envoi avec un motif."}, {"id": "poste-plaies", "ecran": "Plaies · pour : infirmier, aide-soignante", "titre": "Plaies", "texte": "Toutes les plaies du cabinet. Celles qui ne progressent pas viennent en tête : « Sans mesure depuis… » après trois jours sans mesure, « Sans progrès depuis… » quand la valeur n’a pas baissé depuis J0. Les boutons « En cours », « Clôturées » et « Toutes » filtrent la liste ; cliquez une ligne pour ouvrir la plaie."}, {"id": "poste-plaies-colonnes", "ecran": "Plaies · pour : infirmier, aide-soignante", "titre": "Depuis J0", "texte": "Pour chaque plaie : l’épisode en jours et le nombre de pansements, la dernière valeur, la date de mesure et la variation depuis J0 avec sa mini-courbe. Une variation négative signifie que la plaie se réduit."}, {"id": "poste-plaie", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Plaie", "texte": "La fiche d’une plaie : la courbe et les chiffres clés, la comparaison des photos, les phases de cicatrisation, les passages, puis les champs figés à l’ouverture de l’épisode. « Imprimer la fiche » imprime la page ; « Preuves de l’épisode » ouvre le dossier de preuve de l’ouverture à aujourd’hui."}, {"id": "poste-plaie-courbe", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Depuis J0", "texte": "La courbe suit la grandeur de référence de la plaie depuis sa valeur à J0 ; les changements de produit y sont annotés. Au-dessus : valeur actuelle, variation depuis J0, jour de l’épisode, pansements et, s’il y a lieu, agrafes ou fils restants. Un écart de plus de 50 % avec la mesure précédente est signalé à confirmer, jamais bloquant."}, {"id": "poste-plaie-photos", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Comparaison", "texte": "Les deux photos les plus éloignées de la série s’affichent côte à côte, avec leur jour et leur mesure. À partir de trois photos, la bande de vignettes permet de choisir les clichés comparés. La date sous chaque photo ouvre le dossier de preuve du passage."}, {"id": "poste-plaie-passages", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Passages", "texte": "Chaque passage signé : date, intervenant, fibrine, saignement, exsudat purulent, surface ou volume, état. « sans mesure » signale une saisie allégée. « Preuve » ouvre le dossier de preuve du passage."}, {"id": "poste-plaie-cotation", "ecran": "Vue d'une plaie · selon vos droits", "titre": "Cotation", "texte": "La colonne « Cotation » donne les lignes cotées de chaque pansement et leur statut. « Reçu » ouvre le reçu de cotation du passage."}, {"id": "poste-plaie-phases", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Phases de cicatrisation", "texte": "Ce bloc n’apparaît que si les aspects constatés aux passages renseignent les phases : détersion, bourgeonnement, épidermisation, avec leurs jours. Le logiciel ne les déduit pas."}, {"id": "poste-plaie-mesures-photo", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Mesures sur photo", "texte": "La surface de la plaie détourée sur ses photos, à l’échelle de la réglette photographiée avec elle : elle ne dépend ni de l’œil ni de la règle de qui mesure, et se compare donc d’un intervenant à l’autre. Les contours de la première et de la dernière mesure sont superposés à la même échelle ; à côté, le rectangle L × l du passage, qui englobe toujours des coins sains. La courbe reste celle des mesures du passage. Sur un cliché de la comparaison, « Mesurer » ouvre la mesure de cette photo."}, {"id": "poste-mesure-photo", "ecran": "Mesure d'une plaie sur photo · pour : infirmier", "titre": "Mesurer la plaie sur la photo", "texte": "Deux étapes, sur la photo agrandie : poser les deux bouts de la réglette et dire leur écart en centimètres, puis suivre le bord de la plaie. La surface, la longueur et la largeur s’affichent au fur et à mesure ; le serveur refait le calcul depuis vos points au moment d’enregistrer. Une mesure enregistrée ne se modifie plus : « Mesurer à nouveau » la remplace, et l’ancienne reste au dossier.", "etapes": ["Cliquez une graduation de la réglette, puis une autre, le plus loin possible.", "Tapez la longueur lue entre ces deux graduations, puis « Détourer la plaie ».", "Cliquez le long du bord, ou « Proposer un contour » puis un clic au milieu du lit de la plaie.", "Faites glisser un point pour l’ajuster ; un double-clic le retire.", "Cliquez « Enregistrer la mesure »."]}, {"id": "poste-mesure-photo-clavier", "ecran": "Mesure d'une plaie sur photo · pour : infirmier", "titre": "Au clavier", "texte": "Le plan de travail se pilote aussi au clavier : Tab pour y entrer, les flèches déplacent un viseur (Maj pour aller plus vite), Entrée pose le point, Retour arrière retire le dernier. Chaque point posé est annoncé au lecteur d’écran."}, {"id": "poste-mesure-photo-propose", "ecran": "Mesure d'une plaie sur photo · pour : infirmier", "titre": "Proposer un contour", "texte": "L’application lit la couleur du lit de la plaie autour du point cliqué et suit le bord dans toutes les directions ; une plage de fibrine ou un reflet au milieu du lit ne l’arrête pas. C’est une proposition : vous jugez du bord et ajustez les points. La mesure garde la trace d’un contour proposé puis ajusté."}, {"id": "poste-lecture-ordonnance", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Lecture d’ordonnance", "texte": "L’ordonnance est à gauche, telle que photographiée, avec le texte lu ; la proposition est à droite. Chaque valeur lue porte sa confiance ; une valeur douteuse est marquée « À vérifier ». Rien n’est créé avant votre validation."}, {"id": "poste-lecture-identite", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Ordonnance au nom d’un autre patient", "texte": "Le nom et la naissance écrits sur l’ordonnance sont comparés au dossier. S’ils désignent un autre patient, rien ne peut être validé : cliquez « Ce n’est pas ce patient : rejeter », puis « Confirmer le rejet », et versez l’ordonnance dans le bon dossier. Si seul le nom est écrit, ou aucun patient, vérifiez sur le document."}, {"id": "poste-lecture-valider", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Valider", "texte": "La prescription naît avec son document source et ses actes ; les fréquences retenues entrent au planning. Chaque différence entre la proposition et ce que vous validez est conservée. Une ordonnance échue ne se valide pas avec des fréquences qui démarreraient dans le passé.", "etapes": ["Relisez l’en-tête « Prescription » : prescripteur, nature, date, durée, renouvellements.", "Pour chaque ligne lue, gardez ou décochez « Retenir cette ligne », puis vérifiez l’acte prescrit.", "Décochez « Créer la fréquence » si la ligne ne doit pas entrer au planning.", "Choisissez la « Tournée des fréquences ».", "Cliquez « Valider la proposition », ou « Rejeter la proposition » avec un motif."]}, {"id": "poste-lecture-traitement", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Traitement à distribuer", "texte": "Les médicaments lus sur l’ordonnance. Chaque ligne cochée « Verser au traitement » rejoint le traitement du dossier à la validation, avec ce document pour source. La distribution la reprend sans nouvelle saisie."}]}]}, {"id": "aide-poste-organisation", "titre": "Poste fixe : tournées et coordination", "resume": "Tournées, transmissions, signalements, saisies différées, accès externes, télésanté, échanges.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-tournees", "ecran": "Tournées et planning", "titre": "Tournées et planning", "texte": "Cinq vues se partagent l’écran, chacune avec son adresse : « Planning », « Vue du jour », « Itinéraire et carte » (ouverte par défaut), « Prévisionnel et échéances » et « Indicateurs ». Le sous-titre compte les tournées et les intervenants. Un remplaçant voit d’emblée sa période de remplacement, et seuls les patients de sa portée apparaissent."}, {"id": "poste-tournees-itineraire", "ecran": "Tournées et planning", "titre": "Itinéraire et carte", "texte": "L’itinéraire d’une tournée pour un jour, un moment et un rôle, choisis en tête de page, sous les chiffres de la journée (domiciles terminés, soins signés, plus fort retard, trajets, intervenants). La liste « Ordre de passage » s’ouvre sur « À traiter » : retards, arrivées non signalées, prérequis à confirmer, domiciles non placés ; « Voir » ouvre « Avant d’arriver ». La carte affiche tous les parcours du moment, avec les calques « Météo », « Trafic » et « Radar de pluie » ; la frise de la journée les situe dans le temps. Choisir un parcours dans la frise ou sur la carte l’affiche dans la liste."}, {"id": "poste-tournees-ordre", "ecran": "Tournées et planning", "titre": "Ordre de passage", "texte": "Chaque domicile indique l’arrivée estimée, le retard, le trajet et la durée de ses soins. Glissez un domicile ou utilisez ses flèches pour changer l’ordre de ce jour ; « Garder cet ordre par défaut » en fait l’ordre habituel. « Proposer un ordre » affiche un ordre calculé sans l’enregistrer, à appliquer à ce jour, à garder par défaut ou à laisser ; une heure fixe n’est jamais déplacée. Le jour même, l’intervenant attribué signale « Je pars vers … » puis « Je suis arrivé chez … » sur le prochain domicile.", "etapes": ["Cliquez « Heure fixe » sur la ligne du domicile.", "Saisissez l’heure dans « Passage à » ; cochez « chaque jour » pour la garder.", "Validez avec « Fixer » ; « Retirer l’heure fixe » la supprime."]}, {"id": "poste-tournees-avant-arriver", "ecran": "Tournées et planning · pour : infirmier, aide-soignante", "titre": "Avant d’arriver", "texte": "Pour le domicile choisi, ou à défaut le prochain : alertes du dossier, accès au domicile (digicode, étage, clés, stationnement, animaux…), météo et trafic simulés, durée estimée de chaque soin, prérequis à préparer, matériel à emporter et dernier passage. L’accès et la photo de l’entrée restent propres au cabinet, jamais partagés au-dehors ; « Modifier l’accès » et « Ajouter une photo de l’entrée » les complètent. « Placer le repère sur la carte » corrige la position d’un domicile : cliquez ensuite sur la carte à son emplacement."}, {"id": "poste-tournees-preparer-demain", "ecran": "Tournées et planning", "titre": "Préparer demain", "texte": "La préparation porte sur la tournée du lendemain, pour le moment et le rôle choisis. L’ordre proposé place les heures fixes d’abord, respecte les heures prescrites autant que possible, puis prend le plus court ; la durée et la fin estimées se comparent à l’ordre actuel, avec les alertes et les prérequis à préparer la veille. L’ordre validé devient celui du jour ; s’il change ensuite, validez à nouveau. La validation revient à qui tient la tournée ce jour-là, ou à qui organise les tournées.", "etapes": ["Cliquez « Préparer demain » sous l’ordre de passage.", "Relisez l’ordre proposé, les alertes et « À préparer la veille ».", "Cliquez « Valider l’ordre proposé », ou « Valider l’ordre actuel » pour garder le vôtre."]}, {"id": "poste-tournees-planification", "ecran": "Tournées et planning · selon vos droits", "titre": "Planification du jour", "texte": "Pour un jour et un moment : une colonne par intervenant présent, avec ses passages et la charge de sa journée, plus une colonne « À attribuer ». Une carte posée chez un autre intervenant passe à la tournée qu’il sert ce moment-là ; une carte « À attribuer » lui confie sa tournée pour ce jour. La charge recalculée s’affiche avant de poser et rien n’est enregistré avant « Valider le déplacement » ; sauf pour l’IDE responsable, le passage est alors proposé à l’intervenant d’arrivée, qui l’accepte. Vous déplacez les passages que vous servez et ceux « À attribuer » ; l’IDE responsable les déplace tous.", "etapes": ["Prenez la carte : glissez-la à la souris, ou cliquez son bouton « Déplacer ».", "Choisissez la colonne d’arrivée (« Placer ici » au clavier) ; sa charge avec la carte s’affiche.", "Relisez le résumé dans le bandeau.", "Cliquez « Valider le déplacement », ou « Annuler » (Échap)."]}, {"id": "poste-tournees-planning-semaine", "ecran": "Tournées et planning", "titre": "Planning de la semaine", "texte": "Qui tient chaque tournée et chaque moment, jour par jour, pour les « Infirmiers » ou les « Aides-soignantes ». Les pastilles signalent une indisponibilité, un moment « À couvrir », un remplaçant, un échange accepté (« Échangé ») ou en attente (« Proposé »). Les flèches changent de semaine, « Cette semaine » y ramène. Cliquez l’une de vos cases à venir pour proposer un échange."}, {"id": "poste-tournees-planning-glisser", "ecran": "Tournées et planning · pour : infirmier, administration", "titre": "Confier une case du planning", "texte": "Qui organise les tournées voit l’équipe au-dessus du planning, chacun avec le nombre de moments qu’il tient dans la semaine. Glissez une personne sur une case à venir, ou cliquez la case : la fenêtre « Confier » demande pour quelle période (ce jour seulement, jusqu’au dimanche, ou pour la suite) et dit, avant tout envoi, la formation à vérifier pour les soins de ce moment et si la personne tient déjà une autre tournée à la même heure. Rien ne bloque : vous décidez. La personne qui reçoit le moment, et celle qui le perd, sont prévenues par une notification.", "etapes": ["Glissez une personne de l’équipe sur une case à venir, ou cliquez la case.", "Vérifiez la personne choisie et la période.", "Lisez l’avertissement de formation s’il y en a un.", "Cliquez « Confier à … »."]}, {"id": "poste-tournees-a-couvrir", "ecran": "Tournées et planning", "titre": "À couvrir cette semaine", "texte": "Les moments de tournée où des soins sont dus sans personne pour les servir : intervenant indisponible, ou personne d’attribué. Pour chacun, l’application propose un collègue disponible ou un remplaçant. Qui organise les tournées clique « Confier à … » pour réattribuer la période en un geste ; chaque proposition dit combien de moments la personne tient déjà dans la semaine, et une formation à vérifier s’affiche aussitôt après. Les autres voient la proposition sans pouvoir l’appliquer."}, {"id": "poste-tournees-echanges", "ecran": "Tournées et planning", "titre": "Échanges de tournée", "texte": "Vos échanges, ou tous ceux du cabinet pour qui organise les tournées ; les propositions en attente viennent en tête. Le collègue sollicité clique « Accepter » ou « Refuser » (motif facultatif, transmis au demandeur) ; tant que la proposition attend, le demandeur peut la « Retirer ». Le planning suit la réponse.", "etapes": ["Cliquez « Proposer un échange », ou l’une de vos cases à venir du planning.", "Choisissez la tournée et le moment que vous cédez, le collègue du même rôle et la période.", "Indiquez la contrepartie : « Je reprends un de ses moments » ou « Cession, sans contrepartie ».", "Envoyez avec « Proposer l’échange »."]}, {"id": "poste-tournees-indisponibilites", "ecran": "Tournées et planning", "titre": "Indisponibilités", "texte": "Congés, maladies et formations de l’équipe, en cours ou à venir. Chacun déclare et retire les siennes ; qui organise les tournées le fait pour tous. Le motif ne se lit que par l’intéressé et par qui organise les tournées ; les autres voient « Indisponible ».", "etapes": ["Cliquez « Déclarer une absence ».", "Choisissez le motif et les dates « Du » et « Au ».", "Pour une absence qui revient, c
