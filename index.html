ée", "Visible aussi sur la fiche du patient, jusqu'au premier soin sous la nouvelle valeur."]]}, {"type": "h", "texte": "Au poste fixe : la facturation"}, {"type": "table", "entetes": ["Nouveauté", "Ce qui change pour vous"], "lignes": [["Circuit en cinq étapes", "Vérifier, Facturer, Sécuriser, Télétransmettre, Retours : en tête de chaque page, avec ce qui attend et son montant de démonstration."], ["Chaque ligne s'explique", "Règle NGAP en clair (article 11 B, majorations, IFD et IK, BSI, avenant 11), montant, et lien vers la preuve de l'acte."], ["File de contrôle", "La cotation à la signature en regard de celle du moteur, « Pourquoi en file » par motif, arbitrage groupé avec un motif commun."], ["Vérifier puis télétransmettre", "Le contrôle de cohérence se lit d'abord sans rien enregistrer, puis mise en lot et télétransmission d'un seul geste."], ["Rejets", "Regroupés par motif, avec l'action à mener et le montant en jeu ; une décision pour plusieurs FSE."], ["Mode contrôle CPAM", "Accès en lecture seule remis au contrôleur, limité à un patient et une période, révocable ; chaque lecture est tracée (identité du contrôleur déclarée : question Q-140)."], ["Intégrité d'un lot", "Un lot dont la chaîne du journal est rompue reste refusé ; seul le responsable du cabinet peut forcer, avec un motif, et le lot porte « Intégrité forcée »."]]}, {"type": "note", "ton": "info", "texte": "Détails : « Documents » → « Audits et UX », notes du 22 octobre (terminal, facturation)."}]}, {"id": "nouveautes-design", "titre": "Nouveau design du poste fixe et du terminal (23 octobre)", "resume": "Barre du haut, menus, panneaux et tableaux au poste fixe ; menus sous le pouce et feuilles unifiées au terminal.", "mots_cles": ["nouveautés", "design", "menus", "panneaux", "raccourcis", "barre latérale", "terminal", "feuilles"], "blocs": [{"type": "table", "entetes": ["Où", "Ce qui change pour vous"], "lignes": [["Poste fixe · barre du haut", "Où vous êtes (« Soins › Patients › Bernard Louis »), la recherche Ctrl K, l'aide F1 et les notifications, toujours visibles."], ["Poste fixe · barre latérale", "Se réduit aux icônes (touche « [ ») ; votre nom ouvre un menu (paramètres, sessions, aide, déconnexion) ; sur téléphone, elle devient un tiroir."], ["Poste fixe · raccourcis", "G puis une lettre pour aller à une page (A Aujourd'hui, P Patients, T Tournées…), affichés dans la recherche et les menus."], ["Poste fixe · listes", "Un menu « ⋯ » par patient (dossier, soins et plaies, transmissions, identité, preuve) ; en-têtes de tableau qui restent visibles."], ["Terminal · menus", "Le menu « ⋮ » s'ouvre en bas, sous le pouce, avec des actions groupées et iconographiées ; « Abandonner la saisie » en dernier, en rouge."], ["Terminal · Moi", "Réglages groupés (Tournée, Réglages, Affichage, Assistance, Session) ; « Changer d'intervenant » à part, en dernier."], ["Terminal · choix", "Dates et heures en français ; listes de choix en bas de l'écran, l'option en cours cochée ; feuilles du bas à une seule forme."]]}, {"type": "note", "ton": "info", "texte": "Avant/après écran par écran : « Démarrer » → « Démos, vidéos et design »."}]}]}]}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('donnees').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...enfants) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'texte') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (const e of enfants.flat()) if (e != null) n.append(e);
    return n;
  };
  const sauver = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} };
  const lire = k => { try { return localStorage.getItem(k) } catch (e) { return null } };

  // Pages à plat, dans l'ordre, et index des aides contextuelles (liens « En savoir plus » des applications)
  const pages = [], parId = new Map(), aideVersPage = new Map();
  for (const r of D.rubriques) for (const p of r.pages) {
    const entree = { ...p, rubrique: r };
    pages.push(entree); parId.set(p.id, entree);
    for (const b of p.blocs) if (b.type === 'aides') for (const a of b.items) aideVersPage.set(a.id, p.id);
  }

  // --- Recherche : sans accents, par mots, titre et mots-clés pondérés ---
  const plat = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const texteBloc = b => [b.texte, b.items && b.items.map(i => typeof i === 'string' ? i : [i.q, i.r, i.terme, i.definition, i.titre, i.texte, i.resume, (i.etapes || []).join(' ')].join(' ')).join(' '),
    b.entetes && b.entetes.join(' '), b.lignes && b.lignes.map(l => l.join(' ')).join(' ')].filter(Boolean).join(' ');
  const index = [];
  for (const p of pages) {
    index.push({ page: p.id, ancre: null, titre: p.titre, chemin: p.rubrique.titre, extrait: p.resume || '', fort: plat(p.titre + ' ' + (p.mots_cles || []).join(' ')), corps: plat(p.resume + ' ' + p.blocs.map(texteBloc).join(' ')), brut: p.resume + ' ' + p.blocs.map(texteBloc).join(' ') });
    for (const b of p.blocs) {
      if (b.type === 'faq') b.items.forEach((f, i) => index.push({ page: p.id, ancre: p.id + '-q' + i, titre: f.q, chemin: p.rubrique.titre + ' › ' + p.titre, extrait: f.r, fort: plat(f.q), corps: plat(f.r), brut: f.r }));
      if (b.type === 'aides') b.items.forEach(a => index.push({ page: p.id, ancre: a.id, titre: a.titre, chemin: 'Aide › ' + (a.ecran || p.titre), extrait: a.texte, fort: plat(a.titre + ' ' + (a.ecran || '')), corps: plat(a.texte + ' ' + (a.etapes || []).join(' ')), brut: a.texte }));
      if (b.type === 'glossaire') b.items.forEach(g => index.push({ page: p.id, ancre: null, titre: g.terme, chemin: p.rubrique.titre + ' › ' + p.titre, extrait: g.definition, fort: plat(g.terme), corps: plat(g.definition), brut: g.definition }));
    }
  }
  const chercher = q => {
    const mots = plat(q).split(/[^a-z0-9]+/).filter(m => m.length > 1);
    if (!mots.length) return [];
    return index.map(e => {
      let s = 0;
      for (const m of mots) {
        const f = e.fort.includes(m), c = e.corps.includes(m);
        if (!f && !c) return null;
        s += (f ? 10 : 0) + (c ? 2 : 0) + (e.fort.startsWith(m) ? 4 : 0);
      }
      return { e, s: s + (e.ancre ? 0 : 1) };
    }).filter(Boolean).sort((a, b) => b.s - a.s).slice(0, 12).map(x => ({ ...x.e, mots }));
  };
  const extraitAvec = (brut, mots) => {
    const p = plat(brut); let i = -1;
    for (const m of mots) { i = p.indexOf(m); if (i >= 0) break; }
    const debut = Math.max(0, i - 50), bout = brut.slice(debut, debut + 150);
    const frag = document.createDocumentFragment();
    if (debut > 0) frag.append('… ');
    const re = new RegExp('(' + mots.map(m => m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    const pb = plat(bout); let last = 0, m;
    while ((m = re.exec(pb))) { frag.append(bout.slice(last, m.index), el('em', { texte: bout.slice(m.index, m.index + m[0].length) })); last = m.index + m[0].length; }
    frag.append(bout.slice(last)); if (debut + 150 < brut.length) frag.append(' …');
    return frag;
  };

  const champ = $('#champ-recherche'), liste = $('#liste-resultats');
  let choix = -1, trouves = [];
  const fermer = () => { liste.hidden = true; champ.setAttribute('aria-expanded', 'false'); choix = -1 };
  const afficherResultats = () => {
    trouves = chercher(champ.value); liste.replaceChildren(); choix = trouves.length ? 0 : -1;
    if (!champ.value.trim()) return fermer();
    if (!trouves.length) liste.append(el('div', { class: 'vide', texte: 'Aucun résultat. Essayez un autre mot (ex. « tournée », « signature », « remplaçant »).' }));
    trouves.forEach((r, i) => liste.append(el('a', { class: 'resultat', role: 'option', id: 'res-' + i, 'aria-selected': i === 0 ? 'true' : 'false',
      href: '#' + (r.ancre || r.page), onclick: fermer }, el('small', { class: 'chemin', texte: r.chemin }), el('b', { texte: r.titre }), el('span', {}, extraitAvec(r.brut || r.extrait, r.mots)))));
    liste.hidden = false; champ.setAttribute('aria-expanded', 'true');
  };
  const surligner = () => [...liste.querySelectorAll('.resultat')].forEach((a, i) => { a.setAttribute('aria-selected', i === choix ? 'true' : 'false'); if (i === choix) { a.scrollIntoView({ block: 'nearest' }); champ.setAttribute('aria-activedescendant', a.id) } });
  champ.addEventListener('input', afficherResultats);
  champ.addEventListener('focus', () => champ.value && afficherResultats());
  champ.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && trouves.length) { e.preventDefault(); choix = (choix + 1) % trouves.length; surligner() }
    else if (e.key === 'ArrowUp' && trouves.length) { e.preventDefault(); choix = (choix - 1 + trouves.length) % trouves.length; surligner() }
    else if (e.key === 'Enter' && choix >= 0) { e.preventDefault(); const r = trouves[choix]; fermer(); champ.blur(); location.hash = r.ancre || r.page; aller() }
    else if (e.key === 'Escape') { fermer(); champ.blur() }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.recherche')) fermer() });
  document.addEventListener('keydown', e => {
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName))) { e.preventDefault(); champ.focus(); champ.select() }
  });

  // --- Navigation ---
  const nav = $('#nav');
  const fermees = new Set(JSON.parse(lire('portail-fermees') || '[]'));
  for (const r of D.rubriques) {
    const bloc = el('div', { class: 'rubrique', 'data-ferme': fermees.has(r.id) });
    const bouton = el('button', { 'aria-expanded': String(!fermees.has(r.id)), onclick: () => {
      const f = bloc.toggleAttribute('data-ferme'); bouton.setAttribute('aria-expanded', String(!f));
      f ? fermees.add(r.id) : fermees.delete(r.id); sauver('portail-fermees', JSON.stringify([...fermees])) } },
      el('span', { texte: r.titre }), el('span', { class: 'chevron', 'aria-hidden': 'true', texte: '▾' }));
    bloc.append(bouton, el('ul', {}, r.pages.map(p => el('li', {}, el('a', { href: '#' + p.id, 'data-page': p.id, texte: p.titre })))));
    nav.append(bloc);
  }
  const corps = document.body, boutonMenu = $('#bouton-menu');
  boutonMenu.addEventListener('click', () => { const o = corps.toggleAttribute('data-menu'); boutonMenu.setAttribute('aria-expanded', String(o)) });
  nav.addEventListener('click', e => { if (e.target.closest('a')) { corps.removeAttribute('data-menu'); boutonMenu.setAttribute('aria-expanded', 'false') } });

  // --- Thème ---
  const theme = lire('portail-theme'); if (theme) document.documentElement.dataset.theme = theme;
  $('#bouton-theme').addEventListener('click', () => {
    const sombre = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = sombre ? 'light' : 'dark'; sauver('portail-theme', document.documentElement.dataset.theme);
  });

  // --- Rendu d'une page ---
  const ancre = t => plat(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
  const rendreBloc = (b, p) => {
    switch (b.type) {
      case 'p': return el('p', { texte: b.texte });
      case 'h': return el('h2', { id: p.id + '--' + ancre(b.texte), texte: b.texte });
      case 'liste': return el('ul', {}, b.items.map(i => el('li', { texte: i })));
      case 'etapes': return el('ol', { class: 'etapes' }, b.items.map(i => el('li', {}, el('span', { texte: i }))));
      case 'note': return el('div', { class: 'note', 'data-ton': b.ton || 'info' }, el('strong', { texte: b.ton === 'attention' ? 'Attention' : 'Bon à savoir' }), b.texte);
      case 'code': {
        const pre = el('pre', {}, el('code', { texte: b.texte }));
        const btn = el('button', { class: 'copier', type: 'button', texte: 'Copier', onclick: () => {
          const ok = () => { btn.textContent = 'Copié'; setTimeout(() => btn.textContent = 'Copier', 1500) };
          (navigator.clipboard ? navigator.clipboard.writeText(b.texte) : Promise.reject()).then(ok, () => { const s = getSelection(), r = document.createRange(); r.selectNodeContents(pre.firstChild); s.removeAllRanges(); s.addRange(r) });
        } });
        pre.append(btn); return pre;
      }
      case 'table': return el('div', { class: 'tableau' }, el('table', {}, el('thead', {}, el('tr', {}, b.entetes.map(h => el('th', { texte: h })))), el('tbody', {}, b.lignes.map(l => el('tr', {}, l.map(c => el('td', { texte: c })))))));
      case 'faq': return el('div', {}, b.items.map((f, i) => el('details', { class: 'faq', id: p.id + '-q' + i }, el('summary', { texte: f.q }), el('div', { texte: f.r }))));
      case 'glossaire': return el('dl', { class: 'glossaire' }, b.items.map(g => [el('dt', { texte: g.terme }), el('dd', { texte: g.definition })]));
      case 'aides': return el('div', {}, b.items.map(a => el('article', { class: 'aide-carte', id: a.id },
        el('div', {}, a.ecran ? el('span', { class: 'etiquette', texte: a.ecran }) : null),
        el('h3', { texte: a.titre }), el('p', { texte: a.texte }),
        a.etapes && a.etapes.length ? el('ol', { class: 'etapes' }, a.etapes.map(x => el('li', {}, el('span', { texte: x })))) : null)));
      case 'liens': return el('ul', { class: 'liens' }, b.items.map(i => {
        const interne = i.href.startsWith('#');
        return el('li', {}, el('a', { href: i.href },
          el('b', { texte: i.titre }), i.resume ? el('span', { texte: i.resume }) : null,
          el('small', { texte: interne ? 'Page du portail' : 'Document · ' + i.href.split('/').pop() })));
      }));
      default: return null;
    }
  };
  const contenu = $('#contenu'), sommaire = $('#sommaire');
  const accueil = () => {
    const premiere = r => r.pages[0];
    return el('div', { class: 'page' },
      el('h1', { texte: 'Comment pouvons-nous vous aider ?' }),
      el('p', { class: 'chapeau', texte: 'Guides du poste fixe et du terminal, aide écran par écran, questions fréquentes et documentation technique de TabSanté. Tapez un mot dans la recherche ou choisissez une rubrique.' }),
      el('div', { class: 'accueil-grille' }, D.rubriques.map(r => el('a', { href: '#' + premiere(r).id }, el('b', { texte: r.titre }), el('span', { texte: r.description || (r.pages.length + ' pages') })))),
      el('p', { class: 'pied', texte: 'Version : ' + D.version }));
  };
  const montrer = (id, cible) => {
    const p = parId.get(id);
    document.querySelectorAll('nav a[aria-current]').forEach(a => a.removeAttribute('aria-current'));
    sommaire.replaceChildren();
    if (!p) { contenu.replaceChildren(accueil()); document.title = 'Portail TabSanté'; return }
    const lien = nav.querySelector('a[data-page="' + id + '"]'); if (lien) { lien.setAttribute('aria-current', 'page'); lien.closest('.rubrique').removeAttribute('data-ferme') }
    const i = pages.indexOf(p), prec = pages[i - 1], suiv = pages[i + 1];
    const page = el('article', { class: 'page' },
      el('div', { class: 'fil', texte: p.rubrique.titre }), el('h1', { texte: p.titre }), p.resume ? el('p', { class: 'chapeau', texte: p.resume }) : null,
      p.blocs.map(b => rendreBloc(b, p)),
      el('nav', { class: 'suite', 'aria-label': 'Pages voisines' },
        prec ? el('a', { href: '#' + prec.id }, el('span', { texte: '← Précédent' }), prec.titre) : el('span'),
        suiv ? el('a', { href: '#' + suiv.id }, el('span', { texte: 'Suivant →' }), suiv.titre) : el('span')));
    contenu.replaceChildren(page);
    const titres = page.querySelectorAll('h2');
    if (titres.length > 1) sommaire.append(el('b', { texte: 'Sur cette page' }), ...[...titres].map(h => el('a', { href: '#' + p.id, onclick: e => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }) }, texte: h.textContent })));
    document.title = p.titre + ' · Portail TabSanté';
    const c = cible && document.getElementById(cible);
    if (c) { if (c.tagName === 'DETAILS') c.open = true; c.setAttribute('data-cible', ''); c.scrollIntoView({ block: 'start' }) } else window.scrollTo(0, 0);
  };
  const aller = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (parId.has(h)) return montrer(h);
    if (aideVersPage.has(h)) return montrer(aideVersPage.get(h), h);
    const q = h.match(/^(.*)-q\d+$/); if (q && parId.has(q[1])) return montrer(q[1], h);
    montrer(null);
  };
  addEventListener('hashchange', aller);
  aller();
})();
</script>
