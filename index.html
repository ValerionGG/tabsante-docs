p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-SE-05 (Bloqué), SEC-06 (Partiel)"}, {"type": "h", "texte": "D-06 · Durées de conservation des données"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "Chaque type de donnée doit avoir une durée de conservation : photos, journaux d'accès, transmissions, comptes rendus, codes d'accès au domicile, horaires de passage, positions. Des durées provisoires s'appliquent. Si le journal des accès est gardé plus de 180 jours, une modification technique est nécessaire pour l'empêcher d'être effacé plus tôt."}, {"type": "p", "texte": "Question : Validez-vous le tableau des durées provisoires, ou le DPO en fixe-t-il un autre ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Valider le tableau provisoire (appliqué aujourd'hui)", "Journal des accès et sessions 1 an, dossier 20 ans (et au moins jusqu'aux 28 ans du patient), photos et transmissions avec le dossier, accès au domicile pendant la prise en charge, positions 12 heures, horaires sans limite."], ["B", "Le DPO fixe une durée par type de donnée", "Durées conformes à l'avis du DPO ; tableau à remplir."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Durées provisoires branchées, purges à blanc puis inscrites à la chaîne d'audit ; journal des accès jamais effacé avant 180 jours ; dossiers au terme signalés, jamais supprimés ; codes et photo d'entrée du domicile jamais exportés."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : DPO"}, {"type": "p", "texte": "Références : Q-37, Q-43 (durée), Q-45, Q-58, CDC §10, NFR-09, SEC-01"}, {"type": "h", "texte": "Q-66 · Copie hors site de la chaîne d'audit"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "Le journal d'audit est chaîné pour qu'aucune modification ne passe inaperçue. Pour qu'il soit opposable, chaque maillon doit aussi être copié hors du serveur, dans un stockage non modifiable. Sans ce puits, l'application refuse de démarrer en production."}, {"type": "p", "texte": "Question : Où copier les ancres de la chaîne d'audit en production ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Stockage non modifiable (WORM) de l'hébergeur", "Solution la plus solide, à prévoir au contrat d'hébergement."], ["B", "Collecteur de journaux d'un tiers", "Séparation forte ; un prestataire de plus."], ["C", "Envoi par courriel à une boîte dédiée", "Simple ; moins robuste."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Démarrage refusé hors développement sans adresse de puits configurée."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-SE-04, MOD-46"}, {"type": "h", "texte": "Q-68 · Tracer les recherches faites hors connexion"}, {"type": "p", "texte": "Au terminal sans réseau, l'infirmière peut chercher un patient parmi les données du jour, déjà tracées au téléchargement. Chaque consultation hors connexion n'est pas tracée, par minimisation. Le DPO doit dire si une trace de chaque dossier ouvert hors connexion doit remonter à la reconnexion."}, {"type": "p", "texte": "Question : Faut-il tracer chaque dossier consulté hors connexion ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, le téléchargement du jour suffit (appliqué aujourd'hui)", "Moins de données de traçage."], ["B", "Oui, trace remontée à la reconnexion", "Traçabilité complète des accès."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Seule la précharge du jour est tracée ; réversible sans migration."}, {"type": "p", "texte": "Priorité : Important · Qui répond : DPO"}, {"type": "p", "texte": "Références : SEC-06, MOD-46"}, {"type": "h", "texte": "AUTRE-08 · Codes LOINC et SNOMED des listes et mesures"}, {"type": "p", "texte": "Pour échanger avec le DMP et les autres logiciels, chaque liste (constantes, antécédents, allergies, états cutanés…) doit porter des codes internationaux (LOINC, SNOMED CT). Les correspondances actuelles ont été proposées par le développement et ne sont pas validées : elles ne doivent pas être exportées."}, {"type": "p", "texte": "Question : Qui fournit et valide les codes LOINC et SNOMED des listes ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "TABSANTE fournit et valide les correspondances, publiées par famille", "Codes fiables pour le DMP ; travail de terminologie à prévoir."], ["B", "Un prestataire en terminologie médicale", "Expertise immédiate ; coût et contrat."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Codes externes de démonstration non validés, ou vides ; validation datée par famille prévue dans le référentiel publié."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : C16 (Partiel), EX-DS-02, EX-DS-09, EX-PV-03, MOD-13"}, {"type": "h", "texte": "Q-99 · Jeton Keycloak ou session TabSanté"}, {"type": "p", "texte": "Depuis le lot L18, Keycloak est installé comme courtier d'identité (CDC §12, « Keycloak + CPS »). Il sert à s'identifier : le jeton qu'il délivre est échangé une seule fois contre la session TabSanté, liée au terminal enrôlé, qui garde la rotation, la révocation d'un terminal perdu et la sortie du cabinet (CDC §10). La session Keycloak est refermée aussitôt l'échange fait, et chaque connexion redemande l'identification, parce qu'un poste peut être partagé et qu'un téléphone peut changer de mains. NFR-04 est passé à Simulé (seule la carte CPS réelle manque) ; SEC-04 reste Partiel."}, {"type": "p", "texte": "Question : Gardez-vous ce partage (Keycloak identifie, TabSanté garde sa propre session), ou le jeton Keycloak doit-il ouvrir directement toutes les fonctions ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Keycloak identifie, TabSanté garde sa session (appliqué aujourd'hui)", "Déjà en place ; révocation d'un terminal, rotation et sortie du cabinet restent tenues par TabSanté ; identification redemandée à chaque connexion."], ["B", "Le jeton Keycloak vaut sur toutes les fonctions", "Une seule session, celle de Keycloak ; le lien au terminal enrôlé, sa révocation et la sortie du cabinet sont à reporter dans Keycloak."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Décision par défaut du 22/10/2026 (lot L18) : le jeton Keycloak ne sert qu'à l'échange contre la session TabSanté liée au terminal enrôlé et ne vaut nulle part ailleurs ; la session Keycloak est refermée aussitôt l'échange fait."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §12, §10, NFR-04 (Simulé), SEC-04 (Partiel), matrice de couverture §7.1"}, {"type": "h", "texte": "Q-106 · Rétention de la base locale du terminal"}, {"type": "p", "texte": "Le terminal garde au domicile une copie chiffrée des données pour travailler sans réseau. Le CDC §8.1 laisse « taille et durée de rétention » à préciser. Aujourd'hui, la précharge est remplacée à chaque téléchargement, jamais cumulée ; un patient créé au domicile hors tournée reste sur le téléphone le jour de sa création, ou tant qu'un envoi le concernant attend ; les reçus de signature (200 derniers) et les carnets de créations par carte Vitale et de FSE (50 derniers) sont bornés ; un brouillon vit jusqu'à sa signature ou son abandon. Une précharge d'un jour passé reste lisible hors connexion, datée, jusqu'au retour du réseau. Un terminal révoqué ou perdu est effacé à distance."}, {"type": "p", "texte": "Question : Le DPO valide-t-il ces durées, avec celles de D-06, et faut-il garder plus longtemps sur le téléphone les patients créés hors tournée ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Valider les durées actuelles (appliqué aujourd'hui)", "Le moins de données possible sur le téléphone ; un patient créé hors tournée n'y survit pas au jour de sa création (sauf envoi en attente) et se retrouve au poste fixe."], ["B", "Garder plus longtemps les patients créés hors tournée", "Utile si le patient est revu les jours suivants sans être encore planifié ; plus de données au domicile, durée à fixer et à justifier dans l'analyse d'impact."], ["C", "Le DPO fixe d'autres durées", "Durées conformes à son avis, à reporter dans le tableau de D-06 et dans le terminal."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Décision par défaut du 22/10/2026 (lot Finitions), réversible : précharge remplacée à chaque téléchargement, patient hors tournée gardé le jour de sa création ou tant qu'un envoi le concerne, carnets bornés (200 reçus, 50 créations Vitale et FSE), brouillon gardé jusqu'à signature ou abandon."}, {"type": "p", "texte": "Priorité : Important · Qui répond : DPO"}, {"type": "p", "texte": "Références : CDC §8.1, D-06, AUTRE-07, matrice de couverture §7.1, documentation d'exploitation, chiffrement §3 bis"}, {"type": "h", "texte": "D-12 · Représentation des plaies et dispositifs pour le DMP"}, {"type": "p", "texte": "Pour le DMP, chaque objet suivi doit être décrit dans le format d'échange FHIR. Provisoirement, une plaie ou un orifice est décrit comme une « affection », un matériel comme un « dispositif »."}, {"type": "p", "texte": "Question : Validez-vous cette représentation provisoire des objets suivis ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui : lésions en affection, matériel en dispositif (appliqué aujourd'hui)", "La règle provisoire devient définitive."], ["B", "Faire trancher par un expert en interopérabilité, type par type", "Conforme aux profils officiels ; travail d'expertise."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Lésion ou orifice en Condition, matériel en Device, étiquetés « provisoire »."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §4.1"}]}, {"id": "qo-referentiels", "titre": "Référentiels, licences et partenaires", "resume": "Prescriptible, NANDA-I, ALD, courbes de croissance, terminal cible, visio, phasage : référentiels et partenaires.", "mots_cles": ["D-14", "Q-33", "D-03", "Q-16", "Q-20", "AUTRE-09", "AUTRE-15", "Q-24", "D-09", "référentiel", "prescriptible", "NANDA-I", "ALD", "croissance", "dialysat", "terminal", "visioconférence", "phasage"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "9 questions, dont 1 bloquante."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["D-14", "Référentiel de ce que l'infirmière peut prescrire", "Bloquant", "Fondateur", "Rien de choisi"], ["Q-33", "Outil de TABSANTE pour publier les référentiels", "Important", "Fondateur", "A · Par un script technique, un seul publieur"], ["D-03", "Licence NANDA-I des diagnostics infirmiers", "Important", "Fondateur", "Rien de choisi"], ["Q-16", "Courbes de croissance de l'enfant", "Important", "Fondateur", "Rien de choisi"], ["Q-20", "Liste des affections de longue durée (ALD)", "Important", "Fondateur", "B · Garder la liste de démonstration"], ["AUTRE-09", "Terminal mobile cible", "Important", "Fondateur", "Rien de choisi"], ["AUTRE-15", "Service de visioconférence des actes à distance", "Important", "Fondateur", "Rien de choisi"], ["Q-24", "Référentiel des dialysats", "Confort", "Fondateur", "B · Garder les codes de démonstration"], ["D-09", "Phasage des livraisons", "Confort", "Fondateur", "A · Lots internes, sans jalon client"]]}, {"type": "h", "texte": "D-14 · Référentiel de ce que l'infirmière peut prescrire"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "L'infirmière peut prescrire certains produits et examens (arrêté du 26 juin 2026). L'application a besoin d'une liste à jour, distinguant prescription et renouvellement à l'identique. La liste actuelle est un extrait de départ et ne doit pas servir à prescrire en réel."}, {"type": "p", "texte": "Question : D'où vient la liste prescriptible, et qui la met à jour ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "TABSANTE la tient d'après le texte officiel, avec un responsable nommé", "Maîtrise complète ; veille réglementaire à assurer."], ["B", "Une base externe sous contrat", "Mise à jour fournie ; coût et dépendance."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Liste de démonstration branchée, non vérifiée au Journal officiel, responsable à désigner."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-PI-09"}, {"type": "h", "texte": "Q-33 · Outil de TABSANTE pour publier les référentiels"}, {"type": "p", "texte": "Les listes communes (ALD, matériel de stomie, prescriptible, antécédents, compétences, trame, motifs de consultation) sont publiées par TABSANTE avec une date d'effet et une trace. Les cabinets les lisent sans les modifier, alors que le cahier des charges dit que l'administrateur « gère les référentiels ». Les demandes de nouveau motif des cabinets n'obtiennent aujourd'hui aucune réponse."}, {"type": "p", "texte": "Question : Comment TABSANTE publie-t-il les référentiels, et qui valide ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Par un script technique, un seul publieur (appliqué aujourd'hui)", "Déjà en place ; dépend d'une personne technique."], ["B", "Par une interface web de TABSANTE, avec relecture par une seconde personne", "Plus sûr et traçable ; à développer, avec réponse aux demandes des cabinets."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Brouillon contrôlé puis publication par script (empreinte, date d'effet croissante, auteur, motif, chaîne d'audit) ; demandes de motif déposées sans réponse au cabinet ; administrateur du cabinet en lecture seule."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-32, ACT-07 (Partiel), EX-CI-06, AV-14"}, {"type": "h", "texte": "D-03 · Licence NANDA-I des diagnostics infirmiers"}, {"type": "p", "texte": "Les diagnostics infirmiers peuvent être codés selon la classification NANDA-I, sous licence payante. Sans licence, l'infirmière écrit en texte libre et une petite liste fictive sert à la démonstration."}, {"type": "p", "texte": "Question : Faut-il acquérir la licence NANDA-I ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui", "Diagnostics codés, échangeables ; coût de licence."], ["B", "Non, texte libre seulement", "Aucun coût ; diagnostics non codés."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Texte libre en surface, sous-ensemble de démonstration aux codes fictifs."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-SC-02"}, {"type": "h", "texte": "Q-16 · Courbes de croissance de l'enfant"}, {"type": "p", "texte": "Les courbes de croissance utilisées sont celles de l'OMS de 0 à 5 ans, sous licence non commerciale : elles ne peuvent pas rester dans un produit vendu. Il faut une licence commerciale ou les courbes françaises du carnet de santé (droits à négocier), et une référence au-delà de 5 ans."}, {"type": "p", "texte": "Question : Quelles courbes de croissance utiliser ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "OMS, avec licence commerciale", "Courbes internationales ; licence à obtenir."], ["B", "Courbes françaises 2018 du carnet de santé", "Celles que les familles connaissent ; droits à négocier."], ["C", "Pas de courbes en production", "Mesures affichées sans courbe."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Courbes OMS 2006 de 0 à 5 ans, mention « Référence de démonstration » ; aucune courbe au-delà de 5 ans."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-PV-02 quater"}, {"type": "h", "texte": "Q-20 · Liste des affections de longue durée (ALD)"}, {"type": "p", "texte": "L'avenant 11 donne des droits liés à certaines ALD. La liste utilisée a été reprise pour la démonstration et doit être validée, ainsi que les critères des ALD 23 retenues et la lecture de l'ALD par l'aide-soignant."}, {"type": "p", "texte": "Question : Qui valide la liste des ALD et ses mises à jour ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "TABSANTE valide et publie la liste officielle", "Liste fiable, mise à jour par version."], ["B", "Garder la liste de démonstration (appliqué aujourd'hui)", "Risque d'écart avec la liste officielle."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : ALD 1 à 32 reprises pour la démonstration, toute ALD 23 signalée « à vérifier »."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : AV-11, MOD-02, EX-DS-07"}, {"type": "h", "texte": "AUTRE-09 · Terminal mobile cible"}, {"type": "p", "texte": "Les infirmières utiliseront au domicile un terminal capable de lire la carte CPS et la carte Vitale, de garder ses clés dans une zone sécurisée et de tenir 10 heures de batterie. Le modèle n'est pas choisi : l'essai d'autonomie et le mode kiosque ne peuvent pas être éprouvés."}, {"type": "p", "texte": "Question : Quel terminal les cabinets utiliseront-ils au domicile ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Terminal professionnel double fente (CPS et Vitale)", "Lecture des deux cartes au domicile ; coût d'équipement."], ["B", "Smartphone Android avec lecteur de cartes externe", "Moins cher ; un accessoire à transporter."], ["C", "Smartphone sans lecteur, appli carte Vitale et e-CPS", "Aucun matériel ; dépend de l'équipement des patients et des soignants."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Cartes CPS et Vitale simulées ; protocole d'essai de 10 heures écrit, à dérouler sur le terminal cible."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : TER-02, TER-03, TER-06 (Bloqué), EX-SE-03, matrice de couverture §7 ligne Cartes CPS et Vitale"}, {"type": "h", "texte": "AUTRE-15 · Service de visioconférence des actes à distance"}, {"type": "p", "texte": "Les actes infirmiers à distance (télésoin) demandent un service de visioconférence. Dans la démonstration, une visio simulée s'ouvre depuis le dossier du patient. En production, l'application ouvrirait un lien vers le service retenu, tracé au dossier, sans conserver aucun flux."}, {"type": "p", "texte": "Question : Quel service de visioconférence les cabinets utiliseront-ils ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Un service de télésanté référencé, sous contrat avec TabSanté", "Même outil pour tous les cabinets ; coût et contrat de sous-traitance."], ["B", "Le service que chaque cabinet utilise déjà", "Aucun contrat pour TabSanté ; chaque cabinet vérifie lui-même la conformité."], ["C", "Pas d'actes à distance au lancement", "Aucune dépendance ; fonction reportée."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Visio simulée depuis le dossier en démonstration ; la page Télésanté tient un registre des actes à distance."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : matrice de couverture §7 ligne Solution vidéo, Q-38 (close, doublon de cette ligne), INT-16, EX-CO-03"}, {"type": "h", "texte": "Q-24 · Référentiel des dialysats"}, {"type": "p", "texte": "Les poches de dialyse péritonéale sont identifiées par leur code. L'application utilise cinq codes fictifs ; un code inconnu est signalé, sans blocage."}, {"type": "p", "texte": "Question : Quel référentiel des dispositifs utiliser pour les dialysats, et qui le tient ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Référentiel des dispositifs (codes GS1) tenu par TABSANTE", "Codes réels reconnus au scan."], ["B", "Garder les codes de démonstration (appliqué aujourd'hui)", "Chaque poche réelle est signalée inconnue."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Cinq codes fictifs ; un code absent remonte au responsable du référentiel."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : DIP-RG-18, DIP-RG-32"}, {"type": "h", "texte": "D-09 · Phasage des livraisons"}, {"type": "p", "texte": "Le cahier des charges prévoit un phasage des livraisons, jamais fixé. Le développement avance par lots internes. Il faut savoir quoi livrer en premier à un cabinet pilote."}, {"type": "p", "texte": "Question : Dans quel ordre livrer TabSanté aux cabinets ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Lots internes, sans jalon client (appliqué aujourd'hui)", "Pas de date de mise en service engagée."], ["B", "Facturation d'abord, puis le reste des fiches", "Recette réelle au plus tôt ; dépend du moteur et de SESAM-Vitale."], ["C", "Cabinet pilote en traçabilité seule, facturation ensuite", "Retours terrain rapides ; facturation dans l'ancien logiciel en attendant."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Feuille de route et lots internes en tiennent lieu."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §2.4"}]}, {"id": "qo-interface", "titre": "Interface et charte", "resume": "Ordre des listes, charte de couleurs, événement critique, schéma corporel, langues : l'interface.", "mots_cles": ["Q-81", "Q-91", "Q-92", "Q-94", "Q-96", "Q-95", "Q-107", "charte", "couleurs", "À traiter", "événement critique", "schéma corporel", "commentaire", "langues", "traduction"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "7 questions, aucune bloquante."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["Q-81", "Ordre de la liste « À traiter »", "Confort", "IDE référente", "A · Tri par gravité seul"], ["Q-91", "Charte de couleurs", "Confort", "Fondateur", "A · Palette « Clinique premium » avec les règles d'emploi du cahier"], ["Q-92", "Déclarer un événement critique depuis une fiche", "Confort", "IDE référente", "A · Non, menu du passage seulement (sauf PSE et analgésie locorégionale)"], ["Q-94", "Écart d'horaire affiché au terminal", "Confort", "Fondateur", "A · Non, après synchronisation"], ["Q-96", "Schéma corporel : vues zoomées et photo de l'anticoagulant", "Confort", "IDE référente", "A · Non, seulement si une zone s'y trouve"], ["Q-95", "Commentaires sur une ligne de fiche", "Confort", "IDE référente", "A · Oui, plusieurs commentaires par ligne"], ["Q-107", "Langues des clients", "Confort", "Fondateur", "A · Français seul en V2"]]}, {"type": "h", "texte": "Q-81 · Ordre de la liste « À traiter »"}, {"type": "p", "texte": "La liste « À traiter » regroupe ce qui demande une action. Elle est triée par gravité : la sécurité clinique d'abord (dispositif au-delà du prescrit, signalement de l'aide-soignante, plaie sans progrès, téléphone muet), puis les échéances (passages non tracés, bilans), puis l'administratif (saisies tardives, cotations). Un passage dont le motif est déclaré quitte la liste."}, {"type": "p", "texte": "Question : Faut-il compléter le tri par gravité ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Tri par gravité seul (appliqué aujourd'hui)", "Liste unique, le plus urgent en haut."], ["B", "Tri par gravité et passages non tracés regroupés par patient et par soin", "Liste plus courte quand plusieurs passages manquent."], ["C", "Tri par gravité et filtre « Sécurité » à côté de « Soins » et « Facturation »", "Accès direct aux alertes cliniques."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Tri par gravité, puis ordre de lecture ; une seule définition des cotations à contrôler partout."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : EX-TB-04, EX-TB-05, C8"}, {"type": "h", "texte": "Q-91 · Charte de couleurs"}, {"type": "p", "texte": "Le cahier des charges fixe une palette de couleurs. Le design retenu (« Clinique premium ») en garde les règles d'emploi (la couleur jamais seule, seuls l'action et le critique saturés, une rampe d'intensité ambre jamais rouge) mais utilise ses propres teintes."}, {"type": "p", "texte": "Question : Quelle palette de couleurs retenez-vous ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Palette « Clinique premium » avec les règles d'emploi du cahier (appliqué aujourd'hui)", "Design actuel conservé ; le cahier est mis à jour."], ["B", "Palette exacte du cahier des charges partout", "Conforme au texte ; tous les écrans changent de teintes."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Règles d'emploi respectées sur les deux applications, rampe d'intensité aux valeurs du cahier, autres teintes du design « Clinique premium »."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : C17 (Partiel)"}, {"type": "h", "texte": "Q-92 · Déclarer un événement critique depuis une fiche"}, {"type": "p", "texte": "Le cahier des charges veut un seul point d'entrée pour déclarer un événement critique : le menu du passage, présent sur tous les écrans. Les fiches PCA, neuropsychiatrie, paramètres vitaux et soins respiratoires le rappellent sans l'ouvrir ; seules les fiches PSE et analgésie locorégionale l'ouvrent directement, comme leurs règles l'écrivent."}, {"type": "p", "texte": "Question : Faut-il un accès direct à l'événement critique depuis la fiche PCA ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, menu du passage seulement (sauf PSE et analgésie locorégionale) (appliqué aujourd'hui)", "Un seul geste à apprendre."], ["B", "Oui, accès direct à la conduite à tenir de la PCA", "Plus rapide en cas de surdosage ; une exception de plus."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Menu du passage seul point d'entrée, exceptions des fiches PSE et analgésie locorégionale."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : C7, NPS-RG-09, RES-RG-13, VIT-T08, PCA-RG-08, PSE-RG-09, ALR-RG-08"}, {"type": "h", "texte": "Q-94 · Écart d'horaire affiché au terminal"}, {"type": "p", "texte": "Quand un soin est fait loin de son heure prévue, l'écart est affiché, jamais bloquant. Au terminal, il apparaît seulement après la synchronisation suivante, car l'heure de départ des tournées est un réglage du serveur."}, {"type": "p", "texte": "Question : L'écart d'horaire doit-il s'afficher dès la signature au terminal ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, après synchronisation (appliqué aujourd'hui)", "Calcul unique au serveur, toujours juste."], ["B", "Oui, calculé au terminal à la signature", "Information immédiate ; calcul possiblement différent hors connexion."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Écart affiché dès que le serveur l'a calculé, jamais recalculé hors connexion."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : C24"}, {"type": "h", "texte": "Q-96 · Schéma corporel : vues zoomées et photo de l'anticoagulant"}, {"type": "p", "texte": "Le schéma corporel propose des vues zoomées (région sacrée, talons) pour les escarres. Elles n'apparaissent que si une zone y a été posée. Le filtre par produit paraît dès deux produits. La photo du point d'injection d'un anticoagulant est proposée à chaque passage, jamais exigée."}, {"type": "p", "texte": "Question : Faut-il afficher les vues zoomées en permanence ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, seulement si une zone s'y trouve (appliqué aujourd'hui)", "Écran plus simple."], ["B", "Oui, toujours", "Accès direct pour poser une première zone, écran plus chargé."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Vues zoomées affichées quand une zone y est posée ; filtre par produit dès deux produits ; photo de l'anticoagulant offerte, jamais exigée."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : C18, ACI-E16"}, {"type": "h", "texte": "Q-95 · Commentaires sur une ligne de fiche"}, {"type": "p", "texte": "Sur une ligne cochée d'une fiche, l'infirmière peut ajouter plusieurs commentaires ; une constante a un seul commentaire, précédé de la trace automatique. L'historique les reprend tous."}, {"type": "p", "texte": "Question : Confirmez-vous que plusieurs commentaires sont possibles sur une même ligne ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui, plusieurs commentaires par ligne (appliqué aujourd'hui)", "Historique détaillé."], ["B", "Non, un seul commentaire par ligne", "Lecture plus simple."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Plusieurs entrées possibles par case cochée ; un texte par constante."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : C2, STD-E09 à E13, PIV-E01, E02, PSC-E15, VIT-E09, E15"}, {"type": "h", "texte": "Q-107 · Langues des clients"}, {"type": "p", "texte": "L'exigence NFR-11 (accessibilité, langues ; CDC §12) reste Partielle. Le poste fixe, le terminal, les documents produits et les messages sont aujourd'hui en français seulement."}, {"type": "p", "texte": "Question : Quelles langues prévoir (anglais, langues régionales, langues des DROM), et pour quand ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Français seul en V2 (appliqué aujourd'hui)", "Aucun travail ; les documents remis au patient restent en français."], ["B", "Ajouter l'anglais après la V2", "Traduction des libellés, des documents et des messages ; textes à rassembler dans des fichiers de traduction."], ["C", "Ajouter aussi des langues régionales ou des DROM", "Même travail pour chaque langue ; liste et calendrier à fixer."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Décision par défaut du 22/10/2026, réversible : français seul en V2 (libellés, documents, messages)."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : NFR-11 (Partiel), CDC §12, matrice de couverture §7.1"}]}, {"id": "qo-site", "titre": "Site public et légal", "resume": "Éditeur, nom commercial, hébergeur, CGU et prix du site public.", "mots_cles": ["AUTRE-10", "AUTRE-11", "AUTRE-12", "AUTRE-13", "AUTRE-14", "site public", "mentions légales", "éditeur", "nom commercial", "domaine", "CGU", "prix"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "5 questions, dont 2 bloquantes."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["AUTRE-10", "Identité légale de l'éditeur du site", "Bloquant", "Fondateur", "Rien de choisi"], ["AUTRE-11", "Nom commercial et nom de domaine", "Bloquant", "Fondateur", "A · « TabSanté », domaine à indiquer"], ["AUTRE-12", "Hébergeur du site et réception des inscriptions", "Important", "Fondateur", "A · Formulaire fermé, contact par e-mail"], ["AUTRE-13", "Conservation des inscriptions, CGU et juridiction", "Important", "Juriste", "Rien de choisi"], ["AUTRE-14", "Offre et prix affichés", "Confort", "Fondateur", "A · Non, « Sur demande »"]]}, {"type": "h", "texte": "AUTRE-10 · Identité légale de l'éditeur du site"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "La loi impose sur le site public les mentions de l'éditeur : raison sociale, forme, capital, siège, immatriculation, TVA, téléphone, e-mail, directeur de la publication. Tant qu'il en manque une, le site reste en « version de travail », non indexé par les moteurs de recherche, et ne peut pas être publié."}, {"type": "p", "texte": "Question : Quelle société édite le site, et pouvez-vous fournir ses mentions légales ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "La société qui porte TabSanté (mentions à fournir)", "Le site peut être publié dès réception."], ["B", "Une société encore à créer", "Le site reste en version de travail jusqu'à l'immatriculation."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Tous les champs légaux sont vides et affichés « À compléter » ; pages en noindex ; la vérification de mise en production échoue."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : hors CDC, Q-67 (close hors CDC)"}, {"type": "h", "texte": "AUTRE-11 · Nom commercial et nom de domaine"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "« TabSanté » est un nom de travail. Le site attend la confirmation du nom commercial et du domaine avant publication."}, {"type": "p", "texte": "Question : Confirmez-vous « TabSanté » comme nom commercial, et quel domaine ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "« TabSanté », domaine à indiquer (appliqué aujourd'hui)", "Le site garde son nom ; dépôt de marque à vérifier."], ["B", "Un autre nom", "Textes, logo et site à reprendre."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Nom de travail « TabSanté », non confirmé."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-67 (close hors CDC)"}, {"type": "h", "texte": "AUTRE-12 · Hébergeur du site et réception des inscriptions"}, {"type": "p", "texte": "Le site public n'héberge aucune donnée de santé, mais son hébergeur doit figurer aux mentions légales. Le formulaire de liste d'attente est fermé : les visiteurs écrivent par e-mail. Si on l'ouvre, il faut dire qui reçoit les inscriptions."}, {"type": "p", "texte": "Question : Qui héberge le site public, et faut-il ouvrir le formulaire de liste d'attente ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Formulaire fermé, contact par e-mail (appliqué aujourd'hui)", "Aucun prestataire de formulaire ; seul l'hébergeur du site est à nommer."], ["B", "Formulaire ouvert, reçu par un prestataire de formulaires", "Inscriptions structurées ; un destinataire de plus à déclarer."], ["C", "Formulaire ouvert, reçu par la messagerie de TabSanté", "Pas de prestataire de plus ; tri manuel des messages."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Formulaire fermé par défaut avec repli par e-mail ; hébergeur, adresse et téléphone à compléter."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-67 (close hors CDC)"}, {"type": "h", "texte": "AUTRE-13 · Conservation des inscriptions, CGU et juridiction"}, {"type": "p", "texte": "La politique de confidentialité doit dire combien de temps les inscriptions sont gardées ; les CGU doivent désigner un tribunal compétent. Ces textes doivent être relus par un avocat avant publication."}, {"type": "p", "texte": "Question : Combien de temps garder les inscriptions de la liste d'attente ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "3 ans après le dernier contact (référence CNIL)", "Durée usuelle pour la prospection."], ["B", "Jusqu'à l'ouverture du service, puis suppression", "Durée minimale ; liste perdue après l'ouverture."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Durée, tribunal et date de mise à jour vides, affichés « À compléter »."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Juriste"}, {"type": "p", "texte": "Références : Q-67 (close hors CDC)"}, {"type": "h", "texte": "AUTRE-14 · Offre et prix affichés"}, {"type": "p", "texte": "Le site affiche aujourd'hui « Tarifs sur demande » et ne promet rien qui ne soit construit (ni HDS, ni agrément CNDA, ni SESAM-Vitale). Une grille publique aiderait les cabinets à se décider, mais engage TabSanté sur un prix avant la fin de l'agrément."}, {"type": "p", "texte": "Question : Faut-il afficher une grille de prix sur le site ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, « Sur demande » (appliqué aujourd'hui)", "Aucun engagement de prix."], ["B", "Oui, grille publique (à fournir)", "Plus transparent ; engage le prix."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Tarifs « Sur demande »."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-67 (close hors CDC)"}]}, {"id": "qo-propositions", "titre": "Propositions du 22 octobre (Q-160 à Q-164)", "resume": "Mesure sur photo, fermeture d'inactivité, dictée, valeur du dossier scellé, plafonds techniques.", "mots_cles": ["Q-160", "Q-161", "Q-162", "Q-163", "Q-164", "photo", "inactivité", "dictée", "preuve", "plafond"], "blocs": [{"type": "table", "entetes": ["Question", "Branché en attendant", "À trancher"], "lignes": [["Q-160 · grandeur de la courbe d'une plaie mesurée sur photo", "La surface L × l du passage reste la grandeur de la courbe ; la surface détourée s'affiche à côté", "La surface détourée devient-elle la référence ? Un gabarit de prise de vue imposé au terminal ?"], ["Q-161 · fermeture d'une session inactive", "15 minutes sans geste ferment la session du poste fixe", "Durée retenue ; verrou à code plutôt qu'une fermeture ?"], ["Q-162 · dictée des transmissions", "Micro du clavier, rangement local, aucun service extérieur", "Un service de reconnaissance vocale hébergé HDS ?"], ["Q-163 · valeur du dossier de preuve scellé", "Sceau et empreinte inscrits à la chaîne d'audit, vérifiables au poste fixe", "Signature ou horodatage qualifiés (eIDAS) ; accès de vérification pour la CPAM ?"], ["Q-164 · plafonds techniques", "25 Mo par requête, 160 Mo pour une file /sync, deux flux d'événements par session", "Valeurs à confirmer avec l'hébergeur"]]}]}]}, {"id": "documents", "titre": "Documents", "public": "tous", "description": "Tous les documents du projet, lisibles en ligne.", "pages": [{"id": "docs-index", "titre": "Tous les documents", "resume": "Le sommaire de tous les documents du projet, lisibles en ligne.", "mots_cles": ["documents", "sommaire", "docs", "index"], "blocs": [{"type": "p", "texte": "Tous les documents du projet sont publiés ici, lisibles en ligne : rien ne reste sur un poste. Chaque famille a sa page ; chaque document s'ouvre dans une page autonome avec un lien de retour au portail."}, {"type": "table", "entetes": ["Famille", "Documents"], "lignes": [["Couverture du CDC et décisions", "4"], ["Exploitation et conformité", "18"], ["Interfaces externes", "16"], ["Conception", "3"], ["Audits et UX", "12"], ["Guides", "3"], ["Feuille de route", "1"], ["Design", "19"], ["Documentation de l'API", "2"]]}]}, {"id": "docs-couverture", "titre": "Couverture du CDC et décisions", "resume": "La matrice qui relie chaque exigence du CDC au code, l'analyse de la fiche 24 et le calendrier de l'avenant 11.", "mots_cles": ["CDC", "couverture", "matrice", "exigences", "décisions", "fiche 24", "avenant 11"], "blocs": [{"type": "p", "texte": "Où en est chaque exigence du cahier des charges, ce qui reste à décider, et les textes conventionnels qui changent la facturation."}, {"type": "liens", "items": [{"titre": "Matrice de couverture du CDC", "resume": "Traçabilité exigence par exigence du CDC V2 vers le code et les tests, recomptée au fil des commits, avec les questions ouvertes au fondateur.", "href": "https://valeriongg.github.io/tabsante-docs/docs/couverture_cdc.html"}, {"titre": "Fiche 24 Bilans/Consultation et avenant 11 : analyse d'écart", "resume": "État du code face aux exigences de la fiche 24 et aux mesures de l'avenant 11, puis plan d'implémentation côté serveur.", "href": "https://valeriongg.github.io/tabsante-docs/docs/reference/analyse_fiche24_avenant11.html"}, {"titre": "Avenant 11 IDEL : calendrier 2026-2029 (PDF)", "resume": "Fiche calendrier des mesures de l'avenant 11 : échéances, cotations et tarifs métropole, sous réserve des textes applicables.", "href": "https://valeriongg.github.io/tabsante-docs/docs/reference/avenant11_idel_calendrier_2026_2029.pdf"}, {"titre": "Avenant 11 IDEL : calendrier 2026-2029 (texte)", "resume": "Le même calendrier de l'avenant 11 en texte brut, pour la recherche et la copie.", "href": "https://valeriongg.github.io/tabsante-docs/docs/reference/avenant11_idel_calendrier_2026_2029.html"}]}]}, {"id": "docs-exploitation", "titre": "Exploitation et conformité", "resume": "Mise en service, hébergement, sécurité, données personnelles et procédures d'exploitation.", "mots_cles": ["exploitation", "RGPD", "AIPD", "DPO", "chiffrement", "sauvegardes", "hébergement", "HDS", "audit", "rétention"], "blocs": [{"type": "p", "texte": "Les documents d'exploitation du CDC §9 à §12. Durées, délais et références juridiques sont provisoires et à valider par le DPO."}, {"type": "liens", "items": [{"titre": "Sommaire de l'exploitation", "resume": "Point d' TabSanté, groupées par domaine, avec recherche.", "mots_cles": ["API", "OpenAPI", "routes", "schémas", "REST"], "blocs": [{"type": "p", "texte": "La spécification OpenAPI de l'API, lisible route par route, et le fichier brut pour les outils."}, {"type": "liens", "items": [{"titre": "Documentation de l'API", "resume": "Les 412 routes groupées par domaine, avec paramètres, corps, réponses et schémas dépliables, et un filtre.", "href": "https://valeriongg.github.io/tabsante-docs/docs/api/index.html"}, {"titre": "Spécification OpenAPI brute", "resume": "Le fichier openapi.json tel que produit par le serveur, à ouvrir dans un outil OpenAPI.", "href": "https://valeriongg.github.io/tabsante-docs/docs/api/openapi.json"}]}]}]}, {"id": "nouveautes", "titre": "Nouveautés", "public": "tous", "pages": [{"id": "nouveautes-octobre", "titre": "Les lots de correction d'octobre 2026", "resume": "L'audit de couverture du 16 octobre a ouvert 19 lots de correction ; tous sont livrés au 22 octobre.", "mots_cles": ["nouveautés", "audit", "16 octobre", "lots", "L1", "L19"], "blocs": [{"type": "p", "texte": "Le 16 octobre 2026, un audit a relu la couverture du CDC contre le code et proposé 19 lots de correction, découpés par zone. Les 19 lots ont été livrés les 21 et 22 octobre, suivis d'un lot de finitions et d'une refonte de l'interface des deux applications."}, {"type": "table", "entetes": ["Lot", "Ce qui change pour vous"], "lignes": [["L1", "Transmissions : l'aide-soignante écrit une ciblée, interpellations et notifications au terminal"], ["L2", "Cotation : ce qui est « tracé, pas transmis » ne part plus au moteur, une seule nuit"], ["L3", "Perfusions IV et sous-cutanées"], ["L4", "Pansements, stomies, pose des dispositifs"], ["L5", "Bilans par objet suivi, prescription infirmière"], ["L6", "Ordonnances, fréquences, attribution, écart horaire, acte partiel"], ["L7", "Médicaments et bloc AVK, anticoagulant, nursing"], ["L8", "Nutrition entérale, diabète, uro-génito-digestif"], ["L9", "PCA et pousse-seringue"], ["L10", "Constantes (épreuve de lever, oxygène) et neuropsychiatrie"], ["L11", "Dialyse péritonéale et analgésie locorégionale"], ["L12", "Injections, prélèvements, saignées"], ["L13", "Tableau de bord du cabinet"], ["L14", "Décès du patient, téléservices d'office, HAD"], ["L15", "Terminal : écart horaire, plan de soins, commentaires, schéma corporel"], ["L16", "Consultations et bilans de la fiche 24"], ["L17", "Couverture recomptée et décisions nettoyées"], ["L18", "Connexion par Keycloak, au poste fixe et au terminal"], ["L19", "Listes codées dans un référentiel daté"], ["Finitions", "Bloc AVK, ordonnance PDF hors connexion, code de service, accessibilité"], ["Interface", "Poste fixe et terminal revus, aide « ? » sur chaque écran"]]}, {"type": "note", "ton": "info", "texte": "Chaque lot a été livré avec ses tests, écrits pour échouer avant la correction et passer après."}]}, {"id": "nouveautes-l1", "titre": "L1 — Transmissions et coordination", "resume": "L'aide-soignante écrit une transmission ciblée ; interpellations et notifications se traitent au terminal.", "mots_cles": ["transmission ciblée", "aide-soignante", "interpellation", "notification proposée", "HAD", "dépôt de document"], "blocs": [{"type": "liste", "items": ["L'aide-soignante peut écrire une transmission ciblée de ce qu'elle constate, au poste fixe et au terminal. Elle ne peut ni écrire un entretien infirmier, ni traiter une interpellation, ni requalifier une transmission.", "Au terminal, une notification proposée (avis au médecin) se valide ou s'écarte, et une interpellation se lit et se traite.", "Au poste fixe, un acte à distance sur une plaie se crée directement.", "Les coordinateurs de l'HAD sont pré-cochés comme destinataires pendant un séjour.", "Une interpellation non lue déclenche une alerte après quatre heures (valeur à confirmer, Q-87).", "Tout dépôt de document avise les soignants (Q-89).", "Seul un rendez-vous planifié peut être annulé."]}]}, {"id": "nouveautes-l2", "titre": "L2 — Cotation : ce qui part au moteur", "resume": "Les données « tracées, non transmises » restent au dossier ; une seule plage de nuit, 20 h à 6 h.", "mots_cles": ["cotation", "moteur", "majoration de nuit", "horaire prescrit", "facturable"], "blocs": [{"type": "liste", "items": ["Ce que les fiches Médicaments, Diabète et Anticoagulant disent « tracé, pas transmis » (dose, site, résultats, valeur de la glycémie) ne part plus au moteur de cotation, et sa correction ne relance pas la cotation.", "Le serveur fournit lui-même, ligne par ligne, ce qui est facturable et la clé de cotation hors connexion : terminal et poste fixe ne recopient plus la règle.", "Plus de majoration de nuit sans horaire prescrit, pansement compris.", "Une seule plage de nuit pour la planification de toute l'application : 20 h à 6 h. La majoration de nuit, elle, suit les tranches de la NGAP (20 h-23 h et 5 h-8 h, 23 h-5 h) sur horaire prescrit."]}, {"type": "note", "ton": "info", "texte": "La cotation reste celle de la doublure de démonstration : jamais facturable."}]}, {"id": "nouveautes-l3", "titre": "L3 — Perfusions IV et sous-cutanées", "resume": "Ligne sous-cutanée laissée posée sans alerte, retrait du site qui dépose ses lignes, compteurs de la perfusion.", "mots_cles": ["perfusion", "IV", "sous-cutanée", "fiche 4", "fiche 5"], "blocs": [{"type": "liste", "items": ["Une ligne sous-cutanée laissée posée ne déclenche plus de notification à tort.", "Retirer un site sous-cutané dépose ses lignes.", "Le terminal envoie les consommables et les motifs.", "Les compteurs de la fiche Perfusion IV sont tenus ; un palier sans débit est refusé ; le poids est lu des constantes."]}]}, {"id": "nouveautes-l4", "titre": "L4 — Pansements, stomies et pose des dispositifs", "resume": "Clôture de stomie avec transmission proposée, consommation d'appareillage, lot et péremption lus sur le code produit.", "mots_cles": ["stomie", "pansement", "plaie", "dispositif", "VVP", "code produit", "fils", "agrafes"], "blocs": [{"type": "liste", "items": ["À la clôture d'une stomie, une transmission ciblée est proposée au même écran, destinataires pré-cochés (prescripteur, urologue, médecin traitant, cabinet) ; elle s'envoie ou s'écarte avec un motif.", "La consommation d'appareillage se compare au prescrit, semaine par semaine sur douze semaines au plus.", "Le lot et la péremption se lisent sur le code produit (DataMatrix ou EAN-13), jamais saisis à la main.", "Le protocole initial d'une plaie se renseigne à l'ouverture, au terminal, et se relit au poste fixe.", "Une VVP ne s'ouvre plus au poste fixe : sa pose est le geste horodaté et signé au terminal.", "Deux dates d'ablation de fils ou d'agrafes peuvent être tenues ; une troisième remplace la plus proche.", "Passer outre l'alerte fistule est tracé ; l'irrigation est refusée sans réfection."]}]}, {"id": "nouveautes-l5", "titre": "L5 — Bilans, documents et prescription infirmière", "resume": "De nouveaux bilans par objet suivi, et une prescription infirmière qui s'envoie en extraits.", "mots_cles": ["bilans", "PDF", "prescription infirmière", "laboratoire", "pharmacie", "stomie", "trachéotomie", "CPAP"], "blocs": [{"type": "liste", "items": ["Nouveaux bilans pré-rédigés et sourcés, programmables, avec leur PDF : perfusion IV et sous-cutanée, stomie digestive et urinaire, nutrition, trachéotomie, CPAP.", "Le bilan de surveillance gagne une section neuropsychiatrique quand la fiche 15 est tenue.", "La prescription infirmière s'envoie en extraits au laboratoire et à la pharmacie, se signe par carte et s'envoie depuis son écran.", "L'appareillage de stomie et les consommables de perfusion et de nutrition sont proposés à la prescription."]}]}, {"id": "nouveautes-l6", "titre": "L6 — Ordonnances, fréquences et attribution", "resume": "Modifier une fréquence en cours, voir l'écart à l'heure prescrite, déclarer un acte fait en partie.", "mots_cles": ["fréquence", "modifier", "écart horaire", "horaires prescrits", "acte partiel", "formation", "attribution"], "blocs": [{"type": "liste", "items": ["Une fréquence échue ou arrêtée ne bloque plus celle de l'ordonnance suivante sur le même dispositif.", "Une fréquence se modifie en cours de route, prolongation comprise : bouton « Modifier » à côté d'« Arrêter ce soin » ; l'ancienne s'arrête la veille, l'historique reste intact.", "Un changement d'horaire est signalé par le bandeau « avant / après » ; une prolongation à l'identique ne signale rien.", "L'écart entre l'heure prescrite et l'heure réelle est calculé à la signature et lu au poste fixe, par exemple « Réalisé à 19 h 50, 10 min avant l'heure prescrite (20 h) ».", "Les horaires prescrits sans ordonnance jointe sont signalés, et levés en joignant l'ordonnance.", "Avant d'attribuer une tournée, une formation manquante est signalée : « Attribuer quand même ».", "Un acte fait en partie se déclare au terminal, sur toutes les fiches ; sa cotation passe toujours en file de contrôle."]}]}, {"id": "nouveautes-l7", "titre": "L7 — Médicaments, AVK, anticoagulant, nursing", "resume": "Le bloc AVK complet, la fin de traitement au terminal, la rotation des appuis.", "mots_cles": ["AVK", "INR", "posologie", "médicaments", "anticoagulant", "plaquettes", "nursing"], "blocs": [{"type": "liste", "items": ["Bloc AVK : prescription transcrite au dossier (posologie, INR cible, ordonnances), signal de changement de posologie, posologie de la semaine et la précédente, au poste fixe et au terminal.", "Fin de traitement saisissable au terminal pour les médicaments et l'anticoagulant injectable.", "Anticoagulant injectable : compteurs, chute plaquettaire calculée sur un résultat revenu et au domicile.", "Nursing : rotation des appuis."]}]}, {"id": "nouveautes-l8", "titre": "L8 — Nutrition, diabète, uro-génito-digestif", "resume": "Historique « à faire » du diabète, séance hebdomadaire signalée, diurèse ramenée à 24 heures.", "mots_cles": ["diabète", "glycémie", "protocole", "pompe à insuline", "diurèse", "lavement", "sonde", "nutrition"], "blocs": [{"type": "liste", "items": ["L'historique du suivi diabétique montre « à faire » pour chaque passage dû non saisi, au poste fixe et au terminal.", "Un patient devenu éligible à la séance hebdomadaire est signalé au cabinet, une fois.", "Compteurs du suivi diabétique : autonomie, valeurs hors bornes sur 7 et 30 jours, écarts à la proposition, versions du protocole.", "Le protocole et l'historique sont consultables au terminal ; type de diabète et bolus par la pompe ; débit de pompe au pas de 0,05 UI/h.", "La diurèse mesurée porte sa période et se compare ramenée à 24 heures ; la condition du lavement vient de l'ordonnance.", "La succession des sondes affiche longueur, lot et tolérance ; « macération » s'ajoute à l'état de la narine."]}]}, {"id": "nouveautes-l9", "titre": "L9 — PCA et pousse-seringue", "resume": "La séance de perfusion placée dans la bonne tournée, le registre des stupéfiants au poste fixe.", "mots_cles": ["PCA", "PSE", "pompe", "séance de perfusion", "stupéfiants", "sédation", "douleur"], "blocs": [{"type": "liste", "items": ["La séance de perfusion du jour se place dans la tournée du moment fixé, une par patient et par jour.", "Au terminal, la séance n'est proposée qu'au passage du moment fixé, et un acte déjà porté le dit.", "Le cadre de l'ordonnance et le séjour HAD se lisent au terminal.", "La douleur se mesure sur l'échelle du patient et à la mobilisation.", "Le registre des stupéfiants se lit au poste fixe ; la courbe de sédation profonde signale l'écart à la cible."]}]}, {"id": "nouveautes-l10", "titre": "L10 — Constantes et neuropsychiatrie", "resume": "Épreuve de lever au terminal, oxygène prescrit face au constaté, état habituel par trouble.", "mots_cles": ["épreuve de lever", "tension", "oxygène", "pouls", "neuropsychiatrie", "douleur", "constantes"], "blocs": [{"type": "liste", "items": ["Épreuve de lever au terminal : minuteur, contention exigée, trois mesures à leur heure réelle, lever impossible avec motif, rappel en cas de malaise ; les écarts se lisent au poste fixe.", "Le débit d'oxygène prescrit se saisit au poste fixe et se compare au débit constaté ; son changement est signalé.", "Régularité du pouls et interface d'oxygène au terminal ; l'ancienneté de la dernière mesure s'affiche à côté de chaque champ.", "Surveillance neuropsychiatrique : historique hors connexion au terminal, état habituel par trouble posé au poste fixe et écart affiché.", "La courbe de douleur se filtre par circonstance et par objet ; les tensions se filtrent par position."]}]}, {"id": "nouveautes-l11", "titre": "L11 — Dialyse et analgésie locorégionale", "resume": "Température lue des constantes, seuil du repère pris du protocole, volumes du cycleur saisis tels quels.", "mots_cles": ["dialyse", "cycleur", "ALR", "température", "repère", "pansement"], "blocs": [{"type": "liste", "items": ["Pour l'analgésie locorégionale, la température du jour se lit dans les paramètres vitaux, jamais ressaisie.", "Le seuil de migration du repère du cathéter vient du protocole quand il le fixe.", "Au terminal, les volumes lus sur le cycleur au branchement et la date du prochain pansement se saisissent ; ils se relisent au poste fixe."]}]}, {"id": "nouveautes-l12", "titre": "L12 — Injections, prélèvements, saignées", "resume": "Une ligne d'injection par fréquence, des sites de prélèvement contrôlés, la remise au laboratoire tracée.", "mots_cles": ["injection", "vaccin", "tuberculine", "prélèvement", "hémoculture", "saignée", "ferritinémie", "rappel de lot"], "blocs": [{"type": "liste", "items": ["Injections : chaque ligne sert une fréquence et sa prescription ; les suites sont proposées (vaccination au médecin traitant, injection non faite ou refus au prescripteur, transmission des allergènes relancée) ; la lecture du timbre tuberculinique se signe et se transmet au domicile ; le rappel par numéro de lot est édité et notifié.", "Prélèvements : sites selon la voie et la nature, site distinct pour chaque paire d'hémocultures, heure du contrôle d'identité exigée, remise des échantillons au laboratoire (qui, à quelle heure).", "Saignée : séance de rattrapage datée, séance sautée quand la ferritinémie est sous le seuil.", "Soins respiratoires : les réfections faites par l'aidant se saisissent au terminal et se comptent au poste fixe.", "La pulvérisation de médicaments reste dans la fiche Injections, en attendant la décision Q-90."]}]}, {"id": "nouveautes-l13", "titre": "L13 — Tableau de bord du cabinet", "resume": "Soins à compléter, résultats attendus, pièces manquantes, BSI à renouveler, filtre par tournée et export CSV.", "mots_cles": ["tableau de bord", "résultats attendus", "pièces manquantes", "BSI", "tuberculine", "export CSV", "filtre"], "blocs": [{"type": "liste", "items": ["Nouveaux panneaux : « Soins à compléter », « Résultats attendus » (infirmier), « Pièces manquantes » (horaires prescrits sans ordonnance jointe, séjour HAD sans lettre de mission).", "Le BSI à échéance dans les soixante jours, ou échu alors que le nursing continue, est signalé.", "Les tests tuberculiniques posés sans lecture, les séances commencées sans constantes et les résultats attendus de l'anticoagulant apparaissent.", "Le tableau se filtre par tournée (le filtre reste dans l'adresse) et s'exporte en CSV.", "L'aide-soignante ne lit ni les séjours HAD non payables ni les résultats attendus."]}]}, {"id": "nouveautes-l14", "titre": "L14 — Décès, téléservices, HAD", "resume": "Déclarer le décès d'un patient, téléservices appelés d'office, mention HAD tirée du seul séjour.", "mots_cles": ["décès", "téléservices", "INSi", "ADRi", "HAD", "identité"], "blocs": [{"type": "liste", "items": ["Le décès d'un patient se déclare au poste fixe (infirmier) : tout ce qui devait venir s'arrête au jour du décès et les soignants de ses tournées sont prévenus ; le dossier demeure. Une déclaration faite par erreur s'annule avec un motif. Le terminal affiche « Décédé le … ».", "Les téléservices sont appelés d'office : identité, droits et INS à la création en ligne ou au retour de connexion, droits avant chaque FSE ; jamais bloquants, une étape « à relancer » le dit. L'INS reste « récupérée » jusqu'au contrôle de la pièce.", "La mention « HAD » de l'en-tête vient du seul séjour déclaré ; « hors HAD » s'affiche sur une fiche dont l'ordonnance est libérale pendant le séjour.", "« Installé par l'HAD » se coche à l'ouverture des cathéters, de la nutrition entérale et de la dialyse."]}]}, {"id": "nouveautes-l15", "titre": "L15 — Terminal transverse", "resume": "Écart horaire affiché, plan de soins hors connexion, commentaire par ligne, schéma corporel enrichi.", "mots_cles": ["terminal", "écart horaire", "plan de soins", "commentaire", "échelle", "photo", "schéma corporel", "événement critique"], "blocs": [{"type": "liste", "items": ["L'écart à l'heure prescrite s'affiche sur la tournée, la carte du prochain passage et la ligne du soin, sans bloquer.", "L'échelle à quatre crans montre « absent » sur sa ligne et le libellé sous chaque cran.", "La photo au passage s'ajoute en PCA, analgésie locorégionale et anticoagulant.", "Le plan de soins entier (ordonnances, actes prescrits, fréquences, protocoles) se consulte hors connexion depuis le dossier.", "Chaque case cochée, ligne branchée ou constante peut porter son propre commentaire, versé à l'historique.", "L'ancienneté cumulée s'affiche à côté de J+ ; le schéma corporel gagne les vues « région sacrée » et « talons » et un filtre par produit.", "L'événement critique se déclare depuis le menu du passage ; seules les fiches PSE et analgésie locorégionale gardent un accès direct."]}]}, {"id": "nouveautes-l16", "titre": "L16 — Consultations et bilans (fiche 24)", "resume": "Douleur reprise de la série unique, plan personnalisé de prévention repris dans la CIB.", "mots_cles": ["fiche 24", "consultation", "CIB", "bilan de prévention", "PPP", "douleur", "tranche d'âge"], "blocs": [{"type": "liste", "items": ["La douleur reprise dans une consultation vient de la série unique du patient, quelle que soit la fiche qui l'a mesurée.", "Le plan personnalisé de prévention est repris dans la sous-fiche CIB, au poste fixe et au terminal.", "Un bilan de prévention dont le patient a changé de tranche d'âge avant la signature rencontre un obstacle à la signature.", "Les thèmes apparaissent en clair dans les comptes rendus."]}]}, {"id": "nouveautes-l17", "titre": "L17 — Couverture recomptée et décisions", "resume": "La matrice recomptée par un script, des statuts reclassés sur preuve, le registre des décisions nettoyé.", "mots_cles": ["couverture", "matrice", "recompte", "décisions", "registre"], "blocs": [{"type": "p", "texte": "Ce lot ne change rien à l'écran : il rend le document de couverture plus juste."}, {"type": "liste", "items": ["Recompte par un script : 561 éléments, dont 407 faits, 14 partiels, 136 simulés, 4 bloqués, aucun absent.", "Reclassements prouvés : là où seule la doublure ou le service tiers restait simulé, la part de la plateforme passe Faite.", "Lignes manquantes ajoutées, notes périmées corrigées, liste des événements journalisés écrite, schéma des liens entre objets.", "Registre des questions nettoyé en place : doublons, questions closes ou tranchées ; deux questions ajoutées (Q-97, Q-98).", "Un test prouve qu'un commentaire ne peut être ni modifié ni supprimé."]}]}, {"id": "nouveautes-l18", "titre": "L18 — Connexion par Keycloak", "resume": "Un courtier d'identité installé : identifiant et mot de passe, ou carte CPS par Pro Santé Connect (simulé).", "mots_cles": ["keycloak", "connexion", "cps", "pro santé connect"], "blocs": [{"type": "liste", "items": ["Keycloak est installé : page de connexion en français, aux couleurs de TabSanté.", "Au poste fixe et au terminal, « Se connecter avec TabSanté (Keycloak) » : identifiant et mot de passe, ou carte CPS par Pro Santé Connect, simulé en attendant la convention avec l'ANS.", "TabSanté garde sa propre session : l'enrôlement du téléphon « Simuler une cotation », sans rien écrire.", "Alerte « terminal non synchronisé » pendant une tournée en cours.", "Mode visite au terminal : étapes du soin en liste, photo comparée à J0, note de relève hors connexion.", "Suggestions tirées du contexte (jours fériés, vacances scolaires, vigilance météo, qualité de l'air…), expliquées et jamais exécutées sans vous.", "PDF relus page par page : pagination, identité avec INS, bandeau de démonstration.", "Formulaires revus : champs obligatoires saisissables, erreurs affichées au bon champ, refus en français.", "« À traiter » trié par gravité ; ordonnance au nom d'un autre patient refusée ; INS qualifiée seulement après contrôle de la pièce ; un courrier non relu ne part jamais d'un clic.", "Sécurité : doublures fermées hors démonstration, portée du remplaçant sur toutes les lectures, administrateur sans dossier clinique, lectures nominatives tracées patient par patient, journal d'audit sans copie clinique."]}, {"type": "note", "ton": "info", "texte": "La cotation de démonstration a aussi été alignée sur le texte de la NGAP en vigueur ; elle reste une doublure, jamais facturable."}]}, {"id": "nouveautes-finitions", "titre": "Finitions — ce qui restait partiel", "resume": "Bloc AVK, ordonnance PDF lisible hors connexion, code de service, accessibilité du terminal.", "mots_cles": ["finitions", "avk", "ordonnance", "accessibilité"], "blocs": [{"type": "liste", "items": ["Le bloc AVK s'ouvre dès qu'une fréquence « Anticoagulants oraux (AVK, surveillance de l'INR) » est en cours, au poste fixe et au terminal.", "Une ordonnance versée en PDF se lit au terminal hors connexion.", "La liste des événements tracés au journal d'audit est vérifiée contre le code par un test.", "Le terminal ne garde un patient créé au domicile hors tournée que le jour de sa création, sauf envoi en attente.", "Écran du code de service au poste fixe et au terminal, en secours de Keycloak.", "Audit automatique d'accessibilité du terminal : zones tactiles  "preuve", "PDF", "planning", "glisser", "journée", "dictée", "sécurité"], "blocs": [{"type": "p", "texte": "Ce qui avait été proposé dans la feuille de route et dans les audits, et qui ne fonctionnait pas encore, est livré, en simulation quand un service réel manque. L'inventaire complet, avec ce qui reste au terminal, à la facturation ou à une décision du cabinet, est tenu dans le dépôt du projet (il cite des constats de sécurité encore ouverts : il n'est pas publié ici)."}, {"type": "table", "entetes": ["Nouveauté", "Ce qui change pour vous"], "lignes": [["Mesure de plaie sur photo", "Au poste fixe, la surface d'une plaie se mesure sur sa photo, à l'échelle de la réglette photographiée avec elle : contour tracé ou proposé, puis ajusté. Les contours de la première et de la dernière mesure se superposent à la même échelle."], ["Dossier de preuve scellé", "« PDF scellé » produit le dossier d'une période au serveur, inscrit à la chaîne d'audit ; la page Preuves vérifie un exemplaire remis par son empreinte."], ["Planning de la semaine", "Glissez une personne de l'équipe sur une case à venir pour lui confier le moment ; formation à vérifier et charge de la semaine dites avant l'envoi ; la personne est prévenue."], ["Fin de journée", "Aujourd'hui : « Ma journée », puis « Tournée terminée · n passages signés · 0 en attente », et pour l'infirmier les cotations du jour, sans montant."], ["Transmission dictée", "Dictez au micro du clavier (Windows + H) ou collez un texte : il est rangé en cible, données, actions et résultat, à relire avant d'émettre."], ["Dossier patient", "L'alerte d'un dispositif (ligne au-delà du prescrit…) apparaît dans « À savoir avant le soin » et dans l'aperçu."], ["Signalements", "La décision « Objet suivi ouvert » propose d'ouvrir une plaie à cet endroit, sans quitter l'écran."], ["Ordonnances", "Une ordonnance versée au poste fixe est lue d'office."], ["Sécurité", "Photos sans position GPS ni métadonnées ; session du poste fixe fermée après 15 mi
