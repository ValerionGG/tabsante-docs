vés HAD », « Contrôle CPAM », « Réglages de la file », « Simuler une cotation »."}, {"type": "p", "texte": "Chaque ligne de cotation dit sa règle en clair (cumul de l’article 11 B, majoration, déplacement, forfait BSI, mesure de l’avenant 11…) avec son article, et son montant de démonstration ; « Pourquoi ? » garde le détail. Chaque ligne mène à la preuve de l’acte."}, {"type": "h", "texte": "1. Vérifier"}, {"type": "etapes", "items": ["« Reconfirmer les cotations » : le moteur rejoue chaque cotation provisoire des actes signés. Mêmes lignes : confirmée. Divergence ou règle du cabinet : elle entre en file.", "« Pourquoi en file » filtre par motif (cumul, divergence, justification…). Les lignes à la signature restent en regard de celles du moteur.", "L’arbitre confirme ou écarte, une cotation à la fois ou en choisissant plusieurs : une décision et un motif communs, tracés pour chacune."]}, {"type": "h", "texte": "2. Facturer"}, {"type": "p", "texte": "Les cotations confirmées, par patient et par infirmier qui a réalisé les actes, avec leurs montants et le total. « Mes actes » par défaut, « Tout le cabinet » à côté. « Créer la FSE » ne porte que sur vos propres actes (votre carte CPS) et dit le montant retenu."}, {"type": "h", "texte": "3. Sécuriser"}, {"type": "p", "texte": "Les FSE par état (à sécuriser, sécurisées, en lot ou envoyées, rejetées), avec leur montant. Une FSE montre sa frise (créée, sécurisée, en lot, télétransmise, retour), ses lignes avec leur règle, leur empreinte et leur montant. Pas encore en lot, elle s’annule avec un motif."}, {"type": "h", "texte": "4. Télétransmettre : vérifier puis envoyer, en une page"}, {"type": "etapes", "items": ["Les FSE sécurisées d’un même émetteur, cochées par défaut, avec leur total.", "« Vérifier » : le contrôle de cohérence, lu sans rien constituer.", "« Mettre en lot et télétransmettre » d’un même geste. Une anomalie se force avec un motif ; une chaîne du journal rompue, seulement par qui gère le cabinet, d’un accord à part, et le lot porte « Intégrité forcée »."]}, {"type": "h", "texte": "5. Retours"}, {"type": "liste", "items": ["Les rejets sont groupés par motif, avec ce qu’il faut faire (ajouter le NIR, vérifier les droits…) et le montant en jeu.", "« Refacturer » ou « Abandonner » pour une FSE ou pour la sélection, avec un commentaire ; les lignes et leurs preuves se déplient."]}, {"type": "h", "texte": "Contrôle CPAM, relevés HAD, réglages"}, {"type": "liste", "items": ["« Contrôle CPAM » : remettre à un contrôleur un accès en lecture seule à un patient sur une période (lien et QR montrés une fois), le suivre et le révoquer.", "« Relevés HAD » : actes relevés à l’HAD selon la convention, sans FSE ; sans lettre de mission, le séjour est « Non payable en l’état ».", "« Réglages de la file » : ce qui passe par la file de contrôle, le délai d'arbitrage et les arbitres."]}, {"type": "note", "ton": "info", "texte": "Les actes d’un remplaçant attendent : un remplaçant ne peut pas créer la FSE, et la facturation des remplacements reste à décider."}, {"type": "liens", "items": [{"titre": "Le circuit et ses gardes", "resume": "Vue d'ensemble, du soin signé à la feuille de soins.", "href": "#fn-vue-ensemble"}, {"titre": "La file de contrôle", "resume": "Motifs, arbitres, délai.", "href": "#fn-file-controle"}, {"titre": "FSE, lots, retours et rejets", "resume": "Cartes, mode dégradé, contrôle de cohérence, forçage.", "href": "#fn-fse-lots"}]}]}, {"id": "pf-recu-simulateur", "titre": "Reçu de cotation, simulateur et banc", "resume": "Comprendre une cotation ligne par ligne, rejouer un passage fictif et lire le banc de cotation.", "mots_cles": ["reçu de cotation", "et si", "simulateur", "simuler une cotation", "banc de cotation", "pourquoi", "règle"], "blocs": [{"type": "note", "ton": "attention", "texte": "Règles et tarifs de démonstration : aucun montant n’est facturé ni opposable."}, {"type": "h", "texte": "Le reçu de cotation d’un passage"}, {"type": "p", "texte": "Depuis un passage signé (lien « Reçu »), le reçu montre les lignes du passage, la règle appliquée à chaque ligne (« Pourquoi ? »), les versions du référentiel, des tarifs et du moteur, et le total du passage. « Imprimer » permet d’enregistrer au format PDF."}, {"type": "p", "texte": "« Et si… » rejoue le passage avec une autre heure, un autre jour, un horaire imposé ou des dimanches et fériés précisés, puis compare au réel."}, {"type": "h", "texte": "Simuler une cotation"}, {"type": "etapes", "items": ["Onglet « Simuler une cotation » de la Facturation : partez d’un cas type ou composez un passage.", "Renseignez la date, le lieu, l’âge du patient, le code postal (jours fériés locaux), les contextes (forfait BSI, score SEGA), les soins et le déplacement.", "Lisez la cotation du moteur et son total à la date. Rien n’est écrit."]}, {"type": "h", "texte": "Le banc de cotation"}, {"type": "p", "texte": "« Paramètres › Banc de cotation » montre le dernier rapport : cas conformes, écarts, cas bloqués et divergences documentées. Il éprouve les règles de la doublure ; il ne vaut jamais agrément."}, {"type": "liens", "items": [{"titre": "La cotation par passage", "resume": "Statuts des lignes, « Pourquoi ? » et « Et si… » expliqués.", "href": "#fn-passage"}, {"titre": "Le banc de cotation", "resume": "Résultats chiffrés, ce qu'il prouve et ne prouve pas.", "href": "#fn-banc"}]}]}, {"id": "pf-preuves", "titre": "Preuves et dossier de preuve", "resume": "Vérifier l’intégrité des actes signés et imprimer un dossier de preuve pour un contrôle.", "mots_cles": ["preuve", "dossier de preuve", "intégrité", "empreinte", "journal d’audit", "ancre", "imprimer"], "blocs": [{"type": "p", "texte": "La page « Preuves et cotations » (« Preuves des soins » pour qui ne voit pas la cotation) liste les actes signés, filtrables (« Tous », « Saisies différées »), avec leur état d’intégrité."}, {"type": "h", "texte": "Chaîne d’audit et ancrage"}, {"type": "liste", "items": ["« Journal d’audit intact » : vérifié de bout en bout, sans trou ni réécriture.", "« Relire toute la chaîne » relance la vérification complète.", "« Poser une ancre » copie la tête de la chaîne hors de la base (gestionnaires des habilitations)."]}, {"type": "note", "ton": "attention", "texte": "Si le journal d’audit est rompu, prévenez le responsable sécurité avant toute présentation de preuve."}, {"type": "h", "texte": "Imprimer un dossier de preuve"}, {"type": "etapes", "items": ["Ouvrez le dossier de preuve d’un acte, ou « Dossier de preuve par période » pour un patient.", "Vérifiez les verdicts : « Empreinte conforme », « Journal intact ».", "Cliquez sur « Imprimer » et choisissez « Enregistrer au format PDF »."]}, {"type": "p", "texte": "Le dossier d’un acte montre qui et quand, la saisie différée, la prescription, ce qui a été constaté et fait, les corrections après signature, les photos, la cotation et les entrées du journal d’audit."}, {"type": "note", "ton": "info", "texte": "Le dossier de preuve est réservé aux infirmiers."}]}, {"id": "pf-partage-acces-externes", "titre": "Partage externe, accès QR et télésanté", "resume": "Recueillir le consentement du patient, émettre un QR pour un professionnel extérieur, tenir un acte à distance.", "mots_cles": ["partage", "consentement", "QR", "accès externe", "Pro Santé Connect", "RPPS", "télésanté", "téléconsultation", "portail externe"], "blocs": [{"type": "h", "texte": "Préparer l’accès d’un professionnel extérieur"}, {"type": "etapes", "items": ["Page « Accès externes » : « Préenregistrer » le professionnel avec son RPPS à 11 chiffres, sa qualité et sa spécialité.", "Dans le dossier, vue « Partage externe » : « Recueillir un consentement » (droits, parties lisibles, date de fin, recueilli par écrit ou oralement), puis « Tracer le consentement ».", "« Émettre un QR » : choisissez sa durée de validité (1 heure, 4 heures par défaut, 24 heures ou 72 heures).", "Le QR ne s’affiche qu’une fois : imprimez-le ou montrez-le au professionnel tout de suite."]}, {"type": "note", "ton": "info", "texte": "Un QR seul ne donne rien : le professionnel doit s’identifier par Pro Santé Connect avec le RPPS désigné, et seuls les droits consentis s’ouvrent. Un nouveau QR révoque le précédent du même professionnel."}, {"type": "p", "texte": "« Révoquer » coupe l’accès à l’instant : la requête suivante du professionnel est refusée. Le journal des accès externes garde ouvertures, lectures, dépôts et refus."}, {"type": "h", "texte": "Ce que voit le professionnel extérieur"}, {"type": "p", "texte": "Sur le portail externe, il lit la synthèse du dossier en lecture seule, les courbes et les documents permis ; il envoie une transmission à l’équipe infirmière (ou l’interpelle) et dépose un document (PDF, JPEG ou PNG, 15 Mo au plus). Il ne modifie jamais le dossier."}, {"type": "note", "ton": "attention", "texte": "Pro Santé Connect est simulé en démonstration."}, {"type": "h", "texte": "Actes à distance et télésanté"}, {"type": "p", "texte": "Dans la vue « Actes à distance » du dossier : « Nouvel acte à distance » (téléconsultation, télésoin, télé-expertise), participants, consentement, photos transmises pour une plaie, puis compte rendu à pré-rédiger et signer. La page « Télésanté » est le registre de ces actes pour le cabinet. Rien de la vidéo n’est conservé."}]}, {"id": "pf-droits-journal", "titre": "Droits du patient et journal des accès", "resume": "Enregistrer une demande du patient, exporter son dossier, savoir qui a lu quoi.", "mots_cles": ["droits du patient", "RGPD", "accès", "rectification", "portabilité", "opposition", "export FHIR", "journal des accès", "conservation"], "blocs": [{"type": "h", "texte": "Les droits du patient"}, {"type": "p", "texte": "La vue « Droits du patient » (onglet « Dossier administratif ») réunit les demandes du patient, les traces d’accès à son dossier, l’accès et la portabilité, la rectification, l’opposition et la limitation, et la conservation."}, {"type": "etapes", "items": ["« Enregistrer une demande » le jour de sa réception, même orale : nature et canal.", "« Donner suite » : pour l’accès et la portabilité, exportez le dossier complet au format FHIR.", "Une rectification ne remplace rien : l’ancienne valeur reste consultable."]}, {"type": "note", "ton": "info", "texte": "L’opposition et l’effacement ne valent pas pour les données nécessaires aux soins et à leur preuve, pendant leur durée de conservation. Les durées affichées sont provisoires, à valider par le délégué à la protection des données."}, {"type": "note", "ton": "attention", "texte": "L’export FHIR contient des données de santé : rangez le fichier en lieu sûr."}, {"type": "h", "texte": "Le journal des accès"}, {"type": "p", "texte": "« Paramètres › Journal des accès » répond à la question « Qui a lu quel dossier, quand, d’où ». Filtrez par patient, intervenant et dates ; « Exporter (CSV) »."}, {"type": "p", "texte": "Chaque lecture d’un dossier, d’un passage, d’une photo ou d’un document est tracée, y compris la lecture de ce journal ; l’export est inscrit au journal d’audit."}, {"type": "note", "ton": "info", "texte": "Le journal des accès se lit par qui gère les habilitations : titulaire, responsable, administration du cabinet."}]}, {"id": "pf-equipe-habilitations", "titre": "Équipe et habilitations", "resume": "Ajouter un intervenant, accorder une habilitation, enregistrer une formation, lire la matrice des droits.", "mots_cles": ["équipe", "intervenant", "habilitation", "remplaçant", "responsable", "administrateur", "formation", "matrice des droits", "RPPS"], "blocs": [{"type": "p", "texte": "« Paramètres › Équipe et habilitations » liste les intervenants du cabinet. Les modifications sont réservées à qui gère les habilitations."}, {"type": "h", "texte": "Ajouter un intervenant"}, {"type": "etapes", "items": ["« Ajouter un intervenant » : prénom, nom, rôle.", "Pour un infirmier remplaçant, l’habilitation est bornée dès sa création : date de début et date de fin obligatoires.", "Complétez ses identifiants professionnels (RPPS à 11 chiffres, numéro de carte CPS, téléphone professionnel)."]}, {"type": "h", "texte": "Les habilitations"}, {"type": "table", "entetes": ["Habilitation", "Ce qu’elle donne"], "lignes": [["Administrateur du cabinet", "Gère les habilitations, attribue les tournées"], ["IDE responsable", "Responsabilité clinique : une seule à la fois, elle ne se délègue pas"], ["Remplaçant", "Bornée : date de fin obligatoire, portée facultative (tournées, patients, personne remplacée)"]]}, {"type": "p", "texte": "« Accorder » une habilitation, ou « Révoquer l’habilitation » avec un motif : les droits cessent aussitôt, l’habilitation reste au journal."}, {"type": "h", "texte": "Formations"}, {"type": "p", "texte": "« Enregistrer une formation » : formation du catalogue, date d’obtention, échéance éventuelle. Certains soins en exigent une (PCA, cathéter périnerveux) : l’attribution le signale sans bloquer."}, {"type": "h", "texte": "Matrice des droits"}, {"type": "p", "texte": "La matrice montre, par action et par profil, les droits appliqués par le serveur : L lecture, E écriture, S signature, V validation, A administration. Vos profils sont surlignés."}, {"type": "note", "ton": "attention", "texte": "Les valeurs de la matrice sont une proposition à valider par le cabinet."}, {"type": "p", "texte": "Le panneau « Coordonnées du cabinet » tient l’adresse et le téléphone du cabinet."}]}, {"id": "pf-terminaux-sessions", "titre": "Terminaux et sessions", "resume": "Enrôler un téléphone de tournée, révoquer un terminal perdu, couper une session.", "mots_cles": ["terminal", "enrôlement", "code", "révoquer", "perdu", "volé", "sessions"], "blocs": [{"type": "h", "texte": "Enrôler un terminal"}, {"type": "etapes", "items": ["« Paramètres › Terminaux », panneau « Enrôler un terminal » : donnez un nom (« Tablette de Claire, terminal de secours… »).", "Cliquez sur « Émettre un code » : un code de 10 caractères s’affiche, avec son heure d’expiration (10 minutes).", "Saisissez ce code sur l’écran d’enrôlement du terminal. Il ne sert qu’une fois.", "Un code émis par erreur s’annule avant d’avoir servi (« Annuler le code »)."]}, {"type": "note", "ton": "info", "texte": "L’enrôlement revient à qui gère les habilitations (titulaire, responsable, administration du cabinet). Un remplaçant ne peut pas émettre de code."}, {"type": "h", "texte": "Révoquer un terminal perdu ou volé"}, {"type": "p", "texte": "« Révoquer » coupe aussitôt toutes ses sessions ; il ne pourra plus servir qu’après un nouvel enrôlement. Enrôlements, annulations et révocations sont tracés au journal."}, {"type": "h", "texte": "Sessions"}, {"type": "p", "texte": "« Paramètres › Sessions » liste les sessions ouvertes : intervenant, date d’ouverture, état. « Révoquer » coupe les jetons d’une session ; « Révoquer ce terminal » fait tomber toutes les sessions d’un terminal. Révoquer votre propre session vous déconnecte aussitôt."}]}, {"id": "pf-parametres", "titre": "Paramètres du cabinet", "resume": "Régler la zone d’intervention, les durées types des soins et les prérequis de passage.", "mots_cles": ["paramètres", "cabinet", "zone d’intervention", "durée type", "suggestion", "prérequis", "à jeun", "mode d’exercice"], "blocs": [{"type": "p", "texte": "« Paramètres » s’ouvre sur l’onglet « Cabinet ». Les autres onglets : « Équipe et habilitations », « Sessions », « Terminaux », « Journal des accès », « Reprise de dossiers », « Simulations », « Banc de cotation », selon vos droits."}, {"type": "p", "texte": "L’onglet « Cabinet » rappelle les intervenants, votre mode d’exercice et vos profils."}, {"type": "h", "texte": "Tournées du cabinet"}, {"type": "etapes", "items": ["Placez d’abord le point de départ des tournées : la zone l’entoure.", "« Rayon de la zone d’intervention » : de 0,2 à 50 km, puis « Enregistrer ». « Retirer la zone » l’efface.", "Pour chaque soin, lisez la durée provisoire de l’application, la durée observée sur vos passages et la suggestion ; saisissez la « Durée type du cabinet », puis « Enregistrer les durées ».", "« Reprendre les suggestions » recopie les suggestions dans les durées types encore vides."]}, {"type": "note", "ton": "info", "texte": "Un domicile hors zone est signalé, jamais bloqué. L’estimation d’une tournée retient d’abord les passages tracés, puis la durée type du cabinet, enfin la valeur provisoire."}, {"type": "h", "texte": "Prérequis de passage"}, {"type": "p", "texte": "Pour chaque soin, cochez les prérequis demandés (à jeun, traitement ou matériel à récupérer, ordonnance et carte Vitale, résultats, présence d’un aidant) et leur échéance de confirmation : la veille ou le matin même. « Revenir au référentiel » rétablit la proposition livrée."}, {"type": "note", "ton": "attention", "texte": "Le référentiel des prérequis est une proposition à valider par un référent infirmier. TabSanté n’envoie aucun message au patient : c’est l’infirmier qui l’appelle."}, {"type": "p", "texte": "Il faut le droit d’attribuer les tournées pour modifier ces réglages."}]}, {"id": "pf-simulations-reprise", "titre": "Simulations, échanges de santé et reprise de dossiers", "resume": "Provoquer une panne de démonstration, essayer une règle provisoire, reprendre les dossiers d’un autre logiciel.", "mots_cles": ["simulations", "démonstration", "panne", "règle provisoire", "échanges de santé", "messagerie", "laboratoire", "DMP", "reprise de dossiers", "import"], "blocs": [{"type": "h", "texte": "Paramètres › Simulations"}, {"type": "p", "texte": "Cette page n’existe qu’en mode démonstration. Elle liste les services simulés (cartes, téléservices, SESAM-Vitale, messagerie, DMP, géographie…), les référentiels de démonstration et les règles provisoires, chacun avec ce qu’il remplace."}, {"type": "etapes", "items": ["Repérez le service ou la règle voulu.", "Choisissez son « Comportement » : une panne (carte bloquée, droits fermés, rejet des feuilles, verglas…) ou une option.", "Le réglage vaut dès l’appel suivant, pour toute l’instance, et reste après un redémarrage.", "« Tout remettre à la normale » rétablit les comportements normaux et les options prudentes."]}, {"type": "p", "texte": "La même page présente les cartes CPS et Vitale de démonstration, les postes de travail (agent de poste simulé) et le banc de conformité."}, {"type": "note", "ton": "info", "texte": "Un bandeau « Démonstration » rappelle sur tout le poste fixe que cartes, téléservices, facturation et échanges sont simulés. Le réglage des pannes revient à l’administration du cabinet."}, {"type": "h", "texte": "Échanges de santé"}, {"type": "p", "texte": "La page « Échanges de santé » (infirmiers) réunit la messagerie sécurisée simulée, « Adresser au laboratoire » un prélèvement signé, les passages imprévus à régulariser (« Rattacher une prescription »), le DMP, les ordonnances électroniques, les BSI déposés et une visio simulée."}, {"type": "h", "texte": "Reprise de dossiers"}, {"type": "etapes", "items": ["« Paramètres › Reprise de dossiers » : choisissez le format (fichier complet JSON ou identités seules CSV), le logiciel d’origine, puis déposez le fichier.", "Lancez l’aperçu à blanc : chaque erreur et chaque ressemblance avec un patient du cabinet est dite ; rien n’est créé.", "Corrigez le fichier si besoin, puis reprenez. Rejouée, la reprise ne recrée aucun dossier."]}, {"type": "note", "ton": "attention", "texte": "Le format pivot est un format de démonstration. Les identités reprises restent provisoires jusqu’à leur qualification INSi ; aucun mot de passe n’est repris."}]}, {"id": "pf-notifications-suggestions", "titre": "Notifications, compteurs et suggestions", "resume": "Lire la cloche, valider une notification proposée, suivre les pastilles et les suggestions du jour.", "mots_cles": ["notifications", "cloche", "compteurs", "badges", "suggestions", "notification proposée", "temps réel"], "blocs": [{"type": "h", "texte": "La cloche des notifications"}, {"type": "p", "texte": "La cloche, sous la navigation, ouvre vos notifications. Portée : « Pour moi » ou « Tout le cabinet ». Deux listes : « À valider » et « Reçues »."}, {"type": "etapes", "items": ["Une notification proposée par une règle du soin attend un infirmier : relisez ses destinataires.", "Un infirmier valide l’envoi, ou « Écarter » avec un motif.", "« Marquer comme vue » une notification reçue, ou « Ouvrir » ce qu’elle concerne."]}, {"type": "note", "ton": "attention", "texte": "Envoi simulé : la messagerie sécurisée n’est pas raccordée, le message est versé au journal."}, {"type": "h", "texte": "Pastilles et mise à jour en direct"}, {"type": "p", "texte": "Les pastilles de la barre latérale se relisent à chaque changement de page. Les vues ouvertes se mettent à jour d’elles-mêmes quand un acte, une cotation, une occurrence, une transmission, une notification ou une échéance change dans le cabinet."}, {"type": "h", "texte": "Suggestions"}, {"type": "p", "texte": "Le panneau « Suggestions » d’« Aujourd’hui » propose des pistes, jamais des ordres. « Pourquoi ? » montre la source, la règle et les données ; « C’est fait » ou « Écarter » avec un motif. Une suggestion revient si sa cause change."}]}, {"id": "pf-savoir-faire", "titre": "Savoir-faire « Comment faire ? »", "resume": "Chercher un geste, une vidéo ou une réponse, proposer un contenu, relire en tant que référent.", "mots_cles": ["savoir-faire", "comment faire", "geste", "vidéo", "question", "relecture", "référent"], "blocs": [{"type": "p", "texte": "La page « Savoir-faire » réunit les gestes, vidéos, références écrites et réponses du réseau, relus par des infirmières et des médecins. Les mêmes contenus apparaissent sous les fiches concernées."}, {"type": "etapes", "items": ["« Rechercher un geste ou une question », ou filtrez par type et par fiche.", "Ouvrez un contenu : étapes, points de vigilance, matériel, vidéo, source et date de prochaine révision.", "« Poser une question » ou « Proposer un contenu » : la proposition attend la relecture d’un référent avant d’apparaître sous les fiches.", "Répondez à une question du terrain : un référent peut marquer « réponse validée »."]}, {"type": "h", "texte": "Relecture"}, {"type": "p", "texte": "La page « Relecture » n’apparaît qu’aux référents : « Marquer comme relu » ou « Refuser » avec un motif que l’auteur lira."}, {"type": "note", "ton": "attention", "texte": "Les contenus actuels sont des textes de démonstration, à faire valider par un infirmier ou un médecin référent avant tout usage. Les vidéos sont lues depuis YouTube avec le crédit de leur source, jamais copiées."}]}, {"id": "pf-mesure-photo", "titre": "Mesurer une plaie sur sa photo", "resume": "Surface, longueur et largeur détourées sur la photo, à l'échelle de la réglette : comparables d'un intervenant à l'autre.", "mots_cles": ["mesure", "photo", "réglette", "planimétrie", "surface", "contour", "détourage", "PAN-E13"], "blocs": [{"type": "p", "texte": "Sur la vue d'une plaie, chaque cliché de la comparaison porte un bouton « Mesurer ». La photo s'ouvre en grand ; la réglette photographiée avec la plaie donne l'échelle, le contour la surface. Le serveur refait le calcul depuis vos points ; la mesure, datée et signée de votre nom, ne se modifie plus : une nouvelle mesure la remplace, l'ancienne reste au dossier."}, {"type": "etapes", "items": ["Cliquez une graduation de la réglette, puis une autre, le plus loin possible.", "Tapez la longueur lue entre ces deux graduations, puis « Détourer la plaie ».", "Cliquez le long du bord, ou « Proposer un contour » puis un clic au milieu du lit de la plaie.", "Ajustez : faites glisser un point, cliquez près d'un côté pour en ajouter un, double-cliquez pour en retirer un.", "Cliquez « Enregistrer la mesure »."]}, {"type": "p", "texte": "Au clavier : flèches pour déplacer le viseur (Maj pour aller plus vite), Entrée pour poser un point, Retour arrière pour retirer le dernier."}, {"type": "note", "ton": "info", "texte": "La courbe reste celle des mesures du passage (L × l) : le rectangle englobe toujours des coins sains, l'écart est écrit à côté de chaque mesure. Faut-il que la surface détourée devienne la référence ? Question Q-160."}]}, {"id": "pf-preuve-scellee", "titre": "Dossier de preuve scellé et vérification", "resume": "Le dossier d'une période en un PDF produit au serveur, inscrit à la chaîne d'audit, vérifiable par son empreinte.", "mots_cles": ["preuve", "contrôle", "PDF", "scellé", "empreinte", "sceau", "vérifier", "CPAM"], "blocs": [{"type": "p", "texte": "Sur le dossier de preuve par période, « PDF scellé » fait produire le document par le serveur : l'intégrité en tête (empreintes recalculées, chaîne d'audit), le sceau de la période, chaque acte avec son empreinte, ses photos et sa cotation, puis les clichés. L'empreinte du fichier est inscrite au journal d'audit, sans aucune donnée de patient."}, {"type": "p", "texte": "Page Preuves, « Vérifier un dossier remis » : déposez le PDF ; son empreinte est calculée sur le poste, sans envoyer le fichier, puis cherchée au journal du cabinet. Un fichier inconnu a été modifié, ou ne vient pas de ce cabinet."}]}]}, {"id": "terminal", "titre": "Guide du terminal", "public": "soignants", "pages": [{"id": "term-vue-ensemble", "titre": "Le terminal en un coup d'œil", "resume": "L'application de tournée : quatre onglets, « Moi » par l'avatar, un passage en plein écran.", "mots_cles": ["terminal", "onglets", "Tournée", "Patients", "Liaisons", "Envois", "Moi", "jour", "nuit"], "blocs": [{"type": "p", "texte": "Le terminal est l'application du soignant au domicile. Il fonctionne avec ou sans réseau : tout ce qu'il faut pour la tournée est chargé à l'avance sur le téléphone."}, {"type": "table", "entetes": ["Onglet", "Ce qu'on y fait", "Pastille"], "lignes": [["Tournée", "Le prochain passage, la suite de la journée, l'itinéraire", "aucune"], ["Patients", "Chercher un patient, une transmission, une ordonnance ou une tournée du jour, ouvrir une fiche patient", "aucune"], ["Liaisons", "Transmissions et notifications", "bleue : « n à lire »"], ["Envois", "La file de ce qui attend d'être envoyé au cabinet", "ambre : « n en attente » ou « n à corriger »"]]}, {"type": "p", "texte": "« Moi » s'ouvre en touchant l'avatar en haut de la tournée. On y trouve le profil, « Recharger la tournée du jour », « Changer d'intervenant » (possible une fois tous les envois partis), « Navigation et position », « Notifications », « Ce terminal » et l'affichage."}, {"type": "h", "texte": "Affichage jour ou nuit"}, {"type": "p", "texte": "Dans « Moi », rubrique « Affichage » : « Automatique » suit le téléphone (nuit quand il passe en mode sombre), « Jour » ou « Nuit » forcent l'un ou l'autre. Le changement est immédiat et ne perd rien."}, {"type": "p", "texte": "Un passage s'ouvre par-dessus les onglets, en plein écran. On revient à la tournée à la fin, depuis le reçu."}, {"type": "note", "ton": "info", "texte": "La mention en bas de « Moi » rappelle que les données de la démonstration sont fictives."}]}, {"id": "term-enrolement", "titre": "Enrôler un téléphone", "resume": "Rattacher un téléphone au cabinet avec le code à usage unique émis au poste fixe.", "mots_cles": ["enrôlement", "code", "poste fixe", "Terminaux", "révocation", "téléphone perdu"], "blocs": [{"type": "p", "texte": "Avant toute connexion, le téléphone doit être enrôlé par le cabinet. Cela se fait une seule fois, ou de nouveau après une révocation ou un « Code oublié »."}, {"type": "etapes", "items": ["Au poste fixe, page Terminaux : « Émettre un code ».", "Sur le téléphone, écran « Enrôler ce téléphone » : saisir les 10 caractères du code, dans les 10 minutes.", "Toucher « Enrôler ce téléphone ». Tant que le code est incomplet, le bouton dit combien de caractères il manque."]}, {"type": "p", "texte": "Le téléphone reçoit alors un secret qui ne quitte pas son coffre-fort ; il le présente à chaque reconnexion."}, {"type": "table", "entetes": ["Message", "Que faire"], "lignes": [["Ce code n'est pas reconnu", "Il est faux, a expiré ou a déjà servi : en demander un nouveau au poste fixe."], ["Trop d'essais rapprochés", "Patienter une minute, puis réessayer."], ["Serveur injoignable", "L'enrôlement a besoin du réseau : se rapprocher du Wi-Fi du cabinet."]]}, {"type": "note", "ton": "attention", "texte": "Téléphone perdu ou volé : le cabinet le révoque depuis le poste fixe, et plus aucune session ne s'y ouvre."}, {"type": "note", "ton": "info", "texte": "Le bouton « Démonstration : enrôler sans code » ne fonctionne qu'avec un serveur de développement ; un serveur réel le refuse."}]}, {"id": "term-connexion", "titre": "Se connecter", "resume": "Ouvrir sa session : carte CPS de démonstration pour l'infirmière, choix du nom pour l'aide-soignante.", "mots_cles": ["connexion", "CPS", "code porteur", "Qui êtes-vous", "démonstration", "aide-soignante"], "blocs": [{"type": "p", "texte": "L'écran « Qui êtes-vous ? » ouvre la session sur le cabinet de démonstration. La première connexion a besoin du réseau pour charger la tournée."}, {"type": "note", "ton": "info", "texte": "Quand le cabinet a configuré Keycloak, le bouton « Se connecter avec TabSanté (Keycloak) » vient en tête : identifiant et mot de passe, ou carte CPS par Pro Santé Connect (simulé). Le code de service sert de secours ; l'enrôlement du téléphone et le code à 6 chiffres ne changent pas."}, {"type": "h", "texte": "Infirmière : par la carte CPS"}, {"type": "etapes", "items": ["Toucher « Se connecter avec ma carte CPS ».", "Choisir la carte à « insérer » dans le lecteur de démonstration, puis « Lire la carte insérée ».", "Saisir le code porteur de la carte et valider : la session s'ouvre et la tournée se charge."]}, {"type": "p", "texte": "Un code porteur faux dit les essais restants ; trois codes faux bloquent la carte."}, {"type": "h", "texte": "Aide-soignante"}, {"type": "p", "texte": "Elle touche son nom dans la liste des profils, sous le bouton de la carte."}, {"type": "note", "ton": "attention", "texte": "Tout est simulé : lecteur de cartes, carte CPS et fournisseur d'identité. Aucune carte réelle n'est lue et les données sont entièrement fictives."}, {"type": "note", "ton": "info", "texte": "Après la connexion, le terminal demande de choisir un code de verrouillage (voir « Code de verrouillage et empreinte »)."}]}, {"id": "term-verrou", "titre": "Code de verrouillage, empreinte et session perdue", "resume": "Le code à 6 chiffres qui protège le terminal, l'empreinte, le code oublié et les sessions fermées.", "mots_cles": ["verrou", "code", "empreinte", "code oublié", "session perdue", "révocation", "fin de remplacement"], "blocs": [{"type": "h", "texte": "Choisir son code"}, {"type": "etapes", "items": ["Étape 1 sur 2 : « Choisissez votre code » (6 chiffres).", "Étape 2 sur 2 : « Confirmez votre code ».", "Le terminal propose ensuite « Déverrouiller aussi par empreinte ? » : « Utiliser l'empreinte » ou « Code seulement »."]}, {"type": "p", "texte": "Un même chiffre répété ou une suite de chiffres sont refusés. L'empreinte est plus rapide entre deux patients ; le code reste toujours possible. Si une empreinte est ajoutée ou retirée sur le téléphone, l'empreinte se désactive et seul le code rouvre."}, {"type": "h", "texte": "Quand le terminal se verrouille"}, {"type": "liste", "items": ["Au lancement de l'application.", "Quand elle passe en arrière-plan.", "Après 5 minutes sans toucher l'écran, jamais pendant qu'un doigt est posé (signature maintenue)."]}, {"type": "p", "texte": "Après 5 codes faux, une attente s'impose : 30 secondes, puis elle double à chaque erreur, jusqu'à 15 minutes. Rien n'est jamais effacé à cause d'erreurs de code."}, {"type": "note", "ton": "attention", "texte": "Un téléphone sans verrouillage d'écran (ni code, ni schéma, ni empreinte) est refusé : « Verrouillage du téléphone requis ». Activer le verrouillage dans les réglages du téléphone, puis « Vérifier à nouveau »."}, {"type": "h", "texte": "Code oublié"}, {"type": "p", "texte": "« Code oublié ? » demande un nouveau code d'enrôlement au poste fixe, puis une reconnexion ; il faut le réseau. D'ici là, TabSanté reste fermé. Les envois en attente restent sur le téléphone, chiffrés, et partent après la reconnexion."}, {"type": "h", "texte": "Session perdue ou accès révoqué"}, {"type": "table", "entetes": ["Écran", "Pourquoi", "Ce que l'on peut faire"], "lignes": [["Reconnexion nécessaire", "La session a expiré", "Se reconnecter : la tournée et les saisies sont gardées"], ["Accès révoqué sur ce téléphone", "Terminal déclaré perdu, session fermée à distance, ou réutilisation suspecte de la connexion", "Envoyer d'abord (nouvel enrôlement, connexion, envoi) ou Effacer sans envoyer, avec confirmation"], ["Remplacement terminé / Habilitation de remplacement révoquée", "Fin du remplacement ou révocation par le cabinet", "Ce qui reste attend le cabinet ; seul un code du poste fixe rouvre le téléphone"]]}, {"type": "note", "ton": "info", "texte": "Effacer sans envoyer est définitif : l'écran dit combien d'envois seraient perdus."}]}, {"id": "term-tournee", "titre": "La tournée du jour", "resume": "L'onglet Tournée : progression, suggestions, prochain passage, suite de la journée.", "mots_cles": ["tournée", "prochain passage", "Ensuite", "progression", "suggestions", "écart horaire", "aide-soignante"], "blocs": [{"type": "p", "texte": "L'onglet Tournée s'ouvre sur la date, le nom de la tournée et « Bonjour » (ou « Bonsoir » après 18 h). La carte de progression compte les soins signés sur le total, le reste « à faire », et la pastille réseau mène à l'onglet Envois."}, {"type": "h", "texte": "Ce que montre la page"}, {"type": "liste", "items": ["Les bandeaux utiles : tournée d'un autre jour à recharger, données de plus de deux heures (« Données du … » avec « Recharger »), aucune tournée attribuée.", "« Suggestions » de la journée, lisibles hors connexion : gravité en icône et en mot, « Pourquoi ? » dépliable, « Faire » quand l'itinéraire peut s'en charger. Rien ne s'exécute seul ; écarter une suggestion se fait au poste fixe.", "L'itinéraire du moment en bref (arrêts, distance, fin estimée), qui ouvre la carte.", "« Prochain passage » (ou « Passage en cours » si une saisie est commencée) : la carte du patient.", "Les signalements de l'aide-soignante à décider, les rappels datés du jour, les échanges de tournée.", "« Ensuite » : les autres passages du jour, dans l'ordre de la tournée."]}, {"type": "h", "texte": "La carte du prochain passage"}, {"type": "p", "texte": "Elle montre le patient, son âge, le moment, ses contextes (chimiothérapie, HAD…), puis au plus deux points « À savoir » : saisie commencée, prérequis à confirmer, prescription modifiée, séance de perfusion du jour, rappel daté. Viennent ensuite le trajet et les soins du passage (une plaie porte son type, son ancienneté J+n et sa tendance)."}, {"type": "p", "texte": "Quand un soin du passage est déjà signé, la carte affiche son écart à l'heure prescrite, par exemple « réalisé à 6 h 15, 1 h 45 avant l'heure prescrite ». Cet écart est une information, jamais un blocage."}, {"type": "h", "texte": "Le bouton sous le pouce"}, {"type": "p", "texte": "En bas de l'écran, au-dessus des onglets : « Y aller » tant qu'on n'est pas parti, puis « Commencer le passage » (ou « Reprendre le passage »). Commencer le passage vaut arrivée chez le patient."}, {"type": "h", "texte": "Déclarer un passage non réalisé"}, {"type": "p", "texte": "Le lien « Non réalisé… » à côté du titre « Prochain passage », ou un appui long sur une ligne de « Ensuite », ouvre la déclaration sans entrer dans le passage."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : la tournée ne montre que les soins qu'elle signe. Un bandeau nomme les autres soins de la tournée, qui restent à l'infirmière."}, {"type": "note", "ton": "info", "texte": "Un patient dont le décès a été déclaré au poste fixe porte la mention « Décédé le … » sur la carte du prochain passage."}]}, {"id": "term-trajet", "titre": "Carte, itinéraire et « Avant d'arriver »", "resume": "Suivre la tournée sur la carte, partir avec « Y aller », préparer l'entrée chez le patient, prévenir d'un retard.", "mots_cles": ["carte", "itinéraire", "Y aller", "navigation", "Waze", "Google Maps", "Avant d'arriver", "retard", "prévenir le patient", "position", "prérequis"], "blocs": [{"type": "p", "texte": "La carte de la tournée montre le départ, les domiciles numérotés dans l'ordre, le trajet et la zone d'intervention. En ligne, le fond de carte vient d'OpenStreetMap ; hors connexion ou sans serveur de tuiles, le même tracé s'affiche sur un schéma."}, {"type": "p", "texte": "Chaque arrêt porte son arrivée estimée. En retard, l'heure prévue est barrée et le retard s'écrit en minutes (« + 12 min »), jamais par la seule couleur. Une fourchette « entre … et … » tient compte du trafic et de la météo."}, {"type": "h", "texte": "Y aller"}, {"type": "etapes", "items": ["Toucher « Y aller » : le départ est noté et part dans la file, même sans réseau.", "L'application de navigation s'ouvre sur les coordonnées du domicile seules, jamais le nom ni l'adresse du patient.", "Déjà en route, le bouton devient « Itinéraire » et rouvre la navigation sans noter un second départ."]}, {"type": "p", "texte": "L'application se choisit dans « Moi » › « Navigation et position » : Google Maps, Waze ou Plans (Apple). Si elle ne s'ouvre pas, le départ reste noté et le terminal propose d'en choisir une autre."}, {"type": "h", "texte": "Avant d'arriver"}, {"type": "liste", "items": ["Les alertes du dossier (une allergie en rouge).", "« À vérifier avant le passage » : les prérequis (à jeun, ordonnance, matériel…), à régler « Confirmé », « Non tenu » ou cocher « Patient prévenu », même hors connexion.", "« Accès au domicile » : digicode, étage, interphone, clés, stationnement, animaux, consignes, et la photo de l'entrée (« Photographier l'entrée » se fait en ligne).", "« Trajet » : météo, arrivée estimée, trafic, durée et distance.", "« Matériel à emporter », « Dernier passage », et le rappel « Vit seul : prévenir l'entourage en l'absence de réponse »."]}, {"type": "h", "texte": "Prévenir le patient d'un retard"}, {"type": "p", "texte": "Au-delà de 10 minutes de retard, ou quand une heure fixe ou prescrite ne peut plus être tenue, « Prévenir le patient » propose les numéros du dossier (le patient, sa personne de confiance, son entourage). Il ouvre l'appel ou un SMS prérempli : « Bonjour, votre infirmier(ère) aura environ 15 min de retard. » C'est le soignant qui l'envoie depuis son téléphone."}, {"type": "h", "texte": "Partage de position"}, {"type": "p", "texte": "Désactivé par défaut et réglé par le soignant seul, en ligne, dans « Moi » › « Navigation et position » › « Partager ma position approximative ». Accepté, la position n'est prise qu'au départ, au kilomètre près, pour estimer l'heure d'arrivée, et s'efface à l'arrivée."}, {"type": "note", "ton": "info", "texte": "Repères des domiciles, trajets, trafic et météo sont simulés : un ordre de grandeur, jamais une consigne. Le seuil de 10 minutes est provisoire."}, {"type": "note", "ton": "info", "texte": "Hors connexion, « Y aller » et « Commencer le passage » entrent dans la file et le téléphone recalcule les heures des arrêts suivants ; le serveur refait le calcul au retour du réseau."}]}, {"id": "term-patients", "titre": "Patients et fiche patient", "resume": "Chercher hors connexion, créer un patient provisoire, ouvrir la fiche d'un patient pour un moment.", "mots_cles": ["patients", "recherche", "hors connexion", "nouveau patient", "identité provisoire", "fiche patient", "reçu au cabinet"], "blocs": [{"type": "p", "texte": "L'onglet Patients liste les patients chargés sur le téléphone. Le champ de recherche (« Patient, transmission, ordonnance, tournée ») cherche hors connexion dans ce que le téléphone a chargé, sans accents ni majuscules. Le reste du cabinet se cherche au poste fixe."}, {"type": "h", "texte": "Créer un patient (infirmière)"}, {"type": "p", "texte": "« Nouveau patient » crée une identité provisoire sur le téléphone : identité, allergies, médecin traitant et personne de confiance (facultatifs). Elle part avec la file ; les téléservices d'identité et de droits sont appelés au serveur, sans jamais bloquer le soin. Les dossiers ressemblants se tranchent au poste fixe."}, {"type": "h", "texte": "La fiche patient"}, {"type": "liste", "items": ["Les soins du moment, à cocher ; un appui ouvre le soin dû.", "« Comment faire ? » : les contenus de savoir-faire du cabinet pour le soin.", "L'interrupteur « Reçu au cabinet » quand les soins de ce passage sont faits au cabinet, pas au domicile.", "Les dispositifs (cathéters, stomies…) et le lien « Poser un dispositif ».", "Les plaies actives, chacune avec « Commencer le passage » ou « Passage non programmé », et « Ouvrir une nouvelle plaie ».", "« Ajouter un soin », les rythmes prescrits, les prescriptions infirmières, les plaies clôturées et « Récidive… »."]}, {"type": "note", "ton": "info", "texte": "Aide-soignante : pas de création de patient, pas de prescriptions infirmières ; elle ne voit que les soins qu'elle signe."}]}, {"id": "term-passage", "titre": "Faire un passage", "resume": "Commencer le passage, suivre le mode visite, renseigner la fiche et utiliser le menu « Autres actions ».", "mots_cles": ["passage", "commencer", "mode visite", "check-list", "brouillon", "autres actions", "comment faire"], "blocs": [{"type": "etapes", "items": ["Toucher « Commencer le passage » (tournée ou fiche patient) : le passage s'ouvre en plein écran sur la saisie commencée, sinon sur le premier soin dû.", "Renseigner la fiche ; chaque appui est enregistré en brouillon sur le téléphone (« Brouillon enregistré »).", "Signer quand la barre du bas dit « Tout est renseigné »."]}, {"type": "h", "texte": "Mode visite"}, {"type": "p", "texte": "Pour un soin en plusieurs étapes, le mode visite s'active de lui-même : « Étapes du soin » liste les prérequis du passage puis chaque section de la fiche, à cocher (« Étape faite »), avec la progression « n sur N ». Il propose aussi la comparaison de la photo du jour avec celle de référence (« Glisser pour comparer ») et une « Note de relève » versée en transmission ciblée (« Verser à la relève »)."}, {"type": "note", "ton": "info", "texte": "Le mode visite ne remplace rien : cocher une étape n'écrit rien dans la fiche et ne débloque pas la signature. Seules les règles de la fiche décident. Le bouton « Quitter le mode visite » le referme."}, {"type": "h", "texte": "Le menu « Autres actions »"}, {"type": "p", "texte": "Loin du bouton qui signe, le menu de l'en-tête du patient rassemble les gestes rares :"}, {"type": "liste", "items": ["« Déclarer un événement critique » (et « Incident respiratoire » pour un patient trachéotomisé ou sous CPAP).", "« Écrire une transmission ciblée » (« Écrire une transmission » pour l'aide-soignante).", "Infirmière seulement : « Poser un rappel daté », « Photographier l'ordonnance », « Rédiger une prescription infirmière », « Saisir un résultat de biologie », « Score SEGA (fragilité) », « Historique glycémique » et « Protocole d'insuline » pour un patient diabétique, « Facturer avec la carte Vitale »."]}, {"type": "p", "texte": "Quitter une saisie non signée propose « Abandonner cette saisie ? » : les réponses et les photos du passage sont effacées du téléphone ; « Garder la saisie » la conserve."}, {"type": "note", "ton": "info", "texte": "Un passage commencé plus de 2 heures après le soin demande le « Motif de la saisie différée ». Le cabinet valide ensuite cette saisie au poste fixe ; le seuil de 2 heures est provisoire."}]}, {"id": "term-ajout-non-programme", "titre": "Ajouter un soin et passage non programmé", "resume": "Tracer un soin qui n'était pas prévu à ce passage, avec son motif.", "mots_cles": ["ajouter un soin", "non programmé", "imprévu", "motif", "soin régulé", "SAS", "PDSA"], "blocs": [{"type": "etapes", "items": ["Depuis la fiche patient, toucher « Ajouter un soin ».", "Chercher (« Rechercher un soin ») ou choisir dans « Prescrits pour … », puis dans le catalogue par famille : plaies et pansements ; injections et perfusions ; surveillance et prélèvements ; hygiène et traitements ; élimination, nutrition, dialyse ; respiration.", "Un soin dû à ce moment s'ouvre comme prévu ; sinon il s'ouvre « non programmé » et le motif est demandé."]}, {"type": "table", "entetes": ["Soin", "Motifs proposés"], "lignes": [["Pansement", "Souillure, Pansement décollé, Saignement, Douleur, Demande du patient ; geste de reprise facultatif : film transparent, renfort d'adhésif, réfection complète"], ["Autres fiches", "Demande du patient, Demande du médecin, Initiative infirmière, Rattrapage, Soin régulé (SAS, PDSA), Autre"]]}, {"type": "liste", "items": ["Plusieurs plaies ouvertes : « Quelle plaie ? », une saisie et une signature par plaie.", "Aucune plaie ouverte : la plaie s'ouvre depuis la fiche patient, jamais au fil d'un passage.", "Dispositif absent : l'écran de pose s'ouvre. Le cathéter de dialyse se prend en charge au poste fixe.", "Soin sans fréquence chez le patient : un passage imprévu est créé et part avec l'acte."]}, {"type": "note", "ton": "info", "texte": "« Soin régulé (SAS, PDSA) » est réservé à l'infirmière."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : seuls les soins qu'elle signe sont proposés. Ce qu'elle constate se signale depuis le nursing."}]}, {"id": "term-non-realise-partiel", "titre": "Soin non réalisé ou fait en partie", "resume": "Déclarer qu'un soin prévu n'a pas eu lieu, ou qu'il n'a été fait qu'en partie.", "mots_cles": ["non réalisé", "réalisation partielle", "acte partiel", "motif", "à jeun"], "blocs": [{"type": "h", "texte": "Soin non réalisé"}, {"type": "etapes", "items": ["Lien « Non réalisé… » de la tournée, appui long sur un passage, ou « Passage non réalisé… » d'une fiche.", "Cocher les soins du passage concernés.", "Choisir le motif : Patient absent, Refus du patient, Hospitalisation, Décès, Soin reporté, Empêchement, Autre (précision obligatoire). « Patient non à jeun » s'ajoute quand un soin demande d'être à jeun.", "Maintenir « Déclarer non réalisé »."]}, {"type": "p", "texte": "Le soin n'est ni tracé ni facturé ; le motif part au cabinet et reste dans l'historique de la prescription. Hors connexion, la déclaration part avec la file."}, {"type": "h", "texte": "Soin fait en partie"}, {"type": "p", "texte": "Dans la section « Réalisation » d'une fiche, choisir « Soin fait en partie », puis « Pourquoi ? » (refus du patient, état du patient, matériel manquant, soin interrompu, autre) et « Ce qui n'a pas été fait »."}, {"type": "note", "ton": "info", "texte": "Le passage se signe et se trace tel quel. Le cabinet revoit sa cotation avant toute facturation."}]}, {"id": "term-signature-recu", "titre": "Signer et lire le reçu", "resume": "La barre « Il manque », la signature maintenue, le reçu et la cotation de démonstration.", "mots_cles": ["signature", "maintenir", "Il manque", "reçu", "empreinte", "cotation provisoire", "correction", "corriger une valeur"], "blocs": [{"type": "p", "texte": "La barre du bas dit ce qui manque, dans l'ordre de l'écran (« Il manque : saignement, douleur »). Un appui sur la mention amène au premier champ concerné. Quand tout est saisi, elle dit « Tout est renseigné »."}, {"type": "h", "texte": "Signature maintenue"}, {"type": "p", "texte": "Maintenir le bouton une seconde (« Maintenez une seconde ») : une barre remplit le bouton et une légère vibration confirme. Relâcher avant annule, rien n'est signé. Avec les animations réduites ou un lecteur d'écran, un appui ouvre une confirmation. Au clavier, Espace ou Entrée maintenue."}, {"type": "note", "ton": "attention", "texte": "La signature horodate le passage : il ne pourra plus être modifié sur ce téléphone."}, {"type": "h", "texte": "Le reçu"}, {"type": "liste", "items": ["Titre accordé au soin (« Injection signée », « Constantes signées »…).", "« Réalisé le », « Signé par » et « Empreinte » : les 12 premiers caractères de l'empreinte calculée par le serveur, ou « calculée à la réception par le serveur » hors connexion.", "L'état d'envoi : « Transmis au cabinet », « Envoi en cours », ou « L'envoi partira tout seul dès le retour du réseau ».", "Pour une plaie, l'évolution depuis J0 avec la mesure du jour.", "Les actions : « Écrire une transmission », « Corriger une valeur », la suite de la tournée (« Patient suivant », « Plaie suivante », « Autre plaie ») ou « Retour à la tournée »."]}, {"type": "h", "texte": "Cotation affichée"}, {"type": "p", "texte": "Pour l'infirmière, le reçu montre la cotation provisoire, toujours marquée « Démonstration ». Hors connexion, elle n'est estimée que si l'acte correspond au passage prévu ; sinon le reçu dit « Cotation provisoire non estimée hors connexion ». Une divergence avec le serveur part en file de contrôle, arbitrée au poste fixe."}, {"type": "h", "texte": "Corriger une valeur"}, {"type": "p", "texte": "Un soin signé ne change jamais : « Corriger une valeur » ajoute une correction datée avec son motif obligatoire, confirmée par un appui maintenu."}, {"type": "note", "ton": "info", "texte": "La cotation vient d'un moteur de démonstration : elle n'est jamais facturable. L'aide-soignante ne voit aucune cotation."}, {"type": "liens", "items": [{"titre": "La cotation par passage", "resume": "Ce que le moteur reçoit et comment lire une ligne.", "href": "#fn-passage"}]}]}, {"id": "term-plaies", "titre": "Plaies et pansements", "resume": "Ouvrir une plaie, faire le pansement, retirer fils ou agrafes, suivre un drain de Redon, clôturer.", "mots_cles": ["plaie", "pansement", "ouverture", "escarre", "photo", "clôture", "récidive", "Redon", "fils", "agrafes", "rectifier"], "blocs": [{"type": "h", "texte": "Ouvrir une plaie (infirmière)"}, {"type": "etapes", "items": ["Fiche patient : « Ouvrir une nouvelle plaie ».", "Étape 1 : toucher la région atteinte sur le schéma corporel (vues de face, de dos, région sacrée, talons), écrire la localisation, choisir le type : escarre, ulcère, chirurgicale, traumatique, brûlure, moignon, autre. Une plaie clôturée au même endroit est proposée en récidive.", "Étape 2 : dimensions initiales (cm), grandeur de référence, fistuleuse ou non, suture (fils, agrafes…), protocole initial facultatif lu sur l'ordonnance, puis la prescription d'origine ou « Sans ordonnance · accès direct » pour une plaie non chirurgicale.", "Toucher « Ouvrir la plaie et signer »."]}, {"type": "p", "texte": "Le stade d'une escarre est obligatoire (1 à 4 ou indéterminable). Localisation et type sont figés ensuite ; une erreur de saisie à l'ouverture se rectifie (« Rectifier l'ouverture… ») jusqu'au deuxième passage signé, par qui a ouvert."}, {"type": "h", "texte": "Le passage de pansement"}, {"type": "liste", "items": ["« Repris du passage du … » : gestes et produits du dernier passage, modifiables.", "Mesures du jour, ou « Inchangées depuis le … » ; un écart de plus de 50 % demande confirmation.", "« À confirmer à chaque passage » : saignement, douleur au soin (sur 10), signes infectieux locaux. Ces réponses ne sont jamais présélectionnées.", "Ablation prévue : nombre d'agrafes ou de fils retirés, obligatoire pour signer.", "Drain de Redon : chaque drain avec son volume recueilli, l'aspiration et « Retiré » ; une troisième séance depuis le retour à domicile est signalée, jamais bloquée.", "Photo facultative."]}, {"type": "h", "texte": "Photos"}, {"type": "p", "texte": "Le guide « Cadrer la photo » rappelle le cadrage : plaie au centre, réglette à côté, téléphone parallèle à la peau, à 20 cm environ. La photo se prend dans l'application, jamais depuis la galerie, et ne reste pas en clair sur le téléphone. Une photo prise plus de 2 heures avant le soin ou après sa signature est refusée par le serveur."}, {"type": "h", "texte": "Clôturer une plaie"}, {"type": "etapes", "items": ["Menu de la plaie : « Clôturer la plaie… ».", "Choisir le motif : cicatrisation, hospitalisation, décès, arrêt de prise en charge, autre (précision).", "Lire les conséquences : soins prévus retirés, autres plaies poursuivies, historique, mesures et photos conservés.", "Maintenir « Clôturer la plaie »."]}, {"type": "note", "ton": "attention", "texte": "Une plaie clôturée ne se rouvre pas. Une récidive ouvre un nouvel épisode, lié à la plaie clôturée."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-injections", "titre": "Injections", "resume": "Fiche 19 : une ligne par injection, son type, son produit, son lot et sa surveillance.", "mots_cles": ["injection", "fiche 19", "vaccin", "lot", "tuberculine", "allergènes", "sérum", "site"], "blocs": [{"type": "p", "texte": "La fiche trace une ou plusieurs injections au même passage. Chaque ligne a son type ; la voie en découle, elle ne se saisit pas."}, {"type": "p", "texte": "Types proposés : IV directe, IV en série, IV enfant de moins de 5 ans, intramusculaire, sous-cutanée, intradermique, versions immunodéprimé (IM, SC, IV), IV chimiothérapie, sérum, allergènes, implant sous-cutané, voie rectale, vaccination, vaccination sans prescription, pulvérisation, tuberculine (pose, lecture)."}, {"type": "h", "texte": "Exigé pour signer, ligne par ligne"}, {"type": "liste", "items": ["Le type, le produit et la dose ; « faite ou non », et le motif si elle n'est pas faite (refus, produit indisponible, patient absent, contre-indication, report médical, autre).", "Le site, choisi sur le schéma (sauf pulvérisation, voie rectale et lecture de tuberculine).", "Le numéro de lot pour un vaccin ou un sérum.", "La surveillance post-injection (1 à 240 min) pour un sérum ou des allergènes ; le protocole écrit et la transmission au prescripteur pour les allergènes.", "La lecture de tuberculine : son résultat et la transmission ; la pose programme la date de lecture."]}, {"type": "note", "ton": "attention", "texte": "L'insuline se trace en Suivi diabétique et les héparines en Anticoagulant : la fiche le signale si l'on saisit ces produits ici."}, {"type": "note", "ton": "info", "texte": "Pour un patient en contexte d'immunodépression, de cancer ou de chimiothérapie, le type adapté au contexte est exigé."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-prelevements", "titre": "Prélèvements et saignées", "resume": "Fiche 21 : voie, examens, tubes, contrôle d'identité, hémocultures et saignée.", "mots_cles": ["prélèvement", "fiche 21", "saignée", "hémocultures", "tubes", "laboratoire", "à jeun", "ferritinémie"], "blocs": [{"type": "p", "texte": "Voies proposées : ponction veineuse, ponction artérielle, saignée, cathéter central, chambre implantable, prélèvement aseptique (cutané, sécrétions, selles, urine, hémocultures)."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["La voie et « fait ou non » de chaque ligne ; le motif sinon (échec de ponction, veines inaccessibles, refus, patient non à jeun, patient absent, matériel manquant, prescription non conforme, ferritinémie sous le seuil pour une saignée, autre).", "Les examens et les tubes prélevés.", "Le contrôle d'identité, avec son heure, et l'étiquetage au lit.", "Le site quand la voie en a un.", "Hémocultures : chaque paire avec son site, différent de la paire précédente."]}, {"type": "p", "texte": "Sections complémentaires : « Acheminement au laboratoire » (par qui, remis à quelle heure), « Laboratoire », « Reporter le prélèvement »."}, {"type": "p", "texte": "Un prélèvement non fait parce que le patient n'était pas à jeun se déclare avec le motif « Patient non à jeun » : le prérequis du passage devient « non tenu »."}, {"type": "note", "ton": "info", "texte": "Le bon de prélèvement part au laboratoire par la messagerie sécurisée, simulée en démonstration."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-constantes", "titre": "Paramètres vitaux et épreuve de lever", "resume": "Fiche 18 : relevé des constantes, tension par position et par bras, épreuve de lever.", "mots_cles": ["paramètres vitaux", "constantes", "fiche 18", "tension", "température", "oxygène", "épreuve de lever", "IMC"], "blocs": [{"type": "p", "texte": "Le relevé porte au moins une constante. La tension se saisit avec sa position (assise, couchée, debout) et son bras ; plusieurs tensions peuvent être prises."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Systolique et diastolique, la systolique au-dessus de la diastolique.", "La méthode de la température.", "Air ambiant ou sous oxygène, et le débit sous oxygène (0 à 15 L/min).", "Un poids entre 0,3 et 400 kg ; le périmètre crânien seulement avant 60 mois.", "Relevé non fait : le motif (patient absent, refus, matériel indisponible, hospitalisé, état clinique, autre)."]}, {"type": "p", "texte": "Chaque champ affiche l'ancienneté de la dernière mesure. Le débit d'oxygène constaté se lit en regard du débit prescrit. L'IMC se calcule, il ne se saisit pas."}, {"type": "h", "texte": "Épreuve de lever"}, {"type": "etapes", "items": ["Depuis le bloc tension, ouvrir l'épreuve de lever (geste ponctuel).", "Noter la contention (sans, bas, chaussettes).", "Mesure couchée après 5 min de repos, puis « Le patient se lève — lancer le minuteur ».", "Mesures debout à 1 min puis à 3 min.", "Ou « Lever impossible » avec son motif : l'épreuve reste tracée, non réalisée."]}, {"type": "note", "ton": "info", "texte": "Les écarts sont calculés, jamais saisis, sans seuil ni alerte : l'infirmière lit et juge. Un malaise constitué ou une chute relève de l'événement critique."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : elle signe cette fiche quand le cabinet exerce en structure."}]}, {"id": "term-perfusions", "titre": "Perfusions IV et SC", "resume": "Fiches 4 et 5 : lignes de perfusion, repère du cathéter, sites sous-cutanés et tolérance.", "mots_cles": ["perfusion", "IV", "SC", "fiche 4", "fiche 5", "PICC", "chambre implantable", "VVP", "ligne", "rinçage", "nutrition parentérale"], "blocs": [{"type": "p", "texte": "Le cathéter IV ou le site SC est un objet suivi : le passage porte sur lui. Natures de cathéter IV : VVP, voie centrale, PICC, Midline, chambre implantable, autre."}, {"type": "h", "texte": "Lignes de perfusion"}, {"type": "p", "texte": "« Brancher une ligne » : produit, classe, volume (1 à 5 000 ml), débit (1 à 999 ml/h), ou « Enregistrer sans poser » avec un motif de non-pose. Une ligne se débranche avec son volume restant, au plus le volume posé."}, {"type": "h", "texte": "Perfusion IV : exigé pour signer"}, {"type": "liste", "items": ["Le repère externe du jour, et un commentaire si le cathéter a pu migrer.", "Le point de ponction et le rinçage.", "Le débit d'un palier ; la glycémie quand la nutrition parentérale le demande.", "Cathéter changé : site, localisation et dispositif posé."]}, {"type": "h", "texte": "Perfusion SC : exigé pour signer"}, {"type": "liste", "items": ["Le dispositif de chaque site posé (« Poser un site »).", "La confirmation d'un troisième site actif ; le motif du maintien d'un site au-delà de 72 h.", "Le motif d'un débit au-delà de 120 ml/h.", "La tolérance du site et l'écoulement."]}, {"type": "note", "ton": "attention", "texte": "Des lignes encore ouvertes bloquent la clôture d'un cathéter IV. Un cathéter qui se repose en établissement demande une clôture motivée, puis une reprise chaînée."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-stomies", "titre": "Stomies digestive et urinaire", "resume": "Fiches 2 et 3 : aspect, peau, appareillage, consommation et irrigation.", "mots_cles": ["stomie", "colostomie", "urostomie", "fiche 2", "fiche 3", "appareillage", "poche", "irrigation", "code produit"], "blocs": [{"type": "p", "texte": "La stomie est un objet suivi, une seule active par patient et par type."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["« À confirmer à chaque passage » : aspect de la stomie, peau péristomiale, saignement, douleur, effluents (ou aspect des urines).", "Poche changée ou non.", "Nouvelle référence de matériel : système, diamètre (10 à 100 mm) ou découpe (5 à 100 mm)."]}, {"type": "p", "texte": "Sections : « Appareillage », « Irrigation colique », « Surveillance urinaire », « Complications et éducation ». Le lot et la péremption se lisent sur le code produit, scanné ou saisi."}, {"type": "p", "texte": "À la clôture d'une stomie, une transmission ciblée est proposée au même écran, destinataires pré-cochés ; elle s'envoie ou s'écarte avec un motif."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-nutrition-enterale", "titre": "Nutrition entérale", "resume": "Fiche 8 : voie d'alimentation, repère, perméabilité, tolérance et sonde nasogastrique.", "mots_cles": ["nutrition entérale", "fiche 8", "sonde", "gastrostomie", "repère", "rinçage", "narine"], "blocs": [{"type": "p", "texte": "La voie d'alimentation est un objet continu : son compteur de jours ne repart jamais à zéro."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Un geste de la voie : le pansement seul ne fait pas un passage.", "L'état du site et le repère externe du jour.", "Le rinçage ; le consommable « autre » à nommer.", "Sonde changée : motif, nouvelle sonde (calibre et référence), narine, longueur introduite, repère externe, contrôle de position obligatoire."]}, {"type": "p", "texte": "Sections : « Repère externe ce jour », « Perméabilité », « Tolérance », « Gestes sur la voie », « Avant de signer ». Le résidu gastrique et les médicaments passés par la sonde sont tracés."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-diabete", "titre": "Suivi diabétique", "resume": "Fiche 10 : glycémie, dose proposée par le protocole, injection, HbA1c et historique.", "mots_cles": ["diabète", "fiche 10", "glycémie", "insuline", "protocole", "HbA1c", "lieu du soin"], "blocs": [{"type": "p", "texte": "La fiche suit le protocole d'insuline du patient : à partir de la glycémie, elle propose la dose de ce moment, même hors connexion. L'infirmière décide."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["La glycémie (0,10 à 6,00 g/L), ou le motif si elle n'est pas faite (refus, patient absent, lecteur défaillant, autre).", "Injection : oui ou non ; l'insuline injectée et son site, ou le motif (repas non pris, hypoglycémie, refus, produit indisponible, consigne médicale, autre).", "Un commentaire quand la dose s'écarte de la proposition.", "Mesure faite par le patient : son heure et la façon dont le relevé a été recueilli (lecteur du patient, carnet, appel du patient)."]}, {"type": "p", "texte": "Sections : « Lieu du soin » (domicile, école, périscolaire pour un enfant), « Glycémie », « Ce que propose le protocole », « Décision », « Relevé du patient », « HbA1c », « Prochain dosage »."}, {"type": "p", "texte": "Depuis le menu « Autres actions » : « Historique glycémique » (les passages dus non saisis y apparaissent « à faire ») et « Protocole d'insuline »."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-medicaments", "titre": "Médicaments et anticoagulant oral", "resume": "Fiche 6 et bloc AVK : pilulier, prises, renouvellement, INR.", "mots_cles": ["médicaments", "fiche 6", "pilulier", "AVK", "INR", "anticoagulant oral", "acte C", "fin de traitement"], "blocs": [{"type": "p", "texte": "La fiche trace la distribution ou la préparation des traitements à ce passage : le pilulier ou les lignes de médicaments."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Au moins une ligne ou le pilulier ; l'origine de la distribution ; le moment servi.", "Pour chaque médicament : pris ou non (« Tous pris » d'un geste), le motif sinon.", "Lignes saisies faute d'ordonnance : la mention de responsabilité.", "Un effet secondaire constaté : sa description."]}, {"type": "h", "texte": "Anticoagulant oral"}, {"type": "p", "texte": "La section « Anticoagulant oral » montre la posologie de la semaine. Il faut la dose du jour en mg et « pris ou non ». Un INR reçu se saisit (0 à 15) et le prochain INR se date après ce passage."}, {"type": "p", "texte": "« Fin de traitement… » arrête un traitement. Pour l'infirmière, un compteur rappelle les passages de l'acte C déjà faits."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-anticoagulant", "titre": "Anticoagulant injectable", "resume": "Fiche 11 : héparines et fondaparinux, dose, site, biologie de surveillance.", "mots_cles": ["anticoagulant", "fiche 11", "héparine", "HBPM", "plaquettes", "biologie", "site"], "blocs": [{"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["La classe, la spécialité, la visée et le dosage en cours.", "Injection faite ou non, et le motif sinon ; la dose injectée et qui l'a faite.", "Le site d'injection, l'aspect local (RAS compris) et « saignement : oui ou non »."]}, {"type": "p", "texte": "Sections : « Biologie de surveillance » (valeurs reçues) et « Prochains prélèvements » à dater après ce passage, avec leurs examens."}, {"type": "note", "ton": "attention", "texte": "L'héparine sodique par voie intraveineuse ne se trace pas ici."}, {"type": "note", "ton": "info", "texte": "L'historique des doses n'est jamais écrasé. « Fin de traitement… » se trouve en bas de la fiche, pour l'infirmière."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-nursing", "titre": "Nursing", "resume": "Fiche 12 : hygiène et confort, élimination, repas, prévention d'escarre, mobilisation.", "mots_cles": ["nursing", "fiche 12", "toilette", "change", "repas", "escarre", "rougeur", "phlyctène", "aide-soignante", "signalement"], "blocs": [{"type": "p", "texte": "C'est la fiche que l'aide-soignante signe. Elle compte au moins un soin tracé."}, {"type": "p", "texte": "Sections : « Hygiène et confort », « Élimination », « Étui pénien », « Aide au repas », « Prévention d'escarre », « Mobilisation ». Un soin hors liste s'ajoute avec son libellé (120 caractères au plus)."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Toilette partielle : les zones ; change ou toilette partielle, pas les deux.", "Chaque change : urines et selles.", "Aide au repas : oui ou non, fraction consommée, texture servie.", "Prévention : les zones traitées, pour chacune la rougeur et « Blanchit à la pression ? », le produit employé.", "Phlyctène : zone, aspect et protection.", "Le positionnement à la sortie."]}, {"type": "note", "ton": "attention", "texte": "Une rougeur qui ne blanchit pas ou une phlyctène : l'aide-soignante doit rédiger son signalement à l'infirmière pour signer ; une infirmière qui constate une phlyctène rédige une transmission ciblée."}, {"type": "note", "ton": "info", "texte": "Passage non réalisé : le motif est exigé."}]}, {"id": "term-pompes", "titre": "PCA, sédation et PSE", "resume": "Fiches 13-14 et 16 : pompes en service, doses, surveillance, seringues et réservoirs.", "mots_cles": ["PCA", "PSE", "pompe", "sédation", "RASS", "seringue", "réservoir", "stupéfiant", "fiche 16", "fiche 13-14"], "blocs": [{"type": "p", "texte": "L'épisode de pompe est l'objet suivi. Chaque pompe en service se contrôle à chaque passage."}, {"type": "h", "texte": "Contrôle de chaque pompe"}, {"type": "liste", "items": ["Débit affiché conforme ou non, volume restant lu (au plus le volume posé), alarmes (« aucune » si rien), alimentation.", "Un écart de volume demande confirmation et commentaire (« Écart confirmé après contrôle »).", "Un débit non conforme ou une alarme demande un commentaire ; selon le constat, un événement critique est à compléter."]}, {"type": "h", "texte": "PSE"}, {"type": "p", "texte": "Une seringue, un produit : deux produits font deux pompes. Il faut le produit, la quantité, le volume de la seringue (0,5 à 60 ml) et la vitesse (au plus 100 ml/h). « Modifier la vitesse » demande la nouvelle vitesse, son motif et la référence de la prescription."}, {"type": "h", "texte": "PCA et sédation"}, {"type": "liste", "items": ["Doses reçues, tentées et total sur 24 h, lues sur la pompe ; les tentées au moins égales aux reçues.", "Score de sédation, score respiratoire, douleur au repos et à la mobilisation.", "RASS quand une pompe de sédation est en service ; une cible RASS et le type de sédation sont exigés à sa mise en service.", "À la dernière dépose : devenir du reliquat et témoin."]}, {"type": "note", "ton": "attention", "texte": "Un 3, une réponse « autre » ou un RASS hors cible demandent un commentaire de surveillance. Une sédation profonde et continue exige la décision collégiale jointe."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-dialyse", "titre": "Dialyse péritonéale", "resume": "Fiche 17 : échanges manuels ou séance de cycleur, bilans, pansement, poids et tension.", "mots_cles": ["dialyse péritonéale", "fiche 17", "DPCA", "DPA", "cycleur", "échange", "poches"], "blocs": [{"type": "p", "texte": "Le cathéter de dialyse se prend en charge au poste fixe ; il apparaît au terminal à la précharge suivante. Modalités : manuelle (DPCA) ou cycleur (DPA)."}, {"type": "p", "texte": "Le passage porte au moins un geste : échange, séance, pansement, poids ou tension."}, {"type": "h", "texte": "Séance de cycleur"}, {"type": "etapes", "items": ["« Brancher la séance » : heure du branchement, poches installées (produit et lot), programme confirmé ; un programme différent du prescrit demande un commentaire.", "« Débrancher la séance » : heure, bilan de la nuit lu sur la machine, volumes lus sur le cycleur.", "Un bilan des 24 h qui s'écarte du précédent est à confirmer."]}, {"type": "p", "texte": "Une séance non branchée se dit (« Séance non branchée… ») avec sa raison. « Changer de modalité… » demande la nouvelle modalité, sa prescription et son motif."}, {"type": "h", "texte": "Pansement de l'émergence"}, {"type": "p", "texte": "État cutané péri-cathéter, prolongateur, et la date du prochain pansement."}, {"type": "note", "ton": "info", "texte": "Les volumes sont tracés, jamais transmis au moteur de cotation. La journée de dialyse court de 8 h à 8 h."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-alr", "titre": "Analgésie locorégionale", "resume": "Fiche 23 : prise en charge du cathéter, réinjection, surveillance, retrait et conduite d'urgence.", "mots_cles": ["ALR", "analgésie locorégionale", "fiche 23", "péridurale", "périnerveux", "neuraxial", "accord préalable", "bloc moteur"], "blocs": [{"type": "p", "texte": "Le cathéter d'analgésie se prend en charge au domicile : protocole (titre, consignes, photo de la pièce), type de bloc, latéralité, pompe prescrite."}, {"type": "h", "texte": "Réinjection : exigé pour signer"}, {"type": "liste", "items": ["L'injection prescrite (produit, dose, volume) et l'aspiration avant injection.", "Injecter, ou dire pourquoi ; un contrôle anormal se motive.", "La sédation, le bloc moteur des deux membres inférieurs, les signes de toxicité.", "La fréquence respiratoire et la tension, tracées en Paramètres vitaux."]}, {"type": "p", "texte": "La température du jour se lit dans Paramètres vitaux, jamais ressaisie."}, {"type": "h", "texte": "Retrait"}, {"type": "liste", "items": ["Pompe arrêtée avant le retrait.", "Le geste (résistance, extrémité) et la longueur retirée cohérente avec le repère.", "Le point après retrait, le reliquat, le devenir de la pompe, les consignes données."]}, {"type": "note", "ton": "attention", "texte": "Signe d'alerte : l'écran critique propose « Arrêter la pompe maintenant », « Appeler le 15 » et « Déclarer un événement critique »."}, {"type": "note", "ton": "info", "texte": "Neuraxial : tant que l'accord préalable n'est pas « accordé », l'injection reste possible et tracée, mais retenue. Aucune acceptation implicite."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-respiratoire", "titre": "Soins respiratoires", "resume": "Fiche 22 : aérosols, aspirations, trachéotomie et CPAP.", "mots_cles": ["respiratoire", "fiche 22", "trachéotomie", "canule", "aspiration", "aérosol", "CPAP", "nébulisation"], "blocs": [{"type": "p", "texte": "Un passage par patient et par moment, qu'il porte sur la trachéotomie, la CPAP ou le patient seul."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Un acte du passage ; pour chaque produit nébulisé, « fait ou non » et sa tolérance.", "Aspiration : aspect et abondance des sécrétions, tolérance.", "Trachéotomie : perméabilité de la canule, état péristomial, rougeur graduée, tolérance, protection posée, taille de la canule changée.", "CPAP : interface, points d'appui et leur état, tolérance, fuites."]}, {"type": "p", "texte": "Une lésion d'appui se relève en surveillance ; devenue plaie, son pansement se trace en Pansements tant qu'elle est ouverte. « Signaler au prestataire » sert aux problèmes de l'appareil."}, {"type": "note", "ton": "info", "texte": "Canule obstruée, décanulation accidentelle ou désaturation se déclarent depuis le menu « Autres actions » (« Incident respiratoire »), par tous."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-ugd", "titre": "Uro-génito-digestif", "resume": "Fiche 20 : sonde urinaire, cystostomie, lavements, autosondage, relevés d'élimination.", "mots_cles": ["uro-génito-digestif", "fiche 20", "sonde urinaire", "cystostomie", "lavement", "autosondage", "diurèse"], "blocs": [{"type": "p", "texte": "La fiche trace au moins un acte ou un relevé, choisi avec « Ajouter un acte »."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Une réponse et, si besoin, un motif pour chaque acte.", "Pose de sonde : matériau et charrière, volume du ballonnet, prescription.", "Sonde à demeure : perméabilité, fixation, poche déclive ou non.", "Cystostomie : pansement réalisé ou non, état péri-orifice, cathéter fixé et perméable.", "Diurèse mesurée ou estimée (pas les deux), avec sa période."]}, {"type": "p", "texte": "Le lavement suit la condition de l'ordonnance : condition remplie, réponse obligatoire ; non remplie, « non requis ce jour »."}, {"type": "note", "ton": "attention", "texte": "Le sexe du patient compte pour la cotation : s'il manque au dossier, il se saisit au cabinet."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : cette fiche est signée par une infirmière ; elle ne figure pas dans la tournée de l'aide-soignante."}]}, {"id": "term-neuropsy", "titre": "Surveillance neuropsychiatrique", "resume": "Fiche 15 : signes observés, rapports de l'entourage, historique.", "mots_cles": ["neuropsychiatrique", "fiche 15", "sédation", "tremblements", "raideur", "rapport", "entourage"], "blocs": [{"type": "p", "texte": "Quatre troubles se renseignent à chaque passage : comportement, langage, humeur et conscience, chacun avec son intensité, d'« Absent » à « Majeur ». S'y ajoutent les signes de tolérance du traitement, dont la sédation, les tremblements, la raideur, l'impatience motrice et les mouvements anormaux."}, {"type": "h", "texte": "Exigé pour signer"}, {"type": "liste", "items": ["Une réponse pour chaque signe ; « non évaluable » ou le qualificatif « autre » demandent un commentaire.", "Ce que rapporte un tiers : qui le rapporte, son nom, l'intensité rapportée et la date.", "Observation non réalisée : le motif."]}, {"type": "p", "texte": "L'écart à l'état habituel du patient s'affiche. « Historique » montre les observations récentes, même hors connexion. Des vertiges au lever renvoient à l'épreuve de lever en Paramètres vitaux."}, {"type": "note", "ton": "info", "texte": "La fiche n'est pas cotable."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : elle constate et signale ; la fiche est signée par une infirmière."}]}, {"id": "term-consultation", "titre": "Consultations, séances et bilans", "resume": "Fiche 24 au domicile, séances de parcours, brouillon partagé, bilans rédigés au cabinet.", "mots_cles": ["consultation infirmière", "fiche 24", "CIA", "CIB", "bilan de prévention", "art. 5 ter", "RAAC", "séance", "brouillon partagé", "bilan"], "blocs": [{"type": "p", "texte": "Sous-fiches disponibles au terminal : consultation CIA, consultation CIB, bilan de prévention, consultation infirmière, séance post-hospitalisation (art. 5 ter), séance postopératoire RAAC. Chacune a un tronc commun et un volet propre."}, {"type": "h", "texte": "Ce qui peut être exigé"}, {"type": "liste", "items": ["L'évaluation clinique, au moins un diagnostic infirmier, un objectif daté, une action réalisée, une synthèse.", "L'orientation (vers qui, pour quoi) et la prochaine consultation datée.", "CIA : qui injecte, les hypoglycémies depuis la dernière consultation.", "Bilan de prévention : la déclaration qu'aucun bilan n'a été fait ailleurs pour cette tranche d'âge, des thèmes de la trame de la tranche, une priorité choisie avec le patient, ce qu'il accepte de partager.", "Séance post-hospitalisation : les signes cliniques et l'automesure tensionnelle ; séance RAAC : une anomalie relevée ou non."]}, {"type": "h", "texte": "Brouillon partagé"}, {"type": "p", "texte": "Pour ces sous-fiches, le brouillon est commun aux infirmières du cabinet. Si une collègue l'a modifié entre-temps, la signature attend le choix : « Garder le mien » ou « Reprendre le leur »."}, {"type": "h", "texte": "Séances de parcours"}, {"type": "p", "texte": "Une séance (séance hebdomadaire, accompagnement médicamenteux…) liste ses « Éléments exigés » et ce que les fiches signées au même passage ont déjà tracé. Elle ne se clôt pas incomplète, hors fenêtre du parcours ou au-delà du plafond."}, {"type": "h", "texte": "Bilans"}, {"type": "p", "texte": "Un bilan dû dans la tournée ne se saisit pas au domicile : il se rédige, se relit et se signe au poste fixe, dans « Bilans dus »."}, {"type": "note", "ton": "info", "texte": "Les montants et dates d'effet de ces consultations relèvent du moteur de cotation ; la cotation affichée reste de démonstration."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : elle ne voit pas le contenu des consultations."}]}, {"id": "term-liaisons", "titre": "Liaisons : transmissions, mentions et notifications", "resume": "Lire et écrire les transmissions, répondre aux interpellations, décider des propositions.", "mots_cles": ["liaisons", "transmission", "ciblée", "intra-cabinet", "mention", "@", "interpellation", "notification proposée", "événement critique", "signalement"], "blocs": [{"type": "p", "texte": "L'onglet Liaisons a deux segments : « Transmissions » et « Notifications ». Les transmissions se lisent hors con
