onsultation.", "Les accès d'un professionnel extérieur par QR portent le cabinet, l'accès et le RPPS."]}, {"type": "h", "texte": "Conservation"}, {"type": "p", "texte": "365 jours (provisoire, D-06). La base refuse d'effacer une ligne de moins de 180 jours ou de vider la table, même au propriétaire. La purge coupe la chaîne par la tête et inscrit la coupure."}]}, {"id": "tech-chiffrement", "titre": "Chiffrement des fichiers, des sauvegardes et du terminal", "resume": "Ce qui est chiffré par l'application, avec quelles clés, et ce qui attend l'hébergeur.", "mots_cles": ["chiffrement", "AES-256-GCM", "KMS", "trousseau", "fichiers", "terminal", "Keystore", "TLS"], "blocs": [{"type": "table", "entetes": ["Donnée", "Au repos", "Où"], "lignes": [["Photos, ordonnances, PDF produits et reçus, BSI, photo de l'entrée du domicile", "Chiffrés par l'application, AES-256-GCM, une clé par fichier", "backend/app/stockage.py"], ["Sauvegardes (base et fichiers)", "AES-256-GCM, clé de sauvegarde distincte", "backend/scripts/sauvegarde.py"], ["Base locale du terminal", "Chaque enregistrement en AES-256-GCM, clé dans le Keystore Android", "mobile/lib/chiffrement.dart"], ["Photos du terminal", "Un fichier chiffré par photo, avec la clé de la base locale", "mobile/lib/coffre.dart"], ["Base PostgreSQL du serveur", "Non chiffrée par l'application : chiffrement du volume exigé de l'hébergeur", "contrat HDS"], ["Jetons, secrets d'appareil, codes d'enrôlement, jetons de QR", "Hachés (SHA-256), jamais en clair", "backend/app/auth.py"]]}, {"type": "h", "texte": "Fichiers du serveur"}, {"type": "liste", "items": ["Chaque fichier a sa clé aléatoire de 256 bits, enveloppée par la clé maîtresse active d'un port « Kms ».", "Le contenu est chiffré par segments de 64 Kio ; un fichier altéré, tronqué ou dont la clé manque est refusé (409 « Fichier illisible »), jamais servi à moitié.", "Le nom du fichier reste l'empreinte SHA-256 du clair, revérifiée à la lecture.", "Lecture en flux, segment par segment."]}, {"type": "note", "ton": "attention", "texte": "Le seul KMS existant, « KmsLocal », est un trousseau JSON simulé. Hors développement, l'API refuse de démarrer avec lui : brancher le KMS ou le HSM de l'hébergeur sur le port « Kms » est un prérequis de mise en service."}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/stockage.py verifier   # aussi : nouvelle-cle, migrer, tourner, retirer"}, {"type": "h", "texte": "Terminal"}, {"type": "liste", "items": ["Base locale chiffrée enregistrement par enregistrement, clé tirée au hasard et rangée dans le Keystore.", "Code de verrouillage à 6 chiffres (ou empreinte digitale) ; verrouillage au lancement, en arrière-plan et après 5 minutes sans toucher l'écran.", "Ni capture d'écran ni sauvegarde Android ; base illisible mise en quarantaine, jamais supprimée.", "Le terminal servi en navigateur garde sa clé dans le navigateur : démonstration seulement, jamais de vraies données."]}, {"type": "h", "texte": "Transport"}, {"type": "p", "texte": "En production, TLS au reverse proxy de l'hébergeur (TLS 1.2 au moins, suites AEAD, HSTS). L'API pose ses en-têtes de sécurité (nosniff, DENY, no-referrer, no-store, HSTS, CSP stricte) et n'admet en CORS que ses origines déclarées, en https hors développement."}]}, {"id": "tech-hors-connexion", "titre": "Terminal hors connexion et synchronisation", "resume": "La précharge du matin, la file d'opérations rejouable par /sync, l'idempotence par identifiant tiré au terminal et les garanties contre les doublons.", "mots_cles": ["hors connexion", "synchronisation", "/sync", "précharge", "file", "idempotence", "SAVEPOINT", "verrou", "brouillon"], "blocs": [{"type": "h", "texte": "Précharge"}, {"type": "p", "texte": "« GET /terminal/precharge » rend la journée : tournées, occurrences, patients, plaies, dispositifs, notifications, itinéraires, prérequis des passages. Le terminal complète par patient et globalement. Elle est rechargée à la connexion, après une synchronisation acceptée, et comparée au serveur toutes les 5 minutes ; elle n'est relue en entier que si son empreinte a changé. Un bandeau prévient au-delà de 2 heures."}, {"type": "h", "texte": "La file et POST /sync"}, {"type": "liste", "items": ["Chaque geste entre dans une file locale chiffrée, avec un identifiant UUID tiré au terminal.", "La file part toutes les 20 secondes et après chaque signature, par lots de 500 opérations au plus, planning d'abord.", "Le serveur rend, opération par opération, un reçu (avec l'empreinte de l'acte) ou un refus motivé.", "28 types d'opération : ouvrir ou clôturer une plaie ou un dispositif, signer un acte, corriger, rectifier, transmettre, créer un patient, échanges de tournée, passage non réalisé, fréquence ponctuelle, prescription infirmière, accords préalables, départ et arrivée, prérequis du passage, entre autres."]}, {"type": "h", "texte": "Garanties"}, {"type": "liste", "items": ["Une opération, un SAVEPOINT : un refus n'emporte pas les autres.", "L'identifiant tiré au terminal devient la clé primaire : rejouer la même opération rend le même résultat ; un identifiant déjà employé par un autre rend 409.", "Un envoi rejoué pendant que le premier s'écrit encore attend celui-ci (verrous consultatifs pris dans un ordre fixe) et rend la même réponse.", "Pas de fusion silencieuse : un doublon ou une occurrence déjà servie rend 409.", "La date propre du geste, avec fuseau, juge la portée d'un remplaçant et la saisie différée."]}, {"type": "h", "texte": "Saisie différée"}, {"type": "p", "texte": "Au-delà de 120 minutes entre réalisation et saisie (seuil provisoire, D-04), l'acte est marqué différé, un motif est exigé et une validation au poste fixe par un autre infirmier est due."}, {"type": "h", "texte": "Côté terminal"}, {"type": "liste", "items": ["Onglet Envois : « À corriger » d'abord, puis l'attente ; corriger et renvoyer, ou abandonner.", "Brouillon local enregistré à chaque appui, effacé à la signature ; brouillon partagé versionné pour les sous-fiches de la fiche 24.", "Le changement d'intervenant est refusé tant que la file, les photos ou les brouillons ne sont pas vides.", "Révocation : précharge, brouillons et jetons effacés ; une file non vide reste chiffrée, à envoyer après un nouvel enrôlement ou à effacer sur confirmation."]}, {"type": "p", "texte": "Le cabinet suit la dernière synchronisation de chaque terminal (« GET /synchronisations ») : un terminal silencieux pendant une tournée en cours remonte à « À traiter » au-delà d'un seuil réglable, 120 minutes par défaut (règle provisoire)."}]}, {"id": "tech-tests-ci", "titre": "Tests et intégration continue", "resume": "Une commande vérifie tout le dépôt sur une base jetable ; un crochet la lance avant chaque envoi ; deux définitions de CI sont prêtes.", "mots_cles": ["tests", "pytest", "vitest", "flutter test", "verifier_tout", "CI", "GitHub Actions", "GitLab", "pre-push", "horloge"], "blocs": [{"type": "h", "texte": "Tout vérifier"}, {"type": "code", "langage": "bash", "texte": "docker compose up -d db\npowershell -File scripts/verifier_tout.ps1                # tout\npowershell -File scripts/verifier_tout.ps1 -Rapide        # parties changées depuis main\npowershell -File scripts/verifier_tout.ps1 -Integration   # + terminal contre une API temporaire\nbash scripts/verifier_tout.sh [--rapide] [--integration]  # jumeau POSIX"}, {"type": "etapes", "items": ["Crée une base jetable dans le conteneur, supprimée à la fin même après un échec.", "Passe les migrations à neuf, défait puis rejoue la dernière, exige une seule tête.", "Lance les tests du serveur avec couverture, puis les rejoue avec l'horloge recalée à 0 h 30 (garde de l'horloge).", "Poste fixe : types, analyse, tests et couverture, construction.", "Terminal : analyse, tests et couverture, construction web.", "Finit par un tableau en français et sort en code 1 au moindre échec."]}, {"type": "h", "texte": "Par partie"}, {"type": "code", "langage": "bash", "texte": "cd backend && uv run pytest -n auto\ncd web && npx vitest run && npx tsc -b\ncd mobile && flutter analyze && flutter test\nTABSANTE_API=http://127.0.0.1:8010 flutter test --concurrency=1 test/integration"}, {"type": "table", "entetes": ["Suite", "Fichiers", "Cas repérés"], "lignes": [["Serveur (backend/tests)", "166", "1 476 fonctions de test"], ["Poste fixe (web/src/test)", "62", "550 cas"], ["Terminal, unitaires et widgets", "72", "872 cas"], ["Terminal, intégration contre une vraie API", "27", "51 cas"]]}, {"type": "note", "ton": "info", "texte": "Ces nombres sont un décompte des déclarations de test dans les fichiers au commit étudié, pas un résultat d'exécution : les tests paramétrés comptent une fois."}, {"type": "h", "texte": "Garde-fous notables"}, {"type": "liste", "items": ["Garde de l'horloge : aucune lecture directe de l'heure hors de « app/horloge.py » (quelques exceptions nommées).", "Libellés sans codes : aucun identifiant du cahier des charges dans ce que lit l'utilisateur.", "Formes des lectures : instantané des clés et types des lectures lourdes ; changement voulu par TABSANTE_FORMES_REECRIRE=1.", "Performance : plafond de requêtes SQL par lecture et par synchronisation.", "Contrats des ports : écrits pour tourner tels quels contre les adaptateurs réels.", "Routes de lecture : chacune tracée au journal des accès ou exemptée avec sa raison.", "Journal d'audit minimal : aucune copie clinique."]}, {"type": "h", "texte": "Crochet et CI"}, {"type": "liste", "items": ["« scripts/installer_hooks.ps1 » pose un crochet pre-push qui lance la vérification rapide avant chaque envoi.", "« .github/workflows/ci.yml » et « .gitlab-ci.yml » : trois travaux (serveur avec PostgreSQL 17, poste fixe avec Node 24, terminal avec Flutter 3.47.6) et un passage nocturne avec l'horloge à 0 h 30.", "Où héberger le code et l'exécuteur reste à décider."]}]}, {"id": "tech-performance", "titre": "Performance et garde-fous", "resume": "Cibles proposées, volume de référence et garde-fous qui empêchent une requête SQL par patient de revenir.", "mots_cles": ["performance", "NFR-08", "requêtes", "N+1", "mesure", "test_perf_fumee", "précharge"], "blocs": [{"type": "p", "texte": "Les cibles sont proposées par « docs/exploitation/performance.md » et restent à mesurer sur une machine de recette : les dernières mesures ont été prises sur un poste de développement chargé."}, {"type": "table", "entetes": ["Lecture", "Cible proposée"], "lignes": [["Précharge du terminal", "2 s"], ["Tournée du jour", "500 ms"], ["Tableau de bord", "2 s"], ["/sync de 50 actes", "2 s"], ["Synchronisation d'une tournée avec ~30 photos au retour de la 4G", "60 s"]]}, {"type": "liste", "items": ["Volume de référence : un cabinet fictif de 150 patients et 60 jours de passages (« scripts/semer_volume.py », sur une base dédiée dont le nom contient « perf »), mesuré par « scripts/mesurer_perf.py ».", "Disponibilité proposée : terminal 100 % de la tournée hors connexion ; API 99,5 % de 7 h à 21 h, à porter au contrat d'hébergement.", "Les lectures du journal des accès s'écrivent en une seule requête, quel que soit le nombre de patients rendus."]}, {"type": "h", "texte": "Garde-fous en CI"}, {"type": "liste", "items": ["« tests/test_perf_fumee.py » plafonne le nombre de requêtes SQL de lectures lourdes et d'une synchronisation ; le nombre de requêtes de /sync ne doit pas dépendre de la longueur des passages.", "« tests/test_perf_confirmer.py » tient la reconfirmation des cotations et la liste « à facturer » sans requête par acte.", "Relever un plafond exige une justification dans le commit ; mieux vaut grouper la lecture."]}]}, {"id": "tech-sauvegardes", "titre": "Sauvegardes et restauration", "resume": "Sauvegarde chiffrée de la base et des fichiers, rotation 7/4/12, restauration contrôlée qui relit la chaîne d'audit.", "mots_cles": ["sauvegardes", "restauration", "pg_dump", "chiffrement", "RPO", "RTO", "rotation", "reprise"], "blocs": [{"type": "liste", "items": ["« backend/scripts/sauvegarde.py » : dump PostgreSQL et archive des fichiers déjà chiffrés, chaque partie chiffrée en AES-256-GCM, manifeste d'empreintes SHA-256.", "Clé de sauvegarde générée une fois, gardée hors du serveur par deux personnes au moins ; sans elle, aucune restauration.", "Le trousseau du stockage (ou le KMS) se garde aussi hors du serveur : sans lui, les fichiers restaurés sont illisibles.", "Rotation 7,4,12 : la plus récente de chacun des 7 derniers jours, 4 dernières semaines et 12 derniers mois.", "Objectifs proposés : RPO 24 heures, RTO 4 heures."]}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/sauvegarde.py --nouvelle-cle      # une seule fois\nuv run python scripts/sauvegarde.py                     # chaque nuit, avant la tâche de nuit\nuv run python scripts/restauration.py {dossier} --verifier   # contrôle sans rien écrire"}, {"type": "etapes", "items": ["Contrôler la copie (aussi la copie hors site, chaque semaine).", "Restaurer dans une base vide et un dossier vide ; la chaîne d'audit restaurée est relue entièrement.", "Recréer le rôle applicatif (« scripts/roles_db.py »), puis lancer la tâche de nuit."]}, {"type": "p", "texte": "Un exercice de reprise sur deux sites est simulé par « scripts/exercice_multisite.py » ; il ne prouve ni la latence entre deux sites réels, ni la réplication en flux, ni celle du KMS."}, {"type": "note", "ton": "attention", "texte": "Non éprouvé à ce jour : la restauration sur un autre hôte et depuis une copie hors site réelle."}]}, {"id": "tech-retention", "titre": "Rétention et tâche de nuit", "resume": "Ce que la tâche de nuit purge, signale ou conserve, avec des durées provisoires à valider par le DPO.", "mots_cles": ["rétention", "conservation", "purge", "D-06", "tâche de nuit", "RGPD", "dossier au terme"], "blocs": [{"type": "table", "entetes": ["Donnée", "Durée provisoire", "Action"], "lignes": [["Journal des accès", "365 jours (jamais moins de 180)", "Purge"], ["Sessions closes et jetons", "365 jours", "Purge"], ["Réponses gardées pour une clé d'idempotence", "24 heures", "Purge"], ["Travaux de l'agent de poste terminés", "30 jours", "Purge"], ["Fichiers qu'aucune ligne ne cite", "30 jours", "Purge"], ["Position approximative d'un soignant en route", "Jusqu'à l'arrivée, 12 heures au plus", "Effacement"], ["Accès au domicile et photo de l'entrée", "Durée de la prise en charge", "Conservation"], ["Dossier de soins", "20 ans après le dernier passage, pas avant les 28 ans du patient", "Signalement seulement, jamais de suppression automatique"], ["Journal d'audit et ancres", "Durée du plus long dossier qu'il prouve", "Conservation"], ["Facturation", "10 ans au moins", "Conservation"], ["Base locale du terminal", "Jusqu'à la remontée", "Effacée à la révocation du terminal"]]}, {"type": "h", "texte": "La tâche de nuit"}, {"type": "code", "langage": "bash", "texte": "cd backend && uv run python -m app.taches     # chaque nuit, connectée en propriétaire\ncd backend && uv run python -m app.retention --essai   # à blanc, avant de changer une durée"}, {"type": "liste", "items": ["Relit la chaîne d'audit et ses ancres, puis la chaîne des accès.", "Applique la table de rétention et compte les dossiers au terme.", "Recopie la tête du journal des accès dans la chaîne d'audit et ancre celle-ci hors de la base.", "Notifie les rappels datés du jour et efface les positions périmées.", "Une ligne JSON en sortie ; code 0 conforme, 1 chaîne rompue ou ancre divergente (les purges sont alors suspendues), 2 dépôt en échec."]}, {"type": "h", "texte": "Supprimer un dossier au terme"}, {"type": "p", "texte": "Jamais automatique : après décision du DPO, export FHIR complet du dossier, puis suppression par le propriétaire du schéma avec « python -m app.retention --supprimer », d'abord à blanc. Le script refuse un dossier qui n'est pas au terme, une décision absente ou une archive qui ne correspond pas. L'entrée « dossier_supprime » s'inscrit à la chaîne d'audit, sans contenu."}, {"type": "note", "ton": "info", "texte": "Toutes ces durées sont provisoires (décision D-06) et toutes les références juridiques restent à valider par le DPO."}]}, {"id": "tech-mise-en-service", "titre": "Hébergement HDS et mise en service", "resume": "Ce que l'API refuse au démarrage en configuration de service, ce qui est fermé tant que les adaptateurs réels manquent, et la liste de contrôle du premier démarrage.", "mots_cles": ["mise en service", "production", "HDS", "hébergement", "démarrage", "configuration de service", "KMS", "liste de contrôle"], "blocs": [{"type": "note", "ton": "attention", "texte": "À réaliser avant production : aucun hébergeur certifié HDS n'est retenu, aucun DPO n'est désigné, la connexion par carte CPS n'est pas raccordée, le KMS de l'hébergeur n'est pas branché. Aucune donnée réelle ne doit entrer dans la plateforme avant."}, {"type": "h", "texte": "Deux configurations, jamais mélangées"}, {"type": "table", "entetes": ["", "Développement et démonstration", "Service"], "lignes": [["Variables", "TABSANTE_DEV_AUTH=true", "DEV_AUTH absent, TABSANTE_ENV=production recommandé"], ["Routes /dev, /simulation, échanges simulés", "Montées", "Non montées (404)"], ["Services simulés", "Répondent avec des données fictives", "Refusent (409 « service non raccordé »), rien n'est écrit"], ["Documentation /docs", "Publiée", "Fermée"], ["CORS", "Origines locales", "https seulement"]]}, {"type": "h", "texte": "Ce que le démarrage en service refuse"}, {"type": "etapes", "items": ["Le mode démonstration posé.", "Un secret des jetons absent, court, connu ou de développement.", "Une origine CORS « * » ou non https.", "Le lecteur d'ordonnance factice.", "L'absence de puits d'ancrage hors site.", "Le KMS local simulé : l'adaptateur du KMS ou du HSM de l'hébergeur doit d'abord être branché.", "Puis, au lancement, un rôle SQL trop privilégié."]}, {"type": "h", "texte": "Ce qu'on attend de l'hébergeur"}, {"type": "liste", "items": ["Certificat HDS couvrant les activités utiles ; données et sauvegardes en France, sur deux sites distincts.", "Deux instances de l'API derrière un reverse proxy TLS ; PostgreSQL 17 avec réplique sur le second site et archivage continu ; volume chiffré.", "KMS ou HSM pour les clés maîtresses du stockage ; puits d'ancres en ajout seul hors de la plateforme.", "Tâches planifiées (sauvegarde vers 1 h 30, tâche de nuit vers 2 h 15) et supervision des codes de sortie.", "Les images applicatives restent à produire avec l'hébergeur retenu : aujourd'hui, seule la base est conteneurisée."]}, {"type": "h", "texte": "Liste de contrôle du premier démarrage"}, {"type": "table", "entetes": ["Contrôle", "Preuve"], "lignes": [["DEV_AUTH et MODE_DEMO absents, ENV=production", "/dev/demo et /simulation rendent 404"], ["Secret des jetons aléatoire, hors dépôt", "Le démarrage passe"], ["Origines CORS en https", "Pas d'en-tête CORS pour une origine http"], ["/docs, /redoc, /openapi.json", "404"], ["KMS de l'hébergeur branché", "Le démarrage passe"], ["Rôle SQL applicatif à moindre privilège", "Contrôle au démarrage"], ["Premier titulaire créé, code échangé", "GET /moi répond ; deux entrées d'audit"], ["Journal de l'API", "Avertissement listant les services simulés fermés"], ["En-têtes de sécurité conservés par le proxy", "Vérifiés sur une réponse d'erreur aussi"]]}]}, {"id": "tech-interfaces", "titre": "Interfaces externes : ce qui est réel, ce qui est simulé", "resume": "Pour chaque service externe, le port, l'adaptateur branché et son état ; aucun service national n'est raccordé aujourd'hui.", "mots_cles": ["interfaces", "INSi", "SESAM-Vitale", "DMP", "MSSanté", "Pro Santé Connect", "FHIR", "simulé", "ports"], "blocs": [{"type": "p", "texte": "Chaque interface du cahier des charges a sa fiche dans « docs/exploitation/interfaces » (gabarit du §9). Les doublures ne servent qu'en démonstration ; hors démonstration, elles sont fermées."}, {"type": "table", "entetes": ["Interface", "Adaptateur actuel", "État"], "lignes": [["INSi, ADRi, IDB, carte Vitale", "Adaptateurs factices", "Simulé ; homologation CNDA à obtenir"], ["Carte CPS et connexion", "Keycloak installé (OIDC et PKCE) ; Pro Santé Connect simulé en amont ; cartes de démonstration", "Simulé ; Pro Santé Connect réel (convention ANS) et bibliothèque CPS attendus"], ["Pro Santé Connect (portail externe)", "PscFactice", "Simulé ; refuse toute identité hors développement"], ["SESAM-Vitale (FSE, lots, retours, tiers payant)", "SesamVitaleFactice, en direct ou par l'agent de poste simulé", "Simulé ; composant et agrément attendus (D-07)"], ["DMP", "Bouchon qui journalise", "Simulé ; refus si l'INS n'est pas qualifiée"], ["MSSanté, laboratoire, pharmacie", "Bouchon qui n'envoie rien", "Simulé"], ["Ordonnance numérique", "Aucun port national", "Ordonnance photographiée, lue par OCR local, validée par l'infirmier"], ["Lecture d'ordonnance", "RapidOCR local (extra « ocr »)", "Réel, local, sans réseau"], ["Moteur de cotation NGAP", "MoteurDemo (demo-0.4)", "Doublure, jamais facturable"], ["Référentiels prescriptible et médicaments", "Fichiers de démonstration versionnés", "Démonstration (D-14, D-16)"], ["Vidéo des actes à distance", "Visio simulée, rien ne quitte le poste", "Simulé ; aucun flux conservé"], ["Reprise de dossiers", "Format pivot de démonstration", "Simulé ; formats réels à décider (D-13)"], ["Export FHIR R4", "Lecture seule", "Réel"], ["Géocodage, itinéraire, trafic, météo, position", "Doublures ; sources ouvertes en option", "Simulé par défaut"], ["Contexte France", "Doublures ; sources publiques en option", "Fériés, vacances et circulation servent hors démonstration ; vigilance, pollution et pollens se taisent"]]}, {"type": "h", "texte": "Carte, météo et trafic : réseau en option"}, {"type": "p", "texte": "Par défaut, aucun appel réseau. Avec TABSANTE_CARTE_RESEAU, la météo est demandée pour le centre d'une maille d'environ 10 km, jamais pour un domicile ; le trafic est téléchargé en entier et rapproché sur le serveur ; l'itinéraire réel ne part que vers un moteur OSRM auto-hébergé déclaré, un serveur public étant refusé au démarrage."}, {"type": "note", "ton": "attention", "texte": "Règle absolue : jamais une adresse ni une position de patient vers un tiers non HDS. Les tuiles du fond de carte, demandées par le navigateur, révèlent la zone affichée : un serveur de tuiles du cabinet, de l'hébergeur ou sous contrat est attendu avant production."}, {"type": "h", "texte": "FHIR"}, {"type": "p", "texte": "Lecture seule réelle : « /fhir/Patient/{id} », « $everything » pour la portabilité, Observation, Procedure, DocumentReference, Encounter. Les codes terminologiques sans correspondance validée sont marqués « non validés »."}]}, {"id": "tech-cotation", "titre": "Cotation : port Moteur, doublure et banc", "resume": "La plateforme tient des faits datés, le moteur décide ; aujourd'hui, une doublure de démonstration cote, mesurée par un banc de cas écrits.", "mots_cles": ["cotation", "NGAP", "moteur", "MoteurDemo", "banc de cotation", "CNDA", "FSE", "file de contrôle"], "blocs": [{"type": "note", "ton": "attention", "texte": "Rien de ce que cote la doublure n'est facturable. Hors démonstration, aucune feuille de soins ne se crée tant que la doublure sert."}, {"type": "h", "texte": "Le contrat"}, {"type": "liste", "items": ["Port « Moteur » dans « backend/app/cotation/interface.py » : le moteur cote un passage entier (même patient, jour, moment, intervenant et séance) et rend des lignes explicites (statut, taux, quantité, nature, règles appliquées).", "Seules les lignes « retenue » et « taux réduit » sont facturées ; les autres disent pourquoi.", "Chaque cotation garde la version du moteur, du référentiel de règles et des tarifs.", "Le serveur fournit au terminal la clé de cotation hors connexion et ce qui est facturable : rien n'est recopié côté client.", "Ce que les fiches disent « tracé, pas transmis » ne part jamais au moteur."]}, {"type": "h", "texte": "La doublure"}, {"type": "p", "texte": "« MoteurDemo » (version demo-0.4) reproduit une partie de la NGAP pour la démonstration et les tests : cumul de l'article 11 B, majorations une fois par passage, nuit de 20 h à 6 h seulement sur horaire prescrit, dimanches et jours fériés calculés sans réseau, déplacements selon une règle provisoire, forfaits sous BSI, tarifs datés. Le moteur réel de TABSANTE se branchera derrière le même port."}, {"type": "h", "texte": "Du soin à la télétransmission"}, {"type": "etapes", "items": ["Le serveur cote à la réception de l'acte signé.", "Reconfirmation : le moteur rejoue le passage ; un résultat identique est confirmé, un écart va en file de contrôle.", "File de contrôle : confirmer ou écarter avec un motif, sous 7 jours (réglage provisoire, D-05).", "FSE créée par l'infirmier qui a réalisé les actes, sécurisée par les cartes, mise en lot après contrôle de cohérence.", "Télétransmission et retours, simulés en démonstration."]}, {"type": "h", "texte": "Le banc de cotation"}, {"type": "code", "langage": "bash", "texte": "cd backend && uv run python -m scripts.banc_cotation"}, {"type": "p", "texte": "Il rejoue des recueils de cas écrits contre le moteur branché, sans base ni réseau, et classe chaque cas : conforme au centime, écart, bloqué ou divergence documentée. Dernier passage documenté (16 octobre 2026, demo-0.4)."}, {"type": "table", "entetes": ["Recueil", "Cas", "Conformes", "Écarts", "Bloqués", "Divergences documentées"], "lignes": [["Cahier CNDA « Cas de facturation infirmiers »", "44", "19", "0", "18", "7"], ["Cas écrits depuis le texte de la NGAP", "26", "23", "0", "0", "3"], ["Oracle du titre XVI", "120", "113", "0", "7", "0"]]}, {"type": "p", "texte": "« tests/test_banc_cotation.py » échoue dès qu'un cas conforme régresse. C'est un banc d'essai de la doublure, jamais un agrément : l'agrément CNDA reste à obtenir."}]}, {"id": "tech-reprise-dossiers", "titre": "Reprise de dossiers d'un autre logiciel", "resume": "Import en deux temps, aperçu à blanc puis reprise rejouable, au format pivot de démonstration ou depuis l'export de l'ancienne application.", "mots_cles": ["reprise", "import", "migration", "format pivot", "HAB-04", "aperçu à blanc", "INSi"], "blocs": [{"type": "p", "texte": "Paramètres, puis Reprise de dossiers, avec le droit d'importer (HAB-04 : titulaire, responsable, administration). Routes : « GET /reprise/format », « POST /reprise/apercu », « POST /reprise »."}, {"type": "etapes", "items": ["Sauvegarder la plateforme juste avant : c'est le retour arrière.", "Déposer le fichier : format pivot de démonstration (JSON complet, ou CSV des seules identités), ou export de l'ancienne application, converti au format pivot.", "Lancer l'aperçu à blanc : chaque dossier est lu, ses erreurs dites en clair, ses ressemblances avec un patient existant signalées ; rien n'est écrit.", "Reprendre le même fichier : tout s'écrit en une transaction, journalisée ; un fichier modifié depuis l'aperçu est refusé (409).", "Ensuite : qualifier les identités par l'INSi et trancher les rapprochements proposés ; pour une reprise depuis l'ancienne application, enrôler aussi chaque intervenant (aucun mot de passe ni habilitation n'est repris)."]}, {"type": "liste", "items": ["Les identités reprises restent provisoires jusqu'à leur qualification ; chaque donnée porte la provenance « import ».", "Un dossier déjà repris (même logiciel, même référence) ne se recrée pas : la reprise est rejouable.", "L'historique repris est rangé en document, jamais rejoué comme des actes signés.", "Les formats d'export des autres logiciels du marché ne sont pas arrêtés (décision D-13)."]}, {"type": "note", "ton": "attention", "texte": "Un fichier d'export contient des données de santé : il se garde chiffré sur le poste de la reprise et s'efface une fois la reprise vérifiée."}]}, {"id": "tech-site-public", "titre": "Site public", "resume": "Un site de présentation statique, séparé de l'application, qui ne reçoit aucune donnée de santé et ne promet rien qui ne soit vrai.", "mots_cles": ["site public", "Astro", "statique", "mentions légales", "noindex", "verifier:production"], "blocs": [{"type": "liste", "items": ["Dossier « site » : Astro, HTML et CSS seulement, aucun script exécutable.", "Pages : accueil, fonctionnalités, sécurité (construit, simulé, à réaliser), tarifs « Sur demande », demande (liste d'attente), FAQ, pages légales.", "Aucune promesse de certification HDS, d'agrément CNDA, de compatibilité SESAM-Vitale ni de prix.", "18 informations légales et commerciales restent à compléter (« site/src/lib/legal.ts ») : tant qu'il en reste une, chaque page porte « Version de travail », passe en noindex, et la vérification de production échoue."]}, {"type": "code", "langage": "bash", "texte": "cd site\nnpm ci\nnpm run dev                     # http://localhost:4321\nnpm run ci                      # vérifications, tests, build, budgets\nnpm run verifier:production     # échoue tant qu'un champ légal manque"}]}]}, {"id": "cdc", "titre": "Couverture du CDC et décisions", "public": "tous", "pages": [{"id": "cdc-chiffres", "titre": "La couverture en chiffres", "resume": "Recompte du 22 octobre 2026, après les lots L18 et Finitions : 561 éléments, dont 411 faits et testés, aucun absent.", "mots_cles": ["couverture", "CDC", "matrice", "L17", "561", "chiffres", "recompte"], "blocs": [{"type": "p", "texte": "Le cahier des charges V2 (CDC) définit 303 exigences numérotées. La matrice de couverture y ajoute les principes, le périmètre, les acteurs, les lignes d'habilitation, le modèle de données, les cycles de vie, le hors connexion, les interfaces, la sécurité, le terminal, le non fonctionnel, les décisions et l'annexe Ségur : 561 éléments au recompte du lot L17."}, {"type": "table", "entetes": ["Périmètre", "Fait", "Partiel", "Simulé", "Bloqué", "Absent", "Total"], "lignes": [["Exigences EX-*", "240", "1", "61", "1", "0", "303"], ["Autres éléments du CDC", "171", "8", "76", "3", "0", "258"], ["Matrice complète", "411", "9", "137", "4", "0", "561"], ["Règles de gestion des fiches 1 à 23", "494", "1", "33", "0", "0", "528"], ["Composants communs C1 à C25", "22", "2", "1", "0", "0", "25"], ["Écrans du terminal", "11", "0", "4", "0", "0", "15"], ["Écrans du poste fixe", "20", "0", "3", "0", "0", "23"]]}, {"type": "p", "texte": "Sur les 15 mesures de l'avenant 11 suivies : 10 faites, 2 simulées, 2 relevant du moteur seul, 1 à confirmer. 20 des 21 fiches de soin sont faites sur le serveur, le poste fixe et le terminal ; la fiche Nursing reste partielle au serveur (signature d'une aide-soignante hors structure, Q-30)."}, {"type": "h", "texte": "Comment ces chiffres ont évolué"}, {"type": "table", "entetes": ["Périmètre", "15 octobre (ff74608)", "Lots L1 à L16 et L19", "Lot L17", "L18 et Finitions"], "lignes": [["Matrice (fait, partiel, simulé, bloqué, absent)", "333, 8, 188, 4, 0 sur 533", "347, 10, 188, 4, 0 sur 549", "407, 14, 136, 4, 0 sur 561", "411, 9, 137, 4, 0 sur 561"], ["Règles des fiches", "445, 2, 59, 0, 0 sur 506 lignes", "460, 1, 56, 0, 0 sur 517", "494, 1, 32, 1, 0 sur 528", "494, 1, 33, 0, 0 sur 528"], ["Composants C1 à C25", "21, 2, 2", "21, 2, 2", "22, 2, 1", "22, 2, 1"]]}, {"type": "p", "texte": "Le lot L17 a surtout fait passer du Simulé au Fait des éléments dont la part de la plateforme était déjà faite et testée : seul le service tiers, ou la doublure du moteur, restait simulé. Les lots L1 à L16 et L19 ont ajouté 16 éléments et 11 règles."}, {"type": "h", "texte": "Ce qui reste bloqué"}, {"type": "liste", "items": ["Désignation du délégué à la protection des données (DPO), avant production.", "Hébergeur certifié HDS, non contractualisé.", "Autonomie de 10 heures du terminal, à éprouver sur le matériel cible.", "Phasage des livraisons (D-09), tenu par les lots internes."]}, {"type": "h", "texte": "Ce qui reste partiel"}, {"type": "p", "texte": "Dans la matrice : la sécurité, le terminal et le non fonctionnel qui attendent matériel, DPO, hébergeur ou FHIR d'échange, la carte CPS réelle par Pro Santé Connect, l'outil de publication des référentiels (Q-33), deux lignes de journalisation et de préchargement ; côté fiches, la règle Nursing liée à Q-30 ; côté composants, le codage terminologique C16 (validation par TABSANTE) et la charte de couleurs C17 (Q-91)."}, {"type": "code", "langage": "bash", "texte": "python scripts/recompter_matrice.py              # comptes du §1.1\npython scripts/recompter_matrice.py --modules    # par module\npython scripts/recompter_matrice.py --lignes Partiel"}, {"type": "note", "ton": "info", "texte": "Source : « docs/couverture_cdc.md » §1, au commit de main qui fusionne le lot L17."}]}, {"id": "cdc-lire-matrice", "titre": "Comment lire la matrice de couverture", "resume": "Les statuts, la règle de prudence, la part de la plateforme, et où trouver chaque élément.", "mots_cles": ["matrice", "statuts", "légende", "preuve", "part de la plateforme", "lecture"], "blocs": [{"type": "p", "texte": "La matrice « docs/couverture_cdc.md » liste chaque élément du CDC sur une ligne : son identifiant, son texte, son statut dans le CDC (tranché, à préciser, à décider), son statut de réalisation, les clients concernés et la preuve ou le manque."}, {"type": "table", "entetes": ["Statut", "Sens"], "lignes": [["Fait", "Implémenté et couvert par au moins un test automatisé"], ["Partiel", "Une partie existe ; le manque est écrit sur la ligne"], ["Simulé", "Une doublure de démonstration tient la place : à remplacer, jamais à facturer"], ["Bloqué", "Dépend d'un tiers (SESAM-Vitale, moteur NGAP, INSi, PSC, DMP, MSSanté, HDS, matériel, licences, avis de la HAS) ou d'une décision"], ["Absent", "Rien dans le code, rien n'empêche de le construire"]]}, {"type": "h", "texte": "Règle de prudence"}, {"type": "p", "texte": "Une exigence que le serveur tient et teste mais qu'aucun écran ne permet d'utiliser est Partielle : le soignant ne peut pas s'en servir. Un chemin complet qui repose sur un adaptateur simulé est Simulé, pas Fait."}, {"type": "h", "texte": "La part de la plateforme (depuis le lot L17)"}, {"type": "liste", "items": ["Une exigence qui confie la décision au moteur et demande seulement à la fiche de tracer et transmettre des faits est Faite quand cette part est codée et testée, même si la doublure rend la décision. Une exigence qui énonce elle-même la cotation reste Simulée tant que la doublure la tient.", "Un document produit, signé, immuable et versé au registre est Fait quand seul son acheminement (MSSanté, DMP) est simulé.", "Un droit ou une règle de facturation codés et testés par la plateforme sont Faits même si le service qu'ils gardent (FSE, INSi, PSC) est simulé."]}, {"type": "h", "texte": "Se repérer dans le document"}, {"type": "table", "entetes": ["Section", "Contenu"], "lignes": [["§1", "Synthèse, comptes, évolution, par module, et entrées de chaque lot"], ["§2", "Matrice complète (exigences EX-* et autres éléments)"], ["§3", "Fiches de soin : état par client, règles de gestion fiche par fiche"], ["§4 et §5", "Composants communs C1 à C25 ; écrans du terminal et du poste fixe"], ["§6", "Lots de livraison"], ["§7", "Dépendances externes et questions ouvertes au fondateur (§7.1)"], ["§8", "Non-conformités relevées pendant les audits"], ["§9", "Avenant 11 : ce que la plateforme doit tenir"]]}, {"type": "note", "ton": "info", "texte": "Les codes du CDC (EX-…, RG-nn, D-nn) ne s'affichent jamais dans l'application : ils vivent dans la matrice, les commentaires du code et le champ technique « regle » des refus."}]}, {"id": "cdc-decisions-cdc", "titre": "Décisions du CDC (D-01 à D-21)", "resume": "Les vingt décisions laissées ouvertes par le CDC, chacune en une ligne avec ce que le code fait en attendant.", "mots_cles": ["décisions", "D-01", "D-21", "registre", "provisoire"], "blocs": [{"type": "p", "texte": "En attendant chaque décision, le code applique une valeur ou un comportement prudent, remplaçable sans migration de données. Le détail est dans un document séparé."}, {"type": "table", "entetes": ["Décision", "Sujet", "État", "En attendant"], "lignes": [["D-01", "Recalage des fréquences espacées après un passage tardif ou manqué", "Simulé", "Grille d'origine par défaut, réglable par soin"], ["D-02", "Authentification et signature de l'aide-soignante", "Simulé", "Signature par la session, sans carte"], ["D-03", "Licence NANDA-I", "Simulé", "Sous-ensemble de démonstration, licence à acquérir"], ["D-04", "Délai maximal de la saisie différée", "Simulé", "120 minutes"], ["D-05", "File de contrôle : qui arbitre, sous quel délai", "Simulé", "Règles par défaut réglables par cabinet, 7 jours"], ["D-06", "Durées de conservation", "Simulé", "Durées provisoires, à valider par le DPO"], ["D-07", "Composant SESAM-Vitale et son périmètre", "Simulé", "Adaptateur simulé, agent de poste simulé"], ["D-08", "Qui requalifie une transmission", "Simulé", "L'infirmier toujours ; réglage du cabinet qui ne peut que restreindre"], ["D-09", "Phasage des livraisons", "Bloqué", "Les lots internes en tiennent lieu"], ["D-10", "Remplaçant : portée et facturation de ses actes", "Simulé", "Portée bornée ; le remplaçant ne sécurise pas de FSE"], ["D-11", "Passage imprévu sans prescription", "Simulé", "Cotation « à régulariser », non facturable"], ["D-12", "Forme FHIR d'un objet suivi", "Simulé", "Représentation provisoire étiquetée"], ["D-13", "Formats de reprise de dossiers", "Simulé", "Format pivot de démonstration"], ["D-14", "Référentiel de ce que l'infirmier peut prescrire", "Simulé", "Référentiel de démonstration"], ["D-16", "Référentiel des médicaments", "Simulé", "Référentiel de démonstration aux codes fictifs"], ["D-17", "Pansement d'un cathéter neuraxial", "Simulé", "Tracé, non coté ; avis d'une caisse attendu"], ["D-18", "Valorisation en HAD", "Simulé", "Régime HAD transmis, relevé HAD"], ["D-19", "NANDA-I en V2, NOC préparé, NIC non prévu", "Fait", "Tranchée le 5 octobre 2026"], ["D-20", "Condition « déjà pris en charge » de la CIA", "Simulé", "Codée, désactivée en attendant le texte"], ["D-21", "Support de la fiche de suivi RAAC", "Simulé", "Fiche de l'établissement par défaut"]]}, {"type": "note", "ton": "info", "texte": "Il n'existe pas de décision D-15."}]}, {"id": "cdc-questions-ouvertes", "titre": "Questions ouvertes au fondateur", "resume": "Les questions nées du code (Q-nn) encore à trancher, chacune en une ligne.", "mots_cles": ["questions ouvertes", "Q-nn", "fondateur", "TABSANTE", "décisions"], "blocs": [{"type": "p", "texte": "Le code a fait apparaître des décisions en plus de celles du CDC. Le lot L17 a nettoyé ce registre en place, sans renuméroter : doublons d'une décision D-nn, doublons internes, questions closes ou tranchées par le texte. Restent ouvertes les questions ci-dessous ; pour chacune, une valeur prudente est branchée en attendant."}, {"type": "table", "entetes": ["Question", "Sujet"], "lignes": [["Q-01", "Accord préalable : le silence de la caisse vaut-il accord, et après quel délai"], ["Q-04", "Définition d'un passage pour la cotation (écart entre deux passages, même adresse)"], ["Q-08", "Indemnités de déplacement : prescription, lieu du soin, source des distances et des zones"], ["Q-15", "Plafonds du cycleur de dialyse et période de surveillance"], ["Q-16", "Référence des courbes de croissance de l'enfant (licence)"], ["Q-17", "Trame du bilan de prévention : thèmes, questions et tranches"], ["Q-18", "Texte libre d'un thème gardé au dossier qui sortirait dans la version partagée"], ["Q-20", "Liste des affections de longue durée et sa mise à jour"], ["Q-24", "Référentiel des dialysats et son responsable"], ["Q-27", "Écart durable entre passages prévus au BSI et servis"], ["Q-28", "Heures prises au lit pendant un prélèvement : fenêtre admise"], ["Q-31", "Rendez-vous à l'agenda : qui les prend"], ["Q-33", "Outil de TABSANTE pour publier les référentiels et les motifs"], ["Q-34", "Relance d'une demande de renouvellement d'ordonnance"], ["Q-35", "Lien de dépôt adressé au patient pour son renouvellement"], ["Q-39", "Fond de carte, géocodage, itinéraire, météo et trafic en production"], ["Q-44", "Montrer ou non à l'équipe la durée de soin de chaque collègue"], ["Q-46", "Motifs, saisie et validation des indisponibilités"], ["Q-49", "Fenêtre d'une heure prescrite et poids d'une heure fixe"], ["Q-50", "Journée de référence pour le remplissage"], ["Q-51", "Validation obligatoire ou non de la tournée du lendemain"], ["Q-52", "Zone d'intervention : cercle, communes ou secteurs"], ["Q-63", "BPCO : le stade I est-il exclu de l'art. 5 ter"], ["Q-65", "Qui retire la responsabilité ou l'administration du cabinet"], ["Q-66", "Puits d'ancrage hors site de la chaîne d'audit"], ["Q-68", "Recherche hors connexion au terminal : tracer chaque consultation (avis du DPO)"], ["Q-69", "Contenu et validation du référentiel des prérequis de passage"], ["Q-71", "Seuil de l'alerte « terminal non synchronisé »"], ["Q-72", "Séance liée à la dépendance : AMX d'une injection à 50 %"], ["Q-73", "Pansement lourd et complexe : critères transmis"], ["Q-74", "Ablation de fils ou d'agrafes et pansement de la même plaie"], ["Q-78", "Traceurs de la feuille de soins"], ["Q-81", "Ordre et compteurs de « À traiter »"], ["Q-82", "Qualification de l'INS : pièce d'identité contrôlée"], ["Q-83", "Ordonnance lue au nom d'un autre patient : dérogation motivée ou non"], ["Q-84", "Ordonnance échue à la validation : refus ou avertissement"], ["Q-85", "Ce que lit l'administrateur non soignant"], ["Q-86", "Cotation et suites d'un acte réalisé partiellement"], ["Q-87", "Délai d'alerte d'une interpellation non lue"], ["Q-88", "Limites de la transmission ciblée de l'aide-soignante"], ["Q-89", "Qui est notifié d'un dépôt de document"], ["Q-90", "Pulvérisation de médicaments : fiche 19 ou fiche 6"], ["Q-91", "Charte de couleurs"], ["Q-92", "Événement critique depuis une fiche"], ["Q-93", "Plan de soins au terminal : l'ouvrir ou non à l'aide-soignante"], ["Q-94", "Écart horaire calculé au serveur ou au terminal"], ["Q-95", "Forme du commentaire de ligne"], ["Q-96", "Vues zoomées du schéma corporel, filtre, photo de l'anticoagulant"], ["Q-97", "Une fréquence pour un ou plusieurs objets suivis"], ["Q-98", "Voie inhalée dans la fiche 6"], ["Q-99", "Keycloak authentifie, TabSanté garde sa propre session"], ["Q-100", "Reconnaître l'intervenant par son compte rattaché, sinon par son RPPS"], ["Q-101", "Rôle donné à un compte créé par Pro Santé Connect"], ["Q-105", "Le terminal ne précharge que la tournée du jour"], ["Q-106", "Rétention de la base locale du terminal"], ["Q-107", "Français seul en V2"]]}, {"type": "p", "texte": "Gardent aussi une question résiduelle, après avoir été tranchées en partie par le texte : Q-03, Q-13, Q-25, Q-26, Q-29, Q-30, Q-61 et Q-80."}, {"type": "note", "ton": "info", "texte": "Le détail de chaque question (éléments concernés, valeur branchée, ce qu'il reste à trancher) figure au §7.1 de « docs/couverture_cdc.md » et dans le document des décisions."}, {"type": "note", "ton": "info", "texte": "Toutes les questions ouvertes, avec leur contexte, leurs options et ce que fait l'application en attendant, sont réunies dans le document « Questions ouvertes TabSanté », à remplir par le fondateur et l'équipe soignante."}]}]}, {"id": "nouveautes", "titre": "Nouveautés", "public": "tous", "pages": [{"id": "nouveautes-octobre", "titre": "Les lots de correction d'octobre 2026", "resume": "L'audit de couverture du 16 octobre a ouvert 19 lots de correction ; tous sont livrés au 22 octobre.", "mots_cles": ["nouveautés", "audit", "16 octobre", "lots", "L1", "L19"], "blocs": [{"type": "p", "texte": "Le 16 octobre 2026, un audit a relu la couverture du CDC contre le code et proposé 19 lots de correction, découpés par zone. Les 19 lots ont été livrés les 21 et 22 octobre, suivis d'un lot de finitions et d'une refonte de l'interface des deux applications."}, {"type": "table", "entetes": ["Lot", "Ce qui change pour vous"], "lignes": [["L1", "Transmissions : l'aide-soignante écrit une ciblée, interpellations et notifications au terminal"], ["L2", "Cotation : ce qui est « tracé, pas transmis » ne part plus au moteur, une seule nuit"], ["L3", "Perfusions IV et sous-cutanées"], ["L4", "Pansements, stomies, pose des dispositifs"], ["L5", "Bilans par objet suivi, prescription infirmière"], ["L6", "Ordonnances, fréquences, attribution, écart horaire, acte partiel"], ["L7", "Médicaments et bloc AVK, anticoagulant, nursing"], ["L8", "Nutrition entérale, diabète, uro-génito-digestif"], ["L9", "PCA et pousse-seringue"], ["L10", "Constantes (épreuve de lever, oxygène) et neuropsychiatrie"], ["L11", "Dialyse péritonéale et analgésie locorégionale"], ["L12", "Injections, prélèvements, saignées"], ["L13", "Tableau de bord du cabinet"], ["L14", "Décès du patient, téléservices d'office, HAD"], ["L15", "Terminal : écart horaire, plan de soins, commentaires, schéma corporel"], ["L16", "Consultations et bilans de la fiche 24"], ["L17", "Couverture recomptée et décisions nettoyées"], ["L18", "Connexion par Keycloak, au poste fixe et au terminal"], ["L19", "Listes codées dans un référentiel daté"], ["Finitions", "Bloc AVK, ordonnance PDF hors connexion, code de service, accessibilité"], ["Interface", "Poste fixe et terminal revus, aide « ? » sur chaque écran"]]}, {"type": "note", "ton": "info", "texte": "Chaque lot a été livré avec ses tests, écrits pour échouer avant la correction et passer après."}]}, {"id": "nouveautes-l1", "titre": "L1 — Transmissions et coordination", "resume": "L'aide-soignante écrit une transmission ciblée ; interpellations et notifications se traitent au terminal.", "mots_cles": ["transmission ciblée", "aide-soignante", "interpellation", "notification proposée", "HAD", "dépôt de document"], "blocs": [{"type": "liste", "items": ["L'aide-soignante peut écrire une transmission ciblée de ce qu'elle constate, au poste fixe et au terminal. Elle ne peut ni écrire un entretien infirmier, ni traiter une interpellation, ni requalifier une transmission.", "Au terminal, une notification proposée (avis au médecin) se valide ou s'écarte, et une interpellation se lit et se traite.", "Au poste fixe, un acte à distance sur une plaie se crée directement.", "Les coordinateurs de l'HAD sont pré-cochés comme destinataires pendant un séjour.", "Une interpellation non lue déclenche une alerte après quatre heures (valeur à confirmer, Q-87).", "Tout dépôt de document avise les soignants (Q-89).", "Seul un rendez-vous planifié peut être annulé."]}]}, {"id": "nouveautes-l2", "titre": "L2 — Cotation : ce qui part au moteur", "resume": "Les données « tracées, non transmises » restent au dossier ; une seule plage de nuit, 20 h à 6 h.", "mots_cles": ["cotation", "moteur", "majoration de nuit", "horaire prescrit", "facturable"], "blocs": [{"type": "liste", "items": ["Ce que les fiches Médicaments, Diabète et Anticoagulant disent « tracé, pas transmis » (dose, site, résultats, valeur de la glycémie) ne part plus au moteur de cotation, et sa correction ne relance pas la cotation.", "Le serveur fournit lui-même, ligne par ligne, ce qui est facturable et la clé de cotation hors connexion : terminal et poste fixe ne recopient plus la règle.", "Plus de majoration de nuit sans horaire prescrit, pansement compris.", "Une seule plage de nuit pour toute l'application : 20 h à 6 h."]}, {"type": "note", "ton": "info", "texte": "La cotation reste celle de la doublure de démonstration : jamais facturable."}]}, {"id": "nouveautes-l3", "titre": "L3 — Perfusions IV et sous-cutanées", "resume": "Ligne sous-cutanée laissée posée sans alerte, retrait du site qui dépose ses lignes, compteurs de la perfusion.", "mots_cles": ["perfusion", "IV", "sous-cutanée", "fiche 4", "fiche 5"], "blocs": [{"type": "liste", "items": ["Une ligne sous-cutanée laissée posée ne déclenche plus de notification à tort.", "Retirer un site sous-cutané dépose ses lignes.", "Le terminal envoie les consommables et les motifs.", "Les compteurs de la fiche Perfusion IV sont tenus ; un palier sans débit est refusé ; le poids est lu des constantes."]}]}, {"id": "nouveautes-l4", "titre": "L4 — Pansements, stomies et pose des dispositifs", "resume": "Clôture de stomie avec transmission proposée, consommation d'appareillage, lot et péremption lus sur le code produit.", "mots_cles": ["stomie", "pansement", "plaie", "dispositif", "VVP", "code produit", "fils", "agrafes"], "blocs": [{"type": "liste", "items": ["À la clôture d'une stomie, une transmission ciblée est proposée au même écran, destinataires pré-cochés (prescripteur, urologue, médecin traitant, cabinet) ; elle s'envoie ou s'écarte avec un motif.", "La consommation d'appareillage se compare au prescrit, semaine par semaine sur douze semaines au plus.", "Le lot et la péremption se lisent sur le code produit (DataMatrix ou EAN-13), jamais saisis à la main.", "Le protocole initial d'une plaie se renseigne à l'ouverture, au terminal, et se relit au poste fixe.", "Une VVP ne s'ouvre plus au poste fixe : sa pose est le geste horodaté et signé au terminal.", "Deux dates d'ablation de fils ou d'agrafes peuvent être tenues ; une troisième remplace la plus proche.", "Passer outre l'alerte fistule est tracé ; l'irrigation est refusée sans réfection."]}]}, {"id": "nouveautes-l5", "titre": "L5 — Bilans, documents et prescription infirmière", "resume": "De nouveaux bilans par objet suivi, et une prescription infirmière qui s'envoie en extraits.", "mots_cles": ["bilans", "PDF", "prescription infirmière", "laboratoire", "pharmacie", "stomie", "trachéotomie", "CPAP"], "blocs": [{"type": "liste", "items": ["Nouveaux bilans pré-rédigés et sourcés, programmables, avec leur PDF : perfusion IV et sous-cutanée, stomie digestive et urinaire, nutrition, trachéotomie, CPAP.", "Le bilan de surveillance gagne une section neuropsychiatrique quand la fiche 15 est tenue.", "La prescription infirmière s'envoie en extraits au laboratoire et à la pharmacie, se signe par carte et s'envoie depuis son écran.", "L'appareillage de stomie et les consommables de perfusion et de nutrition sont proposés à la prescription."]}]}, {"id": "nouveautes-l6", "titre": "L6 — Ordonnances, fréquences et attribution", "resume": "Modifier une fréquence en cours, voir l'écart à l'heure prescrite, déclarer un acte fait en partie.", "mots_cles": ["fréquence", "modifier", "écart horaire", "horaires prescrits", "acte partiel", "formation", "attribution"], "blocs": [{"type": "liste", "items": ["Une fréquence échue ou arrêtée ne bloque plus celle de l'ordonnance suivante sur le même dispositif.", "Une fréquence se modifie en cours de route, prolongation comprise : bouton « Modifier » à côté d'« Arrêter ce soin » ; l'ancienne s'arrête la veille, l'historique reste intact.", "Un changement d'horaire est signalé par le bandeau « avant / après » ; une prolongation à l'identique ne signale rien.", "L'écart entre l'heure prescrite et l'heure réelle est calculé à la signature et lu au poste fixe, par exemple « Réalisé à 19 h 50, 10 min avant l'heure prescrite (20 h) ».", "Les horaires prescrits sans ordonnance jointe sont signalés, et levés en joignant l'ordonnance.", "Avant d'attribuer une tournée, une formation manquante est signalée : « Attribuer quand même ».", "Un acte fait en partie se déclare au terminal, sur toutes les fiches ; sa cotation passe toujours en file de contrôle."]}]}, {"id": "nouveautes-l7", "titre": "L7 — Médicaments, AVK, anticoagulant, nursing", "resume": "Le bloc AVK complet, la fin de traitement au terminal, la rotation des appuis.", "mots_cles": ["AVK", "INR", "posologie", "médicaments", "anticoagulant", "plaquettes", "nursing"], "blocs": [{"type": "liste", "items": ["Bloc AVK : prescription transcrite au dossier (posologie, INR cible, ordonnances), signal de changement de posologie, posologie de la semaine et la précédente, au poste fixe et au terminal.", "Fin de traitement saisissable au terminal pour les médicaments et l'anticoagulant injectable.", "Anticoagulant injectable : compteurs, chute plaquettaire calculée sur un résultat revenu et au domicile.", "Nursing : rotation des appuis."]}]}, {"id": "nouveautes-l8", "titre": "L8 — Nutrition, diabète, uro-génito-digestif", "resume": "Historique « à faire » du diabète, séance hebdomadaire signalée, diurèse ramenée à 24 heures.", "mots_cles": ["diabète", "glycémie", "protocole", "pompe à insuline", "diurèse", "lavement", "sonde", "nutrition"], "blocs": [{"type": "liste", "items": ["L'historique du suivi diabétique montre « à faire » pour chaque passage dû non saisi, au poste fixe et au terminal.", "Un patient devenu éligible à la séance hebdomadaire est signalé au cabinet, une fois.", "Compteurs du suivi diabétique : autonomie, valeurs hors bornes sur 7 et 30 jours, écarts à la proposition, versions du protocole.", "Le protocole et l'historique sont consultables au terminal ; type de diabète et bolus par la pompe ; débit de pompe au pas de 0,05 UI/h.", "La diurèse mesurée porte sa période et se compare ramenée à 24 heures ; la condition du lavement vient de l'ordonnance.", "La succession des sondes affiche longueur, lot et tolérance ; « macération » s'ajoute à l'état de la narine."]}]}, {"id": "nouveautes-l9", "titre": "L9 — PCA et pousse-seringue", "resume": "La séance de perfusion placée dans la bonne tournée, le registre des stupéfiants au poste fixe.", "mots_cles": ["PCA", "PSE", "pompe", "séance de perfusion", "stupéfiants", "sédation", "douleur"], "blocs": [{"type": "liste", "items": ["La séance de perfusion du jour se place dans la tournée du moment fixé, une par patient et par jour.", "Au terminal, la séance n'est proposée qu'au passage du moment fixé, et un acte déjà porté le dit.", "Le cadre de l'ordonnance et le séjour HAD se lisent au terminal.", "La douleur se mesure sur l'échelle du patient et à la mobilisation.", "Le registre des stupéfiants se lit au poste fixe ; la courbe de sédation profonde signale l'écart à la cible."]}]}, {"id": "nouveautes-l10", "titre": "L10 — Constantes et neuropsychiatrie", "resume": "Épreuve de lever au terminal, oxygène prescrit face au constaté, état habituel par trouble.", "mots_cles": ["épreuve de lever", "tension", "oxygène", "pouls", "neuropsychiatrie", "douleur", "constantes"], "blocs": [{"type": "liste", "items": ["Épreuve de lever au terminal : minuteur, contention exigée, trois mesures à leur heure réelle, lever impossible avec motif, rappel en cas de malaise ; les écarts se lisent au poste fixe.", "Le débit d'oxygène prescrit se saisit au poste fixe et se compare au débit constaté ; son changement est signalé.", "Régularité du pouls et interface d'oxygène au terminal ; l'ancienneté de la dernière mesure s'affiche à côté de chaque champ.", "Surveillance neuropsychiatrique : historique hors connexion au terminal, état habituel par trouble posé au poste fixe et écart affiché.", "La courbe de douleur se filtre par circonstance et par objet ; les tensions se filtrent par position."]}]}, {"id": "nouveautes-l11", "titre": "L11 — Dialyse et analgésie locorégionale", "resume": "Température lue des constantes, seuil du repère pris du protocole, volumes du cycleur saisis tels quels.", "mots_cles": ["dialyse", "cycleur", "ALR", "température", "repère", "pansement"], "blocs": [{"type": "liste", "items": ["Pour l'analgésie locorégionale, la température du jour se lit dans les paramètres vitaux, jamais ressaisie.", "Le seuil de migration du repère du cathéter vient du protocole quand il le fixe.", "Au terminal, les volumes lus sur le cycleur au branchement et la date du prochain pansement se saisissent ; ils se relisent au poste fixe."]}]}, {"id": "nouveautes-l12", "titre": "L12 — Injections, prélèvements, saignées", "resume": "Une ligne d'injection par fréquence, des sites de prélèvement contrôlés, la remise au laboratoire tracée.", "mots_cles": ["injection", "vaccin", "tuberculine", "prélèvement", "hémoculture", "saignée", "ferritinémie", "rappel de lot"], "blocs": [{"type": "liste", "items": ["Injections : chaque ligne sert une f <script>
(() => {
  const D = JSON.parse(document.getElementById('donnees').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...enfants) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'texte') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (const e of enfants.flat()) if (e != null) n.append(e);
    return n;
  };
  const sauver = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} };
  const lire = k => { try { return localStorage.getItem(k) } catch (e) { return null } };

  // Pages à plat, dans l'ordre, et index des aides contextuelles (liens « En savoir plus » des applications)
  const pages = [], parId = new Map(), aideVersPage = new Map();
  for (const r of D.rubriques) for (const p of r.pages) {
    const entree = { ...p, rubrique: r };
    pages.push(entree); parId.set(p.id, entree);
    for (const b of p.blocs) if (b.type === 'aides') for (const a of b.items) aideVersPage.set(a.id, p.id);
  }

  // --- Recherche : sans accents, par mots, titre et mots-clés pondérés ---
  const plat = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const texteBloc = b => [b.texte, b.items && b.items.map(i => typeof i === 'string' ? i : [i.q, i.r, i.terme, i.definition, i.titre, i.texte, (i.etapes || []).join(' ')].join(' ')).join(' '),
    b.entetes && b.entetes.join(' '), b.lignes && b.lignes.map(l => l.join(' ')).join(' ')].filter(Boolean).join(' ');
  const index = [];
  for (const p of pages) {
    index.push({ page: p.id, ancre: null, titre: p.titre, chemin: p.rubrique.titre, extrait: p.resume || '', fort: plat(p.titre + ' ' + (p.mots_cles || []).join(' ')), corps: plat(p.resume + ' ' + p.blocs.map(texteBloc).join(' ')), brut: p.resume + ' ' + p.blocs.map(texteBloc).join(' ') });
    for (const b of p.blocs) {
      if (b.type === 'faq') b.items.forEach((f, i) => index.push({ page: p.id, ancre: p.id + '-q' + i, titre: f.q, chemin: p.rubrique.titre + ' › ' + p.titre, extrait: f.r, fort: plat(f.q), corps: plat(f.r), brut: f.r }));
      if (b.type === 'aides') b.items.forEach(a => index.push({ page: p.id, ancre: a.id, titre: a.titre, chemin: 'Aide › ' + (a.ecran || p.titre), extrait: a.texte, fort: plat(a.titre + ' ' + (a.ecran || '')), corps: plat(a.texte + ' ' + (a.etapes || []).join(' ')), brut: a.texte }));
      if (b.type === 'glossaire') b.items.forEach(g => index.push({ page: p.id, ancre: null, titre: g.terme, chemin: p.rubrique.titre + ' › ' + p.titre, extrait: g.definition, fort: plat(g.terme), corps: plat(g.definition), brut: g.definition }));
    }
  }
  const chercher = q => {
    const mots = plat(q).split(/[^a-z0-9]+/).filter(m => m.length > 1);
    if (!mots.length) return [];
    return index.map(e => {
      let s = 0;
      for (const m of mots) {
        const f = e.fort.includes(m), c = e.corps.includes(m);
        if (!f && !c) return null;
        s += (f ? 10 : 0) + (c ? 2 : 0) + (e.fort.startsWith(m) ? 4 : 0);
      }
      return { e, s: s + (e.ancre ? 0 : 1) };
    }).filter(Boolean).sort((a, b) => b.s - a.s).slice(0, 12).map(x => ({ ...x.e, mots }));
  };
  const extraitAvec = (brut, mots) => {
    const p = plat(brut); let i = -1;
    for (const m of mots) { i = p.indexOf(m); if (i >= 0) break; }
    const debut = Math.max(0, i - 50), bout = brut.slice(debut, debut + 150);
    const frag = document.createDocumentFragment();
    if (debut > 0) frag.append('… ');
    const re = new RegExp('(' + mots.map(m => m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    const pb = plat(bout); let last = 0, m;
    while ((m = re.exec(pb))) { frag.append(bout.slice(last, m.index), el('em', { texte: bout.slice(m.index, m.index + m[0].length) })); last = m.index + m[0].length; }
    frag.append(bout.slice(last)); if (debut + 150 < brut.length) frag.append(' …');
    return frag;
  };

  const champ = $('#champ-recherche'), liste = $('#liste-resultats');
  let choix = -1, trouves = [];
  const fermer = () => { liste.hidden = true; champ.setAttribute('aria-expanded', 'false'); choix = -1 };
  const afficherResultats = () => {
    trouves = chercher(champ.value); liste.replaceChildren(); choix = trouves.length ? 0 : -1;
    if (!champ.value.trim()) return fermer();
    if (!trouves.length) liste.append(el('div', { class: 'vide', texte: 'Aucun résultat. Essayez un autre mot (ex. « tournée », « signature », « remplaçant »).' }));
    trouves.forEach((r, i) => liste.append(el('a', { class: 'resultat', role: 'option', id: 'res-' + i, 'aria-selected': i === 0 ? 'true' : 'false',
      href: '#' + (r.ancre || r.page), onclick: fermer }, el('small', { class: 'chemin', texte: r.chemin }), el('b', { texte: r.titre }), el('span', {}, extraitAvec(r.brut || r.extrait, r.mots)))));
    liste.hidden = false; champ.setAttribute('aria-expanded', 'true');
  };
  const surligner = () => [...liste.querySelectorAll('.resultat')].forEach((a, i) => { a.setAttribute('aria-selected', i === choix ? 'true' : 'false'); if (i === choix) { a.scrollIntoView({ block: 'nearest' }); champ.setAttribute('aria-activedescendant', a.id) } });
  champ.addEventListener('input', afficherResultats);
  champ.addEventListener('focus', () => champ.value && afficherResultats());
  champ.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && trouves.length) { e.preventDefault(); choix = (choix + 1) % trouves.length; surligner() }
    else if (e.key === 'ArrowUp' && trouves.length) { e.preventDefault(); choix = (choix - 1 + trouves.length) % trouves.length; surligner() }
    else if (e.key === 'Enter' && choix >= 0) { e.preventDefault(); const r = trouves[choix]; fermer(); champ.blur(); location.hash = r.ancre || r.page; aller() }
    else if (e.key === 'Escape') { fermer(); champ.blur() }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.recherche')) fermer() });
  document.addEventListener('keydown', e => {
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName))) { e.preventDefault(); champ.focus(); champ.select() }
  });

  // --- Navigation ---
  const nav = $('#nav');
  const fermees = new Set(JSON.parse(lire('portail-fermees') || '[]'));
  for (const r of D.rubriques) {
    const bloc = el('div', { class: 'rubrique', 'data-ferme': fermees.has(r.id) });
    const bouton = el('button', { 'aria-expanded': String(!fermees.has(r.id)), onclick: () => {
      const f = bloc.toggleAttribute('data-ferme'); bouton.setAttribute('aria-expanded', String(!f));
      f ? fermees.add(r.id) : fermees.delete(r.id); sauver('portail-fermees', JSON.stringify([...fermees])) } },
      el('span', { texte: r.titre }), el('span', { class: 'chevron', 'aria-hidden': 'true', texte: '▾' }));
    bloc.append(bouton, el('ul', {}, r.pages.map(p => el('li', {}, el('a', { href: '#' + p.id, 'data-page': p.id, texte: p.titre })))));
    nav.append(bloc);
  }
  const corps = document.body, boutonMenu = $('#bouton-menu');
  boutonMenu.addEventListener('click', () => { const o = corps.toggleAttribute('data-menu'); boutonMenu.setAttribute('aria-expanded', String(o)) });
  nav.addEventListener('click', e => { if (e.target.closest('a')) { corps.removeAttribute('data-menu'); boutonMenu.setAttribute('aria-expanded', 'false') } });

  // --- Thème ---
  const theme = lire('portail-theme'); if (theme) document.documentElement.dataset.theme = theme;
  $('#bouton-theme').addEventListener('click', () => {
    const sombre = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = sombre ? 'light' : 'dark'; sauver('portail-theme', document.documentElement.dataset.theme);
  });

  // --- Rendu d'une page ---
  const ancre = t => plat(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
  const rendreBloc = (b, p) => {
    switch (b.type) {
      case 'p': return el('p', { texte: b.texte });
      case 'h': return el('h2', { id: p.id + '--' + ancre(b.texte), texte: b.texte });
      case 'liste': return el('ul', {}, b.items.map(i => el('li', { texte: i })));
      case 'etapes': return el('ol', { class: 'etapes' }, b.items.map(i => el('li', {}, el('span', { texte: i }))));
      case 'note': return el('div', { class: 'note', 'data-ton': b.ton || 'info' }, el('strong', { texte: b.ton === 'attention' ? 'Attention' : 'Bon à savoir' }), b.texte);
      case 'code': {
        const pre = el('pre', {}, el('code', { texte: b.texte }));
        const btn = el('button', { class: 'copier', type: 'button', texte: 'Copier', onclick: () => {
          const ok = () => { btn.textContent = 'Copié'; setTimeout(() => btn.textContent = 'Copier', 1500) };
          (navigator.clipboard ? navigator.clipboard.writeText(b.texte) : Promise.reject()).then(ok, () => { const s = getSelection(), r = document.createRange(); r.selectNodeContents(pre.firstChild); s.removeAllRanges(); s.addRange(r) });
        } });
        pre.append(btn); return pre;
      }
      case 'table': return el('div', { class: 'tableau' }, el('table', {}, el('thead', {}, el('tr', {}, b.entetes.map(h => el('th', { texte: h })))), el('tbody', {}, b.lignes.map(l => el('tr', {}, l.map(c => el('td', { texte: c })))))));
      case 'faq': return el('div', {}, b.items.map((f, i) => el('details', { class: 'faq', id: p.id + '-q' + i }, el('summary', { texte: f.q }), el('div', { texte: f.r }))));
      case 'glossaire': return el('dl', { class: 'glossaire' }, b.items.map(g => [el('dt', { texte: g.terme }), el('dd', { texte: g.definition })]));
      case 'aides': return el('div', {}, b.items.map(a => el('article', { class: 'aide-carte', id: a.id },
        el('div', {}, a.ecran ? el('span', { class: 'etiquette', texte: a.ecran }) : null),
        el('h3', { texte: a.titre }), el('p', { texte: a.texte }),
        a.etapes && a.etapes.length ? el('ol', { class: 'etapes' }, a.etapes.map(x => el('li', {}, el('span', { texte: x })))) : null)));
      default: return null;
    }
  };
  const contenu = $('#contenu'), sommaire = $('#sommaire');
  const accueil = () => {
    const premiere = r => r.pages[0];
    return el('div', { class: 'page' },
      el('h1', { texte: 'Comment pouvons-nous vous aider ?' }),
      el('p', { class: 'chapeau', texte: 'Guides du poste fixe et du terminal, aide écran par écran, questions fréquentes et documentation technique de TabSanté. Tapez un mot dans la recherche ou choisissez une rubrique.' }),
      el('div', { class: 'accueil-grille' }, D.rubriques.map(r => el('a', { href: '#' + premiere(r).id }, el('b', { texte: r.titre }), el('span', { texte: r.description || (r.pages.length + ' pages') })))),
      el('p', { class: 'pied', texte: 'Version : ' + D.version }));
  };
  const montrer = (id, cible) => {
    const p = parId.get(id);
    document.querySelectorAll('nav a[aria-current]').forEach(a => a.removeAttribute('aria-current'));
    sommaire.replaceChildren();
    if (!p) { contenu.replaceChildren(accueil()); document.title = 'Portail TabSanté'; return }
    const lien = nav.querySelector('a[data-page="' + id + '"]'); if (lien) { lien.setAttribute('aria-current', 'page'); lien.closest('.rubrique').removeAttribute('data-ferme') }
    const i = pages.indexOf(p), prec = pages[i - 1], suiv = pages[i + 1];
    const page = el('article', { class: 'page' },
      el('div', { class: 'fil', texte: p.rubrique.titre }), el('h1', { texte: p.titre }), p.resume ? el('p', { class: 'chapeau', texte: p.resume }) : null,
      p.blocs.map(b => rendreBloc(b, p)),
      el('nav', { class: 'suite', 'aria-label': 'Pages voisines' },
        prec ? el('a', { href: '#' + prec.id }, el('span', { texte: '← Précédent' }), prec.titre) : el('span'),
        suiv ? el('a', { href: '#' + suiv.id }, el('span', { texte: 'Suivant →' }), suiv.titre) : el('span')));
    contenu.replaceChildren(page);
    const titres = page.querySelectorAll('h2');
    if (titres.length > 1) sommaire.append(el('b', { texte: 'Sur cette page' }), ...[...titres].map(h => el('a', { href: '#' + p.id, onclick: e => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }) }, texte: h.textContent })));
    document.title = p.titre + ' · Portail TabSanté';
    const c = cible && document.getElementById(cible);
    if (c) { if (c.tagName === 'DETAILS') c.open = true; c.setAttribute('data-cible', ''); c.scrollIntoView({ block: 'start' }) } else window.scrollTo(0, 0);
  };
  const aller = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (parId.has(h)) return montrer(h);
    if (aideVersPage.has(h)) return montrer(aideVersPage.get(h), h);
    const q = h.match(/^(.*)-q\d+$/); if (q && parId.has(q[1])) return montrer(q[1], h);
    montrer(null);
  };
  addEventListener('hashchange', aller);
  aller();
})();
</script>
