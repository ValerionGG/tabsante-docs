nexion ; une lecture faite hors ligne part au retour du réseau."}, {"type": "h", "texte": "Écrire une transmission"}, {"type": "etapes", "items": ["Toucher « Écrire ».", "Choisir ciblée (sur un patient) ou intra-cabinet (un soignant, la tournée, le cabinet).", "Ciblée : patient, cible, puis « Données », « Actions », « Résultat ». Taper @ pour mentionner un membre du cabinet : il sera notifié.", "Cocher si besoin « Interpeller le cabinet » (« Demander l'avis d'une infirmière » pour l'aide-soignante) : une réponse est attendue.", "Toucher « Envoyer la transmission » ; hors connexion, elle partira au retour du réseau."]}, {"type": "p", "texte": "Une transmission qui vous cite porte la pastille « Mention pour vous ». « Entretien infirmier » (infirmière) rattache l'entretien au soin qui vient d'être signé : tracé, jamais coté."}, {"type": "h", "texte": "Interpellations"}, {"type": "p", "texte": "Une interpellation se lit et se traite au terminal : « Répondre et marquer traitée ». La réponse est horodatée, signée du nom de qui répond, et part avec la file."}, {"type": "h", "texte": "Propositions à décider"}, {"type": "liste", "items": ["Transmission proposée après un événement critique : relire, compléter, « Confirmer et émettre » ou « Écarter la proposition… » avec un motif.", "Notification proposée (segment Notifications, « À valider ou écarter ») : contenu prêt, destinataires pré-cochés ; valider l'envoi, retirer un destinataire, ou écarter avec un motif."]}, {"type": "h", "texte": "Événement critique"}, {"type": "p", "texte": "Menu « Autres actions » › « Déclarer un événement critique », une fois le patient en sécurité. Pas de confirmation préalable : l'événement part dans la file, puis la transmission et la notification sont proposées."}, {"type": "h", "texte": "Signalement de l'aide-soignante"}, {"type": "p", "texte": "L'infirmière décide : surveillance renforcée, plaie ouverte et rattachée, ou sans suite ; « Enregistrer la décision ». La décision ne se réécrit pas."}, {"type": "note", "ton": "info", "texte": "La messagerie sécurisée vers les correspondants est simulée en démonstration."}]}, {"id": "term-envois", "titre": "Hors connexion et onglet Envois", "resume": "Ce qui marche sans réseau, la file d'envoi, les refus à corriger et la base mise de côté.", "mots_cles": ["hors connexion", "Envois", "file", "synchronisation", "précharge", "à corriger", "abandonner", "réessayer", "quarantaine"], "blocs": [{"type": "p", "texte": "Sans réseau, on soigne et on signe normalement. Chaque signature entre dans la file d'envoi, chiffrée sur le téléphone. L'envoi est automatique : toutes les 20 secondes, et dès le retour du réseau."}, {"type": "h", "texte": "La précharge"}, {"type": "p", "texte": "La tournée, les dossiers utiles, les transmissions, les itinéraires et le savoir-faire du jour sont chargés à l'avance. En ligne, le terminal vérifie toutes les 5 minutes et au retour de l'application au premier plan s'ils ont changé. Un bandeau « Données du … » prévient au-delà de 2 heures ; « Recharger la tournée du jour » est dans « Moi »."}, {"type": "h", "texte": "L'onglet Envois"}, {"type": "liste", "items": ["Une phrase d'état : « Tout est transmis » avec l'heure de la dernière synchronisation, ou ce qui attend.", "Les refus d'abord : le serveur dit pourquoi, rien n'a été transmis.", "Puis ce qui attend, par patient, et les photos.", "« Réessayer maintenant » relance l'envoi sans attendre."]}, {"type": "h", "texte": "Un envoi refusé"}, {"type": "p", "texte": "« Corriger et renvoyer » rouvre la saisie pré-remplie, le motif du refus en tête ; la nouvelle signature remplace l'envoi refusé. « Abandonner » demande confirmation et dit ce que l'abandon emporte. Certains refus ne se corrigent pas (geste hors de la période d'un remplacement, saisie trop tardive) : on les donne au cabinet, qui ressaisit au poste fixe, puis on abandonne."}, {"type": "h", "texte": "Ce qui exige le réseau"}, {"type": "liste", "items": ["Enrôlement et première connexion.", "Téléservices (identité, droits) : « Connexion requise », jamais un bouton qui échoue.", "Planning, photo de l'entrée, fond de carte, partage de position."]}, {"type": "h", "texte": "Base mise de côté"}, {"type": "p", "texte": "Si la base chiffrée du téléphone devient illisible, elle est mise de côté, jamais effacée, et l'écran « Base mise de côté » le dit : garder l'application, appeler le support avec la référence affichée ; sinon ressaisir les soins concernés en saisie différée, motif « terminal illisible »."}, {"type": "note", "ton": "attention", "texte": "« Changer d'intervenant » n'est possible qu'une fois tous les envois partis, pour que rien ne se perde."}]}, {"id": "term-notifications", "titre": "Notifications locales et heures calmes", "resume": "Les avis que le téléphone calcule lui-même, sans réseau, et leur réglage.", "mots_cles": ["notifications", "heures calmes", "rappel", "mention", "retard", "tournée validée"], "blocs": [{"type": "p", "texte": "Le terminal calcule lui-même ses avis, à partir de ce qu'il a chargé : rien ne part au réseau."}, {"type": "liste", "items": ["Rappel daté échu (une heure avant le passage quand l'heure est connue).", "Tournée de demain validée.", "Transmission qui vous mentionne.", "Retard sur la tournée."]}, {"type": "p", "texte": "Ils s'affichent en bandeau en haut de l'application, qui se ferme seul au bout de 8 secondes."}, {"type": "h", "texte": "Régler"}, {"type": "etapes", "items": ["« Moi » › « Notifications ».", "Activer ou couper « Notifications de ce téléphone ».", "Régler « Heures calmes à partir de » et « jusqu'à » (21 h à 7 h par défaut)."]}, {"type": "p", "texte": "Pendant les heures calmes, rien ne s'affiche : ce qui est dû attend leur fin."}, {"type": "note", "ton": "info", "texte": "Une notification ne dit jamais le nom du patient ni son soin : au plus la civilité et l'initiale, par exemple « Rappel : passage chez M. B. à 9 h »."}, {"type": "note", "ton": "attention", "texte": "La notification système d'Android et d'iOS n'est pas encore branchée : l'avis s'affiche dans l'application ouverte. Dans le navigateur, « Notifier aussi hors de l'onglet » est proposé."}]}, {"id": "term-planning", "titre": "Planning, absences et échanges", "resume": "Préparer la tournée de demain, déclarer ses absences, lire ses indicateurs, échanger une tournée.", "mots_cles": ["planning", "préparer demain", "absence", "indisponibilité", "indicateurs", "échange de tournée", "heure fixe"], "blocs": [{"type": "p", "texte": "Le planning s'ouvre depuis « Moi » › « Organisation » › « Préparer demain, absences, indicateurs ». Il se lit et se règle en ligne ; la tournée du jour reste utilisable hors connexion."}, {"type": "h", "texte": "Préparer demain"}, {"type": "p", "texte": "Pour chaque tournée de demain : l'ordre proposé face à l'ordre actuel, avec la fin et la durée estimées, les alertes et les heures fixes. Valider (« Valider l'ordre proposé » ou « Garder l'ordre actuel ») revient à qui tient la tournée à ce moment, ou à qui organise les tournées."}, {"type": "p", "texte": "Toucher un patient pose ou retire une heure fixe (rendez-vous, insuline à heure dite), pour ce jour ou aussi les suivants. « Proposer un ordre » ne la déplace jamais."}, {"type": "h", "texte": "Déclarer une absence"}, {"type": "etapes", "items": ["« Déclarer une absence ».", "Choisir « Du » et « Au » (ou « Sans terme »), ou « Chaque semaine » certains jours.", "Choisir des moments, ou aucun pour toute la journée."]}, {"type": "p", "texte": "Le motif ne se lit que par vous et par qui organise les tournées."}, {"type": "h", "texte": "Mes indicateurs"}, {"type": "p", "texte": "Sur les 14 derniers jours : kilomètres, trajet, soins, remplissage, passages prévus, réalisés et non réalisés. Aucun montant."}, {"type": "h", "texte": "Échanges de tournée"}, {"type": "p", "texte": "« Moi » › « Proposer un échange de tournée » : la période, ce que vous cédez, à qui, ce que vous reprenez (ou rien). Le collègue accepte ou refuse sur son téléphone ; hors connexion, la proposition ou la réponse part en premier au retour du réseau. Un échange qui tombe sur une de vos absences sera refusé par le serveur."}, {"type": "note", "ton": "info", "texte": "Kilomètres et temps viennent d'itinéraires simulés : des estimations."}]}, {"id": "term-facturer", "titre": "Facturer au domicile (simulé)", "resume": "Lire la carte Vitale et sécuriser une feuille de soins de démonstration.", "mots_cles": ["FSE", "carte Vitale", "CPS", "facturation", "SESAM-Vitale", "simulé", "téléservices"], "blocs": [{"type": "note", "ton": "attention", "texte": "Démonstration : lecteur de cartes et SESAM-Vitale simulés. Aucune feuille de soins réelle ne part."}, {"type": "etapes", "items": ["Menu « Autres actions » › « Facturer avec la carte Vitale » (infirmière).", "« Lire la carte Vitale du patient » : les cartes se lisent sans réseau et ne quittent pas le téléphone.", "Choisir les actes à facturer.", "« Créer et sécuriser la FSE » en ligne, ou « Sécuriser la FSE au domicile » sans réseau."]}, {"type": "p", "texte": "La FSE se sécurise avec la carte de l'infirmière qui a réalisé les actes. Sans réseau, il faut être connectée par sa carte CPS ; la FSE part au retour du réseau, derrière les actes, que le cabinet cote et reconfirme d'abord."}, {"type": "h", "texte": "Services en ligne"}, {"type": "p", "texte": "Dans la fiche du patient, identité nationale (INSi), droits (ADRi) et carte Vitale versée au dossier se demandent en ligne. Hors connexion, chacun dit « Connexion requise » et ce qu'il reste à faire ; rien ne bloque le soin."}, {"type": "note", "ton": "info", "texte": "DMP, accès QR des correspondants et lots de feuilles de soins se gèrent au poste fixe."}, {"type": "liens", "items": [{"titre": "FSE, lots, retours et rejets", "resume": "Qui crée la FSE, mode dégradé, sécurisation sans réseau.", "href": "#fn-fse-lots"}]}]}, {"id": "term-dossier", "titre": "Dossier et plan de soins au terminal", "resume": "Consulter le dossier, le plan de soins hors connexion, les mentions du patient et les autres saisies.", "mots_cles": ["dossier", "plan de soins", "ordonnance", "protocole", "décès", "SEGA", "résultat", "prescription infirmière", "ordonnance photographiée"], "blocs": [{"type": "p", "texte": "La fiche patient porte ses alertes (allergies…), ses mentions et la carte « Dossier » : groupe sanguin, traitements de fond, contacts, entourage."}, {"type": "h", "texte": "Plan de soins"}, {"type": "p", "texte": "« Plan de soins » (infirmière) s'ouvre depuis le dossier, même hors connexion : chaque ordonnance avec ses actes et ses fréquences, puis les protocoles en vigueur (version, date, consignes). Il arrive avec la tournée."}, {"type": "h", "texte": "Autres saisies de l'infirmière"}, {"type": "liste", "items": ["« Photographier l'ordonnance » : la photo est versée au dossier, la validation se fait au cabinet.", "« Rédiger une prescription infirmière » : lignes du référentiel prescriptible de démonstration, puis signature ; l'ordonnance PDF est établie et versée au dossier du patient.", "« Saisir un résultat de biologie ».", "« Score SEGA (fragilité) ».", "Accords préalables : demande et réponse reçue."]}, {"type": "h", "texte": "Décès d'un patient"}, {"type": "p", "texte": "Le décès se déclare au poste fixe. Au terminal, le patient porte alors la mention « Décédé le … » dans son en-tête et sur la carte du prochain passage ; le serveur retire ses passages dus des tournées."}, {"type": "note", "ton": "info", "texte": "Aide-soignante : ni plan de soins, ni prescriptions, ni accords préalables, ni bilan de prévention."}, {"type": "note", "ton": "info", "texte": "« Comment faire ? » : les contenus publiés du cabinet (gestes, vidéos, questions, documents) se lisent hors connexion ; « Poser une question » envoie une question qu'un référent relit avant de la publier."}]}]}, {"id": "faq", "titre": "Questions fréquentes", "public": "tous", "pages": [{"id": "faq-essentiel", "titre": "L'essentiel : démonstration, hébergement, mise en service", "resume": "Peut-on l'utiliser avec de vrais patients, où sont les données, que veulent dire « simulé » et « provisoire ».", "mots_cles": ["démonstration", "HDS", "hébergement", "mise en service", "simulé", "provisoire", "bloqué", "vraies données"], "blocs": [{"type": "faq", "items": [{"q": "Puis-je utiliser TabSanté avec de vrais patients aujourd'hui ?", "r": "Non. TabSanté tourne en mode démonstration. Avant toute donnée réelle, il faut la carte CPS réelle par Pro Santé Connect (le courtier d'identité Keycloak est installé, Pro Santé Connect y est encore simulé), un hébergeur certifié HDS, la désignation d'un délégué à la protection des données (DPO), un service de clés réel pour le chiffrement des fichiers, l'ancrage hors site du journal d'audit et la copie hors site des sauvegardes."}, {"q": "Où les données sont-elles hébergées ? TabSanté est-il certifié HDS ?", "r": "L'hébergeur certifié HDS (hébergeur de données de santé) n'est pas encore choisi : c'est un élément bloqué de la couverture du CDC. La documentation d'exploitation liste ce que l'application exige de lui (certificat, hébergement en France sur deux sites, chiffrement du volume, sauvegardes hors site). Aujourd'hui, la base PostgreSQL tourne dans un conteneur sur le poste de développement."}, {"q": "Que veulent dire « Simulé », « Provisoire », « Partiel » et « Bloqué » ?", "r": "Simulé : le chemin est complet, mais une doublure de démonstration tient la place d'un service tiers (SESAM-Vitale, INSi, DMP, moteur de cotation…) ; jamais à facturer. Provisoire : une valeur prudente est branchée en attendant une décision (un seuil, un délai). Partiel : une partie seulement existe. Bloqué : cela dépend d'un tiers ou d'une décision, rien ne peut avancer sans eux."}, {"q": "Peut-on facturer avec TabSanté ?", "r": "Pas encore. Le circuit complet existe (cotation, contrôle, FSE, lots, retours, rejets) mais sur des doublures. Il manque le moteur NGAP réel de TABSANTE, le composant SESAM-Vitale et son agrément (décision D-07), et les vrais lecteurs de cartes."}, {"q": "Des données quittent-elles la plateforme ?", "r": "Du serveur, non : tous les services externes sont simulés et la lecture d'ordonnance tourne en local. Depuis les clients, en démonstration : le fond de carte est demandé à un serveur de tuiles public (les tuiles révèlent la zone affichée) ; l'application de navigation reçoit les seules coordonnées du domicile, jamais le nom ni l'adresse ; un SMS de retard part du téléphone de l'infirmier, au texte neutre."}, {"q": "Le site public est-il en ligne ?", "r": "Non. Il est construit mais des informations légales et commerciales restent à compléter ; tant qu'il en manque une, chaque page porte « Version de travail » et n'est pas indexée. Il ne promet ni certification HDS, ni agrément, ni prix."}]}]}, {"id": "faq-hors-connexion", "titre": "Hors connexion et synchronisation", "resume": "Ce qui marche sans réseau, où voir ce qui n'est pas parti, que faire d'un envoi refusé.", "mots_cles": ["hors connexion", "réseau", "synchronisation", "file d'envoi", "Envois", "précharge", "à corriger"], "blocs": [{"type": "faq", "items": [{"q": "Que se passe-t-il si je n'ai pas de réseau ?", "r": "Rien ne s'arrête : vous soignez et signez normalement. Chaque signature entre dans la file d'envoi, chiffrée sur le téléphone. L'envoi repart de lui-même toutes les 20 secondes et dès le retour du réseau. Départs et arrivées de la tournée entrent aussi dans la file, et le téléphone recalcule les heures d'arrivée."}, {"q": "Qu'est-ce qui exige le réseau ?", "r": "L'enrôlement et la première connexion, les téléservices (identité, droits), la mise en lot et la télétransmission, le planning, la photo de l'entrée du domicile, le fond de carte (un schéma le remplace) et le partage de position."}, {"q": "Où voir ce qui n'est pas encore parti ?", "r": "Dans l'onglet « Envois » du terminal (pastille ambre) : d'abord les envois à corriger, puis ceux en attente, par patient, et les photos. « Réessayer maintenant » relance l'envoi sans attendre."}, {"q": "Un envoi est « à corriger » : que faire ?", "r": "Le serveur a refusé l'opération et dit pourquoi. « Corriger et renvoyer » rouvre la saisie pré-remplie ; la nouvelle signature remplace l'envoi refusé. « Abandonner » le retire, après confirmation. Un refus de délai (geste hors de la période d'un remplacement, saisie trop tardive) ne se corrige pas : le cabinet ressaisit au poste fixe, puis on abandonne."}, {"q": "Mes données de tournée sont-elles à jour ?", "r": "La tournée et les dossiers utiles sont préchargés. En ligne, le terminal compare sa précharge au serveur toutes les 5 minutes et au retour au premier plan, et ne la recharge que si elle a changé. Un bandeau prévient quand elle a plus de 2 heures ; « Recharger la tournée du jour » est dans « Moi »."}, {"q": "Le cabinet voit-il qu'un téléphone ne synchronise plus ?", "r": "Oui. Le poste fixe signale un terminal non synchronisé pendant une tournée en cours, au-delà d'un seuil réglable (2 heures par défaut, question Q-71), avec « Appeler » et « Marquer comme vu »."}, {"q": "Le terminal parle d'une base « mise de côté » : ai-je perdu mes données ?", "r": "Non. Quand la base chiffrée du téléphone devient illisible, elle est mise de côté, jamais effacée, et un écran vous le dit. Gardez l'application et appelez le support avec la référence affichée."}]}]}, {"id": "faq-securite", "titre": "Sécurité et protection des données", "resume": "Chiffrement, verrouillage, terminal perdu, journaux, recherche tracée, géolocalisation des soignants.", "mots_cles": ["sécurité", "chiffrement", "verrou", "code", "terminal perdu", "journal des accès", "journal d'audit", "RGPD", "géolocalisation"], "blocs": [{"type": "faq", "items": [{"q": "Comment les données du terminal sont-elles protégées ?", "r": "La base locale est chiffrée enregistrement par enregistrement, avec une clé gardée dans le coffre de clés du téléphone. Les photos sont des fichiers chiffrés à part. Un code à 6 chiffres (ou l'empreinte digitale) verrouille l'application au lancement, en arrière-plan et après 5 minutes sans toucher l'écran. Captures d'écran et sauvegarde Android sont interdites."}, {"q": "J'ai oublié mon code de verrouillage : que faire ?", "r": "« Code oublié » efface le secret de l'appareil : il faut un nouvel enrôlement (code à demander au cabinet) puis une nouvelle connexion. La file d'envoi est conservée : rien de ce qui a été signé n'est perdu."}, {"q": "Un terminal est perdu ou volé : que faire ?", "r": "Révoquez-le au poste fixe, page « Terminaux ». Il ne peut plus ouvrir ni rafraîchir aucune session ; à sa prochaine connexion, précharge, brouillons et jetons sont effacés. S'il restait des envois, la file reste chiffrée et l'utilisateur choisit « Envoyer d'abord » (après un nouvel enrôlement) ou « Effacer sans envoyer »."}, {"q": "Les données sont-elles chiffrées au serveur ?", "r": "Photos et PDF sont chiffrés par l'application, fichier par fichier, avec une clé par fichier enveloppée par une clé maîtresse. En démonstration, cette clé maîtresse vient d'un trousseau local simulé, que le serveur refuse hors développement : le service de clés de l'hébergeur doit être branché. Les sauvegardes sont chiffrées. La base elle-même s'appuie sur le chiffrement du volume chez l'hébergeur, à exiger au contrat."}, {"q": "Qui a consulté le dossier d'un patient ?", "r": "Le journal des accès trace chaque lecture nominative, un patient par ligne, ainsi que les rafraîchissements de session et les refus d'accès. Il se lit au poste fixe (« Paramètres », « Journal des accès ») avec filtres et export CSV, réservé aux titulaires, responsables et à l'administration. Les traces d'un patient figurent aussi dans « Droits du patient »."}, {"q": "Une donnée signée peut-elle être modifiée en douce ?", "r": "Non. Un acte signé est immuable en base : on le corrige par un ajout motivé, l'original reste lisible. Le journal d'audit chaîne chaque écriture à la précédente par une empreinte, et sa tête est copiée chaque nuit hors de la base. Depuis le 21 octobre, ce journal ne garde plus de copie clinique : des références, les champs changés et des empreintes."}, {"q": "La recherche dans tout le cabinet est-elle tracée ?", "r": "Oui, sans garder ce qui est cherché. Au poste fixe (Ctrl K), chaque patient atteint par un résultat est noté au journal des accès ; le texte cherché n'est jamais journalisé. Au terminal, la recherche se fait hors connexion dans la précharge, déjà tracée à son téléchargement (avis du DPO attendu, Q-68)."}, {"q": "Ma position est-elle suivie pendant la tournée ?", "r": "Non, sauf si vous l'acceptez vous-même dans « Moi » ; c'est désactivé par défaut. Même acceptée, la position n'est prise qu'au départ que vous signalez, arrondie à environ un kilomètre, sert seulement à estimer l'heure d'arrivée, n'est montrée à personne et s'efface à l'arrivée, au plus tard après 12 heures (valeur provisoire)."}, {"q": "Une analyse d'impact (AIPD) existe-t-elle ?", "r": "Un brouillon technique existe, à conduire par le DPO : inventaire des données, flux, mesures vérifiables dans le code, risques et décisions ouvertes. Les durées de conservation sont provisoires (décision D-06) et à valider par le DPO."}]}]}, {"id": "faq-soins", "titre": "Soigner avec TabSanté (infirmier)", "resume": "Signature, brouillons, saisie différée, soins imprévus ou non faits, plaies, photos, corrections, consultations.", "mots_cles": ["signature", "brouillon", "saisie différée", "non réalisé", "acte partiel", "plaie", "photo", "correction", "consultation", "ordonnance"], "blocs": [{"type": "faq", "items": [{"q": "Comment signer un soin ?", "r": "Renseignez la fiche : la barre du bas dit ce qui manque (« Il manque : … ») ; un appui sur la mention mène au premier manque. Quand tout est renseigné, maintenez le bouton de signature une seconde ; relâcher avant annule. Avec les animations réduites ou un lecteur d'écran, un appui simple ouvre une confirmation. Le reçu s'affiche ensuite."}, {"q": "Pourquoi le bouton de signature reste-t-il inactif ?", "r": "Un champ exigé n'est pas renseigné : la barre d'action les nomme. Une réponse de sécurité (saignement, douleur…) n'est jamais présélectionnée : elle se donne explicitement, même quand rien n'a changé."}, {"q": "J'ai été interrompue pendant une saisie : est-ce perdu ?", "r": "Non. Le terminal enregistre un brouillon chiffré à chaque appui ; il n'est effacé qu'à la signature."}, {"q": "J'ai saisi un soin longtemps après l'avoir fait : pourquoi un motif ?", "r": "Au-delà de 120 minutes entre la réalisation et la saisie, la saisie est « différée » : un motif est obligatoire, puis un autre infirmier (titulaire ou responsable) la valide au poste fixe, page « Saisies différées ». Le seuil de 120 minutes est provisoire (D-04)."}, {"q": "Comment ajouter un soin qui n'était pas prévu ?", "r": "Par « Ajouter un soin » au passage. Un passage non programmé exige un motif : demande du patient ou du médecin, initiative infirmière, rattrapage, soin régulé (réservé à l'infirmier) ou autre ; le pansement a ses motifs propres (souillure, pansement décollé, saignement, douleur, demande du patient)."}, {"q": "Un soin prévu n'a pas été fait, ou seulement en partie : comment le dire ?", "r": "Déclarez le passage non réalisé, avec son motif, au terminal ou au poste fixe. Un acte fait en partie se déclare aussi au terminal, avec ce qui n'a pas été fait ; sa cotation passe toujours en file de contrôle (Q-86)."}, {"q": "Le terminal affiche un écart avec l'heure prescrite : est-ce bloquant ?", "r": "Non. Le serveur calcule l'écart entre l'heure prescrite et l'heure réelle du soin ; il s'affiche sur la tournée et au passage, par exemple « réalisé à 6 h 15, 1 h 45 avant l'heure prescrite », sans jamais bloquer."}, {"q": "Quelles photos puis-je prendre ?", "r": "Uniquement à l'appareil photo, pas depuis la galerie, par l'auteur du passage, dans une fenêtre autour du soin ; JPEG ou PNG, 15 Mo au plus. La photo rejoint la série de l'objet suivi et la comparaison au poste fixe ; elle ne laisse aucune copie en clair sur le téléphone."}, {"q": "Comment corriger un acte déjà signé ?", "r": "Un acte signé ne se modifie jamais : on ajoute une correction motivée, relue par les règles de la fiche. Courbes, bilans et cotation l'appliquent ; la cotation est recalculée et passe en file de contrôle."}, {"q": "Que faire face à un événement grave au domicile ?", "r": "Déclarez un événement critique depuis le menu du passage. La déclaration est immuable ; elle propose une notification au médecin et une transmission ciblée. Une notification proposée n'est jamais envoyée seule : un infirmier l'envoie ou l'écarte avec un motif, au poste fixe ou au terminal."}, {"q": "Pourquoi ma consultation est-elle « tracée, non facturante » ?", "r": "Parce que son motif n'est pas encore en vigueur : la CIA attend l'avis de la HAS, la CIB s'applique au 1er juillet 2027, le bilan annuel de plaie au 1er janvier 2027. Le soin est tracé, rien n'est facturé avant la date d'effet."}, {"q": "Comment saisir une ordonnance ?", "r": "Photographiez-la ou numérisez-la : elle est gardée telle quelle. La lecture automatique ne produit qu'une proposition (prescripteur, date, durée, actes) ; vous validez ou rejetez. Rien n'est créé sans vous. Une ordonnance lue au nom d'un autre patient est refusée."}, {"q": "La prescription a changé : comment le voir ?", "r": "Un bandeau « avant / après » s'affiche dans la fiche, puis un filigrane, jusqu'au premier soin réalisé sous la nouvelle valeur. Depuis le 22 octobre, un changement d'horaire est signalé lui aussi."}, {"q": "Où trouver l'aide « Comment faire ? »", "r": "Sous chaque fiche : gestes, vidéos, documents et questions du cabinet, publiés par un infirmier référent. Les contenus actuels sont des exemples « à valider par un référent »."}, {"q": "Comment être prévenue quand une collègue me cite ?", "r": "Une collègue tape « @ » et votre nom dans une transmission : vous êtes notifiée et pouvez la lire, même sans en être destinataire. Au poste fixe, filtre « Me mentionnant » ; au terminal, une pastille et une notification locale."}]}]}, {"id": "faq-aide-soignante", "titre": "Aide-soignante", "resume": "Ce que l'aide-soignante signe, ce qu'elle ne voit pas, comment elle signale.", "mots_cles": ["aide-soignante", "AS", "nursing", "signalement", "transmission", "BSI"], "blocs": [{"type": "faq", "items": [{"q": "Quelles fiches puis-je signer ?", "r": "La fiche Nursing, et la fiche Paramètres vitaux quand le cabinet exerce en structure. Toutes les autres fiches sont signées par un infirmier."}, {"q": "Qu'est-ce que je ne vois pas, et pourquoi ?", "r": "Par principe de moindre accès : la cotation et la facturation, le contenu des consultations, le texte des signalements, les prescriptions infirmières et les documents produits. Au terminal, les soins que vous ne pouvez pas signer ne vous sont pas proposés. « À traiter » ne montre que vos propres tâches."}, {"q": "Je constate une anomalie : que faire ?", "r": "Faites un signalement à l'infirmier : c'est lui qui décide de la suite. Une rougeur qui ne blanchit pas ou une phlyctène relevée en nursing rend le signalement obligatoire."}, {"q": "Puis-je écrire une transmission ciblée ?", "r": "Oui, depuis le 22 octobre, dans des limites : ni entretien infirmier, ni traitement d'une interpellation, ni requalification. Au terminal, vous pouvez demander l'avis d'une infirmière. Faut-il une relecture par l'infirmier référent ? C'est la question Q-88."}, {"q": "Le forfait de dépendance est-il compté deux fois si l'infirmier passe aussi ?", "r": "Non : le forfait journalier (BSA, BSB, BSC) est compté une fois par patient et par jour, même quand infirmier et aide-soignante passent."}, {"q": "Comment me connecter ?", "r": "En démonstration, en touchant votre nom dans la liste des profils, sans carte. L'authentification réelle de l'aide-soignante est une décision ouverte (D-02)."}]}]}, {"id": "faq-remplacant", "titre": "Remplaçant", "resume": "Portée du remplacement, fin de période, facturation de ses actes.", "mots_cles": ["remplaçant", "remplacement", "portée", "fin de remplacement", "facturation", "D-10"], "blocs": [{"type": "faq", "items": [{"q": "Que puis-je faire pendant mon remplacement ?", "r": "Les soins d'un infirmier, dans la portée de votre habilitation : sa période (toujours une date de fin), ses tournées et/ou ses patients, jugés à la date de chaque geste. Avec une portée restreinte, les vues de tout le cabinet vous sont fermées ; depuis le 21 octobre, cette portée s'applique aussi à la tournée du jour, aux prélèvements et à la messagerie."}, {"q": "Que se passe-t-il à la fin de mon remplacement ?", "r": "Pendant 120 minutes, seul l'envoi de la file du terminal reste ouvert, pour les gestes datés de la période ; ensuite toutes vos sessions sont révoquées. La file restante est gardée pour le cabinet : un nouvel enrôlement est nécessaire pour l'envoyer."}, {"q": "Puis-je facturer mes actes ?", "r": "Pas en l'état : le remplaçant n'a pas le droit de sécuriser une FSE, et le poste fixe en affiche le motif. Qui émet la FSE des actes du remplaçant est la décision D-10."}, {"q": "Puis-je émettre un code de terminal ou valider une saisie différée ?", "r": "Non : l'émission de codes relève de la gestion des habilitations, la validation des saisies hors délai des titulaires et responsables."}, {"q": "Le cabinet peut-il me proposer pour couvrir une absence ?", "r": "Oui, si votre habilitation est en cours : le planning propose jusqu'à quatre intervenants du même rôle, les disponibles d'abord, les titulaires avant les remplaçants."}]}]}, {"id": "faq-cabinet", "titre": "Gérer le cabinet", "resume": "Terminaux, droits, tournées, absences, saisies différées, simulations, reprise de dossiers.", "mots_cles": ["cabinet", "titulaire", "administration", "enrôlement", "habilitations", "tournées", "absences", "reprise de dossiers", "simulations"], "blocs": [{"type": "faq", "items": [{"q": "Comment enrôler un nouveau terminal ?", "r": "Au poste fixe, page « Terminaux » : émettez un code. Il compte 10 caractères, sert une fois et vaut 10 minutes. Saisissez-le sur le terminal, à l'écran d'enrôlement ; l'infirmier se connecte ensuite. Il faut le droit de gérer les habilitations ; un remplaçant ne peut pas émettre de code."}, {"q": "Comment donner ou retirer des droits ?", "r": "Page « Équipe » : habilitations (administration, responsabilité, remplacement), formations, révocation. Les droits suivent la matrice d'habilitations, seule juge côté serveur. Qui peut retirer une responsabilité ou l'administration reste à trancher (Q-65)."}, {"q": "Comment attribuer et réorganiser les tournées ?", "r": "Page « Tournées » : elle s'ouvre sur « Itinéraire et carte » et propose aussi la planification du jour en colonnes, une par intervenant, avec sa charge. Une attribution qui recouvre une absence est refusée ; une formation manquante est signalée avant d'enregistrer. Les intervenants peuvent échanger une tournée du même rôle."}, {"q": "Un intervenant est absent : comment couvrir ses tournées ?", "r": "Chacun déclare ses indisponibilités (congé, maladie, formation), ponctuelles ou récurrentes. Le planning signale les tournées à couvrir et propose un remplacement en un clic. Le motif n'est lu que par l'intéressé et par qui organise les tournées."}, {"q": "Qui valide les saisies différées ?", "r": "Un infirmier titulaire ou responsable qui n'est pas le signataire, au poste fixe seulement, page « Saisies différées ». Un refus est motivé et écarte la cotation de l'acte."}, {"q": "Que montre la page Simulations, et qui peut provoquer une panne ?", "r": "« Paramètres », « Simulations » liste les doublures du mode démonstration (services, référentiels, règles provisoires), chacune avec ce qu'elle remplace. L'administration du cabinet y choisit une panne ou une option ; le réglage vaut pour toute l'instance et reste après un redémarrage."}, {"q": "Comment reprendre les dossiers d'un autre logiciel ?", "r": "Par « Paramètres », « Reprise de dossiers », au format pivot de démonstration : un aperçu à blanc (rien n'est écrit, erreurs et ressemblances signalées), puis la reprise du même fichier. Les identités reprises restent provisoires jusqu'à leur qualification par l'INSi. Les formats des logiciels du marché ne sont pas arrêtés (D-13)."}, {"q": "À quoi servent la zone d'intervention et les prérequis de passage ?", "r": "La zone d'intervention est un cercle de 200 m à 50 km autour du point de départ des tournées : un domicile hors zone est signalé, sans rien bloquer. Les prérequis (à jeun, ordonnance, matériel, présence d'un aidant…) se règlent par soin dans « Paramètres » ; la liste livrée est une proposition « à valider par un référent IDE » (Q-69)."}, {"q": "Que voit l'administration du cabinet ?", "r": "L'organisation : tournées, planning, équipe, habilitations, terminaux, accès QR, journal des accès, simulations. Depuis le 21 octobre, elle n'a plus accès au dossier clinique : elle ne lit que l'identité des patients. Le périmètre exact est à confirmer (Q-85)."}, {"q": "Comment le cabinet suit-il ce qui reste à faire ?", "r": "Le tableau de bord réunit, depuis le 22 octobre, les soins à compléter, les résultats attendus, les pièces manquantes (horaires prescrits sans ordonnance jointe, séjour HAD sans lettre de mission), le BSI à renouveler et les tests tuberculiniques sans lecture, filtrables par tournée et exportables en CSV."}]}]}, {"id": "faq-facturation-renvoi", "titre": "Cotation et facturation", "resume": "Les questions sur la facturation ont rejoint la rubrique Facturation et NGAP.", "mots_cles": ["facturation", "renvoi"], "blocs": [{"type": "note", "ton": "info", "texte": "La FAQ de la cotation et de la facturation se trouve désormais dans la rubrique Facturation et NGAP."}, {"type": "liens", "items": [{"titre": "FAQ facturation et NGAP", "resume": "Toutes les questions sur la cotation et la facturation.", "href": "#faq-facturation"}, {"titre": "Facturation et NGAP", "resume": "Le circuit complet et les règles de la doublure, dans la rubrique dédiée.", "href": "#fn-vue-ensemble"}]}]}, {"id": "faq-patients", "titre": "Patients : décès, droits, export, photos", "resume": "Déclarer un décès, répondre à une demande du patient, exporter un dossier, gérer photos et partage.", "mots_cles": ["décès", "droits des patients", "RGPD", "export", "FHIR", "portabilité", "photo", "photo de l'entrée", "consentement", "QR"], "blocs": [{"type": "faq", "items": [{"q": "Comment déclarer le décès d'un patient ?", "r": "Au poste fixe, dans l'identité du patient, « Déclarer le décès » (réservé à l'infirmier) : date, source, commentaire. Au jour du décès, fréquences et passages dus s'arrêtent, heures fixes et objets suivis sont clos, parcours et rappels se terminent, demandes de renouvellement et accès QR tombent ; les soignants de ses tournées sont notifiés. Rien du dossier n'est effacé."}, {"q": "J'ai déclaré un décès sur le mauvais dossier : que faire ?", "r": "La déclaration s'annule avec un motif, tracé. Ce que le décès a arrêté le reste : les soins se reprogramment un à un. Aucun passage signé ne peut être daté après un décès, et un décès ne peut pas être daté avant un passage signé."}, {"q": "Un patient demande l'accès à son dossier ou sa rectification : comment répondre ?", "r": "Ouvrez « Droits du patient » dans le dossier administratif (infirmier) : inscrivez la demande (accès, rectification, portabilité, opposition, limitation, effacement) le jour de sa réception, avec son canal. Délais proposés, à valider par le DPO : 8 jours pour l'accès au dossier, un mois pour les autres droits. Une rectification ne remplace rien : nouvelle version, rectification ou correction motivée."}, {"q": "Comment exporter le dossier d'un patient ?", "r": "L'infirmier exporte le dossier en FHIR R4 (patient, actes signés, observations, documents, rencontres, intervenants), pour l'accès ou la portabilité ; l'export est journalisé. Photos et PDF se joignent par leurs fichiers. La remise se fait de façon sécurisée, jamais par courriel non sécurisé."}, {"q": "Un patient demande la limitation du traitement : que se passe-t-il ?", "r": "Inscrire une demande de limitation pose un indicateur : tant qu'il est posé, le dossier ne sort plus par les voies de partage (export FHIR, envoi MSSanté ou DMP, accès QR). Les soins continuent : le dossier se lit, se complète et se signe."}, {"q": "Le patient peut-il obtenir l'effacement de son dossier ?", "r": "Non pendant la durée de conservation légale : le refus est motivé et inscrit. Au terme, décision du DPO, puis suppression par un script d'exploitation après archive. Les durées sont provisoires (D-06)."}, {"q": "À quoi sert la photo de l'entrée du domicile ?", "r": "À trouver la bonne porte du premier coup. Une photo par patient, prise au terminal ou déposée au poste fixe, visible dans « Accès au domicile » et « Avant d'arriver ». Chiffrée, lue par les seuls soignants du cabinet, elle ne sort jamais : ni DMP, ni export FHIR, ni portail externe."}, {"q": "Comment donner accès au dossier à un médecin ou un pharmacien ?", "r": "Pré-enregistrez le professionnel (RPPS), recueillez le consentement du patient (droits, périmètre, date de fin), puis créez un accès QR : affiché une fois, 4 heures par défaut, 72 heures au plus, jamais au-delà du consentement. Le professionnel s'identifie en plus par Pro Santé Connect (simulé aujourd'hui) et ne modifie jamais le dossier."}]}]}]}, {"id": "glossaire", "titre": "Glossaire", "public": "tous", "pages": [{"id": "glossaire-soins", "titre": "Soins et métier", "resume": "Les mots de l'exercice infirmier à domicile, tels que TabSanté les emploie.", "mots_cles": ["métier", "soins", "fiches", "sigles"], "blocs": [{"type": "glossaire", "items": [{"terme": "IDEL", "definition": "Infirmier diplômé d'État libéral : il exerce en libéral, seul ou en cabinet, et soigne au domicile des patients. Premier utilisateur de TabSanté."}, {"terme": "IDE", "definition": "Infirmier diplômé d'État. Dans TabSanté, le rôle « infirmier » d'un intervenant : titulaire, en structure, responsable ou remplaçant."}, {"terme": "IDE titulaire", "definition": "Infirmier qui exerce en son nom et facture ses actes ; il a tous les droits de soin et d'organisation du cabinet."}, {"terme": "IDE en structure", "definition": "Infirmier qui exerce au sein d'une société : la structure émet les feuilles de soins."}, {"terme": "IDE responsable", "definition": "Infirmier qui porte la responsabilité clinique du cabinet ; mêmes droits d'administration que le titulaire."}, {"terme": "Remplaçant", "definition": "Infirmier habilité pour une période donnée, sur des tournées et/ou des patients désignés, à la place d'un titulaire. Chaque geste est jugé à sa date."}, {"terme": "AS (aide-soignante, aide-soignant)", "definition": "Intervenant qui réalise les soins d'hygiène et de confort (nursing), signe ses propres actes, signale à l'infirmier et ne facture jamais."}, {"terme": "Rôle propre", "definition": "Soins que l'infirmier décide et réalise sans prescription médicale."}, {"terme": "Accès direct", "definition": "Prise en charge par l'infirmier sans prescription préalable ; l'avenant 11 l'ouvre aux plaies non chirurgicales au 1er janvier 2027."}, {"terme": "PCA", "definition": "Analgésie contrôlée par le patient : pompe qui délivre un antalgique en continu avec des bolus déclenchés par le patient, parfois associée à une sédation (fiche 13-14)."}, {"terme": "PSE", "definition": "Pousse-seringue électrique : pompe qui administre un produit à débit réglé ; une seringue contient un seul produit (fiche 16)."}, {"terme": "ALR", "definition": "Analgésie locorégionale : antalgie par un cathéter placé près d'un nerf ou de la moelle ; le neuraxial exige un accord préalable (fiche 23)."}, {"terme": "DPCA, DPA", "definition": "Dialyse péritonéale continue ambulatoire (manuelle, par poches) ou automatisée (par cycleur) (fiche 17)."}, {"terme": "Nutrition entérale", "definition": "Alimentation par sonde dans le tube digestif (fiche 8). La nutrition parentérale, par voie veineuse, relève de la fiche 4."}, {"terme": "UGD", "definition": "Uro-génito-digestif : sondes urinaires, cystostomie, lavements, autosondage (fiche 20)."}, {"terme": "VVP, PICC, chambre implantable", "definition": "Voies veineuses : cathéter court périphérique, cathéter central inséré par voie périphérique, boîtier sous-cutané piqué à l'aiguille de Huber (fiche 4)."}, {"terme": "Redon", "definition": "Drain aspiratif posé après une chirurgie, suivi dans la fiche Pansements."}, {"terme": "AVK", "definition": "Antivitamines K : anticoagulants oraux surveillés par l'INR ; bloc AVK de la fiche 6 (l'ancienne fiche 7)."}, {"terme": "INR", "definition": "Examen de sang qui mesure l'effet des AVK."}, {"terme": "HbA1c", "definition": "Hémoglobine glyquée : marqueur de l'équilibre du diabète sur trois mois (fiche 10)."}, {"terme": "HNF, HBPM", "definition": "Héparine non fractionnée, héparine de bas poids moléculaire : anticoagulants injectables (fiche 11)."}, {"terme": "EN", "definition": "Échelle numérique de la douleur, de 0 à 10 ; l'une des cinq échelles proposées, celle du dossier d'abord."}, {"terme": "RASS", "definition": "Échelle d'agitation et de sédation de Richmond ; une cible est exigée pour une sédation."}, {"terme": "SEGA", "definition": "Grille d'évaluation de la fragilité de la personne âgée ; son score conditionne la majoration MSG de l'avenant 11."}, {"terme": "Escarre", "definition": "Plaie de pression ; son stade (1 à 4, ou indéterminable) est obligatoire à l'ouverture."}, {"terme": "Récidive", "definition": "Nouvelle plaie sur une plaie déjà cicatrisée du même patient : elle se lie à la précédente et son rang d'épisode augmente."}, {"terme": "Épreuve de lever", "definition": "Mesures de la tension couché puis debout, à leur heure réelle, pour rechercher une hypotension orthostatique (fiche 18)."}, {"terme": "Saignée", "definition": "Prélèvement thérapeutique de sang, suivi par la ferritinémie (fiche 21)."}, {"terme": "Téléconsultation, télésoin, télé-expertise", "definition": "Médecin et patient avec l'infirmier présent ; infirmier et patient ; infirmier et médecin. Compte rendu signé, aucune vidéo conservée."}]}]}, {"id": "glossaire-facturation-renvoi", "titre": "Assurance maladie et facturation", "resume": "Les mots de la facturation ont rejoint la rubrique Facturation et NGAP.", "mots_cles": ["facturation", "renvoi"], "blocs": [{"type": "note", "ton": "info", "texte": "Le glossaire de l'assurance maladie, de la cotation et de la facturation se trouve désormais dans la rubrique Facturation et NGAP."}, {"type": "liens", "items": [{"titre": "Glossaire facturation et NGAP", "resume": "Lettres-clés, forfaits, majorations, cotation, FSE et lots.", "href": "#glossaire-assurance-maladie"}, {"titre": "Facturation et NGAP", "resume": "Le circuit complet et les règles de la doublure, dans la rubrique dédiée.", "href": "#fn-vue-ensemble"}]}]}, {"id": "glossaire-sante-numerique", "titre": "Identité et santé numérique", "resume": "Identité du patient, identité du professionnel, échanges et terminologies.", "mots_cles": ["INS", "INSi", "PSC", "DMP", "MSSanté", "FHIR", "RPPS"], "blocs": [{"type": "glossaire", "items": [{"terme": "INS", "definition": "Identité nationale de santé du patient : « provisoire » tant qu'elle n'est pas qualifiée ; qualifiée après interrogation de l'INSi et contrôle de la pièce d'identité."}, {"terme": "INSi", "definition": "Téléservice qui retrouve et vérifie l'INS ; appelé d'office à la création du patient, jamais bloquant. Simulé."}, {"terme": "RNIV", "definition": "Référentiel national d'identitovigilance : règles de qualification de l'identité, dont le contrôle d'une pièce d'identité."}, {"terme": "NIR", "definition": "Numéro d'inscription au répertoire (numéro de sécurité sociale)."}, {"terme": "RPPS", "definition": "Identifiant à 11 chiffres d'un professionnel de santé."}, {"terme": "PSC (Pro Santé Connect)", "definition": "Fournisseur d'identité national des professionnels de santé (e-CPS) ; exigé avec le QR pour le portail externe. Simulé."}, {"terme": "DMP (Mon espace santé)", "definition": "Dossier médical partagé du patient. Le versement est refusé si l'INS n'est pas qualifiée ; l'opposition du patient est respectée. Simulé."}, {"terme": "MSSanté", "definition": "Messagerie sécurisée de santé, réservée aux professionnels ; simulée, rien n'est envoyé."}, {"terme": "FHIR", "definition": "Standard d'échange de données de santé (HL7) ; TabSanté exporte le dossier en FHIR R4."}, {"terme": "LOINC, SNOMED CT", "definition": "Terminologies internationales des observations et des termes cliniques, vers lesquelles les listes internes sont codées (composant C16)."}, {"terme": "NANDA-I, NOC, NIC", "definition": "Classifications des diagnostics, des résultats et des interventions infirmiers ; NANDA-I attend une licence, NOC est préparé, NIC n'est pas prévu."}, {"terme": "Ordonnance numérique", "definition": "Service national de prescription électronique ; simulé. En attendant, l'ordonnance photographiée est lue par une lecture automatique locale puis validée par l'infirmier."}, {"terme": "Ségur", "definition": "Programme national de référencement des logiciels de santé ; six fonctions attendues d'un logiciel de cabinet."}, {"terme": "Keycloak", "definition": "Serveur d'identité installé comme courtier entre TabSanté, la carte CPS et Pro Santé Connect : il vérifie qui se connecte, TabSanté garde ensuite sa propre session. Pro Santé Connect y est simulé en attendant la convention avec l'ANS."}]}]}, {"id": "glossaire-securite", "titre": "Sécurité, preuve et conformité", "resume": "Hébergement, protection des données, journaux, sessions et droits.", "mots_cles": ["HDS", "RGPD", "journal", "audit", "empreinte", "habilitation"], "blocs": [{"type": "glossaire", "items": [{"terme": "HDS", "definition": "Hébergeur de données de santé : certification obligatoire de l'hébergeur. Non choisi à ce jour."}, {"terme": "RGPD", "definition": "Règlement général sur la protection des données ; les données de santé sont sensibles."}, {"terme": "AIPD", "definition": "Analyse d'impact relative à la protection des données ; un brouillon technique existe, à conduire par le DPO."}, {"terme": "DPO", "definition": "Délégué à la protection des données, à désigner avant production."}, {"terme": "CNIL", "definition": "Autorité française de protection des données."}, {"terme": "Journal d'audit chaîné", "definition": "Registre immuable de ce qui change : chaque entrée porte l'empreinte de la précédente. Il ne garde aucune copie clinique : références, champs changés, empreintes."}, {"terme": "Ancrage", "definition": "Copie régulière de la tête de la chaîne d'audit hors de la base, pour prouver qu'elle n'a pas été réécrite."}, {"terme": "Journal des accès", "definition": "Trace de chaque lecture nominative (un patient par ligne), des rafraîchissements de session et des refus d'accès, dans sa propre chaîne ; purgée après 365 jours (provisoire), jamais avant 180."}, {"terme": "Empreinte", "definition": "Résumé cryptographique qui change si un seul caractère change ; le reçu du terminal en montre les 12 premiers caractères."}, {"terme": "Immuabilité", "definition": "Une donnée signée ne se modifie ni ne s'efface ; elle se corrige par un ajout motivé."}, {"terme": "Rôle applicatif", "definition": "Compte de base de données à moindre privilège avec lequel l'API se connecte : il ne peut pas réécrire les preuves."}, {"terme": "Session", "definition": "Période de connexion d'un intervenant ; jeton d'accès court, renouvelé, session de 30 jours au plus, révocable."}, {"terme": "Enrôlement", "definition": "Rattachement d'un terminal au cabinet par un code à usage unique émis au poste fixe."}, {"terme": "Révocation", "definition": "Retrait immédiat d'un droit, d'une session ou d'un terminal."}, {"terme": "Verrou de l'application", "definition": "Code à 6 chiffres ou empreinte digitale qui protège le terminal."}, {"terme": "Mode kiosque", "definition": "Terminal Android verrouillé sur TabSanté ; prévu, non éprouvé sur appareil."}, {"terme": "Limitation du traitement", "definition": "Droit du patient (RGPD) : tant qu'elle est posée, le dossier ne sort plus par les voies de partage, mais les soins continuent."}, {"terme": "Habilitation", "definition": "Droit accordé à un intervenant (administration, responsabilité, remplacement) ; la matrice HAB-01 à HAB-34 dit qui peut lire, écrire, signer, valider ou administrer."}]}]}, {"id": "glossaire-application", "titre": "Les mots de l'application", "resume": "Écrans, objets et mécanismes propres à TabSanté.", "mots_cles": ["terminal", "poste fixe", "précharge", "transmission", "cotation", "tournée"], "blocs": [{"type": "glossaire", "items": [{"terme": "Poste fixe", "definition": "L'application web du cabinet, utilisée au bureau."}, {"terme": "Terminal", "definition": "L'application du soignant au domicile, qui fonctionne sans réseau."}, {"terme": "Précharge", "definition": "Tout ce que le terminal télécharge pour travailler sans réseau pendant la tournée."}, {"terme": "Synchronisation", "definition": "Envoi de la file d'opérations du terminal au serveur, toutes les 20 secondes et après chaque signature ; rejouable sans doublon."}, {"terme": "Envois", "definition": "Onglet du terminal qui montre la file d'envoi : à corriger d'abord, puis en attente."}, {"terme": "À corriger", "definition": "État d'un envoi refusé par le serveur : il reste dans la file avec son motif."}, {"terme": "Liaisons", "definition": "Onglet du terminal des transmissions et des notifications."}, {"terme": "Brouillon", "definition": "Saisie en cours enregistrée à chaque appui, chiffrée, effacée à la signature."}, {"terme": "Brouillon partagé", "definition": "Brouillon d'une sous-fiche de la fiche 24 commun aux infirmiers du cabinet ; en cas de conflit, « Garder le mien » ou « Reprendre le leur »."}, {"terme": "Saisie différée", "definition": "Acte saisi plus de 120 minutes après sa réalisation (seuil provisoire) : motif obligatoire et validation au poste fixe par un autre infirmier."}, {"terme": "Signature maintenue", "definition": "Geste de signature du terminal : maintenir le bouton environ une seconde."}, {"terme": "Reçu", "definition": "Écran qui suit la signature : réalisé le, signé par, empreinte, état d'envoi."}, {"terme": "Dossier de preuve", "definition": "Document qui prouve un acte : données signées, horodatages, auteur, photos, intégrité de la chaîne d'audit."}, {"terme": "Fiche", "definition": "Formulaire d'un type de soin : 24 numéros, 21 fiches (7 et 9 vacants, 13 et 14 réunis)."}, {"terme": "Fiche mère, sous-fiche", "definition": "La fiche 24 n'a pas de cotation propre ; chaque motif (CIA, CIB, bilan de prévention, séance…) est une sous-fiche."}, {"terme": "Objet suivi", "definition": "La plaie, le dispositif ou l'épisode dont on suit l'évolution : l'unité de traçabilité."}, {"terme": "J0, J+n", "definition": "Jour de référence d'un suivi et nombre de jours écoulés depuis."}, {"terme": "Fréquence", "definition": "Rythme prescrit d'un soin : période, cadence, moments, horaires."}, {"terme": "Occurrence", "definition": "Soin dû à une date et un moment, engendré par une fréquence."}, {"terme": "Passage", "definition": "Présence d'un soignant au domicile à un moment donné ; un passage peut servir plusieurs soins."}, {"terme": "Moment", "definition": "Matin, midi, soir ou nuit ; la nuit va de 20 h à 6 h."}, {"terme": "Passage non réalisé", "definition": "Occurrence prévue qui n'a pas eu lieu, déclarée avec son motif."}, {"terme": "Acte partiel", "definition": "Soin fait en partie, déclaré au terminal avec ce qui n'a pas été fait ; sa cotation passe en file de contrôle."}, {"terme": "Écart horaire", "definition": "Écart entre l'heure prescrite et l'heure réelle d'un soin, calculé par le serveur et affiché, jamais bloquant."}, {"terme": "Plan de soins", "definition": "Ordonnances, actes prescrits, fréquences et protocoles en vigueur d'un patient, consultables hors connexion au terminal."}, {"terme": "Mode visite", "definition": "Déroulé du soin au terminal en liste d'étapes (prérequis puis sections), avec photo comparée à J0 ; la signature reste soumise à la fiche."}, {"terme": "Transmission ciblée", "definition": "Message clinique structuré sur un patient, visible du cabinet ; écrit par l'infirmier et, dans certaines limites, par l'aide-soignante."}, {"terme": "Transmission intra-cabinet", "definition": "Message à une personne, une tournée ou tout le cabinet, lu par ses destinataires et les personnes citées."}, {"terme": "Transmission externe", "definition": "Message reçu d'un professionnel extérieur par le portail QR."}, {"terme": "Interpellation", "definition": "Demande adressée à un infirmier, suivie jusqu'à son traitement ; une interpellation non lue alerte après quatre heures."}, {"terme": "Signalement", "definition": "Constat de l'aide-soignante adressé à l'infirmier, qui seul décide de la suite."}, {"terme": "@mention", "definition": "Citation d'un membre du cabinet dans une transmission : la personne citée est notifiée."}, {"terme": "Événement critique", "definition": "Déclaration immuable d'un événement grave ; elle propose une notification au médecin et une transmission ciblée."}, {"terme": "Notification proposée", "definition": "Avis au médecin ou à un service que le logiciel propose ; un infirmier l'envoie ou l'écarte avec motif."}, {"terme": "Portail externe, accès QR", "definition": "Espace où un professionnel extérieur lit la synthèse et dépose documents ou transmissions ; jeton court et révocable, remis par QR."}, {"terme": "Consentement", "definition": "Accord du patient à l'accès d'un professionnel désigné, borné en droits, en périmètre et en durée."}, {"terme": "Mode démonstration", "definition": "Mode du serveur qui fait tourner tout le produit sans les services nationaux, avec des doublures réglables."}, {"terme": "Doublure", "definition": "Remplaçant de démonstration d'un service tiers ou du moteur ; jamais à facturer."}, {"terme": "Registre des simulations", "definition": "Liste des doublures, référentiels de démonstration et règles provisoires, réglables dans « Paramètres », « Simulations »."}, {"terme": "Règle provisoire", "definition": "Comportement qui attend une décision : le code applique l'option prudente et permet d'essayer les autres."}, {"terme": "Aperçu des passages", "definition": "Avant de valider une fréquence, la liste des passages qu'elle produira et des conflits qu'elle crée."}, {"terme": "Prérequis de passage, À préparer", "definition": "Ce que le patient prépare avant un soin (à jeun, ordonnance, matériel, aidant) et la liste de ce qui reste à confirmer."}, {"terme": "Avant d'arriver", "definition": "Panneau qui prépare l'entrée chez le prochain patient : accès au domicile, photo de l'entrée, alertes, prérequis, météo et trafic."}, {"terme": "Arrivée estimée", "definition": "Heure à laquelle le soignant devrait arriver, recalculée au fil de la tournée ; toujours approximative."}, {"terme": "Heure fixe, fenêtre horaire", "definition": "Heure de passage convenue avec un patient ; plage autour de l'heure prescrite (30 minutes, provisoire)."}, {"terme": "Préparer demain", "definition": "Revue et validation, la veille, de l'ordre de la tournée du lendemain."}, {"terme": "Zone d'intervention", "definition": "Cercle autour du point de départ des tournées ; un domicile hors zone est signalé, sans blocage."}, {"terme": "Indisponibilité, réattribution", "definition": "Absence déclarée d'un intervenant ; passage d'une tournée ou d'une occurrence à un autre intervenant."}, {"terme": "Échange de tournée", "definition": "Cession ou échange d'une tournée entre deux intervenants du même rôle."}, {"terme": "Planification en colonnes", "definition": "Vue du jour au poste fixe, une colonne par intervenant avec sa charge, pour déplacer les passages avant de valider."}, {"terme": "Terminal non synchronisé", "definition": "Alerte du poste fixe quand un téléphone se tait pendant une tournée en cours au-delà d'un seuil (2 heures par défaut)."}, {"terme": "Suggestions", "definition": "Propositions expliquées au poste fixe et au terminal, tirées du contexte (jours fériés, vacances, météo…) ; jamais exécutées sans l'utilisateur."}, {"terme": "Palette Ctrl K", "definition": "Champ de commandes du poste fixe qui atteint les pages et cherche dans tout le cabinet."}, {"terme": "Notifications locales, heures calmes", "definition": "Avis que le terminal calcule lui-même, sans réseau ; plage (21 h à 7 h par défaut) où il n'en affiche aucun."}, {"terme": "Agent de poste", "definition": "Programme prévu sur le poste fixe pour relier lecteurs de cartes et composant SESAM-Vitale ; simulé."}, {"terme": "Référentiel, date d'effet", "definition": "Liste de référence versionnée publiée par TABSANTE ; elle s'applique à partir de sa date d'effet, jamais rétroactivement."}, {"terme": "Patient provisoire", "definition": "Patient créé sans INS qualifiée ; qualifié ensuite par l'INSi, doublons proposés, jamais fusionnés en silence."}, {"terme": "Décès déclaré", "definition": "Date de décès posée par un infirmier : tout ce qui devait venir s'arrête, le dossier demeure."}, {"terme": "Reprise de dossiers", "definition": "Import des patients d'un autre logiciel : aperçu à blanc, puis reprise rejouable."}, {"terme": "Savoir-faire « Comment faire ? »", "definition": "Contenus du cabinet (gestes, vidéos, documents, questions) rattachés aux fiches, publiés par un infirmier référent."}, {"terme": "Cotation et facturation", "definition": "Moteur de cotation, cotation provisoire, file de contrôle, reçu, banc, compteurs : ces mots sont définis dans Facturation et NGAP › Glossaire facturation et NGAP."}]}]}, {"id": "glossaire-statuts", "titre": "Statuts et états", "resume": "Les mots d'état de la couverture du CDC et de l'interface.", "mots_cles": ["statuts", "fait", "simulé", "bloqué", "provisoire"], "blocs": [{"type": "glossaire", "items": [{"terme": "Fait", "definition": "Implémenté et couvert par au moins un test automatisé."}, {"terme": "Partiel", "definition": "Une partie existe ; aussi quand le serveur le tient mais qu'aucun écran ne permet de s'en servir."}, {"terme": "Simulé", "definition": "Une doublure de démonstration tient la place d'un tiers : à remplacer, jamais à facturer."}, {"terme": "Bloqué", "definition": "Dépend d'un tiers ou d'une décision."}, {"terme": "Absent", "definition": "Rien dans le code ; aucun élément du CDC n'est absent aujourd'hui."}, {"terme": "Provisoire", "definition": "Valeur branchée en attendant une décision."}, {"terme": "Moteur seul, À confirmer", "definition": "Statuts propres à l'avenant 11 : rien à construire côté plateforme ; réponse de TABSANTE nécessaire."}, {"terme": "À faire, En attente d'envoi, Signé, Transmis", "definition": "États d'un soin : dû et pas encore réalisé ; signé au terminal, pas encore reçu ; signé ; reçu par le serveur."}, {"terme": "Clôturée, Cicatrisée", "definition": "Objet suivi clos ; plaie close pour cicatrisation."}, {"terme": "Démonstration", "definition": "Étiquette posée sur toute cotation et sur les contenus fictifs."}, {"terme": "D-nn, Q-nn", "definition": "Décisions du CDC (D-01 à D-21, sans D-15) ; questions ouvertes au fondateur nées du code (Q-01 à Q-98)."}]}]}]}, {"id": "technique", "titre": "Documentation technique", "public": "technique", "pages": [{"id": "tech-architecture", "titre": "Architecture d'ensemble", "resume": "Une API FastAPI sur PostgreSQL, deux clients internes (poste fixe React, terminal Flutter), un portail externe, un site public à part et des ports vers les services externes.", "mots_cles": ["architecture", "FastAPI", "PostgreSQL", "React", "Flutter", "Astro", "ports", "adaptateurs", "agent de poste"], "blocs": [{"type": "p", "texte": "L'API est la seule à toucher la base et les fichiers. Le poste fixe et le terminal lui parlent en JSON sur HTTPS, avec un jeton d'accès. Le professionnel extérieur passe par un portail distinct, sous « /externe », avec un jeton de QR et son identité Pro Santé Connect."}, {"type": "table", "entetes": ["Partie", "Dossier", "Technologie", "Rôle"], "lignes": [["API", "backend", "Python 3.11 et plus, FastAPI, SQLAlchemy 2, Alembic, uv", "Règles, immuabilité, cotation, preuve, synchronisation, journaux chaînés"], ["Base", "docker-compose.yml", "PostgreSQL 17 (conteneur, port hôte 55432 en local)", "Seule la base est conteneurisée aujourd'hui"], ["Poste fixe", "web", "React 19, TypeScript, Vite, TanStack Query, MapLibre", "Application du cabinet, souris et clavier"], ["Terminal", "mobile", "Flutter 3.47.6 (Android ; servi en web pour la démonstration)", "Tournée hors connexion, base locale chiffrée"], ["Site public", "site", "Astro, HTML et CSS seulement", "Présentation, sans aucune donnée de santé"], ["Vérification", "scripts", "PowerShell et Bash", "verifier_tout, crochet avant envoi, recompte de la matrice"]]}, {"type": "h", "texte": "Organisation du serveur"}, {"type": "liste", "items": ["« backend/app » : le socle (configuration, base, authentification, habilitations, audit, horloge, stockage chiffré, simulation, idempotence).", "« backend/app/domaines » : un module par domaine métier (74 modules), routes, schémas et règles.", "« backend/app/fiches » : les règles serveur de chaque fiche de soin et le registre FICHES.", "« backend/app/cotation », « sesam », « teleservices » : les ports et leurs doublures de démonstration.", "« backend/app/referentiels » : les référentiels livrés en JSON, repris en versions publiées en base.", "« backend/scripts » : rôles SQL, sauvegarde, restauration, stockage, bancs de cotation et de conformité, connexion de service, mesures."]}, {"type": "h", "texte": "Ports et adaptateurs"}, {"type": "p", "texte": "Chaque service externe passe par une interface Python (un port) et un adaptateur choisi au démarrage. Le domaine n'appelle que le port. Aujourd'hui, presque tous les adaptateurs sont des doublures de démonstration ; hors démonstration, ces doublures sont fermées et refusent d'agir."}, {"type": "h", "texte": "Mise à jour en direct du poste fixe"}, {"type": "p", "texte": "Une écriture validée émet un avis PostgreSQL (NOTIFY) par transaction, qui ne porte que le cabinet et des clés « telle entité a changé » (actes, cotations, occurrences, transmissions, notifications, échéances), jamais une donnée de patient. Le poste fixe garde ouvert le flux « GET /evenements » (événements serveur) et relit ce qui a changé."}, {"type": "h", "texte": "Agent de poste"}, {"type": "p", "texte": "Le navigateur ne parle ni aux lecteurs de cartes ni au composant SESAM-Vitale. Un agent installé sur le poste fixe fera ce pont : il s'enrôle comme un terminal, tire ses travaux en HTTPS sortant (aucun port ouvert sur le poste) et rend le résultat. Le côté serveur est construit et testé avec un agent simulé ; l'agent réel attend le choix du composant SESAM-Vitale (décision D-07)."}, {"type": "note", "ton": "attention", "texte": "Le moteur de cotation branché est une doublure de démonstration : ne jamais facturer avec. Le moteur NGAP réel est un actif de TABSANTE, attendu derrière le même port."}]}, {"id": "tech-installation", "titre": "Installer et lancer en local", "resume": "Les cinq commandes qui lancent la base, l'API, le poste fixe et le terminal web de démonstration sur un poste de développement.", "mots_cles": ["installation", "démarrage", "docker", "uv", "npm", "flutter", "ports", "5173", "5180", "8010"], "blocs": [{"type": "p", "texte": "Prérequis : Docker, uv (Python), Node 24, Flutter 3.47.6. Les commandes sont en syntaxe bash ; en PowerShell, poser la variable avant la commande."}, {"type": "code", "langage": "bash", "texte": "# 1. Base PostgreSQL 17 en conteneur (port hôte 55432)\ndocker compose up -d db\n\n# 2. Schéma : migrations Alembic\ncd backend\nuv sync\nTABSANTE_DEV_AUTH=true uv run alembic upgrade head\n\n# 3. API sur 8010 (mode développement, boucle locale)\nTABSANTE_DEV_AUTH=true uv run uvicorn app.main:app --host 127.0.0.1 --port 8010\n\n# 4. Poste fixe sur 5173\ncd web\nnpm ci\nVITE_API_URL=http://127.0.0.1:8010 npm run dev -- --host 127.0.0.1 --port 5173\n\n# 5. Terminal servi en web sur 5180\ncd mobile\nflutter build web --dart-define=API_URL=http://127.0.0.1:8010\npython -m http.server 5180 --directory build/web"}, {"type": "code", "langage": "powershell", "texte": "$env:TABSANTE_DEV_AUTH='true'\nuv run uvicorn app.main:app --host 127.0.0.1 --port 8010"}, {"type": "table", "entetes": ["Adresse", "Ce qu'on y trouve"], "lignes": [["http://127.0.0.1:5173", "Poste fixe"], ["http://127.0.0.1:5180", "Terminal servi en web (démonstration)"], ["http://127.0.0.1:8010/docs", "Documentation interactive de l'API (mode développement seulement)"], ["http://localhost:4321", "Site public (« cd site » puis « npm run dev »), projet à part"]]}, {"type": "liste", "items": ["La connexion de démonstration appelle « POST /dev/demo » : idempotente, elle crée une seule fois un cabinet fictif, ses intervenants, des patients fictifs et une semaine de passages.", "Le terminal web s'enrôle en démonstration sans code ; sur Android, l'enrôlement passe par un code émis au poste fixe.", "Sans « --dart-define=API_URL », le terminal vise http://127.0.0.1:8002 (valeur par défaut du code).", "Sans réseau, « VITE_CARTE_STYLE=aucune » (poste fixe) et « --dart-define=TUILES_URL= » (terminal) remplacent le fond de carte par un schéma."]}, {"type": "h", "texte": "Remettre la démonstration à zéro"}, {"type": "code", "langage": "bash", "texte": "cd backend\nTABSANTE_DEV_AUTH=true uv run python reinitialiser_demo.py"}, {"type": "h", "texte": "HTTPS en local (facultatif)"}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/certificat_dev.py\nuv run uvicorn app.main:app --port 8226 --ssl-keyfile var/tls/cle.pem --ssl-certfile var/tls/certificat.pem"}, {"type": "note", "ton": "attention", "texte": "Le certificat créé par « certificat_dev.py » est autosigné, valable 30 jours, pour localhost seulement. Jamais en production."}]}, {"id": "tech-mode-demo", "titre": "Mode démonstration, routes /dev et registre des simulations", "resume": "Comment la plateforme tourne sans les services nationaux : doublures réglables, pannes simulées, routes de développement réservées à la boucle locale.", "mots_cles": ["démonstration", "simulation", "/dev", "pannes", "registre", "doublure", "TABSANTE_DEV_AUTH", "TABSANTE_MODE_DEMO"], "blocs": [{"type": "p", "texte": "« TABSANTE_DEV_AUTH=true » ouvre le mode développement ; « TABSANTE_MODE_DEMO » le suit s'il n'est pas posé. Les deux sont refusés au démarrage dès que la configuration ressemble à un service."}, {"type": "h", "texte": "Routes de développement"}, {"type": "table", "entetes": ["Route", "Effet"], "lignes": [["POST /dev/demo", "Crée une fois, ou réutilise, le cabinet de démonstration et rend un jeton par intervenant fictif ; le paramètre « jeu » ouvre un cabinet à part pour les tests d'intégration"], ["POST /dev/demarrage", "Cabinet vide et jetons"], ["POST /dev/qr-demo", "Accès QR de démonstration"], ["POST /dev/psc/jeton", "Jeton Pro Santé Connect factice pour le portail externe"]]}, {"type": "note", "ton": "attention", "texte": "Les routes /dev délivrent des jetons sans authentification. Elles ne répondent qu'à la boucle locale et refusent toute requête portant un en-tête de proxy. Ne jamais publier le mode développement derrière un proxy."}, {"type": "h", "texte": "Registre des simulations"}, {"type": "p", "texte": "« backend/app/simulation.py » déclare chaque doublure une seule fois : ce qu'elle remplace, ses modes (« normal » en premier) et ses options. Le réglage est gardé en base (table « reglage_simulation »), commun à l'instance et conservé au redémarrage. Le registre compte 39 entrées : 33 dans « simulation.py » et 6 sources du contexte France déclarées dans « contexte_france.py »."}, {"type": "table", "entetes": ["Nature", "Entrées"], "lignes": [["Services simulés", "lecteur CPS, lecteur Vitale, INSi, ADRi, IDB, SESAM-Vitale, agent de poste, MSSanté, laboratoire, DMP, e-prescription, visio, géocodage, itinéraire, trafic, météo, radar de pluie, position GPS"], ["Référentiels de démonstration", "médicaments, terminologies de soins (diagnostics et résultats infirmiers)"], ["Interrupteur", "avis de la HAS sur les consultations CIA et CIB"], ["Règles provisoires", "recalage des fréquences, passage sans prescription, relance d'un renouvellement, pansement neuraxial, cumuls des médicaments, déplacements, modalités du BSI, chute plaquettaire, écart au BSI, marge au lit, thèmes sensibles, terminal non synchronisé"], ["Contexte France", "jours fériés, vacances scolaires, vigilance, circulation, pollution, pollens"]]}, {"type": "h", "texte": "Provoquer une panne"}, {"type": "etapes", "items": ["Se connecter avec un profil qui gère les habilitations (HAB-33).", "Ouvrir Paramètres, puis Simulations (aussi par Ctrl K).", "Choisir le mode du service (par exemple « indisponible ») ou l'option de la règle.", "Rejouer le geste : le bandeau « Démonstration » compte les pannes en cours.", "Revenir à la normale par « Tout remettre à la normale »."]}, {"type": "code", "langage": "http", "texte": "PUT /simulation/sesam_vitale  {\"mode\": \"teletransmission_indisponible\"}\nPOST /simulation/reinitialiser"}, {"type": "p", "texte": "Une panne simulée rend 503 avec un motif lisible. Quelques déclencheurs par le nom restent actifs : un patient sans NIR donne un rejet R1, un nom contenant « rejet » un rejet R2, un nom contenant « ambigu » ou « echec » une réponse ambiguë ou un échec de l'INSi."}, {"type": "h", "texte": "Bancs"}, {"type": "code", "langage": "bash", "texte": "cd backend\nTABSANTE_DEV_AUTH=true uv run python -m scripts.banc_conformite   # services simulés : identité, SESAM-Vitale, DMP\nuv run python -m scripts.banc_cotation                             # moteur de cotation seul, sans base"}]}, {"id": "tech-configuration", "titre": "Configuration : variables d'environnement", "resume": "Les variables TABSANTE_* lues par l'API, leur rôle et leur valeur par défaut quand elle n'est pas secrète.", "mots_cles": ["configuration", "variables", "TABSANTE", "environnement", "pydantic-settings", "config.py"], "blocs": [{"type": "p", "texte": "Toutes les variables du serveur portent le préfixe « TABSANTE_ » et sont lues par « backend/app/config.py » (pydantic-settings, fichier « .env » accepté). Les valeurs secrètes ne figurent jamais dans le dépôt : elles se rangent dans le gestionnaire de secrets de l'hébergeur."}, {"type": "table", "entetes": ["Variable", "Défaut", "Rôle"], "lignes": [["DEV_AUTH", "false", "Mode développement : routes /dev, documentation /docs, jeton d'accès de 12 heures, secret JWT aléatoire par processus, origines locales 5173 et 5180"], ["ENV", "vide", "Nom de l'environnement ; toute valeur autre que dev, developpement, development, local ou test interdit DEV_AUTH"], ["MODE_DEMO", "suit DEV_AUTH", "Mode démonstration (registre des simulations, cartes simulées) ; refusé hors développement"], ["JWT_SECRET", "aucun", "Obligatoire hors développement : 32 caractères aléatoires au moins, sans le préfixe « dev- »"], ["CORS_ORIGINES", "aucune", "Liste JSON des origines admises ; hors développement, https seulement"], ["ACCES_MINUTES", "15", "Durée du jeton d'accès hors développement"], ["RAFRAICHISSEMENT_JOURS", "7", "Jeton de rafraîchissement glissant, à usage unique"], ["RAFRAICHISSEMENT_GRACE_SECONDES", "30", "Rejeu toléré du jeton précédent quand la réponse de rotation s'est perdue"], ["SESSION_JOURS_MAX", "30", "Durée maximale d'une session"], ["LIMITE_CONNEXIONS_MINUTE", "10 (300 en développement)", "Appels par minute et par adresse sur les routes sensibles, comptés en base"], ["DATABASE_URL", "base locale du conteneur (développement)", "Connexion de l'API ; rôle applicatif à moindre privilège hors développement"], ["DATABASE_URL_MIGRATION", "vide", "Propriétaire du schéma (Alembic, roles_db.py, tâche de nuit) ; vide : DATABASE_URL, en développement seulement"], ["ANCRE_FICHIER", "var/ancres_audit.jsonl", "Puits d'ancrage fichier, en ajout seul"], ["ANCRE_URL, ANCRE_URL_JETON", "vide", "Puits d'ancrage hors site ; ANCRE_URL obligatoire hors développement"], ["RETENTION_ACCES_JOURS", "365 (au moins 180)", "Conservation du journal des accès (provisoire, D-06)"], ["RETENTION_SESSIONS_JOURS", "365", "Purge des sessions closes"], ["RETENTION_DOSSIER_ANS, RETENTION_DOSSIER_AGE_MINIMAL", "20, 28", "Dossier signalé au terme, jamais supprimé automatiquement"], ["RETENTION_FICHIERS_ORPHELINS_JOURS", "30", "Purge des fichiers qu'aucune ligne ne cite"], ["RETENTION_TRAVAUX_POSTE_JOURS", "30", "Purge des travaux terminés de l'agent de poste"], ["ENROLEMENT_MINUTES", "10", "Validité d'un code d'enrôlement de terminal"], ["PHOTOS_DIR", "var/photos", "Fichiers chiffrés au repos : photos, PDF, ordonnances, BSI déposés"], ["STOCKAGE_TROUSSEAU", "var/kms/trousseau_stockage.json", "Trousseau du KMS local simulé (développement seulement)"], ["LECTEUR_ORDONNANCE", "rapidocr", "OCR local ; « factice » réservé au développement"], ["SEUIL_DIFFERE_MINUTES", "120", "Seuil de saisie différée (provisoire, D-04)"], ["ITINERAIRE_DETOUR, ITINERAIRE_VITESSE_KMH", "1,3 ; 25", "Itinéraire simulé (provisoire)"], ["HEURES_DEPART_TOURNEE", "matin 07:30, midi 11:30, soir 17:30, nuit 20:30", "Heure de départ de chaque moment"], ["POSITION_RETENTION_HEURES", "12", "Garde maximale de la position approximative d'un soignant en route"], ["FENETRE_HORAIRE_MIN, JOURNEE_REFERENCE_MIN", "30 ; 420", "Fenêtre autour d'une heure prescrite ; journée de référence des indicateurs (provisoires)"], ["CARTE_RESEAU", "false", "Active la météo, le radar et le trafic réels (sinon simulés)"], ["ITINERAIRE_URL", "vide", "Moteur d'itinéraire OSRM auto-hébergé ; vide : trajets simulés"], ["METEO_URL, RADAR_URL, TRAFIC_URL", "sources ouvertes documentées", "Adresses des sources réelles quand CARTE_RESEAU est vrai"], ["CONTEXTE_RESEAU, METEOFRANCE_CLE", "false ; vide", "Contexte France réel (fériés, vigilance…) ; clé du portail Météo-France pour la vigilance"], ["HORLOGE", "vide", "« HH:MM » : recale l'horloge de l'application ; développement et tests seulement"], ["OIDC_ISSUER", "vide", "Émetteur Keycloak (realm tabsante) : active la connexion OIDC ; vide, rien ne change"]]}, {"type": "p", "texte": "Variables des scripts d'exploitation : SAUVEGARDE_CLE, SAUVEGARDE_DIR, SAUVEGARDE_GARDER (défaut 7,4,12). Côté clients : VITE_API_URL, VITE_CARTE_STYLE, VITE_CARTE_ATTRIBUTION (poste fixe) ; API_URL, TUILES_URL, TUILES_ATTRIBUTION en « --dart-define » (terminal) ; TABSANTE_KIOSQUE en variable Gradle pour le mode kiosque."}, {"type": "note", "ton": "attention", "texte": "Jamais TABSANTE_DEV_AUTH=true sur un serveur exposé : l'API refuse d'ailleurs de démarrer avec lui dès qu'elle voit un signe de service (ENV de service, base distante, secret sans préfixe « dev- », ANCRE_URL posée, origine non locale)."}]}, {"id": "tech-base-donnees", "titre": "Base de données, migrations et immuabilité", "resume": "97 tables PostgreSQL, 57 migrations Alembic en une seule chaîne, un rôle applicatif sans droit de réécrire les preuves.", "mots_cles": ["base", "PostgreSQL", "migrations", "Alembic", "rôle applicatif", "immuabilité", "trigger", "interdit_modification"], "blocs": [{"type": "p", "texte": "Le modèle est déclaré dans « backend/app/models.py » (SQLAlchemy 2) : 97 tables au commit étudié. Identifiants UUID, horodatages à l'heure de Paris. Le schéma des liens entre entités est décrit dans « docs/conception/schema-des-liens.md »."}, {"type": "h", "texte": "Notions clés"}, {"type": "liste", "items": ["Fréquence, occurrence, acte réalisé : une prescription porte des fréquences ; le rythme engendre des occurrences datées par moment ; un passage signé crée un acte rattaché à son occurrence.", "Objet suivi : plaie, cathéter, stomie, sonde, épisode de pompe… ; ouverture, rang d'épisode, récidive, clôture.", "Données versionnées : chaque version d'une rubrique du dossier est gardée, rien n'est écrasé.", "Correction sans écrasement : une correction motivée ou une rectification s'ajoute ; lectures, courbes et cotation l'appliquent."]}, {"type": "h", "texte": "Migrations"}, {"type": "p", "texte": "57 fichiers de migration dans « backend/migrations/versions », une seule tête : 0045e (référentiel des listes). L'ordre suit « down_revision », pas le numéro du fichier : des lots parallèles sont rechaînés à la fusion."}, {"type": "etapes", "items": ["Créer une révision dont « down_revision » est la tête actuelle.", "Pendant une tournée, n'appliquer que des migrations additives ; une suppression de colonne se fait en deux versions.", "Une table immuable reçoit le déclencheur « interdit_modification ».", "Vérifier avec « scripts/verifier_tout » : migrations à neuf, dernière défaite puis rejouée, une seule tête."]}, {"type": "h", "texte": "Deux rôles de base"}, {"type": "table", "entetes": ["Rôle", "Variable", "Droits"], "lignes": [["Propriétaire du schéma", "TABSANTE_DATABASE_URL_MIGRATION", "Schéma, migrations, script des rôles, tâche de nuit, purges"], ["Rôle applicatif", "TABSANTE_DATABASE_URL", "Ni superutilisateur ni propriétaire ; ni UPDATE ni DELETE sur les tables immuables ; jamais TRUNCATE, ALTER ni session_replication_role"]]}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/roles_db.py   # crée ou remet en conformité le rôle applicatif (idempotent)"}, {"type": "p", "texte": "Au démarrage, hors développement, l'API refuse de tourner connectée en superutilisateur, en propriétaire ou avec un droit de réécriture sur le journal. Les migrations réappliquent d'elles-mêmes les droits du rôle applicatif aux tables nouvelles."}, {"type": "h", "texte": "Tables immuables"}, {"type": "p", "texte": "Actes signés, commentaires, photos, journal d'audit et ancres, corrections et rectifications, transmissions, données versionnées du dossier, documents produits et envoyés, prescriptions infirmières, résultats de biologie, versions de référentiel, signatures par carte, BSI déposés, entre autres. Le journal des accès refuse toute réécriture, propriétaire compris, et toute suppression de moins de 180 jours."}]}, {"id": "tech-api", "titre": "API : contrat et conventions", "resume": "Où trouver l'OpenAPI, comment s'authentifier, comment lire un refus, éviter un double envoi et suivre les changements en direct.", "mots_cles": ["API", "OpenAPI", "REST", "erreurs", "regle", "Idempotency-Key", "429", "SSE", "evenements", "types"], "blocs": [{"type": "p", "texte": "Le contrat est « docs/api/openapi.json » (OpenAPI produit par FastAPI, « TabSanté V2 API », version 0.1.0) : 360 chemins, 410 opérations, 419 schémas au commit étudié. Le plus gros groupe est « /patients » (107 opérations)."}, {"type": "liste", "items": ["Documentation interactive : « /docs » sur l'API lancée en mode développement ; fermée en configuration de service (/docs, /redoc et /openapi.json rendent 404).", "Types du poste fixe régénérés depuis le contrat : « cd web » puis « npm run types » (vers « src/api/schema.d.ts »).", "Les charges utiles du terminal sont contrôlées contre « docs/api/openapi.json » par ses tests."]}, {"type": "h", "texte": "Authentification des appels"}, {"type": "liste", "items": ["« Authorization: Bearer » et le jeton d'accès sur toutes les routes internes ; chaque requête relit la session, une révocation est donc immédiate.", "Portail externe : en-tête « X-Acces-QR » (jeton du QR) et jeton Pro Santé Connect.", "Agent de poste : authentification HTTP Basic (identifiant et secret d'appareil du poste enrôlé)."]}, {"type": "h", "texte": "Refus : un texte pour l'humain, un code pour la machine"}, {"type": "code", "langage": "python", "texte": "raise Refus(422, \"Numéro de lot à renseigner\", reg
