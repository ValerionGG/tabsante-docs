resume": "Chaque famille de fiche et ses blocs délicats.", "mots_cles": ["aide", "terminal"], "blocs": [{"type": "aides", "items": [{"id": "terminal-fiche-pansement", "ecran": "Fiche Pansement · infirmier seulement", "titre": "Le contenu de la fiche Pansement", "texte": "La fiche Pansement trace les gestes et produits (nettoyage, détersion, interface, recouvrement, bandage), l'état de la plaie et ses mesures. Un nettoyage et un recouvrement sont exigés ; le reste des gestes est facultatif. Saignement, douleur au soin et signes infectieux locaux se confirment à chaque passage.", "etapes": ["Cochez au moins un nettoyage et un recouvrement.", "Notez fibrine et exsudat purulent sur l'échelle, de « Absent » à « ++++ ».", "Si des signes infectieux sont présents, décrivez-les dans « Ce que vous observez ».", "Le jour d'une ablation prévue, indiquez le nombre d'agrafes ou de fils retirés.", "Soin incomplet : choisissez « Soin fait en partie » et dites ce qui n'a pas été fait."]}, {"id": "terminal-fiche", "ecran": "Fiche de soin", "titre": "Remplir et signer une fiche", "texte": "La fiche reprend du dernier passage ce qui décrit le soin ; les réponses du jour restent à donner. Chaque appui est enregistré en brouillon sur le téléphone. Tant qu'un champ obligatoire est vide, la barre du bas affiche « Il manque » et le bouton de signature reste inactif. Votre signature horodate le passage : il ne se modifie plus ensuite sur ce téléphone.", "etapes": ["Vérifiez ce qui est repris du dernier passage.", "Répondez à chaque question marquée « À renseigner ».", "Touchez « Il manque » pour aller au champ concerné.", "Maintenez le bouton de signature une seconde."]}, {"id": "terminal-fiche-injection", "ecran": "Fiche Injection · infirmier seulement", "titre": "Tracer une injection", "texte": "Une ligne par injection : type, produit, dose et unité, et le numéro de lot quand il est exigé. Type, produit, dose et lot sont repris du dernier passage, à vérifier sur la boîte ; la réponse et le site se donnent à chaque fois. Chaque ligne se dit « Faite » ou « Non faite » avec son motif. Les insulines et les anticoagulants injectables se tracent dans leur propre fiche.", "etapes": ["Vérifiez le produit, la dose et le lot sur la boîte.", "Répondez « Faite » ou « Non faite » pour chaque injection.", "Choisissez le site, ou touchez la suggestion de rotation.", "Complétez la surveillance ou la lecture quand le type les demande."]}, {"id": "terminal-fiche-anticoagulant", "ecran": "Fiche Anticoagulant · infirmier seulement", "titre": "Tracer un anticoagulant injectable", "texte": "Le bloc « Traitement » (classe, spécialité, visée, dosage en cours) est repris du dernier passage : vérifiez-le sur la boîte. Répondez « Injection faite ? » puis « Faite par » ; faite, l'injection demande la dose injectée et l'aspect local, « RAS » compris. Le saignement extériorisé se répond à chaque passage, « Aucun » ou « Constaté ». Une dose différente du dosage en cours ou un saignement demandent un commentaire.", "etapes": ["Vérifiez la classe, la spécialité et le dosage repris.", "Répondez « Injection faite ? » puis « Faite par ».", "Notez la dose, le site et l'aspect local.", "Répondez au saignement extériorisé.", "Renseignez la biologie de surveillance si vous l'avez."]}, {"id": "terminal-fiche-suivi-diabetique", "ecran": "Fiche Suivi diabétique · infirmier seulement", "titre": "Glycémie et insuline", "texte": "Saisissez la glycémie du passage, ou « Glycémie non faite… » avec son motif ; seule la méthode de mesure est reprise du dernier passage. Le bloc « Ce que propose le protocole » calcule la dose de chaque insuline à partir de la glycémie et du protocole transcrit. Répondez ensuite « Injection d'insuline à ce passage ? » ; une dose différente de la proposition demande un commentaire.", "etapes": ["Saisissez la glycémie en g/L.", "Lisez la dose proposée pour chaque insuline.", "Répondez Oui ou Non à l'injection.", "Pour chaque insuline, confirmez la dose et choisissez le site."]}, {"id": "terminal-fiche-parametres-vitaux", "ecran": "Fiche Paramètres vitaux", "titre": "Relever les constantes", "texte": "Relevez les constantes du passage : tension, pouls et respiration, température, saturation, poids et taille, douleur ; il en faut au moins une. Position, bras, méthodes, contexte d'oxygène et échelle de douleur sont repris du dernier relevé, jamais les valeurs. Une température demande sa méthode ; une SpO₂ demande « Air ambiant » ou « Sous oxygène ». Un écart de plus de 50 % avec le relevé précédent se confirme avant de signer.", "etapes": ["Saisissez les constantes mesurées, la systolique avec la diastolique.", "Précisez la méthode de température et l'oxygène.", "Confirmez un écart signalé, ou corrigez la mesure.", "Si rien n'a pu être mesuré, touchez « Relevé non réalisé… » et donnez le motif."]}, {"id": "terminal-fiche-prelevement", "ecran": "Fiche Prélèvement · infirmier seulement", "titre": "Tracer un prélèvement", "texte": "Une ligne par prélèvement : la voie, les examens et les tubes sont repris du dernier passage, et chaque tube se coche à nouveau. Chaque ligne se dit « Fait » ou « Non fait » avec son motif ; un prélèvement non fait peut se reporter en rendez-vous. Fait, il demande le contrôle d'identité puis l'étiquetage devant le patient, et le site, sauf voie centrale, selles, urine et hémocultures.", "etapes": ["Vérifiez la voie et les examens repris.", "Cochez chaque tube prélevé.", "Cochez l'identité déclinée, puis les tubes étiquetés.", "Choisissez le site et le nombre de tentatives.", "Indiquez le laboratoire destinataire."]}, {"id": "terminal-fiche-medicaments", "ecran": "Fiche Médicaments · infirmier seulement", "titre": "Distribuer les médicaments", "texte": "Choisissez d'abord l'origine de la distribution parmi ce qui est disponible pour le patient ; la saisie manuelle et « Selon ordonnance » se trouvent sous « Autre origine… ». Les lignes du traitement sont reprises, et chaque comprimé reste à répondre « Pris » ou « Non pris », avec un motif s'il n'est pas pris. Le pilulier préparé par vous et le pilulier de la pharmacie vérifié sont deux actes distincts.", "etapes": ["Choisissez l'origine de la distribution.", "Répondez « Pris » ou « Non pris » pour chaque ligne.", "Utilisez « Tout pris… » quand tout a été pris.", "Renseignez le patch et l'anticoagulant oral s'il y en a."]}, {"id": "terminal-fiche-soins-nursing", "ecran": "Fiche Nursing", "titre": "Tracer le passage de nursing", "texte": "La fiche trace l'hygiène et le confort, l'élimination, l'aide au repas, la prévention d'escarre et la mobilisation. Les zones d'appui, le produit, la texture et les aides sont repris du dernier passage. Trois réponses sont exigées à chaque passage : aide au repas oui ou non, prévention d'escarre oui ou non, et positionnement à la sortie. Une rougeur qui ne blanchit plus ou une phlyctène ouvre un bloc de signalement.", "etapes": ["Cochez la toilette et les soins faits.", "Ajoutez chaque change avec urines, selles et commentaire.", "Répondez à l'aide au repas et à la prévention d'escarre.", "Choisissez le positionnement à la sortie."]}, {"id": "terminal-fiche-perfusion-iv", "ecran": "Fiche Perfusion IV · infirmier seulement", "titre": "Passage sur une perfusion IV", "texte": "Les lignes en cours se débranchent ici, les nouvelles se branchent depuis « Brancher une ligne ». À chaque passage, répondez au point de ponction et au rinçage ; sur un cathéter à repère externe, saisissez le repère du jour. Le retrait du dispositif exige qu'aucune ligne ne reste branchée.", "etapes": ["Débranchez les lignes terminées et notez le volume restant.", "Branchez la nouvelle ligne en vérifiant l'étiquette.", "Répondez au point de ponction et au rinçage.", "Cochez les gestes faits sur le cathéter."]}, {"id": "terminal-fiche-perfusion-sc", "ecran": "Fiche Perfusion SC · infirmier seulement", "titre": "Passage sur une perfusion SC", "texte": "La fiche suit les sites sous-cutanés et les lignes qui y passent. À chaque passage, renseignez la tolérance du site (œdème, induration, rougeur, douleur) et l'écoulement ; une tolérance altérée demande un commentaire. Un site en place depuis plus de 72 h demande le motif de son maintien. Chaque ligne branchée se rattache à un site en place.", "etapes": ["Renseignez la tolérance du site et l'écoulement.", "Posez un site depuis « Poser un site », avec son dispositif.", "Retirez un site par « Retirer… » avec son motif.", "Branchez chaque ligne sur un site en place."]}, {"id": "terminal-fiche-stomie-digestive", "ecran": "Fiche Stomie digestive · infirmier seulement", "titre": "Soin de stomie digestive", "texte": "Le soin porte sur l'aspect de la stomie, la peau péristomiale et les effluents, puis sur l'appareillage. L'aspect, la peau, les effluents, la protection et la poche changée sont repris du dernier passage, visibles et modifiables. Le saignement péristomial et la douleur au soin se répondent à chaque passage, sous « À confirmer à chaque passage ».", "etapes": ["Vérifiez l'aspect, la peau et les effluents repris.", "Répondez au saignement et à la douleur au soin.", "Dites si la poche est changée.", "Signalez une nouvelle référence de matériel s'il y a lieu."]}, {"id": "terminal-fiche-stomie-urinaire", "ecran": "Fiche Stomie urinaire · infirmier seulement", "titre": "Soin de stomie urinaire", "texte": "Le soin porte sur l'aspect de la stomie, la peau péristomiale et l'aspect des urines, puis sur l'appareillage. Le saignement et la douleur se répondent à chaque passage. Avec des sondes à demeure, la perméabilité de chaque sonde est exigée. Une sonde obstruée ou déplacée, des urines troubles ou purulentes font proposer une notification au prescripteur, décidée au cabinet.", "etapes": ["Vérifiez l'aspect, la peau et les urines repris.", "Répondez au saignement et à la douleur au soin.", "Indiquez la perméabilité de chaque sonde.", "Dites si la poche est changée."]}, {"id": "terminal-fiche-soins-respiratoires", "ecran": "Fiche Soins respiratoires · infirmier seulement", "titre": "Soins respiratoires", "texte": "La fiche trace les actes au patient (aérosol, lavage d'un sinus, aspiration des sécrétions) et, le cas échéant, le soin de la trachéotomie ou de la CPAP. Chaque acte se dit fait ou non ; un aérosol demande son produit et sa tolérance. Le débit d'oxygène, la SpO₂ et la fréquence respiratoire se relèvent en Paramètres vitaux.", "etapes": ["Ajoutez les actes du passage depuis les puces.", "Vérifiez le produit et le dispositif repris.", "Répondez fait ou non, puis la tolérance.", "Sur trachéotomie ou CPAP, remplissez chaque bloc du soin."]}, {"id": "terminal-fiche-uro-genito-digestif", "ecran": "Fiche Uro-génito-digestif · infirmier seulement", "titre": "Actes uro-génito-digestifs", "texte": "Chaque acte du passage forme une ligne, ajoutée depuis « Ajouter un acte ». Chaque ligne se répond « Réalisé », ou « Non réalisé » avec son motif. Le passage sur une sonde à demeure demande sa perméabilité, sa fixation et si la poche est déclive. Le retrait clôture la sonde : elle ne se rouvre pas, et une repose ouvre un nouvel épisode.", "etapes": ["Ajoutez chaque acte fait à ce passage.", "Répondez à chaque ligne et complétez ses champs.", "Sur la sonde, répondez à la perméabilité, la fixation et la poche.", "Pour un retrait, maintenez « Retirer la sonde et signer »."]}, {"id": "terminal-fiche-nutrition-enterale", "ecran": "Fiche Nutrition entérale · infirmier seulement", "titre": "Passage de nutrition entérale", "texte": "La fiche suit la nutrition sur sa voie : sonde gastrique, gastrostomie, bouton ou jéjunostomie. À chaque passage, renseignez l'état du site et le rinçage, et sur sonde gastrique le repère externe du jour. Chaque administration se branche, puis se termine avec le volume réellement passé, ou reste non administrée avec son motif.", "etapes": ["Renseignez l'état du site et le rinçage.", "Saisissez le repère du jour sur sonde gastrique.", "Terminez la poche en cours et notez le volume passé.", "Ajoutez une ligne et branchez-la."]}, {"id": "terminal-fiche-consultation-infirmiere", "ecran": "Fiche Consultation infirmière · infirmier seulement", "titre": "Mener la consultation", "texte": "La consultation se remplit en six parties : motif, évaluation clinique, volet du motif, éducation et compétences, diagnostic infirmier et objectifs, actions et suivi. Pour signer, il faut au moins une évaluation clinique, un diagnostic infirmier avec un objectif daté, une action réalisée et une synthèse. Le compte rendu est pré-rédigé à la signature, puis relu et validé au cabinet.", "etapes": ["Notez la demande du patient, en ses mots.", "Cochez les données reprises que vous retenez.", "Posez un diagnostic infirmier et un objectif daté.", "Rédigez la synthèse avant de signer."]}, {"id": "terminal-fiche-pca-sedation", "ecran": "Fiche PCA et sédation · infirmier seulement", "titre": "Passage sur une PCA", "texte": "Le passage commence par la surveillance du patient, une fois pour toutes les pompes : sédation, respiration et douleur au repos, et la RASS dès qu'une pompe de sédation est en service. Pour chaque pompe, choisissez « Contrôler », « Renouveler », « Déposer » ou « Arrêter ». Un 3 en sédation ou en respiration, ou une RASS hors cible, exige de dire ce qui a été fait.", "etapes": ["Renseignez la sédation, la respiration et la douleur.", "Choisissez le geste de chaque pompe.", "Relevez les doses sur la pompe à bolus.", "Cochez « Patient mobilisé » et notez la douleur à la mobilisation."]}, {"id": "terminal-fiche-pse", "ecran": "Fiche PSE · infirmier seulement", "titre": "Passage sur un pousse-seringue", "texte": "Le passage porte sur chaque pompe de l'épisode, puis sur chaque voie en place. Pour une pompe en service, choisissez « Contrôler », « Renouveler », « Déposer » ou « Arrêter » ; le contrôle demande le débit affiché, le volume restant lu, les alarmes et l'alimentation. Une seringue ne porte qu'un produit : deux produits font deux pompes.", "etapes": ["Contrôlez chaque pompe en service.", "Relevez le volume restant et les alarmes.", "Renseignez la tolérance de chaque voie.", "Au renouvellement, saisissez le produit, la quantité, le volume et la vitesse."]}, {"id": "terminal-fiche-surveillance-neuropsy", "ecran": "Fiche Surveillance neuropsychiatrique · infirmier seulement", "titre": "Observer les troubles", "texte": "Quatre troubles se renseignent à chaque passage : comportement, langage, humeur et conscience. Pour chacun, choisissez l'intensité constatée, d'« Absent » à « Majeur », ou « Non évaluable… » avec un commentaire ; rien n'est repris, seul le constat précédent est rappelé. Une aggravation ou des idées de mort font proposer une notification après la signature, jamais envoyée sans vous.", "etapes": ["Choisissez l'intensité de chaque trouble.", "Cochez les qualificatifs d'un trouble présent.", "Ajoutez ce qui est rapporté, avec son auteur et son intensité.", "Si l'observation n'a pas pu se faire, touchez « Observation non réalisée… »."]}, {"id": "terminal-fiche-dialyse-peritoneale", "ecran": "Fiche Dialyse péritonéale · infirmier seulement", "titre": "Passage de dialyse péritonéale", "texte": "Le passage réunit les échanges, la séance de cycleur s'il y a lieu et la surveillance du passage. Chaque échange, fait par vous ou déclaré, demande le volume recueilli, l'aspect du liquide, le dialysat (produit et lot) et le volume injecté. Le passage porte au moins un geste : échange, séance, pansement, poids ou tension.", "etapes": ["« Échange fait par moi » ou un échange déclaré : ajoutez-le.", "Relevez les volumes et l'aspect du liquide.", "Branchez ou débranchez le cycleur avec ses bilans.", "Notez la tension, le poids et le pansement."]}, {"id": "terminal-fiche-analgesie-locoregionale", "ecran": "Fiche Analgésie locorégionale · infirmier seulement", "titre": "Séance sur un cathéter d'analgésie", "texte": "Sur un cathéter périnerveux, choisissez la nature du passage : « Séance » ou « Retrait du cathéter ». La liste « Séance du jour » montre chaque élément fait, à faire ou sans objet ; un appui y amène. Un signe de toxicité coché ouvre « Conduite à tenir » : arrêt de la pompe, protocole, appel de l'équipe ou du 15. Sur un cathéter neuraxial, le passage est une injection : contrôles avant, injection prescrite, puis surveillance après.", "etapes": ["Choisissez « Séance » ou « Retrait du cathéter ».", "Remplissez chaque élément marqué « à faire ».", "Tracez l'appel à l'équipe quand une anomalie le demande.", "Sur un signe de toxicité, ouvrez « Conduite à tenir »."]}, {"id": "terminal-fiche-seance-parcours", "ecran": "Séance de parcours · infirmier seulement", "titre": "Clore une séance de parcours", "texte": "La séance n'a pas de saisie clinique propre : ses éléments exigés se cochent par les fiches signées au même passage, le même jour et au même moment ; un appui ouvre la fiche qui les porte. « Clore la séance » reste inactif tant qu'un élément manque.", "etapes": ["Ouvrez la fiche d'un élément non tracé.", "Signez-la, puis revenez à la séance.", "Maintenez « Clore la séance »."]}]}]}]}, {"id": "poste-fixe", "titre": "Guide du poste fixe", "public": "cabinet", "pages": [{"id": "pf-connexion", "titre": "Connexion et profils de démonstration", "resume": "Entrer dans le poste fixe en choisissant un profil fictif ou la carte CPS simulée.", "mots_cles": ["connexion", "profil", "démonstration", "carte CPS", "code porteur", "déconnexion"], "blocs": [{"type": "p", "texte": "Le poste fixe est l’application web du cabinet, utilisée au bureau avec souris et clavier. Sans session valide, toute page renvoie vers l’écran « Choisissez votre profil »."}, {"type": "note", "ton": "info", "texte": "Trois chemins coexistent. Quand le cabinet a configuré Keycloak, « Se connecter avec TabSanté (Keycloak) » ouvre la page de connexion : identifiant et mot de passe, ou carte CPS par Pro Santé Connect (simulé aujourd’hui). En secours, un code de service remis par l’exploitation ouvre aussi une session. En développement, les profils fictifs de la démonstration restent proposés."}, {"type": "h", "texte": "Se connecter par Keycloak"}, {"type": "etapes", "items": ["Cliquez sur « Se connecter avec TabSanté (Keycloak) ».", "Sur la page « Connexion à TabSanté », saisissez votre identifiant et votre mot de passe, ou choisissez « Pro Santé Connect — carte CPS (simulée) ».", "Vous revenez sur « Aujourd’hui », à votre nom. TabSanté ouvre sa propre session ; la session Keycloak est refermée aussitôt."]}, {"type": "note", "ton": "info", "texte": "Le code de service « En secours : code de service » s’utilise quand Keycloak n’est pas joignable ou pas encore configuré : un code à usage unique, émis par l’exploitation, ouvre la session de l’intervenant qu’il désigne."}, {"type": "h", "texte": "Se connecter"}, {"type": "etapes", "items": ["Ouvrez le poste fixe : l’écran « Choisissez votre profil » s’affiche avec le nom du cabinet de démonstration.", "Choisissez un intervenant dans la liste « Intervenants du cabinet » : vous entrez sans carte.", "Ou bien, dans le cadre « Se connecter avec ma carte CPS (simulée) », choisissez une carte de démonstration et saisissez son code porteur.", "Vous arrivez sur « Aujourd’hui »."]}, {"type": "h", "texte": "Les profils du cabinet fictif"}, {"type": "table", "entetes": ["Profil", "Rôle"], "lignes": [["Claire Martin", "Infirmière (IDE)"], ["Paul Durand", "Infirmier (IDE)"], ["Inès Petit", "Aide-soignante (AS)"], ["Lucie Vidal", "Infirmière remplaçante, habilitation bornée sur la tournée Centre le midi"]]}, {"type": "p", "texte": "Les patients de la démonstration sont fictifs : M. Dupuis, Mme Lefèvre, M. Bernard et Mme Moreau, entre autres."}, {"type": "h", "texte": "Se déconnecter"}, {"type": "p", "texte": "Le bouton de sortie est en bas de la barre latérale, à côté de votre nom. Il ferme la session du poste ; la session reste aussi révocable depuis « Paramètres › Sessions »."}, {"type": "note", "ton": "attention", "texte": "Trois codes porteurs faux bloquent une carte CPS de démonstration jusqu’à sa remise à la normale dans « Paramètres › Simulations »."}]}, {"id": "pf-navigation-recherche", "titre": "Navigation et recherche Ctrl K", "resume": "La barre latérale groupe les pages selon vos droits ; la palette Ctrl K cherche dans tout le cabinet.", "mots_cles": ["barre latérale", "navigation", "Ctrl K", "palette", "recherche", "raccourci", "badge"], "blocs": [{"type": "p", "texte": "La barre latérale est la même sur toutes les pages. Elle ne montre que les pages que votre profil a le droit d’ouvrir : une entrée sans droit disparaît, un groupe vide aussi."}, {"type": "table", "entetes": ["Groupe", "Pages"], "lignes": [["(en tête)", "Aujourd’hui, Tableau de bord"], ["Soins", "Patients, Tournées, Plaies"], ["Coordination", "Transmissions, Signalements, Bilans, Accès externes, Télésanté, Échanges de santé"], ["Gestion", "Preuves et cotations (ou Preuves des soins), Facturation, Saisies différées, Rappel de lot"], ["Ressources (repliable)", "Savoir-faire, Référentiels, Relecture, Paramètres"]]}, {"type": "p", "texte": "Des pastilles signalent ce qui attend : éléments à traiter sur « Aujourd’hui », transmissions non lues et mentions « @ » sur « Transmissions », signalements à décider, bilans à rédiger, saisies différées à valider. La cloche des notifications est sous la navigation."}, {"type": "note", "ton": "info", "texte": "L’administrateur non soignant du cabinet ne voit ni « Patients », ni « Plaies », ni « Signalements », ni « Preuves », ni « Télésanté » : il n’a pas accès au dossier clinique."}, {"type": "h", "texte": "Chercher avec la palette"}, {"type": "etapes", "items": ["Appuyez sur Ctrl K (ou sur « / » hors d’un champ de saisie), ou cliquez sur « Rechercher » en haut de la barre latérale.", "Tapez quelques lettres. La palette ignore les accents et accepte plusieurs mots.", "Dès deux caractères, elle cherche aussi au serveur dans tout le cabinet : patients, documents, transmissions, ordonnances et tournées que vous pouvez déjà lire.", "Choisissez un résultat avec les flèches puis Entrée, ou à la souris. Échap ferme la palette."]}, {"type": "p", "texte": "Sans texte, la palette propose les premiers patients et des actions : « Nouveau patient », « Nouvelle tournée », « Planning de la semaine », « Savoir-faire ». Elle atteint aussi les soins récents d’un patient, ses plaies ouvertes, ses objets suivis et son dossier de preuve."}, {"type": "note", "ton": "attention", "texte": "Chaque patient atteint par une recherche est noté au journal des accès. Le texte cherché, lui, n’est jamais journalisé."}]}, {"id": "pf-aujourdhui", "titre": "Aujourd’hui", "resume": "La page d’accueil : ce qui demande une action, le prochain passage, les tournées et les plaies du jour.", "mots_cles": ["aujourd’hui", "accueil", "à traiter", "tournées du jour", "rappels", "à préparer", "suggestions"], "blocs": [{"type": "p", "texte": "« Aujourd’hui » s’ouvre après la connexion. Le sous-titre résume la journée : nombre de tournées, passages prévus et passages signés."}, {"type": "h", "texte": "Ce que montre la page"}, {"type": "liste", "items": ["« À traiter » : la liste des actions, filtrable en « Tout », « Soins » ou « Facturation ». Le nom d’un patient ouvre son aperçu à côté de la liste, sans la quitter.", "« Contexte du jour » : jours fériés, vacances scolaires, vigilance météo, qualité de l’air, circulation ; les données simulées sont marquées comme telles.", "Le prochain passage de votre tournée.", "« Suggestions » : des pistes expliquées, jamais exécutées sans vous.", "« À préparer » (infirmier et aide-soignant) : les prérequis à confirmer pour les passages du jour et du lendemain.", "« Tournées du jour » : par tournée et par moment, la jauge des passages signés et les soins prévus.", "« Rappels du jour » : les rappels datés échus et encore ouverts.", "« Plaies en cours » : chaque plaie avec son jour J+, sa mini-courbe et son évolution depuis J0."]}, {"type": "h", "texte": "Traiter une ligne"}, {"type": "etapes", "items": ["Lisez la ligne : une tuile de couleur dit sa nature (passage non réalisé, signalement, bilan, cotation, terminal muet…).", "Cliquez sur le bouton de la ligne : il ouvre la bonne page.", "Pour un passage manqué, « Déclarer le motif » ouvre la déclaration du passage non réalisé, sans quitter la page.", "Pour un terminal resté sans synchronisation pendant une tournée, « Appeler » ou « Marquer comme vu »."]}, {"type": "note", "ton": "info", "texte": "L’alerte « terminal non synchronisé » suit une règle provisoire : au-delà de 2 heures de silence pendant une tournée en cours, réglable dans « Paramètres › Simulations ». Elle ne dit rien d’un patient ni de la position du soignant."}, {"type": "p", "texte": "Le bouton « Nouveau patient » en haut à droite ouvre la création d’un dossier."}]}, {"id": "pf-tableau-de-bord", "titre": "Tableau de bord", "resume": "La vue du cabinet sur une période : récit de la semaine, suivi des patients, échéances et vérifications.", "mots_cles": ["tableau de bord", "période", "semaine", "indicateurs", "suivi", "échéances", "export CSV", "BSI"], "blocs": [{"type": "p", "texte": "Le tableau de bord raconte une période : « Aujourd’hui », « Semaine » (par défaut) ou « Mois ». Un filtre limite la vue à une tournée ; il reste dans l’adresse de la page."}, {"type": "h", "texte": "Les sections"}, {"type": "liste", "items": ["Le récit de la période : une phrase de synthèse, la carte « Quand passez-vous chez vos patients » (heure × jour), les objectifs de la période, sans classement entre personnes, et « Cicatrisation, plaie par plaie ».", "Les indicateurs de tournée : tuiles cliquables qui pilotent le graphique.", "« Suivi des patients » : dernière valeur, dernières mesures et évolution (plaies, glycémies…), avec les bornes prescrites.", "« Nursing et forfaits » : BSI à renouveler, journées servies sans forfait valide, écart au BSI.", "« Soins à compléter », « Résultats attendus », « Pièces manquantes » (horaires prescrits sans ordonnance jointe, séjours HAD sans lettre de mission).", "« Ce qui vous attend », « Échéances proches », « Passages non réalisés », « Interpellations », « Signalements de l’aide-soignante ».", "« Avant le prochain envoi » : les vérifications qui précèdent la facturation, pour qui voit la cotation."]}, {"type": "h", "texte": "Exporter"}, {"type": "p", "texte": "Le bouton « Exporter » télécharge les sections visibles en fichier CSV."}, {"type": "note", "ton": "info", "texte": "Les sections suivent votre profil : l’aide-soignant ne voit ni cotation ni résultat attendu ; l’administration non soignante n’a pas le suivi clinique."}, {"type": "note", "ton": "attention", "texte": "Les cotations affichées sont celles du moteur de démonstration : aucune facture n’est télétransmise."}]}, {"id": "pf-patients", "titre": "Patients : la liste et la création d’un dossier", "resume": "Retrouver un patient, créer un dossier à la main ou depuis la carte Vitale simulée.", "mots_cles": ["patients", "liste", "nouveau patient", "carte Vitale", "INS", "doublon", "création"], "blocs": [{"type": "p", "texte": "La page « Patients » liste les dossiers du cabinet. Chaque ligne montre l’identité, l’état de l’INS (qualifiée, récupérée ou provisoire) et les contextes de prise en charge. Un patient décédé porte la mention « Dossier conservé, plus aucun soin prévu »."}, {"type": "p", "texte": "Le champ « Filtrer par nom ou prénom » réduit la liste ; « Ouvrir » mène au dossier."}, {"type": "h", "texte": "Créer un patient à la main"}, {"type": "etapes", "items": ["Cliquez sur « Nouveau patient ».", "Saisissez le nom de naissance, le premier prénom de naissance, la date de naissance, le sexe et le lieu de résidence ; allergies, contacts et couverture sont facultatifs.", "Validez : les téléservices d’identité, de droits et d’INS sont interrogés d’office (simulés). L’identité reste provisoire jusqu’à sa qualification.", "Si une identité ressemblante existe, elle vous est présentée avant d’ouvrir le dossier : elle n’est jamais fusionnée sans votre décision."]}, {"type": "h", "texte": "Créer un patient depuis sa carte Vitale"}, {"type": "etapes", "items": ["Cliquez sur « Carte Vitale ».", "Choisissez une carte de démonstration : identité et couverture sont lues sur la carte.", "Les droits puis l’INS sont demandés aux téléservices simulés, dans cet ordre, et le dossier est créé."]}, {"type": "note", "ton": "attention", "texte": "Lecteur de carte, carte Vitale et téléservices sont simulés en démonstration : aucun appel ne part vers l’Assurance maladie."}]}, {"id": "pf-dossier-patient", "titre": "Le dossier patient et ses onglets", "resume": "Six onglets regroupent toutes les vues d’un patient, de la synthèse aux droits.", "mots_cles": ["dossier patient", "onglets", "synthèse", "soins", "prescriptions", "coordination", "documents", "identité"], "blocs": [{"type": "p", "texte": "Le dossier s’ouvre sur sa « Synthèse ». Son en-tête reste visible : identité, alertes, mentions comme « Hors HAD » ou « Opposé au DMP », et les actions « Nouvelle prescription » et « Dossier de preuve »."}, {"type": "table", "entetes": ["Onglet", "Vues"], "lignes": [["Synthèse", "À savoir avant le soin, soins et dispositifs en cours, derniers passages, frise de soins"], ["Soins et plaies", "Soins, Plaies, Passages, Bilans/Consultation, Résultats, Seuils et traitement"], ["Prescriptions", "Prescriptions et plan de soins, Prescriptions infirmières, Prise en charge"], ["Coordination", "Transmissions, Parcours, Partage externe, Actes à distance, Échanges de santé"], ["Documents", "Registre des documents du patient"], ["Dossier administratif", "Identité, Antécédents et contacts, Droits du patient"]]}, {"type": "h", "texte": "Quelques gestes courants"}, {"type": "liste", "items": ["Ouvrir le suivi d’un soin : onglet « Soins et plaies », vue « Soins », puis le soin voulu.", "Déclarer un séjour HAD, un accord préalable ou lire les compteurs de cotation : vue « Prise en charge ».", "Déclarer un contexte (chimiothérapie, forfait BSI), un épisode de soins ou prendre un rendez-vous de soin : vue « Parcours ».", "Saisir les seuils prescrits, le débit d’oxygène prescrit, les résultats de biologie, la ligne de traitement : vues « Résultats » et « Seuils et traitement »."]}, {"type": "note", "ton": "info", "texte": "Toute modification d’une donnée du dossier crée une version : l’historique reste consultable."}, {"type": "note", "ton": "attention", "texte": "Les antécédents et le dossier de preuve sont réservés aux infirmiers. L’administration non soignante ne lit que l’identité."}]}, {"id": "pf-identite-deces", "titre": "Identité, INS, doublons et décès", "resume": "Qualifier l’identité, trancher les divergences et les doublons, déclarer un décès.", "mots_cles": ["identité", "INS", "INSi", "pièce d’identité", "doublon", "divergence", "décès", "fusion"], "blocs": [{"type": "p", "texte": "La vue « Identité » (onglet « Dossier administratif ») tient l’identité de référence, la vérification sur pièce, les téléservices, les divergences, les doublons possibles et le décès."}, {"type": "h", "texte": "Qualifier l’INS"}, {"type": "etapes", "items": ["Vérifiez une pièce d’identité du patient et notez-la dans « Vérification sur pièce ».", "Interrogez l’INSi : l’INS récupérée est alors qualifiée.", "Si l’identité du dossier change ensuite, une nouvelle vérification sur pièce est demandée."]}, {"type": "note", "ton": "info", "texte": "Une INS récupérée par l’INSi n’est qualifiée qu’après le contrôle d’une pièce d’identité."}, {"type": "h", "texte": "Divergences et doublons"}, {"type": "liste", "items": ["Quand une source contredit le dossier, une divergence s’ouvre : vous choisissez la valeur, rien n’est écrasé.", "Un doublon possible se compare champ par champ. « Même personne : fusionner » rattache soins, prescriptions et épisodes au dossier conservé ; « Personnes différentes » garde deux dossiers et ne repropose plus le rapprochement.", "Chaque décision est tracée au journal, avec votre nom."]}, {"type": "h", "texte": "Déclarer un décès"}, {"type": "etapes", "items": ["Cliquez sur « Déclarer le décès ».", "Saisissez la date du décès et qui a donné l’information.", "Confirmez : à partir de cette date, les passages sont retirés des tournées et les fréquences arrêtées ; objets suivis, parcours et rappels se closent ; les accès QR sont révoqués ; les soignants de ses tournées sont notifiés.", "Le dossier est conservé ; les actes déjà signés restent."]}, {"type": "p", "texte": "Une déclaration faite par erreur s’annule avec un motif (« Annuler la déclaration de décès »). Ce qu’elle avait arrêté le reste : fréquences, objets suivis et parcours se reprogramment un à un."}]}, {"id": "pf-ordonnances-frequences", "titre": "Ordonnances, prescriptions et fréquences", "resume": "Verser une ordonnance, valider sa lecture, créer les fréquences et les modifier en cours de route.", "mots_cles": ["ordonnance", "lecture", "OCR", "prescription", "fréquence", "aperçu des passages", "modifier", "arrêter", "horaires prescrits"], "blocs": [{"type": "p", "texte": "Tout part de l’ordonnance. Dans le dossier, vue « Prescriptions et plan de soins », le panneau « Ordonnances sources » garde les documents versés, et le « Plan de soins » montre prescriptions, fréquences et protocoles en vigueur."}, {"type": "h", "texte": "Verser et lire une ordonnance"}, {"type": "etapes", "items": ["Cliquez sur « Verser une ordonnance », choisissez le document (JPEG, PNG ou PDF) et sa nature (ordonnance ou protocole), puis « Verser le document ».", "Lancez la lecture : elle produit une proposition affichée à côté du document (prescripteur, date, durée, actes, rythme, traitement à distribuer).", "Relisez et corrigez, choisissez la tournée des fréquences, puis « Valider la proposition ». Chaque écart entre la proposition et le validé est conservé.", "Si le document ne convient pas (illisible, autre patient, périmé), « Rejeter la proposition » avec un motif."]}, {"type": "note", "ton": "attention", "texte": "Une ordonnance au nom d’un autre patient est refusée : rejetez la lecture et versez l’ordonnance dans le bon dossier."}, {"type": "h", "texte": "Saisir une prescription à la main"}, {"type": "p", "texte": "« Nouvelle prescription » : prescripteur, nature (de ville ou hospitalière), dates, mention des soins à domicile, durée, renouvellements, dimanches et jours fériés, document source et actes prescrits."}, {"type": "h", "texte": "Créer une fréquence et voir l’aperçu des passages"}, {"type": "etapes", "items": ["Depuis une prescription, créez une fréquence (ou une matrice soin × moment) : cadence, jours fixes, moments, horaires prescrits et mention de l’ordonnance.", "L’« Aperçu des passages » liste les passages produits : jour, moment, soin, tournée, intervenant.", "Il signale les conflits (personne d’attribué, intervenant absent, heure fixe déjà prise…) et les avertissements (domicile hors zone).", "Sans conflit, « Valider ». Avec conflit, « Valider quand même » exige un motif, tracé au journal."]}, {"type": "note", "ton": "info", "texte": "Un horaire de nuit (20 h à 6 h) retient le moment « nuit ». Un horaire prescrit sans ordonnance jointe est signalé, sans bloquer le soin : « Joindre l’ordonnance » le lève."}, {"type": "h", "texte": "Modifier ou arrêter un soin"}, {"type": "liste", "items": ["« Modifier » (vue « Soins ») : la fréquence actuelle s’arrête la veille et une nouvelle prend la suite ; les passages déjà signés gardent leur horaire.", "« Arrêter ce soin » : un écran montre les conséquences (passages à venir retirés, historique conservé) et demande un motif."]}]}, {"id": "pf-tournees", "titre": "Tournées et planning", "resume": "Créer les tournées, attribuer les moments, planifier le jour en colonnes, gérer absences et échanges.", "mots_cles": ["tournées", "planning", "planification", "attribution", "absence", "indisponibilité", "échange", "réattribuer", "répéter ce service", "indicateurs"], "blocs": [{"type": "p", "texte": "La page « Tournées et planning » s’ouvre sur « Itinéraire et carte ». Cinq vues sont à un clic : « Planning », « Vue du jour », « Itinéraire et carte », « Prévisionnel et échéances », « Indicateurs »."}, {"type": "h", "texte": "Créer une tournée et attribuer ses moments"}, {"type": "etapes", "items": ["Cliquez sur « Nouvelle tournée », nommez-la (par exemple « Tournée Nord ») et « Créer la tournée ».", "Dans la vue « Planning », attribuez chaque moment (matin, midi, soir, nuit) à un intervenant, avec une date de début et une date de fin facultative.", "« Répéter ce service » reporte une attribution courte toutes les n semaines jusqu’à une date ; les semaines déjà tenues ou d’absence sont écartées."]}, {"type": "note", "ton": "info", "texte": "Une attribution qui recouvre une absence est refusée. Une formation manquante (PCA, cathéter périnerveux…) est signalée avant d’enregistrer, sans bloquer : « Attribuer quand même »."}, {"type": "h", "texte": "Planifier la journée en colonnes"}, {"type": "p", "texte": "En tête de la vue « Planning », « Planification du jour » montre une colonne par intervenant présent, avec sa charge, et une colonne « À attribuer ». Déplacez un passage à la souris, au doigt ou au clavier : la charge se recalcule, puis « Valider le déplacement »."}, {"type": "h", "texte": "Absences et tournées à couvrir"}, {"type": "etapes", "items": ["Dans « Indisponibilités », « Déclarer une indisponibilité » : intervenant, dates, motif facultatif, moments, éventuellement « Revient chaque semaine ».", "Le planning de la semaine signale alors les tournées « À couvrir ».", "Le planning propose des collègues du même rôle, disponibles d’abord, titulaires avant remplaçants : la réattribution se fait en un clic."]}, {"type": "note", "ton": "info", "texte": "Le motif d’une absence ne se lit que par l’intéressé et par qui organise les tournées ; les autres voient « indisponible »."}, {"type": "h", "texte": "Échanges de tournée"}, {"type": "p", "texte": "« Proposer un échange » : cession sans contrepartie ou échange d’un de vos moments contre un des siens. Le collègue sollicité accepte ou refuse ; le planning suit sa réponse."}, {"type": "h", "texte": "Les autres vues"}, {"type": "liste", "items": ["« Vue du jour » : les soins dus par tournée, avec « Réattribuer » et « Non réalisé ».", "« Prévisionnel et échéances » : les passages dus jour par jour sur un horizon choisi.", "« Indicateurs » : kilomètres, trajets, soins, remplissage, passages prévus, réalisés et non réalisés, pour le cabinet ou un intervenant ; aucun montant."]}]}, {"id": "pf-itineraire-carte", "titre": "Itinéraire et carte, préparer demain", "resume": "Ordonner les domiciles, fixer des heures, lire les arrivées estimées et valider la tournée du lendemain.", "mots_cles": ["itinéraire", "carte", "ordre de passage", "proposer un ordre", "heure fixe", "avant d’arriver", "préparer demain", "météo", "trafic", "accès au domicile"], "blocs": [{"type": "p", "texte": "La vue « Itinéraire et carte » montre, pour une tournée, une date et un moment, la carte des domiciles et la liste ordonnée des passages, avec départ, distance, trajets, soins, attente, arrivée estimée et fin estimée."}, {"type": "h", "texte": "Régler l’ordre de passage"}, {"type": "etapes", "items": ["Glissez un domicile pour le déplacer, ou utilisez les flèches.", "Ou cliquez sur « Proposer un ordre » : l’ordre proposé respecte les heures fixes et les heures prescrites, mais il n’est pas enregistré.", "Choisissez « Appliquer à ce jour », « Appliquer et garder par défaut » ou « Garder l’ordre actuel »."]}, {"type": "p", "texte": "« Et si c’était moi ? » refait l’estimation avec les durées de soin d’un autre intervenant."}, {"type": "h", "texte": "Le panneau « Avant d’arriver »"}, {"type": "p", "texte": "Pour chaque domicile : accès au domicile (digicode, étage, consignes, « Vit seul »), photo de l’entrée, repère sur la carte, heure fixe (« Fixer » ou « Retirer l’heure fixe »), météo et trafic, « À préparer », matériel à emporter et dernier passage."}, {"type": "note", "ton": "info", "texte": "Les accès au domicile restent propres au cabinet : ils ne sont jamais partagés hors du cabinet."}, {"type": "h", "texte": "Préparer demain"}, {"type": "etapes", "items": ["Cliquez sur « Préparer demain ».", "Lisez l’ordre proposé face à l’ordre actuel, la durée totale, la fin estimée, la distance et les alertes (météo, absence, heure intenable, domicile hors zone).", "Vérifiez « À préparer la veille ».", "Choisissez « Valider l’ordre proposé » ou « Valider l’ordre actuel ». Valide qui tient la tournée ce jour-là, ou qui organise les tournées."]}, {"type": "note", "ton": "attention", "texte": "Géocodage, trajets, météo, trafic et radar de pluie sont simulés : les heures estimées sont un ordre de grandeur, jamais une consigne. Aucun rappel n’est envoyé au patient."}]}, {"id": "pf-plaies", "titre": "Plaies et vue d’une plaie", "resume": "Suivre toutes les plaies du cabinet, lire la courbe et comparer les photos d’une plaie.", "mots_cles": ["plaies", "cicatrisation", "J0", "surface", "volume", "photos", "comparaison", "accès direct", "escarre"], "blocs": [{"type": "p", "texte": "La page « Plaies » liste les plaies du cabinet : patient, plaie, épisode, dernière valeur, date de mesure, évolution depuis J0 et état du suivi (« Mesures à jour » ou non)."}, {"type": "h", "texte": "La vue d’une plaie"}, {"type": "liste", "items": ["La courbe d’évolution, en surface ou en volume, depuis J0.", "Les phases de cicatrisation et l’ouverture de l’épisode, figée : rectifiable avec un motif jusqu’au deuxième passage signé.", "« Photos de la série » : choisissez les clichés à comparer.", "Les passages signés : fibrine, saignement, aspect purulent, cotation, état et dossier de preuve de chaque passage.", "« Imprimer la fiche »."]}, {"type": "h", "texte": "Où s’ouvre une plaie"}, {"type": "liste", "items": ["Le plus souvent au terminal, au domicile du patient.", "Au poste fixe, un infirmier peut ouvrir une « Plaie en accès direct » (non chirurgicale, sans ordonnance) depuis la vue « Plaies » du dossier.", "Depuis la page d’un dispositif, « Ouvrir une plaie sur le site » : le pansement du dispositif est alors délégué à la plaie jusqu’à sa clôture."]}, {"type": "note", "ton": "info", "texte": "Pour un patient diabétique insulino-traité, l’état est lu au dossier et transmis avec chaque pansement : il n’est jamais ressaisi."}]}, {"id": "pf-fiches-soin", "titre": "Les fiches de soin au poste fixe", "resume": "Où lire chaque famille de soin : la vue du soin ou la page de l’objet suivi.", "mots_cles": ["fiches", "soins", "injections", "diabète", "constantes", "nursing", "médicaments", "anticoagulant", "prélèvements", "respiratoire", "neuropsychiatrique", "uro-génito-digestif"], "blocs": [{"type": "p", "texte": "Les soins se signent au terminal, au domicile. Le poste fixe sert à les lire, à transcrire ce qui vient du prescripteur (protocoles, seuils, posologies) et à produire les bilans. Chaque soin s’ouvre depuis le dossier, onglet « Soins et plaies », vue « Soins »."}, {"type": "table", "entetes": ["Famille", "Où la lire", "Ce qu’on y trouve"], "lignes": [["Injections", "Vue du soin", "Historique des injections, rotation des sites sur 30 jours, numéro de lot"], ["Suivi diabétique", "Vue du soin", "Glycémies et doses, HbA1c, compteurs, historique sur 30 jours, protocole d’insuline versionné"], ["Paramètres vitaux", "Vue du soin", "Relevés, épreuves de lever, cadre du relevé, O₂ prescrit, seuils, courbes de croissance de l’enfant"], ["Anticoagulant injectable", "Vue du soin", "Surveillance biologique, paliers de dosage, injections"], ["Médicaments", "Vue du soin", "Traitement, pilulier, dispositifs transdermiques, bloc anticoagulant oral (posologie de la semaine, INR)"], ["Nursing", "Vue du soin", "Soins par passage, profil de dépendance, forfait BSI, signalements de l’aide-soignante"], ["Prélèvements", "Vue du soin", "Historique, compteurs, saignées (ferritinémie, tensions, volume)"], ["Uro-génito-digestif", "Vue du soin et objet suivi", "Relevé d’élimination, sonde urinaire, cystostomie, éducation à l’autosondage"], ["Soins respiratoires", "Vue du soin et objet suivi", "Aérosols, trachéotomie, CPAP"], ["Surveillance neuropsychiatrique", "Vue du soin", "Observations, état habituel du patient, alertes proposées"], ["Perfusions IV et SC, stomies, nutrition entérale, PSE, PCA, dialyse péritonéale, analgésie locorégionale", "Page de l’objet suivi", "Voir la page « Dispositifs et objets suivis »"], ["Pansements", "Page de la plaie", "Voir la page « Plaies »"], ["Bilans/Consultation (fiche 24)", "Vue « Bilans/Consultation »", "Voir la page « Consultations et parcours »"]]}, {"type": "h", "texte": "Ce que chaque vue de soin propose aussi"}, {"type": "liste", "items": ["Le signal de changement de prescription, en bandeau « avant / après ».", "Les commentaires par champ, le plus récent en tête.", "Pour les injections, l’insuline et l’anticoagulant : la série des sites du patient, toutes fiches confondues ; un site sur-employé se signale, il ne se bloque pas."]}, {"type": "note", "ton": "info", "texte": "Une constante n’est jamais ressaisie dans une autre fiche : poids, tension ou température sont lus depuis les paramètres vitaux."}]}, {"id": "pf-dispositifs", "titre": "Dispositifs et objets suivis", "resume": "Poser un dispositif, lire sa page, le clôturer avec son écran de conséquences.", "mots_cles": ["dispositif", "objet suivi", "perfusion", "PICC", "stomie", "sonde", "PSE", "PCA", "dialyse", "analgésie", "trachéotomie", "CPAP", "clôture"], "blocs": [{"type": "p", "texte": "Un objet suivi est le dispositif ou le traitement dont on suit l’évolution : cathéter IV ou SC, stomie, nutrition entérale, sonde urinaire, cystostomie, trachéotomie, CPAP, cathéter de dialyse, cathéter d’analgésie, épisode PSE ou PCA."}, {"type": "h", "texte": "Poser un dispositif"}, {"type": "etapes", "items": ["Dans le dossier, vue « Soins », cliquez sur « Poser un dispositif ».", "Choisissez le dispositif et sa prescription d’origine (créez-la d’abord s’il n’y en a pas).", "Renseignez les champs d’ouverture : site, modèle, protocole écrit le cas échéant, « Installé par l’HAD » si c’est le cas, quantités prescrites pour l’appareillage.", "Cliquez sur « Ouvrir le dispositif ». Les champs d’ouverture sont ensuite figés."]}, {"type": "note", "ton": "info", "texte": "Une voie veineuse périphérique ne s’ouvre pas au poste fixe : sa pose est le geste horodaté et signé au terminal. Pompes et seringues des PSE et PCA se décrivent au premier passage, au terminal."}, {"type": "h", "texte": "La page d’un objet suivi"}, {"type": "liste", "items": ["Perfusions : voies d’abord, lignes de perfusion, débit et volume, surveillance du cathéter, sites sous-cutanés.", "Stomies : appareillage, consommation face au prescrit semaine par semaine, peau péristomiale, éducation.", "PSE et PCA : pompes et réservoirs, surveillance (RASS, sédation, respiration), registre des stupéfiants, moment de la séance du jour.", "Dialyse péritonéale : ultrafiltration par cycle de 24 heures, tension, poids, bilans des cycles, changement de modalité.", "Analgésie locorégionale : douleur, bolus, pompe prescrite, fiche de suivi postopératoire à pré-rédiger.", "Trachéotomie et CPAP : changements de canule, sécrétions, observance, pression prescrite à reporter."]}, {"type": "h", "texte": "Clôturer"}, {"type": "etapes", "items": ["Cliquez sur « Clôturer le dispositif ».", "Lisez les conséquences : passages retirés des tournées, historique conservé.", "Choisissez le motif et la date ; dites si le dispositif est retiré (« clôturer n’est pas retirer ») et le devenir des appareils.", "Pour une stomie, une transmission ciblée est proposée avec des destinataires pré-cochés : gardez-en un, ou écartez l’envoi avec un motif."]}, {"type": "note", "ton": "attention", "texte": "Une prescription de pompe ou de pression se « reporte » depuis le logiciel : l’appareil se règle selon le protocole ou par le prestataire, jamais depuis TabSanté."}]}, {"id": "pf-transmissions", "titre": "Transmissions, mentions et signalements", "resume": "Écrire et lire les transmissions, traiter les interpellations, décider des signalements de l’aide-soignante.", "mots_cles": ["transmissions", "ciblée", "intra-cabinet", "externe", "interpellation", "mention", "@", "requalifier", "signalement", "aide-soignante"], "blocs": [{"type": "p", "texte": "La page « Transmissions » réunit trois registres : « Ciblées », « Intra-cabinet » et « Externes » (ce dernier pour les infirmiers). Filtres : patient, « Non lues », « Requalifiées », « Me mentionnant »."}, {"type": "table", "entetes": ["Registre", "Pour quoi", "Qui écrit"], "lignes": [["Ciblée", "Message clinique structuré sur un patient (cible, données, actions, résultats), visible de tout le cabinet", "Infirmier ; aide-soignant pour ce qu’il constate"], ["Intra-cabinet", "Message à une personne, une tournée ou tout le cabinet", "Tout intervenant"], ["Externe", "Message reçu d’un professionnel extérieur par le portail QR", "Le professionnel extérieur"]]}, {"type": "h", "texte": "Écrire une transmission"}, {"type": "etapes", "items": ["Cliquez sur « Nouvelle transmission ciblée » ou « Nouveau message au cabinet ».", "Choisissez le patient ou le destinataire.", "Tapez « @ » pour citer un membre du cabinet : il sera notifié et pourra lire la transmission.", "Pour demander un avis, cochez « Demander un avis à l’équipe (interpellation) »."]}, {"type": "h", "texte": "Interpellations"}, {"type": "p", "texte": "Le panneau « Interpellations » liste les demandes en attente : « Marquer lue », puis « Répondre et traiter ». Une interpellation toujours non lue passé le délai d’alerte est signalée."}, {"type": "h", "texte": "Requalifier"}, {"type": "p", "texte": "« Requalifier » fait passer une transmission d’un registre à l’autre, avec un motif ; l’ancienne reste tracée. Le réglage « Requalification » dit quels rôles le peuvent ; vers une ciblée, l’infirmier seul."}, {"type": "h", "texte": "Transmissions proposées"}, {"type": "p", "texte": "Après certains événements, TabSanté propose une transmission ciblée. Relisez-la, puis « Confirmer et émettre » ou « Écarter la proposition » avec un motif."}, {"type": "h", "texte": "Signalements de l’aide-soignante"}, {"type": "etapes", "items": ["Ouvrez « Signalements » : chaque signalement « En attente de décision » montre le constat et le passage signé.", "Décidez : « Objet suivi ouvert » (rattacher la plaie ou le dispositif), « Surveillance renforcée » ou « Sans suite ».", "La décision est tracée au journal et ne se réécrit pas."]}, {"type": "note", "ton": "info", "texte": "L’aide-soignante constate, l’infirmier décide. L’aide-soignante n’écrit ni entretien infirmier, ni traitement d’interpellation, ni requalification."}]}, {"id": "pf-bilans-documents", "titre": "Bilans et documents", "resume": "Pré-rédiger un bilan depuis les passages signés, le signer, produire le PDF et l’envoyer.", "mots_cles": ["bilans", "documents", "compte rendu", "courrier", "PDF", "registre", "DMP", "MSSanté", "signature"], "blocs": [{"type": "p", "texte": "La page « Bilans et documents » montre « À rédiger et signer » et les « Bilans du cabinet ». Elle est réservée aux infirmiers qui rédigent les documents."}, {"type": "h", "texte": "Rédiger et signer un bilan"}, {"type": "etapes", "items": ["Ouvrez un bilan dû, ou « Nouveau document » (bilan, compte rendu ou courrier).", "Relisez la pré-rédaction : les faits de la période sont rassemblés depuis les passages signés, chaque phrase cite sa source.", "Modifiez ou retirez une phrase ; une phrase réécrite vous est attribuée. Ajoutez votre complément si besoin.", "Marquez « Gardé au dossier » ce qui ne doit pas sortir : la phrase reste au dossier mais quitte la version envoyée.", "« Signer et produire le PDF » : le bilan devient immuable ; le PDF est rangé au registre des documents du patient, avec son empreinte."]}, {"type": "h", "texte": "Envoyer"}, {"type": "p", "texte": "Rien n’est envoyé à la signature. Choisissez ensuite les destinataires : dossier médical partagé (sauf opposition du patient) et messagerie sécurisée."}, {"type": "note", "ton": "attention", "texte": "Envoi simulé : aucune messagerie ni DMP réel n’est contacté en démonstration. Un patient sans INS qualifiée ne peut pas recevoir de document au DMP."}, {"type": "h", "texte": "Corriger"}, {"type": "p", "texte": "« Corriger » produit une version corrective : une fois signée, elle remplace le compte rendu précédent, qui reste lisible."}]}, {"id": "pf-consultations-parcours", "titre": "Consultations infirmières et parcours encadrés", "resume": "Ouvrir un suivi de la fiche 24, remplir la sous-fiche, créer un parcours art. 5 ter ou RAAC.", "mots_cles": ["consultation", "fiche 24", "CIA", "CIB", "bilan de prévention", "sous-fiche", "parcours", "art. 5 ter", "RAAC", "brouillon partagé"], "blocs": [{"type": "p", "texte": "La vue « Bilans/Consultation » du dossier tient les suivis en cours et clôturés, les parcours, les bilans dus, les compétences à renforcer et les repères de l’avenant 11."}, {"type": "h", "texte": "Ouvrir un suivi"}, {"type": "etapes", "items": ["Cliquez sur « Ouvrir un nouveau suivi ».", "Choisissez le motif : consultation CIA, CIB, bilan de prévention, consultation non facturable, séance de parcours, bilan annuel de plaie.", "Renseignez l’origine et les données du motif (début de l’insuline, date et plan du bilan de prévention…).", "« Ouvrir le suivi » : ses consultations entrent dans la tournée choisie."]}, {"type": "p", "texte": "Le motif voulu n’existe pas ? « Le demander à TABSANTE » : un cabinet n’ajoute pas de motif, TABSANTE l’étudie pour tous les cabinets."}, {"type": "h", "texte": "Remplir la sous-fiche"}, {"type": "liste", "items": ["Tronc commun : personne présente, demande du patient, évaluation clinique reprise des autres fiches, éducation et compétences, diagnostic infirmier et objectifs, actions et suivi.", "Volet du motif : par exemple, pour un bilan de prévention, les thèmes de la tranche d’âge et les besoins identifiés.", "Le brouillon est partagé entre infirmiers : en cas de conflit, « Reprendre son brouillon » ou « Le remplacer par le mien ».", "« Signer et pré-rédiger le compte rendu » : la séance devient immuable ; le compte rendu se relit avant de partir."]}, {"type": "note", "ton": "info", "texte": "Un motif pas encore en vigueur est « Tracée, non facturante ». Chez un patient sous forfait BSI, CIA, CIB et bilan annuel de plaie restent tracés sans être facturants."}, {"type": "h", "texte": "Créer un parcours encadré"}, {"type": "etapes", "items": ["Dans « Parcours encadrés », créez un parcours : type (art. 5 ter ou RAAC), prescription, tournée, protocole écrit obligatoire.", "Pour une BPCO, choisissez le stade (II et suivants) ; pour une RAAC, le support de la fiche de suivi (choix provisoire).", "Le parcours génère ses séances. Chaque séance exige ses éléments, tracés par les fiches signées au même passage ; la séance se clôt au terminal.", "Le livrable se pré-rédige après la première séance close. « Interrompre le parcours » retire les séances à venir."]}]}, {"id": "pf-prescription-infirmiere", "titre": "Prescription infirmière et référentiels", "resume": "Rédiger, signer et renouveler une prescription infirmière à partir du référentiel prescriptible.", "mots_cles": ["prescription infirmière", "référentiel", "prescriptible", "renouvellement", "examens", "PDF", "signature"], "blocs": [{"type": "p", "texte": "La vue « Prescriptions infirmières » du dossier liste les prescriptions signées et les examens « À prélever ». Elle est réservée aux profils qui ont le droit de prescrire : ni l’aide-soignant, ni l’administration du cabinet."}, {"type": "h", "texte": "Rédiger"}, {"type": "etapes", "items": ["Ouvrez une nouvelle prescription infirmière : l’en-tête (prescripteur, patient, date, origine) est pré-rempli.", "Cherchez dans le référentiel (« alginate », « INR »…) et ajoutez les lignes ; certaines entrées ne se prescrivent qu’en renouvellement à l’identique.", "Une ligne hors liste n’est permise que dans certaines catégories ; elle remonte au responsable du référentiel.", "Choisissez les destinataires, puis « Signer et produire le PDF » : la prescription devient immuable, avec son empreinte, et rejoint le registre du patient."]}, {"type": "p", "texte": "« Renouveler » repart d’une prescription signée et la cite. Les examens prescrits deviennent des lignes à prélever de la fiche Prélèvements."}, {"type": "note", "ton": "attention", "texte": "Référentiel de démonstration : ne prescrivez pas en réel avec cette version."}, {"type": "note", "ton": "info", "texte": "Une prescription saisie au-delà du délai après sa rédaction exige un motif et attend sa validation au poste fixe avant de partir."}, {"type": "h", "texte": "La page « Référentiels »"}, {"type": "p", "texte": "Elle montre ce qui se prescrit, la source et la date de mise à jour du référentiel, les entrées « autre » remontées par le cabinet et les lignes libres répétées du Nursing."}]}, {"id": "pf-renouvellements", "titre": "Renouvellements d’ordonnance", "resume": "Demander au prescripteur le renouvellement d’une ordonnance qui arrive à échéance.", "mots_cles": ["renouvellement", "ordonnance", "échéance", "prescripteur", "courrier", "relance"], "blocs": [{"type": "p", "texte": "La page « Renouvellements d’ordonnance » (palette Ctrl K ou depuis « Bilans ») est réservée aux infirmiers qui rédigent les courriers du cabinet."}, {"type": "h", "texte": "Les trois listes"}, {"type": "liste", "items": ["« Ordonnances arrivant à échéance » dans les quatorze jours.", "« Demandes en cours ».", "« Reçues et annulées »."]}, {"type": "h", "texte": "Demander un renouvellement"}, {"type": "etapes", "items": ["Créez la demande depuis l’échéance ou depuis le dossier du patient : TabSanté pré-remplit le courrier au prescripteur.", "« Relire d’abord » : un courrier non relu ne part jamais d’un clic.", "« Envoyer au prescripteur » : le courrier est signé et acheminé par la messagerie sécurisée.", "La nouvelle ordonnance du même prescripteur, saisie ou lue puis validée, clôt la demande."]}, {"type": "p", "texte": "Une demande sans réponse au terme du délai se relance. Une annulation demande un motif (« Soins arrêtés, autre prescripteur… »)."}, {"type": "note", "ton": "attention", "texte": "Messagerie simulée en démonstration. Le délai de relance est provisoire. Rien n’est envoyé au patient."}]}, {"id": "pf-saisies-differees", "titre": "Saisies différées", "resume": "Valider ou refuser au poste fixe les actes et prescriptions saisis au-delà du délai.", "mots_cles": ["saisie différée", "hors délai", "validation", "refus", "120 minutes", "motif"], "blocs": [{"type": "p", "texte": "Un acte saisi longtemps après sa réalisation est une saisie différée : l’infirmier donne un motif, puis un autre infirmier valide au poste fixe. La page « Saisies différées » liste les saisies « À valider », « Validées » et « Refusées »."}, {"type": "note", "ton": "info", "texte": "Le seuil est de 120 minutes entre la réalisation et la saisie. Cette valeur est provisoire, en attente d’une décision."}, {"type": "h", "texte": "Valider ou refuser"}, {"type": "etapes", "items": ["Lisez chaque ligne : patient et saisie, « Fait, puis saisi », écart, motif du différé, signataire.", "« Valider » : la saisie part avec le prochain envoi.", "« Refuser la saisie » avec un motif : l’acte reste au dossier, signé et inchangé, mais il est écarté de l’envoi."]}, {"type": "note", "ton": "attention", "texte": "Seul un infirmier titulaire ou responsable valide, et jamais sa propre saisie. Une validation envoyée depuis un terminal est refusée : elle se fait au poste fixe."}, {"type": "p", "texte": "Ce qui est signé ne change pas : la décision s’ajoute au journal."}]}, {"id": "pf-facturation", "titre": "Facturation simulée", "resume": "De la cotation confirmée à la FSE, au lot et à ses retours, sur un moteur et un SESAM-Vitale de démonstration.", "mots_cles": ["facturation", "file de contrôle", "cotation", "FSE", "lot", "télétransmission", "rejet", "HAD", "réglages", "NOEMIE"], "blocs": [{"type": "note", "ton": "attention", "texte": "Moteur de cotation de démonstration et SESAM-Vitale factice : rien n’est transmis, rien n’est facturable."}, {"type": "p", "texte": "La page « Facturation » est réservée aux infirmiers qui voient la cotation. Ses onglets : « File de contrôle », « À facturer », « FSE », « Lots », « Rejets », « Relevés HAD », « Réglages », « Simuler une cotation »."}, {"type": "h", "texte": "1. File de contrôle"}, {"type": "etapes", "items": ["« Reconfirmer les cotations » : le moteur rejoue chaque cotation provisoire des actes signés. Mêmes lignes : confirmée. Divergence ou règle du cabinet : elle entre en file.", "Pour chaque cotation en file, l’arbitre choisit « Confirmer la cotation » ou « Écarter de la facturation », avec un motif tracé au journal."]}, {"type": "h", "texte": "2. À facturer"}, {"type": "p", "texte": "Les cotations confirmées apparaissent par patient et par signataire. « Créer la FSE » ne porte que sur vos propres actes : la FSE se crée avec la carte CPS de l’infirmier qui les a réalisés."}, {"type": "h", "texte": "3. FSE"}, {"type": "p", "texte": "Chaque ligne de la FSE cite l’acte signé et son empreinte. « Sécuriser la FSE » (signature simulée, lecture Vitale comprise). Pas encore en lot, une FSE s’annule avec un motif : ses actes reviennent dans « À facturer »."}, {"type": "h", "texte": "4. Lots"}, {"type": "etapes", "items": ["« Constituer un lot » avec les FSE sécurisées d’un même émetteur.", "Le contrôle de cohérence signale les anomalies ; la plupart se forcent avec un motif (« Forcer la mise en lot »), pas une preuve altérée ni une saisie différée non validée.", "« Télétransmettre », puis « Lire les retours »."]}, {"type": "h", "texte": "5. Rejets, relevés HAD, réglages"}, {"type": "liste", "items": ["« Rejets » : « Refacturer » (les actes redeviennent facturables après correction) ou « Abandonner ».", "« Relevés HAD » : actes relevés à l’HAD selon la convention, sans FSE ; sans lettre de mission, le séjour est « Non payable en l’état ».", "« Réglages » : ce qui passe par la file de contrôle, le délai d’arbitrage et les arbitres. Une divergence entre provisoire et confirmée et un acte corrigé passent toujours en file."]}, {"type": "note", "ton": "info", "texte": "Les actes d’un remplaçant attendent : un remplaçant ne peut pas créer la FSE, et la facturation des remplacements reste à décider."}]}, {"id": "pf-recu-simulateur", "titre": "Reçu de cotation, simulateur et banc", "resume": "Comprendre une cotation ligne par ligne, rejouer un passage fictif et lire le banc de cotation.", "mots_cles": ["reçu de cotation", "et si", "simulateur", "simuler une cotation", "banc de cotation", "pourquoi", "règle"], "blocs": [{"type": "note", "ton": "attention", "texte": "Règles et tarifs de démonstration : aucun montant n’est facturé ni opposable."}, {"type": "h", "texte": "Le reçu de cotation d’un passage"}, {"type": "p", "texte": "Depuis un passage signé (lien « Reçu »), le reçu montre les lignes du passage, la règle appliquée à chaque ligne (« Pourquoi ? »), les versions du référentiel, des tarifs et du moteur, et le total du passage. « Imprimer » permet d’enregistrer au format PDF."}, {"type": "p", "texte": "« Et si… » rejoue le passage avec une autre heure, un autre jour, un horaire imposé ou des dimanches et fériés précisés, puis compare au réel."}, {"type": "h", "texte": "Simuler une cotation"}, {"type": "etapes", "items": ["Onglet « Simuler une cotation » de la Facturation : partez d’un cas type ou composez un passage.", "Renseignez la date, le lieu, l’âge du patient, le code postal (jours fériés locaux), les contextes (forfait BSI, score SEGA), les soins et le déplacement.", "Lisez la cotation du moteur et son total à la date. Rien n’est écrit."]}, {"type": "h", "texte": "Le banc de cotation"}, {"type": "p", "texte": "« Paramètres › Banc de cotation » montre le dernier rapport : cas conformes, écarts, cas bloqués et divergences documentées. Il éprouve les règles de la doublure ; il ne vaut jamais agrément."}]}, {"id": "pf-preuves", "titre": "Preuves et dossier de preuve", "resume": "Vérifier l’intégrité des actes signés et imprimer un dossier de preuve pour un contrôle.", "mots_cles": ["preuve", "dossier de preuve", "intégrité", "empreinte", "journal d’audit", "ancre", "imprimer"], "blocs": [{"type": "p", "texte": "La page « Preuves et cotations » (« Preuves des soins » pour qui ne voit pas la cotation) liste les actes signés, filtrables (« Tous », « Saisies différées »), avec leur état d’intégrité."}, {"type": "h", "texte": "Chaîne d’audit et ancrage"}, {"type": "liste", "items": ["« Journal d’audit intact » : vérifié de bout en bout, sans trou ni réécriture.", "« Relire toute la chaîne » relance la vérification complète.", "« Poser une ancre » copie la tête de la chaîne hors de la base (gestionnaires des habilitations)."]}, {"type": "note", "ton": "attention", "texte": "Si le journal d’audit est rompu, prévenez le responsable sécurité avant toute présentation de preuve."}, {"type": "h", "texte": "Imprimer un dossier de preuve"}, {"type": "etapes", "items": ["Ouvrez le dossier de preuve d’un acte, ou « Dossier de preuve par période » pour un patient.", "Vérifiez les verdicts : « Empreinte conforme », « Journal intact ».", "Cliquez sur « Imprimer » et choisissez « Enregistrer au format PDF »."]}, {"type": "p", "texte": "Le dossier d’un acte montre qui et quand, la saisie différée, la prescription, ce qui a été constaté et fait, les corrections après signature, les photos, la cotation et les entrées du journal d’audit."}, {"type": "note", "ton": "info", "texte": "Le dossier de preuve est réservé aux infirmiers."}]}, {"id": "pf-partage-acces-externes", "titre": "Partage externe, accès QR et télésanté", "resume": "Recueillir le consentement du patient, émettre un QR pour un professionnel extérieur, tenir un acte à distance.", "mots_cles": ["partage", "consentement", "QR", "accès externe", "Pro Santé Connect", "RPPS", "télésanté", "téléconsultation", "portail externe"], "blocs": [{"type": "h", "texte": "Préparer l’accès d’un professionnel extérieur"}, {"type": "etapes", "items": ["Page « Accès externes » : « Préenregistrer » le professionnel avec son RPPS à 11 chiffres, sa qualité et sa spécialité.", "Dans le dossier, vue « Partage externe » : « Recueillir un consentement » (droits, parties lisibles, date de fin, recueilli par écrit ou oralement), puis « Tracer le consentement ».", "« Émettre un QR » : choisissez sa durée de validité (1 heure, 4 heures par défaut, 24 heures ou 72 heures).", "Le QR ne s’affiche qu’une fois : imprimez-le ou montrez-le au professionnel tout de suite."]}, {"type": "note", "ton": "info", "texte": "Un QR seul ne donne rien : le professionnel doit s’identifier par Pro Santé Connect avec le RPPS désigné, et seuls les droits consentis s’ouvrent. Un nouveau QR révoque le précédent du même professionnel."}, {"type": "p", "texte": "« Révoquer » coupe l’accès à l’instant : la requête suivante du professionnel est refusée. Le journal des accès externes garde ouvertures, lectures, dépôts et refus."}, {"type": "h", "texte": "Ce que voit le professionnel extérieur"}, {"type": "p", "texte": "Sur le portail externe, il lit la synthèse du dossier en lecture seule, les courbes et les documents permis ; il envoie une transmission à l’équipe infirmière (ou l’interpelle) et dépose un document (PDF, JPEG ou PNG, 15 Mo au plus). Il ne modifie jamais le dossier."}, {"type": "note", "ton": "attention", "texte": "Pro Santé Connect est simulé en démonstration."}, {"type": "h", "texte": "Actes à distance et télésanté"}, {"type": "p", "texte": "Dans la vue « Actes à distance » du dossier : « Nouvel acte à distance » (téléconsultation, télésoin, télé-expertise), participants, consentement, photos transmises pour une plaie, puis compte rendu à pré-rédiger et signer. La page « Télésanté » est le registre de ces actes pour le cabinet. Rien de la vidéo n’est conservé."}]}, {"id": "pf-droits-journal", "titre": "Droits du patient et journal des accès", "resume": "Enregistrer une demande du patient, exporter son dossier, savoir qui a lu quoi.", "mots_cles": ["droits du patient", "RGPD", "accès", "rectification", "portabilité", "opposition", "export FHIR", "journal des accès", "conservation"], "blocs": [{"type": "h", "texte": "Les droits du patient"}, {"type": "p", "texte": "La vue « Droits du patient » (onglet « Dossier administratif ») réunit les demandes du patient, les traces d’accès à son dossier, l’accès et la portabilité, la rectification, l’opposition et la limitation, et la conservation."}, {"type": "etapes", "items": ["« Enregistrer une demande » le jour de sa réception, même orale : nature et canal.", "« Donner suite » : pour l’accès et la portabilité, exportez le dossier complet au format FHIR.", "Une rectification ne remplace rien : l’ancienne valeur reste consultable."]}, {"type": "note", "ton": "info", "texte": "L’opposition et l’effacement ne valent pas pour les données nécessaires aux soins et à leur preuve, pendant leur durée de conservation. Les durées affichées sont provisoires, à valider par le délégué à la protection des données."}, {"type": "note", "ton": "attention", "texte": "L’export FHIR contient des données de santé : rangez le fichier en lieu sûr."}, {"type": "h", "texte": "Le journal des accès"}, {"type": "p", "texte": "« Paramètres › Journal des accès » répond à la question « Qui a lu quel dossier, quand, d’où ». Filtrez par patient, intervenant et dates ; « Exporter (CSV) »."}, {"type": "p", "texte": "Chaque lecture d’un dossier, d’un passage, d’une photo ou d’un document est tracée, y compris la lecture de ce journal ; l’export est inscrit au journal d’audit."}, {"type": "note", "ton": "info", "texte": "Le journal des accès se lit par qui gère les habilitations : titulaire, responsable, administration du cabinet."}]}, {"id": "pf-equipe-habilitations", "titre": "Équipe et habilitations", "resume": "Ajouter un intervenant, accorder une habilitation, enregistrer une formation, lire la matrice des droits.", "mots_cles": ["équipe", "intervenant", "habilitation", "remplaçant", "responsable", "administrateur", "formation", "matrice des droits", "RPPS"], "blocs": [{"type": "p", "texte": "« Paramètres › Équipe et habilitations » liste les intervenants du cabinet. Les modifications sont réservées à qui gère les habilitations."}, {"type": "h", "texte": "Ajouter un intervenant"}, {"type": "etapes", "items": ["« Ajouter un intervenant » : prénom, nom, rôle.", "Pour un infirmier remplaçant, l’habilitation est bornée dès sa création : date de début et date de fin obligatoires.", "Complétez ses identifiants professionnels (RPPS à 11 chiffres, numéro de carte CPS, téléphone professionnel)."]}, {"type": "h", "texte": "Les habilitations"}, {"type": "table", "entetes": ["Habilitation", "Ce qu’elle donne"], "lignes": [["Administrateur du cabinet", "Gère les habilitations, attribue les tournées"], ["IDE responsable", "Responsabilité clinique : une seule à la fois, elle ne se délègue pas"], ["Remplaçant", "Bornée : date de fin obligatoire, portée facultative (tournées, patients, personne remplacée)"]]}, {"type": "p", "texte": "« Accorder » une habilitation, ou « Révoquer l’habilitation » avec un motif : les droits cessent aussitôt, l’habilitation reste au journal."}, {"type": "h", "texte": "Formations"}, {"type": "p", "texte": "« Enregistrer une formation » : formation du catalogue, date d’obtention, échéance éventuelle. Certains soins en exigent une (PCA, cathéter périnerveux) : l’attribution le signale sans bloquer."}, {"type": "h", "texte": "Matrice des droits"}, {"type": "p", "texte": "La matrice montre, par action et par profil, les droits appliqués par le serveur : L lecture, E écriture, S signature, V validation, A administration. Vos profils sont surlignés."}, {"type": "note", "ton": "attention", "texte": "Les valeurs de la matrice sont une proposition à valider par le cabinet."}, {"type": "p", "texte": "Le panneau « Coordonnées du cabinet » tient l’adresse et le téléphone du cabinet."}]}, {"id": "pf-terminaux-sessions", "titre": "Terminaux et sessions", "resume": "Enrôler un téléphone de tournée, révoquer un terminal perdu, couper une session.", "mots_cles": ["terminal", "enrôlement", "code", "révoquer", "perdu", "volé", "sessions"], "blocs": [{"type": "h", "texte": "Enrôler un terminal"}, {"type": "etapes", "items": ["« Paramètres › Terminaux », panneau « Enrôler un terminal » : donnez un nom (« Tablette de Claire, terminal de secours… »).", "Cliquez sur « Émettre un code » : un code de 10 caractères s’affiche, avec son heure d’expiration (10 minutes).", "Saisissez ce code sur l’écran d’enrôlement du terminal. Il ne sert qu’une fois.", "Un code émis par erreur s’annule avant d’avoir servi (« Annuler le code »)."]}, {"type": "note", "ton": "info", "texte": "L’enrôlement revient à qui gère les habilitations (titulaire, responsable, administration du cabinet). Un remplaçant ne peut pas émettre de code."}, {"type": "h", "texte": "Révoquer un terminal perdu ou volé"}, {"type": "p", "texte": "« Révoquer » coupe aussitôt toutes ses sessions ; il ne pourra plus servir qu’après un nouvel enrôlement. Enrôlements, annulations et révocations sont tracés au journal."}, {"type": "h", "texte": "Sessions"}, {"type": "p", "texte": "« Paramètres › Sessions » liste les sessions ouvertes : intervenant, date d’ouverture, état. « Révoquer » coupe les jetons d’une session ; « Révoquer ce terminal » fait tomber toutes les sessions d’un terminal. Révoquer votre propre session vous déconnecte aussitôt."}]}, {"id": "pf-parametres", "titre": "Paramètres du cabinet", "resume": "Régler la zone d’intervention, les durées types des soins et les prérequis de passage.", "mots_cles": ["paramètres", "cabinet", "zone d’intervention", "durée type", "suggestion", "prérequis", "à jeun", "mode d’exercice"], "blocs": [{"type": "p", "texte": "« Paramètres » s’ouvre sur l’onglet « Cabinet ». Les autres onglets : « Équipe et habilitations », « Sessions », « Terminaux », « Journal des accès », « Reprise de dossiers », « Simulations », « Banc de cotation », selon vos droits."}, {"type": "p", "texte": "L’onglet « Cabinet » rappelle les intervenants, votre mode d’exercice et vos profils."}, {"type": "h", "texte": "Tournées du cabinet"}, {"type": "etapes", "items": ["Placez d’abord le point de départ des tournées : la zone l’entoure.", "« Rayon de la zone d’intervention » : de 0,2 à 50 km, puis « Enregistrer ». « Retirer la zone » l’efface.", "Pour chaque soin, lisez la durée provisoire de l’application, la durée observée sur vos passages et la suggestion ; saisissez la « Durée type du cabinet », puis « Enregistrer les durées ».", "« Reprendre les suggestions » recopie les suggestions dans les durées types encore vides."]}, {"type": "note", "ton": "info", "texte": "Un domicile hors zone est signalé, jamais bloqué. L’estimation d’une tournée retient d’abord les passages tracés, puis la durée type du cabinet, enfin la valeur provisoire."}, {"type": "h", "texte": "Prérequis de passage"}, {"type": "p", "texte": "Pour chaque soin, cochez les prérequis demandés (à jeun, traitement ou matériel à récupérer, ordonnance et carte Vitale, résultats, présence d’un aidant) et leur échéance de confirmation : la veille ou le matin même. « Revenir au référentiel » rétablit la proposition livrée."}, {"type": "note", "ton": "attention", "texte": "Le référentiel des prérequis est une proposition à valider par un référent infirmier. TabSanté n’envoie aucun message au patient : c’est l’infirmier qui l’appelle."}, {"type": "p", "texte": "Il faut le droit d’attribuer les tournées pour modifier ces réglages."}]}, {"id": "pf-simulations-reprise", "titre": "Simulations, échanges de santé et reprise de dossiers", "resume": "Provoquer une panne de démonstration, essayer une règle provisoire, reprendre les dossiers d’un autre logiciel.", "mots_cles": ["simulations", "démonstration", "panne", "règle provisoire", "échanges de santé", "messagerie", "laboratoire", "DMP", "reprise de dossiers", "import"], "blocs": [{"type": "h", "texte": "Paramètres › Simulations"}, {"type": "p", "texte": "Cette page n’existe qu’en mode démonstration. Elle liste les services simulés (cartes, téléservices, SESAM-Vitale, messagerie, DMP, géographie…), les référentiels de démonstration et les règles provisoires, chacun avec ce qu’il remplace."}, {"type": "etapes", "items": ["Repérez le service ou la règle voulu.", "Choisissez son « Comportement » : une panne (carte bloquée, droits fermés, rejet des feuilles, verglas…) ou une option.", "Le réglage vaut dès l’appel suivant, pour toute l’instance, et reste après un redémarrage.", "« Tout remettre à la normale » rétablit les comportements normaux et les options prudentes."]}, {"type": "p", "texte": "La même page présente les cartes CPS et Vitale de démonstration, les postes de travail (agent de poste simulé) et le banc de conformité."}, {"type": "note", "ton": "info", "texte": "Un bandeau « Démonstration » rappelle sur tout le poste fixe que cartes, téléservices, facturation et échanges sont simulés. Le réglage des pannes revient à l’administration du cabinet."}, {"type": "h", "texte": "Échanges de santé"}, {"type": "p", "texte": "La page « Échanges de santé » (infirmiers) réunit la messagerie sécurisée simulée, « Adresser au laboratoire » un prélèvement signé, les passages imprévus à régulariser (« Rattacher une prescription »), le DMP, les ordonnances électroniques, les BSI déposés et une visio simulée."}, {"type": "h", "texte": "Reprise de dossiers"}, {"type": "etapes", "items": ["« Paramètres › Reprise de dossiers » : choisissez le format (fichier complet JSON ou identités seules CSV), le logiciel d’origine, puis déposez le fichier.", "Lancez l’aperçu à blanc : chaque erreur et chaque ressemblance avec un patient du cabinet est dite ; rien n’est créé.", "Corrigez le fichier si besoin, puis reprenez. Rejouée, la reprise ne recrée aucun dossier."]}, {"type": "note", "ton": "attention", "texte": "Le format pivot est un format de démonstration. Les identités reprises restent provisoires jusqu’à leur qualification INSi ; aucun mot de passe n’est repris."}]}, {"id": "pf-notifications-suggestions", "titre": "Notifications, compteurs et suggestions", "resume": "Lire la cloche, valider une notification proposée, suivre les pastilles et les suggestions du jour.", "mots_cles": ["notifications", "cloche", "compteurs", "badges", "suggestions", "notification proposée", "temps réel"], "blocs": [{"type": "h", "texte": "La cloche des notifications"}, {"type": "p", "texte": "La cloche, sous la navigation, ouvre vos notifications. Portée : « Pour moi » ou « Tout le cabinet ». Deux listes : « À valider » et « Reçues »."}, {"type": "etapes", "items": ["Une notification proposée par une règle du soin attend un infirmier : relisez ses destinataires.", "Un infirmier valide l’envoi, ou « Écarter » avec un motif.", "« Marquer comme vue » une notification reçue, ou « Ouvrir » ce qu’elle concerne."]}, {"type": "note", "ton": "attention", "texte": "Envoi simulé : la messagerie sécurisée n’est pas raccordée, le message est versé au journal."}, {"type": "h", "texte": "Pastilles et mise à jour en direct"}, {"type": "p", "texte": "Les pastilles de la barre latérale se relisent à chaque changement de page. Les vues ouvertes se mettent à jour d’elles-mêmes quand un acte, une cotation, une occurrence, une transmission, une notification ou une échéance change dans le cabinet."}, {"type": "h", "texte": "Suggestions"}, {"type": "p", "texte": "Le panneau « Suggestions » d’« Aujourd’hui » propose des pistes, jamais des ordres. « Pourquoi ? » montre la source, la règle et les données ; « C’est fait » ou « Écarter » avec un motif. Une suggestion revient si sa cause chan
