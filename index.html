ion doit-elle coter les déplacements ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Ne rien coter, transmettre seulement les faits (appliqué aujourd'hui)", "Aucun risque d'erreur, les indemnités sont saisies ailleurs ou perdues."], ["B", "Coter forfait et kilomètres, distance par l'itinéraire routier", "Distance proche du réel ; dépend d'un service d'itinéraire."], ["C", "Coter forfait et kilomètres, distance à vol d'oiseau", "Simple et sans service externe ; distance plus courte que la route."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Par défaut, faits transmis et aucune indemnité cotée ; en mode « cotées » : forfait une fois par passage, kilomètres hors agglomération, zones tirées d'un extrait de démonstration, aucune indemnité au cabinet, IFI dégressif pour une même adresse ; ordonnance « non prescrits » : ni forfait ni kilomètres, dépassement réglable de 0 à 5 € à la charge du patient."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-77, EX-FA-02, AV-01, NGAP-13-7, registre des simulations"}, {"type": "h", "texte": "Q-72 · Injection pendant un passage de nursing sous forfait BSI"}, {"type": "p", "texte": "Quand un patient est sous forfait de dépendance (BSI), une injection faite au même passage que la toilette serait cotée à 50 %. Le cahier de tests CNDA, lui, la cote à taux plein dans sept cas. Il faut choisir la lecture et dire si la règle vaut pour le seul passage du forfait ou pour tout passage du jour."}, {"type": "p", "texte": "Question : Une injection faite au passage de nursing d'un patient sous forfait BSI est-elle cotée à 50 % ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui, à 50 % au seul passage du forfait (appliqué aujourd'hui)", "Lecture de l'article 11 B ; sept cas du cahier CNDA restent en écart documenté."], ["B", "Oui, à 50 % à tout passage du jour", "Lecture plus large, moins de recette."], ["C", "Non, à taux plein comme le cahier CNDA", "Aligné sur le cahier de tests de l'agrément ; risque d'indu si la caisse lit l'article 11 B."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Au passage de nursing d'un patient sous forfait BSI, l'acte en AMX passe à 50 %, sauf perfusion, pansement lourd, séance spécialisée et prise de sang ; hors passage de nursing, règle ordinaire."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : NUR-RG-05, EX-FA-02, cahier CNDA TC 98 à 104 et 106"}, {"type": "h", "texte": "Q-04 · Qu'est-ce qu'un passage ?"}, {"type": "p", "texte": "Les majorations se comptent une fois par passage. Il faut savoir quand deux soins du même moment chez le même patient forment deux passages, et comment traiter deux patients d'une même adresse vus à la suite."}, {"type": "p", "texte": "Question : Au bout de combien de temps sans soin un nouvel acte forme-t-il un nouveau passage ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Deux heures (appliqué aujourd'hui)", "Une reprise l'après-midi est un autre passage que celui du matin."], ["B", "Une heure", "Plus de passages distincts, donc plus de majorations."], ["C", "Dès que l'infirmière quitte le domicile", "Fidèle au terrain, mais suppose de déclarer la sortie."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Au-delà de deux heures sans soin, un acte du même moment est un autre passage ; majorations une fois par passage."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-FA-01, EX-FA-04"}, {"type": "h", "texte": "Q-03 · Acte C (surveillance après changement de traitement) : plafond et alerte"}, {"type": "p", "texte": "L'acte C de l'article 10 est plafonné à 15 passages, ou 15 jours selon une autre lecture. L'infirmière doit voir venir la limite. Les règles exactes des bilans et des majorations exclues hors domicile relèvent du moteur réel."}, {"type": "p", "texte": "Question : Le plafond de l'acte C est-il de 15 passages ou de 15 jours ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "15 passages sur 30 jours, alerte à 3 passages du plafond (appliqué aujourd'hui)", "Compteur par passage, alerte « limite proche »."], ["B", "15 jours", "Compteur en jours ; plusieurs passages par jour comptent pour un."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : 15 passages sur 30 jours, « limite proche » à trois passages ; une ligne de bilan par type de bilan signé ; hors domicile (EHPAD, établissements) ni forfait de dépendance ni déplacement."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-MED-17, EX-PF-06 octies"}, {"type": "h", "texte": "Q-13 · Bilan de soins infirmiers : circuit du document AmeliPro"}, {"type": "p", "texte": "Le BSI se dépose sur AmeliPro, qui n'a pas d'interface avec les logiciels. Le plafond (deux bilans intermédiaires sur douze mois) et la validité (un an) sont tranchés. Reste à savoir comment le BSI déposé revient dans l'application."}, {"type": "p", "texte": "Question : Comment le BSI déposé sur AmeliPro est-il enregistré dans l'application ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "L'infirmière dépose le PDF d'AmeliPro dans le dossier (appliqué aujourd'hui)", "Le BSI est coté au dépôt du PDF, la preuve est au dossier."], ["B", "L'infirmière saisit la date et la référence du dépôt", "Plus rapide, sans pièce justificative jointe."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Coté au dépôt du PDF ; plafond de deux intermédiaires sur douze mois glissants et validité d'un an appliqués."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-NUR-05, NUR-RG-06, NUR-RG-20, registre des simulations"}, {"type": "h", "texte": "Q-73 · Pansement lourd et complexe : critères"}, {"type": "p", "texte": "Un pansement lourd et complexe est mieux payé qu'un pansement courant. L'application le reconnaît aujourd'hui sur quelques critères (ulcère de plus de 60 cm² ou sous compression, méchage, escarre de stade 4, brûlure, patient sous insuline avec détersion). D'autres faits ne sont pas encore saisis (pourcentage de surface brûlée, fistule, amputation, ostéosynthèse)."}, {"type": "p", "texte": "Question : Faut-il ajouter les faits manquants à la fiche Pansements pour reconnaître le pansement lourd ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Garder les critères actuels (appliqué aujourd'hui)", "Une brûlure est comptée lourde par défaut ; certains cas lourds sont cotés courants."], ["B", "Ajouter les faits manquants à saisir dans la fiche", "Cotation plus juste, quelques champs de plus pour l'infirmière."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Critères listés ci-dessus ; sinon pansement courant (AMI 2, 2,02 dès le 21/06/2026)."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : fiche 01, EX-FA-02, NGAP-11B-1, 11B-3"}, {"type": "h", "texte": "Q-74 · Ablation de fils et pansement de la même plaie"}, {"type": "p", "texte": "Quand l'infirmière retire des fils ou des agrafes, le pansement courant de la même plaie est compris dans l'acte d'ablation. Un pansement lourd reste coté à part."}, {"type": "p", "texte": "Question : Confirmez-vous que l'ablation de fils comprend le pansement courant de la même plaie ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui, le pansement courant est compris (appliqué aujourd'hui)", "Un seul acte coté, sauf pansement lourd."], ["B", "Non, les deux sont cotés", "Plus de recette, risque d'indu."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Ablation cotée AMI 2 jusqu'à dix fils, 4 au-delà, pansement courant compris ; pansement lourd coté en plus."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : fiche 01, NGAP-11B-2"}, {"type": "h", "texte": "Q-15 · Plafonds du cycleur de dialyse péritonéale"}, {"type": "p", "texte": "Pour un patient sous cycleur, l'application compte les branchements, débranchements et périodes de surveillance. Les plafonds actuels sont provisoires et ne bloquent jamais."}, {"type": "p", "texte": "Question : Quels sont les plafonds par jour pour un patient sous cycleur ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Un branchement, un débranchement, deux périodes de 12 heures (appliqué aujourd'hui)", "Valeurs provisoires actuelles, affichées sans blocage."], ["B", "Valeurs fournies par le moteur de TABSANTE", "Les plafonds suivent le moteur réel ; à livrer avec lui."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Un branchement, un débranchement, deux périodes de douze heures par jour (une période par passage) ; restitués dans la fiche et au tableau de bord, jamais bloquants."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-DIA-P-00 ter, DIP-S12"}, {"type": "h", "texte": "Q-63 · BPCO : stade exigé après hospitalisation"}, {"type": "p", "texte": "La prise en charge spécialisée après hospitalisation (article 5 ter) d'un patient BPCO demande un stade. L'application refuse aujourd'hui le stade I."}, {"type": "p", "texte": "Question : Le stade I de BPCO est-il exclu de cette prise en charge ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui, stade II et suivants seulement (appliqué aujourd'hui)", "Un patient stade I ne peut pas entrer dans le parcours."], ["B", "Non, seul l'allongement à 6 mois est exclu au stade I", "Le patient stade I entre dans le parcours, durée courte."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Stade exigé pour la BPCO, stade I refusé."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : table 37, EX-CI-15"}, {"type": "h", "texte": "Q-27 · Écart entre passages prévus au BSI et passages servis"}, {"type": "p", "texte": "Le tableau de bord signale un patient dont les passages réels s'écartent durablement de ceux prévus au BSI, ce qui peut appeler un nouveau bilan. Il faut définir « durable »."}, {"type": "p", "texte": "Question : À partir de quand l'écart avec le BSI doit-il être signalé ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Sur 14 jours, au moins 7 jours prévus et 33 % d'écart (appliqué aujourd'hui)", "Signal rapide, quelques fausses alertes possibles."], ["B", "Sur 30 jours, 25 % d'écart", "Signal plus lent, plus stable."], ["C", "Aucun signal", "L'infirmière repère elle-même la dérive."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Fenêtre de 14 jours close la veille, au moins 7 jours prévus, écart d'au moins 33 % dans un sens ou dans l'autre ; signalé au tableau de bord, jamais bloquant."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : NUR-RG-20, EX-TB-*, registre des simulations"}, {"type": "h", "texte": "Q-78 · Traceurs de la feuille de soins"}, {"type": "p", "texte": "Certaines feuilles de soins portent des codes traceurs (par exemple IEP, OEP) de valeur symbolique, qui signalent une circonstance particulière. L'application ne les transmet pas aujourd'hui."}, {"type": "p", "texte": "Question : D'où viennent les codes traceurs de la feuille de soins ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non transmis (appliqué aujourd'hui)", "Rien à saisir ; écart avec les cas du cahier CNDA qui les portent."], ["B", "Saisis par l'infirmière au passage", "Une case de plus dans les circonstances concernées."], ["C", "Déduits automatiquement des circonstances du passage", "Rien à saisir, mais la liste des circonstances doit être fournie par TABSANTE."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Fait « traceurs » prévu dans le passage, une ligne à 0,02 € par code, jamais rempli par l'application."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-FA-07, cahier CNDA TC 125, TC 126"}, {"type": "h", "texte": "Q-140 · Mode contrôle CPAM : identité du contrôleur et durée de l'accès"}, {"type": "p", "texte": "Le cabinet remet à un contrôleur de l'Assurance maladie un accès en lecture seule à un patient sur une période : actes, cotations, preuves et intégrité, chaque lecture tracée. Aujourd'hui l'identité du contrôleur est déclarée par le cabinet, sans être attestée."}, {"type": "p", "texte": "Question : Comment le contrôleur prouve-t-il qui il est, et combien de temps l'accès vaut-il ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Identité déclarée par le cabinet, accès de 72 heures par défaut, une semaine au plus (appliqué aujourd'hui)", "Simple ; la preuve d'identité reste hors de l'outil."], ["B", "Identité attestée (carte d'agent, Pro Santé Connect ou équivalent de l'Assurance maladie)", "Démarche avec l'Assurance maladie ; accès nominatif vérifié à chaque appel."], ["C", "Pas d'accès en ligne : export PDF du dossier de contrôle remis en main propre", "Aucune surface ouverte ; plus de traçabilité des lectures."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : identité déclarée, 72 heures par défaut (24 heures à 7 jours), période d'un an au plus, révocable ; lectures tracées à la chaîne d'audit et au journal des accès du patient."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur, avec le DPO"}, {"type": "p", "texte": "Références : feuille de route (« mode contrôle CPAM »), CDC §4.8, PR-2"}]}, {"id": "qo-soins", "titre": "Soins et règles cliniques", "resume": "Validation clinique, recalage des fréquences, anticoagulants, stomies, voies et fiches : les règles de soin à confirmer.", "mots_cles": ["AUTRE-02", "D-01", "Q-26", "Q-29", "AUTRE-03", "Q-28", "Q-90", "Q-61", "Q-98", "Q-97", "D-21", "Q-25", "Q-17", "règles cliniques", "IDE référente", "fréquence", "anticoagulant", "plaquettes", "stomie", "injection", "voie inhalée", "RAAC"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "13 questions, aucune bloquante."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["AUTRE-02", "Validation clinique par une IDE référente", "Important", "IDE référente", "Rien de choisi"], ["D-01", "Recalage d'une fréquence espacée", "Important", "IDE référente", "A · Du calendrier d'origine"], ["Q-26", "Chute des plaquettes sous anticoagulant injectable", "Important", "IDE référente", "A · Baisse de 30 %"], ["Q-29", "Rotation des sites d'injection", "Important", "IDE référente", "A · Un seuil unique : 3 emplois en 7 jours et la moitié des injections"], ["AUTRE-03", "Sur-consommation d'appareillage de stomie", "Important", "IDE référente", "A · Jamais : l'écart se lit, sans alerte"], ["Q-28", "Heure prise au lit pendant un prélèvement", "Confort", "IDE référente", "A · Deux heures avant le soin"], ["Q-90", "Pulvérisation de médicaments : fiche Injections ou fiche Médicaments", "Confort", "IDE référente", "A · Fiche Injections, ligne à part"], ["Q-61", "Lecture du test tuberculinique", "Confort", "IDE référente", "A · Non, elle découle de la prescription de la pose"], ["Q-98", "Voie inhalée dans la fiche Médicaments", "Confort", "IDE référente", "A · Oui, ajouter « inhalée »"], ["Q-97", "Une fréquence pour plusieurs plaies ou dispositifs", "Confort", "IDE référente", "A · Non, une fréquence par plaie ou dispositif"], ["D-21", "Fiche de suivi de la séance RAAC", "Confort", "Fondateur", "A · La fiche de l'établissement, déposée dans le dossier"], ["Q-25", "Perfusion ou séance laissée en place sans intervenant attribué", "Confort", "IDE référente", "A · Le cabinet"], ["Q-17", "Trame d'entretien du bilan de prévention", "Confort", "IDE référente", "A · Garder la trame provisoire"]]}, {"type": "h", "texte": "AUTRE-02 · Validation clinique par une IDE référente"}, {"type": "p", "texte": "Plusieurs seuils et listes cliniques ont été posés à titre provisoire par l'équipe de développement et attendent la relecture d'une infirmière référente : prérequis de passage (à jeun, matériel…), seuil de plaie « creusante » à 0,5 cm, plaie sans progrès au bout de 21 jours, prescription infirmière d'examens non honorée après 7 jours, blocs profonds de l'analgésie locorégionale, liste des MSD de l'enfant diabétique, tranches d'âge du bilan de prévention, critères de plaie « à risque ». Aucune de ces valeurs n'a été validée par un soignant."}, {"type": "p", "texte": "Question : Qui valide les seuils et listes cliniques provisoires, et comment ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Une IDE référente de TABSANTE relit et fixe chaque valeur", "Une seule validation pour tous les cabinets ; il faut lui transmettre la liste complète."], ["B", "Les valeurs deviennent des réglages de chaque cabinet", "Chaque cabinet porte la responsabilité de ses valeurs ; plus de réglages à l'installation."], ["C", "Valider les valeurs actuelles telles quelles", "Rien ne change ; les valeurs restent des choix de développement."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Les valeurs provisoires s'appliquent, la plupart réglables dans Paramètres › Simulations, sans validation clinique."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : DIA-F02, EX-CI-37, Q-69"}, {"type": "h", "texte": "D-01 · Recalage d'une fréquence espacée"}, {"type": "p", "texte": "Pour un soin espacé (par exemple tous les trois jours), un passage peut être décalé ou non réalisé. Il faut décider si les passages suivants restent sur le calendrier d'origine ou repartent du dernier passage réellement fait. Cela change les dates prévues, le nombre de passages et la facturation."}, {"type": "p", "texte": "Question : Après un passage décalé ou manqué, d'où repart le calendrier ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Du calendrier d'origine (appliqué aujourd'hui)", "Les dates prévues ne bougent pas ; deux passages peuvent se rapprocher."], ["B", "Du dernier passage réellement fait", "Intervalle respecté, mais le calendrier glisse et la fin de l'ordonnance peut être dépassée."], ["C", "Au choix par type de soin, réglé par le cabinet", "Plus souple ; un réglage de plus à tenir."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Calendrier d'origine par défaut ; « dernier passage effectif » réglable soin par soin."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : Q-10, CDC §4.3, §6.4, EX-PF-06, registre des simulations"}, {"type": "h", "texte": "Q-26 · Chute des plaquettes sous anticoagulant injectable"}, {"type": "p", "texte": "Sous héparine, une chute des plaquettes peut signaler une thrombopénie. L'application compare chaque résultat à la référence et au résultat précédent. Au-delà d'un seuil, un bandeau s'affiche et une notification au prescripteur est proposée, jamais envoyée d'office."}, {"type": "p", "texte": "Question : À partir de quelle baisse des plaquettes faut-il alerter ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Baisse de 30 % (appliqué aujourd'hui)", "Alerte précoce, quelques fausses alertes."], ["B", "Baisse de 50 %", "Moins d'alertes, détection plus tardive."], ["C", "Baisse de 20 %", "Très sensible, beaucoup d'alertes."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Seuil de −30 %, réglable de −20 à −50 %, contre la référence ou la valeur précédente."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : ACI-RG-07, ACI-O3, registre des simulations"}, {"type": "h", "texte": "Q-29 · Rotation des sites d'injection"}, {"type": "p", "texte": "Le schéma corporel signale une zone trop souvent piquée (insuline, anticoagulant). Le cahier des charges veut un seuil propre à chaque fiche ; l'application applique aujourd'hui un seuil unique pour toutes les fiches. Le signal n'est jamais bloquant."}, {"type": "p", "texte": "Question : Quel seuil de sur-emploi d'une zone d'injection faut-il retenir ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Un seuil unique : 3 emplois en 7 jours et la moitié des injections (appliqué aujourd'hui)", "Même règle pour toutes les fiches, écart avec le cahier des charges."], ["B", "Un seuil par fiche (insuline, anticoagulant, autres injections)", "Conforme au cahier ; l'IDE référente fixe chaque valeur."], ["C", "Aucun signal", "Le schéma montre les sites, sans alerte."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Une zone est signalée si elle porte trois emplois en sept jours et au moins la moitié des injections de la période, même règle au terminal."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : C18, INJ-RG-*, DIA-RG-*"}, {"type": "h", "texte": "AUTRE-03 · Sur-consommation d'appareillage de stomie"}, {"type": "p", "texte": "L'application compare, semaine par semaine sur douze semaines, les socles et poches posés à la quantité prescrite par mois. L'écart se lit à l'écran, mais rien ne s'alerte : le seuil qui ferait signal n'a jamais été fixé. Une sur-consommation peut révéler une fuite, une peau abîmée ou un appareillage inadapté."}, {"type": "p", "texte": "Question : À partir de quand une sur-consommation d'appareillage doit-elle déclencher une alerte ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Jamais : l'écart se lit, sans alerte (appliqué aujourd'hui)", "Aucune fausse alerte, mais la dérive peut passer inaperçue."], ["B", "Dès une semaine en dépassement", "Alerte rapide, plus fréquente."], ["C", "Dépassement de plus de 20 % sur quatre semaines", "Alerte sur une tendance, moins de bruit."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Consommation affichée face au prescrit, semaines en dépassement visibles, aucune alerte."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : STD-O7, STU-O6, EX-PI-08, audit du 16/10 P0-20"}, {"type": "h", "texte": "Q-28 · Heure prise au lit pendant un prélèvement"}, {"type": "p", "texte": "Pour les hémocultures et le contrôle d'identité d'un prélèvement, l'heure doit être celle du soin au lit du patient. L'application accepte une heure prise pendant le passage, dans une fenêtre autour du soin."}, {"type": "p", "texte": "Question : Quelle fenêtre avant le soin est admise pour ces heures ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Deux heures avant le soin (appliqué aujourd'hui)", "Souple pour les tournées chargées."], ["B", "Une heure avant le soin", "Plus strict."], ["C", "Quatre heures avant le soin", "Très souple, moins de garantie sur l'heure réelle."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Fenêtre de deux heures avant le soin (réglable de 1 à 4) jusqu'à la saisie."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : PRL-RG-*, registre des simulations"}, {"type": "h", "texte": "Q-90 · Pulvérisation de médicaments : fiche Injections ou fiche Médicaments"}, {"type": "p", "texte": "Le cahier des charges se contredit : un passage dit que la pulvérisation ne relève pas des Injections, un autre la range dans les Injections. L'application la garde dans les Injections, ligne par ligne avec produit, dosage et lot, sans site d'injection. Un médicament nasal ou inhalé du traitement courant reste dans la fiche Médicaments."}, {"type": "p", "texte": "Question : Dans quelle fiche tracer une pulvérisation prescrite comme acte ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Fiche Injections, ligne à part (appliqué aujourd'hui)", "Traçabilité la plus stricte ; le moteur décide de la cotation."], ["B", "Fiche Médicaments", "Fondue dans l'acte unique du passage ; les lignes déjà signées sont à reprendre."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : La pulvérisation reste une ligne typée de la fiche Injections, sans site ni schéma corporel."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : CDC §6.3 bis, fiche 19 §1, INJ-E06, INJ-O10, INJ-RG-18"}, {"type": "h", "texte": "Q-61 · Lecture du test tuberculinique"}, {"type": "p", "texte": "À la création d'une fréquence, l'application propose la pose du test tuberculinique ; sa lecture est prévue à la pose et tracée ensuite avec son résultat. La question est de savoir si la lecture demande sa propre prescription."}, {"type": "p", "texte": "Question : La lecture du test tuberculinique se prescrit-elle à part ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, elle découle de la prescription de la pose (appliqué aujourd'hui)", "Une seule fréquence ; la lecture suit la pose."], ["B", "Oui, prescription distincte", "La lecture devient un soin proposé à part, avec sa propre ordonnance."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Seule la pose est proposée comme soin ; la lecture est attendue après la pose et exige son résultat."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : INJ-RG-20, INJ-O3, EX-PF-06 ter"}, {"type": "h", "texte": "Q-98 · Voie inhalée dans la fiche Médicaments"}, {"type": "p", "texte": "La fiche Soins respiratoires renvoie l'administration inhalée (spray, poudre) à la fiche Médicaments, mais la liste des voies de cette fiche ne comporte pas « inhalée ». L'application l'a ajoutée à titre provisoire."}, {"type": "p", "texte": "Question : Faut-il ajouter la voie « inhalée » à la liste des voies de la fiche Médicaments ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui, ajouter « inhalée » (appliqué aujourd'hui)", "Les sprays et poudres sont tracés sous leur vraie voie."], ["B", "Non, les ranger sous une voie existante (nasale)", "Liste inchangée, traçabilité moins précise."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : La voie « inhalée » est proposée au poste fixe et au terminal."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : RES-RG-16, MED-F13"}, {"type": "h", "texte": "Q-97 · Une fréquence pour plusieurs plaies ou dispositifs"}, {"type": "p", "texte": "Un patient peut avoir deux plaies pansées au même rythme. Aujourd'hui, chaque plaie a sa propre fréquence. Le cahier des charges laisse ouverte la possibilité d'une fréquence commune."}, {"type": "p", "texte": "Question : Une même fréquence peut-elle servir plusieurs plaies ou dispositifs ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, une fréquence par plaie ou dispositif (appliqué aujourd'hui)", "Suivi séparé, deux lignes au planning."], ["B", "Oui, avec un passage prévu par plaie", "Une seule ordonnance saisie, chaque plaie garde ses passages."], ["C", "Oui, avec un seul passage pour toutes", "Planning plus léger ; les compteurs par plaie sont moins lisibles."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Une fréquence sert un objet au plus ; un acte peut servir plusieurs occurrences sans multiplier la facturation."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : CDC §4.3, §4.9, MOD-47"}, {"type": "h", "texte": "D-21 · Fiche de suivi de la séance RAAC"}, {"type": "p", "texte": "Après une chirurgie en récupération améliorée (RAAC), l'infirmière remplit une fiche de suivi postopératoire. Il faut savoir si c'est la fiche de l'établissement, déposée dans le dossier, ou un document produit par l'application."}, {"type": "p", "texte": "Question : Quelle fiche de suivi RAAC l'infirmière utilise-t-elle ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "La fiche de l'établissement, déposée dans le dossier (appliqué aujourd'hui)", "Pas de document à produire ; dépend de ce que l'établissement fournit."], ["B", "Une fiche produite par TabSanté", "Document homogène ; son contenu et sa forme sont à définir."], ["C", "Au choix pour chaque parcours", "Souple ; les deux circuits sont à tenir."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Choix au parcours, « celle de l'établissement » par défaut ; l'option « générée » ne produit encore aucun document."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-23, EX-CI-18, EX-CI-19, EX-PAR-07"}, {"type": "h", "texte": "Q-25 · Perfusion ou séance laissée en place sans intervenant attribué"}, {"type": "p", "texte": "Quand une perfusion ou une séance de dialyse arrive à sa fin prévue, l'intervenant attribué à la tournée est prévenu. S'il n'y a personne d'attribué, il faut décider qui reçoit l'avis."}, {"type": "p", "texte": "Question : Sans intervenant attribué, qui est prévenu de la fin prévue d'une perfusion ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Le cabinet (appliqué aujourd'hui)", "Tous les infirmiers du cabinet reçoivent l'avis."], ["B", "L'intervenant de la tournée suivante", "Avis ciblé, mais possiblement tardif."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Avis à l'intervenant attribué le jour de la fin prévue, au cabinet à défaut."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : PIV-RG-05, DIP-RG-15, NUT-RG-07"}, {"type": "h", "texte": "Q-17 · Trame d'entretien du bilan de prévention"}, {"type": "p", "texte": "Le bilan de prévention suit une trame de thèmes par tranche d'âge. La trame actuelle (18 thèmes) a été proposée d'après Mon Bilan Prévention, sans alignement fin sur les fiches et l'auto-questionnaire publiés par le ministère. Un thème hors trame est refusé à la signature."}, {"type": "p", "texte": "Question : Qui aligne la trame du bilan de prévention sur les documents du ministère ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Garder la trame provisoire (appliqué aujourd'hui)", "Utilisable, mais peut diverger des fiches officielles."], ["B", "TABSANTE l'aligne sur les fiches et l'auto-questionnaire du ministère", "Trame officielle, publiée comme nouvelle version du référentiel."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : 18 thèmes par tranche d'âge, proposés d'après Mon Bilan Prévention ; thème hors trame refusé à la signature."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : Q-17 (première moitié), EX-CI-41, EX-CI-40"}]}, {"id": "qo-roles", "titre": "Rôles et droits (AS, remplaçant, administrateur)", "resume": "Aide-soignant, remplaçant, administrateur, comptes Keycloak et Pro Santé Connect : qui voit, signe et fait quoi.", "mots_cles": ["D-02", "Q-30", "Q-85", "D-08", "Q-88", "Q-89", "Q-65", "Q-31", "Q-93", "Q-100", "Q-101", "aide-soignant", "AS", "remplaçant", "administrateur", "habilitations", "Keycloak", "RPPS", "Pro Santé Connect", "CPS"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "11 questions, aucune bloquante."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["D-02", "Signature des actes de l'aide-soignant", "Important", "Fondateur", "A · Par sa session personnelle dans l'application"], ["Q-30", "Aide-soignant dans un cabinet libéral (démonstration)", "Important", "Fondateur", "A · Garder un cabinet libéral avec AS (écart toléré)"], ["Q-85", "Ce que voit l'administrateur non soignant", "Important", "Fondateur", "A · Non : pas de soins, pas de cotation"], ["D-08", "Qui peut requalifier une transmission", "Confort", "Fondateur", "A · Tout infirmier du cabinet"], ["Q-88", "Transmission ciblée écrite par l'aide-soignant", "Confort", "IDE référente", "A · Non, elle est valable telle quelle"], ["Q-89", "Qui est prévenu d'un document déposé", "Confort", "Fondateur", "A · Tous les soignants du cabinet"], ["Q-65", "Retirer la responsabilité ou l'administration du cabinet", "Confort", "Fondateur", "A · Non, seulement l'intéressé ou l'administration"], ["Q-31", "Qui prend un rendez-vous à l'agenda", "Confort", "Fondateur", "A · Les infirmiers seulement"], ["Q-93", "Plan de soins au terminal pour l'aide-soignant", "Confort", "Fondateur", "A · Non, infirmiers seulement"], ["Q-100", "Reconnaître l'intervenant d'un compte Keycloak", "Confort", "Fondateur", "A · Confirmer ; le RPPS ambigu est refusé"], ["Q-101", "Comptes nés de Pro Santé Connect", "Confort", "Fondateur", "A · Deux comptes séparés"]]}, {"type": "h", "texte": "D-02 · Signature des actes de l'aide-soignant"}, {"type": "p", "texte": "L'aide-soignant signe ses actes de nursing, mais il n'a pas de carte CPS donnant des droits de facturation. Il faut choisir comment il s'identifie et signe, en lien avec Pro Santé Connect et un identifiant national."}, {"type": "p", "texte": "Question : Comment l'aide-soignant s'identifie-t-il et signe-t-il ses actes ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Par sa session personnelle dans l'application (appliqué aujourd'hui)", "Simple ; la signature n'a pas la force d'une carte."], ["B", "Par Pro Santé Connect (e-CPS) avec son identifiant national", "Signature forte et traçable ; suppose que chaque AS ait un identifiant national et une e-CPS."], ["C", "Par sa session, avec contresignature d'une IDE", "Responsabilité partagée, charge de relecture pour l'IDE."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : L'AS signe avec sa session, la signature par carte lui est refusée."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §3, §6.6, §9, EX-NUR-01, EX-RS-03"}, {"type": "h", "texte": "Q-30 · Aide-soignant dans un cabinet libéral (démonstration)"}, {"type": "p", "texte": "Le cahier des charges réserve le module aide-soignant aux SELAS. Or la démonstration montre une aide-soignante dans un cabinet libéral, et le serveur accepte encore qu'un AS signe un nursing hors SELAS. Passer la démonstration en SELAS change aussi l'émetteur des feuilles de soins, qui devient la structure."}, {"type": "p", "texte": "Question : Que faire de l'aide-soignante de la démonstration ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Garder un cabinet libéral avec AS (écart toléré) (appliqué aujourd'hui)", "Démonstration inchangée, mais non conforme à la règle SELAS."], ["B", "Passer la démonstration en SELAS", "Conforme ; les feuilles de soins sont émises par la structure."], ["C", "Refuser au serveur toute signature d'AS hors SELAS", "Conforme ; la démonstration libérale perd son AS."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Module activé en structure seulement au poste fixe et au terminal, mais le serveur laisse encore signer le nursing à un AS hors SELAS."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : NUR-RG-16 (Partiel), audit du 16/10 P1-41"}, {"type": "h", "texte": "Q-85 · Ce que voit l'administrateur non soignant"}, {"type": "p", "texte": "L'administrateur du cabinet (secrétariat, gestion) n'est pas soignant. Par prudence, il n'a pas accès au dossier clinique ni à la cotation : il gère l'équipe, les habilitations, les tournées sans la nature des soins, les lots et rejets sans lire les feuilles de soins, et voit l'identité des patients. Pour répartir les tournées, il pourrait avoir besoin de voir les soins."}, {"type": "p", "texte": "Question : Faut-il élargir ce que voit l'administrateur non soignant ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non : pas de soins, pas de cotation (appliqué aujourd'hui)", "Secret médical le mieux protégé ; les soignants répartissent les tournées."], ["B", "Voir les soins d'une tournée, sans le dossier", "Il peut répartir les tournées ; il connaît la nature des soins."], ["C", "Voir aussi les feuilles de soins pour gérer lots et rejets", "Gestion de la facturation complète ; accès à des données de santé."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Action « Lire le dossier clinique » refusée à l'administration ; ni cotation ni file de contrôle ; lots et rejets sans lire les feuilles ; planification sans la nature des soins."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : HAB-34, ACT-07, HAB-22, HAB-32, HAB-33, CSP L.1110-4"}, {"type": "h", "texte": "D-08 · Qui peut requalifier une transmission"}, {"type": "p", "texte": "Une transmission peut changer de registre (par exemple d'une note simple à une transmission ciblée), et la trace est gardée. Il faut dire qui a le droit de le faire."}, {"type": "p", "texte": "Question : Qui peut faire passer une transmission d'un registre à l'autre ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Tout infirmier du cabinet (appliqué aujourd'hui)", "Souple ; chaque requalification est journalisée."], ["B", "L'infirmier auteur ou l'IDE référent du patient seulement", "Plus contrôlé, moins réactif."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Les infirmiers peuvent toujours requalifier ; l'administration du cabinet peut restreindre ce droit par un réglage journalisé."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §6.9, EX-TR-03"}, {"type": "h", "texte": "Q-88 · Transmission ciblée écrite par l'aide-soignant"}, {"type": "p", "texte": "L'aide-soignant peut écrire une transmission ciblée et demander l'avis d'une infirmière, dont il lit la réponse. Il ne fait pas d'entretien infirmier, ne traite ni ne requalifie, et ne confirme pas une ciblée proposée par une règle clinique."}, {"type": "p", "texte": "Question : La transmission ciblée de l'aide-soignant doit-elle être relue par une infirmière ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, elle est valable telle quelle (appliqué aujourd'hui)", "L'AS transmet directement ; l'IDE est sollicitée seulement si l'AS l'interpelle."], ["B", "Oui, contresignée par l'IDE référente du patient", "Contrôle clinique de chaque ciblée, charge de relecture."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : L'AS émet ses ciblées dans les limites ci-dessus, sans contresignature."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : HAB-16, HAB-20, HAB-21, EX-SC-05, C7, C8"}, {"type": "h", "texte": "Q-89 · Qui est prévenu d'un document déposé"}, {"type": "p", "texte": "Un correspondant extérieur peut déposer un document par QR code (ordonnance, compte rendu…). Tous les soignants du cabinet, aides-soignants compris, en sont avisés (titre, type, émetteur) ; le message joint reste aux infirmiers."}, {"type": "p", "texte": "Question : Qui doit être avisé d'un document déposé pour un patient ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Tous les soignants du cabinet (appliqué aujourd'hui)", "Personne ne le manque ; plus de notifications."], ["B", "Les soignants qui ont le patient en tournée", "Moins de bruit ; un document peut attendre si le patient n'est pas en tournée."], ["C", "Les infirmiers seulement", "Les AS ne sont plus avisés."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Avis à tous les soignants du cabinet, l'administrateur non soignant n'en reçoit rien."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-TR-07, EX-TR-06, EX-CO-01"}, {"type": "h", "texte": "Q-65 · Retirer la responsabilité ou l'administration du cabinet"}, {"type": "p", "texte": "Aujourd'hui, seuls l'intéressé ou l'administration du cabinet peuvent retirer à quelqu'un la responsabilité ou l'administration du cabinet. En cas de départ ou de conflit, un autre titulaire ne peut pas le faire. La question couvre aussi le passage d'un ancien remplaçant devenu associé au statut de titulaire."}, {"type": "p", "texte": "Question : Un autre titulaire peut-il retirer la responsabilité ou l'administration du cabinet ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, seulement l'intéressé ou l'administration (appliqué aujourd'hui)", "Protège contre un retrait abusif ; blocage possible en cas de conflit."], ["B", "Oui, tout autre titulaire", "Débloque les départs ; risque de retrait unilatéral."], ["C", "Oui, à deux titulaires d'accord", "Équilibre entre sécurité et déblocage."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Retrait par l'intéressé ou l'administration du cabinet seulement."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : HAB-33, CDC §3.2"}, {"type": "h", "texte": "Q-31 · Qui prend un rendez-vous à l'agenda"}, {"type": "p", "texte": "Un rendez-vous de soin se prend aujourd'hui avec le droit de créer une fréquence, réservé aux infirmiers. Une seconde pose d'étui pénien dans les 24 heures est tracée et signalée, sans motif exigé."}, {"type": "p", "texte": "Question : Qui peut prendre un rendez-vous de soin à l'agenda ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Les infirmiers seulement (appliqué aujourd'hui)", "Le planning reste entre les mains des soignants qui prescrivent les fréquences."], ["B", "Les infirmiers et l'administration du cabinet", "Le secrétariat peut planifier, sans voir le dossier clinique."], ["C", "Les infirmiers et les aides-soignants", "Les AS organisent leurs soins de nursing."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Droit de créer une fréquence nécessaire ; fiches rattachées au patient seulement ; annulation motivée."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : SEG-5, HAB-09"}, {"type": "h", "texte": "Q-93 · Plan de soins au terminal pour l'aide-soignant"}, {"type": "p", "texte": "Au terminal, le plan de soins se consulte en lecture seule par les infirmiers. Il nomme les actes prescrits ; l'aide-soignant ne le reçoit pas."}, {"type": "p", "texte": "Question : L'aide-soignant doit-il voir le plan de soins au terminal ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, infirmiers seulement (appliqué aujourd'hui)", "L'AS ne voit pas les actes prescrits."], ["B", "Oui, sans les actes prescrits", "L'AS voit l'organisation des soins sans le détail médical."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Lecture seule, infirmier seulement, gardée avec les données du jour."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : tableau 43, MOD-15"}, {"type": "h", "texte": "Q-100 · Reconnaître l'intervenant d'un compte Keycloak"}, {"type": "p", "texte": "À la connexion par Keycloak, TabSanté doit retrouver l'intervenant. Aujourd'hui, il le reconnaît par le compte Keycloak rattaché à l'intervenant, sinon par le numéro RPPS porté par le jeton (attribut du compte que seule l'administration modifie, ou attesté par Pro Santé Connect), l'intervenant devant être en exercice. Le rôle du compte Keycloak doit être celui de l'intervenant (IDE, AS, administrateur). Le rôle « remplaçant » de Keycloak reste indicatif : la portée vient de l'habilitation TabSanté (matrice des profils, CDC §3.2). Un RPPS qui correspond à plusieurs intervenants en exercice, par exemple un infirmier de deux cabinets, est refusé : il faut alors rattacher son compte."}, {"type": "p", "texte": "Question : Confirmez-vous cette reconnaissance, et comment choisir le cabinet d'un infirmier qui exerce dans plusieurs ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Confirmer ; le RPPS ambigu est refusé (appliqué aujourd'hui)", "L'infirmier de plusieurs cabinets fait rattacher son compte Keycloak à un seul intervenant ; aucun choix de cabinet à la connexion."], ["B", "Choisir le cabinet à la connexion", "Après l'identification, l'infirmier choisit le cabinet où il travaille ; écran et règle à développer."], ["C", "Un compte Keycloak par cabinet", "Aucun développement ; l'infirmier garde un identifiant par cabinet, chacun rattaché à son intervenant."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Compte rattaché, sinon RPPS ; rôle du compte Keycloak exigé ; un RPPS rattaché à plusieurs intervenants en exercice est refusé, le compte doit être rattaché."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §3.2, NFR-04, matrice de couverture §7.1"}, {"type": "h", "texte": "Q-101 · Comptes nés de Pro Santé Connect"}, {"type": "p", "texte": "Avec la carte CPS, la connexion passe par Pro Santé Connect, branché en amont de Keycloak (simulé aujourd'hui). À la première connexion par carte, Keycloak crée un compte propre à ce RPPS, importe le RPPS et lui donne le rôle IDE ; TabSanté ne l'ouvre qu'à un infirmier du cabinet portant ce RPPS. La profession n'est pas contrôlée tant que Pro Santé Connect est simulé ; avec le service réel, elle viendra de son attestation. Une même personne peut donc avoir deux comptes Keycloak : celui à mot de passe et celui né de la carte."}, {"type": "p", "texte": "Question : Gardez-vous deux comptes séparés (mot de passe et carte), ou faut-il les lier en un seul compte par personne ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Deux comptes séparés (appliqué aujourd'hui)", "Déjà en place ; la personne est retrouvée par son RPPS dans les deux cas ; deux comptes à fermer au départ d'un intervenant."], ["B", "Lier le compte de la carte au compte à mot de passe", "Un seul compte par personne, fermé en une fois ; rapprochement à configurer dans Keycloak à la première connexion par carte."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Compte créé à la première connexion par carte, RPPS importé, rôle IDE ; ouvert seulement à un infirmier du cabinet portant ce RPPS ; aucun contrôle de profession tant que Pro Santé Connect est simulé."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : INT-05 (Simulé), INT-06 (Simulé), D-02, matrice de couverture §7.1"}]}, {"id": "qo-tournees", "titre": "Tournées, planning et notifications", "resume": "Saisie différée, téléphone muet, cartes, absences, rappels, préchargement du terminal : l'organisation des tournées.", "mots_cles": ["D-04", "Q-71", "Q-39", "Q-69", "AUTRE-04", "Q-46", "Q-49", "Q-50", "Q-51", "Q-52", "Q-44", "Q-87", "AUTRE-05", "Q-105", "tournée", "planning", "saisie différée", "téléphone muet", "carte", "itinéraire", "absences", "rappels", "retard", "préchargement", "lendemain"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "14 questions, aucune bloquante."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["D-04", "Délai maximal de saisie différée", "Important", "Fondateur", "A · 120 minutes"], ["Q-71", "Téléphone muet pendant une tournée", "Important", "Fondateur", "A · 2 heures, pendant une tournée en cours seulement"], ["Q-39", "Carte, adresses et itinéraires en production", "Important", "Fondateur", "Rien de choisi"], ["Q-69", "Prérequis de passage (à jeun, matériel, ordonnance)", "Important", "IDE référente", "Rien de choisi"], ["AUTRE-04", "Rappels automatiques aux patients (WhatsApp, SMS)", "Confort", "Fondateur", "A · Non, pas de rappels automatiques"], ["Q-46", "Absences des intervenants", "Confort", "Fondateur", "A · Non, déclarée sans validation"], ["Q-49", "Marge autour d'une heure prescrite", "Confort", "IDE référente", "A · 30 minutes avant ou après, pour tous les soins"], ["Q-50", "Journée de référence d'un intervenant", "Confort", "Fondateur", "A · 7 heures pour tous"], ["Q-51", "Validation de la tournée du lendemain", "Confort", "Fondateur", "A · Facultative"], ["Q-52", "Zone d'intervention du cabinet", "Confort", "Fondateur", "A · Un cercle autour du cabinet"], ["Q-44", "Durée des soins par intervenant visible de l'équipe", "Confort", "Fondateur", "A · Toute l'équipe"], ["Q-87", "Alerte d'une interpellation non lue", "Confort", "Fondateur", "A · 4 heures, une seule alerte"], ["AUTRE-05", "Prévenir le patient d'un retard", "Confort", "Fondateur", "A · 10 minutes"], ["Q-105", "Horizon du préchargement du terminal", "Confort", "IDE référente", "A · La tournée du jour seulement"]]}, {"type": "h", "texte": "D-04 · Délai maximal de saisie différée"}, {"type": "p", "texte": "En cas d'incident (téléphone en panne, oubli), un soin peut être saisi après coup. Le cahier des charges fixe un délai maximal au-delà duquel une intervention au poste fixe est nécessaire. Le même délai borne ce qu'un remplaçant peut encore envoyer après la fin de son remplacement."}, {"type": "p", "texte": "Question : Quel délai maximal accordez-vous pour saisir un soin après coup ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "120 minutes (appliqué aujourd'hui)", "Saisie quasi immédiate ; au-delà, régularisation au poste fixe avec motif."], ["B", "Fin de la journée de tournée", "Plus souple pour les tournées chargées."], ["C", "24 heures", "Très souple, moins de garantie sur l'exactitude des heures."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Valeur provisoire de 120 minutes, au serveur et au terminal ; le seuil d'alerte et le délai maximal sont aujourd'hui confondus ; la même durée borne la remontée d'un remplaçant après sa période."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-36, CDC §8.3"}, {"type": "h", "texte": "Q-71 · Téléphone muet pendant une tournée"}, {"type": "p", "texte": "Si le téléphone d'un intervenant ne se synchronise plus pendant sa tournée, le cabinet doit pouvoir s'inquiéter : panne, accident, zone blanche. L'application le signale dans « À traiter » au-delà d'un seuil, propose d'appeler l'intervenant, et ne montre jamais sa position."}, {"type": "p", "texte": "Question : Au bout de combien de temps de silence le cabinet doit-il être alerté ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "2 heures, pendant une tournée en cours seulement (appliqué aujourd'hui)", "Peu de fausses alertes."], ["B", "1 heure", "Réaction plus rapide, plus d'alertes en zone blanche."], ["C", "Seuil propre à chaque moment (matin, midi, soir, nuit)", "Adapté au rythme ; un réglage de plus."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Alerte au-delà de 2 heures (réglable de 30 min à 4 h), comptée depuis la dernière synchronisation sans remonter avant le départ ; rien hors tournée ; « Appeler » et « Marquer comme vu » ; aucune position ni donnée de patient ; vue par qui organise les tournées."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §8.2, §6.5, OFF-*, registre des simulations"}, {"type": "h", "texte": "Q-39 · Carte, adresses et itinéraires en production"}, {"type": "p", "texte": "La carte des tournées utilise aujourd'hui un fond libre de démonstration ; adresses, itinéraires, météo et trafic sont simulés. En production, les tuiles demandées révèlent la zone des patients, et une adresse ne doit pas sortir vers un tiers sans contrat."}, {"type": "p", "texte": "Question : Quels services de carte et d'itinéraire utiliser en production ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Services libres auto-hébergés chez l'hébergeur de santé", "Aucune adresse ne sort ; à installer et maintenir."], ["B", "Fournisseur payant sous contrat de sous-traitance", "Prêt à l'emploi ; coût et contrat."], ["C", "Pas de carte en production, schéma de tournée seulement", "Aucun risque ; heures d'arrivée moins précises."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Fond de carte libre de démonstration sans clé ; géocodage, itinéraire, météo et trafic simulés ; aucun appel réseau par défaut."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-40, Q-41, CDC §6.5"}, {"type": "h", "texte": "Q-69 · Prérequis de passage (à jeun, matériel, ordonnance)"}, {"type": "p", "texte": "Avant certains soins, le patient doit être prêt : à jeun, matériel à récupérer en pharmacie, ordonnance et carte Vitale. L'application propose une liste par soin, que chaque cabinet active ou décale. Cette liste est une proposition de départ et doit être validée avant tout usage auprès des patients."}, {"type": "p", "texte": "Question : Qui valide la liste des prérequis de passage ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Une IDE référente de TABSANTE, pour tous les cabinets", "Liste commune validée, publiée en nouvelle version."], ["B", "Chaque cabinet pour lui-même", "Responsabilité au cabinet ; pas de liste commune validée."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Liste provisoire « à valider par un référent IDE » ; le cabinet active, retire ou décale chaque prérequis ; aucun message n'est envoyé au patient."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : PRL-RG-11"}, {"type": "h", "texte": "AUTRE-04 · Rappels automatiques aux patients (WhatsApp, SMS)"}, {"type": "p", "texte": "Des rappels automatiques sont envisagés : passage de demain, heure d'arrivée, préparation, report. Rien n'est construit. Dire qu'une infirmière passe chez quelqu'un est une donnée de santé : il faut le consentement du patient, et WhatsApp n'est pas un hébergeur de données de santé. Si vous engagez le projet, il faudra ensuite choisir prestataire, budget, contenu des messages, heures d'envoi et rôle de l'aidant."}, {"type": "p", "texte": "Question : Faut-il engager les rappels automatiques aux patients ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, pas de rappels automatiques (appliqué aujourd'hui)", "Seul le geste « Prévenir le patient » du téléphone de l'infirmière existe."], ["B", "Oui, par SMS seulement", "Touche aussi les patients âgés sans WhatsApp ; un prestataire SMS et un contrat de sous-traitance."], ["C", "Oui, WhatsApp ou SMS au choix du patient", "Canal préféré du patient ; deux prestataires, modèles validés par Meta, coût par conversation."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Aucun rappel automatique ; cadrage écrit mais non engagé ; l'équipe est prévenue par les notifications de l'application."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : hors CDC, Q-42, Q-53 à Q-60 (closes hors CDC)"}, {"type": "h", "texte": "Q-46 · Absences des intervenants"}, {"type": "p", "texte": "Un intervenant déclare ses congés, maladie ou formation ; ses tournées à venir deviennent « à couvrir » avec des propositions de remplacement. Le motif « maladie » n'est vu que par l'intéressé et par qui organise les tournées. Une attribution pendant une absence est refusée."}, {"type": "p", "texte": "Question : Une absence déclarée doit-elle être validée ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, déclarée sans validation (appliqué aujourd'hui)", "Simple et immédiat ; aucune vérification."], ["B", "Oui, par qui organise les tournées", "Contrôle des absences ; un délai de prévenance peut être exigé."], ["C", "Seul qui organise les tournées peut saisir une absence", "Centralisé ; l'intervenant doit passer par lui."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : L'intéressé ou qui organise les tournées déclare l'absence, sans validation ; motifs congé, maladie, formation ; attribution refusée pendant une absence ; échange refusé au terminal."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-47, Q-48, CDC §6.5 (à préciser)"}, {"type": "h", "texte": "Q-49 · Marge autour d'une heure prescrite"}, {"type": "p", "texte": "Certains soins ont une heure prescrite (insuline, anticoagulant). Pour proposer l'ordre de la tournée, l'application admet une marge autour de cette heure et pénalise fortement un retard sur une heure fixe."}, {"type": "p", "texte": "Question : Quelle marge accepter autour d'une heure prescrite ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "30 minutes avant ou après, pour tous les soins (appliqué aujourd'hui)", "Règle unique, simple."], ["B", "Une marge par type de soin", "Plus juste cliniquement, liste à fixer par l'IDE référente."], ["C", "Aucune marge : heure impérative", "Tournées moins optimisables."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : ± 30 minutes ; une minute de retard sur une heure fixe compte comme vingt minutes hors fenêtre dans le calcul de l'ordre."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : CDC §6.5"}, {"type": "h", "texte": "Q-50 · Journée de référence d'un intervenant"}, {"type": "p", "texte": "Pour dire si une journée est remplie, l'application rapporte soins et trajets à une journée de 7 heures, la même pour tous. Les temps partiels ne sont pas distingués."}, {"type": "p", "texte": "Question : Quelle journée de référence utiliser pour mesurer la charge ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "7 heures pour tous (appliqué aujourd'hui)", "Simple ; un temps partiel paraît sous-chargé."], ["B", "Une durée par intervenant", "Charge juste pour les temps partiels ; un réglage par personne."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Trajets et soins rapportés à 7 heures par intervenant attribué, sur des estimations simulées."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §6.5"}, {"type": "h", "texte": "Q-51 · Validation de la tournée du lendemain"}, {"type": "p", "texte": "La veille, qui tient ou organise la tournée peut la valider (ordre, durée, fin estimée) ; l'intervenant attribué en est notifié. Si l'ordre change ensuite, la validation est signalée périmée."}, {"type": "p", "texte": "Question : La validation de la tournée du lendemain doit-elle être obligatoire ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Facultative (appliqué aujourd'hui)", "Pas de contrainte ; rien ne peut s'y fier systématiquement."], ["B", "Obligatoire la veille", "Une tournée fiable chaque jour ; un rappel si elle n'est pas validée."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Validation facultative, gardée et notifiée à l'intervenant attribué ; aucun rappel au patient."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §6.5"}, {"type": "h", "texte": "Q-52 · Zone d'intervention du cabinet"}, {"type": "p", "texte": "Un domicile hors de la zone d'intervention est signalé, et une attribution exige alors un motif. La zone est aujourd'hui un cercle autour du point de départ des tournées."}, {"type": "p", "texte": "Question : Comment définir la zone d'intervention ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Un cercle autour du cabinet (appliqué aujourd'hui)", "Simple ; ne suit pas les limites réelles (rivière, commune)."], ["B", "Une liste de communes", "Conforme aux habitudes des cabinets ; à saisir à l'installation."], ["C", "Des secteurs dessinés sur la carte, par intervenant", "Le plus précis ; plus long à régler."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Cercle de 200 m à 50 km autour du point de départ ; domicile au-delà signalé, dérogation motivée."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §6.5"}, {"type": "h", "texte": "Q-44 · Durée des soins par intervenant visible de l'équipe"}, {"type": "p", "texte": "Pour estimer les tournées, l'application calcule la durée habituelle de chaque soin par intervenant, et l'équipe la voit (« Claire ≈ 25 min · Paul ≈ 32 min »). Les heures d'arrivée et de départ sont conservées pour ce calcul. Ces chiffres pourraient être utilisés pour évaluer ou contrôler le temps de travail."}, {"type": "p", "texte": "Question : Qui peut voir la durée des soins de chaque collègue ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Toute l'équipe (appliqué aujourd'hui)", "Transparence ; risque de comparaison entre collègues."], ["B", "L'intéressé et qui organise les tournées", "Estimation conservée, comparaison limitée."], ["C", "Personne : seulement une durée moyenne du cabinet", "Aucune comparaison possible ; estimation moins fine."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Médiane par intervenant visible de l'équipe ; durées par défaut provisoires par fiche ; horaires conservés sans durée limite."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-43 (usage des horaires, information des intervenants)"}, {"type": "h", "texte": "Q-87 · Alerte d'une interpellation non lue"}, {"type": "p", "texte": "Quand une infirmière ou une AS interpelle un collègue, la demande peut rester sans réponse. Au bout de 4 heures, les infirmiers du cabinet sont avertis une fois."}, {"type": "p", "texte": "Question : Quel délai avant d'alerter sur une interpellation non lue ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "4 heures, une seule alerte (appliqué aujourd'hui)", "Règle unique pour tous les cabinets."], ["B", "Délai réglé par chaque cabinet", "Adapté à l'organisation de chacun."], ["C", "4 heures, puis seconde alerte au responsable", "Escalade en cas de non-réponse."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Une alerte quatre heures après l'émission aux infirmiers du cabinet, extrait seul."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-TR-04, §6.9, EX-TB-04"}, {"type": "h", "texte": "AUTRE-05 · Prévenir le patient d'un retard"}, {"type": "p", "texte": "Au terminal, au-delà de 10 minutes de retard, l'infirmière peut prévenir le patient d'un geste : son téléphone ouvre un appel ou un SMS pré-rempli d'un texte neutre (« environ N min de retard », sans nom ni soin), qu'elle envoie elle-même. Rien ne part du serveur."}, {"type": "p", "texte": "Question : À partir de quel retard proposer de prévenir le patient ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "10 minutes (appliqué aujourd'hui)", "Proposé tôt."], ["B", "20 minutes", "Proposé seulement pour un vrai retard."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Seuil de 10 minutes, texte neutre arrondi à 5 minutes, envoyé par l'infirmière depuis son téléphone."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-42 (partie seuil et texte, fonction existante)"}, {"type": "h", "texte": "Q-105 · Horizon du préchargement du terminal"}, {"type": "p", "texte": "Le terminal travaille hors connexion sur une copie chiffrée chargée à l'avance (la précharge). Le CDC §8.1 pose la question : « la tournée du jour, du lendemain ? ». Aujourd'hui, le terminal charge la tournée du jour attribuée à l'intervenant, tous moments, ses patients et ce que leurs fiches lisent hors connexion (dossier, plan de soins, derniers actes, séries, clichés à comparer). Mesure sur la démonstration : 13 patients et 30 passages, 640 Ko de précharge et 764 Ko de clichés, pour un plafond de 5 Mo."}, {"type": "p", "texte": "Question : Faut-il précharger aussi la tournée du lendemain, et à partir de quelle heure ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "La tournée du jour seulement (appliqué aujourd'hui)", "Le moins de données possible sur le téléphone ; la tournée du lendemain se prépare au poste fixe."], ["B", "Ajouter la tournée du lendemain à partir d'une heure fixée", "L'infirmier consulte sa tournée la veille, même sans réseau ; plus de données au domicile, et une tournée qui peut encore changer jusqu'au soir (absences, réattributions)."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Décision par défaut du 22/10/2026 (lot Finitions), réversible : la tournée du jour, ni le lendemain (il change jusqu'au soir), ni l'historique au-delà de ce que les fiches citent ; la précharge se recharge à chaque connexion et se compare au serveur toutes les cinq minutes."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : CDC §8.1, Q-51, matrice de couverture §7.1, documentation d'exploitation, chiffrement §3 bis"}]}, {"id": "qo-dossier", "titre": "Dossier patient et identité", "resume": "Identité INS, ordonnances, reprise des dossiers, renouvellements : le dossier patient.", "mots_cles": ["Q-82", "Q-83", "Q-84", "D-13", "Q-18", "Q-34", "Q-35", "INS", "identité", "ordonnance", "reprise", "Carea", "renouvellement", "bilan de prévention"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "7 questions, aucune bloquante."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["Q-82", "Qualification de l'identité (INS) et contrôle de la pièce", "Important", "Fondateur", "A · Non, au poste fixe seulement"], ["Q-83", "Ordonnance au nom d'un autre patient", "Important", "IDE référente", "A · Non, refus strict"], ["Q-84", "Ordonnance échue à la validation", "Important", "IDE référente", "A · Refuser ses fréquences"], ["D-13", "Reprise des dossiers depuis un autre logiciel", "Important", "Fondateur", "A · Carea seulement pour commencer"], ["Q-18", "Phrases libres sensibles dans le bilan de prévention", "Important", "Fondateur", "A · Filtre par mots du thème"], ["Q-34", "Relance d'une demande de renouvellement d'ordonnance", "Confort", "Fondateur", "A · 7 jours, même courrier"], ["Q-35", "Lien de dépôt envoyé au patient pour sa nouvelle ordonnance", "Confort", "Fondateur", "A · Non"]]}, {"type": "h", "texte": "Q-82 · Qualification de l'identité (INS) et contrôle de la pièce"}, {"type": "p", "texte": "Selon le référentiel national d'identitovigilance, l'identité devient « qualifiée » seulement après la réponse du téléservice INSi et le contrôle d'une pièce d'identité à haut niveau de confiance (jamais la carte Vitale). Aujourd'hui, ce contrôle se fait au poste fixe uniquement, et le statut « validée » (pièce contrôlée sans INSi) n'existe pas. Il faut aussi la procédure du cabinet : qui contrôle, quand recontrôler."}, {"type": "p", "texte": "Question : Le contrôle de la pièce d'identité doit-il pouvoir se faire au domicile depuis le terminal ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, au poste fixe seulement (appliqué aujourd'hui)", "Le patient vu uniquement à domicile reste « à qualifier » longtemps."], ["B", "Oui, au terminal aussi, avec numéro et date de validité de la pièce", "Qualification plus rapide ; une saisie de plus au domicile."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : « Récupérée » après INSi, « qualifiée » après contrôle tracé d'une pièce au poste fixe ; identité changée depuis : retour à « récupérée » ; seuls les envois au DMP et les échanges exigent « qualifiée »."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-ID-01, EX-ID-03, CV-01, HAB-05"}, {"type": "h", "texte": "Q-83 · Ordonnance au nom d'un autre patient"}, {"type": "p", "texte": "À la lecture d'une ordonnance, le nom et la date de naissance sont comparés au dossier. S'ils ne correspondent pas, la validation est refusée. Or le nom d'usage peut différer du nom de naissance, ou le prescripteur peut avoir fait une faute."}, {"type": "p", "texte": "Question : Faut-il permettre de valider une ordonnance dont le nom ne correspond pas, avec un motif ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non, refus strict (appliqué aujourd'hui)", "Aucun risque d'erreur de patient ; il faut faire corriger l'ordonnance."], ["B", "Oui, dérogation motivée et tracée par une infirmière", "Les cas de nom d'usage passent ; le nom d'usage est tenu au dossier."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Comparaison sans tenir compte des accents, de la casse, des tirets et de l'ordre nom/prénom ; discordance : validation refusée ; nom seul ou patient non lu : mention à vérifier, jamais bloquante."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : EX-PF-07, CV-01"}, {"type": "h", "texte": "Q-84 · Ordonnance échue à la validation"}, {"type": "p", "texte": "Une ordonnance couvre sa date plus sa durée écrite. Si elle est échue au jour de la validation, l'application refuse de créer ses fréquences. Une ordonnance sans durée écrite n'est jamais échue."}, {"type": "p", "texte": "Question : Que faire d'une ordonnance échue au moment de la validation ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Refuser ses fréquences (appliqué aujourd'hui)", "Pas de soin planifié sans ordonnance valide ; elle peut couvrir des soins déjà faits."], ["B", "Avertir sans bloquer", "Plus souple ; risque de soins non remboursés."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Fréquences refusées si l'ordonnance est échue ; validée sans fréquence, elle se rattache aux soins déjà faits."}, {"type": "p", "texte": "Priorité : Important · Qui répond : IDE référente"}, {"type": "p", "texte": "Références : EX-PF-03, EX-PF-07"}, {"type": "h", "texte": "D-13 · Reprise des dossiers depuis un autre logiciel"}, {"type": "p", "texte": "Un cabinet qui quitte son logiciel actuel doit retrouver ses patients et, si possible, leur historique. Un convertisseur existe pour Carea ; pour les autres logiciels, il faut savoir lesquels prioriser et quel périmètre reprendre (identités, historique de soins, facturation en cours)."}, {"type": "p", "texte": "Question : Quels logiciels doit-on savoir reprendre en priorité ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Carea seulement pour commencer (appliqué aujourd'hui)", "Déjà fait ; les autres cabinets passent par le format pivot."], ["B", "Carea plus les deux logiciels les plus répandus chez vos prospects (à nommer)", "Adoption facilitée ; un convertisseur à écrire par logiciel."], ["C", "Format pivot seulement, conversion au cas par cas", "Pas de développement ; chaque reprise demande un travail manuel."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Format pivot de démonstration (identités, cabinet, équipe, tournées, fréquences, ordonnances, transmissions) et convertisseur Carea ; identités reprises provisoires jusqu'à qualification INS."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-ID-07, HAB-04, INT-13"}, {"type": "h", "texte": "Q-18 · Phrases libres sensibles dans le bilan de prévention"}, {"type": "p", "texte": "Dans un bilan de prévention, le patient peut demander que certains thèmes (tabac, alcool, santé mentale, violences) restent au dossier sans être partagés. Une phrase libre qui nomme le thème autrement (« cigarette », « vin », « déprime ») peut échapper au filtre et partir au DMP ou au médecin."}, {"type": "p", "texte": "Question : Comment garantir qu'une phrase sensible ne part pas dans la version partagée ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Filtre par mots du thème (appliqué aujourd'hui)", "Automatique ; certaines tournures passent."], ["B", "Lexique validé par thème", "Filtre plus sûr ; lexique à tenir à jour."], ["C", "Relecture imposée de la version partagée avant envoi", "Le plus sûr ; un écran de plus avant chaque envoi."], ["D", "Marquage phrase par phrase par l'infirmière", "Précis ; demande de la discipline à la saisie."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Le lien à un diagnostic ou à une orientation décide ; sans lien, un filtre par mots du thème retient la phrase ; même règle pour l'export ; sans choix du patient sur un thème sensible, la signature est refusée."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-17 (seconde moitié), EX-CI-36, registre des simulations"}, {"type": "h", "texte": "Q-34 · Relance d'une demande de renouvellement d'ordonnance"}, {"type": "p", "texte": "Quand une ordonnance arrive à échéance, l'application envoie une demande de renouvellement au prescripteur. Sans réponse, la demande remonte aux échéances et le même courrier repart."}, {"type": "p", "texte": "Question : Au bout de combien de jours relancer le prescripteur ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "7 jours, même courrier (appliqué aujourd'hui)", "Une relance par semaine."], ["B", "3 jours", "Relance rapide, plus de courriers."], ["C", "7 jours, puis rappel téléphonique proposé", "Escalade vers l'appel si le courrier ne suffit pas."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Sans nouvelle ordonnance au bout de 7 jours (réglable de 3 à 15), la demande se lit « sans réponse » et le même courrier signé repart."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-PF-04, registre des simulations"}, {"type": "h", "texte": "Q-35 · Lien de dépôt envoyé au patient pour sa nouvelle ordonnance"}, {"type": "p", "texte": "La demande de renouvellement part au médecin par messagerie sécurisée. On pourrait aussi envoyer au patient un lien pour déposer lui-même sa nouvelle ordonnance, ce qui suppose son consentement et un canal (SMS, e-mail)."}, {"type": "p", "texte": "Question : Faut-il envoyer au patient un lien pour déposer sa nouvelle ordonnance ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non (appliqué aujourd'hui)", "Le circuit reste entre le cabinet et le médecin."], ["B", "Oui, par SMS ou e-mail avec son consentement", "Moins de déplacements pour récupérer l'ordonnance ; un consentement à tracer."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Aucun lien n'est adressé au patient."}, {"type": "p", "texte": "Priorité : Confort · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-PF-04"}]}, {"id": "qo-donnees", "titre": "Données, sécurité et conformité", "resume": "Hébergeur HDS, DPO, durées de conservation, audit, session Keycloak, base locale du terminal : données et conformité.", "mots_cles": ["AUTRE-06", "AUTRE-07", "D-06", "Q-66", "Q-68", "AUTRE-08", "Q-99", "Q-106", "D-12", "HDS", "DPO", "AIPD", "RGPD", "conservation", "audit", "LOINC", "SNOMED", "DMP", "Keycloak", "session", "base locale", "rétention"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "9 questions, dont 4 bloquantes."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["AUTRE-06", "Hébergeur de données de santé (HDS)", "Bloquant", "Fondateur", "Rien de choisi"], ["AUTRE-07", "Délégué à la protection des données (DPO) et analyse d'impact", "Bloquant", "Fondateur", "Rien de choisi"], ["D-06", "Durées de conservation des données", "Bloquant", "DPO", "A · Valider le tableau provisoire"], ["Q-66", "Copie hors site de la chaîne d'audit", "Bloquant", "Fondateur", "Rien de choisi"], ["Q-68", "Tracer les recherches faites hors connexion", "Important", "DPO", "A · Non, le téléchargement du jour suffit"], ["AUTRE-08", "Codes LOINC et SNOMED des listes et mesures", "Important", "Fondateur", "Rien de choisi"], ["Q-99", "Jeton Keycloak ou session TabSanté", "Important", "Fondateur", "A · Keycloak identifie, TabSanté garde sa session"], ["Q-106", "Rétention de la base locale du terminal", "Important", "DPO", "A · Valider les durées actuelles"], ["D-12", "Représentation des plaies et dispositifs pour le DMP", "Confort", "Fondateur", "A · Oui : lésions en affection, matériel en dispositif"]]}, {"type": "h", "texte": "AUTRE-06 · Hébergeur de données de santé (HDS)"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "Les données des patients doivent être hébergées par un hébergeur certifié HDS, en France, sur deux sites. Aucun contrat n'est signé. Les exigences de l'application et une liste de contrôle du prestataire sont prêtes, et une reprise sur deux sites a été simulée."}, {"type": "p", "texte": "Question : Quel hébergeur HDS retenez-vous, et sous quelle forme ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Infrastructure certifiée HDS, TabSanté exploite lui-même l'application", "Moins cher ; TabSanté assure exploitation, sauvegardes et astreinte."], ["B", "Hébergement HDS infogéré (le prestataire exploite)", "Plus cher ; exploitation et astreinte assurées par le prestataire."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Seule la base est conteneurisée ; hébergeur non contractualisé, à réaliser avant production."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-SE-01, P2-07 (Bloqué), matrice de couverture §7 ligne Hébergement HDS, DPO"}, {"type": "h", "texte": "AUTRE-07 · Délégué à la protection des données (DPO) et analyse d'impact"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "Un DPO doit être désigné avant la mise en production. Il valide l'analyse d'impact (AIPD) et tient le registre des traitements. Les gabarits sont prêts ; l'AIPD est un brouillon technique dont la gravité et la vraisemblance des risques n'ont pas été cotées."}, {"type": "p", "texte": "Question : Qui sera le DPO de TabSanté ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Un DPO interne", "Connaît le produit ; doit être formé et disponible."], ["B", "Un DPO externe (cabinet spécialisé)", "Expertise immédiate ; coût d'abonnement."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Aucun DPO désigné ; registre des traitements pré-rempli et AIPD du 9/10 prêts à lui être remis."}, {"type": "
