<style>
/* Mise en page : barre latérale de rubriques, page centrale lisible, sommaire de page à droite ; recherche toujours en haut. */
:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #EEF2FB; --fg: #141A2E; --fg-2: #4A5372; --ligne: #DDE3EF;
  --accent: #2F5BEA; --accent-fg: #FFFFFF; --accent-doux: #E6ECFD;
  --info: #2F5BEA; --info-fond: #EBF0FE; --attention: #8A5A00; --attention-fond: #FFF4DC;
  --code-fond: #F1F3F8; --ombre: 0 1px 2px rgba(20,26,46,.06), 0 8px 24px rgba(20,26,46,.06);
  --police: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --police-code: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --rayon: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1220; --surface: #151A2B; --surface-2: #1C2338; --fg: #E8ECF7; --fg-2: #A3ACC6; --ligne: #2A3250;
  --accent: #7C9BFF; --accent-fg: #0E1220; --accent-doux: #1E2950; --info: #8FA9FF; --info-fond: #1A2446;
  --attention: #F2C25B; --attention-fond: #33290F; --code-fond: #10152A; --ombre: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1220; --surface: #151A2B; --surface-2: #1C2338; --fg: #E8ECF7; --fg-2: #A3ACC6; --ligne: #2A3250;
  --accent: #7C9BFF; --accent-fg: #0E1220; --accent-doux: #1E2950; --info: #8FA9FF; --info-fond: #1A2446;
  --attention: #F2C25B; --attention-fond: #33290F; --code-fond: #10152A; --ombre: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--police); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }

.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--ligne);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.entete-in { display: flex; align-items: center; gap: 16px; max-width: 1400px; margin: 0 auto }
.marque { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: var(--fg); white-space: nowrap }
.marque-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: 18px; font-weight: 700 }
.marque small { display: block; font-weight: 500; font-size: 12px; color: var(--fg-2); line-height: 1.2 }
.recherche { position: relative; flex: 1; max-width: 560px; margin-left: auto }
.recherche input { width: 100%; height: 40px; border: 1px solid var(--ligne); background: var(--bg); color: var(--fg); border-radius: 999px;
  padding: 0 72px 0 40px; font: inherit; font-size: 14px }
.recherche input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-doux); background: var(--surface) }
.recherche svg { position: absolute; left: 14px; top: 12px; width: 16px; height: 16px; color: var(--fg-2) }
.touche { position: absolute; right: 10px; top: 9px; font-size: 12px; color: var(--fg-2); border: 1px solid var(--ligne); border-radius: 6px; padding: 1px 6px; background: var(--surface) }
.resultats { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; box-shadow: var(--ombre);
  max-height: min(70vh, 520px); overflow: auto; padding: 6px }
.resultat { display: block; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--fg) }
.resultat[aria-selected="true"], .resultat:hover { background: var(--accent-doux) }
.resultat b { display: block; font-weight: 600 }
.resultat span { display: block; font-size: 13px; color: var(--fg-2) }
.resultat em { font-style: normal; background: var(--attention-fond); color: var(--fg); border-radius: 3px }
.resultat .chemin { font-size: 11.5px; letter-spacing: .02em; color: var(--accent) }
.vide { padding: 14px; color: var(--fg-2); font-size: 14px }
.bouton-icone { border: 1px solid var(--ligne); background: var(--surface); color: var(--fg); border-radius: 8px; height: 36px; min-width: 36px; display: grid; place-items: center; cursor: pointer; font: inherit }
.menu-mobile { display: none }

.cadre { display: grid; grid-template-columns: 270px minmax(0, 1fr) 220px; gap: 32px; max-width: 1400px; margin: 0 auto;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
nav.rubriques { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px }
.rubrique { margin-bottom: 18px }
.rubrique > button { all: unset; display: flex; width: 100%; justify-content: space-between; align-items: center; cursor: pointer;
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); padding: 4px 8px; box-sizing: border-box; border-radius: 6px }
.rubrique > button:focus-visible { outline: 2px solid var(--accent) }
.rubrique ul { list-style: none; margin: 4px 0 0; padding: 0 }
.rubrique a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 14px; line-height: 1.35 }
.rubrique a:hover { background: var(--surface-2) }
.rubrique a[aria-current="page"] { background: var(--accent-doux); color: var(--accent); font-weight: 600 }
.rubrique[data-ferme] ul { display: none }
.chevron { transition: transform .15s ease }
.rubrique[data-ferme] .chevron { transform: rotate(-90deg) }

main { min-width: 0 }
.page { background: var(--surface); border: 1px solid var(--ligne); border-radius: 14px; padding: clamp(20px, 4vw, 44px); box-shadow: var(--ombre) }
.fil { font-size: 13px; color: var(--fg-2); margin-bottom: 8px }
.page h1 { font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance }
.chapeau { font-size: 17px; color: var(--fg-2); margin: 0 0 24px; max-width: 68ch }
.page h2 { font-size: 20px; letter-spacing: -.01em; margin: 32px 0 8px; scroll-margin-top: 90px; text-wrap: balance }
.page p, .page li { max-width: 72ch }
.page ul, .page ol { padding-left: 22px }
.page li { margin: 4px 0 }
ol.etapes { list-style: none; padding: 0; counter-reset: e; display: grid; gap: 10px }
ol.etapes li { counter-increment: e; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start }
ol.etapes li::before { content: counter(e); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-doux); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; font-variant-numeric: tabular-nums }
.note { border-radius: var(--rayon); padding: 12px 16px; margin: 16px 0; background: var(--info-fond); max-width: 72ch }
.note[data-ton="attention"] { background: var(--attention-fond) }
.note strong { display: block; font-size: 13px; color: var(--info) }
.note[data-ton="attention"] strong { color: var(--attention) }
pre { background: var(--code-fond); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 14px 16px; overflow-x: auto; font-family: var(--police-code); font-size: 13px; line-height: 1.55; position: relative }
.copier { position: absolute; top: 8px; right: 8px; font-size: 12px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--ligne); background: var(--surface); color: var(--fg-2); cursor: pointer }
code { font-family: var(--police-code); font-size: .92em }
.tableau { overflow-x: auto; margin: 16px 0; border: 1px solid var(--ligne); border-radius: var(--rayon) }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--ligne); vertical-align: top }
th { background: var(--surface-2); font-weight: 600 }
tr:last-child td { border-bottom: 0 }
details.faq { border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 0 16px; margin: 8px 0; max-width: 76ch; background: var(--surface) }
details.faq summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none; display: flex; gap: 10px; justify-content: space-between }
details.faq summary::after { content: "+"; color: var(--accent); font-weight: 700 }
details.faq[open] summary::after { content: "–" }
details.faq div { padding: 0 0 14px; color: var(--fg-2) }
dl.glossaire { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr); gap: 0; border: 1px solid var(--ligne); border-radius: var(--rayon); overflow: hidden }
dl.glossaire dt, dl.glossaire dd { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--ligne) }
dl.glossaire dt { font-weight: 600; background: var(--surface-2) }
.aide-carte { border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 16px 18px; margin: 12px 0; scroll-margin-top: 90px; max-width: 76ch }
.aide-carte[data-cible] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-doux) }
.aide-carte h3 { margin: 0 0 4px; font-size: 16px }
.etiquette { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-doux); border-radius: 999px; padding: 1px 9px; margin-right: 6px }
.suite { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--ligne); flex-wrap: wrap }
.suite a { display: block; padding: 12px 16px; border: 1px solid var(--ligne); border-radius: var(--rayon); text-decoration: none; min-width: 0; flex: 1 1 220px }
.suite a span { display: block; font-size: 12px; color: var(--fg-2) }
.suite a:last-child { text-align: right }
aside.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; font-size: 13px }
aside.sommaire b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-2); margin-bottom: 8px }
aside.sommaire a { display: block; color: var(--fg-2); text-decoration: none; padding: 3px 0 3px 10px; border-left: 2px solid var(--ligne) }
aside.sommaire a:hover { color: var(--accent); border-color: var(--accent) }
.accueil-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 20px }
.accueil-grille a { display: block; text-decoration: none; color: var(--fg); border: 1px solid var(--ligne); border-radius: 12px; padding: 16px; background: var(--surface) }
.accueil-grille a:hover { border-color: var(--accent) }
.accueil-grille b { display: block; margin-bottom: 4px }
.accueil-grille span { font-size: 13.5px; color: var(--fg-2) }
.pied { font-size: 12.5px; color: var(--fg-2); margin-top: 16px; text-align: center }

@media (max-width: 1180px) { .cadre { grid-template-columns: 250px minmax(0, 1fr) } aside.sommaire { display: none } }
@media (max-width: 820px) {
  .cadre { grid-template-columns: minmax(0, 1fr) }
  nav.rubriques { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); max-height: none; background: var(--surface); z-index: 20; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 24px max(16px, env(safe-area-inset-left, 0px));
    border-right: 1px solid var(--ligne); transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--ombre) }
  body[data-menu] nav.rubriques { transform: none }
  .menu-mobile { display: grid }
  .marque small { display: none }
  .touche { display: none }
  .recherche input { padding-right: 14px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
</style>

l ne modifie jamais le dossier.", "Agent de poste : petit programme prévu sur le poste fixe pour relier les lecteurs de cartes et le composant SESAM-Vitale. Il est aujourd'hui simulé.", "Site public : site de présentation séparé de l'application, qui ne reçoit aucune donnée de santé."]}, {"type": "note", "ton": "info", "texte": "Les guides pas à pas sont dans les rubriques « Guide du poste fixe » et « Guide du terminal »."}]}, {"id": "demarrer-roles", "titre": "Les rôles et ce que chacun voit", "resume": "Infirmier, aide-soignante, remplaçant, administration : chacun voit et fait ce que la matrice des droits lui accorde.", "mots_cles": ["rôles", "IDE", "aide-soignante", "AS", "remplaçant", "administrateur", "habilitations", "droits"], "blocs": [{"type": "p", "texte": "Les droits suivent une matrice d'habilitations jugée par le serveur, à chaque requête. Un écran n'affiche que ce que votre profil peut lire ; un geste sans droit est refusé avec un message en français."}, {"type": "table", "entetes": ["Rôle", "Ce qu'il fait", "Ce qu'il ne voit pas ou ne fait pas"], "lignes": [["Infirmier titulaire (IDE)", "Tous les soins, l'organisation du cabinet (tournées, habilitations, lots), la validation des saisies différées d'un autre infirmier", "—"], ["Infirmier responsable", "Les mêmes droits d'administration que le titulaire", "—"], ["Infirmier en structure", "Les soins ; la structure (société) émet les FSE", "—"], ["Remplaçant", "Les soins d'un infirmier, dans la portée de son habilitation : une période avec une date de fin, des tournées et/ou des patients, jugées à la date de chaque geste", "Les vues de tout le cabinet quand sa portée est restreinte ; la sécurisation des FSE (décision D-10 ouverte) ; l'émission de codes de terminal ; la validation des saisies différées"], ["Aide-soignante (AS)", "La fiche Nursing (et Paramètres vitaux quand le cabinet exerce en structure), les signalements à l'infirmier, les transmissions intra-cabinet et, dans certaines limites, ciblées ; ses propres tâches", "La cotation et la facturation, le contenu des consultations, le texte des signalements, les prescriptions infirmières, les documents produits"], ["Administration du cabinet", "L'organisation : tournées, planning, équipe, habilitations, terminaux, accès QR, journal des accès, page Simulations", "Le dossier clinique : elle ne lit que l'identité des patients ; ni la cotation ni les documents de soin"]]}, {"type": "note", "ton": "info", "texte": "Une transmission ciblée écrite par l'aide-soignante reste bornée : ni entretien infirmier, ni traitement d'une interpellation, ni requalification. La relecture par l'infirmier référent est une question ouverte (Q-88)."}, {"type": "note", "ton": "attention", "texte": "L'authentification réelle de l'aide-soignante (Pro Santé Connect ou autre) est une décision ouverte (D-02). En démonstration, elle signe avec sa session, sans carte."}]}, {"id": "demarrer-demonstration", "titre": "La démonstration", "resume": "Lancer TabSanté en local, choisir un profil fictif, provoquer des pannes : tout ce qui est simulé et comment le voir.", "mots_cles": ["démonstration", "adresses locales", "ports", "profils fictifs", "Claire Martin", "Inès Petit", "Lucie Vidal", "simulations", "pannes"], "blocs": [{"type": "p", "texte": "La démonstration fait tourner tout le produit sur un poste de développement, sans aucun service national. Le cabinet « Cabinet de démonstration TabSanté » et ses patients sont fictifs ; il se crée à la première connexion de démonstration."}, {"type": "h", "texte": "Lancer la démonstration"}, {"type": "code", "langage": "bash", "texte": "docker compose up -d db\ncd backend && uv sync && TABSANTE_DEV_AUTH=true uv run alembic upgrade head\nTABSANTE_DEV_AUTH=true uv run uvicorn app.main:app --host 127.0.0.1 --port 8010\n\ncd web && npm ci && VITE_API_URL=http://127.0.0.1:8010 npm run dev -- --host 127.0.0.1 --port 5173\ncd mobile && flutter build web --dart-define=API_URL=http://127.0.0.1:8010 && python -m http.server 5180 --directory build/web"}, {"type": "table", "entetes": ["Application", "Adresse locale"], "lignes": [["Poste fixe", "http://127.0.0.1:5173"], ["Terminal (version navigateur)", "http://127.0.0.1:5180"], ["API et sa documentation", "http://127.0.0.1:8010/docs"], ["Base PostgreSQL (conteneur)", "port 55432"], ["Site public (à part)", "http://localhost:4321"]]}, {"type": "h", "texte": "Les profils fictifs"}, {"type": "table", "entetes": ["Profil", "Rôle"], "lignes": [["Claire Martin", "Infirmière (IDE)"], ["Paul Durand", "Infirmier (IDE)"], ["Inès Petit", "Aide-soignante (AS)"], ["Lucie Vidal", "Infirmière remplaçante, habilitation bornée sur la tournée Centre le midi"]]}, {"type": "p", "texte": "Les patients sont fictifs : M. Dupuis, Mme Lefèvre, M. Bernard, Mme Moreau et d'autres, avec plaies, dispositifs, pompes, une semaine de passages, des tournées sur la carte et des demandes de renouvellement. Les prescripteurs et pharmacies portent la mention « fictif »."}, {"type": "h", "texte": "Ce qui est simulé"}, {"type": "liste", "items": ["Cartes CPS et Vitale, lecteur de cartes du terminal, appli carte Vitale.", "Téléservices INSi, ADRi, IDB ; SESAM-Vitale (FSE, lots, retours) et agent de poste.", "Messagerie sécurisée (MSSanté), DMP, ordonnance numérique, laboratoire, visioconférence, Pro Santé Connect.", "Géocodage, itinéraire, trafic, météo, position GPS : chaque heure estimée est un ordre de grandeur.", "Moteur de cotation : une doublure de démonstration, jamais facturable.", "Règles provisoires : des valeurs prudentes en attendant une décision, réglables pour essai."]}, {"type": "h", "texte": "Montrer une panne"}, {"type": "etapes", "items": ["Connectez-vous avec un profil qui gère le cabinet (Claire Martin, par exemple).", "Ouvrez « Paramètres » puis « Simulations ».", "Choisissez une panne ou une option pour un service : carte bloquée, droits fermés, rejet des feuilles, adresse introuvable, verglas…", "Un bandeau « Démonstration » rappelle les pannes en cours sur tout le poste fixe ; remettez à la normale depuis la même page."]}, {"type": "p", "texte": "Certaines situations se provoquent aussi par les données : un patient sans NIR ou dont le nom contient « rejet » fait rejeter sa FSE ; un nom contenant « ambigu » ou « echec » fait répondre l'INSi en conséquence."}, {"type": "note", "ton": "attention", "texte": "La variable TABSANTE_DEV_AUTH ouvre les routes de démonstration sans authentification, depuis la boucle locale seulement. Elle est refusée au démarrage dès que la configuration ressemble à un service. Le terminal servi dans un navigateur garde sa clé dans le navigateur : il ne doit jamais recevoir de vraies données."}]}, {"id": "demarrer-par-ou-commencer", "titre": "Par où commencer selon votre profil", "resume": "Les pages à lire en premier, que vous soyez infirmier, aide-soignante, gestionnaire du cabinet ou technicien.", "mots_cles": ["parcours", "lecture", "premiers pas", "profil"], "blocs": [{"type": "table", "entetes": ["Vous êtes", "À lire d'abord"], "lignes": [["Infirmier en tournée", "Guide du terminal : la tournée du jour, faire un passage, signer et lire le reçu, hors connexion et onglet Envois"], ["Aide-soignante", "Guide du terminal : connexion, nursing, liaisons ; FAQ « Aide-soignante »"], ["Remplaçant", "Démarrer : les rôles ; FAQ « Remplaçant »"], ["Titulaire ou gestionnaire", "Guide du poste fixe : Aujourd'hui, tournées et planning, équipe et habilitations, terminaux, paramètres ; FAQ « Cabinet »"], ["Équipe technique", "Documentation technique : architecture, installation, configuration, sécurité"], ["Décideur", "Couverture du CDC et décisions ; Nouveautés"]]}, {"type": "note", "ton": "info", "texte": "La recherche du portail ignore les accents et accepte plusieurs mots : tapez un sigle (BSI, INSi, FSE) ou une question (« terminal perdu »)."}]}]}, {"id": "aide-ecrans", "titre": "Aide écran par écran", "description": "Ce que fait chaque écran et comment s'en servir, dans les deux applications.", "pages": [{"id": "aide-poste-accueil", "titre": "Poste fixe : accueil et navigation", "resume": "Barre latérale, recherche, notifications, Aujourd'hui et Tableau de bord.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-aide", "ecran": "Toutes les pages", "titre": "Aide", "texte": "Le bouton « ? » à côté d’un titre ouvre l’explication de cet élément. Le panneau Aide s’ouvre avec la touche ?, la touche F1 ou l’entrée « Aide » de la barre latérale : il réunit l’aide de la page en cours et une recherche dans toute l’aide. Le bouton « Revoir les astuces » fait réapparaître les astuces de première utilisation.", "etapes": ["Appuyez sur ? ou F1, ou choisissez « Aide » dans la barre latérale.", "Lisez l’aide de la page, ou tapez un mot dans la recherche.", "Cliquez sur « Revoir les astuces » pour revoir les conseils de départ."]}, {"id": "poste-navigation", "ecran": "Toutes les pages", "titre": "Navigation principale", "texte": "La barre latérale range les pages par usage : Aujourd’hui et Tableau de bord en tête, puis « Soins », « Coordination », « Gestion » et « Ressources ». Une page que vos droits n’ouvrent pas n’y figure pas, et un groupe vide disparaît. Les chiffres comptent ce qui vous attend : éléments à traiter, transmissions et mentions non lues, signalements à décider, bilans, saisies différées."}, {"id": "poste-navigation-ressources", "ecran": "Toutes les pages", "titre": "Ressources", "texte": "Le groupe « Ressources » se replie et se déplie d’un clic sur son titre. Il est replié par défaut, et votre choix est retenu pour votre compte sur ce poste. Replié, son titre se met en évidence quand la page ouverte en fait partie."}, {"id": "poste-recherche", "ecran": "Toutes les pages", "titre": "Rechercher", "texte": "Le bouton « Rechercher » ouvre la palette de commandes, comme Ctrl K (Cmd K sur Mac) ou la touche / hors d’un champ de saisie. Elle retrouve un patient, une plaie, le dernier passage d’un soin, un dossier de preuve, un objet suivi ou une page, et propose des actions comme « Nouveau patient » ou « Nouvelle tournée ». À partir de deux caractères, elle cherche aussi dans tout le cabinet : documents, transmissions, ordonnances et tournées.", "etapes": ["Appuyez sur Ctrl K, ou sur / hors d’un champ.", "Tapez quelques lettres : un nom, un soin, une page.", "Choisissez avec les flèches ↑ et ↓, ouvrez avec Entrée.", "Échap referme la palette sans rien ouvrir."]}, {"id": "poste-notifications", "ecran": "Toutes les pages", "titre": "Notifications", "texte": "La cloche en bas de la barre latérale compte les notifications que vous n’avez pas encore vues. Elle ouvre le centre de notifications : « À valider » en tête, puis « Reçues ». Chaque notification a un lien « Ouvrir » vers ce qu’elle concerne. « Marquer comme vue » la retire du compte."}, {"id": "poste-notifications-portee", "ecran": "Toutes les pages · pour : infirmier", "titre": "Pour moi · Tout le cabinet", "texte": "Ce choix élargit la liste aux notifications du cabinet. Celles adressées personnellement à un autre intervenant restent les siennes et n’apparaissent pas."}, {"id": "poste-notifications-propositions", "ecran": "Toutes les pages · selon vos droits", "titre": "À valider", "texte": "Une règle du soin propose un envoi, avec ses destinataires et sa raison. Vous décochez les destinataires à retirer puis cliquez sur « Envoyer », ou vous l’écartez avec un motif, tracé comme l’envoi. En démonstration, l’envoi par messagerie sécurisée est simulé : le message est versé au journal.", "etapes": ["Vérifiez les destinataires cochés.", "Cliquez sur « Envoyer », ou sur « Écarter ».", "Pour écarter, saisissez le motif puis « Écarter la proposition »."]}, {"id": "poste-bandeau-demo", "ecran": "Toutes les pages", "titre": "Démonstration", "texte": "Ce bandeau en tête de chaque page rappelle que les cartes CPS et Vitale, les téléservices et les échanges de santé sont simulés : rien ne part vers l’Assurance maladie. Quand une panne est simulée, il en affiche le nombre ; le survoler en donne le détail. Le lien « Simulations » ouvre la page des réglages de la démonstration."}, {"id": "poste-deconnexion", "ecran": "Toutes les pages", "titre": "Se déconnecter", "texte": "Votre nom et votre rôle s’affichent en bas de la barre latérale. Le bouton à côté ferme votre session sur ce poste et ramène à l’écran de connexion."}, {"id": "poste-aujourdhui", "ecran": "Aujourd'hui", "titre": "Aujourd’hui", "texte": "Aujourd’hui rassemble ce qui demande une action et l’état de la journée. « À traiter » vient en tête ; à côté se lisent votre prochain domicile quand vous tenez une tournée, les suggestions, ce qui est à préparer, les tournées du jour et les plaies en cours. Le sous-titre compte les tournées, les passages prévus et ceux déjà signés. Pour qui crée les dossiers, « Nouveau patient » en ouvre un."}, {"id": "poste-aujourdhui-a-traiter", "ecran": "Aujourd'hui", "titre": "À traiter", "texte": "La liste réunit ce qui attend une action, du plus grave au plus administratif : la sécurité clinique d’abord (dispositif au-delà du prescrit, signalement de l’aide-soignante, plaie sans progrès, terminal muet en tournée), puis les échéances (passage non tracé, bilan dû, protocole sans pièce). Chaque ligne porte son bouton, par exemple « Décider », « Ouvrir la plaie » ou « Ouvrir le dispositif ». Le filtre « Soins » ne garde que le clinique, « Tout » rétablit la liste entière. Quand la liste est vide, l’heure de la dernière vérification s’affiche.", "etapes": ["Sur une ligne « Passage non réalisé », cliquez « Déclarer le motif ».", "Choisissez le motif dans la liste.", "Ajoutez une précision, obligatoire pour le motif « Autre ».", "Validez avec « Déclarer non réalisé » : le motif est tracé au journal."]}, {"id": "poste-aujourdhui-a-traiter-facturation", "ecran": "Aujourd'hui · selon vos droits", "titre": "Facturation", "texte": "Le filtre « Facturation » d’« À traiter » regroupe l’administratif : les cotations à contrôler avant facturation, les saisies différées à vérifier et l’alerte de journal d’audit rompu. « Voir les cotations » mène à la facturation ; « Vérifier » ouvre la preuve d’un acte déclaré après coup. Un journal d’audit rompu passe avant tout : prévenez le responsable sécurité avant de présenter une preuve."}, {"id": "poste-aujourdhui-apercu", "ecran": "Aujourd'hui", "titre": "Aperçu du patient", "texte": "Cliquer le nom d’un patient dans « À traiter » ouvre son aperçu à côté de la liste, sans la quitter. Il montre ce qu’il faut savoir avant le soin (INS, allergies, contextes), ses plaies en cours avec leur courbe, ses soins en cours et ses trois derniers passages. « Ouvrir le dossier » et « Transmissions » mènent au dossier complet ; Échap ou la croix referment l’aperçu."}, {"id": "poste-aujourdhui-contexte", "ecran": "Aujourd'hui", "titre": "Contexte du jour", "texte": "Cette bande signale ce qui peut peser sur la journée : jour férié, vacances, vigilance météo, circulation, pollution, pollens ou changement d’heure. Elle n’apparaît que s’il y a quelque chose à signaler. La mention « Données simulées » indique que certaines sources ne sont pas encore raccordées ; survolez-la pour le détail."}, {"id": "poste-aujourdhui-suggestions", "ecran": "Aujourd'hui", "titre": "Suggestions", "texte": "Des pistes proposées par l’application, jamais des ordres : rien ne se fait sans vous. Chaque suggestion indique sa gravité, son échéance et, sous « Pourquoi ? », sa source, la règle appliquée et les données lues. « Faire » ouvre l’écran qui la réalise, « C’est fait » la retire, « Écarter » la retire avec un motif facultatif. Trois s’affichent d’abord ; le lien du bas montre les autres."}, {"id": "poste-aujourdhui-a-preparer", "ecran": "Aujourd'hui · pour : infirmier, aide-soignante", "titre": "À préparer", "texte": "Les prérequis de vos passages d’aujourd’hui, et ceux de demain à confirmer dès aujourd’hui : patient à jeun, traitement à retirer en pharmacie, ordonnance… Chaque ligne donne la consigne et le moment où confirmer. Cochez « Patient prévenu » après votre appel (l’application n’envoie rien au patient), puis « Confirmé » une fois vérifié. Le compteur indique les prérequis encore à confirmer."}, {"id": "poste-aujourdhui-tournees-du-jour", "ecran": "Aujourd'hui", "titre": "Tournées du jour", "texte": "Une ligne par tournée et par moment qui a des passages : passages signés sur prévus, jauge, infirmier attribué (ou « Infirmier non attribué ») et passages qui restent à faire. Les pictogrammes comptent les soins prévus par type. Quand vous tenez une tournée en ce moment, le panneau « Prochain domicile » donne en plus l’heure d’arrivée estimée et un lien « Itinéraire »."}, {"id": "poste-aujourdhui-plaies", "ecran": "Aujourd'hui", "titre": "Plaies en cours", "texte": "Toutes les plaies ouvertes du cabinet, celles qui demandent l’attention en tête : « Sans mesure depuis … » (trois jours ou plus) ou « Sans progrès depuis … ». Chaque ligne montre J+n, la localisation, la mini-courbe et l’évolution depuis J0 ; un clic ouvre la plaie. Les plaies s’ouvrent sur le terminal, au domicile du patient."}, {"id": "poste-tableau-de-bord", "ecran": "Tableau de bord · pour : infirmier, administration", "titre": "Tableau de bord", "texte": "Le tableau de bord résume une période : « Aujourd’hui », « Semaine » (par défaut) ou « Mois ». Une phrase écrite depuis les données dit où la charge s’accumule et quelles plaies ne progressent plus. Avec plusieurs tournées, le menu « Toutes les tournées » ramène les listes aux patients d’une tournée ; le récit, les objectifs et la saisie différée restent ceux du cabinet. « Exporter » télécharge les sections affichées en fichier CSV, lisible dans un tableur."}, {"id": "poste-tableau-de-bord-as", "ecran": "Tableau de bord · pour : aide-soignante", "titre": "Tableau de bord", "texte": "Le tableau de bord résume la période choisie : « Aujourd’hui », « Semaine » ou « Mois ». Vous y suivez les signalements en attente (lien « Suivre »), la carte des passages et les objectifs de la période ; la décision sur un signalement revient à l’infirmier."}, {"id": "poste-tableau-de-bord-attend", "ecran": "Tableau de bord", "titre": "Ce qui vous attend", "texte": "Une ligne de liens, avant tout chiffre : signalements à décider, passages manqués sans motif, bilans à rédiger ou signer, résultats attendus, transmissions dues au prescripteur… Chaque lien mène à son panneau plus bas ou à sa page. Le soin vient d’abord, la gestion ensuite. « Rien en attente sur la période » confirme qu’il n’y a rien à reprendre."}, {"id": "poste-tableau-de-bord-carte", "ecran": "Tableau de bord", "titre": "Quand passez-vous chez vos patients", "texte": "La carte de chaleur croise les jours et les heures : chaque case donne le nombre de passages prévus, et plus la teinte est soutenue, plus l’heure est chargée. Survolez, cliquez ou parcourez les cases avec les flèches du clavier : le détail (réalisés, non réalisés, à venir) s’écrit sous la grille. Les hachures signalent au moins un passage non réalisé, les tirets des passages à venir."}, {"id": "poste-tableau-de-bord-cicatrisation", "ecran": "Tableau de bord", "titre": "Cicatrisation, plaie par plaie", "texte": "Une vignette par plaie mesurée : la surface en pourcentage de J0, sur la même échelle pour toutes, avec J+n et l’évolution depuis J0. Les plaies sans progrès viennent en tête, la plus longue d’abord. Cliquer une vignette ouvre l’aperçu du patient à côté."}, {"id": "poste-tableau-de-bord-objectifs", "ecran": "Tableau de bord", "titre": "Objectifs de la période", "texte": "Des objectifs à atteindre en entier, sans note ni classement entre personnes : passages signés à l’heure, transmissions lues, bilans dus faits. Chaque barre montre ce qui est fait sur le total ; ce qui reste porte un lien, « Lire », « Rédiger » ou « Valider » pour qui valide les saisies hors délai. Le titre suit la période choisie."}, {"id": "poste-tableau-de-bord-suivi", "ecran": "Tableau de bord", "titre": "Suivi des patients", "texte": "Les mesures suivies (plaies, glycémie, constantes, INR) avec la dernière valeur, la courbe des dernières mesures et l’évolution. Ce qui sort des bornes, et toute plaie qui ne baisse pas, remonte en tête, et le compteur l’indique « à regarder ». Les filtres « Plaies », « Diabète » et « Constantes » restreignent la liste ; le bouton d’aperçu en bout de ligne ouvre le patient à côté. Le verdict « Hors cible » ou « Dans la cible » n’apparaît que si la prescription porte des bornes ; sinon, seule la tendance est écrite."}, {"id": "poste-tableau-de-bord-non-realises", "ecran": "Tableau de bord", "titre": "Passages non réalisés", "texte": "Les passages dus de la période qui n’ont pas eu lieu, avec leur motif ou la mention « Aucun passage tracé ». Sans motif, « Déclarer le motif » ouvre la déclaration ; un passage signé non réalisé se relit avec « Voir la preuve ». « Tout voir » déplie la liste au-delà de quatre lignes."}, {"id": "poste-tableau-de-bord-envoi", "ecran": "Tableau de bord · pour : infirmier", "titre": "Avant le prochain envoi", "texte": "Contrôle de cohérence des actes signés depuis le dernier envoi : empreintes, prescriptions échues, actes au-delà de la fréquence prescrite, saisies différées non validées et chaîne d’intégrité du journal. « Voir » liste les actes en cause avec leur preuve ; « Valider » mène aux saisies différées. Marquer le point d’envoi le trace au journal : le contrôle suivant ne portera que sur les actes reçus ensuite, et rien n’est possible tant que la chaîne d’intégrité est rompue. Aucune facture n’est télétransmise d’ici.", "etapes": ["Lisez chaque vérification ; ouvrez « Voir » sur celles en anomalie.", "Cliquez « Vérifier et préparer ».", "Relisez le résumé, puis cliquez « Marquer le point d’envoi »."]}, {"id": "poste-tableau-de-bord-cotations", "ecran": "Tableau de bord · pour : infirmier", "titre": "File de contrôle des cotations", "texte": "Les cotations à examiner sur la période, chacune avec son motif (règle de cumul, justification, prescription, divergence, correction, non programmé, saisie différée) et ses codes. « Examiner » ouvre l’élément à contrôler ; « Tout voir » déplie la liste. La pastille « Démonstration » rappelle que le moteur applique des règles provisoires : ne facturez jamais sur cette base."}]}]}, {"id": "aide-poste-patients", "titre": "Poste fixe : patients, soins et plaies", "resume": "Liste des patients, dossier, vues de soin, dispositifs, plaies et ordonnances.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-patients", "ecran": "Patients · pour : infirmier, aide-soignante", "titre": "Patients", "texte": "La liste de tous les patients du cabinet : âge, état de l’identité INS, contextes de prise en charge (HAD, contextes actifs, décès) et nombre de plaies actives. Cliquez une ligne pour ouvrir le dossier. Les en-têtes « Patient », « Âge » et « Plaies actives » trient la liste ; un second clic inverse l’ordre."}, {"id": "poste-patient-nouveau", "ecran": "Patients · pour : infirmier", "titre": "Nouveau patient", "texte": "« Nouveau patient » ouvre le formulaire de création au-dessus de la liste. Seuls l’identité et le lieu de résidence sont obligatoires ; allergies, antécédents, contacts et couverture sociale sont facultatifs et gardent leur source. Dès la création, l’identité, les droits et l’INS sont demandés aux téléservices simulés ; l’identité reste provisoire jusqu’à sa qualification.", "etapes": ["Saisissez le nom de naissance tel qu’il figure sur la pièce d’identité, puis le premier prénom de naissance.", "Renseignez la date de naissance, le sexe et le lieu de résidence.", "Ajoutez si besoin allergies, antécédents, contacts ou NIR avec « Ajouter », puis « Ajouter à la création ».", "Cliquez « Créer le patient » : le dossier s’ouvre, ou les identités ressemblantes vous sont présentées d’abord."]}, {"id": "poste-patient-doublons-creation", "ecran": "Patients · pour : infirmier", "titre": "Identité ressemblante", "texte": "Si une identité proche existe déjà au cabinet, les deux sont comparées côte à côte et chaque écart est marqué « diffère ». Rien n’est fusionné sans votre décision : « Personnes différentes » écarte le rapprochement, « Même personne : fusionner » réunit les dossiers sur l’identité que vous choisissez de conserver. « Décider plus tard » ouvre le nouveau dossier ; le doublon y reste signalé."}, {"id": "poste-patient-vitale", "ecran": "Patients · selon vos droits", "titre": "Carte Vitale", "texte": "En mode démonstration, « Carte Vitale » crée un patient depuis une carte lue par un lecteur simulé. Identité et couverture viennent de la carte ; les droits et l’INS sont ensuite demandés aux téléservices simulés. Le lieu de résidence, que la carte ne porte pas, est à préciser.", "etapes": ["Choisissez la carte insérée dans le lecteur, puis cliquez « Lire la carte ».", "Choisissez le bénéficiaire à créer et le lieu de résidence.", "Cliquez « Créer le dossier », puis « Ouvrir le dossier »."]}, {"id": "poste-patient-badges-ins", "ecran": "Patients · pour : infirmier, aide-soignante", "titre": "Identité", "texte": "La colonne « Identité » dit où en est l’identité nationale de santé. « INS provisoire » : pas encore qualifiée. « INS récupérée » : INSi a répondu, il reste à vérifier une pièce d’identité du patient. « INS qualifiée » : le DMP et la messagerie de santé deviennent possibles."}, {"id": "poste-dossier-patient", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Dossier du patient", "texte": "Le dossier tient en six onglets : « Synthèse », « Soins et plaies », « Prescriptions », « Coordination », « Documents » et « Dossier administratif ». Certains ont des sous-onglets, affichés juste en dessous. L’en-tête reste visible au défilement, avec les puces à vérifier d’un coup d’œil : allergies, INS, HAD, contextes, prescripteur et, pour l’infirmier, DMP et carte Vitale."}, {"id": "poste-dossier-synthese", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Synthèse", "texte": "La vue d’ensemble du patient : alertes en tête, puis la frise de soins, l’évolution des constantes, les soins et dispositifs en cours, les antécédents et les derniers passages. À droite : « À venir » (les prochains passages prévus et les échéances du mois), l’identité, les contacts, les épisodes et contextes. Chaque bloc mène au détail par son lien."}, {"id": "poste-dossier-a-savoir", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "À savoir avant le soin", "texte": "Ce qu’il faut savoir avant de toucher le patient : allergies, événements critiques des sept derniers jours, divergences entre sources, doublons possibles, identité provisoire ou fusionnée, contextes de prise en charge. Une ligne qui attend une décision porte son lien : « Qualifier », « Trancher », « Comparer », « Renseigner » ou « Détail ». Sans alerte, le bloc l’indique en clair."}, {"id": "poste-dossier-frise", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Frise de soins", "texte": "Les 30 derniers jours et les 7 à venir sur une même ligne de temps. Une piste par soin avec ses passages signés, puis la surface et les photos de chaque plaie en cours, les ordonnances et leurs échéances. « Tous les passages » ouvre l’historique complet."}, {"id": "poste-dossier-soins", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Soins en cours", "texte": "Une carte par soin, plaie ou dispositif en cours, avec son rythme, le nombre de passages et la dernière valeur relevée. Cliquez une carte pour ouvrir son suivi. Les soins se tracent sur le terminal, au domicile."}, {"id": "poste-dispositif-pose", "ecran": "Dossier patient · pour : infirmier", "titre": "Poser un dispositif", "texte": "Les champs d’ouverture sont figés après l’enregistrement : une erreur se corrigera par un commentaire. La voie veineuse périphérique, posée au domicile, s’ouvre sur le terminal.", "etapes": ["Dans « Soins en cours », cliquez « Poser un dispositif ».", "Choisissez le type de dispositif, la prescription d’origine et la date de prise en charge.", "Remplissez les champs propres à ce type (nature, localisation, lot…).", "Cliquez « Ouvrir le dispositif »."]}, {"id": "poste-dossier-frequences", "ecran": "Dossier patient · pour : infirmier", "titre": "Fréquences prescrites", "texte": "Ce que servent les tournées, tel que prescrit : rythme, période, dernier passage prévu et état de chaque fréquence. « Modifier » fait démarrer une nouvelle fréquence à la date choisie, l’ancienne s’arrête la veille ; « Arrêter ce soin » retire les passages à venir des tournées. Date de fin atteinte, « Clore le traitement » vous est proposé, jamais automatique."}, {"id": "poste-dossier-passages", "ecran": "Dossier patient · pour : infirmier", "titre": "Passages", "texte": "Tous les passages signés du patient, du plus récent au plus ancien : date, soin, intervenant, cotation et état. Une saisie différée est signalée. « Preuve » ouvre le dossier de preuve du passage."}, {"id": "poste-dossier-cadre-soins", "ecran": "Dossier patient · selon vos droits", "titre": "Seuils et traitement", "texte": "Le traitement distribué, le profil de dépendance et les seuils et bornes prescrits. « Ajouter une ligne », « Modifier » et « Retirer » tiennent le traitement ; « Renseigner le profil » ou « Réviser le profil » tient la dépendance. Chaque changement crée une version, l’historique reste consultable."}, {"id": "poste-dossier-prescriptions", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Prescriptions et plan de soins", "texte": "Les prescriptions du patient, les ordonnances sources versées, le plan de soins et les demandes de renouvellement, puis le prévisionnel et les échéances. Une prescription naît d’une saisie directe ou de la lecture validée d’une ordonnance. Sur chaque prescription, les fréquences prévoient les passages."}, {"id": "poste-dossier-nouvelle-prescription", "ecran": "Dossier patient · pour : infirmier", "titre": "Nouvelle prescription", "texte": "La saisie directe d’une ordonnance, telle qu’écrite. Chaque acte se choisit dans le catalogue, qui indique la fiche qui le servira ; cette fiche affichera la nouvelle prescription jusqu’au premier soin réalisé. La saisie est gardée en brouillon.", "etapes": ["Cliquez « Nouvelle prescription », dans l’en-tête ou le bloc « Prescriptions ».", "Saisissez le prescripteur, la nature et la date ; une prescription hospitalière demande le service.", "Complétez si besoin durée, renouvellements, soins à domicile, dimanches et jours fériés, et le document source.", "Ajoutez chaque acte prescrit avec « Ajouter un acte prescrit ».", "Cliquez « Enregistrer la prescription »."]}, {"id": "poste-dossier-nouvelle-frequence", "ecran": "Dossier patient · pour : infirmier", "titre": "Nouvelle fréquence", "texte": "Sur une prescription, « Nouvelle fréquence » prévoit les passages d’un soin ; « Soins × moments » en prévoit plusieurs d’un coup. Avant tout enregistrement, un aperçu liste chaque passage avec son jour, son moment, sa tournée, son intervenant et ses conflits éventuels.", "etapes": ["Choisissez le type : principale, secondaire (bornée) ou ponctuelle.", "Choisissez le soin, la tournée, le début et, si besoin, le terme.", "Réglez la cadence et cochez les moments.", "Cliquez « Prévoir les passages » et relisez l’aperçu.", "Cliquez « Valider », ou « Valider quand même » avec un motif en cas de conflit."]}, {"id": "poste-dossier-ordonnances-sources", "ecran": "Dossier patient · selon vos droits", "titre": "Ordonnances sources", "texte": "Les ordonnances photographiées au domicile ou numérisées au cabinet. « Verser une ordonnance » dépose un fichier JPEG, PNG ou PDF, rangé sous son empreinte et non modifiable. « Lancer la lecture » en propose le contenu ; rien n’est créé sans votre validation."}, {"id": "poste-dossier-prise-en-charge", "ecran": "Dossier patient · pour : infirmier", "titre": "Prise en charge", "texte": "Les séjours en HAD du patient. « Déclarer un séjour » saisit la structure, la convention, l’entrée et le motif d’admission ; les ordonnances en cours passent alors « à classer ». Pendant le séjour, « Saisir la lettre de mission » et « Déclarer la sortie » le complètent."}, {"id": "poste-dossier-cadre-ordonnances", "ecran": "Dossier patient · pour : infirmier", "titre": "Cadre des ordonnances", "texte": "Pour chaque ordonnance, qui paie : la caisse, hors périmètre de l’HAD, ou l’HAD. « Classer » fixe ce cadre. Pendant un séjour, garder une ordonnance hors HAD demande un motif."}, {"id": "poste-dossier-accords", "ecran": "Dossier patient · pour : infirmier", "titre": "Accords préalables", "texte": "Le suivi des accords préalables du premier mois, pour les médicaments ou le nursing. « Nouvel accord » part de la date de début du traitement, qui fixe l’échéance ; ensuite « Marquer demandé aujourd’hui », puis « Enregistrer la réponse » de la caisse. Les compteurs de cotation du patient s’affichent en dessous."}, {"id": "poste-dossier-prescriptions-infirmieres", "ecran": "Dossier patient · selon vos droits", "titre": "Prescriptions infirmières", "texte": "Seul ce que porte le référentiel prescriptible se prescrit ; certaines entrées ne se prescrivent qu’en renouvellement à l’identique. Signée, la prescription devient immuable et son PDF rejoint le registre des documents. Les examens prescrits deviennent des lignes « À prélever » de la fiche Prélèvements.", "etapes": ["Cliquez « Nouvelle prescription infirmière ».", "Cherchez chaque produit ou examen dans le référentiel et ajoutez-le.", "Choisissez si besoin la pharmacie ou le laboratoire destinataire.", "Cliquez « Signer la prescription », puis « Signer et produire le PDF ».", "Signez avec la carte CPS (« Signature par carte CPS »), puis cliquez « Envoyer »."]}, {"id": "poste-dossier-partage", "ecran": "Dossier patient · pour : infirmier", "titre": "Partage externe", "texte": "Les consentements du patient, les accès QR émis, le journal des accès et les professionnels préenregistrés. Sans consentement, aucun professionnel externe ne lit ni ne dépose rien. « Révoquer » retire aussitôt un consentement ou un accès."}, {"id": "poste-dossier-qr", "ecran": "Dossier patient · selon vos droits", "titre": "Émettre un QR", "texte": "Le QR ne s’affiche qu’une fois. Seul, il ne donne rien : le professionnel s’identifie par Pro Santé Connect et seuls les droits consentis s’ouvrent. Sa validité ne dépasse jamais la fin du consentement.", "etapes": ["Cliquez « Recueillir un consentement » : professionnel, date de fin, droits, parties lisibles, recueil écrit ou oral.", "Cliquez « Tracer le consentement ».", "Sur ce consentement, cliquez « Émettre un QR » et choisissez la durée de validité.", "Cliquez « Émettre le QR », puis imprimez-le ou montrez-le au professionnel."]}, {"id": "poste-dossier-actes-distance", "ecran": "Dossier patient · selon vos droits", "titre": "Actes à distance", "texte": "Téléconsultation, télésoin ou télé-expertise : chaque acte se trace avec son motif, son début et le consentement du patient. Pour une plaie, seules les photos choisies sont transmises. Ensuite, « Rédiger le compte rendu » se pré-rédige depuis le dossier, à relire puis signer."}, {"id": "poste-dossier-documents", "ecran": "Dossier patient · pour : infirmier", "titre": "Documents", "texte": "Les bilans et courriers du patient, le registre de tous ses documents (produits, reçus, ordonnances, photos), le dossier de preuve par période et l’export FHIR. Chaque document se télécharge ; son empreinte est revérifiée à chaque lecture."}, {"id": "poste-dossier-bilans-patient", "ecran": "Dossier patient · selon vos droits", "titre": "Bilans et courriers", "texte": "Un bilan est pré-rédigé depuis les passages signés de la période ; vous le relisez avant de le signer. Un courrier part de votre texte, un paragraphe par ligne.", "etapes": ["Cliquez « Nouveau document ».", "Choisissez un bilan, un compte rendu d’accès direct ou un courrier.", "Pour un bilan, fixez la période et, si proposé, la plaie ou l’objet suivi ; pour un courrier, l’objet, le destinataire et le texte.", "Cliquez « Pré-rédiger » ou « Rédiger le courrier » : l’éditeur s’ouvre."]}, {"id": "poste-dossier-preuve-periode", "ecran": "Dossier patient · pour : infirmier", "titre": "Dossier de preuve par période", "texte": "Un document unique, prêt à imprimer pour un contrôle : une page de garde, puis un acte par page avec son verdict d’intégrité. Choisissez les dates « Du » et « Au », éventuellement un soin, puis cliquez « Ouvrir le dossier de preuve »."}, {"id": "poste-patient-identite", "ecran": "Dossier patient · pour : infirmier, aide-soignante", "titre": "Identité", "texte": "L’identité de référence, l’INS et la couverture, chacune avec sa source et son « Historique ». À gauche : les divergences à trancher et les doublons possibles. À droite : la vérification sur pièce d’identité, les téléservices et la déclaration de décès."}, {"id": "poste-patient-ins", "ecran": "Dossier patient · selon vos droits", "titre": "Vérification sur pièce d’identité", "texte": "L’INS n’est qualifiée qu’avec la réponse d’INSi et le contrôle d’une pièce d’identité à haut niveau de confiance ; la carte Vitale n’en est pas une. Les traits de la pièce doivent être ceux du dossier. Si l’identité change ensuite, la pièce est à vérifier de nouveau.", "etapes": ["Dans « Téléservices », cliquez « Interroger » sur la ligne INSi.", "Contrôlez une pièce d’identité du patient.", "Choisissez la pièce présentée et la date, puis cliquez « Identité vérifiée sur cette pièce »."]}, {"id": "poste-patient-teleservices", "ecran": "Dossier patient · pour : infirmier", "titre": "Téléservices", "texte": "INSi, carte Vitale, ADRi et IDB, simulés en démonstration. « Interroger » verse la réponse au dossier avec sa source ; une valeur qui contredit le dossier ouvre une divergence, sans rien écraser. Ils sont aussi interrogés d’office à la création du dossier."}, {"id": "poste-patient-divergences", "ecran": "Dossier patient · pour : infirmier", "titre": "Divergences à trancher", "texte": "Quand deux sources ne disent pas la même chose, les deux valeurs s’affichent côte à côte avec leur source, les écarts marqués « diffère ». Cliquez « Retenir cette valeur » sous celle qui est juste ; l’autre reste au journal. Les divergences tranchées se relisent en bas du bloc."}, {"id": "poste-patient-doublons", "ecran": "Dossier patient · pour : infirmier", "titre": "Doublons possibles", "texte": "Les identités ressemblantes du cabinet, comparées champ par champ. Choisissez l’identité conservée, puis « Même personne : fusionner » ou « Personnes différentes ». Une confirmation dit les conséquences : soins et prescriptions rattachés à l’identité conservée, actes signés intacts, écarts devenus divergences."}, {"id": "poste-patient-deces", "ecran": "Dossier patient · selon vos droits", "titre": "Décès", "texte": "« Déclarer le décès » arrête tout ce qui devait venir : passages, tournées, fréquences, objets suivis, parcours, rappels et accès externes ; les soignants de ses tournées sont notifiés. Rien du dossier n’est effacé. Une erreur se corrige par « Déclaration faite par erreur », avec un motif.", "etapes": ["Cliquez « Déclarer le décès ».", "Saisissez la date du décès et qui a donné l’information ; le commentaire est obligatoire pour « Une autre source ».", "Relisez les conséquences, puis cliquez « Déclarer le décès »."]}, {"id": "poste-patient-antecedents", "ecran": "Dossier patient · pour : infirmier", "titre": "Antécédents et contacts", "texte": "Allergies, pathologies, traitements de fond, groupe sanguin, coordonnées, contacts, fragilité et dépistage, échelle de douleur. Chaque modification crée une version et un retrait reste dans l’« Historique ». Sans allergie, « Aucune allergie connue » enregistre ce statut, distinct de « Non renseigné »."}, {"id": "poste-soin", "ecran": "Vue d'un soin · pour : infirmier, aide-soignante", "titre": "Suivi du soin", "texte": "La page d’un soin du patient : son rythme prescrit, le nombre de passages signés et ses chiffres clés, puis l’historique de ses passages. Chaque ligne mène à sa « Preuve ». Les commentaires portés sur les champs se lisent en bas de page."}, {"id": "poste-soin-signal", "ecran": "Vue d'un soin · pour : infirmier", "titre": "Déclarer un changement de prescription", "texte": "Un changement de posologie, de produit, de rythme, de protocole, d’horaire ou de dosage s’annonce par un bandeau à l’ouverture de la fiche. Le bandeau se lève à la validation du premier passage sous la nouvelle valeur, puis reste en filigrane. Ce lien, réservé à l’infirmier, déclare un changement que la fiche ne calcule pas."}, {"id": "poste-soin-recu", "ecran": "Vue d'un soin · selon vos droits", "titre": "Reçu", "texte": "Dans les tables de passages, « Reçu » ouvre le reçu de cotation du passage, à côté de « Preuve »."}, {"id": "poste-dispositif", "ecran": "Page d'un dispositif · pour : infirmier, aide-soignante", "titre": "Dispositif", "texte": "La page d’un dispositif suivi (perfusion, stomie, sonde, trachéotomie, CPAP, pompe…) : ses compteurs, ses épisodes, ses rappels datés, ses passages signés et la série de ses photos. Le bloc « Ouverture » garde, figés, les champs saisis à la pose. « Preuves de l’épisode » ouvre le dossier de preuve depuis l’ouverture."}, {"id": "poste-dispositif-cloture", "ecran": "Page d'un dispositif · pour : infirmier", "titre": "Clôturer le dispositif", "texte": "La boîte de clôture dit d’abord ses conséquences, puis demande le motif, la date et, selon le type, le retrait ou le devenir du dispositif. Une ligne de perfusion encore ouverte bloque la clôture. Quand une transmission est proposée, gardez un destinataire ou écartez l’envoi avec un motif."}, {"id": "poste-plaies", "ecran": "Plaies · pour : infirmier, aide-soignante", "titre": "Plaies", "texte": "Toutes les plaies du cabinet. Celles qui ne progressent pas viennent en tête : « Sans mesure depuis… » après trois jours sans mesure, « Sans progrès depuis… » quand la valeur n’a pas baissé depuis J0. Les boutons « En cours », « Clôturées » et « Toutes » filtrent la liste ; cliquez une ligne pour ouvrir la plaie."}, {"id": "poste-plaies-colonnes", "ecran": "Plaies · pour : infirmier, aide-soignante", "titre": "Depuis J0", "texte": "Pour chaque plaie : l’épisode en jours et le nombre de pansements, la dernière valeur, la date de mesure et la variation depuis J0 avec sa mini-courbe. Une variation négative signifie que la plaie se réduit."}, {"id": "poste-plaie", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Plaie", "texte": "La fiche d’une plaie : la courbe et les chiffres clés, la comparaison des photos, les phases de cicatrisation, les passages, puis les champs figés à l’ouverture de l’épisode. « Imprimer la fiche » imprime la page ; « Preuves de l’épisode » ouvre le dossier de preuve de l’ouverture à aujourd’hui."}, {"id": "poste-plaie-courbe", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Depuis J0", "texte": "La courbe suit la grandeur de référence de la plaie depuis sa valeur à J0 ; les changements de produit y sont annotés. Au-dessus : valeur actuelle, variation depuis J0, jour de l’épisode, pansements et, s’il y a lieu, agrafes ou fils restants. Un écart de plus de 50 % avec la mesure précédente est signalé à confirmer, jamais bloquant."}, {"id": "poste-plaie-photos", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Comparaison", "texte": "Les deux photos les plus éloignées de la série s’affichent côte à côte, avec leur jour et leur mesure. À partir de trois photos, la bande de vignettes permet de choisir les clichés comparés. La date sous chaque photo ouvre le dossier de preuve du passage."}, {"id": "poste-plaie-passages", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Passages", "texte": "Chaque passage signé : date, intervenant, fibrine, saignement, exsudat purulent, surface ou volume, état. « sans mesure » signale une saisie allégée. « Preuve » ouvre le dossier de preuve du passage."}, {"id": "poste-plaie-cotation", "ecran": "Vue d'une plaie · selon vos droits", "titre": "Cotation", "texte": "La colonne « Cotation » donne les lignes cotées de chaque pansement et leur statut. « Reçu » ouvre le reçu de cotation du passage."}, {"id": "poste-plaie-phases", "ecran": "Vue d'une plaie · pour : infirmier, aide-soignante", "titre": "Phases de cicatrisation", "texte": "Ce bloc n’apparaît que si les aspects constatés aux passages renseignent les phases : détersion, bourgeonnement, épidermisation, avec leurs jours. Le logiciel ne les déduit pas."}, {"id": "poste-lecture-ordonnance", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Lecture d’ordonnance", "texte": "L’ordonnance est à gauche, telle que photographiée, avec le texte lu ; la proposition est à droite. Chaque valeur lue porte sa confiance ; une valeur douteuse est marquée « À vérifier ». Rien n’est créé avant votre validation."}, {"id": "poste-lecture-identite", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Ordonnance au nom d’un autre patient", "texte": "Le nom et la naissance écrits sur l’ordonnance sont comparés au dossier. S’ils désignent un autre patient, rien ne peut être validé : cliquez « Ce n’est pas ce patient : rejeter », puis « Confirmer le rejet », et versez l’ordonnance dans le bon dossier. Si seul le nom est écrit, ou aucun patient, vérifiez sur le document."}, {"id": "poste-lecture-valider", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Valider", "texte": "La prescription naît avec son document source et ses actes ; les fréquences retenues entrent au planning. Chaque différence entre la proposition et ce que vous validez est conservée. Une ordonnance échue ne se valide pas avec des fréquences qui démarreraient dans le passé.", "etapes": ["Relisez l’en-tête « Prescription » : prescripteur, nature, date, durée, renouvellements.", "Pour chaque ligne lue, gardez ou décochez « Retenir cette ligne », puis vérifiez l’acte prescrit.", "Décochez « Créer la fréquence » si la ligne ne doit pas entrer au planning.", "Choisissez la « Tournée des fréquences ».", "Cliquez « Valider la proposition », ou « Rejeter la proposition » avec un motif."]}, {"id": "poste-lecture-traitement", "ecran": "Lecture d'ordonnance · pour : infirmier", "titre": "Traitement à distribuer", "texte": "Les médicaments lus sur l’ordonnance. Chaque ligne cochée « Verser au traitement » rejoint le traitement du dossier à la validation, avec ce document pour source. La distribution la reprend sans nouvelle saisie."}]}]}, {"id": "aide-poste-organisation", "titre": "Poste fixe : tournées et coordination", "resume": "Tournées, transmissions, signalements, saisies différées, accès externes, télésanté, échanges.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-tournees", "ecran": "Tournées et planning", "titre": "Tournées et planning", "texte": "Cinq vues se partagent l’écran, chacune avec son adresse : « Planning », « Vue du jour », « Itinéraire et carte » (ouverte par défaut), « Prévisionnel et échéances » et « Indicateurs ». Le sous-titre compte les tournées et les intervenants. Un remplaçant voit d’emblée sa période de remplacement, et seuls les patients de sa portée apparaissent."}, {"id": "poste-tournees-itineraire", "ecran": "Tournées et planning", "titre": "Itinéraire et carte", "texte": "L’itinéraire d’une tournée pour un jour, un moment et un rôle, choisis en tête de page, sous les chiffres de la journée (domiciles terminés, soins signés, plus fort retard, trajets, intervenants). La liste « Ordre de passage » s’ouvre sur « À traiter » : retards, arrivées non signalées, prérequis à confirmer, domiciles non placés ; « Voir » ouvre « Avant d’arriver ». La carte affiche tous les parcours du moment, avec les calques « Météo », « Trafic » et « Radar de pluie » ; la frise de la journée les situe dans le temps. Choisir un parcours dans la frise ou sur la carte l’affiche dans la liste."}, {"id": "poste-tournees-ordre", "ecran": "Tournées et planning", "titre": "Ordre de passage", "texte": "Chaque domicile indique l’arrivée estimée, le retard, le trajet et la durée de ses soins. Glissez un domicile ou utilisez ses flèches pour changer l’ordre de ce jour ; « Garder cet ordre par défaut » en fait l’ordre habituel. « Proposer un ordre » affiche un ordre calculé sans l’enregistrer, à appliquer à ce jour, à garder par défaut ou à laisser ; une heure fixe n’est jamais déplacée. Le jour même, l’intervenant attribué signale « Je pars vers … » puis « Je suis arrivé chez … » sur le prochain domicile.", "etapes": ["Cliquez « Heure fixe » sur la ligne du domicile.", "Saisissez l’heure dans « Passage à » ; cochez « chaque jour » pour la garder.", "Validez avec « Fixer » ; « Retirer l’heure fixe » la supprime."]}, {"id": "poste-tournees-avant-arriver", "ecran": "Tournées et planning · pour : infirmier, aide-soignante", "titre": "Avant d’arriver", "texte": "Pour le domicile choisi, ou à défaut le prochain : alertes du dossier, accès au domicile (digicode, étage, clés, stationnement, animaux…), météo et trafic simulés, durée estimée de chaque soin, prérequis à préparer, matériel à emporter et dernier passage. L’accès et la photo de l’entrée restent propres au cabinet, jamais partagés au-dehors ; « Modifier l’accès » et « Ajouter une photo de l’entrée » les complètent. « Placer le repère sur la carte » corrige la position d’un domicile : cliquez ensuite sur la carte à son emplacement."}, {"id": "poste-tournees-preparer-demain", "ecran": "Tournées et planning", "titre": "Préparer demain", "texte": "La préparation porte sur la tournée du lendemain, pour le moment et le rôle choisis. L’ordre proposé place les heures fixes d’abord, respecte les heures prescrites autant que possible, puis prend le plus court ; la durée et la fin estimées se comparent à l’ordre actuel, avec les alertes et les prérequis à préparer la veille. L’ordre validé devient celui du jour ; s’il change ensuite, validez à nouveau. La validation revient à qui tient la tournée ce jour-là, ou à qui organise les tournées.", "etapes": ["Cliquez « Préparer demain » sous l’ordre de passage.", "Relisez l’ordre proposé, les alertes et « À préparer la veille ».", "Cliquez « Valider l’ordre proposé », ou « Valider l’ordre actuel » pour garder le vôtre."]}, {"id": "poste-tournees-planification", "ecran": "Tournées et planning · selon vos droits", "titre": "Planification du jour", "texte": "Pour un jour et un moment : une colonne par intervenant présent, avec ses passages et la charge de sa journée, plus une colonne « À attribuer ». Une carte posée chez un autre intervenant passe à la tournée qu’il sert ce moment-là ; une carte « À attribuer » lui confie sa tournée pour ce jour. La charge recalculée s’affiche avant de poser et rien n’est enregistré avant « Valider le déplacement » ; sauf pour l’IDE responsable, le passage est alors proposé à l’intervenant d’arrivée, qui l’accepte. Vous déplacez les passages que vous servez et ceux « À attribuer » ; l’IDE responsable les déplace tous.", "etapes": ["Prenez la carte : glissez-la à la souris, ou cliquez son bouton « Déplacer ».", "Choisissez la colonne d’arrivée (« Placer ici » au clavier) ; sa charge avec la carte s’affiche.", "Relisez le résumé dans le bandeau.", "Cliquez « Valider le déplacement », ou « Annuler » (Échap)."]}, {"id": "poste-tournees-planning-semaine", "ecran": "Tournées et planning", "titre": "Planning de la semaine", "texte": "Qui tient chaque tournée et chaque moment, jour par jour, pour les « Infirmiers » ou les « Aides-soignantes ». Les pastilles signalent une indisponibilité, un moment « À couvrir », un remplaçant, un échange accepté (« Échangé ») ou en attente (« Proposé »). Les flèches changent de semaine, « Cette semaine » y ramène. Cliquez l’une de vos cases à venir pour proposer un échange."}, {"id": "poste-tournees-a-couvrir", "ecran": "Tournées et planning", "titre": "À couvrir cette semaine", "texte": "Les moments de tournée où des soins sont dus sans personne pour les servir : intervenant indisponible, ou personne d’attribué. Pour chacun, l’application propose un collègue disponible ou un remplaçant. Qui organise les tournées clique « Confier à … » pour réattribuer la période en un geste ; les autres voient la proposition sans pouvoir l’appliquer."}, {"id": "poste-tournees-echanges", "ecran": "Tournées et planning", "titre": "Échanges de tournée", "texte": "Vos échanges, ou tous ceux du cabinet pour qui organise les tournées ; les propositions en attente viennent en tête. Le collègue sollicité clique « Accepter » ou « Refuser » (motif facultatif, transmis au demandeur) ; tant que la proposition attend, le demandeur peut la « Retirer ». Le planning suit la réponse.", "etapes": ["Cliquez « Proposer un échange », ou l’une de vos cases à venir du planning.", "Choisissez la tournée et le moment que vous cédez, le collègue du même rôle et la période.", "Indiquez la contrepartie : « Je reprends un de ses moments » ou « Cession, sans contrepartie ».", "Envoyez avec « Proposer l’échange »."]}, {"id": "poste-tournees-indisponibilites", "ecran": "Tournées et planning", "titre": "Indisponibilités", "texte": "Congés, maladies et formations de l’équipe, en cours ou à venir. Chacun déclare et retire les siennes ; qui organise les tournées le fait pour tous. Le motif ne se lit que par l’intéressé et par qui organise les tournées ; les autres voient « Indisponible ».", "etapes": ["Cliquez « Déclarer une absence ».", "Choisissez le motif et les dates « Du » et « Au ».", "Pour une absence qui revient, cochez « Revient chaque semaine » et les jours concernés.", "Cochez des moments, ou aucun pour toute la journée, puis cliquez « Déclarer »."]}, {"id": "poste-tournees-attributions", "ecran": "Tournées et planning · selon vos droits", "titre": "Attribuer un moment de cette tournée", "texte": "Sous le tableau des attributions de chaque tournée, ce formulaire confie un moment à un intervenant à partir d’une date, et jusqu’à une date si besoin. Si le moment est déjà tenu, l’application propose « Réattribuer la période » ou « Garder l’attribution existante ». Une formation manquante est signalée avant d’enregistrer : « Attribuer quand même » ou « Choisir un autre intervenant ». Un service d’une semaine au plus se reconduit avec « Répéter », toutes les une à quatre semaines.", "etapes": ["Dépliez « Attribuer un moment de cette tournée ».", "Choisissez le moment et l’intervenant.", "Indiquez le début, et la fin si l’attribution est limitée.", "Cliquez « Attribuer »."]}, {"id": "poste-tournees-vue-du-jour", "ecran": "Tournées et planning", "titre": "Vue du jour", "texte": "Une tournée et une date : pour chaque moment, l’infirmier et l’aide-soignante attribués, puis les soins dus avec leur heure prescrite et leur état. Une ligne ouvre le soin, la plaie, le dispositif, ou le dossier de preuve d’un passage signé. Sur un soin encore dû, « Non réalisé » déclare le passage manqué avec son motif. « Réattribuer » propose de le confier à une autre tournée, le même jour au même moment ; il change de tournée quand l’intervenant d’arrivée accepte."}, {"id": "poste-tournees-previsionnel", "ecran": "Tournées et planning", "titre": "Prévisionnel et échéances", "texte": "Le prévisionnel montre, sur sept ou quatorze jours, chaque patient et chaque soin avec une pastille par moment : prévu, fait, non réalisé ou non tracé. Le passé montre ce qui a eu lieu, et un compteur signale les passages dus jamais tracés. À côté, « Échéances » liste ce qui arrive dans les quatorze prochains jours : fins de prescription ou de soin, renouvellements, rendez-vous, rappels, fins de remplacement. Chaque ligne mène à ce qui la traite."}, {"id": "poste-tournees-indicateurs", "ecran": "Tournées et planning", "titre": "Indicateurs de tournée", "texte": "Kilomètres, temps de trajet, temps de soins, remplissage de la journée et passages non réalisés, totalisés sur la période. Cliquez une tuile pour afficher sa courbe, « Par jour » ou « Par semaine ». Qui organise les tournées choisit un intervenant ou « Tout le cabinet ». Le remplissage rapporte trajets et soins à une journée de référence provisoire et se dit en mots : légère, équilibrée ou chargée."}, {"id": "poste-tournees-nouvelle", "ecran": "Tournées et planning · selon vos droits", "titre": "Nouvelle tournée", "texte": "« Nouvelle tournée » ouvre un formulaire en tête de page : donnez un nom, puis créez la tournée. Elle rejoint la liste ; attribuez ensuite ses moments depuis la vue « Planning ». « Fermer » replie le formulaire sans rien créer.", "etapes": ["Cliquez « Nouvelle tournée ».", "Saisissez le « Nom de la tournée ».", "Cliquez « Créer la tournée »."]}, {"id": "poste-transmissions", "ecran": "Transmissions", "titre": "Transmissions", "texte": "Trois registres jamais confondus : « Ciblées » pour le dossier de soins d’un patient, « Intra-cabinet » pour l’organisation de l’équipe et « Externes » pour les correspondants extérieurs, ce dernier réservé à l’infirmier. Les filtres « Non lues », « Requalifiées » et « Me mentionnant », et le choix d’un patient, restreignent la liste. « Marquer comme lue » acquitte une transmission. Le bouton de l’en-tête écrit une transmission ciblée, ou un message au cabinet depuis l’onglet « Intra-cabinet »."}, {"id": "poste-transmissions-ciblee", "ecran": "Transmissions · selon vos droits", "titre": "Nouvelle transmission ciblée", "texte": "La transmission ciblée entre au dossier de soins du patient : une cible, puis des données, des actions ou un résultat, au moins l’un des trois. L’infirmier peut la marquer « Entretien infirmier » et la rattacher au soin pendant lequel l’entretien s’est tenu. Tapez @ dans un champ pour mentionner un membre du cabinet : il est notifié. La saisie reste en brouillon jusqu’à l’envoi.", "etapes": ["Cliquez « Nouvelle transmission ciblée ».", "Choisissez le patient et écrivez la cible.", "Renseignez les données, les actions ou le résultat.", "Cochez « Demander un avis à l’équipe (interpellation) » si besoin.", "Cliquez « Émettre la transmission »."]}, {"id": "poste-transmissions-intra", "ecran": "Transmissions", "titre": "Message au cabinet", "texte": "Un message d’organisation, hors dossier de soins, adressé à tout le cabinet, à un soignant ou à une tournée. Une mention @ notifie la personne nommée. La saisie reste en brouillon jusqu’à l’envoi.", "etapes": ["Ouvrez l’onglet « Intra-cabinet », puis cliquez « Nouveau message au cabinet ».", "Choisissez le destinataire : « Tout le cabinet », « Un soignant » ou « Une tournée ».", "Écrivez le message, puis cliquez « Envoyer le message »."]}, {"id": "poste-transmissions-requalifier", "ecran": "Transmissions · selon vos droits", "titre": "Requalifier la transmission", "texte": "« Requalifier » fait passer une transmission mal classée dans l’autre registre : une information clinique vers le dossier de soins, une information d’organisation vers l’intra-cabinet. Une nouvelle transmission la remplace, l’originale reste tracée et le motif, obligatoire, est inscrit au journal. Une interpellation en cours doit être traitée avant de sortir une transmission du dossier de soins.", "etapes": ["Cliquez « Requalifier » sur la transmission.", "Écrivez le motif de la requalification.", "Complétez le patient et la cible (vers une ciblée), ou le destinataire (vers l’intra-cabinet).", "Validez avec « Requalifier »."]}, {"id": "poste-transmissions-interpellations", "ecran": "Transmissions · selon vos droits", "titre": "Interpellations", "texte": "Les demandes d’avis adressées à l’équipe, de leur émission à leur traitement. « Marquer lue » indique que vous l’avez vue ; « Répondre et traiter » ouvre la réponse, horodatée et signée de votre nom, que « Marquer traitée » enregistre. Une interpellation toujours non lue passé le délai d’alerte est signalée."}, {"id": "poste-transmissions-proposees", "ecran": "Transmissions · selon vos droits", "titre": "Transmissions proposées", "texte": "Des transmissions ciblées préparées par l’application après un événement du soin : alerte clinique, effet secondaire, jours sans selles… Rien n’entre au dossier sans vous : « Relire » ouvre le brouillon, à compléter puis à émettre à votre nom avec « Confirmer et émettre ». « Écarter plutôt cette proposition » la retire avec un motif, qui est tracé."}, {"id": "poste-transmissions-reglage", "ecran": "Transmissions · selon vos droits", "titre": "Requalification", "texte": "Ce réglage dit qui peut faire passer une transmission d’un registre à l’autre. Les infirmiers le peuvent toujours ; qui gère les habilitations peut y ajouter les aides-soignantes, puis « Enregistrer le réglage ». Vers une transmission ciblée, la requalification reste réservée à l’infirmier."}, {"id": "poste-signalements", "ecran": "Signalements · pour : infirmier, aide-soignante", "titre": "Signalements de l’aide-soignante", "texte": "L’aide-soignante constate au domicile, l’infirmier décide, et chaque décision est tracée. Les filtres « En attente », « Décidés » et « Tous » trient la liste ; un signalement attend sa décision sans limite de temps. Chaque ligne cite le constat tel que signé et mène à « Voir le passage signé », et à « Ouvrir le nursing » pour un nursing."}, {"id": "poste-signalements-decider", "ecran": "Signalements · pour : infirmier", "titre": "Décision", "texte": "Trois décisions possibles : « Objet suivi ouvert » (une plaie ou un dispositif désormais suivi, qui référence le signalement), « Surveillance renforcée » ou « Sans suite ». Enregistrée, la décision est tracée au journal et ne se réécrit pas. Si le patient n’a encore aucune plaie ni aucun dispositif ouvert, ouvrez la plaie au terminal lors du prochain passage, puis revenez la rattacher.", "etapes": ["Choisissez la décision.", "Pour « Objet suivi ouvert », sélectionnez la plaie ou le dispositif.", "Ajoutez un commentaire si besoin.", "Cliquez « Enregistrer la décision »."]}, {"id": "poste-saisies-differees", "ecran": "Saisies différées · selon vos droits", "titre": "Saisies différées", "texte": "Les actes et prescriptions infirmières saisis au-delà du délai attendent ici une décision du poste fixe avant l’envoi. Chaque ligne donne l’heure du soin et celle de la saisie, l’écart, le motif du différé et le signataire ; « Preuve » ou « Prescription » ouvre la source. « Valider » tient la saisie pour acquise, « Refuser » l’écarte avec un motif. Ce qui est signé ne change pas : la décision s’ajoute au journal."}, {"id": "poste-saisies-differees-refus", "ecran": "Saisies différées · selon vos droits", "titre": "Refuser la saisie", "texte": "Refuser ne supprime rien : l’acte reste au dossier, signé et inchangé, mais il est écarté de l’envoi ; une prescription refusée reste au dossier et ne part pas. Le motif du refus est obligatoire.", "etapes": ["Cliquez « Refuser » sur la ligne.", "Écrivez le motif du refus.", "Confirmez avec « Refuser la saisie »."]}, {"id": "poste-acces-externes", "ecran": "Accès externes · selon vos droits", "titre": "Accès externes", "texte": "Cette page réunit les accès QR du cabinet et les professionnels préenregistrés. Chaque accès dépend du consentement de son patient. Un QR s’émet depuis le dossier du patient, onglet « Coordination », vue « Partage externe »."}, {"id": "poste-acces-externes-qr", "ecran": "Accès externes · selon vos droits", "titre": "Accès QR", "texte": "Chaque accès indique le patient, le professionnel, sa date d’émission et sa validité. « Actifs » et « Tous » filtrent la liste. Une ligne ouvre le partage externe du patient, où l’accès se révoque."}, {"id": "poste-acces-externes-professionnels", "ecran": "Accès externes · selon vos droits", "titre": "Professionnels préenregistrés", "texte": "Un professionnel extérieur doit être préenregistré avant de recevoir un accès. Son RPPS doit être celui que Pro Santé Connect atteste à chaque connexion : un autre professionnel ne passe pas.", "etapes": ["Cliquez sur « Préenregistrer ».", "Saisissez le RPPS (11 chiffres), la qualité, le nom et le prénom.", "Ajoutez la spécialité si besoin, puis « Préenregistrer »."]}, {"id": "poste-telesante", "ecran": "Télésanté · pour : infirmier, aide-soignante", "titre": "Télésanté", "texte": "Ce registre réunit les téléconsultations, télésoins et télé-expertises du cabinet, avec participants et compte rendu. Il couvre par défaut les trente derniers jours ; « Depuis le » change la période, et « Tous », « À rédiger », « Signés » filtrent les comptes rendus. La séance se tient depuis le dossier du patient, onglet Actes à distance ; rien de la vidéo n’est conservé."}, {"id": "poste-echanges", "ecran": "Échanges de santé · pour : infirmier", "titre": "Échanges de santé", "texte": "Cette page réunit la messagerie sécurisée, le laboratoire, les passages imprévus et les règles provisoires de la démonstration. Tous ces échanges sont simulés : rien ne quitte le poste."}, {"id": "poste-echanges-messagerie", "ecran": "Échanges de santé · pour : infirmier", "titre": "Messagerie sécurisée", "texte": "La boîte simulée a deux vues, « Reçus » et « Envoyés ». « Relever la boîte » fait arriver les messages en attente, par exemple les résultats d’un laboratoire, rattachés à leur prélèvement. Un message reçu s’ouvre en PDF."}, {"id": "poste-echanges-laboratoire", "ecran": "Échanges de santé · pour : infirmier", "titre": "Prélèvements et laboratoire", "texte": "Ce panneau liste les prélèvements signés des trente derniers jours et leur état : à adresser, envoyé, refusé ou résultats reçus. « Adresser au laboratoire » envoie le bon par la messagerie sécurisée simulée. Relevez ensuite la boîte pour recevoir les résultats."}, {"id": "poste-echanges-regulariser", "ecran": "Échanges de santé · pour : infirmier", "titre": "Passages imprévus à régulariser", "texte": "Un passage signé sans prescription au domicile attend ici, sa cotation suspendue. Rattacher la prescription arrivée ensuite le fait recoter ; il passe alors en file de contrôle. Cette règle est provisoire.", "etapes": ["Cliquez sur « Rattacher une prescription ».", "Choisissez la prescription arrivée après le passage.", "Cliquez sur « Régulariser »."]}, {"id": "poste-echanges-reglages", "ecran": "Échanges de santé · pour : infirmier", "titre": "Réglages de la démonstration", "texte": "Ce panneau montre, en lecture, l’état des services d’échange simulés et des règles provisoires. Le bouton « Simulations » ouvre la page où ils se règlent."}, {"id": "poste-renouvellements", "ecran": "Renouvellements · selon vos droits", "titre": "Renouvellements d’ordonnance", "texte": "Les ordonnances qui arrivent à échéance dans les quatorze jours sans demande, les demandes en cours, puis celles reçues ou annulées. Une demande naît avec un courrier pré-rempli au prescripteur, envoyé par messagerie sécurisée. La même liste se retrouve, patient par patient, dans l’onglet « Prescriptions » du dossier."}, {"id": "poste-renouvellement-demande", "ecran": "Renouvellements · selon vos droits", "titre": "Demander le renouvellement", "texte": "Un courrier jamais relu ne part pas d’un clic : vous choisissez « Relire d’abord » ou « Envoyer tel quel ». « Annuler » clôt la demande avec un motif.", "etapes": ["Cliquez « Demander le renouvellement » sur l’ordonnance.", "Cliquez « Relire le courrier » : il s’ouvre dans l’éditeur des bilans.", "Cliquez « Envoyer au prescripteur ».", "Sans réponse au terme du délai, cliquez « Relancer »."]}]}]}, {"id": "aide-poste-documents", "titre": "Poste fixe : bilans, preuves et facturation", "resume": "Bilans et documents, preuves, facturation de démonstration, reçu et simulateur, rappel de lot.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-bilans", "ecran": "Bilans et documents · selon vos droits", "titre": "Bilans et documents",
