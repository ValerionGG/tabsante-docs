"texte": "Les bilans dus et ceux du cabinet. Ils sont pré-rédigés depuis les passages signés, puis relus et signés par l’infirmier. Un bilan à la demande se crée depuis le dossier du patient, onglet « Documents »."}, {"id": "poste-bilans-dus", "ecran": "Bilans et documents · selon vos droits", "titre": "À rédiger et signer", "texte": "Les bilans dus, en retard signalés, et les comptes rendus de lecture tuberculinique que le prescripteur attend. « Rédiger » pré-rédige le bilan et ouvre l’éditeur ; « Reprendre » rouvre un brouillon déjà commencé."}, {"id": "poste-bilans-cabinet", "ecran": "Bilans et documents · selon vos droits", "titre": "Bilans du cabinet", "texte": "Tous les bilans, filtrés par « Brouillons », « Signés » ou « Tous », avec la période, l’état et la dernière intervention. « Relire » ouvre un brouillon, « Voir » un bilan signé ; le nom du patient ouvre ses documents."}, {"id": "poste-bilan-nouveau", "ecran": "Nouveau document · selon vos droits", "titre": "Pré-rédaction du bilan", "texte": "Une page de passage : les faits de la période sont rassemblés depuis les passages signés, puis l’éditeur du bilan s’ouvre de lui-même. On y arrive par « Rédiger » dans « À rédiger et signer », ou depuis un bilan dû signalé dans le dossier. Pour un bilan à la demande, passez par le dossier du patient, onglet « Documents », bouton « Nouveau document »."}, {"id": "poste-bilan-editeur", "ecran": "Rédiger un bilan · selon vos droits", "titre": "Bilan", "texte": "Chaque phrase est un fait tiré des passages signés de la période, suivi de ses sources. Le logiciel ne juge pas : relisez, corrigez, complétez, puis signez. Une phrase que vous réécrivez ou ajoutez est marquée à votre nom.", "etapes": ["Relisez chaque section : « Modifier » réécrit une phrase, la corbeille la retire, « Ajouter une phrase » en crée une.", "Complétez si besoin le « Complément de l’infirmier », puis « Enregistrer le complément ».", "Vérifiez le rendu avec « Aperçu du PDF ».", "Cliquez « Signer le bilan », puis « Signer et produire le PDF »."]}, {"id": "poste-bilan-sources", "ecran": "Rédiger un bilan · selon vos droits", "titre": "Sources", "texte": "Sous chaque phrase, ses sources groupées par nature, avec leur date. Une date de passage ouvre sa preuve, une date de photo affiche la photo, une plaie ou un objet suivi ouvre sa page. « corrigé » signale une valeur corrigée après signature : la correction est retenue."}, {"id": "poste-bilan-signature", "ecran": "Rédiger un bilan · selon vos droits", "titre": "Signer le bilan", "texte": "La signature rend le bilan immuable et range le PDF signé au registre des documents du patient, avec son empreinte. Selon le document, il part aussitôt vers ses destinations, ou rien n’est envoyé et vous choisissez ensuite les destinataires. Un compte rendu ou un courrier signé se corrige par « Corriger », qui crée une nouvelle version."}, {"id": "poste-bilan-envoi", "ecran": "Rédiger un bilan · selon vos droits", "titre": "Envoyer le document", "texte": "Après signature, « Envoyer » propose la messagerie de santé (MSSanté) et le DMP. Le DMP n’est possible qu’avec une identité qualifiée INS. Le résultat s’affiche par destinataire ; en démonstration, l’envoi est simulé."}, {"id": "poste-bilan-conflit", "ecran": "Rédiger un bilan · selon vos droits", "titre": "Recharger le bilan", "texte": "Un brouillon est partagé au cabinet. Si un collègue l’a relu entre-temps, vos dernières modifications ne sont pas enregistrées et un avis le dit. Cliquez « Recharger le bilan » pour repartir de sa version."}, {"id": "poste-bilan-cotation", "ecran": "Rédiger un bilan · selon vos droits", "titre": "Cotation", "texte": "Quand le bilan porte une cotation, le panneau « État » la donne ligne par ligne : c’est le bilan signé qui se cote, pas les mesures qui l’alimentent. Une cotation du moteur de démonstration n’est jamais facturée."}, {"id": "poste-preuves-cotations", "ecran": "Preuves · selon vos droits", "titre": "Preuves et cotations", "texte": "Tous les actes signés du cabinet avec leur cotation, leur statut et leur état ; « Preuve » ouvre le dossier de preuve de chacun. Le bouton « Saisies différées » ne garde que les actes déclarés après coup. En tête, le décompte des cotations par statut et l’état du journal d’audit."}, {"id": "poste-preuves-soins", "ecran": "Preuves · pour : aide-soignante", "titre": "Preuves des soins", "texte": "Tous les actes signés du cabinet, du plus récent au plus ancien, avec le patient, le soin, l’intervenant et l’état. Le bouton « Saisies différées » ne garde que les actes déclarés après coup. Le bloc « Intégrité » dit si le journal d’audit est intact."}, {"id": "poste-preuves-integrite", "ecran": "Preuves · pour : infirmier, aide-soignante", "titre": "Intégrité", "texte": "« Journal d’audit intact » : vérifié de bout en bout, sans trou ni réécriture. S’il est dit rompu, une entrée a été modifiée hors de l’application : prévenez le responsable sécurité avant toute présentation de preuve."}, {"id": "poste-preuves-ancrage", "ecran": "Preuves · pour : infirmier", "titre": "Chaîne d’audit et ancrage", "texte": "La tête courante de la chaîne d’audit, à recopier hors de la plateforme. « Relire toute la chaîne » vérifie chaque entrée, de la première à la dernière, et contrôle les ancres. « Poser une ancre » revient à qui gère les habilitations du cabinet."}, {"id": "poste-preuves-periode", "ecran": "Preuves · pour : infirmier", "titre": "Dossier de preuve par période", "texte": "Le chemin le plus court pour un contrôle : le dossier de preuve d’un patient sur une période, en un seul document.", "etapes": ["Choisissez le patient.", "Réglez les dates « Du » et « Au ».", "Cliquez « Ouvrir le dossier »."]}, {"id": "poste-preuve-acte", "ecran": "Dossier de preuve d'un acte · pour : infirmier", "titre": "Dossier de preuve d’un acte", "texte": "Le document qui atteste un acte, prêt à imprimer : verdict d’intégrité en tête, puis qui et quand, la prescription, l’objet suivi, ce qui a été constaté et fait, les corrections, les photos et commentaires, et le journal d’audit. « Imprimer » et « PDF » ouvrent la fenêtre d’impression."}, {"id": "poste-preuve-verdict", "ecran": "Dossier de preuve d'un acte · pour : infirmier", "titre": "Empreinte conforme", "texte": "« Empreinte conforme » : rien n’a changé depuis la signature. « Journal intact » : le journal d’audit est sans trou ni réécriture. Si l’un des deux manque, le dossier ne vaut pas preuve en l’état : ne le présentez pas lors d’un contrôle et prévenez le responsable sécurité du cabinet."}, {"id": "poste-preuve-corrections", "ecran": "Dossier de preuve d'un acte · pour : infirmier", "titre": "Corrections après signature", "texte": "Une correction ne réécrit pas l’acte signé : elle s’ajoute au journal, avec son motif. « Corriger une donnée » demande la donnée, sa nouvelle valeur et le motif de la correction. Le tableau garde l’ancienne valeur barrée, la nouvelle, le motif et l’auteur."}, {"id": "poste-preuve-cotation", "ecran": "Dossier de preuve d'un acte · selon vos droits", "titre": "Cotation", "texte": "Chaque ligne cotée avec son coefficient et son « Pourquoi ? », puis le statut, le moteur et les versions du référentiel. « Reçu de cotation du passage » ouvre les montants et les règles appliquées. Une cotation calculée par le moteur de démonstration est signalée : ne la facturez pas."}, {"id": "poste-preuve-periode", "ecran": "Dossier de preuve par période · pour : infirmier", "titre": "Dossier de preuve", "texte": "Le dossier de preuve d’un patient sur une période : une page de garde avec le bilan d’intégrité et le sommaire, puis le dossier de chaque acte, un par page. Changez les dates « Du » et « Au », puis cliquez « Changer la période ». Ouvert depuis une plaie ou un dispositif, il ne retient que cet épisode."}, {"id": "poste-preuve-sommaire", "ecran": "Dossier de preuve par période · pour : infirmier", "titre": "Sommaire", "texte": "Chaque acte de la période avec sa date, son soin, son signataire et son intégrité : « Vérifiée » ou « Compromise ». Cliquez une date pour descendre à son dossier. Un acte compromis est signalé en tête de page."}, {"id": "poste-facturation", "ecran": "Facturation · pour : infirmier", "titre": "Facturation", "texte": "Cette section suit une cotation confirmée jusqu’à la FSE, au lot et à ses retours ; chaque ligne reste adossée à l’acte signé. Tout est simulé : le moteur est de démonstration et SESAM-Vitale est factice, rien n’est transmis. Les onglets mènent de la file de contrôle aux réglages, avec un simulateur de cotation en dernier."}, {"id": "poste-facturation-file", "ecran": "Facturation · pour : infirmier", "titre": "File de contrôle", "texte": "Ici attendent les cotations qui demandent un regard humain avant la FSE. « À arbitrer » réunit celles que le moteur a reconfirmées autrement ou qu’une règle du cabinet retient ; « Signalées », les provisoires repérées avant la reconfirmation. Chaque ligne montre ses motifs, la cotation « À la signature » et celle du moteur, avec « Pourquoi ? » pour lire la règle appliquée. Les liens mènent à la preuve et au reçu de cotation."}, {"id": "poste-facturation-reconfirmation", "ecran": "Facturation · pour : infirmier", "titre": "Reconfirmation", "texte": "Le bouton « Reconfirmer les cotations » fait rejouer par le moteur chaque cotation provisoire des actes signés jusqu’à aujourd’hui. Si les lignes sont les mêmes, la cotation est confirmée. Si elles divergent ou qu’une règle du cabinet s’applique, elle entre en file, et ses lignes provisoires restent lisibles."}, {"id": "poste-facturation-arbitrage", "ecran": "Facturation · pour : infirmier", "titre": "Arbitrage", "texte": "Seuls les arbitres désignés dans les réglages voient le bouton « Arbitrer » ; les autres consultent la file. Confirmer retient la cotation du moteur ; écarter la sort de la facturation. Le motif est obligatoire (trois caractères au moins) et tracé au journal.", "etapes": ["Cliquez sur « Arbitrer » sous la cotation.", "Choisissez « Confirmer la cotation » ou « Écarter de la facturation ».", "Saisissez le motif.", "Validez par « Confirmer » ou « Écarter »."]}, {"id": "poste-facturation-a-facturer", "ecran": "Facturation · À facturer · pour : infirmier", "titre": "À facturer", "texte": "Les cotations confirmées d’actes signés apparaissent ici, regroupées par patient et par infirmier signataire. La FSE se crée avec la carte CPS de l’infirmier qui a réalisé les actes : vous ne créez que celle de vos propres actes. Un acte marqué « Bloqué » ne peut pas entrer dans une FSE, la raison est écrite à côté."}, {"id": "poste-facturation-creer-fse", "ecran": "Facturation · À facturer · pour : infirmier", "titre": "Créer la FSE", "texte": "Les actes libres sont cochés d’avance ; décochez ceux à garder pour plus tard. Une FSE porte 50 actes au plus. Une fois créée, sa fiche s’ouvre aussitôt.", "etapes": ["Vérifiez les passages cochés dans le tableau.", "Ouvrez « Reçu » ou « Preuve » au besoin.", "Cliquez sur « Créer la FSE »."]}, {"id": "poste-facturation-fse", "ecran": "Facturation · FSE · pour : infirmier", "titre": "Feuilles de soins électroniques", "texte": "Ce tableau liste toutes les FSE : numéro, patient, émetteur, nombre de lignes, date de création et état (créée, sécurisée, en lot, télétransmise, acceptée, rejetée ou annulée). Les numéros sont attribués par l’adaptateur factice : aucun organisme ne les a vus. « Ouvrir » affiche le détail ; une FSE se crée depuis « À facturer »."}, {"id": "poste-facturation-fse-detail", "ecran": "Une FSE · pour : infirmier", "titre": "Lignes de la FSE", "texte": "Chaque ligne cite l’acte signé et son empreinte ; « Acte signé » ouvre sa preuve. Le panneau de droite donne le patient, l’émetteur, l’infirmier qui a réalisé les actes, les dates et le lot. En cas de rejet, le motif s’y affiche avec le lien « Traiter le rejet »."}, {"id": "poste-facturation-fse-securiser", "ecran": "Une FSE · pour : infirmier", "titre": "Sécuriser avec les deux cartes", "texte": "Une FSE créée se sécurise par l’infirmier qui a réalisé les actes, avec la carte Vitale du patient et sa carte CPS, toutes deux simulées. Sans carte Vitale, « Sans carte Vitale (mode dégradé) » sécurise la FSE ; il faut alors adresser la feuille papier à la caisse. Hors démonstration, un seul bouton « Sécuriser la FSE » est proposé.", "etapes": ["Cliquez sur « Lire la carte Vitale ».", "Saisissez le code porteur de votre carte CPS, sauf s’il a été présenté à la connexion.", "Cliquez sur « Sécuriser avec les deux cartes »."]}, {"id": "poste-facturation-fse-annuler", "ecran": "Une FSE · pour : infirmier", "titre": "Annuler la FSE", "texte": "Tant qu’elle n’est pas en lot, la FSE n’est partie nulle part. L’annuler rend ses actes à « À facturer ». Le motif est obligatoire (trois caractères au moins) et tracé au journal.", "etapes": ["Saisissez le motif de l’annulation.", "Cliquez sur « Annuler la FSE »."]}, {"id": "poste-facturation-fse-reglement", "ecran": "Une FSE · pour : infirmier", "titre": "Cartes, tiers payant et paiement", "texte": "Ce panneau montre comment la FSE a été sécurisée, puis la répartition du total entre Assurance maladie, complémentaire et reste au patient, et enfin le paiement. Les montants sont de démonstration. Une part complémentaire refusée ou un reste à recouvrer y est signalé."}, {"id": "poste-facturation-lots", "ecran": "Facturation · Lots · pour : infirmier", "titre": "Lots", "texte": "Chaque lot porte son numéro, son émetteur, ses FSE et le résultat du contrôle de cohérence. « Télétransmettre » envoie un lot constitué, de façon simulée. « Lire les retours » récupère ensuite les retours simulés et met à jour l’état des FSE. Ces deux gestes reviennent à l’émetteur du lot ; le dépliant des pièces justificatives signale une ordonnance numérisée manquante."}, {"id": "poste-facturation-constituer-lot", "ecran": "Facturation · Lots · pour : infirmier", "titre": "Constituer un lot", "texte": "Ce panneau réunit les FSE sécurisées pas encore en lot ; il n’apparaît qu’à qui peut mettre en lot. Un lot ne contient que les FSE d’un seul émetteur ; celles d’un confrère sont grisées. Avant création, le contrôle de cohérence vérifie les actes. En cas d’anomalie, il les détaille, avec « Voir la preuve » pour chaque acte en cause.", "etapes": ["Gardez cochées les FSE d’un même émetteur.", "Cliquez sur « Mettre en lot ».", "En cas d’anomalie, corrigez la cause, ou saisissez un « Motif du forçage » puis cliquez sur « Forcer la mise en lot »."]}, {"id": "poste-facturation-forcage", "ecran": "Facturation · Lots · pour : infirmier", "titre": "Forcer la mise en lot", "texte": "Le forçage n’est proposé que pour les anomalies qui l’admettent. Son motif est figé dans le lot et tracé au journal. Une preuve altérée ou une saisie différée pas encore validée ne se force jamais : il faut d’abord la régler."}, {"id": "poste-facturation-rejets", "ecran": "Facturation · Rejets · pour : infirmier", "titre": "Rejets", "texte": "Les FSE rejetées au retour d’un lot arrivent ici avec leur motif ; l’onglet n’apparaît qu’à qui traite les rejets. « À traiter » montre celles qui attendent une décision, « Tous » garde aussi les rejets déjà traités. Un rejet se traite par l’émetteur de la FSE."}, {"id": "poste-facturation-rejet-decision", "ecran": "Facturation · Rejets · pour : infirmier", "titre": "Refacturer ou abandonner", "texte": "Refacturer rend les actes facturables dans une nouvelle FSE, une fois la cause corrigée (onglet « À facturer »). Abandonner les laisse hors facturation ; le rejet et votre décision restent consultables. Un commentaire est obligatoire (trois caractères au moins) et tracé avec la décision.", "etapes": ["Cliquez sur « Refacturer » ou « Abandonner ».", "Lisez la conséquence affichée.", "Saisissez le commentaire, puis validez."]}, {"id": "poste-facturation-had", "ecran": "Facturation · Relevés HAD · pour : infirmier", "titre": "Séjours HAD", "texte": "Pendant un séjour en hospitalisation à domicile, les actes sont relevés à la structure selon sa convention : aucune FSE. Chaque séjour indique s’il est payable (« Lettre de mission ») ou « Non payable en l’état ». Un séjour se déclare dans le dossier du patient, onglet Prise en charge."}, {"id": "poste-facturation-had-releve", "ecran": "Un relevé HAD · pour : infirmier", "titre": "Relevé d’actes", "texte": "Le relevé liste les actes du séjour avec leur cotation, leur empreinte et un lien vers leur preuve. Si un relevé n’est pas payable, la mention manquante est indiquée ; elle se saisit dans le dossier du patient, onglet Prise en charge."}, {"id": "poste-facturation-reglages", "ecran": "Facturation · Réglages · pour : infirmier", "titre": "Règles de la file de contrôle", "texte": "Le cabinet choisit ici ce qui passe en file avant la FSE. Une divergence entre provisoire et confirmée et un acte corrigé après signature y passent toujours. Les autres règles, le délai d’arbitrage (de 1 à 90 jours) et les arbitres se règlent ici ; chaque changement est tracé avec l’état d’avant. Sans le droit de mettre en lot, la page est en lecture seule.", "etapes": ["Cochez les règles à appliquer.", "Réglez le délai d’arbitrage.", "Cochez au moins un profil d’arbitre.", "Cliquez sur « Enregistrer les règles »."]}, {"id": "poste-facturation-simuler", "ecran": "Simuler une cotation · pour : infirmier", "titre": "Simuler une cotation", "texte": "Ce simulateur fait coter un passage fictif par le moteur de démonstration : rien n’est écrit, jamais pour facturer. Partez d’un cas type ou composez le passage. La « Cotation du moteur » se recalcule à chaque changement, ligne par ligne avec son montant, et affiche le « Total à la date »."}, {"id": "poste-facturation-simuler-passage", "ecran": "Simuler une cotation · pour : infirmier", "titre": "Soins du passage", "texte": "Le panneau « Passage » fixe la date, le lieu, l’âge, les contextes de prise en charge et le forfait BSI. Chaque soin a son heure et ses données propres. Deux cases changent la cotation : « Heure imposée par la prescription » et « Rôle propre, sans ordonnance ». Douze soins au plus par passage.", "etapes": ["Choisissez un cas type, ou réglez le passage.", "Cliquez sur « Ajouter un soin » et choisissez-le.", "Renseignez l’heure et les données du soin.", "Lisez le résultat et ouvrez « Pourquoi ? » sur une ligne."]}, {"id": "poste-facturation-simuler-deplacement", "ecran": "Simuler une cotation · pour : infirmier", "titre": "Déplacement", "texte": "Ce panneau règle les indemnités de déplacement : distance, zone, agglomération, patients déjà vus à la même adresse et kilomètres déjà facturés ce jour. Les kilomètres se cotent hors de l’agglomération du cabinet, au-delà de la franchise. Si la distance, la zone ou l’agglomération est inconnue, seul le forfait est coté."}, {"id": "poste-recu-cotation", "ecran": "Reçu de cotation · pour : infirmier", "titre": "Reçu de cotation", "texte": "Le reçu détaille la cotation d’un passage réel : ses actes, chaque ligne avec son calcul et son montant, et le total à la date du passage. Règles et tarifs sont de démonstration : aucun montant n’est facturé ni opposable. « Voir la preuve signée » ouvre la preuve ; « Imprimer ou PDF » imprime le reçu sans les commandes."}, {"id": "poste-recu-lignes", "ecran": "Reçu de cotation · pour : infirmier", "titre": "Lignes du passage", "texte": "Chaque ligne affiche une pastille avec la règle qui la fait. Un clic sur la pastille déplie l’explication : le calcul, la règle et les versions du référentiel et des tarifs. En bas, les valeurs en vigueur à la date du passage et le total."}, {"id": "poste-recu-et-si", "ecran": "Reçu de cotation · pour : infirmier", "titre": "Et si le passage avait eu lieu…", "texte": "Cette partie rejoue le passage réel en changeant l’heure, le jour ou la prescription. La cotation simulée s’affiche dans une colonne « Et si », avec les lignes changées, ajoutées ou retirées et l’écart de total ; rien n’est écrit. « Revenir au passage réel » efface la simulation.", "etapes": ["Changez l’heure, ou choisissez un dimanche ou un jour férié.", "Cochez ou décochez « Horaire imposé » et « Dimanches et fériés précisés ».", "Comparez la colonne « Et si » et le total."]}, {"id": "poste-rappel-lot", "ecran": "Rappel de lot · pour : infirmier", "titre": "Rappel de lot", "texte": "Cette page retrouve les patients qui ont reçu un lot rappelé : injections, médicaments, perfusions, nutrition et dispositifs. Saisissez le numéro tel qu’il figure sur l’avis de rappel, puis cliquez sur « Rechercher ». Chaque emploi renvoie au dossier de preuve, à la plaie ou au dispositif."}, {"id": "poste-rappel-lot-actions", "ecran": "Rappel de lot · pour : infirmier", "titre": "Notifier les médecins traitants", "texte": "« Éditer la liste » télécharge les emplois du lot en tableur (CSV). « Notifier les médecins traitants » prépare une notification par patient, avec un avis de rappel facultatif. Les notifications s’envoient ou s’écartent ensuite depuis le centre de notifications.", "etapes": ["Saisissez l’avis de rappel, facultatif.", "Cliquez sur « Notifier les médecins traitants ».", "Cliquez sur « Les envoyer » pour ouvrir les notifications."]}]}]}, {"id": "aide-poste-ressources", "titre": "Poste fixe : ressources et paramètres", "resume": "Savoir-faire, relecture, référentiels, paramètres du cabinet, équipe, terminaux, journal, simulations.", "mots_cles": ["aide", "poste fixe"], "blocs": [{"type": "aides", "items": [{"id": "poste-savoir-faire", "ecran": "Savoir-faire", "titre": "Savoir-faire", "texte": "Cette page réunit les gestes, vidéos, questions et références écrites du réseau, relus par des infirmières et des médecins. Les gestes essentiels apparaissent en premier. Chaque contenu publié porte le nom de qui l’a validé et sa date de révision."}, {"id": "poste-savoir-faire-filtres", "ecran": "Savoir-faire", "titre": "Rechercher un geste ou une question", "texte": "Tapez un mot dans la recherche, ou filtrez par type (« Tout », « Gestes », « Questions », « Vidéos », « Documents ») et par fiche de soin. « Toutes les fiches » retire le filtre de fiche. Si rien ne correspond, « Poser la question » s’adresse au réseau."}, {"id": "poste-savoir-faire-questions", "ecran": "Savoir-faire", "titre": "Questions fréquentes", "texte": "Une question se déplie d’un clic : contexte, puis réponse validée ou réponses en attente. « Questions du terrain en attente » liste celles qui n’ont pas encore de réponse validée. « Poser une question » ouvre le formulaire."}, {"id": "poste-savoir-faire-proposer", "ecran": "Savoir-faire", "titre": "Proposer un contenu", "texte": "Vous pouvez proposer un geste, une vidéo, un document ou une question et sa réponse. Un référent relit chaque proposition avant publication. N’écrivez aucune donnée de patient : ni nom, ni date de naissance, ni adresse, ni détail qui permette de le reconnaître.", "etapes": ["Cliquez sur « Proposer un contenu » et choisissez le type.", "Donnez un titre ; pour un geste, décrivez les étapes dans l’ordre.", "Cochez les fiches concernées.", "Cliquez sur « Proposer »."]}, {"id": "poste-savoir-faire-a-relire", "ecran": "Savoir-faire", "titre": "À relire", "texte": "Ce panneau montre aux référents les trois premières propositions qui attendent une relecture. « Relire » ouvre la proposition dans la file de relecture ; « Ouvrir la relecture » affiche toute la file."}, {"id": "poste-savoir-faire-contenu", "ecran": "Un contenu de savoir-faire", "titre": "Savoir-faire", "texte": "La fiche d’un contenu montre ses étapes et points de vigilance, sa vidéo, ses réponses ou son document, puis le matériel, les fiches concernées et son origine. « Utile » signale qu’il vous a servi. Une vidéo se lit depuis YouTube et un document reste chez son éditeur : rien n’est copié ici."}, {"id": "poste-savoir-faire-modifier", "ecran": "Un contenu de savoir-faire", "titre": "Proposer une modification", "texte": "Sur un contenu publié, « Proposer une modification » envoie une nouvelle version en relecture ; l’actuelle reste en vigueur jusqu’à sa publication. Sur une proposition pas encore publiée, le bouton s’appelle « Corriger »."}, {"id": "poste-savoir-faire-repondre", "ecran": "Un contenu de savoir-faire · pour : infirmier", "titre": "Répondre", "texte": "Vous pouvez répondre à une question du réseau, avec une source si vous en avez une. Un référent peut ensuite la marquer « réponse validée ». N’écrivez aucune donnée de patient.", "etapes": ["Rédigez votre réponse.", "Ajoutez la source, facultative.", "Cliquez sur « Envoyer la réponse »."]}, {"id": "poste-relecture", "ecran": "Relecture", "titre": "Relecture du savoir-faire", "texte": "Cette file réunit les contenus que relisent les référents. « Proposés » attend une relecture, « Relus » une publication, « À revoir » regroupe les contenus publiés dont la date de révision est dépassée. Choisissez un contenu dans la liste : sa décision et son aperçu s’affichent à côté."}, {"id": "poste-relecture-decision", "ecran": "Relecture", "titre": "Publier ou refuser", "texte": "Une proposition se marque d’abord comme relue, puis se publie avec une date de validation et une prochaine révision, proposée un an plus tard. Un contenu à revoir se revalide de la même façon. Un refus exige un motif : l’auteur le lira pour corriger sa proposition.", "etapes": ["Cliquez sur « Marquer comme relu ».", "Vérifiez les dates de validation et de révision.", "Cliquez sur « Publier », ou sur « Revalider ».", "Pour refuser : saisissez le motif puis « Refuser »."]}, {"id": "poste-referentiels", "ecran": "Référentiels", "titre": "Référentiel prescriptible", "texte": "Cette page liste ce que l’infirmier peut prescrire, par catégorie, avec la recherche « Chercher un libellé ». Une entrée est soit « Prescriptible », soit « Renouvellement seulement ». Ce référentiel est encore de démonstration : sa source, sa vérification au Journal officiel et sa mise à jour sont indiquées à droite."}, {"id": "poste-referentiels-autres", "ecran": "Référentiels · selon vos droits", "titre": "Entrées « autre » remontées", "texte": "Ce panneau liste ce que le cabinet a prescrit ou coché hors liste, avec le nombre de fois et la fiche d’origine. Il sert au responsable du référentiel à préparer la prochaine version."}, {"id": "poste-referentiels-nursing", "ecran": "Référentiels · pour : infirmier", "titre": "Lignes libres répétées (Nursing)", "texte": "Ce panneau liste les soins écrits en texte libre au moins deux fois pour un même patient. Ce sont des candidats pour enrichir la liste de référence des soins de nursing."}, {"id": "poste-referentiels-publies", "ecran": "Référentiels", "titre": "Référentiels tenus par TABSANTE", "texte": "Ce panneau montre chaque référentiel en vigueur, ses versions à venir et, avec « Historique », les versions passées. Le champ « Valables le » affiche les versions en vigueur à une autre date. Le cabinet les lit sans les modifier."}, {"id": "poste-parametres", "ecran": "Paramètres", "titre": "Paramètres", "texte": "Les onglets donnent accès au cabinet, à l’équipe et aux sessions, puis, selon vos droits, aux terminaux, au journal des accès, à la reprise de dossiers et aux simulations. L’onglet Cabinet montre les intervenants, le nom du cabinet, son mode d’exercice et vos profils. Le bouton « Se déconnecter » ferme votre session."}, {"id": "poste-parametres-tournees", "ecran": "Paramètres", "titre": "Tournées du cabinet", "texte": "Le rayon de la zone d’intervention entoure le point de départ des tournées : les domiciles au-delà sont signalés. Le tableau donne pour chaque soin une durée provisoire, une durée observée et une suggestion, et la durée type du cabinet. L’estimation d’une tournée retient d’abord les passages tracés, puis la durée type, enfin la valeur provisoire. Seuls ceux qui attribuent les tournées les modifient.", "etapes": ["Saisissez le rayon en kilomètres, puis « Enregistrer ».", "Saisissez une durée type par soin, puis « Enregistrer les durées ».", "Ou cliquez sur « Reprendre les suggestions » pour les soins sans durée type."]}, {"id": "poste-parametres-prerequis", "ecran": "Paramètres", "titre": "Prérequis de passage", "texte": "Ce tableau dit, pour chaque soin, ce que le patient prépare avant un soin (être à jeun, préparer son traitement…) et s’il faut le confirmer la veille ou le matin. « Ajouter… » ajoute un prérequis ; « Revenir au référentiel » annule un réglage du cabinet. Seuls ceux qui attribuent les tournées les modifient."}, {"id": "poste-parametres-equipe", "ecran": "Équipe et habilitations", "titre": "Équipe et habilitations", "texte": "Choisissez un intervenant dans la liste de droite : ses habilitations, ses identifiants professionnels et ses formations s’affichent à gauche. Plus bas, la matrice des droits montre ce que chaque profil peut faire, vos profils surlignés."}, {"id": "poste-parametres-ajouter-intervenant", "ecran": "Équipe et habilitations · selon vos droits", "titre": "Ajouter un intervenant", "texte": "Ses droits découlent de son rôle et de ses habilitations. Un infirmier remplaçant naît avec une habilitation bornée : sa date de fin est obligatoire.", "etapes": ["Cliquez sur « Ajouter un intervenant ».", "Saisissez le prénom, le nom et le rôle.", "Pour un remplaçant, cochez la case puis réglez la période, les tournées et les patients.", "Cliquez sur « Ajouter l’intervenant »."]}, {"id": "poste-parametres-habilitations", "ecran": "Équipe et habilitations · selon vos droits", "titre": "Habilitations", "texte": "« Accorder » attribue l’habilitation d’administrateur du cabinet, d’IDE responsable ou de remplaçant. Un remplacement est borné par une date de fin ; sans tournée ni patient coché, il vaut pour tout le cabinet. « Révoquer » coupe les droits aussitôt ; le motif est obligatoire et gardé au journal.", "etapes": ["Cliquez sur « Accorder » et choisissez l’habilitation.", "Réglez le début et, si besoin, la fin et la portée.", "Cliquez sur « Accorder l’habilitation »."]}, {"id": "poste-parametres-identifiants", "ecran": "Équipe et habilitations", "titre": "Identifiants professionnels", "texte": "Le RPPS (11 chiffres) et le numéro de carte CPS figurent en tête des prescriptions infirmières. Le téléphone professionnel sert à appeler un intervenant dont le terminal ne se synchronise plus pendant une tournée. Chacun renseigne les siens ; l’administration du cabinet peut renseigner le RPPS et le téléphone des autres."}, {"id": "poste-parametres-formations", "ecran": "Équipe et habilitations", "titre": "Formations", "texte": "Ce panneau liste les formations de l’intervenant, avec leur validité. Certains soins en exigent une : l’attribution le signale, sans bloquer. L’administration du cabinet les enregistre depuis le catalogue."}, {"id": "poste-parametres-matrice", "ecran": "Équipe et habilitations", "titre": "Matrice des droits", "texte": "Ce tableau montre les droits que le serveur applique, action par action et profil par profil : L lecture, E écriture, S signature, V validation, A administration. Ces valeurs restent une proposition à valider par le cabinet. Vos profils sont surlignés."}, {"id": "poste-parametres-sessions", "ecran": "Sessions", "titre": "Sessions ouvertes", "texte": "Ce tableau liste les sessions ouvertes, regroupées par terminal ; « Ce poste » et « Votre session » repèrent la vôtre. L’administration du cabinet voit toutes les sessions, les autres intervenants les leurs. Révoquer une session coupe aussitôt ses jetons ; révoquer la vôtre vous déconnecte."}, {"id": "poste-parametres-terminal-perdu", "ecran": "Sessions", "titre": "Révoquer un terminal perdu", "texte": "Pour un terminal perdu ou volé, cette action fait tomber toutes ses sessions, jetons d’accès compris. Elle est tracée au journal.", "etapes": ["Cliquez sur « Révoquer un terminal perdu », ou sur « Révoquer ce terminal » dans le tableau.", "Choisissez ou saisissez le nom du terminal.", "Cliquez sur « Révoquer le terminal »."]}, {"id": "poste-parametres-terminaux", "ecran": "Terminaux · selon vos droits", "titre": "Terminaux du cabinet", "texte": "Ce tableau liste les terminaux enrôlés, en attente d’enrôlement ou révoqués, avec leur dernière connexion et leur dernière synchronisation. Un code émis par erreur s’annule avant d’avoir servi (« Annuler le code »). Révoquer un terminal coupe toutes ses sessions ; il ne resservira qu’après un nouvel enrôlement."}, {"id": "poste-parametres-enroler", "ecran": "Terminaux · selon vos droits", "titre": "Enrôler un terminal", "texte": "Un terminal s’enrôle avec un code à usage unique, valable quelques minutes. Si le code expire, émettez-en un nouveau.", "etapes": ["Saisissez le nom du terminal, par exemple « Tablette de Claire ».", "Cliquez sur « Émettre un code ».", "Saisissez ce code sur l’écran d’enrôlement du terminal avant son expiration."]}, {"id": "poste-parametres-journal-acces", "ecran": "Journal des accès · selon vos droits", "titre": "Journal des accès", "texte": "Le journal dit qui a lu quel dossier, quand et depuis quelle adresse, et signale les accès refusés. Toute lecture est tracée, y compris celle de ce journal. Seules les lignes les plus récentes s’affichent : resserrez le filtre pour remonter plus loin.", "etapes": ["Choisissez un patient, un intervenant ou une période.", "Cliquez sur « Filtrer ».", "Cliquez sur « Exporter (CSV) » pour télécharger les lignes filtrées."]}, {"id": "poste-parametres-simulation", "ecran": "Simulations", "titre": "Services simulés", "texte": "Cette page liste chaque service remplacé par une simulation, avec son comportement. L’administration du cabinet peut simuler une panne avec « Comportement » ou ajuster une règle provisoire ; chaque changement vaut dès l’appel suivant et se trace au journal. « Tout remettre à la normale » rétablit les comportements normaux."}, {"id": "poste-parametres-cartes-demo", "ecran": "Simulations", "titre": "Cartes CPS de démonstration", "texte": "Ce panneau liste les cartes fictives des infirmiers du cabinet et leur code porteur de démonstration. Trois codes faux bloquent la carte jusqu’à la remise à la normale. L’aide-soignante n’a pas de carte : elle signe avec sa session. Les infirmiers voient aussi les cartes Vitale de démonstration et l’état des postes de travail."}, {"id": "poste-parametres-reprise", "ecran": "Reprise de dossiers · selon vos droits", "titre": "Reprendre des dossiers d’un autre logiciel", "texte": "Cette page reprend un fichier exporté d’un autre logiciel : fichier complet (JSON), identités seules (CSV) ou export Carea. L’aperçu à blanc ne crée rien ; il signale chaque erreur et chaque ressemblance avec un patient du cabinet. Rejouée, la reprise ne recrée aucun dossier, et tout est tracé au journal.", "etapes": ["Déposez le fichier, ou collez son contenu, et vérifiez le format.", "Cliquez sur « Aperçu à blanc ».", "Corrigez le fichier si des lignes sont « À corriger ».", "Cliquez sur « Reprendre »."]}, {"id": "poste-parametres-banc-cotation", "ecran": "Banc de cotation · pour : infirmier", "titre": "Banc de cotation", "texte": "Le banc rejoue des cas décrits (un passage et la facture attendue) contre le moteur de démonstration : il éprouve les règles, il ne facture rien. Le rapport compte les conformes, les écarts, les bloqués et les divergences documentées. Un écart signale une règle du moteur à revoir. Le filtre isole les cas qui ne sont pas conformes."}]}]}, {"id": "aide-terminal-acces", "titre": "Terminal : connexion et sécurité", "resume": "Enrôlement, profil, code de verrouillage, session.", "mots_cles": ["aide", "terminal"], "blocs": [{"type": "aides", "items": [{"id": "terminal-acces-ferme", "ecran": "Accès fermé", "titre": "L'accès est fermé", "texte": "Votre remplacement est terminé ou votre habilitation a été révoquée : le serveur a fermé l'accès de ce téléphone. La tournée, les patients et les soins ne s'affichent plus. Ce qui attend l'envoi part encore : le serveur juge chaque envoi à la date du geste.", "etapes": ["Touchez « Envoyer maintenant » s'il reste des envois.", "Touchez « Voir les envois » pour les relire.", "Touchez « Vérifier à nouveau mon habilitation » si le cabinet a rétabli votre accès.", "Une fois les envois partis, touchez « Changer d'intervenant » pour laisser le téléphone."]}, {"id": "terminal-code", "ecran": "Choisissez votre code", "titre": "Votre code personnel", "texte": "À votre première connexion sur ce téléphone, vous choisissez un code de 6 chiffres, à garder pour vous. Il ferme TabSanté dès que le téléphone passe en arrière-plan ou reste cinq minutes sans être touché. Un même chiffre répété ou une suite se devine : ils sont refusés.", "etapes": ["Tapez votre code, puis tapez-le une seconde fois.", "Choisissez « Utiliser l'empreinte » sur un téléphone qui n'est qu'à vous, sinon « Code seulement ».", "Si le prénom affiché n'est pas le vôtre, touchez « Je ne suis pas » en bas de l'écran."]}, {"id": "terminal-verrou", "ecran": "Saisissez votre code", "titre": "Déverrouiller TabSanté", "texte": "TabSanté s'est fermé derrière votre code : l'écran reprend tel que vous l'avez laissé, saisie en cours comprise. Le verrou ne tombe jamais pendant une signature maintenue, et les envois partent même verrouillé. Après cinq erreurs, une attente est imposée avant un nouvel essai.", "etapes": ["Tapez votre code de 6 chiffres sur le pavé.", "Ou touchez l'empreinte, en bas à gauche du pavé, si vous l'avez activée.", "Code oublié : touchez « Code oublié ? » ; il faudra un code d'enrôlement du poste fixe, votre reconnexion et le réseau."]}, {"id": "terminal-profil", "ecran": "Qui êtes-vous ?", "titre": "Choisir qui travaille", "texte": "Cet écran désigne qui travaille sur ce téléphone et signera les soins. La première connexion a besoin du réseau pour charger la tournée. Tant que des envois attendent, le téléphone ne change pas d'intervenant.", "etapes": ["Touchez « Se connecter avec ma carte CPS ».", "Ou touchez votre nom dans la liste.", "Choisissez ensuite votre code personnel."]}, {"id": "terminal-enrolement", "ecran": "Enrôler ce téléphone", "titre": "Enrôler ce téléphone", "texte": "Avant toute connexion, le téléphone est enrôlé une seule fois dans le cabinet, avec un code donné par le poste fixe. Il reçoit un secret qui ne quitte pas son coffre-fort. Téléphone perdu : le cabinet le révoque depuis le poste fixe. L'enrôlement a besoin du réseau.", "etapes": ["Au poste fixe : Terminaux, puis « Émettre un code ».", "Saisissez ses 10 caractères dans les 10 minutes.", "Touchez « Enrôler ce téléphone ».", "Code refusé : il est faux, a expiré ou a déjà servi ; demandez-en un nouveau."]}, {"id": "terminal-session-perdue", "ecran": "Session perdue", "titre": "La session est perdue", "texte": "La session de ce téléphone ne se rétablit pas seule. Session expirée ou code oublié : la même personne se reconnecte, et ses envois attendent, chiffrés. Téléphone révoqué par le cabinet : les données sont effacées, sauf les envois signés pas encore partis.", "etapes": ["Touchez « Me reconnecter » ; ce qui attend partira sous votre nom seulement.", "Après un code oublié, touchez « Saisir le code du poste fixe ».", "Téléphone révoqué : touchez « Envoyer d'abord » pour transmettre ce qui reste, avec le réseau.", "N'utilisez « Effacer sans envoyer » qu'en connaissance de cause : c'est définitif."]}]}]}, {"id": "aide-terminal-tournee", "titre": "Terminal : tournée, passage et liaisons", "resume": "Tournée, carte, patients, passage, reçu, liaisons, envois, planning, Moi.", "mots_cles": ["aide", "terminal"], "blocs": [{"type": "aides", "items": [{"id": "terminal-tournee", "ecran": "Tournée", "titre": "La tournée du jour", "texte": "Cet écran ouvre la journée : l'avancement des soins signés, le prochain passage en grand, puis les passages qui suivent. Il se lit hors connexion, d'après la tournée chargée sur le téléphone. L'action du prochain passage est en bas, sous le pouce. Votre avatar, en haut à droite, ouvre « Moi ».", "etapes": ["Lisez la carte du prochain passage : le patient, ce qui a changé, les soins à faire.", "Touchez « Y aller » pour partir, puis « Commencer le passage » une fois sur place.", "Touchez un patient de « Ensuite » pour ouvrir sa fiche.", "Touchez la pastille réseau pour voir vos envois."]}, {"id": "terminal-prochain-passage", "ecran": "Tournée", "titre": "Le prochain passage", "texte": "La carte encadrée présente le prochain patient : son âge, le moment du passage, les soins à faire et, s'il y a un itinéraire, l'heure d'arrivée estimée. Les pastilles ambrées disent ce qui a changé ou demande l'attention, deux au plus, les autres comptées à côté. Une saisie commencée passe devant : la carte devient « Passage en cours ».", "etapes": ["Lisez les pastilles avant de partir : prescription modifiée, rappel, prérequis à confirmer.", "Touchez « Avant d'arriver », quand il est proposé, pour l'accès au domicile, le trajet et le matériel.", "Si le passage ne peut pas se faire, touchez « Non réalisé… » au-dessus de la carte.", "Touchez « Reprendre le passage » pour finir une saisie commencée."]}, {"id": "terminal-suggestions", "ecran": "Tournée", "titre": "Les suggestions", "texte": "Les suggestions arrivent avec la tournée chargée et se lisent hors connexion. Chacune dit sa gravité en mot : « Important », « À regarder » ou « Pour information ». Les importantes s'affichent toujours, les autres sur demande. Rien ne s'exécute d'ici ; écarter une suggestion se fait au poste fixe.", "etapes": ["Touchez « Pourquoi ? » pour voir la source, la règle et les données lues.", "Touchez « Faire », quand il est proposé : l'itinéraire s'ouvre.", "Touchez « Afficher », sous les cartes, pour voir les autres suggestions."]}, {"id": "terminal-patients", "ecran": "Patients", "titre": "Les patients du téléphone", "texte": "La liste montre les patients chargés sur ce téléphone, avec leur âge et, s'il y a lieu, leurs plaies actives et leur contexte. La recherche fouille aussi les transmissions, les ordonnances et les tournées, sans tenir compte des accents, même hors connexion. Le reste du cabinet se consulte au poste fixe.", "etapes": ["Tapez un nom, ou un mot d'une transmission ou d'une ordonnance.", "Touchez un patient pour ouvrir sa fiche.", "Touchez une transmission trouvée pour la lire."]}, {"id": "terminal-moi", "ecran": "Moi", "titre": "Votre profil et ce téléphone", "texte": "« Moi » rassemble votre profil et les réglages de ce téléphone. Vous y rechargez la tournée du jour, réglez la navigation, les notifications et l'affichage, proposez un échange, ouvrez le planning et l'aide, et changez d'intervenant. Il s'ouvre par votre avatar, en haut de la tournée.", "etapes": ["Touchez « Recharger la tournée du jour » après un changement au cabinet ; il faut le réseau.", "Choisissez « Automatique », « Jour » ou « Nuit » dans « Affichage ».", "Touchez « Préparer demain, absences, indicateurs » pour le planning.", "Touchez « Changer d'intervenant » une fois tous les envois partis et les saisies signées."]}, {"id": "terminal-aide", "ecran": "Aide", "titre": "L'aide du terminal", "texte": "L'écran Aide s'ouvre depuis « Moi » et liste toutes les aides du terminal ; la recherche les filtre par mot. Sur chaque écran, le bouton « ? » de l'en-tête ouvre l'aide de cet écran. « Revoir les astuces » fait réapparaître les bulles de première utilisation sur ce téléphone, pour l'intervenant connecté.", "etapes": ["Tapez un mot dans la recherche pour retrouver une aide.", "Touchez une aide pour la lire.", "Touchez « Revoir les astuces » pour revoir les bulles."]}, {"id": "terminal-liaisons", "ecran": "Liaisons", "titre": "Transmissions et notifications", "texte": "Liaisons regroupe les transmissions et les notifications du cabinet. Elles se chargent avec la tournée et restent lisibles hors connexion ; une lecture faite hors ligne part au retour du réseau. Le chiffre sur l'onglet compte ce qui reste à lire.", "etapes": ["Basculez entre « Transmissions » et « Notifications » en haut de l'écran.", "Touchez une transmission pour la lire : elle est marquée lue.", "Touchez une notification nouvelle pour la marquer vue, ou « Tout marquer comme vu ».", "Touchez « Écrire » pour rédiger une transmission."]}, {"id": "terminal-transmission", "ecran": "Transmission", "titre": "Lire une transmission", "texte": "La transmission montre son auteur, l'heure, le patient et son contenu : cible, données, actions et résultat, ou un message pour l'intra-cabinet. L'ouvrir la marque lue. Un bandeau « Interpellation » signale qu'une réponse d'infirmière est attendue.", "etapes": ["Lisez le bandeau « Interpellation » quand il est affiché.", "Touchez « Écrire une transmission ciblée » pour écrire à propos du même patient."]}, {"id": "terminal-nouvelle-transmission", "ecran": "Écrire une transmission", "titre": "Écrire une transmission", "texte": "« Ciblée » concerne un patient : une cible, puis au moins une des données, actions ou résultat. « Intra-cabinet » porte une information d'organisation à un soignant, à une tournée ou à tout le cabinet, hors du dossier de soins. Écrite hors connexion, elle part au retour du réseau.", "etapes": ["Choisissez « Ciblée » ou « Intra-cabinet ».", "Remplissez les champs ; tapez @ pour mentionner un membre du cabinet, il sera notifié.", "Si une réponse est attendue, activez « Interpeller le cabinet » ou « Demander l'avis d'une infirmière ».", "Touchez « Envoyer la transmission »."]}, {"id": "terminal-proposition", "ecran": "Transmission proposée · infirmier seulement", "titre": "La transmission proposée", "texte": "Après un événement critique, une transmission ciblée vous est proposée, préremplie d'après ce que vous avez déclaré. Relisez-la et complétez les actions et le résultat : confirmée, elle est émise à votre nom. Rien n'entre au dossier tant que vous ne l'avez pas confirmée.", "etapes": ["Ouvrez-la depuis « Transmission proposée » sur la fiche du patient, ou par « La relire maintenant ».", "Vérifiez la cible et les données, puis complétez actions et résultat.", "Touchez « Confirmer et émettre ».", "Si elle n'a pas lieu d'être, touchez « Écarter la proposition… » et donnez un motif."]}, {"id": "terminal-file-envoi", "ecran": "Envois", "titre": "Vos envois", "texte": "Ce que vous signez ou déclarez est d'abord enregistré, chiffré, sur ce téléphone, puis part tout seul au cabinet dès que le réseau le permet. Cet écran dit où en sont ces envois : ceux à corriger d'abord, puis ceux en attente, patient par patient. Rien n'est perdu tant qu'un envoi reste ici.", "etapes": ["Lisez la phrase d'état en haut : « Tout est transmis », « en attente » ou « à corriger ».", "Touchez « Réessayer maintenant » si vous venez de retrouver du réseau.", "Traitez en premier la section « À corriger »."]}, {"id": "terminal-a-corriger", "ecran": "Envois", "titre": "Un envoi à corriger", "texte": "Un envoi refusé par le serveur n'a rien transmis : il reste sur le téléphone, avec le motif du refus en clair. Selon le cas, vous le corrigez et le renvoyez, ou vous l'abandonnez avant de le refaire. Un abandon est toujours confirmé et dit ce qu'il emporte.", "etapes": ["Lisez le motif sous le nom du patient.", "Touchez « Corriger et renvoyer » : la saisie s'ouvre telle qu'elle était, à signer de nouveau.", "Sinon touchez le lien « Abandonner » de la carte, puis confirmez, ou choisissez « Garder pour corriger ».", "Une photo refusée pour de bon se retire par « Retirer cette photo »."]}, {"id": "terminal-ruban-envoi", "ecran": "Envois", "titre": "Le ruban d'envoi", "texte": "Le ruban suit un passage signé en trois étapes. « Sur l'appareil » : il est enregistré, chiffré, sur le téléphone. « En attente » : son envoi est en cours, ou attend le réseau. « Transmis » : le cabinet l'a reçu. Refusé, il passe « À corriger » et se traite dans « Envois »."}, {"id": "terminal-hors-connexion", "ecran": "Hors connexion", "titre": "Travailler sans réseau", "texte": "Sans réseau, la tournée, les patients, les transmissions et la recherche restent utilisables, tels que le téléphone les a chargés. Ce que vous signez ou déclarez attend sur le téléphone et part tout seul au retour du réseau. La pastille en haut de la tournée dit l'état : « En ligne », « Hors ligne », ou le nombre d'envois en attente ou à corriger.", "etapes": ["Touchez la pastille réseau pour ouvrir « Envois ».", "Rechargez la tournée en ligne avant de partir.", "Prévoyez du réseau pour la première connexion, l'enrôlement, le planning et la photo de l'entrée."]}, {"id": "terminal-carte", "ecran": "Itinéraire", "titre": "L'itinéraire et la carte", "texte": "La carte montre la tournée du moment : la maison marque le départ, les domiciles sont numérotés dans l'ordre de passage. Dessous viennent la distance, le temps de trajet et de soins, l'heure de fin, puis les arrêts avec leur heure estimée et la météo. Hors connexion, le même tracé s'affiche sur un schéma, avec la dernière prévision chargée.", "etapes": ["Ouvrez-la en touchant la carte « Itinéraire » de la tournée.", "Choisissez le moment en haut quand la journée en compte plusieurs.", "Touchez un arrêt ou son numéro sur la carte : « Y aller », « Prévenir le patient », « Ouvrir la fiche du patient »."]}, {"id": "terminal-avant-arriver", "ecran": "Avant d'arriver", "titre": "Avant d'arriver", "texte": "Avant d'entrer chez le patient : les alertes du dossier, les prérequis à vérifier, l'accès au domicile, le trajet, le matériel à emporter et le dernier passage. Tout se lit hors connexion, tel que le cabinet l'a noté.", "etapes": ["Pour un prérequis, touchez « Confirmer », « Non tenu » ou « Patient prévenu » ; cela marche hors connexion.", "Touchez de nouveau l'état choisi pour le remettre à confirmer.", "En ligne, touchez « Photographier l'entrée » pour aider vos collègues."]}, {"id": "terminal-prevenir", "ecran": "Prévenir du retard", "titre": "Prévenir le patient", "texte": "« Prévenir le patient » prépare un SMS neutre qui annonce votre retard. Il part depuis la messagerie du téléphone, par vous : aucun service tiers, aucune donnée de santé. Les numéros viennent du dossier du patient.", "etapes": ["Touchez « Prévenir le patient » sur la carte du prochain passage ou sur l'arrêt en retard.", "Touchez le téléphone pour appeler, ou la bulle pour envoyer le SMS prérempli.", "Sans numéro au dossier, demandez au cabinet de l'ajouter au poste fixe."]}, {"id": "terminal-planning", "ecran": "Planning", "titre": "Le planning", "texte": "Le planning rassemble la préparation de la tournée de demain, vos absences et vos indicateurs des 14 derniers jours. Il se lit et se règle en ligne seulement ; hors connexion, la tournée du jour reste utilisable.", "etapes": ["Ouvrez-le depuis « Moi », ligne « Préparer demain, absences, indicateurs ».", "Touchez une tournée de demain pour préparer son ordre.", "Touchez « Déclarer une absence » sous vos absences."]}, {"id": "terminal-preparation", "ecran": "Préparer demain", "titre": "Préparer la tournée de demain", "texte": "L'écran compare l'ordre proposé par le calcul à l'ordre actuel : heure de fin et durée de chacun. Les heures fixes sont tenues, les heures prescrites respectées. La validation revient à qui tient la tournée à ce moment, ou à qui organise les tournées.", "etapes": ["Comparez les deux ordres en haut.", "Touchez un patient pour poser ou retirer une heure fixe, ce jour seulement ou aussi les suivants.", "Touchez « Valider l'ordre proposé » ou « Garder l'ordre actuel », ou « Valider cette tournée » si rien ne change."]}, {"id": "terminal-absence", "ecran": "Déclarer une absence", "titre": "Déclarer une absence", "texte": "Déclarez ici un congé, une maladie ou une formation, une seule fois ou chaque semaine, pour la journée entière ou certains moments. Le motif ne se lit que par vous et par qui organise les tournées. Il faut le réseau pour l'envoyer.", "etapes": ["Choisissez le motif.", "Réglez « Du » et « Au », ou activez « Chaque semaine » et cochez les jours.", "Choisissez des moments, ou aucun pour toute la journée.", "Touchez « Déclarer l'absence »."]}, {"id": "terminal-echange", "ecran": "Échange de tournée", "titre": "Échanger une tournée", "texte": "Un échange cède une de vos tournées à un collègue du même rôle, avec ou sans contrepartie. Le collègue l'accepte ou le refuse sur son téléphone. Proposition et réponse se font hors connexion : elles partent en premier au retour du réseau.", "etapes": ["Pour proposer : « Moi », puis « Proposer un échange de tournée ».", "Choisissez la période, ce que vous cédez, à qui, et ce que vous reprenez ou « Rien (cession simple) ».", "Touchez « Proposer l'échange ».", "Pour répondre : touchez l'échange sur la tournée, puis « Accepter » ou « Refuser… »."]}, {"id": "terminal-non-realise", "ecran": "Soin non réalisé", "titre": "Un soin non réalisé", "texte": "Quand un passage n'a pas pu se faire, déclarez le soin non réalisé avec son motif : patient absent, refus, hospitalisation, soin reporté, empêchement. Le soin reste dans l'historique de la prescription avec son motif, qui part au cabinet. La déclaration se fait hors connexion.", "etapes": ["Touchez « Non réalisé… » au-dessus du prochain passage, ou maintenez le doigt sur un passage de « Ensuite ».", "Décochez les soins qui ont bien été faits.", "Choisissez le motif ; « Autre » demande une précision.", "Maintenez une seconde le bouton « Déclarer non réalisé »."]}, {"id": "terminal-notifications", "ecran": "Notifications", "titre": "Les notifications du téléphone", "texte": "Ce téléphone affiche ses notifications en bandeau, en haut de l'écran : rappels du jour, tournée validée, mention dans une transmission, retard. Pendant les heures calmes, de 21 h à 7 h par défaut, rien ne s'affiche ; ce qui est dû attend leur fin. Une notification ne dit jamais le nom du patient ni son soin.", "etapes": ["Ouvrez « Moi », puis « Notifications ».", "Activez ou coupez « Notifications de ce téléphone ».", "Réglez le début et la fin des heures calmes.", "Touchez la croix du bandeau pour le fermer ; sinon il se ferme seul après 8 secondes."]}, {"id": "terminal-rappel", "ecran": "Poser un rappel daté · infirmier seulement", "titre": "Poser un rappel daté", "texte": "Un rappel daté vous prévient d'un geste à faire un jour donné, sur un soin du patient. Le jour venu, il s'affiche sur la tournée et au passage ; le geste tracé ce jour-là le marque fait. Il se pose hors connexion.", "etapes": ["Ouvrez le menu « ⋮ » de la fiche du patient, puis « Poser un rappel daté ».", "Choisissez le soin visé.", "Touchez une proposition, ou écrivez ce qu'il faudra faire.", "Choisissez « Demain », « 3 jours », « 7 jours » ou « 14 jours », ou réglez les jours, puis touchez « Poser le rappel »."]}, {"id": "terminal-dossier-patient", "ecran": "Fiche du patient", "titre": "La fiche du patient", "texte": "La fiche du patient rassemble, pour ce moment, ses alertes, les soins de ce passage et son dossier, lisible hors connexion. Un appui sur un soin dû l'ouvre ; un soin marqué « Commencé » reprend là où vous l'aviez laissé. Le menu « ⋮ » regroupe les actions rares, comme l'événement critique ou la transmission.", "etapes": ["Lisez d'abord les alertes en tête de fiche.", "Touchez un soin de la liste pour l'ouvrir.", "Pour un soin non prévu, touchez « Ajouter un soin ».", "Pour un rappel sur un geste, touchez « Comment faire ? »."]}, {"id": "terminal-recu-au-cabinet", "ecran": "Fiche du patient", "titre": "Reçu au cabinet", "texte": "Par défaut, les soins sont faits au domicile. Activez « Reçu au cabinet » quand le patient est soigné au cabinet : chaque soin signé ensuite dans ce passage le déclare. Le réglage vaut pour ce patient, ce moment et ce jour.", "etapes": ["Activez « Reçu au cabinet » avant de signer les soins du passage."]}, {"id": "terminal-plan-de-soins", "ecran": "Plan de soins · infirmier seulement", "titre": "Le plan de soins", "texte": "Le plan de soins se lit hors connexion : chaque ordonnance, ses actes prescrits avec produit et posologie, et les fréquences qui les servent avec leur état. Les protocoles en vigueur suivent, avec leur version. C'est un écran de lecture seule : rien ne s'y modifie.", "etapes": ["Touchez « Plan de soins » dans la fiche du patient.", "S'il n'apparaît pas, rechargez la tournée en ligne : le plan arrive avec elle."]}, {"id": "terminal-ordonnance", "ecran": "Photo d'ordonnance · infirmier seulement", "titre": "Photographier l'ordonnance", "texte": "La photo de l'ordonnance part au cabinet, où la proposition de soins qu'on en lit se valide au poste fixe. Rien n'est créé sur ce téléphone. Hors connexion, la photo est gardée chiffrée et part au retour du réseau.", "etapes": ["Ouvrez le menu « ⋮ » et choisissez « Photographier l'ordonnance ».", "Posez l'ordonnance entière, à plat, bien éclairée, puis touchez « Photographier ».", "Vérifiez que le prescripteur, la date et chaque ligne se lisent ; sinon, touchez « Reprendre ».", "Laissez « Demander la lecture » activé pour obtenir une proposition de fréquences.", "Touchez « Envoyer au cabinet »."]}, {"id": "terminal-nouveau-patient", "ecran": "Nouveau patient · infirmier seulement", "titre": "Créer un patient", "texte": "« Nouveau patient » crée un dossier au domicile, en ligne comme hors connexion ; le patient apparaît tout de suite sur le téléphone. L'identité reste provisoire jusqu'à sa qualification INS. En ligne, le serveur signale un dossier ressemblant : rien n'est fusionné ici, le rapprochement se décide au poste fixe.", "etapes": ["Touchez « Lire la carte Vitale » pour pré-remplir l'identité, puis vérifiez-la avec le patient.", "Complétez nom de naissance, prénom, date de naissance et sexe.", "Répondez à « Allergies connues ? » : « Aucune connue » ou « Oui ».", "Ajoutez si possible le médecin traitant et la personne de confiance.", "Touchez « Créer le patient »."]}, {"id": "terminal-accord-prealable", "ecran": "Accord préalable · infirmier seulement", "titre": "L'accord préalable", "texte": "L'accord préalable se suit en deux temps : la demande envoyée, puis la réponse reçue. Tout part en file, hors connexion compris. Sans réponse enregistrée, l'accord reste en attente : aucun délai ne vaut accord.", "etapes": ["Ouvrez l'accord depuis « Accord préalable » sur la fiche du patient.", "Indiquez la date d'envoi et, si vous l'avez, la référence de la pièce, puis touchez « Enregistrer la demande ».", "À réception, choisissez « Accordé » ou « Refusé » et la date, puis touchez « Enregistrer la réponse »."]}, {"id": "terminal-depistage", "ecran": "Dépistage du cancer colorectal · infirmier seulement", "titre": "Le dépistage colorectal", "texte": "Le dépistage se note en deux temps : le kit remis au patient, puis le test réalisé sur ce même kit. Chaque date est versée au dossier du patient, hors connexion compris.", "etapes": ["Dans « Pathologies et dépistage », touchez « Kit remis… » ou « Test réalisé… ».", "Choisissez la date ; elle ne peut pas être dans le futur.", "Touchez « Noter le kit remis » ou « Noter le test réalisé »."]}, {"id": "terminal-sega", "ecran": "Score SEGA · infirmier seulement", "titre": "Le score SEGA", "texte": "Le score SEGA mesure la fragilité du patient ; il est daté et versé à son dossier, hors connexion compris. Une nouvelle évaluation remplace la précédente, dont le dernier score s'affiche en tête.", "etapes": ["Ouvrez le menu « ⋮ » et choisissez « Score SEGA (fragilité) ».", "Saisissez le score, un nombre entier de 0 à 100.", "Réglez « Évalué le » si l'évaluation date d'un autre jour.", "Touchez « Enregistrer le score »."]}, {"id": "terminal-ajout-soin", "ecran": "Ajouter un soin", "titre": "Ajouter un soin", "texte": "« Ajouter un soin » trace un soin qui n'était pas prévu à ce passage. Les soins prescrits au patient s'affichent en tête, puis les autres par famille. Un soin qui n'est pas dû à ce moment s'ouvre en passage imprévu ou non programmé.", "etapes": ["Tapez quelques lettres dans « Rechercher un soin », ou parcourez la liste.", "Touchez le soin : sa fiche s'ouvre.", "Si le terminal n'a pas encore de fiche pour ce soin, tracez-le au cabinet."]}, {"id": "terminal-evenement", "ecran": "Événement critique", "titre": "Déclarer un événement critique", "texte": "L'événement critique se déclare après coup, une fois le patient en sécurité, depuis le menu « ⋮ » du passage ou de la fiche du patient. Aucune confirmation préalable : il est tracé tel que vous le décrivez et part au cabinet avec le prochain envoi. Une transmission ciblée vous est ensuite proposée, tout de suite ou « Plus tard ».", "etapes": ["Choisissez « Déclarer un événement critique » dans le menu « ⋮ ».", "Réglez « Survenu » : « Maintenant », « 15 min », « 30 min », « 1 h », ou par pas de cinq minutes.", "Choisissez la nature et le devenir du patient ; pour « Autre », précisez.", "Ajoutez si besoin les gestes réalisés, les appels et un commentaire.", "Touchez « Enregistrer l'événement »."]}, {"id": "terminal-signalement", "ecran": "Signalement à décider · infirmier seulement", "titre": "Décider d'un signalement", "texte": "Le constat signalé par l'aide-soignante attend votre décision, sur la fiche du patient et dans la tournée. Vous choisissez « Surveillance renforcée », « Ouvrir une plaie » ou « Sans suite » ; la décision est tracée et ne se réécrit pas. Elle part avec les autres envois.", "etapes": ["Touchez le signalement sous « Signalement à décider ».", "Lisez le constat, puis choisissez votre décision.", "Pour « Ouvrir une plaie », rattachez une plaie ouverte ou touchez « Ouvrir une plaie ».", "Ajoutez si besoin une consigne pour l'équipe.", "Maintenez « Enregistrer la décision » une seconde."]}, {"id": "terminal-savoir-faire", "ecran": "Comment faire ?", "titre": "Comment faire ?", "texte": "« Comment faire ? » ouvre le savoir-faire publié pour le soin : l'essentiel d'abord, puis gestes pas à pas, vidéos, questions fréquentes et documents officiels. Le contenu est gardé sur le téléphone et reste lisible hors connexion ; sa date s'affiche en tête. Les vidéos s'ouvrent sur YouTube et demandent le réseau.", "etapes": ["Touchez « Comment faire ? » sous l'en-tête du soin.", "Touchez un geste pour voir ses étapes et ses points de vigilance.", "Pour une question, touchez « Poser une question », sans aucune donnée patient.", "Revenez par « Revenir au soin »."]}, {"id": "terminal-passage", "ecran": "Passage · infirmier seulement", "titre": "Le passage chez le patient", "texte": "Le passage d'une plaie tient sur un seul écran : ce qui est repris du dernier passage, les mesures, les trois réponses de sécurité, la photo facultative, puis la signature. Chaque appui est enregistré en brouillon sur ce téléphone ; l'en-tête affiche « Brouillon enregistré ». Rien n'est signé sans vous : la barre du bas dit ce qui manque, puis « Signer le passage » se maintient une seconde.", "etapes": ["Lisez les alertes du patient et le résumé de la plaie en tête.", "Vérifiez ce qui est repris du dernier passage ; touchez « Modifier » si quelque chose a changé.", "Répondez aux questions de « À confirmer à chaque passage ».", "Ajoutez une photo si besoin.", "Maintenez « Signer le passage » une seconde."]}, {"id": "terminal-mesures", "ecran": "Passage · infirmier seulement", "titre": "Les mesures de la plaie", "texte": "Si rien n'a changé depuis le dernier passage, activez « Inchangées depuis le … » : les mesures sont reprises telles quelles. Sinon, saisissez longueur, largeur et profondeur en centimètres, et le volume quand il est la grandeur de référence. Un écart de plus de 50 % avec le passage précédent se confirme d'un appui sur « Confirmer … », sans bloquer la mesure.", "etapes": ["Activez ou désactivez « Inchangées depuis le … ».", "Saisissez les mesures du jour au dixième de centimètre.", "Si vous saisissez un volume, choisissez la « Méthode du volume »."]}, {"id": "terminal-photo", "ecran": "Passage", "titre": "La photo du soin", "texte": "La photo est facultative et se prend dans l'application, jamais dans la galerie du téléphone. Avant l'appareil, l'écran « Cadrer la photo » montre la photo précédente pour garder le même cadrage. Quand une photo précédente existe, les deux s'affichent ensuite côte à côte pour comparer.", "etapes": ["Touchez « Ajouter une photo ».", "Tenez le téléphone parallèle à la peau, à 20 cm environ, avec le même cadrage que la dernière fois.", "Touchez « Ouvrir l'appareil photo », puis prenez la photo."]}, {"id": "terminal-il-manque", "ecran": "Fiche de soin", "titre": "La barre « Il manque »", "texte": "Tant qu'il manque une réponse, le bouton du bas reste inactif et la barre dit quoi : « Il manque : … ». Un appui sur cette mention amène au premier champ manquant, marqué « À renseigner ». Quand tout est rempli, la barre affiche « Tout est renseigné » et l'heure du soin.", "etapes": ["Touchez la mention « Il manque » pour aller au champ.", "Répondez, puis revenez à la barre.", "Signez quand elle affiche « Tout est renseigné »."]}, {"id": "terminal-signature", "ecran": "Fiche de soin", "titre": "Signer par appui maintenu", "texte": "La signature se donne par un appui maintenu : gardez le doigt sur le bouton une seconde, la barre se remplit de gauche à droite et une légère vibration confirme. Relâché trop tôt, rien n'est signé et le bouton affiche « Maintenez pour signer ». Votre signature horodate ce passage, qui ne pourra plus être modifié sur ce téléphone.", "etapes": ["Vérifiez que la barre affiche « Tout est renseigné ».", "Posez le doigt sur le bouton et gardez-le une seconde.", "Avec le lecteur d'écran ou les animations réduites, touchez une fois puis confirmez par « Signer »."]}, {"id": "terminal-mode-visite", "ecran": "Mode visite", "titre": "Le mode visite", "texte": "Le mode visite affiche en tête les étapes du soin, à cocher au fil du geste, avec la progression « 3 sur 6 ». Il s'active de lui-même pour un soin à plusieurs étapes et se règle dans le menu « ⋮ », par « Mode visite » ou « Quitter le mode visite ». Cocher une étape n'écrit rien dans la saisie et ne débloque pas la signature : seule la barre du bas dit ce qui manque.", "etapes": ["Faites le geste, puis touchez « Étape faite » : la suivante vient à l'écran.", "Touchez la flèche d'une étape pour aller à sa section.", "En fin de visite, écrivez la « Note de relève » et touchez « Verser à la relève »."]}, {"id": "terminal-recu", "ecran": "Reçu", "titre": "Le reçu de signature", "texte": "Après la signature, le reçu montre ce qui a été signé, par qui, à quelle heure, et où en est l'envoi. Le ruban passe de « Sur l'appareil » à « En attente », puis à « Transmis » quand le cabinet l'a reçu. Hors connexion, rien n'est perdu : l'envoi part tout seul au retour du réseau.", "etapes": ["Lisez l'état d'envoi sous le cadre de la signature.", "Touchez « Patient suivant » ou « Soin suivant » pour continuer la tournée.", "Sinon, touchez « Retour à la tournée ».", "Si le serveur refuse le passage, touchez « Corriger et renvoyer »."]}, {"id": "terminal-rectification", "ecran": "Corriger une valeur", "titre": "Corriger une valeur signée", "texte": "Une valeur signée par erreur se corrige depuis le reçu, par « Corriger une valeur ». Le soin signé reste tel quel, avec son empreinte : la correction s'y ajoute, datée, avec son motif. La valeur d'origine reste consultable.", "etapes": ["Touchez la valeur dans « Valeur à reprendre ».", "Saisissez la nouvelle valeur ; l'écran affiche l'avant et l'après.", "Écrivez le motif, obligatoire.", "Maintenez « Corriger » une seconde."]}, {"id": "terminal-cloture", "ecran": "Clôture de la plaie · infirmier seulement", "titre": "Clôturer une plaie", "texte": "La clôture demande un motif : cicatrisation, hospitalisation, décès, arrêt de prise en charge, ou autre avec précision. L'écran dit ce qui s'arrête et ce qui continue : soins prévus de cette plaie retirés, autres plaies poursuivies, historique, mesures et photos conservés. Une plaie clôturée ne se rouvre pas ; une récidive ouvrira un nouvel épisode, lié à celui-ci.", "etapes": ["Ouvrez le menu « ⋮ » et choisissez « Clôturer la plaie… ».", "Choisissez le motif ; pour « Autre », remplissez « Précision du motif ».", "Relisez « Ce qui s'arrête, ce qui continue ».", "Maintenez « Clôturer la plaie » une seconde, ou touchez « Annuler »."]}, {"id": "terminal-ouverture-plaie", "ecran": "Nouvelle plaie · infirmier seulement", "titre": "Ouvrir une plaie", "texte": "Une plaie s'ouvre depuis la fiche du patient, par « Ouvrir une nouvelle plaie », jamais au fil d'un passage. L'étape 1 place le point sur le schéma corporel et fixe localisation et type, figés après signature ; l'étape 2 donne les dimensions initiales, la suture, le protocole initial et la prescription d'origine. Une erreur de saisie se rectifie ensuite par « Rectifier l'ouverture… », jusqu'au deuxième passage signé.", "etapes": ["Choisissez la vue (Face, Dos, Région sacrée, Talons) et touchez la région atteinte.", "Vérifiez région, latéralité, localisation et type, puis touchez « Continuer ».", "Saisissez les dimensions initiales et choisissez la prescription d'origine.", "Touchez « Ouvrir la plaie et signer ».", "Pour une plaie qui revient, utilisez « Récidive… » dans « Plaies clôturées »."]}, {"id": "terminal-photos", "ecran": "Photos et comparaison · infirmier seulement", "titre": "Comparer les photos", "texte": "Cet écran montre la série photographique d'une plaie ou d'un dispositif, deux clichés côte à côte, l'avant à gauche et l'après à droite. Le premier et les trois derniers clichés de chaque série sont gardés sur le téléphone pour comparer hors connexion ; la série entière reste au dossier. Les photos se prennent pendant un passage, pas ici.", "etapes": ["Touchez « Photos et comparaison » sous la plaie ou le dispositif.", "Si plusieurs voies ont leur série, choisissez la « Voie photographiée ».", "Touchez un cliché du bandeau pour le placer à gauche (avant) ou à droite (après)."]}, {"id": "terminal-acte-distance", "ecran": "Acte à distance · infirmier seulement", "titre": "Un acte à distance", "texte": "L'acte à distance sur une plaie part avec une photo seule, choisie dans la série de la plaie : aucun lien vidéo, aucun flux conservé. Il peut s'agir d'un télésoin, d'une téléconsultation ou d'une téléexpertise ; le compte rendu se rédige ensuite au poste fixe.", "etapes": ["Dans le passage, ouvrez le menu « ⋮ » et choisissez « Acte à distance… ».", "Cochez au moins une photo de la plaie.", "Choisissez le type d'acte, puis indiquez le motif et, s'il est demandé, le médecin sollicité.", "Indiquez le consentement du patient, recueilli à l'oral ou par écrit.", "Maintenez « Enregistrer l'acte à distance » une seconde."]}, {"id": "terminal-fin-traitement", "ecran": "Fin de traitement · infirmier seulement", "titre": "Mettre fin à un traitement", "texte": "La fin de traitement arrête une distribution des médicaments ou un anticoagulant injectable, avec un motif obligatoire. L'écran dit ce qui s'arrête, les passages à venir retirés, et ce qui continue, les autres soins et l'historique conservé. Elle se confirme avec le serveur : hors connexion, reprenez-la une fois en ligne ou au cabinet.", "etapes": ["Dans la fiche du soin, touchez « Fin de traitement… ».", "Choisissez le motif ; ajoutez le commentaire de clôture quand il est demandé.", "Relisez « Ce qui s'arrête » et « Ce qui continue ».", "Touchez « Clore le traitement »."]}, {"id": "terminal-cotation", "ecran": "Cotation · infirmier seulement", "titre": "La cotation", "texte": "Sur le reçu, « Cotation provisoire » montre ce que le téléphone a retenu pour l'acte signé ; une fois l'acte reçu, le bloc devient « Cotation du serveur » ou « Cotation reconfirmée ». Si le serveur cote autrement, l'écart est dit ligne par ligne et arbitré au poste fixe, jamais corrigé en silence. Le moteur est de démonstration : rien n'est facturable tant qu'il sert."}, {"id": "terminal-facturation", "ecran": "Facturer au domicile · infirmier seulement", "titre": "Facturer avec la carte Vitale", "texte": "Cet écran prépare au domicile la feuille de soins électronique, en simulation : lecteur de cartes et SESAM-Vitale sont fictifs, aucune feuille réelle ne part. Les cartes se lisent sans réseau et ne quittent pas le téléphone. En ligne, la FSE des actes choisis se crée et se sécurise ; hors connexion, avec une connexion par votre carte CPS, elle se sécurise au domicile et part au retour du réseau.", "etapes": ["Ouvrez le menu « ⋮ » et choisissez « Facturer avec la carte Vitale ».", "Touchez « Lire la carte Vitale du patient », puis « Lire ma carte CPS ».", "En ligne, touchez « Voir les actes à facturer » et cochez les actes.", "Touchez « Créer et sécuriser la FSE », ou « Sécuriser la FSE au domicile » hors connexion."]}, {"id": "terminal-pose-dispositif", "ecran": "Poser un dispositif · infirmier seulement", "titre": "Ouvrir le suivi d'un dispositif", "texte": "Choisissez le type de dispositif, renseignez ses champs, puis la prescription d'origine, toujours exigée. Un cathéter posé en établissement se reprend en déclarant l'établissement et la date de pose. L'ouverture se signe d'un appui maintenu : nature, site et type ne se modifient plus ensuite.", "etapes": ["Touchez « Poser un dispositif » sur la fiche du patient.", "Choisissez le type et remplissez ses champs.", "Choisissez la prescription d'origine.", "Maintenez « Ouvrir et signer »."]}, {"id": "terminal-cloture-dispositif", "ecran": "Clôture d'un dispositif · infirmier seulement", "titre": "Clôturer un dispositif", "texte": "Choisissez le motif de clôture, et dites si le dispositif est retiré ou laissé en place quand l'écran le demande : clôturer n'est pas retirer. Une ligne encore branchée ou un réservoir encore posé se dépose d'abord par un passage. Un dispositif clôturé ne se rouvre pas : un retour ouvrira un nouvel épisode, lié à celui-ci.", "etapes": ["Ouvrez « Clôturer… » dans le menu du dispositif.", "Choisissez le motif de clôture.", "Répondez « Retiré » ou « Laissé en place ».", "Maintenez « Clôturer »."]}, {"id": "terminal-protocole-diabete", "ecran": "Protocole d'insuline · infirmier seulement", "titre": "Lire et transcrire le protocole", "texte": "Le protocole se lit hors connexion : version, source, bornes d'alerte, et pour chaque insuline sa dose fixe ou son échelle selon la glycémie. Une nouvelle version se transcrit en ligne, préremplie de la version en vigueur. Une insuline ne se supprime pas : elle s'arrête, datée et motivée.", "etapes": ["Touchez « Nouvelle version » ou « Transcrire le protocole ».", "Renseignez la source et la pièce justificative.", "Saisissez chaque insuline, ses moments et ses doses.", "Touchez « Enregistrer la version »."]}, {"id": "terminal-episode", "ecran": "Ouvrir un épisode de pompes · infirmier seulement", "titre": "Ouvrir un PSE ou une PCA", "texte": "Pour un PSE, seule l'intention du traitement est demandée : pompes, voies et seringues se posent au premier passage. Pour une PCA, décrivez la voie, la pompe d'antalgie et son protocole, et la pompe de sédation, ou « Non prescrite à ce jour ». L'ouverture est signée : l'intention et le protocole ne se modifient plus qu'en événement daté.", "etapes": ["Renseignez l'intention, ou la voie et les pompes.", "Complétez le protocole.", "Choisissez la prescription d'origine.", "Maintenez « Ouvrir et signer »."]}, {"id": "terminal-resultat", "ecran": "Résultat de biologie · infirmier seulement", "titre": "Saisir un résultat de biologie", "texte": "Saisissez ici un résultat revenu hors d'un passage : HbA1c, ferritinémie, anti-Xa, TCA, plaquettes ou INR. Le résultat part avec la file, hors connexion compris, et rejoint le dossier et la courbe de l'examen. Il ne se modifie plus : une erreur se corrige au cabinet par un nouveau résultat.", "etapes": ["Choisissez l'examen.", "Saisissez la valeur.", "Datez le prélèvement.", "Touchez « Enregistrer le résultat »."]}, {"id": "terminal-prescription", "ecran": "Prescription infirmière · infirmier seulement", "titre": "Rédiger une prescription infirmière", "texte": "L'en-tête et les destinataires viennent du cabinet ; vous choisissez les lignes dans le référentiel prescriptible, ou parmi les produits des soins en cours. Un renouvellement à l'identique cite l'ordonnance qu'il renouvelle. Les examens prescrits deviennent des lignes à prélever dans la fiche Prélèvement.", "etapes": ["Cherchez dans le référentiel, ou touchez une proposition.", "Précisez la quantité de chaque ligne.", "Maintenez « Signer la prescription »."]}, {"id": "terminal-bloc-site-injection", "ecran": "Bloc Site d'injection · infirmier seulement", "titre": "Rotation des sites", "texte": "Rien n'est présélectionné : le téléphone suggère un site, loin du dernier site et des sites déjà pris à ce passage, et vous choisissez. « Ces 7 derniers jours » liste les sites du patient, toutes fiches confondues : l'abdomen d'une insuline compte aussi pour un anticoagulant. Le schéma signale un site trop employé, sans jamais bloquer.", "etapes": ["Touchez « Suggéré : … » pour prendre la suggestion.", "Sinon, choisissez la région puis le côté du patient.", "Évitez une zone marquée en lipohypertrophie."]}, {"id": "terminal-bloc-glycemie", "ecran": "Bloc Protocole d'insuline · infirmier seulement", "titre": "La dose proposée", "texte": "La dose proposée suit la ligne d'échelle qui contient la glycémie, ou la dose fixe du moment. Hors échelle, aucune dose n'est proposée et la consigne hors protocole s'affiche. Une glycémie sous le seuil ou au-dessus est signalée, sans action automatique : le protocole ne décide rien à votre place.", "etapes": ["Saisissez la glycémie avant de lire la proposition.", "Répondez Oui ou Non à l'injection.", "Corrigez la dose si besoin et dites pourquoi.", "Sous le seuil, cochez « Resucrage donné » s'il a été donné."]}, {"id": "terminal-bloc-tubulure", "ecran": "Bloc Lignes de perfusion · infirmier seulement", "titre": "Brancher et débrancher une ligne", "texte": "« Brancher une ligne » reprend la dernière ligne : vérifiez le produit, le volume et le débit sur l'étiquette. « Brancher maintenant » horodate la pose ; « Enregistrer sans poser » garde la ligne prévue, à brancher plus tard dans le passage ou à motiver. « Débrancher » horodate la dépose d'une ligne en cours.", "etapes": ["Vérifiez la ligne reprise sur l'étiquette.", "Touchez « Brancher maintenant » au moment de la pose.", "Une ligne non posée garde son motif de non-pose."]}, {"id": "terminal-bloc-rincage", "ecran": "Bloc Rinçage · infirmier seulement", "titre": "Rinçage anormal", "texte": "En perfusion IV, un rinçage « Résistance » ou « Pas de reflux » avec une ligne branchée à ce passage affiche un avertissement ; en nutrition entérale, c'est « Résistance » ou « Obstruée ». Brancher reste votre décision clinique : pour signer, cochez « J'ai lu l'avertissement et je branche quand même », tracé avec le passage.", "etapes": ["Relisez le rinçage avant de brancher.", "Si vous branchez quand même, cochez l'avertissement lu."]}, {"id": "terminal-bloc-identite-prelevement", "ecran": "Bloc Identité et étiquetage · infirmier seulement", "titre": "Identité et étiquetage au lit", "texte": "Deux coches, horodatées à l'appui : « Identité déclinée par le patient », puis « Tubes étiquetés devant le patient ». Le contrôle d'identité se fait pendant le passage et avant l'étiquetage ; dans le mauvais ordre, « Il manque » le signale. Une identité INS non qualifiée est signalée, et la mention accompagne l'envoi au laboratoire.", "etapes": ["Faites décliner son identité au patient, puis cochez.", "Étiquetez les tubes devant lui, puis cochez."]}, {"id": "terminal-bloc-ecart-constante", "ecran": "Bloc Écart de constante", "titre": "Confirmer un écart", "texte": "Une constante qui s'écarte de plus de 50 % du relevé précédent affiche « Écart de plus de 50 % ». Vérifiez la mesure, puis touchez « Confirmer » suivi de la valeur : elle reste celle mesurée, et l'écart est noté avec le relevé. Si vous changez la valeur, la confirmation est demandée de nouveau.", "etapes": ["Reprenez la mesure.", "Corrigez la valeur, ou touchez « Confirmer »."]}]}]}, {"id": "aide-terminal-fiches", "titre": "Terminal : fiches de soin", "
