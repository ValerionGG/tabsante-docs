le=\"INJ-RG-06\")\n\nHTTP 422\n{\"detail\": \"Numéro de lot à renseigner\", \"regle\": \"INJ-RG-06\"}"}, {"type": "p", "texte": "« detail » est écrit pour l'utilisateur, sans code du cahier des charges ; « regle » porte l'identifiant de l'exigence pour l'audit. Un droit manquant rend 403 avec la ligne de matrice (HAB-xx). Un test refuse tout code du cahier dans ce que lit l'utilisateur."}, {"type": "table", "entetes": ["Code", "Sens habituel"], "lignes": [["401", "Session expirée, révoquée, terminal révoqué ou jeton rejoué (champ « code »)"], ["403", "Droit manquant ; hors portée d'un remplaçant"], ["404", "Hors cabinet ou hors portée ; route non montée en service"], ["409", "Conflit (identifiant déjà employé, occurrence déjà servie, version de brouillon) ; service non raccordé hors démonstration"], ["422", "Règle métier ou validation ; clé d'idempotence reprise pour une autre demande"], ["429", "Limitation de débit ; en-tête Retry-After: 60"], ["503", "Panne simulée d'un service (démonstration) ; OCR absent"]]}, {"type": "h", "texte": "Double envoi : la clé d'idempotence"}, {"type": "p", "texte": "Le poste fixe pose un en-tête « Idempotency-Key » par saisie. La même clé rejouée par la même session rend la réponse réussie gardée, sans rien écrire ; un second envoi simultané attend le premier ; la même clé pour une autre demande est refusée. Un refus n'est jamais retenu : la saisie corrigée repart avec la même clé. Les réponses sont gardées 24 heures (table « requete_idempotente »), purgées la nuit et jamais rendues à une session close."}, {"type": "h", "texte": "Limitation de débit"}, {"type": "p", "texte": "Au plus 10 appels par minute, par adresse et par route, sur les routes sensibles (rafraîchissement de session, enrôlement, portail externe, vérification et ancrage de l'audit, connexion par code, routes /dev et routes ouvertes de /simulation). Le compte est tenu en base (table « tentative_limitee ») : il vaut pour tous les processus et survit à un redémarrage."}, {"type": "h", "texte": "Événements en direct"}, {"type": "p", "texte": "« GET /evenements » ouvre un flux d'événements serveur, avec le jeton dans l'en-tête, jamais dans l'adresse. Il ne porte que des clés de changement ; la clé « cotations » ne part jamais à qui ne voit pas la cotation. Le flux relit sa session chaque minute et se ferme à la révocation."}]}, {"id": "tech-habilitations", "titre": "Habilitations, portée du remplaçant et administration", "resume": "La matrice HAB-01 à HAB-34 juge chaque droit côté serveur ; le remplaçant est borné à sa période, ses tournées et ses patients ; l'administrateur non soignant n'a pas le dossier clinique.", "mots_cles": ["habilitations", "HAB", "matrice", "droits", "remplaçant", "portée", "administrateur", "HAB-34", "aide-soignante"], "blocs": [{"type": "p", "texte": "« backend/app/habilitations.py » tient la matrice, seule juge des droits. Le poste fixe la lit par « GET /habilitations/matrice » pour n'afficher que ce qui est permis. Valeurs : L lecture, E écriture, S signature, V validation, A administration."}, {"type": "h", "texte": "Profils"}, {"type": "liste", "items": ["IDE : titulaire, ou « en structure » quand le cabinet exerce en structure, ou remplaçant s'il tient ses droits d'une habilitation de remplacement.", "AS : aide-soignant.", "ADM : administration du cabinet.", "Une habilitation active ajoute « responsable » ou « administrateur ».", "Professionnel externe : portail QR seulement."]}, {"type": "h", "texte": "Lignes à retenir"}, {"type": "table", "entetes": ["Ligne", "Action", "Qui"], "lignes": [["HAB-07", "Saisir une fiche de soin infirmier", "IDE (titulaire, structure, responsable, remplaçant)"], ["HAB-08", "Saisir une fiche Nursing", "IDE et aide-soignant"], ["HAB-13, HAB-15", "Passage imprévu, échange de tournée", "IDE et aide-soignant"], ["HAB-16", "Transmission ciblée", "IDE et aide-soignant (dans les limites de son rôle)"], ["HAB-17", "Transmission intra-cabinet", "Tous les intervenants du cabinet"], ["HAB-22", "Voir la cotation", "IDE seulement"], ["HAB-23", "Sécuriser une FSE", "Titulaire, structure, responsable ; pas le remplaçant (décision D-10 ouverte)"], ["HAB-14, 24, 25, 29, 33", "Tournées, lots, rejets, accès QR, habilitations et terminaux", "Titulaire, responsable, administration"], ["OFF-16", "Valider une saisie différée", "Titulaire ou responsable, au poste fixe seulement"], ["HAB-34", "Lire le dossier clinique", "IDE et aide-soignant ; jamais l'administrateur non soignant"]]}, {"type": "h", "texte": "Administrateur sans dossier clinique"}, {"type": "p", "texte": "L'administrateur non soignant garde l'administration du cabinet (équipe, habilitations, tournées, réglages, accès QR, reprise, journal des accès) et, des patients, leur seule identité (liste, tournée du jour). La liste de ses routes est fermée : une route absente lui est refusée."}, {"type": "h", "texte": "Portée du remplaçant"}, {"type": "liste", "items": ["Toute lecture est bornée au cabinet du jeton et, pour un remplaçant, à sa période, ses tournées et ses patients ; hors portée, la réponse est 404.", "Chaque geste est jugé à sa propre date.", "À la fin du remplacement, seule la synchronisation reste ouverte pour les gestes datés de la période ; 120 minutes plus tard, toutes ses sessions sont révoquées."]}, {"type": "note", "ton": "info", "texte": "Les valeurs de la matrice ont été retenues lors du développement et restent à faire valider : le cahier des charges la laisse « à remplir cellule par cellule »."}]}, {"id": "tech-sessions", "titre": "Sessions, jetons, enrôlement et première connexion", "resume": "Jeton d'accès court, rafraîchissement à usage unique, terminaux enrôlés par code, première connexion de service par code à usage unique.", "mots_cles": ["sessions", "JWT", "jeton", "rafraîchissement", "enrôlement", "terminal", "révocation", "connexion par code", "SEC-04"], "blocs": [{"type": "h", "texte": "Jetons"}, {"type": "liste", "items": ["Jeton d'accès JWT HS256 de 15 minutes (12 heures en développement).", "Jeton de rafraîchissement opaque, gardé haché, à usage unique et tournant ; session glissante de 7 jours, 30 jours au plus.", "Le jeton précédent rejoué dans les 30 secondes rend la même paire (réponse perdue) ; toute autre réutilisation révoque la session.", "Poste fixe : jetons en sessionStorage, fermés avec l'onglet ; un 401 « expiré » déclenche un seul rafraîchissement partagé."]}, {"type": "h", "texte": "Révocation"}, {"type": "p", "texte": "« POST /auth/deconnexion », « POST /auth/sessions/{id}/revocation » et « POST /auth/terminaux/{terminal}/revocation » (terminal perdu). « GET /auth/sessions » liste les sessions. Une révocation prend effet à la requête suivante."}, {"type": "h", "texte": "Enrôler un terminal"}, {"type": "etapes", "items": ["Au poste fixe, un profil qui gère les habilitations (HAB-33) émet un code : « POST /auth/terminaux ». Le code a 10 caractères, sert une fois et vaut 10 minutes.", "Sur le terminal, sans session : « POST /auth/terminaux/enrolement » avec le code, l'identifiant stable de l'appareil et un secret d'appareil tiré au hasard, rangé dans le Keystore.", "Le serveur ne garde que l'empreinte du secret ; toute session ouverte sur ce terminal lui est liée et chaque rafraîchissement présente le secret.", "Un terminal révoqué n'ouvre ni ne rafraîchit plus aucune session : il faut un nouvel enrôlement."]}, {"type": "h", "texte": "Première connexion en service"}, {"type": "p", "texte": "Keycloak est le courtier d'identité (voir ci-dessous) ; Pro Santé Connect réel reste à raccorder. En secours, et seul quand Keycloak n'est pas configuré, la route « POST /auth/connexion/code » échange : un code à usage unique émis en ligne de commande par l'exploitation, échangé contre une session de l'intervenant qu'il désigne."}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python -m scripts.connexion_service premier-titulaire --cabinet \"…\" --nom … --prenom … --rpps …\nuv run python -m scripts.connexion_service liste\nuv run python -m scripts.connexion_service code {identifiant} --minutes 30"}, {"type": "liste", "items": ["Le code a 10 caractères, vaut 60 minutes par défaut (24 heures au plus), se brûle au premier usage ; seule son empreinte est gardée.", "La route est limitée en débit et répond le même 401 pour un code inconnu, expiré ou déjà utilisé.", "Chaque émission et chaque usage entrent à la chaîne d'audit.", "L'écran de saisie du code existe au poste fixe et au terminal (« En secours : code de service »)."]}, {"type": "note", "ton": "attention", "texte": "En démonstration seulement, une connexion par carte CPS simulée existe ; ses cartes ouvrent des sessions à qui les présente, d'où son refus hors développement."}, {"type": "h", "texte": "Connexion par Keycloak (OIDC)"}, {"type": "liste", "items": ["Conteneur « keycloak » de docker-compose.yml (image Keycloak 26, mode start-dev, port 8180), realm « tabsante » importé de « infra/keycloak/realm-tabsante.json », thème de connexion « infra/keycloak/themes/tabsante ».", "Clients publics « tabsante-poste » et « tabsante-terminal » avec PKCE S256 ; « tabsante-api » est l'audience exigée par le serveur ; « tabsante-tests » est réservé au développement.", "Le jeton Keycloak s'échange une seule fois contre une session TabSanté (« POST /auth/connexion/oidc ») et ne vaut sur aucune autre route (Q-99). Signature vérifiée par les clés publiées du realm, émetteur, audience et expiration contrôlés.", "L'intervenant est reconnu par son compte rattaché, sinon par son RPPS ; le rôle du jeton doit correspondre au sien (Q-100). Un compte créé par Pro Santé Connect reçoit le rôle infirmier (Q-101).", "Activation : TABSANTE_OIDC_ISSUER côté serveur, VITE_OIDC_ISSUER au poste fixe, --dart-define=OIDC_ISSUER au terminal. Sans ces variables, rien ne change.", "Comptes de démonstration fictifs et variables d'exemple : « infra/keycloak/demo.env.example ». Production : mode start avec une base PostgreSQL dédiée, TLS, secrets hors du dépôt, realm sans comptes de démonstration ni client de test ni Pro Santé Connect simulé (« docs/exploitation/interfaces/cps-et-connexion.md »)."]}, {"type": "code", "langage": "bash", "texte": "TABSANTE_API_PORT=8010 docker compose up -d keycloak   # console : http://localhost:8180/admin (développement)"}]}, {"id": "tech-journal-audit", "titre": "Journal d'audit chaîné et ancrage", "resume": "Un registre immuable de ce qui change, chaîné par empreintes SHA-256, sans copie clinique, dont la tête est copiée hors de la base chaque nuit.", "mots_cles": ["audit", "journal d'audit", "chaîne", "SHA-256", "ancrage", "immuabilité", "minimisation", "preuve"], "blocs": [{"type": "p", "texte": "La table « journal_audit » répond à la question « qui a changé quoi, quand ? ». Elle est immuable et écrite sous un verrou global ; chaque entrée porte l'empreinte SHA-256 de la précédente, si bien qu'une altération rompt la chaîne."}, {"type": "h", "texte": "Ce qu'une entrée garde"}, {"type": "liste", "items": ["La référence de l'entité (type et identifiant), le type d'événement, l'acteur, l'horodatage.", "Les noms des champs touchés et quelques paramètres de forme (dates, versions, nombres).", "Quand la preuve l'exige, une empreinte HMAC du contenu, à clé du serveur.", "Les identifiants de personne (matricule INS, numéro de carte Vitale) sous forme de pseudonyme HMAC."]}, {"type": "note", "ton": "info", "texte": "Depuis la migration 0043c, le journal d'audit ne garde plus aucune copie clinique : ni NIR ni INS, ni valeurs d'antécédents ou de biologie, ni caractéristiques de plaies, ni lignes de cotation. Ces contenus restent dans leurs tables. Un test rejoue toute la démonstration et vérifie qu'aucune donnée clinique n'entre au journal."}, {"type": "p", "texte": "Le code compte 211 types d'événement sur 51 entités ; la liste se régénère depuis le code (commande dans « docs/exploitation/journal-audit.md »). Exception assumée : le registre des demandes de droits des patients y est tenu, avec un texte administratif sans donnée de santé."}, {"type": "h", "texte": "Ancrage hors de la base"}, {"type": "liste", "items": ["La tête de la chaîne est copiée dans un fichier en ajout seul (ANCRE_FICHIER) et postée vers un puits hors site (ANCRE_URL), chaque nuit et à la demande.", "Hors développement, l'API refuse de démarrer sans puits hors site (règle provisoire, puits à choisir avec l'hébergeur).", "Une ancre divergente ou un fichier d'ancres disparu est signalé ; les purges sont alors suspendues."]}, {"type": "h", "texte": "Vérifier"}, {"type": "code", "langage": "bash", "texte": "GET /audit/verification      # relit toute la chaîne, l'ancrage et la chaîne des accès (limité en débit)\nGET /audit/ancre              # lire la tête\nPOST /audit/ancre             # poser une ancre manuelle\ncd backend && uv run python -m app.taches   # tâche de nuit"}, {"type": "p", "texte": "Le dossier de preuve d'un acte relit la charge signée de l'acte dans sa table et ne lit du journal que le rang, le type, l'horodatage et l'empreinte ; sa vérification est incrémentale, avec une relecture complète au plus tous les quarts d'heure et chaque nuit."}]}, {"id": "tech-journal-acces", "titre": "Journal des accès", "resume": "Toute lecture nominative est tracée, un patient par ligne, dans une chaîne d'empreintes distincte, purgeable après 365 jours et jamais avant 180.", "mots_cles": ["journal des accès", "traçabilité", "lectures", "RGPD", "chaîne", "purge", "lectures_tracees"], "blocs": [{"type": "p", "texte": "La table « journal_acces » répond à la question « qui a lu quoi, quand, d'où ? ». Elle est tenue hors de la chaîne d'audit : une ligne par lecture saturerait son verrou, un appelant non authentifié ne doit pas pouvoir la remplir, et ces traces se purgent."}, {"type": "h", "texte": "La règle : toute lecture nominative"}, {"type": "liste", "items": ["Toute lecture authentifiée (GET) est tracée, sauf les routes exemptées avec leur raison ; la liste vit en un seul endroit, « backend/app/lectures_tracees.py ».", "Un test parcourt toutes les routes et échoue sur une route de lecture ni tracée ni exemptée.", "Chaque patient atteint par la réponse donne une ligne : une liste de 150 patients écrit 150 lignes, en une seule requête SQL.", "Sont aussi tracés les rafraîchissements de session et tous les refus 401, avec l'adresse du client.", "Identifiants seulement, jamais le contenu lu, jamais le texte d'une recherche."]}, {"type": "h", "texte": "Chaîne propre"}, {"type": "p", "texte": "Chaque ligne porte l'empreinte SHA-256 de la précédente, sous un verrou distinct ; la base refuse toute réécriture, propriétaire compris. Chaque nuit, la tête de cette chaîne est recopiée dans la chaîne d'audit, elle-même ancrée hors de la base."}, {"type": "h", "texte": "Lire et restituer"}, {"type": "liste", "items": ["« GET /journal-acces » (filtres patient, auteur, dates) et « /journal-acces/export » (CSV) : page Journal des accès du poste fixe, droit HAB-33.", "Restitution au patient dans la vue Droits du patient : accès regroupés par jour, intervenant et nature de consultation.", "Les accès d'un professionnel extérieur par QR portent le cabinet, l'accès et le RPPS."]}, {"type": "h", "texte": "Conservation"}, {"type": "p", "texte": "365 jours (provisoire, D-06). La base refuse d'effacer une ligne de moins de 180 jours ou de vider la table, même au propriétaire. La purge coupe la chaîne par la tête et inscrit la coupure."}]}, {"id": "tech-chiffrement", "titre": "Chiffrement des fichiers, des sauvegardes et du terminal", "resume": "Ce qui est chiffré par l'application, avec quelles clés, et ce qui attend l'hébergeur.", "mots_cles": ["chiffrement", "AES-256-GCM", "KMS", "trousseau", "fichiers", "terminal", "Keystore", "TLS"], "blocs": [{"type": "table", "entetes": ["Donnée", "Au repos", "Où"], "lignes": [["Photos, ordonnances, PDF produits et reçus, BSI, photo de l'entrée du domicile", "Chiffrés par l'application, AES-256-GCM, une clé par fichier", "backend/app/stockage.py"], ["Sauvegardes (base et fichiers)", "AES-256-GCM, clé de sauvegarde distincte", "backend/scripts/sauvegarde.py"], ["Base locale du terminal", "Chaque enregistrement en AES-256-GCM, clé dans le Keystore Android", "mobile/lib/chiffrement.dart"], ["Photos du terminal", "Un fichier chiffré par photo, avec la clé de la base locale", "mobile/lib/coffre.dart"], ["Base PostgreSQL du serveur", "Non chiffrée par l'application : chiffrement du volume exigé de l'hébergeur", "contrat HDS"], ["Jetons, secrets d'appareil, codes d'enrôlement, jetons de QR", "Hachés (SHA-256), jamais en clair", "backend/app/auth.py"]]}, {"type": "h", "texte": "Fichiers du serveur"}, {"type": "liste", "items": ["Chaque fichier a sa clé aléatoire de 256 bits, enveloppée par la clé maîtresse active d'un port « Kms ».", "Le contenu est chiffré par segments de 64 Kio ; un fichier altéré, tronqué ou dont la clé manque est refusé (409 « Fichier illisible »), jamais servi à moitié.", "Le nom du fichier reste l'empreinte SHA-256 du clair, revérifiée à la lecture.", "Lecture en flux, segment par segment."]}, {"type": "note", "ton": "attention", "texte": "Le seul KMS existant, « KmsLocal », est un trousseau JSON simulé. Hors développement, l'API refuse de démarrer avec lui : brancher le KMS ou le HSM de l'hébergeur sur le port « Kms » est un prérequis de mise en service."}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/stockage.py verifier   # aussi : nouvelle-cle, migrer, tourner, retirer"}, {"type": "h", "texte": "Terminal"}, {"type": "liste", "items": ["Base locale chiffrée enregistrement par enregistrement, clé tirée au hasard et rangée dans le Keystore.", "Code de verrouillage à 6 chiffres (ou empreinte digitale) ; verrouillage au lancement, en arrière-plan et après 5 minutes sans toucher l'écran.", "Ni capture d'écran ni sauvegarde Android ; base illisible mise en quarantaine, jamais supprimée.", "Le terminal servi en navigateur garde sa clé dans le navigateur : démonstration seulement, jamais de vraies données."]}, {"type": "h", "texte": "Transport"}, {"type": "p", "texte": "En production, TLS au reverse proxy de l'hébergeur (TLS 1.2 au moins, suites AEAD, HSTS). L'API pose ses en-têtes de sécurité (nosniff, DENY, no-referrer, no-store, HSTS, CSP stricte) et n'admet en CORS que ses origines déclarées, en https hors développement."}]}, {"id": "tech-hors-connexion", "titre": "Terminal hors connexion et synchronisation", "resume": "La précharge du matin, la file d'opérations rejouable par /sync, l'idempotence par identifiant tiré au terminal et les garanties contre les doublons.", "mots_cles": ["hors connexion", "synchronisation", "/sync", "précharge", "file", "idempotence", "SAVEPOINT", "verrou", "brouillon"], "blocs": [{"type": "h", "texte": "Précharge"}, {"type": "p", "texte": "« GET /terminal/precharge » rend la journée : tournées, occurrences, patients, plaies, dispositifs, notifications, itinéraires, prérequis des passages. Le terminal complète par patient et globalement. Elle est rechargée à la connexion, après une synchronisation acceptée, et comparée au serveur toutes les 5 minutes ; elle n'est relue en entier que si son empreinte a changé. Un bandeau prévient au-delà de 2 heures."}, {"type": "h", "texte": "La file et POST /sync"}, {"type": "liste", "items": ["Chaque geste entre dans une file locale chiffrée, avec un identifiant UUID tiré au terminal.", "La file part toutes les 20 secondes et après chaque signature, par lots de 500 opérations au plus, planning d'abord.", "Le serveur rend, opération par opération, un reçu (avec l'empreinte de l'acte) ou un refus motivé.", "28 types d'opération : ouvrir ou clôturer une plaie ou un dispositif, signer un acte, corriger, rectifier, transmettre, créer un patient, échanges de tournée, passage non réalisé, fréquence ponctuelle, prescription infirmière, accords préalables, départ et arrivée, prérequis du passage, entre autres."]}, {"type": "h", "texte": "Garanties"}, {"type": "liste", "items": ["Une opération, un SAVEPOINT : un refus n'emporte pas les autres.", "L'identifiant tiré au terminal devient la clé primaire : rejouer la même opération rend le même résultat ; un identifiant déjà employé par un autre rend 409.", "Un envoi rejoué pendant que le premier s'écrit encore attend celui-ci (verrous consultatifs pris dans un ordre fixe) et rend la même réponse.", "Pas de fusion silencieuse : un doublon ou une occurrence déjà servie rend 409.", "La date propre du geste, avec fuseau, juge la portée d'un remplaçant et la saisie différée."]}, {"type": "h", "texte": "Saisie différée"}, {"type": "p", "texte": "Au-delà de 120 minutes entre réalisation et saisie (seuil provisoire, D-04), l'acte est marqué différé, un motif est exigé et une validation au poste fixe par un autre infirmier est due."}, {"type": "h", "texte": "Côté terminal"}, {"type": "liste", "items": ["Onglet Envois : « À corriger » d'abord, puis l'attente ; corriger et renvoyer, ou abandonner.", "Brouillon local enregistré à chaque appui, effacé à la signature ; brouillon partagé versionné pour les sous-fiches de la fiche 24.", "Le changement d'intervenant est refusé tant que la file, les photos ou les brouillons ne sont pas vides.", "Révocation : précharge, brouillons et jetons effacés ; une file non vide reste chiffrée, à envoyer après un nouvel enrôlement ou à effacer sur confirmation."]}, {"type": "p", "texte": "Le cabinet suit la dernière synchronisation de chaque terminal (« GET /synchronisations ») : un terminal silencieux pendant une tournée en cours remonte à « À traiter » au-delà d'un seuil réglable, 120 minutes par défaut (règle provisoire)."}]}, {"id": "tech-tests-ci", "titre": "Tests et intégration continue", "resume": "Une commande vérifie tout le dépôt sur une base jetable ; un crochet la lance avant chaque envoi ; deux définitions de CI sont prêtes.", "mots_cles": ["tests", "pytest", "vitest", "flutter test", "verifier_tout", "CI", "GitHub Actions", "GitLab", "pre-push", "horloge"], "blocs": [{"type": "h", "texte": "Tout vérifier"}, {"type": "code", "langage": "bash", "texte": "docker compose up -d db\npowershell -File scripts/verifier_tout.ps1                # tout\npowershell -File scripts/verifier_tout.ps1 -Rapide        # parties changées depuis main\npowershell -File scripts/verifier_tout.ps1 -Integration   # + terminal contre une API temporaire\nbash scripts/verifier_tout.sh [--rapide] [--integration]  # jumeau POSIX"}, {"type": "etapes", "items": ["Crée une base jetable dans le conteneur, supprimée à la fin même après un échec.", "Passe les migrations à neuf, défait puis rejoue la dernière, exige une seule tête.", "Lance les tests du serveur avec couverture, puis les rejoue avec l'horloge recalée à 0 h 30 (garde de l'horloge).", "Poste fixe : types, analyse, tests et couverture, construction.", "Terminal : analyse, tests et couverture, construction web.", "Finit par un tableau en français et sort en code 1 au moindre échec."]}, {"type": "h", "texte": "Par partie"}, {"type": "code", "langage": "bash", "texte": "cd backend && uv run pytest -n auto\ncd web && npx vitest run && npx tsc -b\ncd mobile && flutter analyze && flutter test\nTABSANTE_API=http://127.0.0.1:8010 flutter test --concurrency=1 test/integration"}, {"type": "table", "entetes": ["Suite", "Fichiers", "Cas repérés"], "lignes": [["Serveur (backend/tests)", "166", "1 476 fonctions de test"], ["Poste fixe (web/src/test)", "62", "550 cas"], ["Terminal, unitaires et widgets", "72", "872 cas"], ["Terminal, intégration contre une vraie API", "27", "51 cas"]]}, {"type": "note", "ton": "info", "texte": "Ces nombres sont un décompte des déclarations de test dans les fichiers au commit étudié, pas un résultat d'exécution : les tests paramétrés comptent une fois."}, {"type": "h", "texte": "Garde-fous notables"}, {"type": "liste", "items": ["Garde de l'horloge : aucune lecture directe de l'heure hors de « app/horloge.py » (quelques exceptions nommées).", "Libellés sans codes : aucun identifiant du cahier des charges dans ce que lit l'utilisateur.", "Formes des lectures : instantané des clés et types des lectures lourdes ; changement voulu par TABSANTE_FORMES_REECRIRE=1.", "Performance : plafond de requêtes SQL par lecture et par synchronisation.", "Contrats des ports : écrits pour tourner tels quels contre les adaptateurs réels.", "Routes de lecture : chacune tracée au journal des accès ou exemptée avec sa raison.", "Journal d'audit minimal : aucune copie clinique."]}, {"type": "h", "texte": "Crochet et CI"}, {"type": "liste", "items": ["« scripts/installer_hooks.ps1 » pose un crochet pre-push qui lance la vérification rapide avant chaque envoi.", "« .github/workflows/ci.yml » et « .gitlab-ci.yml » : trois travaux (serveur avec PostgreSQL 17, poste fixe avec Node 24, terminal avec Flutter 3.47.6) et un passage nocturne avec l'horloge à 0 h 30.", "Où héberger le code et l'exécuteur reste à décider."]}]}, {"id": "tech-performance", "titre": "Performance et garde-fous", "resume": "Cibles proposées, volume de référence et garde-fous qui empêchent une requête SQL par patient de revenir.", "mots_cles": ["performance", "NFR-08", "requêtes", "N+1", "mesure", "test_perf_fumee", "précharge"], "blocs": [{"type": "p", "texte": "Les cibles sont proposées par « docs/exploitation/performance.md » et restent à mesurer sur une machine de recette : les dernières mesures ont été prises sur un poste de développement chargé."}, {"type": "table", "entetes": ["Lecture", "Cible proposée"], "lignes": [["Précharge du terminal", "2 s"], ["Tournée du jour", "500 ms"], ["Tableau de bord", "2 s"], ["/sync de 50 actes", "2 s"], ["Synchronisation d'une tournée avec ~30 photos au retour de la 4G", "60 s"]]}, {"type": "liste", "items": ["Volume de référence : un cabinet fictif de 150 patients et 60 jours de passages (« scripts/semer_volume.py », sur une base dédiée dont le nom contient « perf »), mesuré par « scripts/mesurer_perf.py ».", "Disponibilité proposée : terminal 100 % de la tournée hors connexion ; API 99,5 % de 7 h à 21 h, à porter au contrat d'hébergement.", "Les lectures du journal des accès s'écrivent en une seule requête, quel que soit le nombre de patients rendus."]}, {"type": "h", "texte": "Garde-fous en CI"}, {"type": "liste", "items": ["« tests/test_perf_fumee.py » plafonne le nombre de requêtes SQL de lectures lourdes et d'une synchronisation ; le nombre de requêtes de /sync ne doit pas dépendre de la longueur des passages.", "« tests/test_perf_confirmer.py » tient la reconfirmation des cotations et la liste « à facturer » sans requête par acte.", "Relever un plafond exige une justification dans le commit ; mieux vaut grouper la lecture."]}]}, {"id": "tech-sauvegardes", "titre": "Sauvegardes et restauration", "resume": "Sauvegarde chiffrée de la base et des fichiers, rotation 7/4/12, restauration contrôlée qui relit la chaîne d'audit.", "mots_cles": ["sauvegardes", "restauration", "pg_dump", "chiffrement", "RPO", "RTO", "rotation", "reprise"], "blocs": [{"type": "liste", "items": ["« backend/scripts/sauvegarde.py » : dump PostgreSQL et archive des fichiers déjà chiffrés, chaque partie chiffrée en AES-256-GCM, manifeste d'empreintes SHA-256.", "Clé de sauvegarde générée une fois, gardée hors du serveur par deux personnes au moins ; sans elle, aucune restauration.", "Le trousseau du stockage (ou le KMS) se garde aussi hors du serveur : sans lui, les fichiers restaurés sont illisibles.", "Rotation 7,4,12 : la plus récente de chacun des 7 derniers jours, 4 dernières semaines et 12 derniers mois.", "Objectifs proposés : RPO 24 heures, RTO 4 heures."]}, {"type": "code", "langage": "bash", "texte": "cd backend\nuv run python scripts/sauvegarde.py --nouvelle-cle      # une seule fois\nuv run python scripts/sauvegarde.py                     # chaque nuit, avant la tâche de nuit\nuv run python scripts/restauration.py {dossier} --verifier   # contrôle sans rien écrire"}, {"type": "etapes", "items": ["Contrôler la copie (aussi la copie hors site, chaque semaine).", "Restaurer dans une base vide et un dossier vide ; la chaîne d'audit restaurée est relue entièrement.", "Recréer le rôle applicatif (« scripts/roles_db.py »), puis lancer la tâche de nuit."]}, {"type": "p", "texte": "Un exercice de reprise sur deux sites est simulé par « scripts/exercice_multisite.py » ; il ne prouve ni la latence entre deux sites réels, ni la réplication en flux, ni celle du KMS."}, {"type": "note", "ton": "attention", "texte": "Non éprouvé à ce jour : la restauration sur un autre hôte et depuis une copie hors site réelle."}]}, {"id": "tech-retention", "titre": "Rétention et tâche de nuit", "resume": "Ce que la tâche de nuit purge, signale ou conserve, avec des durées provisoires à valider par le DPO.", "mots_cles": ["rétention", "conservation", "purge", "D-06", "tâche de nuit", "RGPD", "dossier au terme"], "blocs": [{"type": "table", "entetes": ["Donnée", "Durée provisoire", "Action"], "lignes": [["Journal des accès", "365 jours (jamais moins de 180)", "Purge"], ["Sessions closes et jetons", "365 jours", "Purge"], ["Réponses gardées pour une clé d'idempotence", "24 heures", "Purge"], ["Travaux de l'agent de poste terminés", "30 jours", "Purge"], ["Fichiers qu'aucune ligne ne cite", "30 jours", "Purge"], ["Position approximative d'un soignant en route", "Jusqu'à l'arrivée, 12 heures au plus", "Effacement"], ["Accès au domicile et photo de l'entrée", "Durée de la prise en charge", "Conservation"], ["Dossier de soins", "20 ans après le dernier passage, pas avant les 28 ans du patient", "Signalement seulement, jamais de suppression automatique"], ["Journal d'audit et ancres", "Durée du plus long dossier qu'il prouve", "Conservation"], ["Facturation", "10 ans au moins", "Conservation"], ["Base locale du terminal", "Jusqu'à la remontée", "Effacée à la révocation du terminal"]]}, {"type": "h", "texte": "La tâche de nuit"}, {"type": "code", "langage": "bash", "texte": "cd backend && uv run python -m app.taches     # chaque nuit, connectée en propriétaire\ncd backend && uv run python -m app.retention --essai   # à blanc, avant de changer une durée"}, {"type": "liste", "items": ["Relit la chaîne d'audit et ses ancres, puis la chaîne des accès.", "Applique la table de rétention et compte les dossiers au terme.", "Recopie la tête du journal des accès dans la chaîne d'audit et ancre celle-ci hors de la base.", "Notifie les rappels datés du jour et efface les positions périmées.", "Une ligne JSON en sortie ; code 0 conforme, 1 chaîne rompue ou ancre divergente (les purges sont alors suspendues), 2 dépôt en échec."]}, {"type": "h", "texte": "Supprimer un dossier au terme"}, {"type": "p", "texte": "Jamais automatique : après décision du DPO, export FHIR complet du dossier, puis suppression par le propriétaire du schéma avec « python -m app.retention --supprimer », d'abord à blanc. Le script refuse un dossier qui n'est pas au terme, une décision absente ou une archive qui ne correspond pas. L'entrée « dossier_supprime » s'inscrit à la chaîne d'audit, sans contenu."}, {"type": "note", "ton": "info", "texte": "Toutes ces durées sont provisoires (décision D-06) et toutes les références juridiques restent à valider par le DPO."}]}, {"id": "tech-mise-en-service", "titre": "Hébergement HDS et mise en service", "resume": "Ce que l'API refuse au démarrage en configuration de service, ce qui est fermé tant que les adaptateurs réels manquent, et la liste de contrôle du premier démarrage.", "mots_cles": ["mise en service", "production", "HDS", "hébergement", "démarrage", "configuration de service", "KMS", "liste de contrôle"], "blocs": [{"type": "note", "ton": "attention", "texte": "À réaliser avant production : aucun hébergeur certifié HDS n'est retenu, aucun DPO n'est désigné, la connexion par carte CPS n'est pas raccordée, le KMS de l'hébergeur n'est pas branché. Aucune donnée réelle ne doit entrer dans la plateforme avant."}, {"type": "h", "texte": "Deux configurations, jamais mélangées"}, {"type": "table", "entetes": ["", "Développement et démonstration", "Service"], "lignes": [["Variables", "TABSANTE_DEV_AUTH=true", "DEV_AUTH absent, TABSANTE_ENV=production recommandé"], ["Routes /dev, /simulation, échanges simulés", "Montées", "Non montées (404)"], ["Services simulés", "Répondent avec des données fictives", "Refusent (409 « service non raccordé »), rien n'est écrit"], ["Documentation /docs", "Publiée", "Fermée"], ["CORS", "Origines locales", "https seulement"]]}, {"type": "h", "texte": "Ce que le démarrage en service refuse"}, {"type": "etapes", "items": ["Le mode démonstration posé.", "Un secret des jetons absent, court, connu ou de développement.", "Une origine CORS « * » ou non https.", "Le lecteur d'ordonnance factice.", "L'absence de puits d'ancrage hors site.", "Le KMS local simulé : l'adaptateur du KMS ou du HSM de l'hébergeur doit d'abord être branché.", "Puis, au lancement, un rôle SQL trop privilégié."]}, {"type": "h", "texte": "Ce qu'on attend de l'hébergeur"}, {"type": "liste", "items": ["Certificat HDS couvrant les activités utiles ; données et sauvegardes en France, sur deux sites distincts.", "Deux instances de l'API derrière un reverse proxy TLS ; PostgreSQL 17 avec réplique sur le second site et archivage continu ; volume chiffré.", "KMS ou HSM pour les clés maîtresses du stockage ; puits d'ancres en ajout seul hors de la plateforme.", "Tâches planifiées (sauvegarde vers 1 h 30, tâche de nuit vers 2 h 15) et supervision des codes de sortie.", "Les images applicatives restent à produire avec l'hébergeur retenu : aujourd'hui, seule la base est conteneurisée."]}, {"type": "h", "texte": "Liste de contrôle du premier démarrage"}, {"type": "table", "entetes": ["Contrôle", "Preuve"], "lignes": [["DEV_AUTH et MODE_DEMO absents, ENV=production", "/dev/demo et /simulation rendent 404"], ["Secret des jetons aléatoire, hors dépôt", "Le démarrage passe"], ["Origines CORS en https", "Pas d'en-tête CORS pour une origine http"], ["/docs, /redoc, /openapi.json", "404"], ["KMS de l'hébergeur branché", "Le démarrage passe"], ["Rôle SQL applicatif à moindre privilège", "Contrôle au démarrage"], ["Premier titulaire créé, code échangé", "GET /moi répond ; deux entrées d'audit"], ["Journal de l'API", "Avertissement listant les services simulés fermés"], ["En-têtes de sécurité conservés par le proxy", "Vérifiés sur une réponse d'erreur aussi"]]}]}, {"id": "tech-interfaces", "titre": "Interfaces externes : ce qui est réel, ce qui est simulé", "resume": "Pour chaque service externe, le port, l'adaptateur branché et son état ; aucun service national n'est raccordé aujourd'hui.", "mots_cles": ["interfaces", "INSi", "SESAM-Vitale", "DMP", "MSSanté", "Pro Santé Connect", "FHIR", "simulé", "ports"], "blocs": [{"type": "p", "texte": "Chaque interface du cahier des charges a sa fiche dans « docs/exploitation/interfaces » (gabarit du §9). Les doublures ne servent qu'en démonstration ; hors démonstration, elles sont fermées."}, {"type": "table", "entetes": ["Interface", "Adaptateur actuel", "État"], "lignes": [["INSi, ADRi, IDB, carte Vitale", "Adaptateurs factices", "Simulé ; homologation CNDA à obtenir"], ["Carte CPS et connexion", "Keycloak installé (OIDC et PKCE) ; Pro Santé Connect simulé en amont ; cartes de démonstration", "Simulé ; Pro Santé Connect réel (convention ANS) et bibliothèque CPS attendus"], ["Pro Santé Connect (portail externe)", "PscFactice", "Simulé ; refuse toute identité hors développement"], ["SESAM-Vitale (FSE, lots, retours, tiers payant)", "SesamVitaleFactice, en direct ou par l'agent de poste simulé", "Simulé ; composant et agrément attendus (D-07)"], ["DMP", "Bouchon qui journalise", "Simulé ; refus si l'INS n'est pas qualifiée"], ["MSSanté, laboratoire, pharmacie", "Bouchon qui n'envoie rien", "Simulé"], ["Ordonnance numérique", "Aucun port national", "Ordonnance photographiée, lue par OCR local, validée par l'infirmier"], ["Lecture d'ordonnance", "RapidOCR local (extra « ocr »)", "Réel, local, sans réseau"], ["Moteur de cotation NGAP", "MoteurDemo (demo-0.4)", "Doublure, jamais facturable"], ["Référentiels prescriptible et médicaments", "Fichiers de démonstration versionnés", "Démonstration (D-14, D-16)"], ["Vidéo des actes à distance", "Visio simulée, rien ne quitte le poste", "Simulé ; aucun flux conservé"], ["Reprise de dossiers", "Format pivot de démonstration", "Simulé ; formats réels à décider (D-13)"], ["Export FHIR R4", "Lecture seule", "Réel"], ["Géocodage, itinéraire, trafic, météo, position", "Doublures ; sources ouvertes en option", "Simulé par défaut"], ["Contexte France", "Doublures ; sources publiques en option", "Fériés, vacances et circulation servent hors démonstration ; vigilance, pollution et pollens se taisent"]]}, {"type": "h", "texte": "Carte, météo et trafic : réseau en option"}, {"type": "p", "texte": "Par défaut, aucun appel réseau. Avec TABSANTE_CARTE_RESEAU, la météo est demandée pour le centre d'une maille d'environ 10 km, jamais pour un domicile ; le trafic est téléchargé en entier et rapproché sur le serveur ; l'itinéraire réel ne part que vers un moteur OSRM auto-hébergé déclaré, un serveur public étant refusé au démarrage."}, {"type": "note", "ton": "attention", "texte": "Règle absolue : jamais une adresse ni une position de patient vers un tiers non HDS. Les tuiles du fond de carte, demandées par le navigateur, révèlent la zone affichée : un serveur de tuiles du cabinet, de l'hébergeur ou sous contrat est attendu avant production."}, {"type": "h", "texte": "FHIR"}, {"type": "p", "texte": "Lecture seule réelle : « /fhir/Patient/{id} », « $everything » pour la portabilité, Observation, Procedure, DocumentReference, Encounter. Les codes terminologiques sans correspondance validée sont marqués « non validés »."}]}, {"id": "tech-cotation", "titre": "Cotation : port Moteur, doublure et banc", "resume": "La plateforme tient des faits datés, le moteur décide ; aujourd'hui, une doublure de démonstration cote, mesurée par un banc de cas écrits.", "mots_cles": ["cotation", "NGAP", "moteur", "MoteurDemo", "banc de cotation", "CNDA", "FSE", "file de contrôle"], "blocs": [{"type": "note", "ton": "attention", "texte": "Rien de ce que cote la doublure n'est facturable. Hors démonstration, aucune feuille de soins ne se crée tant que la doublure sert."}, {"type": "h", "texte": "Le contrat"}, {"type": "liste", "items": ["Port « Moteur » dans « backend/app/cotation/interface.py » : le moteur cote un passage entier (même patient, jour, moment, intervenant et séance) et rend des lignes explicites (statut, taux, quantité, nature, règles appliquées).", "Seules les lignes « retenue » et « taux réduit » sont facturées ; les autres disent pourquoi.", "Chaque cotation garde la version du moteur, du référentiel de règles et des tarifs.", "Le serveur fournit au terminal la clé de cotation hors connexion et ce qui est facturable : rien n'est recopié côté client.", "Ce que les fiches disent « tracé, pas transmis » ne part jamais au moteur."]}, {"type": "h", "texte": "La doublure"}, {"type": "p", "texte": "« MoteurDemo » (version demo-0.4) reproduit une partie de la NGAP pour la démonstration et les tests : cumul de l'article 11 B, majorations une fois par passage, nuit selon les tranches de la NGAP (20 h-23 h et 5 h-8 h, 23 h-5 h) et seulement sur horaire prescrit de nuit, dimanches et jours fériés calculés sans réseau, déplacements selon une règle provisoire, forfaits sous BSI, tarifs datés. Le moteur réel de TABSANTE se branchera derrière le même port."}, {"type": "h", "texte": "Du soin à la télétransmission"}, {"type": "etapes", "items": ["Le serveur cote à la réception de l'acte signé.", "Reconfirmation : le moteur rejoue le passage ; un résultat identique est confirmé, un écart va en file de contrôle.", "File de contrôle : confirmer ou écarter avec un motif, sous 7 jours (réglage provisoire, D-05).", "FSE créée par l'infirmier qui a réalisé les actes, sécurisée par les cartes, mise en lot après contrôle de cohérence.", "Télétransmission et retours, simulés en démonstration."]}, {"type": "h", "texte": "Le banc de cotation"}, {"type": "code", "langage": "bash", "texte": "cd backend && uv run python -m scripts.banc_cotation"}, {"type": "p", "texte": "Il rejoue des recueils de cas écrits contre le moteur branché, sans base ni réseau, et classe chaque cas : conforme au centime, écart, bloqué ou divergence documentée. Rejoué le 22 octobre 2026 (demo-0.4) : mêmes chiffres qu'au 16 octobre."}, {"type": "table", "entetes": ["Recueil", "Cas", "Conformes", "Écarts", "Bloqués", "Divergences documentées"], "lignes": [["Cahier CNDA « Cas de facturation infirmiers »", "44", "19", "0", "18", "7"], ["Cas écrits depuis le texte de la NGAP", "26", "23", "0", "0", "3"], ["Oracle du titre XVI", "120", "113", "0", "7", "0"]]}, {"type": "p", "texte": "« tests/test_banc_cotation.py » échoue dès qu'un cas conforme régresse. C'est un banc d'essai de la doublure, jamais un agrément : l'agrément CNDA reste à obtenir."}, {"type": "liens", "items": [{"titre": "Facturation et NGAP", "resume": "Le circuit complet et les règles de la doublure, dans la rubrique dédiée.", "href": "#fn-vue-ensemble"}, {"titre": "Règles NGAP de la doublure", "resume": "Cumul, majorations, déplacements, dépendance, actes par soin.", "href": "#fn-cumul"}]}]}, {"id": "tech-reprise-dossiers", "titre": "Reprise de dossiers d'un autre logiciel", "resume": "Import en deux temps, aperçu à blanc puis reprise rejouable, au format pivot de démonstration ou depuis l'export de l'ancienne application.", "mots_cles": ["reprise", "import", "migration", "format pivot", "HAB-04", "aperçu à blanc", "INSi"], "blocs": [{"type": "p", "texte": "Paramètres, puis Reprise de dossiers, avec le droit d'importer (HAB-04 : titulaire, responsable, administration). Routes : « GET /reprise/format », « POST /reprise/apercu », « POST /reprise »."}, {"type": "etapes", "items": ["Sauvegarder la plateforme juste avant : c'est le retour arrière.", "Déposer le fichier : format pivot de démonstration (JSON complet, ou CSV des seules identités), ou export de l'ancienne application, converti au format pivot.", "Lancer l'aperçu à blanc : chaque dossier est lu, ses erreurs dites en clair, ses ressemblances avec un patient existant signalées ; rien n'est écrit.", "Reprendre le même fichier : tout s'écrit en une transaction, journalisée ; un fichier modifié depuis l'aperçu est refusé (409).", "Ensuite : qualifier les identités par l'INSi et trancher les rapprochements proposés ; pour une reprise depuis l'ancienne application, enrôler aussi chaque intervenant (aucun mot de passe ni habilitation n'est repris)."]}, {"type": "liste", "items": ["Les identités reprises restent provisoires jusqu'à leur qualification ; chaque donnée porte la provenance « import ».", "Un dossier déjà repris (même logiciel, même référence) ne se recrée pas : la reprise est rejouable.", "L'historique repris est rangé en document, jamais rejoué comme des actes signés.", "Les formats d'export des autres logiciels du marché ne sont pas arrêtés (décision D-13)."]}, {"type": "note", "ton": "attention", "texte": "Un fichier d'export contient des données de santé : il se garde chiffré sur le poste de la reprise et s'efface une fois la reprise vérifiée."}]}, {"id": "tech-site-public", "titre": "Site public", "resume": "Un site de présentation statique, séparé de l'application, qui ne reçoit aucune donnée de santé et ne promet rien qui ne soit vrai.", "mots_cles": ["site public", "Astro", "statique", "mentions légales", "noindex", "verifier:production"], "blocs": [{"type": "liste", "items": ["Dossier « site » : Astro, HTML et CSS seulement, aucun script exécutable.", "Pages : accueil, fonctionnalités, sécurité (construit, simulé, à réaliser), tarifs « Sur demande », demande (liste d'attente), FAQ, pages légales.", "Aucune promesse de certification HDS, d'agrément CNDA, de compatibilité SESAM-Vitale ni de prix.", "18 informations légales et commerciales restent à compléter (« site/src/lib/legal.ts ») : tant qu'il en reste une, chaque page porte « Version de travail », passe en noindex, et la vérification de production échoue."]}, {"type": "code", "langage": "bash", "texte": "cd site\nnpm ci\nnpm run dev                     # http://localhost:4321\nnpm run ci                      # vérifications, tests, build, budgets\nnpm run verifier:production     # échoue tant qu'un champ légal manque"}]}]}, {"id": "cdc", "titre": "Couverture du CDC et décisions", "public": "tous", "pages": [{"id": "cdc-chiffres", "titre": "La couverture en chiffres", "resume": "Recompte du 22 octobre 2026, après les lots L18 et Finitions : 561 éléments, dont 411 faits et testés, aucun absent.", "mots_cles": ["couverture", "CDC", "matrice", "L17", "561", "chiffres", "recompte"], "blocs": [{"type": "p", "texte": "Le cahier des charges V2 (CDC) définit 303 exigences numérotées. La matrice de couverture y ajoute les principes, le périmètre, les acteurs, les lignes d'habilitation, le modèle de données, les cycles de vie, le hors connexion, les interfaces, la sécurité, le terminal, le non fonctionnel, les décisions et l'annexe Ségur : 561 éléments au recompte du lot L17."}, {"type": "table", "entetes": ["Périmètre", "Fait", "Partiel", "Simulé", "Bloqué", "Absent", "Total"], "lignes": [["Exigences EX-*", "240", "1", "61", "1", "0", "303"], ["Autres éléments du CDC", "171", "8", "76", "3", "0", "258"], ["Matrice complète", "411", "9", "137", "4", "0", "561"], ["Règles de gestion des fiches 1 à 23", "494", "1", "33", "0", "0", "528"], ["Composants communs C1 à C25", "22", "2", "1", "0", "0", "25"], ["Écrans du terminal", "11", "0", "4", "0", "0", "15"], ["Écrans du poste fixe", "20", "0", "3", "0", "0", "23"]]}, {"type": "p", "texte": "Sur les 15 mesures de l'avenant 11 suivies : 10 faites, 2 simulées, 2 relevant du moteur seul, 1 à confirmer. 20 des 21 fiches de soin sont faites sur le serveur, le poste fixe et le terminal ; la fiche Nursing reste partielle au serveur (signature d'une aide-soignante hors structure, Q-30)."}, {"type": "h", "texte": "Comment ces chiffres ont évolué"}, {"type": "table", "entetes": ["Périmètre", "15 octobre (ff74608)", "Lots L1 à L16 et L19", "Lot L17", "L18 et Finitions"], "lignes": [["Matrice (fait, partiel, simulé, bloqué, absent)", "333, 8, 188, 4, 0 sur 533", "347, 10, 188, 4, 0 sur 549", "407, 14, 136, 4, 0 sur 561", "411, 9, 137, 4, 0 sur 561"], ["Règles des fiches", "445, 2, 59, 0, 0 sur 506 lignes", "460, 1, 56, 0, 0 sur 517", "494, 1, 32, 1, 0 sur 528", "494, 1, 33, 0, 0 sur 528"], ["Composants C1 à C25", "21, 2, 2", "21, 2, 2", "22, 2, 1", "22, 2, 1"]]}, {"type": "p", "texte": "Le lot L17 a surtout fait passer du Simulé au Fait des éléments dont la part de la plateforme était déjà faite et testée : seul le service tiers, ou la doublure du moteur, restait simulé. Les lots L1 à L16 et L19 ont ajouté 16 éléments et 11 règles."}, {"type": "h", "texte": "Ce qui reste bloqué"}, {"type": "liste", "items": ["Désignation du délégué à la protection des données (DPO), avant production.", "Hébergeur certifié HDS, non contractualisé.", "Autonomie de 10 heures du terminal, à éprouver sur le matériel cible.", "Phasage des livraisons (D-09), tenu par les lots internes."]}, {"type": "h", "texte": "Ce qui reste partiel"}, {"type": "p", "texte": "Dans la matrice : la sécurité, le terminal et le non fonctionnel qui attendent matériel, DPO, hébergeur ou FHIR d'échange, la carte CPS réelle par Pro Santé Connect, l'outil de publication des référentiels (Q-33), deux lignes de journalisation et de préchargement ; côté fiches, la règle Nursing liée à Q-30 ; côté composants, le codage terminologique C16 (validation par TABSANTE) et la charte de couleurs C17 (Q-91)."}, {"type": "code", "langage": "bash", "texte": "python scripts/recompter_matrice.py              # comptes du §1.1\npython scripts/recompter_matrice.py --modules    # par module\npython scripts/recompter_matrice.py --lignes Partiel"}, {"type": "note", "ton": "info", "texte": "Source : « docs/couverture_cdc.md » §1, au commit de main qui fusionne le lot L17."}]}, {"id": "cdc-lire-matrice", "titre": "Comment lire la matrice de couverture", "resume": "Les statuts, la règle de prudence, la part de la plateforme, et où trouver chaque élément.", "mots_cles": ["matrice", "statuts", "légende", "preuve", "part de la plateforme", "lecture"], "blocs": [{"type": "p", "texte": "La matrice « docs/couverture_cdc.md » liste chaque élément du CDC sur une ligne : son identifiant, son texte, son statut dans le CDC (tranché, à préciser, à décider), son statut de réalisation, les clients concernés et la preuve ou le manque."}, {"type": "table", "entetes": ["Statut", "Sens"], "lignes": [["Fait", "Implémenté et couvert par au moins un test automatisé"], ["Partiel", "Une partie existe ; le manque est écrit sur la ligne"], ["Simulé", "Une doublure de démonstration tient la place : à remplacer, jamais à facturer"], ["Bloqué", "Dépend d'un tiers (SESAM-Vitale, moteur NGAP, INSi, PSC, DMP, MSSanté, HDS, matériel, licences, avis de la HAS) ou d'une décision"], ["Absent", "Rien dans le code, rien n'empêche de le construire"]]}, {"type": "h", "texte": "Règle de prudence"}, {"type": "p", "texte": "Une exigence que le serveur tient et teste mais qu'aucun écran ne permet d'utiliser est Partielle : le soignant ne peut pas s'en servir. Un chemin complet qui repose sur un adaptateur simulé est Simulé, pas Fait."}, {"type": "h", "texte": "La part de la plateforme (depuis le lot L17)"}, {"type": "liste", "items": ["Une exigence qui confie la décision au moteur et demande seulement à la fiche de tracer et transmettre des faits est Faite quand cette part est codée et testée, même si la doublure rend la décision. Une exigence qui énonce elle-même la cotation reste Simulée tant que la doublure la tient.", "Un document produit, signé, immuable et versé au registre est Fait quand seul son acheminement (MSSanté, DMP) est simulé.", "Un droit ou une règle de facturation codés et testés par la plateforme sont Faits même si le service qu'ils gardent (FSE, INSi, PSC) est simulé."]}, {"type": "h", "texte": "Se repérer dans le document"}, {"type": "table", "entetes": ["Section", "Contenu"], "lignes": [["§1", "Synthèse, comptes, évolution, par module, et entrées de chaque lot"], ["§2", "Matrice complète (exigences EX-* et autres éléments)"], ["§3", "Fiches de soin : état par client, règles de gestion fiche par fiche"], ["§4 et §5", "Composants communs C1 à C25 ; écrans du terminal et du poste fixe"], ["§6", "Lots de livraison"], ["§7", "Dépendances externes et questions ouvertes au fondateur (§7.1)"], ["§8", "Non-conformités relevées pendant les audits"], ["§9", "Avenant 11 : ce que la plateforme doit tenir"]]}, {"type": "note", "ton": "info", "texte": "Les codes du CDC (EX-…, RG-nn, D-nn) ne s'affichent jamais dans l'application : ils vivent dans la matrice, les commentaires du code et le champ technique « regle » des refus."}]}, {"id": "cdc-decisions-cdc", "titre": "Décisions du CDC (D-01 à D-21)", "resume": "Les vingt décisions laissées ouvertes par le CDC, chacune en une ligne avec ce que le code fait en attendant.", "mots_cles": ["décisions", "D-01", "D-21", "registre", "provisoire"], "blocs": [{"type": "p", "texte": "En attendant chaque décision, le code applique une valeur ou un comportement prudent, remplaçable sans migration de données. Le détail est dans un document séparé."}, {"type": "table", "entetes": ["Décision", "Sujet", "État", "En attendant"], "lignes": [["D-01", "Recalage des fréquences espacées après un passage tardif ou manqué", "Simulé", "Grille d'origine par défaut, réglable par soin"], ["D-02", "Authentification et signature de l'aide-soignante", "Simulé", "Signature par la session, sans carte"], ["D-03", "Licence NANDA-I", "Simulé", "Sous-ensemble de démonstration, licence à acquérir"], ["D-04", "Délai maximal de la saisie différée", "Simulé", "120 minutes"], ["D-05", "File de contrôle : qui arbitre, sous quel délai", "Simulé", "Règles par défaut réglables par cabinet, 7 jours"], ["D-06", "Durées de conservation", "Simulé", "Durées provisoires, à valider par le DPO"], ["D-07", "Composant SESAM-Vitale et son périmètre", "Simulé", "Adaptateur simulé, agent de poste simulé"], ["D-08", "Qui requalifie une transmission", "Simulé", "L'infirmier toujours ; réglage du cabinet qui ne peut que restreindre"], ["D-09", "Phasage des livraisons", "Bloqué", "Les lots internes en tiennent lieu"], ["D-10", "Remplaçant : portée et facturation de ses actes", "Simulé", "Portée bornée ; le remplaçant ne sécurise pas de FSE"], ["D-11", "Passage imprévu sans prescription", "Simulé", "Cotation « à régulariser », non facturable"], ["D-12", "Forme FHIR d'un objet suivi", "Simulé", "Représentation provisoire étiquetée"], ["D-13", "Formats de reprise de dossiers", "Simulé", "Format pivot de démonstration"], ["D-14", "Référentiel de ce que l'infirmier peut prescrire", "Simulé", "Référentiel de démonstration"], ["D-16", "Référentiel des médicaments", "Simulé", "Référentiel de démonstration aux codes fictifs"], ["D-17", "Pansement d'un cathéter neuraxial", "Simulé", "Tracé, non coté ; avis d'une caisse attendu"], ["D-18", "Valorisation en HAD", "Simulé", "Régime HAD transmis, relevé HAD"], ["D-19", "NANDA-I en V2, NOC préparé, NIC non prévu", "Fait", "Tranchée le 5 octobre 2026"], ["D-20", "Condition « déjà pris en charge » de la CIA", "Simulé", "Codée, désactivée en attendant le texte"], ["D-21", "Support de la fiche de suivi RAAC", "Simulé", "Fiche de l'établissement par défaut"]]}, {"type": "note", "ton": "info", "texte": "Il n'existe pas de décision D-15."}]}, {"id": "cdc-questions-ouvertes", "titre": "Questions ouvertes au fondateur", "resume": "Les questions nées du code (Q-nn) encore à trancher, chacune en une ligne.", "mots_cles": ["questions ouvertes", "Q-nn", "fondateur", "TABSANTE", "décisions"], "blocs": [{"type": "p", "texte": "Le code a fait apparaître des déc uverture tant que la décision n'est pas prise."}, {"type": "p", "texte": "Elles viennent du questionnaire du 22/10/2026 (92 questions, tirées de la matrice de couverture §7 et §7.1, du registre D-01 à D-21 du CDC et de l'audit du 16/10) et des six questions ajoutées le même jour au registre §7.1 par les lots L18 et Finitions : Q-99, Q-100, Q-101, Q-105, Q-106 et Q-107."}, {"type": "h", "texte": "Combien de questions"}, {"type": "table", "entetes": ["Thème", "Bloquant", "Important", "Confort", "Total"], "lignes": [["Facturation et cotation", "4", "13", "6", "23"], ["Soins et règles cliniques", "0", "5", "8", "13"], ["Rôles et droits (AS, remplaçant, administrateur)", "0", "3", "8", "11"], ["Tournées, planning et notifications", "0", "4", "10", "14"], ["Dossier patient et identité", "0", "5", "2", "7"], ["Données, sécurité et conformité", "4", "4", "1", "9"], ["Référentiels, licences et partenaires", "1", "6", "2", "9"], ["Interface et charte", "0", "0", "7", "7"], ["Site public et légal", "2", "2", "1", "5"], ["Total", "11", "42", "45", "98"]]}, {"type": "h", "texte": "Les 11 décisions bloquantes"}, {"type": "p", "texte": "Sans elles, pas de mise en production, de facturation réelle ni de mise en ligne du site. Leur détail est dans leur thème."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Thème", "Qui répond"], "lignes": [["AUTRE-01", "Moteur de cotation NGAP de TABSANTE", "Facturation et cotation", "Fondateur"], ["D-07", "Composant SESAM-Vitale et agrément", "Facturation et cotation", "Fondateur"], ["D-10", "Facturation des actes du remplaçant", "Facturation et cotation", "Fondateur"], ["D-16", "Référentiel des médicaments (remboursement)", "Facturation et cotation", "Fondateur"], ["AUTRE-06", "Hébergeur de données de santé (HDS)", "Données, sécurité et conformité", "Fondateur"], ["AUTRE-07", "Délégué à la protection des données (DPO) et analyse d'impact", "Données, sécurité et conformité", "Fondateur"], ["D-06", "Durées de conservation des données", "Données, te tranchée et appliquée (lot L7), mais la matrice laisse NUR-RG-16 Partiel, le serveur laissant encore un AS hors SELAS signer le nursing.", "Q-29 et C18 : la question dit la structure tranchée (un seuil par fiche) et le code tient un seuil global, alors que C18 est classé Fait.", "Q-80 : dite tranchée par la fiche 04, alors que la doublure cote le forfait à la pose et contredit PIV-RG-06 (P1-08 ouvert) ; reste seulement à réécrire ou non la fiche.", "Q-43 et Q-45 rangées « partie de D-06 », qui ne porte que sur les durées : l'usage des horaires, l'information des intervenants, la restitution des accès au domicile et le chiffrement de ces champs n'étaient posés nulle part ; ils sont repris dans Q-44 et D-06.", "Q-42 close comme doublon de Q-53 : elle portait aussi le seuil de retard de 10 min de « Prévenir le patient », une valeur provisoire d'une fonction livrée ; reprise dans AUTRE-05.", "Matrice §7, ligne « Décisions ouvertes » : D-21 n'apparaît dans aucune ligne du §7 (seulement via Q-23) ; D-02, D-03, D-07, D-13, D-14, D-16 et D-20 sont dispersées dans d'autres lignes.", "Valeurs provisoires du code absentes du registre (à confirmer par TABSANTE) : seuil de plaie creusante 0,5 cm, plaie sans progrès après 21 jours, prescription infirmière non honorée après 7 jours, blocs profonds ALR-RG-17, liste des MSD de l'enfant, tranches EX-CI-37 et critères de plaie « à risque », seuil de sur-consommation des stomies STD-O7 et STU-O6 (P0-20). Elles sont regroupées dans AUTRE-02 et AUTRE-03.", "Registre du CDC : D-16 est placée avant D-14, et D-15 manque.", "D-04 : le seuil d'alerte et le délai maximal de saisie différée sont confondus (120 min), alors que le CDC distingue la valeur du délai et l'intervention au poste fixe au-delà.", "Matrice §7.1 (corrigé le 22 octobre 2026) : l'en-tête annonçait 101 questions et la liste « Restent ouvertes » s'arrêtait à Q-101 ; il compte désormais Q-105 à Q-107 (lot Finitions) et dit que Q-102 à Q-104 n'ont jamais été attribués."]}]}, {"id": "qo-facturation", "titre": "Facturation et cotation", "resume": "Moteur NGAP, SESAM-Vitale, remplaçant, accords préalables, indemnités, forfaits et cumuls : ce que TABSANTE doit trancher pour facturer.", "mots_cles": ["AUTRE-01", "BSI", "CIA", "D-05", "D-07", "D-10", "D-11", "D-16", "D-17", "D-18", "D-20", "FSE", "HAD", "IFD", "IK", "NGAP", "Q-01", "Q-03", "Q-04", "Q-08", "Q-13", "Q-140", "Q-15", "Q-27", "Q-63", "Q-72", "Q-73", "Q-74", "Q-78", "Q-80", "Q-86", "SESAM-Vitale", "accord préalable", "contrôle CPAM", "cotation", "forfait", "remplaçant"], "blocs": [{"type": "note", "ton": "info", "texte": "Pour répondre, utilisez le document partagé Questions ouvertes TabSanté : https://claude.ai/artifact/79fqy627vvgMY1vA9VNz5J"}, {"type": "p", "texte": "23 questions, dont 4 bloquantes."}, {"type": "table", "entetes": ["Réf.", "Sujet", "Priorité", "Qui répond", "Appliqué aujourd'hui"], "lignes": [["AUTRE-01", "Moteur de cotation NGAP de TABSANTE", "Bloquant", "Fondateur", "Rien de choisi"], ["D-07", "Composant SESAM-Vitale et agrément", "Bloquant", "Fondateur", "Rien de choisi"], ["D-10", "Facturation des actes du remplaçant", "Bloquant", "Fondateur", "A · Personne pour l'instant : actes tracés, non facturables"], ["D-16", "Référentiel des médicaments (remboursement)", "Bloquant", "Fondateur", "Rien de choisi"], ["D-05", "File de contrôle des cotations à arbitrer", "Important", "Fondateur", "A · Les infirmiers titulaires, de structure ou responsables, sous 7 jours"], ["D-11", "Passage imprévu sans ordonnance", "Important", "Fondateur", "A · 7 jours, puis le passage reste tracé et n'est jamais facturé"], ["Q-01", "Accord préalable : le silence de la caisse vaut-il accord ?", "Important", "Fondateur", "A · Jamais : sans décision reçue, l'accord reste « demandé »"], ["Q-86", "Soin fait en partie", "Important", "Fondateur", "A · Pas de règle automatique : un arbitre décide à chaque fois"], ["D-18", "Soins sous convention HAD", "Important", "Fondateur", "A · Valeur de la nomenclature, sans feuille de soins, sur un relevé à l'HAD"], ["D-17", "Pansement du cathéter péridural ou intrathécal", "Important", "Fondateur", "A · Tracé et transmis, non coté"], ["D-20", "Consultation CIA : patient déjà pris en charge ?", "Important", "Fondateur", "A · Non : condition désactivée"], ["Q-80", "Perfusion de plus d'une heure : forfait à la pose ou à la dépose", "Important", "Fondateur", "A · Oui : forfait coté à la pose, retrait coté à la dépose"], ["Q-08", "Indemnités de déplacement", "Important", "Fondateur", "A · Ne rien coter, transmettre seulement les faits"], ["Q-72", "Injection pendant un passage de nursing sous forfait BSI", "Important", "Fondateur", "A · Oui, à 50 % au seul passage du forfait"], ["Q-04", "Qu'est-ce qu'un passage ?", "Important", "Fondateur", "A · Deux heures"], ["Q-03", "Acte C (surveillance après changement de traitement) : plafond et alerte", "Important", "Fondateur", "A · 15 passages sur 30 jours, alerte à 3 passages du plafond"], ["Q-13", "Bilan de soins infirmiers : circuit du document AmeliPro", "Important", "Fondateur", "A · L'infirmière dépose le PDF d'AmeliPro dans le dossier"], ["Q-73", "Pansement lourd et complexe : critères", "Confort", "IDE référente", "A · Garder les critères actuels"], ["Q-74", "Ablation de fils et pansement de la même plaie", "Confort", "Fondateur", "A · Oui, le pansement courant est compris"], ["Q-15", "Plafonds du cycleur de dialyse péritonéale", "Confort", "Fondateur", "A · Un branchement, un débranchement, deux périodes de 12 heures"], ["Q-63", "BPCO : stade exigé après hospitalisation", "Confort", "Fondateur", "A · Oui, stade II et suivants seulement"], ["Q-27", "Écart entre passages prévus au BSI et passages servis", "Confort", "IDE référente", "A · Sur 14 jours, au moins 7 jours prévus et 33 % d'écart"], ["Q-78", "Traceurs de la feuille de soins", "Confort", "Fondateur", "A · Non transmis"]]}, {"type": "h", "texte": "AUTRE-01 · Moteur de cotation NGAP de TABSANTE"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "Toute la cotation de l'application est aujourd'hui calculée par un moteur de démonstration, qui ne facture rien en réel. Le vrai moteur, sa table de correspondance et ses jeux de tests doivent venir de TABSANTE. Sa forme de livraison décide aussi si la cotation peut se faire sans réseau au domicile sans recopier les règles en double."}, {"type": "p", "texte": "Question : Sous quelle forme et à quelle date TABSANTE livre-t-il le moteur de cotation, sa table et ses jeux de tests ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Bibliothèque intégrée au serveur", "Branchement le plus rapide ; la cotation au domicile sans réseau reste une cotation provisoire, recalculée au retour de connexion."], ["B", "Service séparé appelé par le serveur", "TABSANTE fait évoluer le moteur sans nouvelle version de l'application ; aucune cotation sans réseau."], ["C", "Règles livrées sous forme de données, lues par le serveur et par le terminal", "Même cotation au cabinet et au domicile, sans règle recopiée ; travail de format à convenir avec TABSANTE."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Un moteur de démonstration tient la place du moteur réel derrière une interface unique ; il rejoue 19 des 44 cas du cahier de facturation CNDA au centime, et rien de ce qu'il produit n'est facturable."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §6.7, EX-FA-01, EX-FA-06, matrice de couverture §7 ligne Moteur de cotation, PSE-RG-11 quinquies (Bloqué)"}, {"type": "h", "texte": "D-07 · Composant SESAM-Vitale et agrément"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "Pour créer, sécuriser et télétransmettre des feuilles de soins électroniques, l'application doit intégrer un composant SESAM-Vitale et obtenir son propre agrément CNDA (6 à 12 mois). Le composant tourne sur le poste fixe du cabinet. Un candidat a été étudié, AreaFSE, qui couvre FSE, lots, retours, droits du patient, appli carte Vitale et INSi."}, {"type": "p", "texte": "Question : Quel composant SESAM-Vitale retenez-vous, et qui l'installe chez les cabinets ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "AreaFSE, composant tiers homologué", "Correspondance déjà faite avec l'application ; contrat éditeur à négocier (licence par poste, redistribution, support)."], ["B", "Kit du GIE SESAM-Vitale intégré par TabSanté", "Pas de licence tierce, mais développement et maintenance bien plus lourds avant l'agrément."], ["C", "Un autre composant homologué, comparé sur la même grille", "Étude comparative à mener avant tout développement."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : La chaîne de facturation existe de bout en bout derrière un composant simulé (FSE, lots, retours, cartes de test) et un agent de poste simulé ; aucune feuille de soins réelle ne part."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-14, CDC §6.7, §9, EX-FA-07, EX-FA-10"}, {"type": "h", "texte": "D-10 · Facturation des actes du remplaçant"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "Pendant un remplacement, les soins faits par le remplaçant doivent être facturés. Aujourd'hui, personne ne peut facturer ces actes : ils restent en attente d'une règle du cabinet. La question porte aussi sur ce que le remplaçant voit (ses tournées, ses patients, sa période) et sur le délai pendant lequel son téléphone peut encore remonter des soins saisis hors connexion après la fin du remplacement."}, {"type": "p", "texte": "Question : Qui émet la feuille de soins des actes faits par le remplaçant ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Personne pour l'instant : actes tracés, non facturables (appliqué aujourd'hui)", "Aucun risque d'erreur, mais les actes du remplaçant ne sont jamais payés."], ["B", "Feuille au nom du remplacé, sécurisée avec la carte CPS du remplaçant", "Pratique conventionnelle courante ; le remplaçant reçoit le droit de sécuriser pendant sa période seulement."], ["C", "Le remplaçant émet en son nom propre", "Suppose son propre conventionnement ; le cabinet ne voit plus ces feuilles dans ses lots."], ["D", "Le remplacé sécurise lui-même les feuilles au retour", "Pas de droit de facturation au remplaçant ; facturation décalée jusqu'au retour du titulaire."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : La feuille ne peut être créée et sécurisée que par l'infirmier qui a fait les actes, et le remplaçant n'a pas le droit de sécuriser : ses actes attendent la règle du cabinet. Il ne voit que ses tournées, ses patients et sa période ; après la fin, son terminal peut encore envoyer pendant 120 minutes, puis sa session est fermée."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-02, Q-36, CDC §3, §6.5, EX-FA-08, HAB-23"}, {"type": "h", "texte": "D-16 · Référentiel des médicaments (remboursement)"}, {"type": "note", "ton": "attention", "texte": "Question bloquante : la mise en service en dépend."}, {"type": "p", "texte": "L'administration des médicaments (acte A de l'article 10) n'est facturable que si au moins un médicament administré est remboursable. L'application doit donc connaître le statut de remboursement de chaque ligne, par son code CIP, y compris sans réseau. La liste actuelle est fictive et ne doit servir ni à soigner ni à facturer."}, {"type": "p", "texte": "Question : Quelle base de médicaments l'application doit-elle utiliser, et qui la met à jour ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Base de données publique des médicaments, mise à jour par TABSANTE", "Gratuite ; TABSANTE organise l'import régulier et le contrôle du statut de remboursement."], ["B", "Base commerciale agréée (fournisseur de base médicamenteuse)", "Mises à jour et interactions fournies, mais abonnement et contrat."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Rien de choisi : Une courte liste de démonstration aux codes fictifs est branchée aux fiches Médicaments, AVK et Anticoagulants injectables."}, {"type": "p", "texte": "Priorité : Bloquant · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §6.3 fiche 6, EX-MED-14"}, {"type": "h", "texte": "D-05 · File de contrôle des cotations à arbitrer"}, {"type": "p", "texte": "Certaines cotations ne partent pas directement en facturation : cumul de plusieurs actes, majoration à justifier, soins au-delà de la fréquence prescrite, acte fait en partie… Elles attendent qu'une infirmière les valide ou les écarte. Il faut dire qui arbitre, dans quel délai, et ce que devient la feuille de soins en attendant."}, {"type": "p", "texte": "Question : Qui arbitre les cotations signalées, et dans quel délai ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Les infirmiers titulaires, de structure ou responsables, sous 7 jours (appliqué aujourd'hui)", "Plusieurs personnes peuvent arbitrer ; la cotation reste hors lot tant qu'elle n'est pas arbitrée, l'échéance s'affiche au tableau de bord."], ["B", "La seule infirmière responsable du cabinet", "Un seul arbitre, plus homogène ; risque d'embouteillage en son absence."], ["C", "L'infirmier qui a réalisé l'acte", "Arbitrage rapide, mais sans regard extérieur."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Règles par défaut réglables par le cabinet : cumul, majoration et dépassement de fréquence signalés, passages non programmés et saisies tardives non signalés ; arbitres IDE titulaire, de structure ou responsable ; délai 7 jours."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §4.5, §6.7, EX-FA-09"}, {"type": "h", "texte": "D-11 · Passage imprévu sans ordonnance"}, {"type": "p", "texte": "Une infirmière peut devoir faire un soin non prévu, sans ordonnance, par exemple à la demande du patient. Le soin est tracé et signé, mais il ne peut pas être facturé tant qu'une ordonnance ne lui est pas rattachée. Il faut fixer le délai pour régulariser et ce que devient un passage jamais régularisé."}, {"type": "p", "texte": "Question : Quel délai laissez-vous pour rattacher une ordonnance, et que devient le passage au-delà ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "7 jours, puis le passage reste tracé et n'est jamais facturé (appliqué aujourd'hui)", "Prudent ; le cabinet doit relancer vite le médecin."], ["B", "15 jours, puis jamais facturé", "Plus de temps pour obtenir l'ordonnance ; facturation plus tardive."], ["C", "30 jours, puis jamais facturé", "Laisse le temps aux médecins lents ; trésorerie retardée d'autant."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Passage tracé et signé, cotation « à régulariser » jamais facturable avant le rattachement d'une ordonnance au poste fixe ; délai réglable 2, 7, 15 ou 30 jours, 7 par défaut."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-11, CDC §6.4, §6.7, registre des simulations"}, {"type": "h", "texte": "Q-01 · Accord préalable : le silence de la caisse vaut-il accord ?"}, {"type": "p", "texte": "Certains actes exigent un accord préalable de la caisse : l'administration des médicaments au-delà du premier mois, l'injection par cathéter péridural ou intrathécal. Quand la caisse ne répond pas, l'application considère aujourd'hui que l'accord n'est pas obtenu, quel que soit le délai : l'injection reste non facturable. Le droit de la sécurité sociale prévoit souvent qu'un silence de 15 jours vaut accord."}, {"type": "p", "texte": "Question : L'absence de réponse de la caisse vaut-elle accord, et après quel délai ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Jamais : sans décision reçue, l'accord reste « demandé » (appliqué aujourd'hui)", "Aucun risque d'indu, mais des actes faits sans jamais être facturés."], ["B", "Oui, après 15 jours comptés depuis l'envoi", "L'acte devient facturable ; statut « accordé implicitement », distinct d'une décision reçue."], ["C", "Oui, après 15 jours comptés depuis la réception par la caisse", "Plus sûr juridiquement, mais il faut connaître et saisir la date de réception."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Aucune acceptation implicite, au poste fixe comme au terminal : sans décision enregistrée, l'accord reste « demandé » et l'injection neuraxiale est retenue."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-MED-16, MED-RG-14, EX-ALR-08, ALR-RG-31"}, {"type": "h", "texte": "Q-86 · Soin fait en partie"}, {"type": "p", "texte": "Un soin peut être interrompu : refus du patient, état du patient, matériel manquant. Le cahier des charges ne dit pas comment le coter ni s'il faut le refaire. L'application le trace avec un motif et envoie toujours sa cotation en contrôle, où une infirmière décide."}, {"type": "p", "texte": "Question : Comment coter un soin fait en partie ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Pas de règle automatique : un arbitre décide à chaque fois (appliqué aujourd'hui)", "Sûr, mais du travail de contrôle à chaque cas."], ["B", "Coter l'acte entier", "Pas de contrôle, au risque d'un indu si la caisse conteste."], ["C", "Ne rien coter", "Aucun risque d'indu, perte de recette sur les soins commencés."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Le passage se signe avec « Soin fait en partie », un motif (refus, état du patient, matériel manquant, soin interrompu, autre) et ce qui n'a pas été fait ; la cotation va toujours en file de contrôle, et le passage compte comme servi (il n'est pas à refaire)."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : CDC §6.6, EX-FA-05, D-05"}, {"type": "h", "texte": "D-18 · Soins sous convention HAD"}, {"type": "p", "texte": "Quand un patient est hospitalisé à domicile (HAD), le cabinet est payé par l'établissement d'HAD selon une convention, pas par l'Assurance maladie. Il faut savoir comment ces soins sont valorisés : actes de la nomenclature, forfait, majorations, déplacements, et comment régulariser les feuilles déjà envoyées avant que le séjour soit connu."}, {"type": "p", "texte": "Question : Comment les soins faits sous convention HAD sont-ils valorisés ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Valeur de la nomenclature, sans feuille de soins, sur un relevé à l'HAD (appliqué aujourd'hui)", "Simple, conforme à la convention type ; les dérogations d'un séjour se gèrent à la main."], ["B", "Forfait par séjour fixé dans la convention", "Il faut saisir le forfait et les actes exclus pour chaque convention."], ["C", "Règles réglées séjour par séjour (forfait, actes exclus, majorations, déplacements)", "Le plus fidèle aux conventions, mais plus de saisie à l'ouverture du séjour."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Les actes sont valorisés selon la nomenclature et marqués « convention HAD » pour le relevé ; aucune feuille de soins n'est créée ; les feuilles envoyées avant la déclaration du séjour sont signalées pour régularisation."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-75, C23, PCA-RG-13, UGD-RG-17"}, {"type": "h", "texte": "D-17 · Pansement du cathéter péridural ou intrathécal"}, {"type": "p", "texte": "Le pansement d'un cathéter neuraxial extériorisé n'a pas de cotation claire : il pourrait relever de la séance d'entretien de cathéter extériorisé, et sa combinaison avec l'injection du même jour pose question. Le cahier des charges attend l'avis écrit d'une caisse."}, {"type": "p", "texte": "Question : Comment ce pansement est-il coté ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Tracé et transmis, non coté (appliqué aujourd'hui)", "Aucun risque d'indu ; le pansement n'est pas payé."], ["B", "Coté en séance d'entretien de cathéter extériorisé", "Payé, mais à confirmer par écrit avec la caisse ; cumul avec l'injection selon l'article 11 B."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Le pansement est tracé et transmis comme un fait, sans cotation ; l'option B est réglable dans les simulations."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : Q-12, EX-ALR-10, ALR-RG-22, ALR-RG-36, registre des simulations"}, {"type": "h", "texte": "D-20 · Consultation CIA : patient déjà pris en charge ?"}, {"type": "p", "texte": "L'avenant 11 crée une consultation infirmière (CIA). Des commentateurs disent qu'elle serait réservée aux patients déjà suivis pour des soins prescrits, mais le texte intégral ne l'a pas encore confirmé. Cette condition est prête dans l'application mais désactivée."}, {"type": "p", "texte": "Question : La consultation CIA est-elle réservée aux patients déjà pris en charge pour des soins prescrits ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Non : condition désactivée (appliqué aujourd'hui)", "La CIA est proposée à tout patient éligible ; risque d'indu si la condition est confirmée."], ["B", "Oui : condition activée", "La CIA n'est proposée qu'aux patients ayant des soins prescrits en cours."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : La condition existe mais est désactivée dans le référentiel ; exclusion sous forfait, jour de départ et date d'effet de la CIA sont en place."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : EX-CI-10, EX-CI-02"}, {"type": "h", "texte": "Q-80 · Perfusion de plus d'une heure : forfait à la pose ou à la dépose"}, {"type": "p", "texte": "La fiche Perfusions du cahier des charges dit qu'une ligne posée et pas encore retirée n'est pas cotable. Le texte de la nomenclature, lui, cote le forfait de perfusion longue dès la séance de pose. Le moteur de démonstration suit la nomenclature et contredit donc la fiche."}, {"type": "p", "texte": "Question : Faut-il réécrire la fiche Perfusions pour coter le forfait dès la pose ?"}, {"type": "table", "entetes": ["Option", "Choix", "Conséquence"], "lignes": [["A", "Oui : forfait coté à la pose, retrait coté à la dépose (appliqué aujourd'hui)", "Conforme à la nomenclature ; la fiche est mise à jour."], ["B", "Non : rien n'est coté tant que la ligne n'est pas retirée", "Conforme à la fiche actuelle ; le moteur doit être corrigé et le paiement arrive plus tard."]]}, {"type": "p", "texte": "Appliqué aujourd'hui : Le moteur de démonstration cote le forfait long à la pose, le retrait à la dépose, le forfait court à la dépose et un supplément par heure au-delà de la première ; écart ouvert avec la fiche."}, {"type": "p", "texte": "Priorité : Important · Qui répond : Fondateur"}, {"type": "p", "texte": "Références : PIV-RG-05, PIV-RG-06, PSC-RG-03, fiche 04 §6, audit du 16/10 P1-08"}, {"type": "h", "texte": "Q-08 · Indemnités de déplacement"}, {"type": "p", "texte": "Les indemnités forfaitaires de déplacement et kilométriques dépendent de la prescription du déplacement, du lieu réel du soin, de la distance et des zones (plaine, montagne, agglomération). Par défaut, l'application transmet les faits mais ne cote aucune indemnité. Il faut aussi décider ce que vaut une ordonnance qui ne dit pas « soins à domicile » et comment facturer un déplacement non prescrit."}, {"type": "p", "texte": "Question : Comment l'applicat
